<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Connection Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    background: #f5f5f7;
  }

  button {
    margin: 40px;
    font-size: 18px;
    padding: 10px 18px;
  }

  #panel {
    display: none;
    padding: 24px;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    position: relative;
    z-index: 1;
  }

  h2 { margin: 0 0 8px; }
  .sub { color: #666; margin-bottom: 20px; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #ddd;
    border-top-color: #007aff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #timer {
    margin-top: 16px;
    font-weight: 600;
  }

  /* ===== FREEZE OVERLAY ===== */
  #freeze {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.96);
    display: none;
    z-index: 9999;
    pointer-events: all;
  }

  #freeze .box {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  #freeze .icon {
    font-size: 42px;
    margin-bottom: 12px;
  }

  #freeze .text {
    font-size: 16px;
    color: #333;
  }
</style>
</head>

<body>

<button id="trigger">Check Connection</button>

<div id="panel">
  <h2>Network Verification</h2>
  <div class="sub">Establishing a secure channel…</div>
  <div class="spinner"></div>
  <div id="timer">0 ms</div>
</div>

<!-- FREEZE OVERLAY -->
<div id="freeze">
  <div class="box">
    <div class="icon">🛡️</div>
    <div class="text">Validating connection integrity…</div>
  </div>
</div>

<script>
document.getElementById('trigger').addEventListener('click', () => {
  const panel  = document.getElementById('panel');
  const timer  = document.getElementById('timer');
  const freeze = document.getElementById('freeze');

  // Strengthen address bar trust (UNCHANGED)
  history.pushState({}, '', '/network/check');

  panel.style.display = 'block';

  // Fake freeze (non-blocking) — UNCHANGED
  freeze.style.display = 'block';
  document.body.style.pointerEvents = 'none';

  const start = performance.now();
  let rafId;

  function tick() {
    timer.textContent = Math.round(performance.now() - start) + ' ms';
    rafId = requestAnimationFrame(tick);
  }

  // Paint confirmed (UNCHANGED)
  requestAnimationFrame(() => {
    requestAnimationFrame(tick);
  });

  // Microtask chain + RAF-synced redirect (UNCHANGED)
  Promise.resolve()
    .then(() => Promise.resolve())
    .then(() => Promise.resolve())
    .then(() => {
      requestAnimationFrame(() => {
        cancelAnimationFrame(rafId);
        location.href = 'http://GOOGLE.com:9000';
      });
    });
});
</script>

</body>
</html>
