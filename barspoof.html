<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MSRC PoC Demo</title>
</head>
<body>

<h1>MSRC PoC Demo</h1>
<button id="trigger">Trigger</button>

<div id="demo" style="display:none;">
  <h2>Demo</h2>
</div>

<script>
document.getElementById('trigger').onclick = () => {

  // tampilkan konten demo (user gesture)
  document.getElementById('demo').style.display = 'block';

  // delay sebelum redirect
  setTimeout(() => {
    // top-level navigation
    window.location.href = 'https://google.com:9090';
  }, 1000); // 1 detik
};
</script>

</body>
</html>
