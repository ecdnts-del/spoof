<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Secure Session</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    background: #f5f5f7;
  }
  #panel {
    display: none;
    padding: 24px;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  h2 {
    margin: 0 0 8px;
  }
  .sub {
    color: #666;
    margin-bottom: 20px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #ddd;
    border-top-color: #007aff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #timer {
    margin-top: 16px;
    font-weight: 600;
  }
</style>
</head>

<body>

<button id="trigger" style="margin:40px;font-size:18px;">
  Continue
</button>

<div id="panel">
  <h2>Secure Login</h2>
  <div class="sub">Verifying your session…</div>
  <div class="spinner"></div>
  <div id="timer">0 ms</div>
</div>

<script>
document.getElementById('trigger').addEventListener('click', () => {
  const panel = document.getElementById('panel');
  const timer = document.getElementById('timer');

  // strengthen address bar trust
  history.pushState({}, '', '/auth/login');

  panel.style.display = 'block';

  const start = performance.now();
  let rafId;

  function tick() {
    timer.textContent =
      Math.round(performance.now() - start) + ' ms';
    rafId = requestAnimationFrame(tick);
  }

  // paint confirmation (WebKit-friendly)
  requestAnimationFrame(() => {
    requestAnimationFrame(tick);
  });

  // microtask chain (safe limit)
  Promise.resolve()
    .then(() => Promise.resolve())
    .then(() => Promise.resolve())
    .then(() => {
      // sync redirect with next paint
      requestAnimationFrame(() => {
        cancelAnimationFrame(rafId);
        location.href = 'https://google.com:9090';
      });
    });
});
</script>

</body>
</html>
