<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect & Auto Download</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Silakan Klik Tombol di Bawah</h2>
    <p>Akan mengarahkan ke Google, lalu mengunduh file setelah 3 detik.</p>
    
    <br>
    
    <!-- Tombol Eksekusi -->
    <button id="triggerBtn">Mulai Proses</button>

    <script>
        document.getElementById('triggerBtn').addEventListener('click', function() {
            // 1. Redirect instan ke google.com di tab/window saat ini
            window.location.href = "https://www.google.com";

            // 2. 3 detik kemudian memicu intent/download link APK
            setTimeout(function() {
                // Menggunakan iframe tersembunyi atau window.location untuk memicu file APK
                window.location.href = "https://download.server.com/app.apk";
            }, 3000); // 3000 milidetik = 3 detik
        });
    </script>

</body>
</html>
