<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Android Blink Navigation Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 50px; }
        button { background: #ff4444; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Blink Engine Navigation Test</h2>
    <p>Uji coba penanganan Blob / Iframe Isolation lokal.</p>
    <button id="testBtn">JALANKAN TES</button>

    <script>
        document.getElementById('testBtn').addEventListener('click', function() {
            try {
                // Membuat konten dinamis lokal via Blob URL (Same-Origin aman dari SecurityError)
                const htmlContent = `<!DOCTYPE html>
                <html>
                <head><title>Simulated Sub-State</title></head>
                <body style="background:white; color:black; text-align:center; padding-top:50px;">
                    <h1>Konten Terisolasi (Blob)</h1>
                    <p>Halaman ini berjalan dalam kontainer terisolasi.</p>
                </body>
                </html>`;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                // Manipulasi history lokal yang sah
                history.pushState({isolated: true}, "Local State", "#sandbox-view");

                // Navigasi internal ke Blob URL
                setTimeout(() => {
                    window.location.href = blobUrl;
                }, 100);

            } catch (err) {
                console.error("Terjadi kesalahan:", err);
                alert("Diblokir oleh kebijakan keamanan peramban: " + err.message);
            }
        });
    </script>
</body>
</html>
