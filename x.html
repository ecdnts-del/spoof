<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Navigation Sequence Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            margin: 0 auto;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:active {
            background-color: #2563eb;
        }
        .log {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Urutan Navigasi Lab</h2>
        <p>1. Injeksi about:blank -> 2. Tulis "Hallo" -> 3. Navigasi ke example.com</p>
        <button id="trigger">JALANKAN URUTAN</button>
        <div id="log" class="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        document.getElementById('trigger').addEventListener('click', function() {
            const logEl = document.getElementById('log');
            logEl.innerText = "Status: Membuka about:blank...";

            // Membuka jendela baru dengan about:blank
            let win = window.open('about:blank', '_blank');

            if (!win) {
                logEl.innerText = "Status Gagal: Pop-up diblokir peramban.";
                return;
            }

            try {
                // Tahap 1 & 2: Menulis dokumen lokal "Hallo" ke dalam konteks kosong
                win.document.open();
                win.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>Local Injection</title></head>
                    <body style="background:white; color:black; text-align:center; padding-top:60px; font-family:sans-serif;">
                        <h1>Hallo</h1>
                        <p>Konteks awal sebelum navigasi dialihkan.</p>
                    </body>
                    </html>
                `);
                win.document.close();
                logEl.innerText = "Status: Berhasil menulis 'Hallo'. Menyiapkan navigasi...";

                // Tahap 3: Paksa tarik / alihkan ke example.com setelah jeda singkat
                setTimeout(() => {
                    logEl.innerText = "Status: Mengalihkan ke example.com...";
                    win.location.replace("https://example.com");
                }, 400);

            } catch (err) {
                logEl.innerText = "Error: " + err.message;
            }
        });
    </script>

</body>
</html>
