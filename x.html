<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC - Address Bar Spoofing Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 18px;
            color: #f87171;
            margin-top: 0;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .note {
            margin-top: 15px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zero-Click Spoof Simulation</h1>
        <p>Klik tombol di bawah untuk membuka jendela/tab baru yang memuat target simulasi penekanan navigasi tersembunyi.</p>
        
        <!-- Tombol interaktif untuk membuka target di jendela baru -->
        <button class="btn" onclick="openSpoofWindow()">Open in New Window</button>

        <div class="note">Target URL: https://ecdnts-del.github.io/spoof/f.html</div>
    </div>

    <script>
        function openSpoofWindow() {
            // Membuka URL target di jendela baru (new window/tab)
            // Di lingkungan riset, teknik ini sering digabungkan dengan manipulasi pop-up / window reference.
            const targetUrl = "https://ecdnts-del.github.io/spoof/f.html";
            
            // Membuka window baru
            const newWindow = window.open(targetUrl, '_blank');
            
            if (!newWindow) {
                alert("Pop-up diblokir oleh browser! Izinkan pop-up untuk melanjutkan uji coba.");
            }
        }
    </script>

</body>
</html>
