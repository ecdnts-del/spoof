<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Intent - Add to Home Screen PoC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }

    a {
      display: inline-block;
      padding: 16px 28px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    a:active {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <h2>Android Intent Test</h2>
  <a href="https://www.google.com" id="intentLink">
    Trigger Add to Home Screen & Open Google
  </a>

  <script>
    const TARGET_URL = "https://www.google.com";
    const INTENT_URL = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";

    let isTriggered = false;

    document.getElementById("intentLink").addEventListener("click", function(e) {
      // Mencegah navigasi default agar script memiliki kontrol penuh atas timing
      e.preventDefault();

      if (isTriggered) return;
      isTriggered = true;

      // 1. Eksekusi intent ke dalam iframe tersembunyi terlebih dahulu
      // Ini memicu Google App / Quick Search Box memunculkan dialog add to home screen
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = INTENT_URL;
      document.body.appendChild(iframe);

      // 2. Berikan jeda waktu (timing) yang ideal (misal: 600ms) 
      // Agar dialog sistem sempat muncul di atas layar sebelum browser memuat google.com
      setTimeout(() => {
        // Hapus iframe untuk membersihkan DOM
        if (iframe && iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }

        // 3. Lakukan redirect otomatis ke google.com
        window.location.href = TARGET_URL;
      }, 600);

      // Reset status jika diperlukan setelah beberapa detik
      setTimeout(() => {
        isTriggered = false;
      }, 2000);
    });
  </script>

</body>
</html>
