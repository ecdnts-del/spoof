<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Chromium Direct-Target SOP Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .wrapper {
            background: #1e293b;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .btn-trigger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-trigger:active {
            background-color: #dc2626;
        }
        .logger {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #f87171;
            text-align: left;
            height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>Direct Target SOP Lab</h2>
        <p>Uji coba pembukaan langsung ke example.com & uji injeksi silang.</p>
        <button id="launchBtn" class="btn-trigger">UJI TARGET LANGSUNG</button>
        <div id="logBox" class="logger">[System] Menunggu interaksi pengguna...</div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');

        function addLog(message, isError = false) {
            const timeStr = new Date().toLocaleTimeString();
            const color = isError ? "#f87171" : "#4ade80";
            logBox.innerHTML += `<span style="color: ${color}">[${timeStr}] ${message}</span><br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('launchBtn').addEventListener('click', function() {
            addLog("Membuka jendela langsung ke https://example.com...");

            // Membuka jendela baru langsung ke domain target eksternal
            let targetWin = window.open('https://example.com', '_blank');

            if (!targetWin) {
                addLog("ERROR: Pop-up diblokir oleh peramban.", true);
                return;
            }

            addLog("Jendela eksternal terbuka. Mencoba akses DOM lintas-asal...");

            // Percobaan memaksa document.write("halo") ke domain eksternal secara langsung
            setTimeout(() => {
                try {
                    // Ini akan memicu Cross-Origin SecurityError secara instan
                    targetWin.document.open();
                    targetWin.document.write("halo");
                    targetWin.document.close();
                    addLog("SUKSES? (Seharusnya tidak tercapai karena SOP).");
                } catch (err) {
                    addLog("BLOCKED BY SOP: " + err.name + " -> " + err.message, true);
                    addLog("Analisis: Peramban melindungi dokumen eksternal dari manipulasi skrip luar.", false);
                }
            }, 500);
        });
    </script>

</body>
</html>
