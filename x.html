<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Android Chromium Advanced Lab Framework</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            margin: 0 auto;
            border: 1px solid #1f2937;
        }
        h2 {
            font-size: 1.15rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }
        button:active {
            background-color: #1d4ed8;
        }
        button.secondary {
            background-color: #374151;
        }
        button.secondary:active {
            background-color: #4b5563;
        }
        .console-log {
            background: #030712;
            border: 1px: #374151;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #34d399;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Advanced Engine Stress Lab</h2>
        <p>Simulasi kontensi Main Thread & Navigasi Asinkron Lokal.</p>
        
        <div class="btn-group">
            <button id="startTest">JALANKAN STRESS</button>
            <button id="resetTest" class="secondary">RESET</button>
        </div>

        <div id="consoleLog" class="console-log">[System] Siap menginisialisasi kerangka uji...</div>
    </div>

    <!-- Target Iframe Lokal untuk Isolasi Pengujian -->
    <iframe id="testFrame" style="display:none;" src="about:blank"></iframe>

    <script>
        const logEl = document.getElementById('consoleLog');

        function logMessage(msg) {
            const timestamp = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${timestamp}] ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('startTest').addEventListener('click', function() {
            logMessage("Memulai urutan pengujian siklus asinkron...");

            try {
                // 1. Manipulasi History API Cepat
                history.pushState({ testId: 1 }, "State A", "#lab-stage-1");
                logMessage("History state [1] disuntikkan.");

                // 2. Persiapan Blob Konten Lokal
                const mockContent = `<!DOCTYPE html><html><body style="background:#fff;color:#000;text-align:center;padding-top:40px;"><h3>Sub-Konteks Aktif</h3></body></html>`;
                const blob = new Blob([mockContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                // 3. Pemicuan Navigasi Berkelanjutan dengan Jeda Mikro
                setTimeout(() => {
                    logMessage("Memicu penggantian lokasi ke Blob URL...");
                    window.location.replace(blobUrl);
                }, 200);

            } catch (err) {
                logMessage("Error terdeteksi: " + err.message);
            }
        });

        document.getElementById('resetTest').addEventListener('click', function() {
            window.location.reload();
        });
    </script>

</body>
</html>
