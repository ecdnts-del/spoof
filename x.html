<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Intent PoC - Enhanced</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }

    a {
      display: inline-block;
      padding: 16px 28px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    a:active {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <h2>Android Intent Test</h2>
  <a href="https://www.google.com" id="intentLink">
    Open Window & Android Intent Test
  </a>

  <script>
    const TARGET_URL = "https://www.google.com";
    const INTENT_URL = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";

    let isTriggered = false;

    document.getElementById("intentLink").addEventListener("click", function(e) {
      // Mencegah navigasi default sejenak agar eksekusi script berjalan sempurna
      e.preventDefault();

      if (isTriggered) return;
      isTriggered = true;

      // 1. Eksekusi intent Android terlebih dahulu
      window.location.href = INTENT_URL;

      // 2. Timing terstruktur untuk memastikan fallback/redirect otomatis ke Google Utama berjalan lancar
      setTimeout(() => {
        window.location.replace(TARGET_URL);
      }, 400);

      // Reset status setelah beberapa saat jika diperlukan
      setTimeout(() => {
        isTriggered = false;
      }, 1500);
    });

    // Otomatis picu juga ketika halaman selesai dimuat jika diperlukan intervensi instan (opsional)
    window.addEventListener('DOMContentLoaded', () => {
      // Anda bisa menambahkan auto-trigger di sini jika ingin langsung berjalan saat halaman dibuka
    });
  </script>

</body>
</html>
