
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chrome iOS mailto PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 550px;
            margin: auto;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #af52de;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }
        #log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Chrome iOS mailto PoC</h2>
    <p>Test mailto: prompt followed by Google navigation.</p>

    <button onclick="runMailtoTest()">
        Test mailto: + Google Redirect
    </button>

    <h3>Activity Log</h3>
    <div id="log">Waiting for test...</div>
</div>

<script>
function log(message) {
    const logBox = document.getElementById('log');
    logBox.textContent +=
        '\n[' + new Date().toLocaleTimeString() + '] ' + message;
}

function runMailtoTest() {
    document.getElementById('log').textContent = '';

    log('Starting mailto test...');

    setTimeout(function() {
        log('Triggering mailto URL...');
        window.location.href =
            'mailto:secure@apple.com?subject=Test';
    }, 500);

    setTimeout(function() {
        log('Navigating to Google...');
        window.location.href =
            'https://www.google.com';
    }, 900);
}
</script>

</body>
</html>
