
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Picker UI Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
  text-align: center;
  padding: 40px 16px;
}
button {
  padding: 14px 22px;
  background: #555;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>
<body>

<h2>File Picker UI Test</h2>
<p>Browser interface behavior testing.</p>

<button id="open">Open Test Window</button>

<p id="status">Waiting for interaction.</p>

<script>
document.getElementById("open").addEventListener(
  "click",
  async () => {
    try {
      await window.showOpenFilePicker({
        multiple: false
      });
      document.getElementById("status").textContent =
        "File selection completed.";
    } catch (e) {
      document.getElementById("status").textContent =
        "Picker closed or cancelled.";
    }
  }
);
</script>

</body>
</html>
