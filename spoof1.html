<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Actions PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }
        a.spoof-btn {
            display: block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            box-sizing: border-box;
        }
        a.spoof-btn:active {
            background-color: #1557b0;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Verification System</h1>

    <!-- Two Buttons for Mailto and Tel -->
    <div class="button-container">
        <!-- Mailto Button (Opens email client & new window) -->
        <a href="mailto:security@google.com?subject=Verification&body=Please%20verify%20my%20account" target="_blank" class="spoof-btn">
            Open Mail & New Window
        </a>

        <!-- Tel Button (Opens phone dialer & new window) -->
        <a href="tel:+18005550199" target="_blank" class="spoof-btn">
            Open Phone & New Window
        </a>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

</body>
</html>
