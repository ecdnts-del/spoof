<script>
function y() {
  // trigger top-level navigation
  x = open('https://example.com', '_top');

  // trigger dialog via img onerror around navigation timing
  x.document.body.innerHTML =
    '<img src="" onerror="setTimeout(function() {' +
    'prompt(' +
      '\'JS PROMPT TIMING TEST\\n\\nDialog triggered during top-level navigation.\',' +
      '\'\' ' +
    ');' +
    '}, 150)">';
}

// delayed execution
setTimeout(y, 3000);
</script>
