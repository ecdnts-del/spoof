<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Bar Spoofing</title>
</head>
<body>
    <button onclick="spoof()">Go</button>

    <script>
        function spoof() {
            // Base64 encoded HTML content (contoh HTML untuk di-decode)
            var gmailBase64 = 'PGh0bWw+PGh1bj5HcmVldGluZyB0aGVtZSBwYWdlPC9odG1sPg=='; // Contoh base64 encode untuk <html><h1>Greeting theme page</h1></html>
            
            // Men-decoding base64 dan memasukkan hasilnya ke dalam halaman
            var decodedContent = atob(gmailBase64);

            // Memasukkan konten yang didecode ke dalam halaman
            document.body.innerHTML = decodedContent;

            // Mengubah judul halaman agar lebih menyerupai Gmail
            document.title = "Gmail - Login";

            // Memberikan waktu untuk menampilkan konten sebelum pengalihan
            setTimeout(function() {
                window.location.assign("https://google.com");  // Mengarahkan ke Gmail
            }, 3000); // Delay 3 detik untuk memastikan tampilan muncul
        }

        // Menjalankan spoof setiap 100 detik (100000 ms)
        setInterval(spoof, 100000);
    </script>
</body>
</html>
