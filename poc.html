<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PiP Close on Share</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px; }
    video { width: 300px; border-radius: 12px; background: #000; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>PiP Close When Share</h2>

  <video id="video" autoplay playsinline muted></video>
  <br>
  <button id="pipBtn">Enter PiP</button>
  <button id="shareBtn">Share (Close PiP)</button>

  <script>
    const video = document.getElementById("video");

    // Start Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    // Enter PiP
    document.getElementById("pipBtn").onclick = async () => {
      try {
        if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert("PiP error: " + err.message);
      }
    };

    // Share + Close PiP
    document.getElementById("shareBtn").onclick = async () => {
      try {
        // Tutup PiP dulu kalau aktif
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        }

        if (navigator.share) {
          await navigator.share({
            title: "Test Share",
            text: "Testing Web Share API",
            url: location.href
          });
        } else {
          alert("Web Share API not supported");
        }

      } catch (err) {
        console.log("Share cancelled or error:", err);
      }
    };

    startCamera();
  </script>

</body>
</html>
