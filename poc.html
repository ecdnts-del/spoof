<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delayed File Save Simulation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background-color: #fafafa;
      cursor: pointer;
      user-select: none;
    }
    h1 {
      color: #333;
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Click anywhere to simulate file save.<br>Test on iPhone/iOS</h1>

  <script>
    document.addEventListener('click', async () => {
      setTimeout(() => {
        const fileName = "malicious.php";
        const content = "This is a test file content.";
        
        // Create a Blob to simulate the file content
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        
        // Create an anchor tag to trigger the file download
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        
        // Append anchor to the body and trigger the download
        document.body.appendChild(a);
        a.click();
        
        // Clean up
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 3000);
    }, { once: true });
  </script>
</body>
</html>
