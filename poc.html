<script>
function y() {
  // trigger top-level navigation
  open('https://example.com', '_top');

  // inject an image error handler to trigger the dialog
  setTimeout(function () {
    document.body.innerHTML =
      '<img src="" onerror="prompt(\'JS PROMPT TIMING TEST\\n\\nDialog shown during top-level navigation.\', \'\')">';
  }, 150);
}

// delay execution to simulate async trigger
setTimeout(y, 3000);
</script>
