<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Google</title>
</head>
<body>
    <button onclick="go()">GO!</button>

    <script>
        function go(){
            // Mengganti window.open dengan window.location untuk menghindari pop-up block
            window.location.href = 'https://www.google.com/csi'; // Ganti dengan URL yang kamu tuju

            // Setelah 3 detik, mengganti konten halaman baru (berbeda dengan window.open)
            setTimeout(function() {
                document.body.innerHTML = `
                    <h1 style="text-align: center; font-size: 3em; color: #4285F4;">Fake Google</h1>
                    <h2 style="text-align: center;">Please login</h2>
                    <br><br>
                    Email: <input id="email"><br><br>
                    Pass: <input id="pass" type="password"><br><br>
                    <button onclick="alert('Email: ' + document.getElementById('email').value + '\\nPass: ' + document.getElementById('pass').value)">Login</button>
                `;
            }, 3000); // Menunggu 3 detik sebelum mengganti konten
        }
    </script>
</body>
</html>
