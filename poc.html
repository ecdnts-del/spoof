<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Overlay</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #202124;
    color: white;
    text-align: center;
}

.content {
    padding: 80px 20px;
}

button {
    padding: 14px 25px;
    font-size: 17px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

.open-btn {
    background: #4285f4;
    color: white;
}

.close-btn {
    background: #5f6368;
    color: white;
}

/* Full viewport overlay */
.fake-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #202124;
    z-index: 999999;
    display: none;
    overflow: hidden;
}

.fake-overlay.show {
    display: block;
}

/* Background image */
.overlay-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Image shade */
.image-dark {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
}

/* Controls */
.overlay-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
}

.overlay-controls button {
    background: #34383b;
    color: white;
    border: 1px solid #777;
}

/* Bottom label */
.fake-tab {
    position: absolute;
    bottom: 0;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 22px;
    background: #34383b;
    color: white;
    border: 1px solid #777;
    border-radius: 12px 12px 0 0;
    z-index: 10;
}

</style>
</head>

<body>

<div class="content">

    <h2>Full Screen Overlay</h2>

    <button class="open-btn" onclick="showOverlay()">
        OPEN OVERLAY
    </button>

    <button class="close-btn" onclick="hideOverlay()">
        CLOSE OVERLAY
    </button>

    <p id="status">Status: Waiting...</p>

</div>

<div class="fake-overlay" id="fakeOverlay">

    <img
        class="overlay-image"
        id="overlayImage"
        alt="Background image"
    >

    <div class="image-dark"></div>

    <div class="overlay-controls">
        <button onclick="hideOverlay()">
            CLOSE ✕
        </button>
    </div>

    <div class="fake-tab">
        🌐 google.com
    </div>

</div>

<script>
const overlay = document.getElementById("fakeOverlay");
const image = document.getElementById("overlayImage");
const status = document.getElementById("status");

const images = [
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1920",
    "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1920",
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920",
    "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1920"
];

function showOverlay() {
    const random = Math.floor(Math.random() * images.length);

    image.src = images[random];

    overlay.classList.add("show");

    status.textContent = "Overlay active";
}

function hideOverlay() {
    overlay.classList.remove("show");

    status.textContent = "Overlay closed";
}
</script>

</body>
</html>
