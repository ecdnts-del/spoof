<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PiP + WebShare</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px; }
    video { width: 300px; background: black; border-radius: 12px; }
    button { padding: 12px 24px; font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>

<h2>1 Button: PiP + Share</h2>

<video id="video" autoplay playsinline muted></video>
<br>
<button id="startBtn">Start PiP + Share</button>

<script>
const video = document.getElementById("video");
const button = document.getElementById("startBtn");

// Start camera
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
}

button.onclick = async () => {
  try {
    // 1️⃣ Masuk PiP
    if (document.pictureInPictureEnabled) {
      await video.requestPictureInPicture();
    }

    // 2️⃣ Panggil Web Share
    if (navigator.share) {
      await navigator.share({
        title: "Test Share",
        text: "Testing PiP + Web Share",
        url: location.href
      });
    } else {
      alert("Web Share API tidak didukung");
    }

  } catch (err) {
    console.log("Error:", err);
  }
};

startCamera();
</script>

</body>
</html>
