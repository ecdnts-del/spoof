<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Geolocation Origin Desync Test</title>
<style>
body {
    font-family: system-ui;
    padding: 40px;
}
button {
    padding: 12px 18px;
    font-size: 16px;
}
pre {
    background: #f4f4f4;
    padding: 15px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h2>Geolocation Origin Test</h2>

<button id="request">Request Location</button>

<pre id="log"></pre>

<script>
const log = document.getElementById("log");

function write(msg) {
    log.textContent += msg + "\n";
}

write("Initial URL: " + location.href);
write("Origin: " + location.origin);


document.getElementById("request").onclick = async () => {

    write("\nBefore permission request:");
    write("URL: " + location.href);
    write("Origin: " + location.origin);

    navigator.geolocation.getCurrentPosition(
        pos => {
            write("\nSUCCESS");
            write(
                pos.coords.latitude +
                "," +
                pos.coords.longitude
            );
        },
        err => {
            write("\nERROR");
            write("Code: " + err.code);
            write(err.message);
        }
    );


    /*
     * Attempt to create observable navigation/origin timing pressure.
     * This does NOT forge IPC data, but helps detect
     * origin synchronization problems.
     */
    setTimeout(() => {

        history.pushState(
            {},
            "",
            "/permission-check"
        );

        write("\nAfter pushState:");
        write("URL: " + location.href);
        write("Origin: " + location.origin);

    }, 50);

};
</script>

</body>
</html>
