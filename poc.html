<script>
function y() {
  // buka tab baru / top-level navigation
  const win = window.open('http://google.com', '_top');

  // inject img onerror untuk trigger prompt
  setTimeout(function () {
    win.document.body.innerHTML =
      '<img src="" onerror="prompt(\'JS PROMPT TIMING TEST\\n\\nDialog shown during top-level navigation.\', \'\')">';
  }, 150);
}

// delay execution
setTimeout(y, 3000);
</script>
