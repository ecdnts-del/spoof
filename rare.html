<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebAuthn Demo</title>
</head>
<body>

<button id="authBtn">Verify to Continue</button>

<script>
document.getElementById("authBtn").onclick = async () => {
  try {
    await navigator.credentials.get({
      publicKey: {
        challenge: new Uint8Array(32),
        timeout: 60000,
        userVerification: "required"
      }
    });
  } catch (e) {
    console.log(e);
  }
};
</script>

</body>
</html>
