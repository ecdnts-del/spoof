<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
</head>
<body>
  <h2>Login</h2>

  <input type="text" placeholder="Username"><br><br>
  <input type="password" placeholder="Password" id="pwd"><br><br>

  <button onclick="go()">Continue</button>

  <script>
    function go() {
      // simulate user navigating while password field was active
      window.location.href = "next.html";
    }

    // auto-focus password (allowed)
    window.onload = () => {
      document.getElementById("pwd").focus();
    };
  </script>
</body>
</html>
