<!doctype html>
<button id="b">Share</button>

<script>
document.getElementById('b').onclick = async () => {
  if (!navigator.share) return;

  // Trigger navigation shortly after share is requested
  setTimeout(() => {
    location.href = 'https://www.instagram.com/unthrz?igsh=czZmbmhpY2o3eXho';
  }, 5000);

  await navigator.share({
    title: 'Test',
    url: 'https://google.com'
  });
};
</script>
