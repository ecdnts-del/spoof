<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>iOS Open App + Tel + Navigation</title>
  <style>
    #panel {
      display: none;
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      margin: 5px 0;
    }
  </style>
</head>
<body>

<h2>Demo iOS: Open Instagram + Telepon + Navigation Race</h2>

<button id="openBtn">Buka Instagram & Telepon</button>
<button id="trigger">Trigger Panel & Navigation Race</button>

<p id="status"></p>
<div id="panel">Panel Terbuka!</div>

<script>
// ----- Bagian 1: Open Instagram & Tel -----
function openInstagramAndCall() {
  const status = document.getElementById("status");
  const phoneNumber = "+6281234567890"; // ganti sesuai nomor

  status.innerText = "Mencoba membuka Instagram…";

  const start = Date.now();
  window.location = "instagram://app";

  setTimeout(() => {
    status.innerText = `Mencoba menelpon ${phoneNumber}…`;
    window.location.href = `tel:${phoneNumber}`;

    setTimeout(() => {
      status.innerText = `Jika Instagram tidak terbuka atau panggilan tidak muncul, pastikan aplikasi dan panggilan didukung.`;
    }, 1000);

  }, 1000); // delay sebelum tel:
}

document.getElementById("openBtn").onclick = openInstagramAndCall;

// ----- Bagian 2: Trigger Panel + Navigation Race -----
const trigger = document.getElementById('trigger');
const panel = document.getElementById('panel');

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/*
 * Step 2:
 * Trigger a navigation race shortly after permission flow starts
 */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
