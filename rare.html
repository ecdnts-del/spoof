<button onclick="openInstagramAndCall()">Buka Instagram & Telepon</button>
<p id="status"></p>

<script>
function openInstagramAndCall() {
  const status = document.getElementById("status");
  const phoneNumber = "+6281234567890"; // ganti sesuai nomor

  status.innerText = "Mencoba membuka Instagram…";

  const start = Date.now();
  window.location = "instagram://app";

  // delay sedikit agar iOS sempat trigger Instagram
  setTimeout(() => {
    status.innerText = `Mencoba menelpon ${phoneNumber}…`;
    window.location.href = `tel:${phoneNumber}`;

    setTimeout(() => {
      status.innerText = `Jika Instagram tidak terbuka atau panggilan tidak muncul, pastikan aplikasi dan panggilan didukung.`;
    }, 1000);

  }, 1000); // delay 1 detik sebelum tel:
}
</script>
