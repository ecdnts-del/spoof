<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker on Different Origin</title>
</head>
<body>

<button id="fileButton">Pilih File</button>

<script>
    document.getElementById('fileButton').addEventListener('click', () => {
        alert("Jika file picker muncul, maka masalah ini ada.");
        
        // Coba buka file picker
        showOpenFilePicker({
            types: [{
                description: 'Image files',
                accept: {'image/*': ['.png', '.jpg', '.jpeg']}
            }]
        })
        .then(fileHandles => {
            alert("File dipilih: " + fileHandles[0].name);
        })
        .catch(err => {
            alert("Terjadi error: " + err);
        });
    });
</script>

</body>
</html>
