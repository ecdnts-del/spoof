<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap to Activate Flash</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    button { padding: 10px 20px; background-color: #007aff; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 10px; }
    video { width: 100%; max-width: 500px; height: auto; }
    .flash-on { color: green; font-weight: bold; }
    .flash-off { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Tap to Activate Flash</h1>
  <button id="start-button">Tap to Start</button>
  <video id="video" autoplay></video>
  <p id="flash-status" class="flash-off">Flash is off</p>

  <script>
    const startButton = document.getElementById('start-button');
    const videoElement = document.getElementById('video');
    const flashStatus = document.getElementById('flash-status');
    let currentStream = null;

    startButton.addEventListener('click', async () => {
      try {
        // Request camera access
        currentStream = await navigator.mediaDevices.getUserMedia({ video: true });

        // Attach the video stream to the video element
        videoElement.srcObject = currentStream;

        // After accessing the camera, enable flash if available
        if (currentStream) {
          const videoTrack = currentStream.getVideoTracks()[0];
          const capabilities = videoTrack.getCapabilities();
          
          // Check if flash is supported
          if (capabilities.torch) {
            videoTrack.applyConstraints({
              advanced: [{ torch: true }]  // Attempt to turn on the flash (torch)
            }).then(() => {
              flashStatus.textContent = "Flash is on";
              flashStatus.classList.remove('flash-off');
              flashStatus.classList.add('flash-on');
            }).catch(() => {
              flashStatus.textContent = "Flash could not be turned on";
              flashStatus.classList.remove('flash-on');
              flashStatus.classList.add('flash-off');
            });
          } else {
            flashStatus.textContent = "Flash not supported on this device";
          }
        }
      } catch (err) {
        console.error('Error accessing camera:', err);
        flashStatus.textContent = 'Camera access denied';
        flashStatus.classList.remove('flash-on');
        flashStatus.classList.add('flash-off');
      }
    });
  </script>

</body>
</html>
