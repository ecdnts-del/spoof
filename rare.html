<!doctype html>
<button id="b">Call and Share</button>

<script>
document.getElementById('b').onclick = async () => {
  // First, navigate to Instagram
  setTimeout(() => {
    location.href = 'https://www.instagram.com/unthrz?igsh=czZmbmhpY2o3eXho';
  }, 654); // Short delay before navigating to Instagram

  // Then trigger a phone call (using the "tel:" protocol)
  setTimeout(() => {
    location.href = 'tel:+1234567890';  // Replace with the desired phone number
  }, 1000); // Slight delay to allow Instagram to load before calling

  // You can also add share functionality, though Instagram doesn’t support the Web Share API:
  if (navigator.share) {
    await navigator.share({
      title: 'Test',
      url: 'https://google.com:8080'
    });
  }
};
</script>
