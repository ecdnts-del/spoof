<!DOCTYPE html>
<html>
<body>
Tap cookie secepat mungkin 🍪
<div id="cookie" style="font-size:40px; position:absolute; left:120px; top:120px;">🍪</div>

<script>
const cookie = document.getElementById("cookie");

cookie.addEventListener("touchstart", e => {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(() => console.log("camera granted"))
    .catch(err => console.error(err));
});
</script>
</body>
</html>
