<!DOCTYPE html>
<html>
<body>
  <h2>Login</h2>

  <input type="text" autocomplete="username" placeholder="Username">
  <input type="password"
         autocomplete="current-password"
         id="pwd"
         placeholder="Password">

  <script>
    // Fokus boleh, tapi TIDAK auto-fill
    window.onload = () => {
      document.getElementById("pwd").focus();
    };
  </script>
</body>
</html>
