<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Safari Selection PoC</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  user-select: text;
}

#hidden {
  position: absolute;
  top: 200vh;
}

#spoof {
  display: none;
}
</style>

<script>
function triggerSelect() {
  const p = document.getElementById("target");

  const range = document.createRange();
  range.selectNodeContents(p);

  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  // Safari lama masih respon ini
  try {
    document.execCommand("selectAll");
  } catch(e){}

  document.getElementById("spoof").style.display = "block";
}
</script>
</head>

<body ontouchstart="triggerSelect()">

<p>Tap sekali di layar</p>

<p id="target">
  A[=
  ?:TLv
  S9y
</p>

<img id="spoof" src="spoof.png" width="200">

<div id="hidden">
  invisible spacer
</div>

</body>
</html>
