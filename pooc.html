<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download + API PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    font-family: sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button {
    background: #4CAF50;
    color: #fff;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
  }
</style>
</head>

<body>

<button onclick="run()">Download From Original Site</button>

<script>
async function run() {

  /* Step 1: Fetch file as blob (IMPORTANT) */
  const res = await fetch('https://example.com/sample.txt', { cache: 'no-store' });
  const blob = await res.blob();

  /* Step 2: Force download via Blob URL */
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sample.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  /* Step 3: Native API appears */
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Download started',
        text: 'Your download has started.',
        url: location.href
      });
    } catch (e) {}
  }

  /* Step 4: Optional redirect */
  setTimeout(() => {
    location.href = 'https://google.com';
  }, 500);
}
</script>

</body>
</html>
