<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen + Share + Mail Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

button {
    padding: 20px 40px;
    font-size: 20px;
    border-radius: 12px;
    border: none;
}
</style>

</head>

<body>

<button id="btn">Mulai Test</button>

<script>

const btn = document.getElementById("btn");

btn.onclick = async () => {

    /*
     * 1. Request Fullscreen
     */
    try {
        await document.documentElement.requestFullscreen();
        console.log("Fullscreen requested");
    } catch(e) {
        console.log("Fullscreen error:", e);
    }


    /*
     * 2. Share Dialog
     */
    if (navigator.share) {

        try {

            await navigator.share({
                title: "Fullscreen Test",
                text: "Testing browser UI behavior",
                url: location.href
            });

            console.log("Share completed");

        } catch(e) {

            console.log("Share cancelled");

        }

    }


    /*
     * 3. Mail Intent
     */
    setTimeout(() => {

        window.location.href =
        "mailto:test@example.com?subject=Fullscreen%20Test&body=Testing";

    }, 500);


    btn.style.display = "none";

};

</script>

</body>
</html>
