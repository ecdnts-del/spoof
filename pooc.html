<!DOCTYPE html>
<html>
<head>
<title>Fullscreen + Picture in Picture UI Test</title>
<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}

button {
    padding:15px 25px;
    margin:10px;
    font-size:18px;
}
</style>
</head>

<body>

<h2>Fullscreen + Picture in Picture Test</h2>

<video id="video" width="320" muted autoplay>
</video>

<br>

<button id="fs">
Enter Fullscreen
</button>

<button id="pip">
Open Picture in Picture
</button>

<pre id="log"></pre>


<script>

const video=document.getElementById("video");
const log=document.getElementById("log");


function add(t){
    log.textContent += t+"\n";
}


// create test video
const canvas=document.createElement("canvas");
canvas.width=320;
canvas.height=240;

const ctx=canvas.getContext("2d");

setInterval(()=>{
    ctx.fillStyle="#222";
    ctx.fillRect(0,0,320,240);

    ctx.fillStyle="red";
    ctx.font="30px Arial";
    ctx.fillText(
        "Fullscreen + PiP",
        30,
        120
    );
},100);


video.srcObject =
canvas.captureStream(30);


document.getElementById("fs")
.onclick=async()=>{

    try{

        await document.documentElement.requestFullscreen();

        add(
        "Fullscreen requested: "+
        !!document.fullscreenElement
        );

    }catch(e){

        add("Fullscreen error "+e);

    }

};



document.getElementById("pip")
.onclick=async()=>{

    try{

        await video.requestPictureInPicture();

        add(
        "PiP opened"
        );

    }catch(e){

        add(
        "PiP error "+e
        );

    }

};



document.addEventListener(
"fullscreenchange",
()=>{

add(
"Fullscreen state: "+
!!document.fullscreenElement
);

});



document.addEventListener(
"enterpictureinpicture",
()=>{

add(
"PiP state active"
);

});


</script>

</body>
</html>
