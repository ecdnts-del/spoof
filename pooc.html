<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen + Picture in Picture UI Test</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
}

button {
    padding:20px;
    font-size:18px;
    border-radius:10px;
}
</style>

</head>

<body>

<button id="start">Start Test</button>

<video id="video" muted playsinline width="320">
    <source src="test.mp4" type="video/mp4">
</video>


<script>

const btn = document.getElementById("start");
const video = document.getElementById("video");


btn.onclick = async () => {

    /*
      Step 1:
      Request fullscreen
    */
    try {
        await document.documentElement.requestFullscreen();
        console.log("Fullscreen requested");
    } catch(e) {
        console.log(e);
    }


    /*
      Step 2:
      Start video
    */
    try {
        await video.play();
    } catch(e){}


    /*
      Step 3:
      Immediately request Picture-in-Picture
      while fullscreen transition notification
      may still be pending
    */
    setTimeout(async()=>{

        try {

            if(document.pictureInPictureEnabled){

                await video.requestPictureInPicture();

                console.log(
                "Picture in Picture opened"
                );

            }

        } catch(e){

            console.log(
            "PiP failed:",
            e
            );

        }


    },100);

};

</script>

</body>
</html>
