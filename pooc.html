<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen + PiP Test</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:10px;
    border:0;
}
</style>

</head>

<body>

<button id="start">
START TEST
</button>


<video id="video" muted autoplay playsinline></video>


<script>

const btn=document.getElementById("start");
const video=document.getElementById("video");


// buat sumber video dummy
const canvas=document.createElement("canvas");
canvas.width=640;
canvas.height=360;

const ctx=canvas.getContext("2d");


setInterval(()=>{

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,640,360);

    ctx.fillStyle="#00ff00";
    ctx.font="40px Arial";
    ctx.fillText(
        "Fullscreen + PiP",
        120,
        180
    );

},100);



video.srcObject =
canvas.captureStream(30);



btn.onclick = async()=>{


    // 1. fullscreen

    try{

        await document.documentElement.requestFullscreen();

        console.log(
            "Fullscreen active"
        );

    }catch(e){

        console.log(
            "Fullscreen failed",
            e
        );

    }



    // 2. play video

    try{

        await video.play();

    }catch(e){}



    // 3. Picture in Picture

    try{

        if(
        document.pictureInPictureEnabled
        ){

            await video.requestPictureInPicture();

            console.log(
            "PiP active"
            );

        }

    }catch(e){

        console.log(
            "PiP failed",
            e
        );

    }



    btn.style.display="none";


};



document.addEventListener(
"fullscreenchange",
()=>{

console.log(
"Fullscreen:",
!!document.fullscreenElement
);

});



document.addEventListener(
"enterpictureinpicture",
()=>{

console.log(
"Picture in Picture entered"
);

});

</script>


</body>
</html>
