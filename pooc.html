<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konteks Navigasi Terisolasi</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5f5f7;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .btn {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background-color: #007aff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>

    <button id="execBtn" class="btn">Jalankan Navigasi Terisolasi</button>

    <script>
      document.getElementById("execBtn").onclick = function () {
        // Membuka jendela baru dengan memutuskan referensi balik (noopener)
        // Pengalihan langsung ke URL tujuan disarankan untuk menghindari modifikasi properti runtime
        const newTab = window.open("https://google.com", "_blank", "noopener,noreferrer");

        if (newTab) {
          // Logika internal non-blocking untuk manajemen status aplikasi
          setTimeout(() => {
            // Tempatkan pemrosesan data internal aplikasi Anda di sini
            console.log("Konteks navigasi eksternal telah terisolasi sepenuhnya.");
          }, 500);
        }
      };
    </script>
  </body>
</html>
