
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tapjacking & Double-Tap Lab</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }

        h1 {
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        code {
            background: #2d2d2d;
            color: #ff8a80;
            padding: 2px 4px;
            border-radius: 6px;
            font-family: monospace;
        }

        .interactive-zone {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <h1>🔴 Double-Tap Interaction Labss</h1>

    <p style="font-size: 12px; color: #888;">
        Simulasi pengujian respons klik ganda terhadap kemunculan dialog izin.
    </p>

    <div class="interactive-zone">

        <input
            id="input"
            type="time"
            list="times"
            aria-label="Time picker test"
        >

        <datalist id="times">
            <option value="00:00" label="--"></option>
            <option value="00:01" label="--"></option>
            <option value="00:02" label="Allow this time (test label)"></option>
            <option value="00:03" label="--"></option>
            <option value="00:04" label="--"></option>
            <option value="00:05" label="--"></option>
            <option value="00:06" label="--"></option>
            <option value="00:07" label="--"></option>
            <option value="00:08" label="CLICK FASTER (test label)"></option>
            <option value="00:09" label="--"></option>
            <option value="00:10" label="--"></option>
        </datalist>

    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik...
    </div>

<script>
(() => {
    "use strict";

    const logBox = document.getElementById("log-box");
    const input = document.getElementById("input");

    let clickCount = 0;
    let watchId = null;

    function appendLog(message) {
        const timestamp = new Date().toLocaleTimeString();

        console.log(`[${timestamp}] ${message}`);

        const line = document.createElement("div");
        line.textContent = `[${timestamp}] ${message}`;

        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;

        // Keep the log bounded.
        while (logBox.children.length > 100) {
            logBox.removeChild(logBox.children[1]);
        }
    }

    function activationState() {
        if (!navigator.userActivation) {
            return "unavailable";
        }

        return JSON.stringify({
            active: navigator.userActivation.isActive,
            previouslyActive:
                navigator.userActivation.hasBeenActive
        });
    }

    document.body.addEventListener("pointerdown", (event) => {

        clickCount++;

        appendLog(
            `Pointerdown #${clickCount}, type=${event.pointerType}, ` +
            `activation=${activationState()}`
        );

        // Observe picker behavior without hiding errors.
        // Picker is opened only by direct interaction with its input.
        if (event.target === input) {
            try {
                input.showPicker();
                appendLog("showPicker() invoked");
            } catch (error) {
                appendLog(
                    `Picker error: ${error.name}: ${error.message}`
                );
            }
        }

        if (clickCount === 9) {
            appendLog(
                "Interaction threshold reached. " +
                "No automatic permission request was made."
            );

            clickCount = 0;
        }

    }, { passive: true });

    // Explicit, user-initiated location test.
    // This does not connect location approval to datalist selections.
    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            appendLog("Geolocation watch stopped.");
        }
    });

    appendLog("Lab initialized.");

    appendLog(
        `Secure context: ${window.isSecureContext}`
    );

    appendLog(
        `Geolocation available: ${!!navigator.geolocation}`
    );

})();
</script>

</body>
</html>
