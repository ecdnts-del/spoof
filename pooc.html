<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced PiP UI Demo</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background:#202124;
    color:white;
}

button {
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

#screen {
    width:600px;
    height:300px;
    background:black;
    border-radius:10px;
}

#log {
    margin-top:20px;
    background:#111;
    color:#00ff88;
    padding:15px;
    border-radius:8px;
    min-height:180px;
    font-family:monospace;
}

.status {
    padding:10px;
    background:#333;
    margin:10px 0;
    border-radius:6px;
}
</style>

</head>

<body>

<h2>Advanced Picture-in-Picture Demo</h2>

<div class="status">
Status:
<span id="status">Idle</span>
</div>


<video id="video"
       autoplay
       muted
       playsinline
       style="display:none">
</video>


<canvas id="screen"
        width="600"
        height="300">
</canvas>


<br>

<button id="start">
Start PiP
</button>

<button id="stop">
Stop PiP
</button>

<button id="change">
Change Scene
</button>


<div id="log"></div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const logBox=document.getElementById("log");
const status=document.getElementById("status");

let stream;
let scene=0;


function log(text){
    logBox.innerHTML += text+"<br>";
    logBox.scrollTop=logBox.scrollHeight;
}


function draw(){

    ctx.fillStyle="#111";
    ctx.fillRect(0,0,600,300);


    if(scene===0){

        ctx.fillStyle="#00ff88";
        ctx.font="40px Arial";
        ctx.fillText(
            "Picture-in-Picture",
            100,
            140
        );

    }
    else {

        ctx.fillStyle="#ffcc00";
        ctx.font="40px Arial";
        ctx.fillText(
            "Scene Changed",
            120,
            140
        );

    }


    requestAnimationFrame(draw);
}

draw();



async function startPiP(){

try{

    log("[+] Creating video stream");

    stream=canvas.captureStream(30);

    video.srcObject=stream;

    await video.play();


    if(!document.pictureInPictureEnabled){

        throw new Error(
            "Browser does not support PiP"
        );
    }


    await video.requestPictureInPicture();


    status.textContent="PiP Active";

    log("[+] PiP opened");


}catch(e){

    log("[ERROR] "+e.message);

}

}



async function stopPiP(){

try{

    if(document.pictureInPictureElement){

        await document.exitPictureInPicture();

        status.textContent="Stopped";

        log("[+] PiP closed");

    }

}catch(e){

    log(e.message);

}

}



document.getElementById("start")
.onclick=startPiP;


document.getElementById("stop")
.onclick=stopPiP;


document.getElementById("change")
.onclick=()=>{

    scene++;

    if(scene>1)
        scene=0;


    log("[+] Canvas updated");

};



video.addEventListener(
"enterpictureinpicture",
()=>{

    log("[EVENT] enterpictureinpicture");

});


video.addEventListener(
"leavepictureinpicture",
()=>{

    log("[EVENT] leavepictureinpicture");

});


</script>

</body>
</html>
