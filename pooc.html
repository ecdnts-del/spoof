<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST REAL</title>
</head>
<body>

<div id="content">
  <h2>TEXT INI KESELECT</h2>
  <p>Lorem ipsum dolor sit amet</p>
</div>

<button onclick="go()">TAP SEKALI</button>

<script>
function go() {
  // SELECT ALL (REAL, STABIL)
  const el = document.getElementById("content");
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  // SAVE FILE PICKER (TXT BUATAN SENDIRI)
  const blob = new Blob(
    ["Ini file txt buatan JS"],
    { type: "text/plain" }
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "test.zip";
  a.click();

  // REDIRECT (HARUS PALING TERAKHIR)
  setTimeout(() => {
    location.href = "https://chrome.com";
  }, 800);
}
</script>

</body>
</html>
