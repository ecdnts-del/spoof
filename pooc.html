<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PiP Redirect Demo</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding:30px;
    background:#202124;
    color:white;
}

button {
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

#screen {
    width:600px;
    height:300px;
    background:black;
    border-radius:10px;
}

#log {
    margin-top:20px;
    background:#111;
    color:#00ff88;
    padding:15px;
    border-radius:8px;
    min-height:150px;
    font-family:monospace;
}

.status {
    background:#333;
    padding:10px;
    border-radius:8px;
}
</style>

</head>

<body>

<h2>Picture-in-Picture Redirect Demo</h2>


<div class="status">
Status:
<span id="status">Idle</span>
</div>


<video id="video"
       muted
       autoplay
       playsinline
       style="display:none">
</video>


<canvas id="screen"
        width="600"
        height="300">
</canvas>


<br>

<button id="start">
Start PiP + Redirect
</button>

<button id="stop">
Stop PiP
</button>

<button id="change">
Change Screen
</button>


<div id="log"></div>



<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("screen");

const ctx =
canvas.getContext("2d");


const logBox =
document.getElementById("log");

const status =
document.getElementById("status");


let stream;
let scene=0;



function log(msg){

    logBox.innerHTML += msg+"<br>";

}



function draw(){

    ctx.fillStyle="#111";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        scene === 0
        ? "#00ff88"
        : "#ffcc00";


    ctx.font="40px Arial";

    ctx.fillText(
        scene === 0
        ? "PiP Demo"
        : "Scene Changed",
        150,
        150
    );


    requestAnimationFrame(draw);

}

draw();



async function startPiP(){

try{

    log("[1] Creating stream");


    stream =
    canvas.captureStream(30);


    video.srcObject =
    stream;


    await video.play();


    if(!document.pictureInPictureEnabled){

        throw new Error(
        "PiP not supported"
        );

    }


    await video.requestPictureInPicture();


    status.innerHTML =
    "PiP Active";


    log("[2] PiP opened");


    // Redirect setelah 5 detik
    setTimeout(()=>{

        log("[3] Redirecting...");

        window.location.href =
        "https://www.google.com/";

    },5000);



}
catch(e){

    log(
    "[ERROR] "+e.message
    );

}

}



async function stopPiP(){

try{


    if(document.pictureInPictureElement){

        await document.exitPictureInPicture();


        status.innerHTML =
        "Stopped";


        log("[+] PiP closed");

    }


}
catch(e){

    log(
    e.message
    );

}

}




document
.getElementById("start")
.onclick =
startPiP;



document
.getElementById("stop")
.onclick =
stopPiP;



document
.getElementById("change")
.onclick =
()=>{


    scene++;

    if(scene>1)
        scene=0;


    log(
    "[+] Screen changed"
    );


};




video.addEventListener(
"enterpictureinpicture",
()=>{

    log(
    "[EVENT] enterpictureinpicture"
    );

});



video.addEventListener(
"leavepictureinpicture",
()=>{

    log(
    "[EVENT] leavepictureinpicture"
    );

});



</script>


</body>
</html>
