<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen + WebAuthn + Mailto Test</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    font-family:Arial;
}

body {
    display:flex;
    justify-content:center;
    align-items:center;
}

button {
    padding:20px 40px;
    font-size:20px;
    border-radius:10px;
}
</style>

</head>

<body>

<button id="btn">Start Test</button>

<script>

document.getElementById("btn").onclick = async () => {

    // 1. Fullscreen
    try {
        await document.documentElement.requestFullscreen();
        console.log("Fullscreen requested");
    } catch(e) {
        console.log("Fullscreen error", e);
    }


    // 2. WebAuthn prompt
    try {

        await navigator.credentials.get({
            publicKey: {
                challenge: new Uint8Array(32),
                timeout: 60000,
                userVerification: "preferred"
            }
        });

    } catch(e) {

        console.log("WebAuthn cancelled/error", e);

    }


    // 3. Mailto dialog
    setTimeout(() => {

        window.location.href =
        "mailto:test@example.com?subject=Test&body=Fullscreen%20test";

    }, 500);


};

</script>

</body>
</html>
