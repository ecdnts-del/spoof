<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konteks Navigasi Terisolasi</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5f5f7;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .btn {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background-color: #007aff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>

    <button id="execBtn" class="btn">Jalankan Navigasi Terisolasi</button>

    <script>
      document.getElementById("execBtn").onclick = function () {
        // Membuka jendela baru dengan memutuskan referensi balik objek window.opener
        const newTab = window.open("about:blank", "_blank", "noopener,noreferrer");

        if (newTab) {
          // Navigasi asinkronus dilakukan dalam konteks yang sudah terputus dari dokumen asal.
          // Atribut 'noopener' memastikan peramban langsung menempatkan dokumen baru ini
          // ke dalam antrean proses (process pool) yang berbeda jika terjadi navigasi lintas-asal.
          setTimeout(() => {
            newTab.location.href = "https://example.com";
          }, 1);

          // Alternatif penanganan interaksi asinkronus kustom berbasis DOM (Non-blocking)
          // Menggantikan dialog sinkronus warisan (alert/prompt) yang dapat menahan event loop peramban.
          setTimeout(() => {
            // Tempatkan logika pemrosesan status internal aplikasi Anda di sini
          }, 500);
        }
      };
    </script>
  </body>
</html>
