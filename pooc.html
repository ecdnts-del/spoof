<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download + Share API PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
  }
  button {
    background-color: #4CAF50;
    color: #fff;
    border: none;
    padding: 15px 32px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
  }
</style>
</head>

<body>

<button onclick="run()">Download From Original Site</button>

<script>
async function run() {

  /* Step 1: Buat file sendiri (LOCAL, pasti bisa di iOS) */
  const content =
`Local file generated by JavaScript.
No external URL used.

Time: ${new Date().toISOString()}
UA: ${navigator.userAgent}
`;

  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);

  /* Step 2: Trigger download */
  const a = document.createElement('a');
  a.href = url;
  a.download = 'poc-download.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  /* Step 3: Munculkan Share API (native UI) */
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Download started',
        text: 'A file has just been downloaded.',
        url: location.href
      });
    } catch (e) {
      // user cancel → ignore
    }
  }

  /* (Optional) Redirect setelahnya */
   setTimeout(() => location.href = 'https://google.com', 500);
}
</script>

</body>
</html>
