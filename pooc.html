<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download + Share PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    font-family: sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .button {
    background-color: #4CAF50;
    border: none;
    color: white;
    padding: 15px 32px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>

<body>

<button class="button" onclick="run()">Download From Original Site</button>

<script>
async function run() {

  /* Step 1: Trigger download */
  const link = document.createElement('a');
  link.href = 'https://example.com/sample.txt';   // ganti file test
  link.download = 'sample.txt';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  /* Step 2: Trigger Web Share API (native UI) */
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Download started',
        text: 'Your download has started.',
        url: location.href
      });
    } catch (e) {
      // user cancelled share
    }
  }

  /* Step 3: Optional redirect */
  setTimeout(() => {
    location.href = 'https://google.com';
  }, 400);
}
</script>

</body>
</html>
