<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS window.open PoC</title>

<style>
button {
  font-size: 20px;
  padding: 15px 30px;
  margin-top: 50px;
}
</style>

<script>
function openTab() {
  // attempt popup
  var w = window.open(
    "https://example.com",
    "_blank"
  );

  // iOS fallback (kalau diblock)
  if (!w) {
    location.href = "https://example.com";
  }
}
</script>
</head>

<body>

<h2>Tap sekali (iOS Safari)</h2>

<button ontouchend="openTab()">
  Open Page
</button>

<p>
iOS Safari akan:
<br>• membuka tab baru (fullscreen)
<br>• mengabaikan size & position
</p>

</body>
</html>
