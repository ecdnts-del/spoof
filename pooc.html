<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin A</title>
<script>
function trigger() {
  // Step 1: create selection
  document.execCommand("selectAll");

  // Small delay to ensure selection state is committed
  setTimeout(() => {
    // Step 2: cross-origin navigation
    location.href = "https://google.com/";
  }, 50);
}
</script>
</head>
<body onmousedown="trigger()">
<h2> CALL CENTER MAIL: google@fakess.com </h2>

<p>Tap anywhere</p>
</body>
</html>
