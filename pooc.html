<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PiP UI Test Demo</title>
<style>
body {
  font-family: Arial;
  padding: 30px;
}
button {
  padding: 15px 25px;
  font-size: 18px;
}
#log {
  margin-top:20px;
  background:#111;
  color:#0f0;
  padding:15px;
  min-height:150px;
}
</style>
</head>

<body>

<h2>Picture-in-Picture UI Test</h2>

<button id="run">
Run Full Demo
</button>

<video id="video" muted autoplay playsinline style="display:none">
</video>

<div id="log"></div>


<script>
const logBox = document.getElementById("log");

function log(msg){
  logBox.innerHTML += msg + "<br>";
}


async function startPiP(){

  try {

    log("[1] Requesting user activation");

    const canvas = document.createElement("canvas");
    canvas.width = 400;
    canvas.height = 200;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle="black";
    ctx.fillRect(0,0,400,200);

    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText("PiP Test Window",50,100);


    const stream =
      canvas.captureStream();

    const video =
      document.getElementById("video");

    video.srcObject = stream;

    await video.play();

    if(document.pictureInPictureEnabled){

      await video.requestPictureInPicture();

      log("[2] PiP opened");

    } else {

      log("[2] PiP unavailable");

    }


  } catch(e){

    log("PiP error: "+e.message);

  }
}


async function simulateDialog(){

  log("[3] Simulating file picker event");

  setTimeout(()=>{

    alert(
      "Simulation only:\n\n"+
      "A file picker would appear here.\n"+
      "No files are accessed."
    );

    log("[4] Dialog simulation complete");

  },1000);

}


document.getElementById("run")
.onclick = async ()=>{

  log("=== START ===");

  await startPiP();

  await simulateDialog();

  log("=== END ===");

};

</script>

</body>
</html>
