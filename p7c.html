<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Timing Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 40px;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      width: 90%;
      margin: auto;
      text-align: left;
      font-size: 14px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h3>Safari Navigation Timing Demo</h3>

<button onclick="demo()">Run demo</button>

<pre id="log"></pre>

<script>
  const logEl = document.getElementById("log");
  const start = performance.now();

  function log(msg) {
    const t = (performance.now() - start).toFixed(1);
    logEl.textContent += `[+${t} ms] ${msg}\n`;
  }

  function demo() {
    log("Button clicked");
    log("Setting window.location.href to https://google.com:8000");

    setTimeout(() => {
      log("50ms after click");
    }, 50);

    setTimeout(() => {
      log("100ms after click");
    }, 100);

    setTimeout(() => {
      log("300ms after click");
    }, 300);

    setTimeout(() => {
      log("1000ms after click");
    }, 1000);

    window.location.href = "https://example.com";
  }

  document.addEventListener("visibilitychange", () => {
    log("Document visibility changed: " + document.visibilityState);
  });

  window.addEventListener("pagehide", () => {
    log("pagehide event fired");
  });

  window.addEventListener("beforeunload", () => {
    log("beforeunload event fired");
  });
</script>

</body>
</html>
