<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation UI Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #f5f5f5;
    }
    .warning {
      color: #b00000;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="warning">
    ⚠️ UI / Navigation Behavior Demo (Educational)
  </div>

  <p>Current origin: GitHub Pages</p>

  <button onclick="demo()">Run demo</button>

  <script>
    function demo() {
      alert("Demo navigation starting");
      window.location.href = "https://example.com";
    }
  </script>

</body>
</html>
