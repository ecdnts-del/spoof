<script>
function showPrompt() {

    // ⏱️ DELAY sebelum redirect
    setTimeout(function () {

        // top-level navigation
        const win = window.open('https://google.com:8080', '_top');

        // ⏱️ delay kecil setelah navigasi
        setTimeout(function () {
            try {
                win.document.body.innerHTML = `
<center>
  <h2>𝐷ℎ𝑎𝑓𝑦</h2>

  <a href="https://example.com" target="_blank" rel="noopener">
    <img
      src="https://ecdnts-del.github.io/spoof/9de3dae67d67214fee46527f2a5b8d6b.jpg"
      alt="Demo Image">
  </a>
</center>


                   
                `;
            } catch (e) {
                console.log('Cross-origin DOM blocked (expected)');
            }
        }, 250);

    }, 2500); // ← DELAY 2 detik sebelum pindah
}

document.getElementById('trigger').addEventListener('click', function () {
    showPrompt();
});
</script>
