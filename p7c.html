<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UI Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    background: #f2f2f7;
  }

  .wrap {
    max-width: 420px;
    margin: 80px auto;
    padding: 24px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #007aff;
    color: #fff;
  }

  .login {
    display: none;
    margin-top: 32px;
    background: #fff;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }

  h2 {
    text-align: center;
    margin-bottom: 6px;
  }

  .domain {
    text-align: center;
    color: #666;
    margin-bottom: 18px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .timer {
    margin-top: 14px;
    text-align: center;
    font-weight: 600;
    color: #444;
  }
</style>
</head>

<body>

<div class="wrap">
  <button id="trigger">Open Secure Page</button>

  <div class="login" id="login">
    <h2>Sign in</h2>
    <div class="domain">google.com</div>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button>Sign in</button>

    <div class="timer" id="timer">0 ms</div>
  </div>
</div>

<script>
document.getElementById('trigger').addEventListener('click', () => {
  const login = document.getElementById('login');
  const timer = document.getElementById('timer');

  // Update URL without navigation
  history.pushState({}, '', '/account/login');

  // Trigger rendering timing edge case
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      login.style.display = 'block';
    });
  });

  // Measure how long UI is interactable
  const start = performance.now();
  const id = setInterval(() => {
    timer.textContent =
      Math.round(performance.now() - start) +
      ' ms (address bar unchanged)';
  }, 16);

  setTimeout(() => clearInterval(id), 3000);
});
</script>

</body>
</html>
