<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>UI Demo – Safe PoC</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding-top: 40px;
    }
    img {
      max-width: 300px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    img:hover {
      transform: scale(1.05);
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="warning">
    ⚠️ DEMO EDUKASI – BUKAN GOOGLE / BING
  </div>

  <center>
    <h2>𝐷ℎ𝑎𝑓𝑦</h2>
    <a href="https://google.com:90" target="_blank" rel="noopener">
      <img src="https://ecdnts-del.github.io/spoof/9de3dae67d67214fee46527f2a5b8d6b.jpg" alt="Demo Image">
    </a>
  </center>

  <br><br>

  <button onclick="demo()">Run demo</button>

  <script>
    function demo() {
      alert("[DEMO] Navigasi simulasi. Ini bukan situs asli.");

      // Simulasi navigasi ke domain demo (bukan domain nyata)
      window.location.href = "https://google.com:90";
    }
  </script>

</body>
</html>
