<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Navigation Timing Observation</title>
</head>
<body>

<h2>Navigation Timing Demo (Safe)</h2>
<button id="trigger">Start navigation</button>

<pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
const start = performance.now();

function log(msg) {
  const t = (performance.now() - start).toFixed(1);
  logEl.textContent += `[+${t} ms] ${msg}\n`;
}

document.getElementById("trigger").onclick = () => {
  log("User interaction");

  setTimeout(() => {
    log("Initiating top-level navigation to example.com");
    window.location.href = "https://google.com:00";
  }, 2000);
};

window.addEventListener("beforeunload", () => log("beforeunload fired"));
window.addEventListener("pagehide", () => log("pagehide fired"));
document.addEventListener("visibilitychange", () =>
  log("visibility: " + document.visibilityState)
);
</script>

</body>
</html>
