<!doctype html>
<html>
<body>
<h3>Prompt Persistence Test</h3>

<script>
function poc() {
  const origin = location.origin;
  const time = new Date().toISOString();

  // trigger navigasi top-level
  window.open('https://www.google.com', '_top');

  // delay singkat lalu tampilkan prompt
  setTimeout(() => {
    prompt(
      'Persistent Dialog Test\n\n' +
      'UI Origin: ' + origin + '\n' +
      'Created at: ' + time + '\n\n' +
      'If this dialog is visible while the address bar shows another domain,\n' +
      'this indicates UI persistence across navigation.',
      ''
    );
  }, 100);
}

// delay awal agar jelas sequencing-nya
setTimeout(poc, 1500);
</script>
</body>
</html>
