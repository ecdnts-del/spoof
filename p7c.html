<input
  type="button"
  value="CLICK ME"
  onclick="
    this.value = 'CALLING...';

    // buka halaman (address bar kelihatan)
    var win = window.open('https://google.com', '_blank');
    if (!win) return;

    // delay utama (mirip 10 detik di kode kamu)
    setTimeout(function () {

      // prompt pertama
      var a = win.prompt('Masukkan data percobaan 1');
      if (a === null) return;

      // jeda kecil antar prompt
      setTimeout(function () {

        var b = win.prompt('Masukkan data percobaan 2');
        if (b === null) return;

        // tampilkan hasil (tanpa redirect)
        win.document.body.innerHTML =
          '<h2>Hasil Percobaan</h2>' +
          '<p>Data 1: ' + a + '</p>' +
          '<p>Data 2: ' + b + '</p>';

      }, 500);

    }, 3000);
  "
/>
