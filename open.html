
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebState Visibility Regression Test</title>
<style>
body {
  font-family: sans-serif;
  padding: 20px;
}
button {
  padding: 12px;
  margin: 6px;
}
iframe {
  width: 100%;
  height: 180px;
  border: 1px solid #aaa;
}
</style>
</head>
<body>

<h2>JavaScript Dialog Regression Test</h2>

<button onclick="testAlert()">Test Alert</button>
<button onclick="testConfirm()">Test Confirm</button>
<button onclick="testPrompt()">Test Prompt</button>

<p id="result">Waiting for test...</p>

<script>
function testAlert() {
  document.getElementById("result").textContent =
    "Alert requested";

  alert("Visibility regression test");
}

function testConfirm() {
  const result = confirm("Confirm regression test");

  document.getElementById("result").textContent =
    "Confirm result: " + result;
}

function testPrompt() {
  const result = prompt("Prompt regression test");

  document.getElementById("result").textContent =
    "Prompt result: " + result;
}
</script>

</body>
</html>
