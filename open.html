
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Chromium URL Bar Regression</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: #101114;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

main {
  max-width: 480px;
  margin: 40px auto;
}

h2 {
  font-size: 21px;
}

p {
  color: #aaa;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 9px;
  background: #3478f6;
  color: white;
  font-size: 16px;
  font-weight: 600;
}

#result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 9px;
  background: #202127;
  overflow-wrap: anywhere;
}

.pass { color: #4ade80; }
.fail { color: #f87171; }
</style>
</head>

<body>
<main>

<h2>Chromium iOS Security Test</h2>

<p>Blob URL and History API origin validation.</p>

<button id="run">Run Regression Test</button>

<div id="result">
  Ready
</div>

</main>

<script>
"use strict";

const output = document.getElementById("result");

function show(message, state) {
  output.className = state;
  output.textContent = message;
}

document.getElementById("run").addEventListener("click", async () => {

  const originalURL = location.href;

  try {

    // Create a same-origin Blob document.
    const html = `
      <!doctype html>
      <html>
      <head><meta charset="utf-8"></head>
      <body>
        <h2>Blob document active</h2>
        <p>Chromium navigation regression test.</p>
      </body>
      </html>
    `;

    const blob = new Blob([html], {
      type: "text/html"
    });

    const blobURL = URL.createObjectURL(blob);

    // Verify Blob URL origin semantics.
    const parsed = new URL(blobURL);

    const blobValid =
      parsed.protocol === "blob:";

    // Verify that a cross-origin History API update
    // cannot replace the current document URL.
    let rejected = false;

    try {
      history.replaceState(
        {},
        "",
        "https://example.org/regression-test"
      );
    } catch (error) {
      rejected = true;
    }

    const unchanged = location.href === originalURL;

    if (blobValid && unchanged) {
      show(
        "PASS — Blob URL valid; cross-origin URL replacement did not change the current URL.",
        "pass"
      );
    } else {
      show(
        "FAIL — Unexpected navigation or URL state change.",
        "fail"
      );
    }

    URL.revokeObjectURL(blobURL);

  } catch (error) {
    show(
      "TEST ERROR — " + error.message,
      "fail"
    );
  }

});
</script>

</body>
</html>
