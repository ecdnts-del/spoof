<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    h1 {
        margin: 1em;
    }

    iframe {
        display: none;
        width: 100%;
        height: 600px;
        border: 0;
    }
</style>


<iframe id="frame" src="https://www.google.com/url?q=https://drive.usercontent.google.com/download?id=1rpMF3HMNrGGL47CQEkcVLzS674trhujL"></iframe>

<script>
    // Tampilkan iframe setelah 2 detik
    setTimeout(() => {
        document.getElementById("frame").style.display = "block";
    }, 1000);

    // Redirect ke Google setelah 4 detik
    setTimeout(() => {
        window.location.replace = "https://google.com";
    }, 1200);
</script>
