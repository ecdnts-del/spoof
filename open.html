<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FS Access Deep Test</title>
<style>
body { font-family: Arial; background:#f3f4f6; padding:30px;}
#log { background:#111; color:#0f0; padding:10px; height:220px; overflow:auto;}
button { margin:5px; padding:10px;}
</style>
</head>
<body>

<h2>🧪 File System Access – Deep Test</h2>

<button onclick="init()">1. Pick File</button>
<button onclick="checkPermission()">2. Check Permission</button>
<button onclick="startMonitor()">3. Start Monitor</button>

<div id="log"></div>

<script>
let handle;
let lastData = "";

function log(msg){
  document.getElementById("log").innerHTML += msg + "<br>";
}

// STEP 1
async function init(){
  try{
    handle = await window.showSaveFilePicker({
      suggestedName: "backup-config.txt"
    });

    const writable = await handle.createWritable();
    await writable.write("api_key=\nsecret=\n");
    await writable.close();

    log("✅ File selected & written");

  }catch(e){
    log("❌ Error: " + e.message);
  }
}

// 🔥 permission visibility
async function checkPermission(){
  if(!handle) return log("No handle");

  const readPerm = await handle.queryPermission({mode: "read"});
  const writePerm = await handle.queryPermission({mode: "readwrite"});

  log("🔐 Read permission: " + readPerm);
  log("✍️ Write permission: " + writePerm);
}

// 🔥 safer read (handle state change)
async function safeRead(){
  try{
    const file = await handle.getFile();
    return await file.text();

  }catch(e){

    // 🔥 detect state invalidation
    if(e.message.includes("state cached")){
      log("⚠️ File changed externally, refreshing state...");
      return null;
    }

    // 🔥 detect permission drop
    if(e.name === "NotAllowedError"){
      log("🚫 Permission revoked");
      return null;
    }

    log("❌ Read error: " + e.message);
    return null;
  }
}

// 🔥 monitoring loop
function startMonitor(){
  setInterval(async ()=>{

    if(!handle) return;

    const text = await safeRead();
    if(!text) return;

    if(text !== lastData){
      log("📡 Change detected:");
      log("<pre>"+text+"</pre>");

      lastData = text;
    }

  }, 1500);
}

// 🔥 lifecycle awareness
window.addEventListener("focus", ()=>{
  log("👁️ Tab focused");
});

document.addEventListener("visibilitychange", ()=>{
  log(document.hidden ? "🌙 Background mode" : "☀️ Active");
});
</script>

</body>
</html>
