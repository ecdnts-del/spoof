
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dhafy.test | iOS Security Test</title>
<style>
* { box-sizing:border-box }
body {
  margin:0;
  padding:25px;
  background:#101318;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
main {
  max-width:480px;
  margin:45px auto;
  padding:25px;
  background:#1c222b;
  border-radius:16px;
}
h2 { margin-top:0 }
button {
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#3685ff;
  color:white;
  font-size:16px;
  font-weight:600;
}
.status {
  margin-top:20px;
  padding:15px;
  border-radius:9px;
  background:#101318;
}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:12px;
}
</style>
</head>
<body>
<main>
<h2>dhafy.test</h2>
<p>Chromium iOS Blob Origin Security Test</p>

<button id="run">START TEST</button>

<div class="status">
<strong id="status">READY</strong>
<pre id="result"></pre>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

$("run").onclick = async () => {
  $("status").textContent = "TESTING";

  const originalOrigin = location.origin;

  const blob = new Blob([
    "<!doctype html><title>Blob Origin Test</title>"
  ], {type:"text/html"});

  const blobURL = URL.createObjectURL(blob);

  const blobOrigin = new URL(blobURL).origin;

  let historyResult = "Not tested";

  try {
    history.pushState(
      {test:true},
      "",
      location.pathname + "?origin-test=1"
    );
    historyResult = "Same-origin history update accepted";
    history.replaceState(null, "", location.pathname);
  } catch(e) {
    historyResult = "History update rejected: " + e.name;
  }

  const report = {
    target: "dhafy.test",
    currentHost: location.hostname,
    currentOrigin: originalOrigin,
    blobProtocol: new URL(blobURL).protocol,
    blobOrigin: blobOrigin,
    originComparison: originalOrigin === blobOrigin,
    historyTest: historyResult,
    iosWebKitHandler: !!(
      window.webkit &&
      window.webkit.messageHandlers
    ),
    navigationHandlerAvailable: !!(
      window.webkit &&
      window.webkit.messageHandlers &&
      window.webkit.messageHandlers.NavigationEventMessage
    )
  };

  $("result").textContent =
    JSON.stringify(report, null, 2);

  $("status").textContent = "TEST COMPLETE";

  URL.revokeObjectURL(blobURL);
};
</script>
</body>
</html>
