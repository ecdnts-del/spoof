
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>TESTING - Chromium iOS Security PoC</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: white;
  font-family: Arial, sans-serif;
}

button {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 32px;
  background: #007aff;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
}

#log {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 35%;
  overflow-y: auto;
  padding: 12px;
  background: #111;
  color: #00ff90;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<button id="startBtn">START TESTING</button>
<pre id="log"></pre>

<script>
let w = null;

const logElement = document.getElementById("log");

function log(message) {
  logElement.textContent +=
    new Date().toISOString() +
    " | " + message + "\n";
}

function observePopup() {
  if (!w || w.closed) {
    log("Popup unavailable");
    return;
  }

  try {
    log("Popup URL: " + w.location.href);
  } catch (error) {
    log("Cross-origin access restricted: " + error.name);
  }
}

function startTesting() {
  log("=== TESTING STARTED ===");

  log("Parent URL: " + location.href);

  w = window.open("about:blank", "_blank");

  if (!w) {
    log("Popup blocked");
    return;
  }

  log("New WebState opened");

  w.document.write(`
    <!doctype html>
    <html>
    <head>
      <title>TESTING</title>
    </head>
    <body style="
      margin:0;
      padding:30px;
      text-align:center;
      font-family:Arial;
    ">
      <h1 style="color:#007aff">
        TESTING SECURITY TEST
      </h1>

      <h2>Chromium iOS Navigation Test</h2>

      <p>Observing WebState lifecycle.</p>
    </body>
    </html>
  `);

  w.document.close();

  log("Document injected");

  w.addEventListener("pagehide", () => {
    log("Popup pagehide");
  });

  w.addEventListener("pageshow", () => {
    log("Popup pageshow");
  });

  setTimeout(() => {
    try {
      log("Navigation: https://testing.com");
      w.location.href = "https://testing.com";
    } catch (error) {
      log("Navigation error: " + error.name);
    }
  }, 1000);

  setTimeout(observePopup, 3000);

  setTimeout(() => {
    log("Active dialog test");

    try {
      const result = window.confirm(
        "TESTING - JavaScript Dialog Regression"
      );

      log("Confirm result: " + result);
    } catch (error) {
      log("Dialog error: " + error.name);
    }
  }, 4000);

  setTimeout(observePopup, 6000);

  setTimeout(() => {
    log("=== TESTING COMPLETED ===");
  }, 7000);
}

document.getElementById("startBtn")
  .addEventListener("click", function () {
    this.disabled = true;
    startTesting();
  });

document.addEventListener("visibilitychange", () => {
  log("Parent visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});

window.addEventListener("pageshow", () => {
  log("Parent pageshow");
});
</script>

</body>
</html>
