
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing - Chromium iOS</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: white;
  font-family: Arial, sans-serif;
}

#start {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 34px;
  border: none;
  border-radius: 10px;
  background: #007aff;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<button id="start">START TEST</button>

<script>
document.getElementById("start").onclick = function() {
  this.remove();

  const w = window.open("about:blank", "_blank");

  if (!w) return;

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>TESTING</title>
    </head>
    <body style="
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-family:Arial;
    ">
      <div>
        <h1 style="color:red">TESTING</h1>
        <h2>Chromium iOS Security Test</h2>
        <p>Navigation lifecycle regression test.</p>
      </div>
    </body>
    </html>
  `);

  w.document.close();

  // Observe navigation lifecycle.
  w.addEventListener("pagehide", () => {});
  w.addEventListener("pageshow", () => {});
  w.addEventListener("beforeunload", () => {});

  // Test normal navigation.
  setTimeout(() => {
    if (!w.closed) {
      w.location.assign("https://x.com:909/");
    }
  }, 900);

  // Test invalid-port navigation separately.
  setTimeout(() => {
    if (!w.closed) {
      w.location.assign("https://www.x.com:1234/");
    }
  }, 300);
};
</script>

</body>
</html>
