
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Regression Test</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #fff;
  color: #222;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  text-align: center;
  background: #172554;
  color: white;
}

#startBtn {
  display: block;
  margin: 35px auto;
  padding: 16px 35px;
  border: 0;
  border-radius: 10px;
  background: #007aff;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.panel {
  margin: 12px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

#status {
  font-weight: bold;
  color: #007aff;
}

#log {
  max-height: 350px;
  overflow-y: auto;
  padding: 12px;
  background: #111;
  color: #00ff90;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 11px;
}

iframe {
  width: 100%;
  height: 100px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>

<header>
  <h2>Chromium iOS Security Test</h2>
  <p>Navigation and WebState Lifecycle</p>
</header>

<button id="startBtn">START TEST</button>

<div class="panel">
  <div id="status">Status: READY</div>
  <p>Parent URL: <span id="parentUrl"></span></p>
  <p>Visibility: <span id="visibility">visible</span></p>
</div>

<div class="panel">
  <h3>Test Results</h3>
  <pre id="log"></pre>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let popup = null;
let started = false;

function log(message) {
  const line =
    new Date().toISOString() +
    " | " + message + "\n";

  $("log").textContent += line;
  $("log").scrollTop = $("log").scrollHeight;
}

function status(message) {
  $("status").textContent = "Status: " + message;
  log(message);
}

function inspectPopup() {
  if (!popup) {
    log("Popup reference unavailable");
    return;
  }

  try {
    log("Popup closed: " + popup.closed);

    // Same-origin access only.
    log("Popup URL: " + popup.location.href);
    log("Popup document readyState: " +
        popup.document.readyState);

    log("Popup title: " + popup.document.title);

    log("Popup DOM inspection successful");
  } catch (error) {
    log("Cross-origin inspection blocked: " +
        error.name);
  }
}

function createTestDocument() {
  return `
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"
            content="width=device-width, initial-scale=1">
      <title>TESTING DOCUMENT</title>
    </head>
    <body style="
      margin:0;
      padding:30px;
      font-family:Arial;
      text-align:center;
      background:#fff;
    ">
      <h1 style="color:#dc2626">
        TESTING
      </h1>

      <h2>Chromium iOS Regression</h2>

      <p>Initial about:blank document.</p>

      <p id="documentStatus">
        Document successfully created.
      </p>
    </body>
    </html>
  `;
}

function runTest() {
  if (started) return;
  started = true;

  $("startBtn").disabled = true;

  status("TEST STARTED");

  log("Parent URL: " + location.href);
  log("Parent origin: " + location.origin);
  log("User agent: " + navigator.userAgent);

  popup = window.open("about:blank", "_blank");

  if (!popup) {
    status("POPUP BLOCKED");
    return;
  }

  log("Popup successfully opened");

  popup.document.open();
  popup.document.write(createTestDocument());
  popup.document.close();

  log("Initial document injected");

  popup.addEventListener("pageshow", event => {
    log("Popup pageshow; persisted=" + event.persisted);
  });

  popup.addEventListener("pagehide", event => {
    log("Popup pagehide; persisted=" + event.persisted);
  });

  popup.addEventListener("beforeunload", () => {
    log("Popup beforeunload");
  });

  popup.addEventListener("unload", () => {
    log("Popup unload");
  });

  inspectPopup();

  // Test 1: normal HTTPS navigation.
  setTimeout(() => {
    status("TEST 1: HTTPS NAVIGATION");

    try {
      popup.location.href = "https://x.com";
      log("Navigation request sent to x.com");
    } catch (error) {
      log("Navigation exception: " + error.name);
    }
  }, 1500);

  // Test 2: observe navigation state.
  setTimeout(() => {
    status("TEST 2: NAVIGATION OBSERVATION");
    inspectPopup();
  }, 5000);

  // Test 3: invalid service port.
  setTimeout(() => {
    status("TEST 3: INVALID SERVICE PORT");

    try {
      popup.location.href =
        "https://www.google.com:1234";

      log("Port 1234 navigation requested");
    } catch (error) {
      log("Port navigation exception: " +
          error.name);
    }
  }, 7500);

  // Test 4: observe final state.
  setTimeout(() => {
    status("TEST 4: FINAL STATE");
    inspectPopup();
  }, 11000);

  setTimeout(() => {
    status("TEST COMPLETED");
    log("Review browser UI and visible document manually.");
  }, 13000);
}

$("parentUrl").textContent = location.href;

$("startBtn").addEventListener("click", runTest);

document.addEventListener("visibilitychange", () => {
  $("visibility").textContent =
    document.visibilityState;

  log("Parent visibility: " +
      document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});

window.addEventListener("pageshow", event => {
  log("Parent pageshow; persisted=" + event.persisted);
});

window.addEventListener("focus", () => {
  log("Parent window focus");
});

window.addEventListener("blur", () => {
  log("Parent window blur");
});

window.addEventListener("error", event => {
  log("JS error: " + event.message);
});

window.addEventListener("unhandledrejection", event => {
  log("Unhandled rejection: " + event.reason);
});
</script>

</body>
</html>
