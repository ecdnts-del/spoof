
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chromium Blob Origin Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f5f5f5;
  color: #202124;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

button {
  padding: 12px;
  width: 100%;
  margin: 6px 0;
  background: #1a73e8;
  border: 0;
  border-radius: 8px;
  color: white;
}

pre {
  background: #171717;
  color: #9ef59e;
  padding: 12px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  font-size: 12px;
}
</style>
</head>

<body>

<h2>Chromium Blob Origin Test</h2>

<div class="card">
  <h3>Current document</h3>
  <pre id="current"></pre>
</div>

<div class="card">
  <h3>Tests</h3>

  <button id="createBlob">
    Create Blob Document
  </button>

  <button id="sameOrigin">
    Test Same-Origin replaceState
  </button>

  <button id="crossOrigin">
    Test Cross-Origin replaceState
  </button>

  <button id="download">
    Download Test Results
  </button>
</div>

<div class="card">
  <h3>Results</h3>
  <pre id="results"></pre>
</div>

<script>
const results = [];

function record(name, data) {
  const entry = {
    time: new Date().toISOString(),
    test: name,
    data
  };

  results.push(entry);

  document.getElementById("results").textContent =
    JSON.stringify(results, null, 2);
}

function inspect() {
  return {
    href: location.href,
    origin: location.origin,
    protocol: location.protocol,
    hostname: location.hostname,
    historyLength: history.length,
    userAgent: navigator.userAgent
  };
}

function update() {
  document.getElementById("current").textContent =
    JSON.stringify(inspect(), null, 2);
}

document.getElementById("createBlob")
.addEventListener("click", () => {
  const html = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Blob Origin Test</title>
    </head>
    <body>
      <h2>Blob document active</h2>
      <pre id="info"></pre>
      <script>
        document.getElementById("info").textContent =
          JSON.stringify({
            href: location.href,
            origin: location.origin,
            protocol: location.protocol,
            hostname: location.hostname
          }, null, 2);
      <\/script>
    </body>
    </html>
  `;

  const blob = new Blob([html], {
    type: "text/html"
  });

  const url = URL.createObjectURL(blob);

  record("BLOB_CREATED", {
    blobURL: url,
    currentOrigin: location.origin
  });

  location.href = url;
});

document.getElementById("sameOrigin")
.addEventListener("click", () => {
  try {
    const newURL = new URL(location.href);

    history.replaceState(
      {},
      "",
      newURL.href
    );

    record("SAME_ORIGIN_SUCCESS", inspect());

  } catch (error) {
    record("SAME_ORIGIN_ERROR", {
      name: error.name,
      message: error.message
    });
  }

  update();
});

document.getElementById("crossOrigin")
.addEventListener("click", () => {
  try {
    history.replaceState(
      {},
      "",
      "https://example.com/test"
    );

    record("CROSS_ORIGIN_UNEXPECTED_SUCCESS",
      inspect());

  } catch (error) {
    record("CROSS_ORIGIN_REJECTED", {
      name: error.name,
      message: error.message,
      currentURL: location.href,
      currentOrigin: location.origin
    });
  }

  update();
});

document.getElementById("download")
.addEventListener("click", () => {
  const blob = new Blob(
    [JSON.stringify(results, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "chromium-origin-test.json";
  a.click();

  URL.revokeObjectURL(url);
});

update();
record("INITIALIZED", inspect());
</script>

</body>
</html>
