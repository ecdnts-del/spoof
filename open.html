
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium iOS Regression Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}
button{
  padding:17px 35px;
  border:0;
  border-radius:10px;
  background:#007aff;
  color:white;
  font-size:18px;
}
</style>
</head>
<body>

<button id="start">START TEST</button>

<script>
document.getElementById("start").onclick=()=>{
  const w=window.open("about:blank","_blank");

  if(!w){
    alert("Popup blocked");
    return;
  }

  w.document.open();

  w.document.write(`
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Controlled Test Document</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  width:100%;
  max-width:380px;
  padding:25px;
  background:white;
  border-radius:14px;
  box-shadow:0 5px 20px #0002;
}
h2{text-align:center;color:#202124}
input,button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border-radius:7px;
  font-size:16px;
}
input{border:1px solid #ccc}
button{
  border:0;
  background:#007aff;
  color:white;
}
.notice{
  padding:10px;
  background:#fff3cd;
  color:#664d03;
  font-size:12px;
  text-align:center;
}
</style>
</head>
<body>
<div class="card">
  <div class="notice">CONTROLLED SECURITY TEST</div>
  <h2>Document Persistence Test</h2>
  <p>Chromium iOS navigation regression</p>
  <form id="testForm">
    <input placeholder="Test value">
    <button type="submit">SUBMIT TEST</button>
  </form>
  <p id="result">Original document initialized.</p>
</div>
<script>
document.getElementById("testForm")
.addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("result").textContent=
    "Test submitted successfully.";
});
<\/script>
</body>
</html>
  `);

  w.document.close();

  setTimeout(()=>{
    if(!w.closed){
      w.location.href="https://example.com:81/";
    }
  },2000);
};
</script>

</body>
</html>
