<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes">

<title>Chromium iOS Security Regression Testing</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #fff;
  font-family: Arial, sans-serif;
}

button {
  padding: 15px 30px;
  background: #007aff;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  margin: 8px;
}

#controls {
  text-align: center;
  padding-top: 30vh;
}

#log {
  margin: 15px;
  padding: 15px;
  background: #111;
  color: #00ff90;
  border-radius: 8px;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 40vh;
  overflow-y: auto;
}

#status {
  padding: 12px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="controls">
  <h2>TESTING SECURITY TEST</h2>
  <button id="startBtn">CLICK HERE</button>
  <button id="recoveryBtn" disabled>TEST RECOVERY</button>
</div>

<div id="status">Status: READY</div>
<pre id="log"></pre>

<script>
const output = document.getElementById("log");
const status = document.getElementById("status");

let popup = null;
let started = false;

function log(message) {
  const timestamp = new Date().toISOString();

  output.textContent +=
    timestamp + " | " + message + "\n";

  output.scrollTop = output.scrollHeight;
}

function setStatus(message) {
  status.textContent = "Status: " + message;
  log(message);
}

function monitorVisibility() {
  log("Visibility: " + document.visibilityState);
}

document.addEventListener(
  "visibilitychange",
  monitorVisibility
);

window.addEventListener("pagehide", () => {
  log("Parent PAGEHIDE");
});

window.addEventListener("pageshow", () => {
  log("Parent PAGESHOW");
});

window.addEventListener("focus", () => {
  log("Parent WINDOW FOCUS");
});

window.addEventListener("blur", () => {
  log("Parent WINDOW BLUR");
});

document.getElementById("startBtn").onclick = () => {
  if (started) return;

  started = true;

  setStatus("TEST STARTED");

  log("Parent URL: " + location.href);
  log("Parent origin: " + location.origin);

  popup = window.open("about:blank", "_blank");

  if (!popup) {
    setStatus("POPUP BLOCKED");
    return;
  }

  log("Popup created");

  try {
    popup.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>Testing Security Test</title>
      </head>

      <body style="
        margin:0;
        padding:25px;
        text-align:center;
        font-family:Arial;
        background:white;
      ">

        <h1 style="color:red">
          TESTING SECURITY TEST
        </h1>

        <h2 style="color:#007aff">
          Chromium iOS Navigation Test
        </h2>

        <p>Testing WebState lifecycle.</p>

        <p id="state">INITIAL DOCUMENT</p>

      </body>
      </html>
    `);

    popup.document.close();

    log("Initial document injected");
    setStatus("INITIAL DOCUMENT CREATED");

  } catch (error) {
    log("Document injection error: " + error.message);
    return;
  }

  setTimeout(() => {
    try {
      log("Redirect requested");
      popup.location.href = "https://testing.com";
      setStatus("REDIRECT REQUESTED");
    } catch (error) {
      log("Redirect error: " + error.message);
    }
  }, 1000);

  setTimeout(() => {
    try {
      log("Popup closed: " + popup.closed);

      if (!popup.closed) {
        try {
          log("Popup URL: " + popup.location.href);
        } catch (error) {
          log("Cross-origin restriction: " + error.name);
        }
      }
    } catch (error) {
      log("Popup status error: " + error.message);
    }
  }, 3000);

  setTimeout(() => {
    document.getElementById("recoveryBtn").disabled = false;
    setStatus("INITIAL TEST OBSERVATION COMPLETED");
  }, 5000);
};

document.getElementById("recoveryBtn").onclick = () => {
  log("=== RECOVERY TEST ===");

  if (!popup || popup.closed) {
    setStatus("POPUP UNAVAILABLE");
    return;
  }

  try {
    log("Attempting navigation to testing.com");
    popup.location.href = "https://testing.com";
    setStatus("RECOVERY NAVIGATION REQUESTED");
  } catch (error) {
    log("Recovery error: " + error.message);
  }
};

log("Regression test initialized");
log("Initial origin: " + location.origin);
log("Initial visibility: " + document.visibilityState);
</script>

</body>
</html>
