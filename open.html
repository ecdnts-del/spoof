
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome iOS Origin Regression Lab</title>
<style>
body {
  font-family: -apple-system, sans-serif;
  padding: 20px;
}
button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 8px;
  background: #167c45;
  color: white;
  font-size: 16px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #eee;
  padding: 12px;
}
</style>
</head>
<body>

<h2>Download Origin Regression Lab</h2>
<p>Chrome iOS security UI testing</p>

<button onclick="test('normal')">
  T01 - Normal filename
</button>

<button onclick="test('long')">
  T02 - Long filename
</button>

<button onclick="test('unicode')">
  T03 - Unicode whitespace
</button>

<button onclick="test('invisible')">
  T04 - Invisible characters
</button>

<button onclick="test('mixed')">
  T05 - Mixed Unicode
</button>

<pre id="result">Waiting for test...</pre>

<script>
function test(type) {
  const cases = {
    normal: "normal-download.txt",

    long: "long-".repeat(60) + ".txt",

    unicode:
      "test-\u3164\u3164\u3164.txt",

    invisible:
      "test-\u200B\u2060\u200B.txt",

    mixed:
      "test-\u3164\u200B\u2060\u2800.txt"
  };

  const filename = cases[type];

  const content =
    "Harmless Chrome download regression test.\n";

  const blob = new Blob(
    [content],
    { type: "text/plain" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  document.getElementById("result").textContent =
    "Test: " + type +
    "\nFilename: " + filename +
    "\nExpected: Origin remains visible.";

  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
</script>

</body>
</html>
