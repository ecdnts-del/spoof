
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Regression Testing</title>

<style>
html, body {
  margin: 0;
  min-height: 100%;
  background: #fff;
  font-family: Arial, sans-serif;
}

#startBtn {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 32px;
  background: #007aff;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
}

#log {
  margin-top: 20px;
  padding: 12px;
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #00ff90;
  background: #111;
}
</style>
</head>

<body>

<button id="startBtn">START TEST</button>
<pre id="log"></pre>

<script>
const log = (message) => {
  document.getElementById("log").textContent +=
    new Date().toISOString() + " | " + message + "\n";
};

document.getElementById("startBtn").onclick = function () {
  this.remove();

  log("TEST STARTED");
  log("Parent URL: " + location.href);

  const w = window.open("about:blank", "_blank");

  if (!w) {
    log("Popup blocked");
    return;
  }

  log("New WebState opened");

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>TESTING</title>
    </head>
    <body style="
      margin:0;
      padding:30px;
      text-align:center;
      font-family:Arial;
    ">
      <h1 style="color:red">TESTING</h1>
      <h2>Chromium iOS Security Test</h2>
      <p>Navigation lifecycle regression test.</p>
    </body>
    </html>
  `);

  w.document.close();

  log("HTML injected successfully");

  w.addEventListener("pagehide", () => {
    log("Popup pagehide");
  });

  w.addEventListener("pageshow", () => {
    log("Popup pageshow");
  });

  w.addEventListener("beforeunload", () => {
    log("Popup beforeunload");
  });

  setTimeout(() => {
    try {
      log("Testing navigation to x.com");
      w.location.href = "https://x.com";
    } catch (e) {
      log("Navigation error: " + e.name);
    }
  }, 1000);

  setTimeout(() => {
    try {
      log("Testing invalid-port navigation");
      w.location.href = "https://www.google.com:1234";
    } catch (e) {
      log("Invalid-port error: " + e.name);
    }
  }, 5000);

  setTimeout(() => {
    log("Popup closed: " + w.closed);

    try {
      log("Popup URL: " + w.location.href);
    } catch (e) {
      log("Cross-origin access: " + e.name);
    }
  }, 8000);

  setTimeout(() => {
    log("Testing JavaScript dialog policy");

    try {
      w.alert("TESTING ALERT");
      log("Alert returned");
    } catch (e) {
      log("Alert error: " + e.name);
    }
  }, 10000);

  setTimeout(() => {
    log("TEST COMPLETED");
  }, 12000);
};

document.addEventListener("visibilitychange", () => {
  log("Parent visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});
</script>

</body>
</html>
