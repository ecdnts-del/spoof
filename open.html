
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Testing</title>

<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #222;
  }

  button {
    display: block;
    margin: 35vh auto 24px;
    padding: 16px 36px;
    border: 0;
    border-radius: 10px;
    background: #007aff;
    color: white;
    font-size: 18px;
  }

  #log {
    padding: 12px;
    background: #111;
    color: #00ff90;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 40vh;
    overflow-y: auto;
  }
</style>
</head>

<body>

<button id="startBtn">START TESTING</button>

<pre id="log"></pre>

<script>
const output = document.getElementById("log");

function log(message) {
  output.textContent +=
    new Date().toISOString() +
    " | " + message + "\n";
}

document.getElementById("startBtn").onclick = async function () {
  this.disabled = true;

  log("TESTING STARTED");
  log("Initial URL: " + location.href);
  log("Initial origin: " + location.origin);

  const popup = window.open("about:blank", "_blank");

  if (!popup) {
    log("RESULT: Popup blocked");
    this.disabled = false;
    return;
  }

  log("New WebState requested");

  popup.document.write(`
    <!doctype html>
    <html>
    <head>
      <title>TESTING</title>
    </head>
    <body style="font-family:Arial;text-align:center;padding:30px">
      <h1 style="color:#007aff">TESTING</h1>
      <h2>Chromium iOS Regression</h2>
      <p>Navigation lifecycle observation</p>
    </body>
    </html>
  `);

  popup.document.close();

  log("Document injection completed");

  popup.addEventListener("pagehide", () => {
    log("Popup: pagehide");
  });

  popup.addEventListener("pageshow", () => {
    log("Popup: pageshow");
  });

  popup.addEventListener("visibilitychange", () => {
    log("Popup visibility: " +
        popup.document.visibilityState);
  });

  setTimeout(() => {
    try {
      log("Testing invalid-port navigation");

      popup.location.href =
        "http://127.0.0.1:65536/";

      log("Navigation request submitted");
    } catch (error) {
      log("Navigation exception: " + error.name);
    }
  }, 1000);

  setTimeout(() => {
    try {
      log("Popup closed: " + popup.closed);
      log("Popup current URL: " + popup.location.href);
    } catch (error) {
      log("URL inaccessible: " + error.name);
    }
  }, 3000);

  setTimeout(() => {
    log("Testing active-tab JavaScript dialog");

    try {
      const result = window.confirm(
        "TESTING: JavaScript dialog regression check"
      );

      log("Confirm result: " + result);
    } catch (error) {
      log("Dialog exception: " + error.name);
    }
  }, 4000);

  setTimeout(() => {
    log("TESTING COMPLETED");
  }, 6000);
};

document.addEventListener("visibilitychange", () => {
  log("Parent visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});

window.addEventListener("pageshow", () => {
  log("Parent pageshow");
});
</script>

</body>
</html>
