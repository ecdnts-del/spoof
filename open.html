
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing - Chromium Regression</title>
<style>
html,body {
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#fff;
}
#startBtn {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:16px 32px;
  background:#007aff;
  color:white;
  border:0;
  border-radius:10px;
  font-size:18px;
}
#log {
  margin-top:20px;
  padding:12px;
  background:#111;
  color:#00ff90;
  font-size:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<button id="startBtn">START TEST</button>
<pre id="log"></pre>

<script>
const log = message => {
  document.getElementById("log").textContent +=
    new Date().toISOString() + " | " + message + "\n";
};

document.getElementById("startBtn").onclick = function() {
  this.remove();

  log("TEST STARTED");
  log("Browser: " + navigator.userAgent);

  const w = window.open("about:blank", "_blank");

  if (!w) {
    log("Popup blocked");
    return;
  }

  log("New browsing context created");

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head><title>TESTING</title></head>
    <body style="font-family:Arial;text-align:center;padding:30px">
      <h1 style="color:red">TESTING</h1>
      <h2>Navigation Regression Test</h2>
      <p>Initial document rendered.</p>
      <p id="state">Waiting for navigation...</p>
    </body>
    </html>
  `);

  w.document.close();

  log("Initial document written");

  w.addEventListener("pagehide", () =>
    log("PAGEHIDE detected")
  );

  w.addEventListener("pageshow", () =>
    log("PAGESHOW detected")
  );

  w.addEventListener("beforeunload", () =>
    log("BEFOREUNLOAD detected")
  );

  w.addEventListener("load", () =>
    log("LOAD event detected")
  );

  setTimeout(() => {
    log("Starting navigation to x.com");

    try {
      w.location.assign("https://x.com/");
    } catch(e) {
      log("Navigation exception: " + e.name);
    }
  }, 1000);

  setTimeout(() => {
    log("Checking browsing context");

    try {
      log("Closed: " + w.closed);
      log("URL: " + w.location.href);
    } catch(e) {
      log("Cross-origin restriction: " + e.name);
    }
  }, 5000);

  setTimeout(() => {
    log("TEST COMPLETED");
  }, 10000);
};

document.addEventListener("visibilitychange", () => {
  log("Parent visibility: " + document.visibilityState);
});
</script>
</body>
</html>
