
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhafy.test - Security Test</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff;
  color: #202124;
}

header {
  padding: 18px 22px;
  border-bottom: 1px solid #eee;
  font-size: 20px;
  font-weight: 600;
}

main {
  padding: 30px 22px;
}

h2 {
  font-size: 24px;
  font-weight: 500;
}

p {
  color: #5f6368;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: 0;
  border-radius: 25px;
  background: #1a73e8;
  color: white;
  font-size: 16px;
}

.card {
  margin-top: 25px;
  padding: 18px;
  background: #f8f9fa;
  border-radius: 12px;
}

footer {
  margin-top: 60px;
  text-align: center;
  color: #80868b;
  font-size: 12px;
}
</style>
</head>

<body>

<header>dhafy.test</header>

<main>
  <h2>Browser Security Test</h2>

  <p>
    iOS Chrome Blob URL and History API
    security regression test.
  </p>

  <div class="card">
    <strong>Target:</strong> dhafy.test
    <br><br>
    <strong>Test:</strong> Blob URL origin handling
  </div>

  <button id="start">
    Start Test
  </button>

  <footer>
    Security Research PoC
  </footer>
</main>

<script>
document.getElementById("start").addEventListener("click", () => {
  const page = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"
            content="width=device-width, initial-scale=1">
      <title>dhafy.test</title>
      <style>
        body {
          font-family: -apple-system, sans-serif;
          padding: 28px;
          color: #202124;
        }
        h2 { font-weight: 500; }
      </style>
    </head>
    <body>
      <h2>dhafy.test</h2>
      <p>Blob document loaded successfully.</p>
      <p>iOS Chrome security regression test.</p>
    </body>
    </html>
  `;

  const blob = new Blob([page], {
    type: "text/html"
  });

  const url = URL.createObjectURL(blob);

  location.assign(url);
});
</script>

</body>
</html>
