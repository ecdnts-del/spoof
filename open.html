
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Blob URL Regression Test</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    margin: 24px;
    background: #111;
    color: #eee;
  }

  h2 { font-size: 20px; }

  #status {
    margin-top: 24px;
    padding: 18px;
    border-radius: 10px;
    background: #222;
  }

  button {
    padding: 12px 20px;
    border: 0;
    border-radius: 8px;
    background: #4285f4;
    color: white;
    font-size: 16px;
  }
</style>
</head>
<body>

<h2>Blob URL Security Regression</h2>

<p>Chromium iOS navigation validation test.</p>

<button id="run">Run Test</button>

<div id="status">
  Waiting for test...
</div>

<script>
(() => {
  const status = document.getElementById("status");

  function result(message, success) {
    status.textContent = message;
    status.style.border =
      success ? "1px solid #16a34a" : "1px solid #dc2626";
  }

  document.getElementById("run").onclick = () => {
    const originalURL = location.href;

    try {
      const foreignURL =
        "blob:https://accounts.google.com/test";

      let rejected = false;

      try {
        history.replaceState(
          {},
          "",
          foreignURL
        );
      } catch (e) {
        rejected = true;
      }

      const unchanged = location.href === originalURL;

      if (rejected && unchanged) {
        result(
          "PASS: Cross-origin history modification rejected.",
          true
        );
      } else if (unchanged) {
        result(
          "INCONCLUSIVE: URL unchanged; inspect browser behavior.",
          true
        );
      } else {
        result(
          "FAIL: Current URL changed unexpectedly.",
          false
        );
      }

    } catch (e) {
      result("Test error: " + e.message, false);
    }
  };
})();
</script>

</body>
</html>
