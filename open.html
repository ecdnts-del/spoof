
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium Drag Drop Regression</title>
<style>
* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  display:grid;
  place-items:center;
}

main {
  width:min(90%,420px);
  background:white;
  padding:28px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 5px 25px #0002;
}

button {
  background:#007aff;
  color:white;
  border:0;
  padding:15px 30px;
  border-radius:10px;
  font-size:17px;
}

#status {
  margin-top:20px;
  padding:14px;
  background:#111;
  color:#00ff90;
  overflow-wrap:anywhere;
  font-size:13px;
}

iframe {
  width:100%;
  height:100px;
  border:1px solid #ddd;
  margin-top:20px;
}
</style>
</head>
<body>
<main>
  <h2>Chromium Security Test</h2>
  <p>Invalid-port navigation regression test</p>

  <button id="start">START TEST</button>

  <iframe id="testFrame"
    title="Drag and drop test"
    sandbox="allow-scripts allow-popups"
    srcdoc="<p>Controlled test frame</p>">
  </iframe>

  <div id="status">Ready</div>
</main>

<script>
const status = document.getElementById("status");

function report(message) {
  status.textContent = message;
}

document.getElementById("start").onclick = () => {
  report("Starting regression test...");

  const w = window.open("about:blank", "_blank");

  if (!w) {
    report("Popup blocked by browser");
    return;
  }

  w.document.write(`
    <!doctype html>
    <html>
    <head>
      <title>Controlled Test Page</title>
    </head>
    <body style="font-family:Arial;text-align:center;padding:30px">
      <h1>Controlled Test Document</h1>
      <p>Navigation lifecycle test</p>
      <p id="state">Initial document active</p>
    </body>
    </html>
  `);

  w.document.close();

  report("Initial document created");

  setTimeout(() => {
    try {
      w.location.href = "https://example.com:81/";
      report("Invalid-port navigation requested");
    } catch (e) {
      report("Navigation exception: " + e.name);
    }
  }, 1000);

  setTimeout(() => {
    report(
      "Window closed: " + w.closed +
      " | Check browser address bar and document state manually."
    );
  }, 5000);
};
</script>
</body>
</html>
