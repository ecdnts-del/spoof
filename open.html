
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome iOS Download Origin Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      text-align: center;
    }

    button {
      background: #16834a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }

    .info {
      margin-top: 24px;
      padding: 14px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>

  <h2>Download Origin Regression Test</h2>

  <p>
    Testing Unicode filename handling
    in Chrome for iOS.
  </p>

  <button onclick="runTest()">
    Start Download Test
  </button>

  <div class="info">
    <strong>Test configuration</strong>
    <p>Unicode: U+3164, U+200B, U+2060</p>
    <p>Expected: Actual download origin remains visible.</p>
  </div>

  <script>
    function runTest() {
      const filename =
        "unicode-test-\u3164\u200B\u2060.txt";

      const content =
        "Chrome iOS download origin regression test.\n" +
        "This file is harmless.";

      const blob = new Blob(
        [content],
        { type: "text/plain" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 5000);
    }
  </script>

</body>
</html>
