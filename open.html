<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Regression Test</title>

<style>
  body {
    margin: 0;
    background: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  button {
    margin-top: 40vh;
    padding: 16px 32px;
    background: #007aff;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
  }

  #log {
    padding: 20px;
    text-align: left;
    overflow-wrap: anywhere;
  }
</style>
</head>

<body>

<h2>Chromium iOS Regression Test</h2>

<button id="start">START TEST</button>

<pre id="log"></pre>

<script>
const log = (message) => {
  document.getElementById("log").textContent +=
    new Date().toISOString() + " | " + message + "\n";
};

document.getElementById("start").onclick = () => {
  log("Test started");

  const popup = window.open("about:blank", "_blank");

  if (!popup) {
    log("Popup blocked");
    return;
  }

  log("New WebState opened");

  popup.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Security Test</title>
    </head>
    <body style="
      font-family:Arial;
      text-align:center;
      padding:30px;
    ">
      <h1>TESTING SECURITY TEST</h1>
      <h2>WebState Navigation Test</h2>
      <p>Testing Chromium iOS dialog handling.</p>
    </body>
    </html>
  `);

  popup.document.close();

  log("Test document injected");

  setTimeout(() => {
    try {
      popup.location.href = "https://testing.com:9090/login";
      log("Navigation requested");
    } catch (e) {
      log("Navigation error: " + e.message);
    }
  }, 1000);

  setTimeout(() => {
    log("Testing JavaScript dialog policy");

    try {
      const result = popup.eval(
        "window.prompt('Chromium security regression test')"
      );

      log("Prompt returned: " + String(result));
    } catch (e) {
      log("Prompt exception: " + e.message);
    }
  }, 2000);

  setTimeout(() => {
    log("Regression test observation completed");
  }, 5000);
};
</script>

</body>
</html>
