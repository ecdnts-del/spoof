
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Navigation Loop</title>
<style>
html,body {
  margin:0;
  height:100%;
  font-family:Arial,sans-serif;
  background:white;
}
button {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:16px 32px;
  border:0;
  border-radius:10px;
  background:#007aff;
  color:white;
  font-size:18px;
}
</style>
</head>
<body>

<button id="start">START TEST</button>

<script>
document.getElementById("start").onclick = () => {
  const w = window.open("about:blank", "_blank");
  if (!w) return;

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <body style="font-family:Arial;text-align:center;padding:30px">
      <h1>TESTING</h1>
      <p>Navigation regression test</p>
    </body>
    </html>
  `);
  w.document.close();

  let count = 0;
  const max = 1000;

  const navigate = () => {
    if (w.closed || count >= max) return;

    count++;

    try {
      w.location.replace("https://x.com:9090");
    } catch (e) {
      return;
    }

    setTimeout(navigate, 1000);
  };

  setTimeout(navigate, 1500);
};
</script>

</body>
</html>
