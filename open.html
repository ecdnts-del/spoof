
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Testing</title>

<style>
  html, body {
    margin: 0;
    padding: 20px;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: white;
  }

  button {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 32px;
    border: 0;
    border-radius: 10px;
    background: #007aff;
    color: white;
    font-size: 18px;
  }

  #log {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 35%;
    overflow-y: auto;
    background: #111;
    color: #00ff90;
    padding: 12px;
    font-size: 11px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>

<body>

<button id="startBtn">START TESTING</button>
<pre id="log"></pre>

<script>
const logElement = document.getElementById("log");

function log(message) {
  logElement.textContent +=
    new Date().toISOString() +
    " | " + message + "\n";
}

document.getElementById("startBtn").onclick = function () {
  this.disabled = true;

  log("TESTING STARTED");
  log("Parent URL: " + location.href);

  const newTab = window.open("about:blank", "_blank");

  if (!newTab) {
    log("ERROR: Popup blocked");
    this.disabled = false;
    return;
  }

  log("New tab opened");

  newTab.document.write(`
    <!doctype html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>TESTING</title>
    </head>
    <body style="
      margin:0;
      padding:30px;
      text-align:center;
      font-family:Arial;
      background:white;
    ">
      <h1 style="color:#007aff">
        TESTING SECURITY TEST
      </h1>

      <h2>Chromium iOS Navigation Test</h2>

      <p>Observing WebState lifecycle and navigation.</p>
    </body>
    </html>
  `);

  newTab.document.close();

  log("Test document injected");

  newTab.addEventListener("pagehide", () => {
    log("EVENT: pagehide");
  });

  newTab.addEventListener("pageshow", () => {
    log("EVENT: pageshow");
  });

  setTimeout(() => {
    try {
      log("NAVIGATION: https://testing.com");

      newTab.location.href = "https://testing.com";
    } catch (error) {
      log("Navigation error: " + error.name);
    }
  }, 1000);

  setTimeout(() => {
    log("Checking popup state");
    log("Popup closed: " + newTab.closed);

    try {
      log("Popup URL: " + newTab.location.href);
    } catch (error) {
      log("Cross-origin restriction: " + error.name);
    }
  }, 3000);

  setTimeout(() => {
    log("TESTING OBSERVATION COMPLETED");
  }, 6000);
};

document.addEventListener("visibilitychange", () => {
  log("Parent visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});

window.addEventListener("pageshow", () => {
  log("Parent pageshow");
});
</script>

</body>
</html>
