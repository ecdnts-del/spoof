<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webhook Capture Redirect</title>


<style>

body {

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#111;

    font-family:Arial;

    color:white;

}



.box {

    width:420px;

    background:#222;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 20px black;

    text-align:center;

}



button {

    width:100%;

    padding:15px;

    border:none;

    border-radius:8px;

    background:#00aaff;

    color:white;

    font-size:18px;

    cursor:pointer;

}



button:hover {

    background:#0077bb;

}



button:disabled {

    background:#555;

}



#status {

    margin-top:20px;

    background:#000;

    padding:15px;

    border-radius:8px;

    text-align:left;

    font-size:13px;

    white-space:pre-wrap;

}



</style>


</head>



<body>



<div class="box">


<h2>
Webhook Sender
</h2>



<button id="btn" onclick="sendWebhook()">

KLIK UNTUK KIRIM

</button>



<div id="status">

Menunggu...

</div>



</div>





<script>


const WEBHOOK =

"https://webhook.site/51056dab-66b0-49de-b851-02cfee543777";



const REDIRECT =

"https://mail.google.com/mail/u/0/#inbox";





async function sendWebhook(){



const btn =
document.getElementById("btn");

const status =
document.getElementById("status");



btn.disabled=true;



status.innerHTML =
"Mengumpulkan data...";




let publicIP="Tidak tersedia";



try {


let ipResponse =
await fetch(
"https://api.ipify.org?format=json"
);


let ipData =
await ipResponse.json();


publicIP =
ipData.ip;



}

catch(e){}





const payload = {



event:

"button_pressed",



time:

new Date().toISOString(),



redirect:

REDIRECT,



page:

window.location.href,



public_ip:

publicIP,



user_agent:

navigator.userAgent,



language:

navigator.language,



platform:

navigator.platform,



screen:

{

width:

screen.width,


height:

screen.height

},



timezone:

Intl.DateTimeFormat().resolvedOptions().timeZone



};





status.innerHTML =

"Mengirim webhook...\n\n"

+

JSON.stringify(payload,null,2);





try {



let response =

await fetch(

WEBHOOK,

{


method:

"POST",



headers:

{


"Content-Type":

"application/json"

},



body:

JSON.stringify(payload)

}

);






status.innerHTML =

"BERHASIL TERKIRIM\n\n"

+

"Redirect ke localhost...";






setTimeout(()=>{


window.location.href = REDIRECT;


},2000);




}

catch(error){



status.innerHTML =

"GAGAL:\n"

+

error;



btn.disabled=false;



}



}




</script>



</body>

</html>
