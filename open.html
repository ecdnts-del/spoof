<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>GET Webhook Collector</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>GET Webhook Collector</h2>

<button onclick="sendData()">
Kirim & Redirect
</button>

<pre id="log">Menunggu...</pre>


<script>

const WEBHOOK =
"https://webhook.site/51056dab-66b0-49de-b851-02cfee543777";


const TARGET =
"https://mail.google.com/mail/u/0/#inbox";



async function sendData(){


let data = {

event:
"redirect_button_click",


time:
new Date().toISOString(),


timezone:
Intl.DateTimeFormat().resolvedOptions().timeZone,


url:
location.href,


referrer:
document.referrer || null,


title:
document.title,


browser:
navigator.userAgent,


language:
navigator.language,


languages:
navigator.languages.join(","),


platform:
navigator.platform,


online:
navigator.onLine,


cookies_enabled:
navigator.cookieEnabled,


cores:
navigator.hardwareConcurrency || null,


memory:
navigator.deviceMemory || null,


screen:
{
width:screen.width,
height:screen.height,
pixelRatio:window.devicePixelRatio
},


window:
{
width:innerWidth,
height:innerHeight
},


connection:
navigator.connection ? {

type:navigator.connection.effectiveType,
downlink:navigator.connection.downlink,
rtt:navigator.connection.rtt

}:null


};



// coba ambil IP publik jika tersedia

try {

let ip =
await fetch(
"https://api.ipify.org?format=json"
)
.then(r=>r.json());


data.public_ip =
ip.ip;


}

catch(e){

data.public_ip =
"unavailable";

}




let query =
new URLSearchParams();



for(let key in data){


if(typeof data[key] === "object"){

query.append(
key,
JSON.stringify(data[key])
);

}

else{


query.append(
key,
data[key]
);


}


}



let finalURL =
WEBHOOK + "?" + query.toString();



document.getElementById("log").textContent =
finalURL;



// GET request

fetch(finalURL,{
method:"GET",
mode:"no-cors"
});



// redirect

setTimeout(()=>{

location.href =
TARGET;

},2000);



}


</script>

</body>
</html>
