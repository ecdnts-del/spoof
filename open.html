<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium iOS Security Regression Test</title>

<style>
body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #222;
}

button {
  padding: 14px 20px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #007aff;
  color: white;
  font-size: 15px;
}

#log {
  background: #111;
  color: #00ff90;
  padding: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 200px;
}
</style>
</head>

<body>

<h2>Chromium iOS Security Test</h2>

<p>Origin: testing.com</p>

<button onclick="runTest()">START TEST</button>
<button onclick="testDialogs()">TEST DIALOGS</button>
<button onclick="testNavigation()">TEST NAVIGATION</button>

<pre id="log"></pre>

<script>
const log = (message) => {
  const output = document.getElementById("log");

  output.textContent +=
    new Date().toISOString() +
    " | " + message + "\n";
};

document.addEventListener("visibilitychange", () => {
  log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Page hidden");
});

window.addEventListener("pageshow", () => {
  log("Page shown");
});

function runTest() {
  log("=== TEST STARTED ===");
  log("Current origin: " + location.origin);
  log("Current URL: " + location.href);
  log("Visibility: " + document.visibilityState);
}

function testDialogs() {
  log("=== JAVASCRIPT DIALOG TEST ===");

  try {
    alert("Testing Chromium alert handling");
    log("Alert returned");
  } catch (e) {
    log("Alert error: " + e.message);
  }

  try {
    const result = confirm("Testing confirm handling");
    log("Confirm result: " + result);
  } catch (e) {
    log("Confirm error: " + e.message);
  }

  try {
    const result = prompt("Testing prompt handling");
    log("Prompt result: " + String(result));
  } catch (e) {
    log("Prompt error: " + e.message);
  }

  log("Dialog test completed");
}

function testNavigation() {
  log("=== NAVIGATION TEST ===");

  log("Navigation starting");

  location.assign("https://testing.com");

  log("Navigation request submitted");
}

log("Regression test initialized");
log("Origin: " + location.origin);
</script>

</body>
</html>
