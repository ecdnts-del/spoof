
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Blob Origin Regression PoC</title>

<style>
body {
  font-family: -apple-system, Arial, sans-serif;
  background: #f1f3f4;
  color: #202124;
  padding: 18px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
}
button {
  width: 100%;
  padding: 13px;
  margin: 5px 0;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
  font-size: 15px;
}
pre {
  background: #202124;
  color: #a5f3a5;
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}
</style>
</head>

<body>

<h2>Chromium Blob Origin Test</h2>

<div class="card">
  <h3>Environment</h3>
  <pre id="environment"></pre>
</div>

<div class="card">
  <h3>Origin tests</h3>
  <button onclick="testCurrentOrigin()">
    Inspect Current Origin
  </button>
  <button onclick="testSameOrigin()">
    Same-Origin replaceState
  </button>
  <button onclick="testCrossOrigin()">
    Cross-Origin replaceState
  </button>
  <button onclick="testBlobCreation()">
    Create Blob URL
  </button>
  <button onclick="downloadResults()">
    Download Results
  </button>
</div>

<div class="card">
  <h3>Test results</h3>
  <pre id="results"></pre>
</div>

<script>
const results = [];

function record(test, result, details = {}) {
  const item = {
    timestamp: new Date().toISOString(),
    test,
    result,
    details
  };

  results.push(item);

  document.getElementById("results").textContent =
    JSON.stringify(results, null, 2);
}

function inspectOrigin() {
  return {
    href: location.href,
    origin: location.origin,
    protocol: location.protocol,
    hostname: location.hostname,
    historyLength: history.length,
    userAgent: navigator.userAgent
  };
}

function testCurrentOrigin() {
  record(
    "CURRENT_ORIGIN",
    "OBSERVED",
    inspectOrigin()
  );
}

function testSameOrigin() {
  try {
    const url = new URL(location.href);

    history.replaceState(
      { test: "same-origin" },
      "",
      url.href
    );

    record(
      "SAME_ORIGIN",
      "ACCEPTED",
      inspectOrigin()
    );
  } catch (e) {
    record(
      "SAME_ORIGIN",
      "REJECTED",
      {
        name: e.name,
        message: e.message
      }
    );
  }
}

function testCrossOrigin() {
  try {
    history.replaceState(
      { test: "cross-origin" },
      "",
      "https://example.com/test"
    );

    record(
      "CROSS_ORIGIN",
      "UNEXPECTED_ACCEPTANCE",
      inspectOrigin()
    );
  } catch (e) {
    record(
      "CROSS_ORIGIN",
      "REJECTED",
      {
        name: e.name,
        message: e.message,
        currentOrigin: location.origin
      }
    );
  }
}

function testBlobCreation() {
  const html = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Blob Test</title>
    </head>
    <body>
      <h2>Blob document</h2>
      <pre id="info"></pre>
      <script>
        document.getElementById("info").textContent =
          JSON.stringify({
            href: location.href,
            origin: location.origin,
            protocol: location.protocol
          }, null, 2);
      <\/script>
    </body>
    </html>
  `;

  const blob = new Blob(
    [html],
    { type: "text/html" }
  );

  const url = URL.createObjectURL(blob);

  record(
    "BLOB_CREATED",
    "SUCCESS",
    {
      blobURL: url,
      creatorOrigin: location.origin
    }
  );

  const link = document.createElement("a");
  link.href = url;
  link.textContent = "Open isolated Blob test document";
  link.style.display = "block";

  document.querySelector(".card").appendChild(link);
}

function downloadResults() {
  const blob = new Blob(
    [JSON.stringify(results, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "chromium-origin-results.json";
  link.click();

  URL.revokeObjectURL(url);
}

document.getElementById("environment").textContent =
  JSON.stringify({
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    screen: {
      width: screen.width,
      height: screen.height
    },
    viewport: {
      width: innerWidth,
      height: innerHeight
    }
  }, null, 2);

record("INITIALIZED", "SUCCESS", inspectOrigin());
</script>

</body>
</html>
