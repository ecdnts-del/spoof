
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium iOS Drag Drop Regression</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 45px 16px;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

.container {
  max-width: 440px;
  margin: auto;
  padding: 25px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 20px #0002;
  text-align: center;
}

button {
  padding: 15px 30px;
  border: 0;
  border-radius: 9px;
  background: #007aff;
  color: white;
  font-size: 17px;
}

iframe {
  width: 100%;
  height: 110px;
  margin-top: 20px;
  border: 1px solid #ddd;
}

#drop {
  margin-top: 20px;
  padding: 35px 10px;
  border: 2px dashed #aaa;
  color: #555;
}

#status {
  margin-top: 20px;
  padding: 12px;
  background: #111;
  color: #00ff90;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Chromium Security Regression</h2>

  <p>Drag-and-drop navigation test</p>

  <button id="start">START TEST</button>

  <iframe id="frame" title="Controlled drag test"></iframe>

  <div id="drop">Drop area</div>

  <pre id="status">Ready</pre>
</div>

<script>
const status = document.getElementById("status");
const frame = document.getElementById("frame");

function log(message) {
  status.textContent +=
    "\n" + new Date().toISOString() + " | " + message;
}

frame.srcdoc = `
<!DOCTYPE html>
<html>
<body style="
  font-family:Arial;
  text-align:center;
  padding:15px;
">
  <a
    href="https://example.com:81/"
    draggable="true"
    id="testLink"
    style="
      display:block;
      padding:20px;
      font-size:24px;
      font-weight:bold;
      color:#2563eb;
    "
  >DRAG TEST LINK</a>

  <script>
    document.getElementById("testLink")
      .addEventListener("dragstart", function() {
        parent.postMessage(
          {type:"DRAG_STARTED"},
          "*"
        );
      });
  <\/script>
</body>
</html>
`;

window.addEventListener("message", event => {
  if (event.source !== frame.contentWindow) return;

  if (event.data?.type === "DRAG_STARTED") {
    log("Iframe drag started");
  }
});

document.addEventListener("visibilitychange", () => {
  log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
  log("Parent pagehide");
});

window.addEventListener("pageshow", event => {
  log("Parent pageshow; persisted=" + event.persisted);
});

document.getElementById("start").onclick = () => {
  log("TEST STARTED");
  log("Browser URL: " + location.href);

  const w = window.open("about:blank", "_blank");

  if (!w) {
    log("Popup blocked");
    return;
  }

  log("Test WebState opened");

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head><title>Controlled Test</title></head>
    <body style="font-family:Arial;padding:25px">
      <h1>Controlled Test Document</h1>
      <p id="result">Initial document active</p>
    </body>
    </html>
  `);

  w.document.close();

  log("Initial document created");

  w.addEventListener("pagehide", () => {
    log("Test pagehide");
  });

  w.addEventListener("pageshow", event => {
    log("Test pageshow; persisted=" + event.persisted);
  });

  w.addEventListener("beforeunload", () => {
    log("Test beforeunload");
  });

  setTimeout(() => {
    try {
      log("Requesting invalid-port navigation");

      w.location.href = "https://example.com:81/";
    } catch (error) {
      log("Navigation error: " + error.name);
    }
  }, 1500);

  setTimeout(() => {
    log("Popup closed: " + w.closed);

    try {
      log("Popup URL: " + w.location.href);
    } catch (error) {
      log("Cross-origin restriction: " + error.name);
    }

    log("TEST OBSERVATION POINT");
  }, 8000);
};
</script>

</body>
</html>
