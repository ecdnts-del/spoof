
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>iOS Chrome Blob Origin Regression Test</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont,
               Arial, sans-serif;
  margin: 24px;
  color: #202124;
}

h2 { font-size: 20px; }

button {
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
  font-size: 15px;
  margin: 5px 0;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f1f3f4;
  padding: 14px;
  border-radius: 8px;
  font-size: 12px;
}

.pass { color: #188038; }
.fail { color: #d93025; }
</style>
</head>

<body>

<h2>Blob Origin Security Regression Test</h2>

<p>
  Tests browser handling of blob URLs and History API
  origin restrictions.
</p>

<button id="run">Run regression test</button>

<pre id="output">Ready.</pre>

<script>
const output = document.getElementById("output");

function log(message) {
  output.textContent += "\n" + message;
}

async function runTest() {
  output.textContent = "Starting tests...\n";

  log("User agent: " + navigator.userAgent);
  log("Platform: " + navigator.platform);
  log("Current URL: " + location.href);
  log("Current origin: " + location.origin);

  // Test 1: Blob URL creation
  const blob = new Blob([
    "<!doctype html><html><body>",
    "<h2>Blob document test</h2>",
    "<p>Regression test document.</p>",
    "</body></html>"
  ], {
    type: "text/html"
  });

  const blobURL = URL.createObjectURL(blob);

  log("\n[TEST 1] Blob URL creation");
  log("Blob URL: " + blobURL);

  // Test 2: URL origin parsing
  log("\n[TEST 2] Origin information");

  const parsed = new URL(blobURL);

  log("Protocol: " + parsed.protocol);
  log("Origin: " + parsed.origin);

  // Test 3: Same-origin replaceState
  log("\n[TEST 3] Same-origin replaceState");

  try {
    history.replaceState(
      { regression: true },
      "",
      location.pathname + location.search
    );

    log("PASS: Same-origin replaceState accepted");
  } catch (e) {
    log("FAIL: " + e.name + ": " + e.message);
  }

  // Test 4: Cross-origin replaceState
  log("\n[TEST 4] Cross-origin replaceState");

  try {
    history.replaceState(
      {},
      "",
      "https://example.com/regression-test"
    );

    log("FAIL: Cross-origin URL was accepted");
  } catch (e) {
    log("PASS: Cross-origin URL rejected");
    log("Exception: " + e.name);
  }

  log("\n[TEST 5] Browser-visible state");
  log("Current URL: " + location.href);
  log("Current origin: " + location.origin);

  log("\nCompleted.");
}

document.getElementById("run")
  .addEventListener("click", runTest);
</script>

</body>
</html>
