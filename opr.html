<!doctype html>
<html>
<body>

<h2>Mic Test</h2>

<button id="go">Enable Microphone</button>

<pre id="out"></pre>

<script>

const out = document.getElementById("out");

document.getElementById("go").onclick = async () => {

out.textContent =
"Origin: " + location.origin +
"\nSecure: " + window.isSecureContext +
"\nRequesting...";


try {

const stream =
await navigator.mediaDevices.getUserMedia({
    audio: true
});


out.textContent +=
"\n\nSUCCESS";
    
stream.getTracks().forEach(t=>t.stop());


} catch(err) {


out.textContent +=
"\n\nFAILED" +
"\nName: " + err.name +
"\nMessage: " + err.message;


}

};

</script>

</body>
</html>
