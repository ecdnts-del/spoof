<!doctype html>
<html>
<body>

<h3>Microphone Permission PoC</h3>

<button id="mic">Request Mic</button>

<pre id="out"></pre>

<script>
const out = document.getElementById("out");

document.getElementById("mic").onclick = async () => {
  out.textContent = "Requesting microphone...\n";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    out.textContent += "Permission: GRANTED\n";

    stream.getTracks().forEach(track => {
      track.stop();
    });

  } catch (e) {
    out.textContent +=
      "Permission failed\n" +
      e.name + ": " + e.message;
  }
};
</script>

</body>
</html>
