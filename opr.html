
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Overlay</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    #openBtn {
      margin: 20px;
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #widget {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: none;
      z-index: 999999;
      background: #111827;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #widget.active {
      display: flex;
    }

    #closeBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      background: #ef4444;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="openBtn">Buka Widget</button>

  <div id="widget">
    <button id="closeBtn">Tutup ✕</button>
    <h1>Widget Terbuka</h1>
    <p>Overlay menutupi area halaman.</p>
  </div>

  <script>
    const widget = document.getElementById("widget");

    document.getElementById("openBtn").onclick = () => {
      widget.classList.add("active");
    };

    document.getElementById("closeBtn").onclick = () => {
      widget.classList.remove("active");
    };
  </script>

</body>
</html>
