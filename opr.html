
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open New Tab</title>
</head>
<body>

  <button id="open">Buka Tab Baru</button>

  <script>
    document.getElementById("open").addEventListener("click", () => {
      // Buka tab baru ke example.com
      const tab = window.open("https://example.com:9099", "_blank");

      if (!tab) {
        alert("Tab baru diblokir browser.");
        return;
      }

      // Tunggu hingga halaman tujuan selesai dimuat.
      tab.addEventListener("load", () => {
        try {
          // Hanya bisa membaca atau mengubah dokumen
          // jika origin-nya sama.
          tab.document.body.innerHTML = "<h1>Halaman Baru</h1>";
        } catch (error) {
          console.log("Dokumen lintas origin tidak dapat diubah.");
        }
      });
    });
  </script>

</body>
</html>
