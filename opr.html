<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permission Origin Full Test</title>

<style>
body {
    font-family:sans-serif;
    padding:20px;
}

button {
    display:block;
    margin:10px 0;
    padding:12px;
    width:260px;
}

pre {
    background:#111;
    color:#0f0;
    padding:15px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h2>Browser Permission Origin Test</h2>

<button id="trigger">PushState /trusted</button>

<button id="origin">Check Origin</button>
<button id="geo">Geolocation</button>
<button id="mic">Microphone</button>
<button id="camera">Camera</button>
<button id="notify">Notification</button>
<button id="clipboard">Clipboard</button>

<pre id="out">Ready...</pre>


<script>

const out = document.getElementById("out");

function show(data){
    out.textContent =
    JSON.stringify(data,null,2);
}


function state(){
    return {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        secureContext: window.isSecureContext,
        time: Date.now()
    };
}


// PushState

document.getElementById("trigger").onclick = ()=>{

history.pushState({}, "", "/trusted");

show({
    api:"pushState",
    status:"done",
    ...state()
});

};


// Origin

document.getElementById("origin").onclick = ()=>{

show({
    api:"origin",
    ...state()
});

};


// Geolocation

document.getElementById("geo").onclick = ()=>{

navigator.geolocation.getCurrentPosition(

pos=>{

show({
    api:"geolocation",
    status:"granted",
    ...state()
});

},

err=>{

show({
    api:"geolocation",
    status:"failed",
    error:err.message,
    ...state()
});

}

);

};


// Microphone

document.getElementById("mic").onclick = async()=>{

try{

const stream =
await navigator.mediaDevices.getUserMedia({
    audio:true
});


show({
    api:"microphone",
    status:"granted",
    ...state()
});


stream.getTracks().forEach(t=>t.stop());


}catch(e){

show({
    api:"microphone",
    status:"failed",
    error:e.name,
    message:e.message,
    ...state()
});

}

};


// Camera

document.getElementById("camera").onclick = async()=>{

try{

const stream =
await navigator.mediaDevices.getUserMedia({
    video:true
});


show({
    api:"camera",
    status:"granted",
    ...state()
});


stream.getTracks().forEach(t=>t.stop());


}catch(e){

show({
    api:"camera",
    status:"failed",
    error:e.name,
    message:e.message,
    ...state()
});

}

};


// Notification

document.getElementById("notify").onclick = async()=>{

try{

const result =
await Notification.requestPermission();


show({
    api:"notification",
    status:result,
    ...state()
});


}catch(e){

show({
    api:"notification",
    status:"failed",
    error:e.message,
    ...state()
});

}

};


// Clipboard

document.getElementById("clipboard").onclick = async()=>{

try{

await navigator.clipboard.readText();


show({
    api:"clipboard",
    status:"granted",
    ...state()
});


}catch(e){

show({
    api:"clipboard",
    status:"failed",
    error:e.message,
    ...state()
});

}

};

</script>

</body>
</html>
