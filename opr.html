
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Scroll</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#openBtn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
  padding: 14px 22px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

#overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  background: #000;
}

#overlay.active {
  display: block;
}

#picture {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#closeBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  background: rgba(0,0,0,.7);
  color: white;
  font-size: 18px;
}

/* Area halaman agar dapat di-scroll */
#scrollArea {
  height: 300vh;
  background: #000;
}
</style>
</head>

<body>

<button id="openBtn">BUKA GAMBAR</button>

<div id="scrollArea"></div>

<div id="overlay">
  <img
    id="picture"
    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
    alt="Gambar online"
  >
  <button id="closeBtn">✕</button>
</div>

<script>
const openBtn = document.getElementById("openBtn");
const closeBtn = document.getElementById("closeBtn");
const overlay = document.getElementById("overlay");

let scrollTimer;

openBtn.addEventListener("click", () => {
  // Coba scroll halaman ke bawah untuk memicu
  // perilaku penyembunyian Omnibar pada browser.
  window.scrollTo({
    top: document.documentElement.scrollHeight,
    behavior: "smooth"
  });

  overlay.classList.add("active");

  // Ulangi scroll sebentar selama browser mengizinkan.
  clearInterval(scrollTimer);
  scrollTimer = setInterval(() => {
    window.scrollTo(
      0,
      document.documentElement.scrollHeight
    );
  }, 150);
  
  setTimeout(() => {
    clearInterval(scrollTimer);
  }, 2000);
});

closeBtn.addEventListener("click", () => {
  overlay.classList.remove("active");
  clearInterval(scrollTimer);
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
