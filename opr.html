
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Zoom Multi Scroll</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  background: #000;
  overflow-x: hidden;
  scrollbar-width: none;
}

body::-webkit-scrollbar {
  display: none;
}

#picture {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  object-fit: cover;
  z-index: 5;
  pointer-events: none;
  animation: zoom 10s ease-in-out infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(2); }
}

#scrollArea {
  height: 10000vh;
  width: 1px;
  pointer-events: none;
}
</style>
</head>

<body>

<img
  id="picture"
  src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
  alt=""
>

<div id="scrollArea"></div>

<script>
(() => {
  let previousTime = 0;

  // Kecepatan auto-scroll, dalam piksel per detik.
  const speed = 1600;

  function autoScroll(time) {
    if (document.hidden) {
      previousTime = 0;
      requestAnimationFrame(autoScroll);
      return;
    }

    if (!previousTime) previousTime = time;

    const delta = Math.min((time - previousTime) / 1000, 0.05);
    previousTime = time;

    const maxScroll =
      document.documentElement.scrollHeight -
      window.innerHeight;

    if (window.scrollY >= maxScroll - 2) {
      window.scrollTo(0, 0);
    } else {
      window.scrollBy(0, speed * delta);
    }

    requestAnimationFrame(autoScroll);
  }

  window.addEventListener("load", () => {
    requestAnimationFrame(autoScroll);
  });
})();
</script>

</body>
</html>
