<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Lock Scroll Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    background:#000;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
}

/* Video fullscreen */
.video-full{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:-1;
}

/* Halaman pertama */
.hero{
    height:100vh;
}

/* Konten */
.content{
    min-height:300vh;
    background:#fff;
    color:#111;
    padding:60px;
}
</style>
</head>

<body>

<video class="video-full" autoplay muted loop playsinline>
    <source src="Code_-_Insiders_mSfUtYR5tL.mp4" type="video/mp4">
</video>

<section class="hero"></section>

<section class="content">
    <h1>Scroll ke bawah</h1>
    <p>Setelah mulai scroll ke bawah, halaman tidak bisa kembali ke atas.</p>

    <div style="height:2500px"></div>
</section>

<script>
let locked = false;
let lockPosition = 0;

window.addEventListener("scroll", () => {

    if (!locked && window.scrollY > 0) {
        locked = true;
        lockPosition = window.scrollY;
    }

    if (locked && window.scrollY < lockPosition) {
        window.scrollTo({
            top: lockPosition,
            behavior: "instant"
        });
    }

    if (window.scrollY > lockPosition) {
        lockPosition = window.scrollY;
    }

});
</script>

</body>
</html>
