
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tapjacking & Double-Tap Lab</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }

        h1 {
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        code {
            background: #2d2d2d;
            color: #ff8a80;
            padding: 2px 4px;
            border-radius: 6px;
            font-family: monospace;
        }

        .interactive-zone {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 8px 12px;
            margin: 5px 2px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🔴 Double-Tap Interaction Labss</h1>

    <p style="font-size: 12px; color: #888;">
        Simulasi pengujian respons klik ganda terhadap kemunculan dialog izin.
    </p>

    <div class="interactive-zone">

        <input
            id="input"
            type="time"
            list="times"
            aria-label="Time picker test"
        >

        <datalist id="times">
            <option value="00:00" label="--"></option>
            <option value="00:01" label="--"></option>
            <option value="00:02" label="Test option"></option>
            <option value="00:03" label="--"></option>
            <option value="00:04" label="--"></option>
            <option value="00:05" label="--"></option>
            <option value="00:06" label="--"></option>
            <option value="00:07" label="--"></option>
            <option value="00:08" label="Test option"></option>
            <option value="00:09" label="--"></option>
            <option value="00:10" label="--"></option>
        </datalist>

    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik...
    </div>

    <div>
        <button id="geo-start">Test Geolocation</button>
        <button id="geo-stop">Stop Geolocation</button>
    </div>

<script>
(() => {
    "use strict";

    const logBox = document.getElementById("log-box");
    const input = document.getElementById("input");

    const geoStart = document.getElementById("geo-start");
    const geoStop = document.getElementById("geo-stop");

    let clickCount = 0;
    let watchId = null;
    let lastPointerTime = null;
    let permissionStatus = null;

    let pickerAttempts = 0;
    let pickerErrors = 0;

    const MAX_LOGS = 100;

    // Logging

    function appendLog(message, details = null) {
        const timestamp = new Date().toISOString();

        const entry = {
            timestamp,
            message,
            details
        };

        console.log(entry);

        const line = document.createElement("div");

        line.textContent =
            `[${timestamp}] ${message}` +
            (details ? " | " + JSON.stringify(details) : "");

        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;

        while (logBox.children.length > MAX_LOGS) {
            if (logBox.children.length > 1) {
                logBox.removeChild(logBox.children[1]);
            }
        }
    }

    // User activation information

    function activationState() {
        if (!navigator.userActivation) {
            return {
                available: false
            };
        }

        return {
            available: true,
            active: navigator.userActivation.isActive,
            previouslyActive:
                navigator.userActivation.hasBeenActive
        };
    }

    // Permission monitoring

    async function monitorPermission() {
        try {
            permissionStatus =
                await navigator.permissions.query({
                    name: "geolocation"
                });

            appendLog("Initial Geolocation permission", {
                state: permissionStatus.state
            });

            permissionStatus.addEventListener(
                "change",
                () => {
                    appendLog("Geolocation permission changed", {
                        state: permissionStatus.state
                    });
                }
            );

        } catch (error) {
            appendLog("Permission monitoring unavailable", {
                name: error.name,
                message: error.message
            });
        }
    }

    // Pointer interaction monitoring

    document.body.addEventListener(
        "pointerdown",
        (event) => {

            const now = performance.now();

            const interval = lastPointerTime === null
                ? null
                : Number(
                    (now - lastPointerTime).toFixed(2)
                );

            lastPointerTime = now;
            clickCount++;

            appendLog(`Pointerdown #${clickCount}`, {
                pointerType: event.pointerType,
                trusted: event.isTrusted,
                intervalMs: interval,
                target: event.target.tagName,
                activation: activationState(),
                visibility: document.visibilityState
            });

            if (clickCount === 9) {
                appendLog("Nine pointer interactions recorded", {
                    activation: activationState(),
                    pickerAttempts,
                    pickerErrors,
                    permission:
                        permissionStatus?.state || "unknown"
                });

                clickCount = 0;
            }

        },
        { passive: true, capture: true }
    );

    // Picker interaction

    input.addEventListener("click", () => {
        pickerAttempts++;

        appendLog("Picker interaction requested", {
            attempt: pickerAttempts,
            activation: activationState()
        });
    });

    input.addEventListener("change", () => {
        appendLog("Picker value changed", {
            value: input.value
        });
    });

    // Geolocation monitoring

    function requestGeolocation() {
        if (!navigator.geolocation) {
            appendLog("Geolocation API unavailable.");
            return;
        }

        if (watchId !== null) {
            appendLog("Geolocation watch already active.");
            return;
        }

        appendLog("Geolocation request started", {
            permission:
                permissionStatus?.state || "unknown",
            activation: activationState()
        });

        watchId = navigator.geolocation.watchPosition(
            (position) => {

                appendLog("Geolocation success", {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    timestamp: position.timestamp
                });

            },

            (error) => {

                appendLog("Geolocation error", {
                    code: error.code,
                    message: error.message
                });

                // Permission denied or request failed:
                // do not automatically retry.
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // Stop Geolocation

    function stopGeolocation() {
        if (watchId !== null) {

            navigator.geolocation.clearWatch(watchId);
            watchId = null;

            appendLog("Geolocation watch stopped.");

        } else {

            appendLog("No active Geolocation watch.");

        }
    }

    geoStart.addEventListener(
        "click",
        requestGeolocation
    );

    geoStop.addEventListener(
        "click",
        stopGeolocation
    );

    // Browser visibility and focus

    document.addEventListener(
        "visibilitychange",
        () => {
            appendLog("Visibility changed", {
                state: document.visibilityState,
                focused: document.hasFocus()
            });
        }
    );

    window.addEventListener("blur", () => {
        appendLog("Window lost focus");
    });

    window.addEventListener("focus", () => {
        appendLog("Window regained focus");
    });

    // Environment information

    appendLog("Lab initialized.");

    appendLog("Environment", {
        secureContext: window.isSecureContext,
        geolocationAvailable: !!navigator.geolocation,
        userAgent: navigator.userAgent,
        activationAvailable: !!navigator.userActivation
    });

    monitorPermission();

})();
</script>

</body>
</html>
