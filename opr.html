```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation PoC</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h2>Navigation PoC</h2>
    <p id="status">Initializing...</p>
  </main>

  <script>
    "use strict";

    (() => {
      const CONFIG = {
        target: "https://example.com:9080/",
        delay: 1500,
        promptDelay: 500
      };

      const status = document.getElementById("status");

      function showPrompt() {
        window.prompt("ROOT CAUSE");
      }

      function redirect(url) {
        const parsed = new URL(url);

        if (parsed.protocol !== "https:") {
          status.textContent = "URL tidak valid.";
          return;
        }

        status.textContent = "Memulai navigasi...";
        window.location.assign(parsed.href);
      }

      setTimeout(showPrompt, CONFIG.promptDelay);

      setTimeout(() => {
        redirect(CONFIG.target);
      }, CONFIG.delay);
    })();
  </script>
</body>
</html>
