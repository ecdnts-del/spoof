<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haiii...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
}

/* ========================= */
/* VIDEO FULLSCREEN */
/* ========================= */

.video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Overlay gelap */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* ========================= */
/* HERO */
/* ========================= */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    opacity:.85;
}

/* ========================= */
/* CONTENT */
/* ========================= */

.content{
    background:white;
    color:#222;
    min-height:350vh;
    padding:80px;
    border-radius:40px 40px 0 0;
}

.card{
    max-width:900px;
    margin:auto;
}

.card h2{
    font-size:40px;
    margin-bottom:20px;
}

.card p{
    line-height:1.8;
    margin-bottom:20px;
}

/* Tombol */

button{
    padding:15px 35px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:#333;
}

</style>
</head>
<body>

<!-- VIDEO -->
<video
class="video"
autoplay
muted
loop
playsinline>

<source src="Code_-_Insiders_mSfUtYR5tL.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<!-- HERO -->

<section class="hero">

<div>

<h1>Haiii 👋</h1>

<p>Scroll ke bawah untuk masuk ke halaman.</p>

</div>

</section>

<!-- CONTENT -->

<section class="content">

<div class="card">

<h2>Selamat Datang</h2>

<p>
Ini adalah contoh halaman dengan video fullscreen sebagai background.
Saat pengguna mulai scroll ke bawah, halaman akan mengunci posisi sehingga
tidak dapat kembali ke bagian video di atas.
</p>

<button>Klik Saya</button>

<div style="height:2500px"></div>

</div>

</section>

<script>

// ==============================
// LOCK SCROLL KE ATAS
// ==============================

let locked = false;
let lockPosition = 0;

window.addEventListener("scroll", () => {

    if (!locked && window.scrollY > 0){
        locked = true;
        lockPosition = window.scrollY;
    }

    if(locked){

        if(window.scrollY < lockPosition){

            window.scrollTo(0, lockPosition);

        }else{

            lockPosition = window.scrollY;

        }

    }

});

// ==============================
// VIDEO PLAY
// ==============================

const video = document.querySelector("video");

video.play().catch(()=>{});

</script>

</body>
</html>
