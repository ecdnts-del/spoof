<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Full View Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* Video keluar dari semua area konten */
.video-full{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    width:100dvw;
    height:100dvh;

    width:100svw;
    height:100svh;

    object-fit:cover;
    background:#000;
}
</style>

</head>

<body>

<video 
    class="video-full"
    autoplay
    muted
    loop
    playsinline>

    <source src="Code_-_Insiders_mSfUtYR5tL.mp4" type="video/mp4">

</video>

</body>
</html>
