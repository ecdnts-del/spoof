<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microphone Origin Debug</title>
<style>
body {
    font-family: sans-serif;
    padding: 20px;
}
pre {
    background: #111;
    color: #0f0;
    padding: 15px;
    white-space: pre-wrap;
}
button {
    padding: 12px;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>Firefox Microphone Origin Debug</h2>

<button id="mic">Request Microphone</button>

<pre id="log">Loading...</pre>

<script>

const log = document.getElementById("log");

function show(info) {
    log.textContent = JSON.stringify(info, null, 2);
}


async function debug() {

let permission = "unknown";

try {
    if (navigator.permissions) {
        const p = await navigator.permissions.query({
            name: "microphone"
        });

        permission = p.state;
    }
} catch(e) {}

show({
    origin: location.origin,
    href: location.href,
    protocol: location.protocol,
    secureContext: window.isSecureContext,
    microphoneAPI:
        !!navigator.mediaDevices,
    permissionState:
        permission
});

}


debug();


document.getElementById("mic").onclick = async () => {

show({
    status: "requesting",
    origin: location.origin,
    href: location.href
});


try {

const stream =
await navigator.mediaDevices.getUserMedia({
    audio:true
});


show({
    status:"granted",
    origin:location.origin,
    href:location.href
});


stream.getTracks().forEach(t=>{
    t.stop();
});


} catch(e) {


show({
    status:"failed",
    errorName:e.name,
    errorMessage:e.message,
    origin:location.origin,
    href:location.href
});


}

};

</script>

</body>
</html>
