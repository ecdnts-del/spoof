
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Zoom Image</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
}

#openBtn {
  margin: 20px;
  padding: 14px 24px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

#overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: none;
  overflow: hidden;
  z-index: 2147483647;
  background: black;
}

#overlay.active {
  display: block;
}

#picture {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1);
  animation: none;
}

#overlay.active #picture {
  animation: zoomImage 8s ease-in-out forwards;
}

@keyframes zoomImage {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(2.5);
  }
}

#closeBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  padding: 12px 18px;
  z-index: 2;
  border: 0;
  border-radius: 8px;
  background: rgba(0,0,0,.7);
  color: white;
  font-size: 20px;
}
</style>
</head>

<body>

<button id="openBtn">BUKA GAMBAR</button>

<div id="overlay">
  <img
    id="picture"
    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
    alt="Online image"
  >
  <button id="closeBtn">✕</button>
</div>

<script>
const overlay = document.getElementById("overlay");
const picture = document.getElementById("picture");

document.getElementById("openBtn").onclick = () => {
  overlay.classList.add("active");

  picture.style.animation = "none";
  void picture.offsetWidth;
  picture.style.animation = "zoomImage 8s ease-in-out forwards";
};

document.getElementById("closeBtn").onclick = () => {
  overlay.classList.remove("active");
  picture.style.animation = "none";
};
</script>

</body>
</html>
