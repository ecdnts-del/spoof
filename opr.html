
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Cover</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #000;
  overflow-x: hidden;
  scrollbar-width: none;
}

body::-webkit-scrollbar {
  display: none;
}

#cover {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  object-fit: cover;
  display: block;
  z-index: 2147483647;
  pointer-events: none;
}

#scroll-space {
  height: 500vh;
  width: 1px;
  pointer-events: none;
}
</style>
</head>

<body>

<img
  id="cover"
  src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
  alt=""
>

<div id="scroll-space"></div>

<script>
(() => {
  let previous = 0;
  let running = true;

  function scrollContinuously(time) {
    if (!running) return;

    if (document.hidden) {
      previous = 0;
      requestAnimationFrame(scrollContinuously);
      return;
    }

    if (!previous) previous = time;

    const elapsed = Math.min((time - previous) / 1000, 0.04);
    previous = time;

    const max = Math.max(
      0,
      document.documentElement.scrollHeight - window.innerHeight
    );

    if (max > 0) {
      if (window.scrollY >= max - 1) {
        window.scrollTo(0, 0);
      } else {
        window.scrollBy(0, 700 * elapsed);
      }
    }

    requestAnimationFrame(scrollContinuously);
  }

  window.addEventListener("load", () => {
    requestAnimationFrame(scrollContinuously);
  });

  document.addEventListener("visibilitychange", () => {
    previous = 0;
  });
})();
</script>

</body>
</html>
