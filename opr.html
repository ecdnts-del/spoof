```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font: 16px Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <h1>HAI</h1>
    <p id="state">Dokumen aktif</p>
  </main>

  <script>
    "use strict";

    const TARGET = "https://example.com:9090/";
    const DELAY = 1500;
    const KEY = "navigation-test-state";

    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        state: "navigation-scheduled",
        time: Date.now()
      }));
    } catch {}

    window.addEventListener("pageshow", () => {
      document.getElementById("state").textContent =
        "Origin: " + location.origin;
    });

    setTimeout(() => {
      window.location.assign(TARGET);
    }, DELAY);
  </script>
</body>
</html>
```
