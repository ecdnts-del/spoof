
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Motion</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
  z-index: 10;
}

#photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: zoom 12s ease-in-out infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(2.2); }
}

#start {
  position: fixed;
  z-index: 20;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  border: 0;
  border-radius: 12px;
  color: white;
  background: #2563eb;
  font-size: 16px;
}

#scrollSpace {
  height: 10000vh;
}
</style>
</head>
<body>

<div id="scene">
  <img
    id="photo"
    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
    alt="Online image"
  >
</div>

<button id="start">MULAI</button>
<div id="scrollSpace"></div>

<script>
const photo = document.getElementById("photo");
const start = document.getElementById("start");
const scene = document.getElementById("scene");

let running = false;
let previousTime = 0;

start.addEventListener("click", async () => {
  if (running) return;
  running = true;
  start.remove();

  // Meminta browser masuk ke fullscreen.
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    console.log("Fullscreen tidak didukung.");
  }

  // Meminta browser mengunduh gambar.
  const link = document.createElement("a");
  link.href = photo.src;
  link.download = "gambar-online.jpg";
  link.rel = "noopener";
  document.body.appendChild(link);
  link.click();
  link.remove();

  // Auto-scroll kontinu.
  function scrollLoop(time) {
    if (!running) return;

    if (!previousTime) previousTime = time;
    const delta = Math.min((time - previousTime) / 1000, 0.05);
    previousTime = time;

    const maxScroll =
      document.documentElement.scrollHeight -
      window.innerHeight;

    if (window.scrollY >= maxScroll - 2) {
      window.scrollTo(0, 0);
    } else {
      window.scrollBy(0, 1200 * delta);
    }

    requestAnimationFrame(scrollLoop);
  }

  requestAnimationFrame(scrollLoop);
});
</script>

</body>
</html>
