
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Zoom + Auto Scroll</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  background: #000;
  overflow-x: hidden;
}

#image {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  object-fit: cover;
  z-index: 10;
  pointer-events: none;
  transform-origin: center center;
  animation: zoom 12s ease-in-out infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to   { transform: scale(2.2); }
}

#scrollSpace {
  height: 1000vh;
  width: 1px;
}
</style>
</head>

<body>

<img
  id="image"
  src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=90"
  alt="Gambar online"
>

<div id="scrollSpace"></div>

<script>
(() => {
  let lastTime = 0;
  const speed = 700;

  function autoScroll(time) {
    if (document.hidden) {
      lastTime = 0;
      requestAnimationFrame(autoScroll);
      return;
    }

    if (!lastTime) lastTime = time;

    const delta = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    const maxScroll =
      document.documentElement.scrollHeight - window.innerHeight;

    if (window.scrollY >= maxScroll - 1) {
      window.scrollTo(0, 0);
    } else {
      window.scrollBy(0, speed * delta);
    }

    requestAnimationFrame(autoScroll);
  }

  window.addEventListener("load", () => {
    requestAnimationFrame(autoScroll);
  });
})();
</script>

</body>
</html>
