<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:sans-serif;
}

/* Video memenuhi layar pertama */
.video-full{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:-1;
}

/* Halaman pertama */
.hero{
    height:100vh;
}

/* Konten setelah di-scroll */
.content{
    min-height:100vh;
    background:#fff;
    color:#000;
    padding:40px;
}
</style>
</head>

<body>

<video class="video-full" autoplay muted loop playsinline>
    <source src="Code_-_Insiders_mSfUtYR5tL.mp4" type="video/mp4">
</video>

<section class="hero">
</section>

<section class="content">
    <h1>Konten Setelah Scroll</h1>
    <p>Scroll ke bawah untuk melihat halaman berikutnya.</p>
    <p>Lorem ipsum dolor sit amet...</p>
</section>

</body>
</html>
