```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation Sync Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #fff;
      font: 16px Arial, sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>HAI</h1>
    <p id="state">Menyiapkan navigasi...</p>
  </main>

  <script>
    "use strict";

    (() => {
      const TARGET = "https://example.com/";
      const DELAY = 1500;
      const state = document.getElementById("state");

      function navigate() {
        state.textContent = "Membuka example.com...";
        window.location.assign(TARGET);
      }

      window.addEventListener("pageshow", () => {
        state.textContent =
          "Origin dokumen: " + window.location.origin;
      });

      window.setTimeout(navigate, DELAY);
    })();
  </script>
</body>
</html>
```
