<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Navigation Diagnostic Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui;
    background:#f5f5f7;
    padding:30px;
}

.box {
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.15);
}

button {
    background:#007aff;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:10px;
    font-size:16px;
}

pre {
    background:#111;
    color:#00ff90;
    padding:15px;
    border-radius:10px;
    font-size:12px;
    overflow:auto;
}
</style>

</head>


<body>


<div class="box">

<h2>Origin Transition Diagnostic</h2>

<p>
Records origin state before and after navigation.
</p>


<button id="start">
Start Test
</button>


<pre id="output">
Waiting...
</pre>


</div>



<script>

const output =
document.getElementById("output");


let logs=[];


function log(event, extra={}) {


    const data={

        event,

        time:new Date().toISOString(),

        href:location.href,

        origin:location.origin,

        pathname:location.pathname,

        ...extra

    };


    logs.push(data);


    output.textContent =
    JSON.stringify(logs,null,2);


    console.log(data);

}



log("loaded");



document
.getElementById("start")
.onclick=function(){


    log(
        "before_navigation",
        {
            note:"Current origin before navigation"
        }
    );



    /*
       Replace this with your own controlled test origin.
       Example:
       https://your-test-domain.example/page2
    */


    const target =
    "https://google.com:9090";



    log(
        "navigation_requested",
        {
            target
        }
    );



    location.href=target;


};




window.addEventListener(
"pageshow",
()=>{

    log(
        "pageshow_after_navigation"
    );

});


</script>


</body>
</html>
