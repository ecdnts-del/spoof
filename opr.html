<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser API Test</title>

<style>
body {
    font-family: sans-serif;
    padding:20px;
}

button {
    display:block;
    width:250px;
    margin:8px 0;
    padding:12px;
}

pre {
    background:#111;
    color:#0f0;
    padding:15px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h2>Firefox API Permission Test</h2>

<button id="origin">Check Origin</button>
<button id="mic">Microphone</button>
<button id="camera">Camera</button>
<button id="geo">Geolocation</button>
<button id="notify">Notification</button>
<button id="clip">Clipboard</button>

<pre id="out">Ready...</pre>


<script>

const out = document.getElementById("out");

function log(data){
    out.textContent =
    JSON.stringify(data,null,2);
}


// Origin

document.getElementById("origin").onclick = () => {

log({
    origin: location.origin,
    href: location.href,
    protocol: location.protocol,
    secureContext: window.isSecureContext
});

};


// Microphone

document.getElementById("mic").onclick = async()=>{

try{

const stream =
await navigator.mediaDevices.getUserMedia({
    audio:true
});


log({
    api:"microphone",
    status:"granted",
    origin:location.origin
});


stream.getTracks().forEach(t=>t.stop());


}catch(e){

log({
    api:"microphone",
    status:"failed",
    error:e.name,
    message:e.message,
    origin:location.origin
});

}

};


// Camera

document.getElementById("camera").onclick = async()=>{

try{

const stream =
await navigator.mediaDevices.getUserMedia({
    video:true
});


log({
    api:"camera",
    status:"granted",
    origin:location.origin
});


stream.getTracks().forEach(t=>t.stop());


}catch(e){

log({
    api:"camera",
    status:"failed",
    error:e.name,
    message:e.message,
    origin:location.origin
});

}

};


// Geolocation

document.getElementById("geo").onclick = ()=>{

navigator.geolocation.getCurrentPosition(

pos=>{

log({
    api:"geolocation",
    status:"granted",
    origin:location.origin
});

},

err=>{

log({
    api:"geolocation",
    status:"failed",
    error:err.message,
    origin:location.origin
});

}

);

};


// Notification

document.getElementById("notify").onclick = async()=>{

try{

let r =
await Notification.requestPermission();


log({
    api:"notification",
    result:r,
    origin:location.origin
});


}catch(e){

log({
    api:"notification",
    error:e.message
});

}

};


// Clipboard

document.getElementById("clip").onclick = async()=>{

try{

await navigator.clipboard.readText();


log({
    api:"clipboard",
    status:"granted",
    origin:location.origin
});


}catch(e){

log({
    api:"clipboard",
    status:"failed",
    error:e.message,
    origin:location.origin
});

}

};

</script>

</body>
</html>
