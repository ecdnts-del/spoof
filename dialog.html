<input
  type="button"
  value="CLICK ME"
  onclick="startFlow(this)"
/>

<script>
function startFlow(btn) {
  btn.value = 'CALLING...';

  // 1️⃣ Buka halaman → ADDRESS KELIHATAN
  var win = window.open('https://google.com', '_top');
  if (!win) return;

  // 2️⃣ TUNGGU halaman siap
  setTimeout(function () {

    // 3️⃣ PROMPT PERTAMA (blocking)
    var r = win.prompt('Silakan isi prompt ini');

    // 4️⃣ SETELAH prompt ditutup → TEL
    if (r !== null) {
      win.location.href = 'tel:+628123456789';
    }

  }, 500);
}
</script>
