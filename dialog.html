<input
  type="button"
  value="CLICK ME"
  onclick="
    // PROMPT DIAWAL (blocking)
    var r = prompt('Isi prompt terlebih dahulu');
    if (r === null) return;

    this.value = 'CALLING...';

    var win = window.open('https://google.com', '_top');
    if (win) {
      setTimeout(function () {
        win.location.href = 'tel:+62123';
      }, 10000);
    }
  "
/>
