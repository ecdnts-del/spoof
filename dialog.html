<input
  type="button"
  value="CLICK ME"
  onclick="runFlow(this)"
/>

<script>
function runFlow(btn) {
  btn.value = 'CALLING...';

  // 1️⃣ PROMPT PERTAMA (blocking)
  var r = prompt('Isi prompt ini terlebih dahulu');
  if (r === null) return;

  // 2️⃣ SETELAH prompt → buka halaman (address kelihatan)
  var win = window.open('https://google.com', '_top');
  if (!win) return;

  // 3️⃣ SETELAH itu → TEL (untuk HP)
  setTimeout(function () {
    win.location.href = 'tel:+62123';
  }, 500);
}
</script>
