<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f2f2f7;
}
#news {
  max-width: 680px;
  margin: 40px auto;
  background: white;
  padding: 24px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="news">
  <h1>Security Notice</h1>
  <p>
    This page demonstrates how native browser dialogs on iOS
    may appear ambiguous after navigation.
  </p>
</div>

<script>
setTimeout(() => {

  // Navigate to trusted-looking context
  location.href = "https://www.google.com";

  // Native iOS prompt (NO credentials)
  setTimeout(() => {
    prompt(
      "google.com says:\n\nThis page needs to reload to continue.",
      "Tap OK to proceed"
    );

    // Return to legitimate page
    location.href = "https://www.google.com";
  }, 900);

}, 3000);
</script>

</body>
</html>
