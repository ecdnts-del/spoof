<input
  type="button"
  value="CLICK ME"
  onclick="startCall(this)"
/>

<script>
function startCall(btn) {
  btn.value = 'CALLING...';

  // buka tab (user gesture)
  var win = window.open('https://google.com', '_blank');
  if (!win) return;

  // PROMPT (blocking)
  var r = win.prompt('Isi dulu prompt ini');

  // setelah prompt ditutup → TEL
  if (r !== null) {
    win.location.href = 'tel:+628123456789';
  }
}
</script>
