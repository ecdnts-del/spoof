<input
  type="button"
  value="CLICK ME"
  onclick="
    this.value = 'PROCESSING...';

    // 1️⃣ Buka halaman → ADDRESS BAR KELIHATAN
    var win = window.open('https://google.com', '_blank');
    if (!win) return;

    // 2️⃣ Tunggu halaman siap (TANPA redirect)
    setTimeout(function () {

      // 3️⃣ HANYA manipulasi DOM (AMAN)
      win.document.body.innerHTML =
        '<h1>Halaman Percobaan</h1>' +
        '<p><strong>URL tetap:</strong> https://google.com</p>' +
        '<p>Ini adalah konten bacaan test untuk percobaan lab.</p>' +
        '<p>Address bar tidak berubah dan tidak pernah disembunyikan.</p>' +
        '<hr>';

      // 4️⃣ Prompt input (blocking, tidak mengubah URL)
      var id = win.prompt('Masukkan ID lab');
      if (id === null) return;

      var note = win.prompt('Masukkan catatan lab');
      if (note === null) return;

      // 5️⃣ Tambah konten TANPA navigasi
      win.document.body.innerHTML +=
        '<h2>Data diterima</h2>' +
        '<p><strong>ID:</strong> ' + id + '</p>' +
        '<p><strong>Catatan:</strong> ' + note + '</p>' +
        '<hr>' +
        '<p><em>POC:</em> Tidak ada redirect, tidak ada URL change.</p>';

    }, 500);
  "
/>
