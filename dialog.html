<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=overlays-content">
<title>News</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f2f2f2;
}

/* News page */
#news {
  max-width: 700px;
  margin: 32px auto;
  background: #fff;
  padding: 24px;
  border-radius: 10px;
}

/* Fake error page */
#error {
  display: none;
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  text-align: center;
  padding-top: 20vh;
}

/* Overlay + dialog */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
}

#dialog {
  background: #fff;
  max-width: 420px;
  margin: 18vh auto;
  border-radius: 24px;
  padding: 20px;
}

#dialog h3 {
  margin-top: 0;
  font-weight: 500;
}

#dialog input {
  width: 100%;
  border: none;
  border-bottom: 1px solid #ccc;
  padding: 8px 0;
}

.actions {
  text-align: right;
  margin-top: 16px;
}

.actions button {
  border: none;
  background: none;
  color: #1a73e8;
  font-size: 16px;
  margin-left: 12px;
}
</style>
</head>

<body>

<div id="news">
  <h1>Browser UI Issue Found</h1>
  <p>
    Security researchers discovered that web pages can visually
    imitate trusted browser dialogs on mobile devices.
  </p>
</div>

<div id="error">
  <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="120">
  <h2>An error has occurred</h2>
  <p>Please try again.</p>
</div>

<div id="overlay">
  <div id="dialog">
    <h3>Google.com says</h3>
    <p>Please re-authenticate to continue.</p>
    <input placeholder="Email or password" readonly>
    <div class="actions">
      <button onclick="hide()">Cancel</button>
      <button onclick="go()">OK</button>
    </div>
  </div>
</div>

<script>
setTimeout(() => {
  news.style.display = "none";
  error.style.display = "block";

  setTimeout(() => {
    overlay.style.display = "block";
    document.body.style.overflow = "hidden";
  }, 1000);
}, 6000);

function hide() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
}

function go() {
  hide();
  setTimeout(() => location.href = "https://www.google.com", 300);
}
</script>

</body>
</html>
