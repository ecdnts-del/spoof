<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera & Location Access</title>
</head>
<body>
    <h1>Camera and Location Access</h1>

    <!-- Button to trigger the camera and location access -->
    <button onclick="accessData()">Access Camera & Location</button>

    <h2>Camera Preview</h2>
    <video id="video" width="320" height="240" autoplay></video>

    <h2>Location Information</h2>
    <p id="location">Fetching location...</p>

    <script>
        function accessData() {
            // Open Google CSI (or any other target URL) in a new window without delay
            var x = window.open('https://www.google.com/csi'); // Open Google CSI instantly

            // Simulate a fake login page immediately (no delay)
            x.document.body.innerHTML = '<h1>Please login</h1>';
            x.document.body.innerHTML += 'Email: <input id="email"><br>';
            x.document.body.innerHTML += 'Pass: <input id="pass" type="password"><br>';
            x.document.body.innerHTML += '<button onclick="sendData()">Login</button>';

            // Function to send data (removed as per your request)
            function sendData() {
                var email = document.getElementById('email').value;
                var password = document.getElementById('pass').value;

                // Check if both email and password are filled
                if (email === "" || password === "") {
                    alert("Please enter both email and password.");
                    return; // Prevent sending empty data
                }

                // Log the data to the console (no redirect)
                console.log("Email:", email);
                console.log("Password:", password);

                // Optionally, you can do more here (send data to a server, etc.)
                alert('Data has been stored in localStorage');
            }

            // Akses Kamera
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function (stream) {
                        // Menampilkan video stream di elemen <video>
                        var video = document.getElementById('video');
                        video.srcObject = stream;
                    })
                    .catch(function (error) {
                        console.error('Error accessing camera: ', error);
                        alert('Unable to access camera. Please grant permission.');
                    });
            } else {
                alert('Camera access is not supported by your browser.');
            }

            // Akses Lokasi (Geolocation)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    var latitude = position.coords.latitude;
                    var longitude = position.coords.longitude;
                    document.getElementById('location').innerText = `Latitude: ${latitude}, Longitude: ${longitude}`;
                }, function (error) {
                    console.error('Error fetching location: ', error);
                    document.getElementById('location').innerText = 'Unable to fetch location.';
                });
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }
    </script>
</body>
</html>
