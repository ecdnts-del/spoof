<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Concept - Download PHP File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin: 10px;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2em;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Download .php File for Testing</h1>
    <button id="downloadFileButton">Download .php File</button>
    <div id="status"></div>

    <script>
        // Function to handle file download
        function downloadFile() {
            const phpContent = '<?php echo "This is a malicious PHP script"; ?>'; // Fake PHP content
            const blob = new Blob([phpContent], { type: 'text/plain' }); // Create a Blob with the PHP content
            const url = URL.createObjectURL(blob); // Create a URL for the Blob

            // Create a temporary link element to trigger the download
            const link = document.createElement('a');
            link.href = url;
            link.download = 'example.php'; // Set the file name
            link.click(); // Trigger the download

            document.getElementById('status').textContent = "File download initiated.";
        }

        // Add event listener to the button
        document.getElementById('downloadFileButton').addEventListener('click', downloadFile);
    </script>
</body>

</html>
