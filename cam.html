<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instagram Open PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
  text-align: center;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 60px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Tap to Open Instagram</h2>
  <p>Tap the button below to attempt to open Instagram.</p>

  <button id="tap">Tap to Open Instagram</button>
  <p id="status">Status: -</p>

  <video id="video" autoplay playsinline></video>

  <div class="notice">
    Observe permission UI, app launch behavior, or unexpected navigation
  </div>
</div>

<script>
const trigger = document.getElementById('trigger');
const panel   = document.getElementById('panel');
const tapBtn  = document.getElementById('tap');
const status  = document.getElementById('status');
const video   = document.getElementById('video');

let stream;

trigger.onclick = () => {
  // Just display the panel without changing the history or URL
  panel.style.display = 'block';
};

tapBtn.onclick = () => {
  // Try to open the Instagram app using its custom URL scheme
  const appUrl = "instagram://";
  const fallbackUrl = "https://www.instagram.com"; // Fallback to the web version

  // Attempt to open Instagram app
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = appUrl;

  document.body.appendChild(iframe);

  // Fallback: If app is not installed, open Instagram website
  setTimeout(() => {
    document.body.removeChild(iframe);
    window.location.href = fallbackUrl;
  }, 2000); // Wait 2 seconds before redirecting to the web version
};

window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
