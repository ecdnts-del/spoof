<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="256" height="256"></canvas>
<script>
const gl = c.getContext("webgl");
if (!gl) throw "WebGL not supported";

// ---- create framebuffer + texture ----
function makeTex() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}

const tex = makeTex();
const fb = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

// ---- draw initial color ----
gl.viewport(0,0,256,256);
gl.clearColor(1,0,0,1);
gl.clear(gl.COLOR_BUFFER_BIT);

// ---- loop stress test: redefine + copyTexImage2D ----
for (let i=0; i<2000; i++) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // Tekstur digunakan sebagai sumber dan render target
  gl.copyTexImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 0, 0, 256, 256, 0);
  // Clear framebuffer random
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.clearColor(Math.random(), Math.random(), Math.random(), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

// ---- optional: continuous framebuffer use ----
setInterval(() => {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.clearColor(Math.random(), Math.random(), Math.random(), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}, 10);

console.log("Stress test selesai. Kalau perangkat rentan, browser mungkin crash.");
</script>
</body>
</html>
