<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioStream + Redirect PoC</title>
</head>
<body>

<h2>CLICK TO START AUDIO</h2>
<button id="startBtn">Start Audio</button>

<script>
const btn = document.getElementById('startBtn');
btn.addEventListener('click', async () => {
  btn.disabled = true;

  // 🎧 Buat elemen audio (bisa mp3/mp4) tapi tidak terlihat
  const audio = document.createElement('audio');
  audio.src = 'windows.mp3'; // bisa diganti mp3 juga
  audio.loop = true;
  audio.autoplay = true;
  audio.style.display = 'none';
  document.body.appendChild(audio);

  // 🔊 Connect ke AudioContext supaya bisa manipulasi / kontrol
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(audioCtx.destination);

  try {
    await audio.play(); // play audio
    console.log("[PoC] AudioStream playing");
  } catch(e){
    console.warn("Audio play failed", e);
  }

  // 🔀 Redirect ke target setelah delay
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 1000); // 5 detik delay
});
</script>

</body>
</html>
