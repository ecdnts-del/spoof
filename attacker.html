<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video PiP Only PoC</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background:#000; color:#fff; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
  video { width:100%; max-width:600px; margin-top:20px; border:2px solid #fff; }
</style>
</head>
<body>

<h2>CLICK TO START VIDEO</h2>
<button id="startBtn">Start PiP Video</button>

<video id="v" src="windows.mp4" controls playsinline muted></video>

<script>
const btn = document.getElementById('startBtn');
const video = document.getElementById('v');

btn.addEventListener('click', async () => {

  btn.disabled = true;

  // 🎬 Play video muted
  try {
    video.muted = true;   // suara dimatikan
    video.loop = true;
    await video.play();
  } catch(e){ console.warn("Video play failed", e); }

  // 🖼️ Request PiP
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await video.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔀 Optional redirect
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 3000); // delay 3 detik
});
</script>

</body>
</html>
