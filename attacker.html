<script>
// ===== UTIL =====
const logEl = document.getElementById('log');
const log = (m)=>{ logEl.textContent += m + "\n"; console.log(m); };

// ===== CORE (ANTI-SATURATION) =====
const nan = new Float64Array(new Uint8Array(8).fill(0xff).buffer)[0];

// generate code unik tiap call → geser “flip point”
function makeFn(size, bsize, saltA, saltB) {
  return new Function('nan', `
    // entropy di ukuran loop & struktur
    const S = ${size} + (${saltA} % 7);
    const arr = new Array(S);

    // variasi bentuk loop (beda CFG → beda budget)
    for (let i = 0; i < S; i++) {
      if ((i + ${saltB}) % 3 === 0) {
        arr[i] = [nan];
      } else {
        arr[i] = [nan];
      }
    }

    // unreachable tapi “berat”
    if (${saltA} < 0) {
      ${'p();'.repeat(bsize)}
    }

    return arr;
  `);
}

function measureOnce() {
  // salt beda tiap panggilan
  const saltA = (Math.random() * 1e9) | 0;
  const saltB = (Math.random() * 1e9) | 0;

  const size  = 420;   // lebih besar → lebih sensitif
  const bsize = 120;

  const fn = makeFn(size, bsize, saltA, saltB);
  const arr = fn(nan);

  // cari index pertama yang sudah canonicalized
  let idx = -1;
  for (let i = 0; i < arr.length; i++) {
    const u8 = new Uint8Array(new Float64Array(arr[i]).buffer);
    if (u8[0] !== 0xff) { idx = i; break; }
  }
  return idx;
}

// dua sampel berpasangan → absolute delta
function sampleDelta() {
  const a = measureOnce();
  const b = measureOnce();
  if (a < 0 || b < 0) return 0;
  return Math.abs(b - a);
}

// ===== STATS (ROBUST) =====
function median(xs){
  const a = xs.slice().sort((x,y)=>x-y);
  const m = (a.length/2)|0;
  return a.length % 2 ? a[m] : (a[m-1]+a[m])/2;
}
function variance(xs){
  const mu = xs.reduce((s,x)=>s+x,0)/xs.length;
  return xs.reduce((s,x)=>s+(x-mu)*(x-mu),0)/xs.length;
}

// sliding window
const W = [];
const WN = 60;

function tick() {
  const d = sampleDelta();
  W.push(d);
  if (W.length > WN) W.shift();

  if (W.length < 20) return;

  const med = median(W);
  const varc = variance(W);

  // klasifikasi sederhana
  let state = "LOW";
  if (med > 6 || varc > 15) state = "HIGH (pressure/GC likely)";
  else if (med > 3) state = "MED";

  log(`d=${d} | med=${med.toFixed(2)} var=${varc.toFixed(2)} => ${state}`);
}

// ===== RUN =====
log("[*] Receiver start (anti-saturation)");
setInterval(tick, 80);

// debug raw (opsional)
