<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Dropdown</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 20px;
      cursor: pointer;
    }

    /* Dropdown fullscreen */
    .fullscreen-dropdown {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .fullscreen-dropdown.show {
      display: flex;
    }

    .fullscreen-dropdown a {
      color: white;
      font-size: 24px;
      margin: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

<button onclick="openFullscreen()">Buka Menu</button>

<div id="dropdown" class="fullscreen-dropdown">
  <a href="#">Menu 1</a>
  <a href="#">Menu 2</a>
  <a href="#">Menu 3</a>
  <button onclick="closeFullscreen()">Tutup</button>
</div>

<script>
  function openFullscreen() {
    let elem = document.documentElement;

    // Masuk fullscreen
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }

    // Tampilkan dropdown
    document.getElementById("dropdown").classList.add("show");
  }

  function closeFullscreen() {
    // Keluar fullscreen
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }

    // Sembunyikan dropdown
    document.getElementById("dropdown").classList.remove("show");
  }
</script>

</body>
</html>
