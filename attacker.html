
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POC APK Download</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101827;
    font-family: Arial, sans-serif;
    color: white;
  }
  .card {
    background: #1e293b;
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    width: 280px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="card">
  <h2>Simple APK</h2>
  <p>POC Download Demo</p>
  <button onclick="downloadAPK()">Download APK</button>
  <p id="status"></p>
</div>

<script>
function downloadAPK() {
  const content = "Simple APK Download POC Demo";
  const blob = new Blob([content], {
    type: "application/vnd.android.package-archive"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "simple.apk";
  a.click();

  URL.revokeObjectURL(url);
  document.getElementById("status").textContent =
    "Download berhasil dimulai!";
}
</script>

</body>
</html>
