<!doctype html>
<meta charset="utf-8">
<title>GC Oracle++</title>

<h2>GC Oracle++ (Strong)</h2>
<pre id="log"></pre>

<iframe src="https://ecdnts-del.github.io/spoof/victim.html" style="width:0;height:0;border:0"></iframe>

<script>
const log = m => {
  document.getElementById('log').textContent += m + "\n"
  console.log(m)
}

// ===== MULTI PROBE =====
function probe() {
  const t0 = performance.now()

  // 1. array alloc
  let arr = []
  for (let i = 0; i < 4000; i++) arr.push([i])

  // 2. typed array
  let buf = new Uint8Array(1024 * 256)

  // 3. object alloc
  let obj = []
  for (let i = 0; i < 2000; i++) obj.push({a:i,b:i+1})

  return performance.now() - t0
}

// ===== SAMPLING =====
function sample() {
  let sum = 0
  for (let i = 0; i < 5; i++) {
    sum += probe()
  }
  return sum / 5
}

// ===== TRACKING =====
let history = []
let baseline = null

setInterval(() => {
  const t = sample()
  history.push(t)

  if (history.length > 50) history.shift()

  // adaptive baseline (median)
  const sorted = [...history].sort((a,b)=>a-b)
  const med = sorted[Math.floor(sorted.length/2)]

  if (baseline === null) baseline = med

  const delta = t - baseline

  let state = "IDLE"
  if (delta > 2) state = "ACTIVE"
  if (delta > 5) state = "HIGH GC PRESSURE"

  log(`t=${t.toFixed(2)} base=${baseline.toFixed(2)} Δ=${delta.toFixed(2)} => ${state}`)

}, 120)
</script>
