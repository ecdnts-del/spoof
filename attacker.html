<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioStream + Redirect PoC (Enhanced)</title>
</head>
<body style="text-align:center; padding:50px; font-family:sans-serif; background:#000; color:#fff;">

<h2>CLICK TO START AUDIO</h2>
<button id="startBtn" style="padding:15px 30px; font-size:18px; cursor:pointer;">Start Audio</button>

<script>
const btn = document.getElementById('startBtn');
btn.addEventListener('click', async () => {
  btn.disabled = true;

  // 🎧 Create hidden audio element
  const audio = document.createElement('audio');
  audio.src = 'windows.mp3'; // replace dengan mp3/mp4
  audio.loop = true;
  audio.autoplay = false; // autoplay manual via context
  audio.style.display = 'none';
  document.body.appendChild(audio);

  // 🔊 AudioContext setup
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(audio);
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0; // start silent
  source.connect(gainNode).connect(audioCtx.destination);

  // 🎵 Play audio and fade in volume
  try {
    await audio.play();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    // Smooth fade-in
    gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 2); // 2 detik fade-in
    console.log("[PoC] AudioStream playing (fade-in)");
  } catch(e){
    console.warn("Audio play failed", e);
  }

  // 🔁 Ensure persistent looping
  audio.addEventListener('ended', () => audio.play());

  // 🔀 Redirect setelah delay (audio tetap berjalan dulu)
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 3000); // 5 detik delay
});
</script>

</body>
</html>
