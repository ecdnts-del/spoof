<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video + PiP + Speech PoC</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<h2>CLICK TO START</h2>
<button id="startBtn">Start Video + Speech</button>

<video id="v" src="windows.mp4" controls playsinline style="width:100%; max-width:600px;"></video>

<script>
const btn = document.getElementById('startBtn');
const video = document.getElementById('v');

btn.addEventListener('click', async () => {

  btn.disabled = true;

  // 🎬 Play video
  try {
    video.muted = false;
    video.volume = 1;
    video.loop = true;
    await video.play();
  } catch(e){ console.warn("Video play failed", e); }

  // 🖼️ PiP
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await video.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔊 Speech
  const text = "Security alert. Suspicious activity detected. Please follow instructions.";
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';

  let voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if (enVoice) utter.voice = enVoice;
  } else {
    speechSynthesis.onvoiceschanged = () => {
      voices = speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;
    };
  }

  speechSynthesis.speak(utter);

  // ⏱️ Redirect after small delay
  setTimeout(() => {
    window.open('https://www.google.com', '_self');
  }, 1200);

});
</script>

</body>
</html>
