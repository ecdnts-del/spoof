<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined Demo</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
#output {
  margin-top:20px;
  font-size:14px;
}
</style>
</head>

<body>

<button id="start">Start Demo</button>
<p id="output">Location: -</p>

<script>
const TARGET = "https://www.google.com";

document.getElementById("start").onclick = async () => {

  // ===== 1. FULLSCREEN =====
  if (document.documentElement.requestFullscreen) {
    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {
      console.log("Fullscreen gagal");
    }
  }

  // ===== 2. OPEN NEW TAB =====
  const newWindow = window.open('https://apple.com', '_blank');

  // ===== 3. GEOLOCATION =====
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("output").textContent =
        pos.coords.latitude + ", " + pos.coords.longitude;
    }, () => {
      document.getElementById("output").textContent = "Gagal ambil lokasi";
    });
  }

  // ===== 4. REDIRECT UTAMA =====
  setTimeout(() => {
    if (confirm("Pindah ke Google?")) {
      window.location.href = TARGET;
    }
  }, 3000);

  // ===== 5. TEL (OPSIONAL) =====
  setTimeout(() => {
    if (confirm("Ingin melakukan panggilan?")) {
      window.location.href = "tel:1234";
    }
  }, 10000);

};
</script>

</body>
</html>
