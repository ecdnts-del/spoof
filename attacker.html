<!doctype html>
<meta charset="utf-8">
<title>GC Observer</title>

<h2>GC Side-Channel Detector</h2>
<pre id="log"></pre>

<iframe src="spoof/victim.html" style="width:0;height:0;border:0"></iframe>

<script>
const log = m => {
  document.getElementById('log').textContent += m + "\n"
  console.log(m)
}

// ===== MEASURE LATENCY =====
function measure() {
  const t0 = performance.now()

  // allocation ringan tapi sensitif ke GC
  let arr = []
  for (let i = 0; i < 5000; i++) {
    arr.push([i])
  }

  return performance.now() - t0
}

// ===== TRACK =====
let history = []

setInterval(() => {
  const t = measure()
  history.push(t)

  if (history.length > 30) history.shift()

  const avg = history.reduce((a,b)=>a+b,0)/history.length

  let state = "LOW"
  if (avg > 5) state = "HIGH (GC / pressure detected)"

  log(`t=${t.toFixed(2)} avg=${avg.toFixed(2)} => ${state}`)

}, 100)
</script>
