<!DOCTYPE html>
<html>
<head>
  <title>Verifying...</title>
</head>

<body style="margin:0; background:black; color:white; font-family:sans-serif; text-align:center;">

<div id="overlay" style="position:absolute; top:40%; width:100%; z-index:2;">
  <h2>Verifying your session...</h2>
  <p>Please wait...</p>
  <button id="startBtn" style="padding:12px 24px; font-size:16px;">
    Continue
  </button>
</div>

<video id="v"
  src="windows.mp4"
  controls
  playsinline
  style="width:100%; height:100%; object-fit:cover;">
</video>

<script>
let speaking = false;
let speechMsg;

async function start() {
  const v = document.getElementById("v");
  const btn = document.getElementById("startBtn");

  // 🔒 Disable button supaya tidak spam
  btn.disabled = true;

  // 🎬 Play video
  try {
    v.muted = false;
    v.volume = 1;
    v.loop = true;
    await v.play();
  } catch(e){ console.warn("Video play failed", e); }

  // 🖼️ Try PiP safely
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await v.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔊 SpeechSynthesis function
  function speakLoop() {
    if (speaking) return;
    speaking = true;

    speechMsg = new SpeechSynthesisUtterance(
      "Security alert. Suspicious activity detected. Please follow the instructions on this page."
    );

    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
      speechMsg.voice = voices.find(v => v.lang.includes("en")) || voices[0];
      speechSynthesis.speak(speechMsg);
    } else {
      // fallback jika voices belum load
      speechSynthesis.onvoiceschanged = () => {
        const loadedVoices = speechSynthesis.getVoices();
        speechMsg.voice = loadedVoices.find(v => v.lang.includes("en")) || loadedVoices[0];
        speechSynthesis.speak(speechMsg);
      };
    }

    // 🔁 Loop clean tanpa tumpuk
    speechMsg.onend = () => {
      speaking = false;
      speakLoop();
    };
  }

  speakLoop();

  // ⏱️ Redirect after short delay
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 1200);
}

// 🔗 Bind button
document.getElementById("startBtn").addEventListener("click", start);
</script>

</body>
</html>
