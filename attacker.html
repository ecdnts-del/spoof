<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP Audio → SpeechSynthesis PoC</title>
</head>
<body>

<h2>CLICK TO START AUDIO + TTS</h2>
<button id="startBtn">Start</button>

<!-- Video untuk PiP tapi muted -->
<video id="v" src="windows.mp4" loop muted style="width:0; height:0;"></video>

<script>
const btn = document.getElementById('startBtn');
const video = document.getElementById('v');

btn.addEventListener('click', async () => {
  btn.disabled = true;

  // 🔊 Play video muted
  try { await video.play(); } catch(e){}

  // 🖼️ Request PiP (video muted, floating)
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await video.requestPictureInPicture();
    }
  } catch(e){ console.warn("PiP failed", e); }

  // 🔊 SpeechSynthesis loop
  const text = "This is a security alert message from video.";
  function speakLoop() {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';

    const voices = speechSynthesis.getVoices();
    if (voices.length) {
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;
    }

    speechSynthesis.speak(utter);
    utter.onend = () => speakLoop();
  }

  speakLoop();
});
</script>

</body>
</html>
