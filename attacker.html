<!doctype html>
<meta charset="utf-8">
<title>Hybrid Oracle FINAL</title>

<h2>Hybrid Side-Channel (Stable)</h2>
<pre id="log"></pre>

<!-- IMPORTANT: same-origin path -->
<iframe src="/spoof/victim.html" style="width:0;height:0;border:0"></iframe>

<script>
const log = m => {
  document.getElementById('log').textContent += m + "\n"
  console.log(m)
}

// ===== HYBRID PROBE =====
function probe() {
  const t0 = performance.now()

  // CPU pressure
  let x = 0
  for (let i = 0; i < 5e6; i++) x += i

  // GC-sensitive allocation
  let arr = []
  for (let i = 0; i < 15000; i++) arr.push([i])

  return performance.now() - t0
}

// ===== CALIBRATION =====
let baseline = 0

function calibrate() {
  let samples = []
  for (let i = 0; i < 12; i++) {
    samples.push(probe())
  }

  baseline = samples.reduce((a,b)=>a+b,0) / samples.length
  log("Baseline = " + baseline.toFixed(2))
}

// tunggu sedikit biar iframe stabil
setTimeout(() => {
  calibrate()

  // ===== DETECTOR =====
  setInterval(() => {
    const t = probe()
    const delta = t - baseline

    let state = "IDLE"
    if (delta > 6) state = "BUSY 🔥"
    if (delta > 14) state = "HEAVY 💣"

    log(`t=${t.toFixed(2)} Δ=${delta.toFixed(2)} => ${state}`)

  }, 120)

}, 1000)
</script>
