<button id="start">Start Demos</button>
<p id="output">Location: -</p>

<script>
document.getElementById("start").onclick = async () => {

  // 1. buka halaman baru
  const newWindow = window.open('https://apple.com', '_blank');

  // 2. ambil lokasi
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("output").textContent =
        pos.coords.latitude + ", " + pos.coords.longitude;
    }, () => {
      document.getElementById("output").textContent = "Gagal ambil lokasi";
    });
  }

  // 3. redirect ke Google
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 3000);

  // 4. trigger tel:
  setTimeout(() => {
    window.location.href = "tel:1234";
  }, 10000);

};
</script>
