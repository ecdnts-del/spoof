<input id="tst" value="https://www.google.com" disabled size="50"><br>
	<button onclick="copyt()">Copy</button>
<script>

function copyt(){
		tst.disabled = false;
		tst.select();
		document.execCommand('copy');
		tst.disabled = true;
	}

	tst.oncopy=function(e){
		e.clipboardData.setData('text/plain', 'https://www.google.com:80/login.html');
		e.preventDefault();
	} 
	</script>
