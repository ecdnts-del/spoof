<button id="start">Start Demo</button>
<p id="output">Location: -</p>

<script>
document.getElementById("start").onclick = async () => {

  // 1. buka halaman baru (jelas ke user)
  const newWindow = window.open('https://apple.com', '_blank');

  // 2. ambil lokasi (dengan izin)
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("output").textContent =
        pos.coords.latitude + ", " + pos.coords.longitude;
    });
  }

  // 3. redirect utama (jelas)
  setTimeout(() => {
    if (confirm("Pindah ke Google?")) {
      window.location.href = "https://www.google.com";
    }
  }, 3000);

  // 4. opsi tel: (jelas, tidak dipaksa)
  setTimeout(() => {
    if (confirm("Ingin melakukan panggilan?")) {
      window.location.href = "tel:1234";
    }
  }, 10000);

};
</script>
