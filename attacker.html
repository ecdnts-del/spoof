<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Video + PiP + SpeechSynthesis + Redirect</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background:#000; color:#fff; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
  iframe { width: 100%; max-width: 600px; height: 340px; border: none; margin-top: 20px; }
</style>
</head>
<body>

<h2>CLICK TO START VIDEO</h2>
<button id="startBtn">Start</button>

<!-- iframe video source -->
<iframe id="videoFrame" src="windows.mp4" allow="autoplay; fullscreen" allowfullscreen></iframe>

<script>
const btn = document.getElementById('startBtn');
const iframe = document.getElementById('videoFrame');
let speaking = false;

btn.addEventListener('click', async () => {
  btn.disabled = true;

  // 🔊 SpeechSynthesis loop
  const text = "Security alert. Suspicious activity detected. Please follow instructions.";
  function speakLoop() {
    if (speaking) return;
    speaking = true;

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';

    const voices = speechSynthesis.getVoices();
    if (voices.length) {
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;
    }

    speechSynthesis.speak(utter);
    utter.onend = () => {
      speaking = false;
      speakLoop(); // loop persistent
    };
  }

  speakLoop();

  // 🔀 Redirect setelah delay
  setTimeout(() => {
    window.location.href = "https://www.google.com";
  }, 2000);
});
</script>

</body>
</html>
