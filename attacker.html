<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picker & Redirection Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }
        h1 { color: #ff5252; font-size: 18px; margin-bottom: 5px; }
        .info-box {
            background: #1e1e1e; border: 1px solid #333; padding: 10px;
            border-radius: 6px; max-width: 500px; width: 100%; font-size: 11px;
            color: #b0b0b0; margin-top: 15px; text-align: left; max-height: 150px; overflow-y: auto;
        }
        code { background: #2d2d2d; color: #ff8a80; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .interactive-zone { position: relative; margin-bottom: 20px; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h1>🔴 File Picker & Redirection Lab</h1>
    <p style="font-size: 12px; color: #888;">Simulasi pengujian interaksi cepat terhadap pemanggilan file picker dan navigasi.</p>

    <div class="interactive-zone">
        <input id="file-input" type="file" style="display:none;" />
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik...
    </div>

<script>
    const logBox = document.getElementById('log-box');
    function appendLog(msg) {
        console.log(msg);
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    let clickCount = 0;
    const fileInput = document.getElementById('file-input');

    document.body.addEventListener('pointerdown', (e) => {
        clickCount++;
        try {
            fileInput.showPicker();
        } catch (err) {}

        if (clickCount === 9) {
            appendLog(`[Triggered] Ketukan ke-${clickCount}: Memicu file picker & pengalihan domain...`);
            
            // Mengalihkan halaman ke domain eksternal setelah jeda singkat
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1000);

            clickCount = 0;
        }
    }, { passive: true });
</script>

</body>
</html>
