<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS JS Dialog PoC</title>
</head>
<body>

<h2>iOS JavaScript Dialog PoC (WebKit)</h2>

<button onclick="topPrompt()">Top Window Prompt</button>
<button onclick="iframePrompt()">Iframe Prompt</button>
<button onclick="window0Prompt()">window[0] Prompt</button>

<hr>

<iframe id="xframe"
  srcdoc="
    <script>
      function iframeFire() {
        prompt('iframe: no domain shown');
      }
    </script>
    <button onclick='iframeFire()'>Iframe Fire</button>
  "
  style="width:100%;height:120px;border:1px solid black;">
</iframe>

<script>
function topPrompt() {
  prompt('top window: no domain shown');
}

function iframePrompt() {
  document.getElementById('xframe').contentWindow.prompt(
    'iframe via parent: no domain shown'
  );
}

function window0Prompt() {
  window[0].prompt('window[0]: no domain shown');
}
</script>

</body>
</html>
