<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirect Bertahap</title>
    <style>
        .button {
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

<script>
function a() {
    // buka apple.com
    let win = window.open('https://google.com', 'x');

    // 5 detik ke google.com
    setTimeout(function () {
        win.location.href = 'https://ecdnts-del.github.io/test-apk/apple.apk';

        // 5 detik lagi ke example.com
        setTimeout(function () {
            win.location.href = 'https://google.com';
        }, 302);

    }, 1);
}
</script>

<center>
    <input type="button" class="button" value="DOWNLOAD" onclick="a()">
</center>

</body>
</html>
