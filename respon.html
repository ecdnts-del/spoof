<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Window and Insert Content</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Open Window and API Access Demo</h1>
    <button onclick="openWindowAndInsertContent()">Open Google CSI & Inject Content</button>

    <script>
        function openWindowAndInsertContent() {
            // Open a new window (external page)
            var x = window.open('https://www.google.com:9090'); // Open Google CSI
            
            // Wait a little for the new window to load (you can adjust the delay time)
            setTimeout(function() {
                // Attempt to inject content into the new window (you can only do this if the page is from the same origin)
                try {
                    x.document.body.innerHTML = `
                        <h1>API Access & Geolocation</h1>
                        <p>Access Camera and Location APIs:</p>
                        <button onclick="requestNotificationPermission()">Request Notification Permission</button>
                        <br><br>
                        <button onclick="getLocation()">Get Location</button>
                        <br><br>
                        <button onclick="openCamera()">Open Camera</button>
                        <br><br>
                        <h2>Camera Preview:</h2>
                        <video id="video" width="320" height="240" autoplay></video>
                    `;

                    // Camera API Access
                    if (x.navigator.mediaDevices && x.navigator.mediaDevices.getUserMedia) {
                        x.navigator.mediaDevices.getUserMedia({ video: true })
                            .then(function(stream) {
                                var video = x.document.getElementById('video');
                                video.srcObject = stream;
                            })
                            .catch(function (error) {
                                console.error('Error accessing camera: ', error);
                                alert('Unable to access camera. Please grant permission.');
                            });
                    } else {
                        alert('Camera access is not supported by your browser.');
                    }

                    // Geolocation API Access
                    if (x.navigator.geolocation) {
                        x.navigator.geolocation.getCurrentPosition(function(position) {
                            var latitude = position.coords.latitude;
                            var longitude = position.coords.longitude;
                            x.document.body.innerHTML += `<p>Latitude: ${latitude}, Longitude: ${longitude}</p>`;
                        }, function(error) {
                            console.error('Error fetching location: ', error);
                            x.document.body.innerHTML += '<p>Unable to fetch location.</p>';
                        });
                    } else {
                        alert('Geolocation is not supported by your browser.');
                    }

                    // Inject Notification Permission API
                    function requestNotificationPermission() {
                        if (x.Notification.permission === 'granted') {
                            alert('Notification permission already granted');
                        } else if (x.Notification.permission !== 'denied') {
                            x.Notification.requestPermission().then(permission => {
                                if (permission === 'granted') {
                                    alert('Notification permission granted');
                                } else {
                                    alert('Notification permission denied');
                                }
                            });
                        } else {
                            alert('Notification permission denied');
                        }
                    }

                    // Inject Camera Function to Access Camera
                    function openCamera() {
                        x.navigator.mediaDevices.getUserMedia({ video: true })
                            .then(stream => {
                                const video = x.document.createElement('video');
                                video.srcObject = stream;
                                video.play();
                                x.document.body.appendChild(video);
                            })
                            .catch(err => {
                                alert('Camera denied or not available');
                            });
                    }

                    // Inject Get Location Function
                    function getLocation() {
                        if (x.navigator.geolocation) {
                            x.navigator.geolocation.getCurrentPosition(position => {
                                alert("Latitude: " + position.coords.latitude + "\nLongitude: " + position.coords.longitude);
                            }, error => {
                                alert("Location access denied or error.");
                            });
                        } else {
                            alert("Geolocation is not supported by this browser.");
                        }
                    }
                } catch (e) {
                    console.error("Error modifying window content: ", e);
                }
            }, 3000); // Wait for 3 seconds to simulate page load time (adjust as necessary)
        }
    </script>
</body>
</html>
