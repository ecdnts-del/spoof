<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Jacking Autofill Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        /* Style for transparent element placed over the login button */
        #hiddenButton {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: rgba(255, 0, 0, 0.0); /* Transparent */
            z-index: 9999; /* Make sure it's above everything else */
        }

        #loginForm {
            margin-top: 100px;
            text-align: center;
        }

        input {
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- Hidden button for tap jacking -->
<div id="hiddenButton"></div>

<!-- Login form simulated here for password autofill -->
<div id="loginForm">
    <h2>Login Form</h2>
    <form action="#" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required><br><br>

        <button type="submit">Login</button>
    </form>
</div>

<script>
    const log = (...args) => console.log("[PoC]", ...args);

    // Mimicking autofill behavior
    document.getElementById('username').value = 'user123';
    document.getElementById('password').value = 'password123';

    // Alert when tap is detected
    document.getElementById('hiddenButton').addEventListener('click', () => {
        log('Tap detected! Autofill triggered!');
    });

    // On page load, simulate interaction with invisible button
    setTimeout(() => {
        log('Simulating user tap on invisible button...');
        document.getElementById('hiddenButton').click(); // Simulate a click on the hidden button
    }, 2000); // Delay before simulating tap

</script>

</body>
</html>
