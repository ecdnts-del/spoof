<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrome iOS File Picker POC</title>
<style>
  body { font-family: sans-serif; text-align: center; padding-top: 50px; }
  button { font-size: 16px; padding: 10px 20px; }
</style>
</head>
<body>

<h1>Open File Picker in New Tab (Chrome iOS)</h1>
<button id="openPicker">Open File Picker</button>

<script>
document.getElementById('openPicker').onclick = () => {
  // Must be inside click handler
  const newTab = window.open('', '_blank');

  // Add content in the new tab
  newTab.document.write(`
    <html>
      <head>
        <title>Select a File</title>
      </head>
      <body style="font-family:sans-serif; text-align:center; padding-top:50px;">
        <h2>Tap below to select a file</h2>
        <input type="file" id="fileInput" style="font-size:16px;" />
        <script>
          const input = document.getElementById('fileInput');
          input.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
              alert('Selected file: ' + file.name);
            }
          });
        <\/script>
      </body>
    </html>
  `);

  newTab.document.close();
};
</script>

</body>
</html>
