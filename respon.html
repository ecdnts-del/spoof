<input
  type="button"
  value="CLICK ME"
  onclick="
    var opened = false;

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && opened) {
        // user came back (likely pressed Cancel)
        window.location.href = 'https://apple.com';
      }
    });

    opened = true;
    window.location.href = 'facetime://test@example.com';
  "
/>
