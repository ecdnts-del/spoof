<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>API Aplikasi PoC untuk iOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,system-ui;
      background:#f5f5f7;
    }

    button {
      margin:6px;
      font-size:14px;
      padding:8px 12px;
    }

    #panel {
      display:none;
      max-width:520px;
      margin:60px auto;
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }

    h2 { text-align:center; margin-bottom:6px; }
    .sub { text-align:center; color:#666; margin-bottom:20px; }

    .notice {
      margin-top:14px;
      font-size:13px;
      color:#b00020;
    }

    #apiResults {
      margin-top: 20px;
      font-size: 16px;
      color: #333;
    }

    #locationStatus, #microphoneStatus, #bluetoothStatus, #cameraStatus, #notificationStatus {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC for iOS</button>
</div>

<div id="panel">
  <h2>API Aplikasi iOS</h2>

  <button onclick="openLocation()">Open Location in Maps</button>
  <div id="locationStatus">Location: -</div>

  <button onclick="openMicrophone()">Access Microphone</button>
  <div id="microphoneStatus">Microphone: -</div>

  <button onclick="openBluetooth()">Open Bluetooth Settings</button>
  <div id="bluetoothStatus">Bluetooth: -</div>

  <button onclick="openCamera()">Open Camera</button>
  <div id="cameraStatus">Camera: -</div>

  <button onclick="sendNotification()">Send Notification</button>
  <div id="notificationStatus">Notification: -</div>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// Fungsi untuk membuka lokasi di Google Maps
function openLocation() {
  const location = "https://www.google.com/maps"; // Google Maps untuk iOS
  window.location.href = location;
  document.getElementById('locationStatus').textContent = "Location: Opened in Maps";
}

// Fungsi untuk membuka mikrofon (terbatas di iOS)
function openMicrophone() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      document.getElementById('microphoneStatus').textContent = 'Microphone Access: Granted';
    })
    .catch(() => {
      document.getElementById('microphoneStatus').textContent = 'Microphone Access: Denied';
      alert('Microphone access denied');
    });
}

// Fungsi untuk membuka pengaturan Bluetooth di iOS
function openBluetooth() {
  // iOS tidak mendukung URL Scheme untuk membuka Bluetooth Settings
  alert("Bluetooth settings cannot be accessed directly on iOS due to limitations.");
  document.getElementById('bluetoothStatus').textContent = "Bluetooth: Cannot open directly on iOS.";
}

// Fungsi untuk membuka kamera
function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      const camera = document.createElement('video');
      camera.srcObject = stream;
      camera.autoplay = true;
      document.body.appendChild(camera);
      document.getElementById('cameraStatus').textContent = 'Camera: Opened';
    })
    .catch(() => {
      document.getElementById('cameraStatus').textContent = 'Camera Access: Denied';
      alert('Camera access denied');
    });
}

// Fungsi untuk mengirimkan notifikasi
function sendNotification() {
  if (Notification.permission === "granted") {
    new Notification("This is a notification!");
    document.getElementById('notificationStatus').textContent = 'Notification: Sent';
  } else {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        new Notification("This is a notification!");
        document.getElementById('notificationStatus').textContent = 'Notification: Sent';
      } else {
        document.getElementById('notificationStatus').textContent = 'Notification: Denied';
      }
    });
  }
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Redirect ke Google setelah beberapa detik
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://www.google.com:8080'; // Redirect ke Google
      }, 2000); // 2 detik setelah klik tombol
    });
  });
});
</script>

</body>
</html>
