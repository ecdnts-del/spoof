<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Response</title>
</head>
<body>
    <h1>Login Response</h1>
    <p>Login berhasil! Data yang diterima:</p>
    <div id="login-data">
        <strong>Email: </strong><span id="email">Not Available</span><br>
        <strong>Password: </strong><span id="password">Not Available</span><br>
    </div>

    <script>
        // Fungsi untuk mendapatkan parameter dari URL (query string)
        function getQueryParams() {
            const params = {};
            window.location.search
                .substring(1)  // Hapus tanda "?"
                .split("&")    // Pisahkan setiap parameter
                .forEach(function(pair) {
                    const [key, value] = pair.split("=");  // Pisahkan key dan value
                    params[key] = decodeURIComponent(value);  // Decode value
                });
            return params;  // Kembalikan parameter sebagai object
        }

        // Mendapatkan parameter dari query string
        const params = getQueryParams();

        // Debugging: Log the received data to console
        console.log("Received Params:", params);

        // Memeriksa apakah data email dan password ada
        if (params.email && params.password) {
            // Tampilkan data di halaman
            document.getElementById("email").innerText = params.email;
            document.getElementById("password").innerText = params.password;
        } else {
            // Jika tidak ada data yang diterima, tampilkan pesan kesalahan
            document.getElementById("login-data").innerHTML = "<h2>No data received!</h2>";
        }
    </script>
</body>
</html>
