<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<button id="b" style="font-size:20px;padding:14px 24px">
  Share
</button>

<script>
let armed = false;

document.getElementById('b').onclick = async () => {
  if (!navigator.share) return;

  armed = true;

  // 1️⃣ Trusted system UI
  await navigator.share({
    title: 'Test',
    text: 'Chaining test',
    url: 'https://example.com'
  });
};

// 🔥 Fires when Share Sheet is dismissed on iOS
document.addEventListener('visibilitychange', () => {
  if (!armed || document.visibilityState !== 'visible') return;
  armed = false;

  // 2️⃣ Cross-origin navigation
  location.href = 'https://google.com';

  // 3️⃣ External mail app prompt AFTER navigation
  setTimeout(() => {
    location.href = 'mailto:test@example.com?subject=Hello&body=Test';
  }, 1200);
});
</script>
