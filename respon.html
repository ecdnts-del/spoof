<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>API Aplikasi PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

#apiResults {
  margin-top: 20px;
  font-size: 16px;
  color: #333;
}

#locationStatus, #microphoneStatus, #batteryStatus, #networkInfo, #bluetoothStatus, #cameraStatus, #notificationStatus, #clipboardStatus {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>API Aplikasi</h2>

  <button onclick="getLocation()">Get Location</button>
  <div id="locationStatus">Location: -</div>

  <button onclick="openMicrophone()">Access Microphone</button>
  <div id="microphoneStatus">Microphone: -</div>

  <button onclick="getBatteryStatus()">Get Battery Status</button>
  <div id="batteryStatus">Battery: -</div>

  <button onclick="getNetworkInfo()">Get Network Info</button>
  <div id="networkInfo">Network Info: -</div>

  <button onclick="openBluetooth()">Open Bluetooth Settings</button>
  <div id="bluetoothStatus">Bluetooth: -</div>

  <button onclick="openCamera()">Open Camera</button>
  <div id="cameraStatus">Camera: -</div>

  <button onclick="sendNotification()">Send Notification</button>
  <div id="notificationStatus">Notification: -</div>

  <button onclick="copyToClipboard()">Copy to Clipboard</button>
  <div id="clipboardStatus">Clipboard: -</div>

  <button onclick="openWhatsApp()">Open WhatsApp</button>
  <div id="whatsappStatus">WhatsApp: -</div>

  <button onclick="openZoom()">Open Zoom</button>
  <div id="zoomStatus">Zoom: -</div>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

// Fungsi untuk mendapatkan lokasi
function getLocation() {
  const locationStatus = document.getElementById('locationStatus');
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => locationStatus.textContent = `Location: Latitude: ${pos.coords.latitude}, Longitude: ${pos.coords.longitude}`,
      () => locationStatus.textContent = 'Location access denied'
    );
  } else {
    locationStatus.textContent = 'Geolocation not supported';
  }
}

// Fungsi untuk membuka mikrofon
function openMicrophone() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      document.getElementById('microphoneStatus').textContent = 'Microphone Access: Granted';
      console.log("Microphone Access Granted", stream);
    })
    .catch(() => {
      document.getElementById('microphoneStatus').textContent = 'Microphone Access: Denied';
      alert('Microphone access denied');
    });
}

// Fungsi untuk mendapatkan status baterai
function getBatteryStatus() {
  if (navigator.getBattery) {
    navigator.getBattery().then(battery => {
      document.getElementById('batteryStatus').textContent = `Battery Level: ${Math.round(battery.level * 100)}%`;
    });
  } else {
    document.getElementById('batteryStatus').textContent = 'Battery API not supported';
  }
}

// Fungsi untuk mendapatkan informasi jaringan
function getNetworkInfo() {
  if (navigator.connection) {
    document.getElementById('networkInfo').textContent = `Network: ${navigator.connection.effectiveType}`;
  } else {
    document.getElementById('networkInfo').textContent = 'Network API not supported';
  }
}

// Fungsi untuk membuka Bluetooth Settings
function openBluetooth() {
  if (navigator.userAgent.match(/Android/i)) {
    window.location.href = 'intent://settings/bluetooth/#Intent;scheme=package;package=com.android.bluetooth;end';
  }
  else if (navigator.userAgent.match(/iPhone|iPad/i)) {
    window.location.href = 'App-Prefs:root=Bluetooth';
  }
  document.getElementById('bluetoothStatus').textContent = 'Opening Bluetooth Settings...';
}

// Fungsi untuk membuka kamera
function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      const camera = document.createElement('video');
      camera.srcObject = stream;
      camera.autoplay = true;
      document.body.appendChild(camera);
      document.getElementById('cameraStatus').textContent = 'Camera: Opened';
    })
    .catch(() => {
      document.getElementById('cameraStatus').textContent = 'Camera Access: Denied';
      alert('Camera access denied');
    });
}

// Fungsi untuk mengirimkan notifikasi
function sendNotification() {
  if (Notification.permission === "granted") {
    new Notification("This is a notification!");
    document.getElementById('notificationStatus').textContent = 'Notification: Sent';
  } else {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        new Notification("This is a notification!");
        document.getElementById('notificationStatus').textContent = 'Notification: Sent';
      } else {
        document.getElementById('notificationStatus').textContent = 'Notification: Denied';
      }
    });
  }
}

// Fungsi untuk menyalin teks ke clipboard
function copyToClipboard() {
  const text = "Hello, this is some text to copy!";
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('clipboardStatus').textContent = 'Clipboard: Text copied!';
  }).catch(() => {
    document.getElementById('clipboardStatus').textContent = 'Clipboard: Copy failed';
  });
}

// Fungsi untuk membuka WhatsApp menggunakan URL scheme
function openWhatsApp() {
  const phoneNumber = "1234567890";  // Ganti dengan nomor yang sesuai
  const url = `https://wa.me/${phoneNumber}`;
  window.location.href = url;
  document.getElementById('whatsappStatus').textContent = `WhatsApp: Opened with phone number ${phoneNumber}`;
}

// Fungsi untuk membuka Zoom menggunakan URL scheme
function openZoom() {
  const meetingId = "123456789";  // Ganti dengan ID meeting yang sesuai
  const password = "abcd1234";    // Ganti dengan password meeting yang sesuai
  const url = `zoomus://zoom.us/join?confno=${meetingId}&pwd=${password}`;
  window.location.href = url;
  document.getElementById('zoomStatus').textContent = `Zoom: Opened with meeting ID ${meetingId}`;
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Mengarah ke Google setelah beberapa detik
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://www.google.com:9000'; // Redirect ke Google
      }, 80); // 2 detik setelah klik tombol
    });
  });
});
</script>

</body>
</html>
