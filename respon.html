<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iOS Web Intent‑Like Test PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
  margin:0;
}
#box {
  max-width:460px;
  margin:70px auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:15px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
}
pre {
  background:#111;
  color:#0f0;
  padding:12px;
  font-size:12px;
  max-height:220px;
  overflow:auto;
}
.small { font-size:12px; color:#666; }
</style>
</head>

<body>

<div id="box">
  <h3>iOS Web “Intent” Test</h3>
  <p class="small">
    Test only — observing iOS system handling<br>
    (not an exploit)
  </p>

  <button onclick="openScheme('fb://profile')">
    Test: fb:// (Facebook)
  </button>

  <button onclick="openScheme('googlechrome://')">
    Test: googlechrome://
  </button>

  <button onclick="openScheme('calculator://')">
    Test: calculator:// (expected fail)
  </button>

  <button onclick="openHTTPS()">
    Control: normal HTTPS navigation
  </button>

  <pre id="log"></pre>
</div>

<script>
const log = m =>
  document.getElementById('log').textContent += m + "\n";

function openScheme(scheme) {
  log("[*] Trying scheme: " + scheme);

  const start = Date.now();

  // iframe trick — common *test* method
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = scheme;
  document.body.appendChild(iframe);

  setTimeout(() => {
    document.body.removeChild(iframe);
    log("[*] Returned after " + (Date.now() - start) + "ms");
    log("    (If app exists, iOS may prompt or switch)");
  }, 1500);
}

function openHTTPS() {
  log("[*] Navigating to https://example.com");
  location.href = "https://google.com:80";
}
</script>

</body>
</html>
