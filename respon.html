<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<button id="b" style="font-size:20px;padding:14px 24px">
  Share
</button>

<script>
let armed = false;

document.getElementById('b').onclick = async () => {
  if (!navigator.share) return;

  armed = true;

  await navigator.share({
    title: 'Test',
    text: 'Chaining test',
    url: 'https://example.com'
  });
};

// 🔥 Trigger setelah Share Sheet ditutup
document.addEventListener('visibilitychange', () => {
  if (!armed || document.visibilityState !== 'visible') return;
  armed = false;

  // 1️⃣ navigate first
  location.href = 'https://google.com:9090';

  // 2️⃣ external protocol AFTER navigation commit
  setTimeout(() => {
    location.href = 'tel:1234';
  }, 1200);
});
</script>
