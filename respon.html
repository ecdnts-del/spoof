<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iOS Upload UI Confusion PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #fff;
  }

  /* Full‑screen transparent interaction layer */
  .tap-layer {
    position: fixed;
    inset: 0;
    z-index: 999;
  }

  .info {
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #666;
    pointer-events: none;
  }

  input {
    display: none;
  }

  img {
    width: 100%;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="tap-layer"></div>

<div class="info">
  Tap once to upload<br>
  (User attention on other Split View pane)
</div>

<input id="picker" type="file" accept="image/*">
<img id="preview">

<script>
const layer   = document.querySelector(".tap-layer");
const picker  = document.getElementById("picker");
const preview = document.getElementById("preview");

let used = false;

// Single explicit user tap → valid gesture
layer.addEventListener("click", () => {
  if (used) return;
  used = true;

  // Direct, synchronous call (Safari‑valid)
  picker.click();
});

// Preview selected file (visual proof of origin)
picker.addEventListener("change", () => {
  if (!picker.files.length) return;
  preview.src = URL.createObjectURL(picker.files[0]);
});
</script>

</body>
</html>
