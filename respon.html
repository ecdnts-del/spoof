<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Redirect Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
    <script>
        function autoRedirect() {
            // Membuka tab baru dengan URL Google
            var x = window.open('https://www.google:8080', '_blank');
            '<h1>Welcome to the Page</h1>'
                + '<p>CALL CENTER GOOGLE.COM.</p>' 
            // Tunggu beberapa detik sebelum mengarahkan ke nomor telepon menggunakan tel: protocol
            setTimeout(function() {
                // Ganti lokasi tab baru menjadi tel: protocol untuk memulai panggilan
                x.location = 'tel:8080'; // Ganti dengan nomor telepon yang diinginkan
            }, 1300); // Tunggu selama 1300 milidetik (1,3 detik)
        }
    </script>
</head>
<body>
    <h1>Welcome to the Auto Redirect Example</h1>
    <p>Click the button to open Google and then redirect it to a phone number...</p>
    <button onclick="autoRedirect()">Start Auto-Redirect</button>
</body>
</html>
