<!doctype html>
<button id="start">START</button>

<!-- File Input element untuk memilih file -->
<input type="file" id="fileInput" style="display: none;" />

<script>
const log = (...a) => console.log("[PoC]", ...a);

// Fungsi untuk menangani pemilihan file
document.getElementById("start").onclick = () => {
  log("click isActive:", navigator.userActivation.isActive);
  
  // Menyembunyikan input file dan men-trigger event klik
  document.getElementById("fileInput").click();
};

// Menangani perubahan file input
document.getElementById("fileInput").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (file) {
    log("FILE PICKER OPENED:", file.name);
  } else {
    log("No file selected.");
  }
});

// Event listener untuk popstate, yang akan di-trigger saat pengguna menekan tombol back
window.addEventListener("popstate", () => {
  setTimeout(async () => {
    log("popstate isActive:", navigator.userActivation.isActive);

    // Redirect ke Google.com setelah popstate untuk mensimulasikan efek dari popstate
    window.location.href = "https://www.google.com";
  }, 0);
});
</script>
