<!doctype html>
<button id="b">Share</button>

<script>
document.getElementById('b').onclick = async () => {
  if (!navigator.share) return;

  // 1️⃣ Navigasi cepat setelah gesture
  setTimeout(() => {
    location.href = 'https://google.com';
  }, 300);

  // 2️⃣ Share Sheet (trusted UI)
  await navigator.share({
    title: 'Test',
    text: 'Chaining test',
    url: 'https://example.com'
  });

  // 3️⃣ Setelah Share selesai → external protocol
  setTimeout(() => {
    location.href = 'tel:1234';
  }, 800);
};
</script>
