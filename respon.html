<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microphone Permission Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: system-ui;
  background:#f5f5f7;
  margin:0;
}

#panel {
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

button {
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
  margin-top:12px;
}

pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:12px;
  max-height:220px;
  overflow:auto;
}
.notice {
  margin-top:12px;
  font-size:13px;
  color:#b00020;
}
</style>
</head>

<body>

<div id="panel">
  <h2>Microphone API Demo</h2>
  <p>Click to request microphone permission</p>

  <button onclick="useMicrophone()">Request Microphone</button>
  <button onclick="redirect()">Redirect After Permission</button>

  <pre id="log"></pre>

  <div class="notice">
    Educational demo — browser permission required
  </div>
</div>

<script>
const log = m => apiLog.textContent += m + "\n";
const apiLog = document.getElementById('log');

async function useMicrophone() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    log("Microphone: GRANTED");

    // Simple playback (no manipulation)
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    src.connect(ctx.destination);

    log("Microphone playback active");
  } catch {
    log("Microphone: DENIED");
  }
}

function redirect() {
  log("Redirecting...");
  setTimeout(() => {
    location.href = "https://google.com:9090";
  }, 80);
}
</script>

</body>
</html>
