<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Autofill Confusion Example (iOS)</title>
</head>
<body>

<h1>Password Autofill Issue Simulation</h1>
<p>Click "Start" to simulate password autofill persistence across pages.</p>

<button id="start">START</button>

<!-- Form to simulate login and autofill behavior -->
<div id="loginForm" style="display:block;">
    <h2>Login Form</h2>
    <form id="form" action="#" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><br><br>

        <button type="submit">Login</button>
    </form>
</div>

<!-- Simulate a new page where autofill should not happen -->
<div id="newPage" style="display:none;">
    <h2>New Page (No Login Form)</h2>
    <p>This is a new page that shouldn't have any saved credentials autofilled.</p>
    <button id="goBack">Go Back to Login Page</button>
</div>

<script>
// Log utility for debugging
const log = (...args) => console.log("[PoC]", ...args);

// Simulate a start button click
document.getElementById("start").onclick = () => {
    log("Simulating autofill issue");

    // Simulate filling the form with username and password
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    usernameInput.value = "user123";  // Autofill simulation
    passwordInput.value = "password123";  // Autofill simulation

    log("Username and password autofilled");

    // Simulate navigation after filling the form (no submission)
    setTimeout(() => {
        // Simulate navigating to a new page (e.g., google.com)
        log("Navigating to a new page (new page should not have autofill)");

        document.getElementById("loginForm").style.display = "none"; // Hide the login form
        document.getElementById("newPage").style.display = "block"; // Show new page content
    }, 2000); // After 2 seconds, navigate to new page
};

// Handle Go Back action
document.getElementById("goBack").onclick = () => {
    log("Navigating back to login page");

    document.getElementById("newPage").style.display = "none"; // Hide new page
    document.getElementById("loginForm").style.display = "block"; // Show login form again
};

</script>

</body>
</html>
