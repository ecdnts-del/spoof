<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Navigation</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  body { font-family: sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  #qrcode { margin:20px; }
  button { padding:10px 20px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<h1>QR Code Navigation POC</h1>
<div id="qrcode"></div>
<button id="b">Generate QR Code</button>

<script>
const qrcodeContainer = document.getElementById('qrcode');

document.getElementById('b').onclick = async () => {
  // Example URL to navigate when QR is scanned
  const urlToNavigate = 'https://google.com';
  
  // Optionally you can do a pre-action here, like copying text or showing a message
  alert('Scan this QR code to navigate!');

  // Generate QR code pointing to URL
  qrcodeContainer.innerHTML = ''; // clear previous
  QRCode.toCanvas(urlToNavigate, { width: 200 }, function (error, canvas) {
    if (error) console.error(error);
    qrcodeContainer.appendChild(canvas);
  });
};
</script>

</body>
</html>
