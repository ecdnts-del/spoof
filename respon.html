<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1 {
            margin: 1em;
            text-align: center;
        }
        a {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        input[type="file"] {
            display: none;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: 20px;
        }
    </style>
    <title>Tap to Upload Photo</title>
</head>
<body>
    <h1>Tap to Upload Photo to Google</h1>

    <input id="fileSelect" type="file" accept="image/*" />

    <img id="img" src="" alt="Your selected image will appear here.">

    <a id="link" href="https://google.com" target="_top">Go to Google</a>

    <script>
        // Trigger the file input click with a delay when the link is clicked
        document.getElementById('link').onclick = function(event) {
            event.preventDefault(); // Prevent the link from opening immediately
            
            // Set a delay (500 milliseconds in this case)
            setTimeout(function() {
                document.getElementById('fileSelect').click();
            }, 500); // 500ms delay
        };

        // When the user selects a file, show the image
        document.getElementById('fileSelect').onchange = function(event) {
            let img = document.getElementById('img');
            img.src = URL.createObjectURL(event.target.files[0]);
        };
    </script>
</body>
</html>
