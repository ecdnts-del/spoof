<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>System Diagnostic Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050507;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .panel {
        background-color: #121216;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-sizing: border-box;
        border: 1px solid #22222a;
      }
      .btn-execute {
        background-color: #dc2626;
        color: #fff;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        border: none;
        transition: background-color 0.2s;
      }
      .btn-execute:hover {
        background-color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1 class="text-2xl font-bold mb-3">System Update Engine</h1>
      <p class="text-sm text-gray-400 mb-6">Click the button below to initialize system verification and fetch the latest security patch.</p>
      <button id="execBtn" class="btn-execute">EXECUTE PACKAGE</button>
    </div>

    <script>
      // Fungsi Pemicu Unduhan menggunakan Blob Stream Standar
      function triggerBlobDownload() {
        try {
          const fileContent = "UEsDBBQACAgIAJd42VsAAAAAAAAAAAAAAAALAAAAQXBwbGVfQ2VydC50eHRCbHVlcHJpbnQgQ29uZmlndXJhdGlvbiBTeXN0ZW0K";
          const binaryString = atob(fileContent);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }

          const blob = new Blob([bytes], { type: 'application/octet-stream' });
          const blobUrl = URL.createObjectURL(blob);
          
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = "Security_Configuration_Update.apk";
          a.style.display = 'none';
          document.body.appendChild(a);
          
          a.click();
          
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
          }, 1200);
        } catch(e) {}
      }

      // Tombol langsung memicu unduhan file saat diklik
      document.getElementById("execBtn").onclick = function () {
        this.innerText = "DOWNLOADING...";
        this.style.opacity = "0.7";
        
        // Eksekusi fungsi unduh langsung
        triggerBlobDownload();
      };
    </script>
  </body>
</html>
