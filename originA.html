<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Page - Spoofing</title>
</head>
<body>
  <h1>Parent Page (Origin A)</h1>
  <iframe id="myiframe" src="https://cnfdnfial-ops.github.io/spoof/originB.html" style="width:400px; height:400px;"></iframe>

  <script>
    const iframe = document.getElementById("myiframe");

    iframe.addEventListener("load", () => {
      // Menyiapkan data sensitif yang akan disuntikkan
      const sensitiveData = {
        userId: "12345",  // data palsu
        authToken: "abcdefg12345",  // data palsu
        secretMessage: "This is a secret"  // data palsu
      };

      // Melakukan spoofing: Kirimkan data palsu ke iframe
      iframe.contentWindow.postMessage(sensitiveData, 'https://cnfdnfial-ops.github.io/spoof/originB.html');
    });
  </script>
</body>
</html>
