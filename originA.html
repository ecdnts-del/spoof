<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Page - Transferable Objects</title>
</head>
<body>
  <h1>Parent Page (Origin A)</h1>
  <canvas id="mycanvas" width="300" height="300"></canvas>
  <iframe id="myiframe" src="https://cnfdnfial-ops.github.io/spoof/originB.html" style="width:400px; height:400px;"></iframe>

  <script>
    const iframe = document.getElementById("myiframe");
    const canvas = document.getElementById("mycanvas");

    iframe.addEventListener("load", () => {
      // Transfer canvas ke OffscreenCanvas
      const offscreen = canvas.transferControlToOffscreen();

      // Kirim ke iframe sebagai transferable
      iframe.contentWindow.postMessage({ offscreen }, 'https://cnfdnfial-ops.github.io/spoof/originB.html', [offscreen]);
    });
  </script>
</body>
</html>
