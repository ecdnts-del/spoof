<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origin A - Cross-Origin Isolation Failure</title>
</head>
<body>
  <h1>Main Page (Trusted Origin)</h1>

  <iframe id="x" src="https://cnfdnfial-ops.github.io/spoof/originB.html"
    allow="fullscreen"
    style="width:100%; height:500px; border:1px solid black;">
  </iframe>

  <script>
    // Menerima pesan dari iframe dan mencoba memasukkan kontrol fullscreen dari parent
    window.addEventListener("message", function (e) {
      if (e.origin !== "https://cnfdnfial-ops.github.io") return;
      if (e.data === "go-fullscreen") {
        document.documentElement.requestFullscreen(); // Mencoba masuk fullscreen
      }
    });
  </script>
</body>
</html>
