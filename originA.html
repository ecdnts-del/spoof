<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Page - Transferable Objects</title>
</head>
<body>
  <h1>Parent Page (Origin A)</h1>
  <iframe id="myiframe" src="https://cnfdnfial-ops.github.io/spoof/originB.html" style="width: 600px; height: 400px;"></iframe>

  <script>
    const iframe = document.getElementById("myiframe");

    iframe.addEventListener("load", () => {
      // Membuat ArrayBuffer dan mengirimkannya ke iframe
      const buffer = new ArrayBuffer(16); // ArrayBuffer 16 byte
      const view = new DataView(buffer);
      view.setUint8(0, 42); // Set data dalam ArrayBuffer

      // Mengirim buffer sebagai transferable object
      iframe.contentWindow.postMessage({ buffer }, 'https://cnfdnfial-ops.github.io/spoof/originB.html', [buffer]);
    });
  </script>
</body>
</html>
