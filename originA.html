<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Page - Cookie Spoofing</title>
</head>
<body>
  <h1>Parent Page (Origin A)</h1>
  <iframe id="myiframe" src="https://cnfdnfial-ops.github.io/spoof/originB.html" style="width:400px; height:400px;"></iframe>

  <script>
    const iframe = document.getElementById("myiframe");

    iframe.addEventListener("load", () => {
      // Menyiapkan data palsu untuk cookies
      document.cookie = "userId=12345; path=/";
      document.cookie = "authToken=abcdefg12345; path=/";
      document.cookie = "role=admin; path=/";  // Data palsu yang bisa digunakan di iframe

      // Kirimkan informasi ini melalui postMessage
      iframe.contentWindow.postMessage({ message: "Data cookies telah disuntikkan" }, 'https://cnfdnfial-ops.github.io/spoof/originB.html');
    });
  </script>
</body>
</html>
