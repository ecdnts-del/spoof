
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tapjacking & Double-Tap Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }
        h1 {
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        code {
            background: #2d2d2d;
            color: #ff8a80;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        .interactive-zone {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>ðŸ”´ Double-Tap Interaction Labss</h1>
    <p style="font-size: 12px; color: #888;">Simulasi pengujian respons klik ganda terhadap kemunculan dialog izin.</p>

    <div class="interactive-zone">
        <input id="input" type="time" list="times" style="display:none;" />
        <datalist id="times">
            <select>
                <option label="--">00:00</option>
                <option label="--">00:01</option>
                <option label="        Allow this time        ">00:02</option>
                <option label="--">00:03</option>
                <option label="--">00:04</option>
                <option label="--">00:05</option>
                <option label="--">00:06</option>
                <option label="--">00:07</option>
                <option label="        CLICK FASTER ðŸ”´        ">00:08</option>
                <option label="--">CLICK FASTER  ðŸ”´</option>
                <option label="--">CLICK FASTER  ðŸ”´</option>
            </select>
        </datalist>
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik...
    </div>

<script>
(() => {
    "use strict";

    const logBox = document.getElementById("log-box");
    const input = document.getElementById("input");

    let clickCount = 0;
    let watchId = null;
    let lastPointerTime = null;
    let permissionStatus = null;

    let pickerAttempts = 0;
    let pickerErrors = 0;

    const intervalHistory = [];
    const MAX_LOGS = 100;

    // Logging

    function appendLog(msg) {
        console.log(msg);

        const line = document.createElement("div");
        line.textContent =
            `[${new Date().toLocaleTimeString()}] ${msg}`;

        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;

        while (logBox.children.length > MAX_LOGS) {
            if (logBox.children.length > 1) {
                logBox.removeChild(logBox.children[1]);
            }
        }
    }

    // User activation

    function activationState() {
        if (!navigator.userActivation) {
            return "unavailable";
        }

        return JSON.stringify({
            active: navigator.userActivation.isActive,
            previouslyActive:
                navigator.userActivation.hasBeenActive
        });
    }

    // Permission monitoring

    async function monitorPermission() {
        try {
            permissionStatus =
                await navigator.permissions.query({
                    name: "geolocation"
                });

            appendLog(
                `[Permission Initial] ${permissionStatus.state}`
            );

            permissionStatus.addEventListener("change", () => {
                appendLog(
                    `[Permission Changed] ${permissionStatus.state}`
                );
            });

        } catch (error) {
            appendLog(
                `[Permission API Error] ${error.name}: ${error.message}`
            );
        }
    }

    // Pointer monitoring

    document.body.addEventListener("pointerdown", (event) => {

        const now = performance.now();

        const interval = lastPointerTime === null
            ? null
            : Number((now - lastPointerTime).toFixed(2));

        lastPointerTime = now;
        clickCount++;

        if (interval !== null) {
            intervalHistory.push(interval);

            if (intervalHistory.length > 100) {
                intervalHistory.shift();
            }
        }

        appendLog(
            `[Pointer #${clickCount}] ` +
            `Type=${event.pointerType}, ` +
            `Trusted=${event.isTrusted}, ` +
            `Interval=${interval ?? "first"}ms, ` +
            `Activation=${activationState()}`
        );

        // Picker observation

        try {
            pickerAttempts++;
            input.showPicker();

            appendLog(
                `[Picker Requested] Attempt=${pickerAttempts}`
            );

        } catch (error) {
            pickerErrors++;

            appendLog(
                `[Picker Error] ${error.name}: ${error.message}`
            );
        }

        // Nine-interaction observation

        if (clickCount === 9) {

            const averageInterval =
                intervalHistory.length
                    ? (
                        intervalHistory.reduce(
                            (sum, value) => sum + value, 0
                        ) / intervalHistory.length
                    ).toFixed(2)
                    : "N/A";

            appendLog(
                "[Interaction Threshold] Nine interactions recorded."
            );

            appendLog(
                `[Statistics] Average=${averageInterval}ms, ` +
                `Picker attempts=${pickerAttempts}, ` +
                `Picker errors=${pickerErrors}, ` +
                `Permission=${permissionStatus?.state ?? "unknown"}`
            );

            clickCount = 0;
        }

    }, { passive: true });

    // Geolocation API

    function requestGeolocation() {

        if (!navigator.geolocation) {
            appendLog("[Geolocation] API unavailable.");
            return;
        }

        if (watchId !== null) {
            appendLog("[Geolocation] Watch already active.");
            return;
        }

        appendLog(
            "[Geolocation] Requesting location permission..."
        );

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        watchId = navigator.geolocation.watchPosition(

            (position) => {

                const coords = position.coords;

                appendLog(
                    `[GPS SUCCESS] Latitude=${coords.latitude}, ` +
                    `Longitude=${coords.longitude}, ` +
                    `Accuracy=${coords.accuracy}m`
                );

                appendLog(
                    `[GPS DETAILS] Timestamp=${new Date(
                        position.timestamp
                    ).toLocaleTimeString()}`
                );

            },

            (error) => {

                appendLog(
                    `[GPS ERROR] Code=${error.code}, ` +
                    `Message=${error.message}`
                );

                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }

            },

            geoOptions
        );
    }

    // Stop Geolocation

    function stopGeolocation() {

        if (watchId !== null) {

            navigator.geolocation.clearWatch(watchId);
            watchId = null;

            appendLog("[Geolocation] Tracking stopped.");

        } else {

            appendLog("[Geolocation] No active tracking.");

        }
    }

    // Explicit confirmation after nine interactions

    document.body.addEventListener("click", (event) => {

        if (event.target === input) {
            return;
        }

        if (clickCount >= 9) {
            appendLog(
                "[Geolocation] Interaction threshold observed. " +
                "Location request requires explicit confirmation."
            );
        }

    });

    // Visibility monitoring

    document.addEventListener("visibilitychange", () => {
        appendLog(
            `[Visibility] ${document.visibilityState}`
        );
    });

    window.addEventListener("blur", () => {
        appendLog("[Window] Blur detected.");
    });

    window.addEventListener("focus", () => {
        appendLog("[Window] Focus restored.");
    });

    // Initialization

    appendLog("[Lab] Initialized.");

    appendLog(
        `[Environment] SecureContext=${window.isSecureContext}`
    );

    appendLog(
        `[Environment] Geolocation=${!!navigator.geolocation}`
    );

    appendLog(
        `[Environment] Browser=${navigator.userAgent}`
    );

    monitorPermission();

    // Geolocation is intentionally not auto-triggered.
    // Call requestGeolocation() from an explicit user action
    // in an authorized test interface.

})();
</script>

</body>
</html>
