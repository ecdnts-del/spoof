
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tapjacking & Double-Tap Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }

        h1 {
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        code {
            background: #2d2d2d;
            color: #ff8a80;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }

        .interactive-zone {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <h1>Double-Tap Interaction Lab</h1>

    <p style="font-size: 12px; color: #888;">
        Simulation of repeated pointer interactions and browser permission behavior.
    </p>

    <div class="interactive-zone">
        <input id="input" type="time" list="times" style="display:none;" />

        <datalist id="times">
            <select>
                <option label="--">00:00</option>
                <option label="--">00:01</option>
                <option label="Allow this time">00:02</option>
                <option label="--">00:03</option>
                <option label="--">00:04</option>
                <option label="--">00:05</option>
                <option label="--">00:06</option>
                <option label="--">00:07</option>
                <option label="Click faster">00:08</option>
                <option label="--">00:09</option>
                <option label="--">00:10</option>
            </select>
        </datalist>
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Waiting for interaction...
    </div>

<script>
(() => {
    "use strict";

    const logBox = document.getElementById("log-box");
    const input = document.getElementById("input");

    let clickCount = 0;
    let watchId = null;

    function appendLog(msg) {
        console.log(msg);

        const line = document.createElement("div");
        line.textContent =
            `[${new Date().toLocaleTimeString()}] ${msg}`;

        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // User activation observation

    function activationState() {
        if (!navigator.userActivation) {
            return "unavailable";
        }

        return JSON.stringify({
            active: navigator.userActivation.isActive,
            previouslyActive:
                navigator.userActivation.hasBeenActive
        });
    }

    // Pointer interaction monitoring

    document.body.addEventListener("pointerdown", (event) => {

        clickCount++;

        appendLog(
            `Pointer #${clickCount} | ` +
            `Type: ${event.pointerType} | ` +
            `Trusted: ${event.isTrusted} | ` +
            `Activation: ${activationState()}`
        );

        // Picker interaction observation

        try {
            input.showPicker();

            appendLog("showPicker() invoked.");

        } catch (error) {

            appendLog(
                `Picker error: ${error.name}: ${error.message}`
            );
        }

        // Interaction threshold observation

        if (clickCount === 9) {

            appendLog(
                "Nine pointer interactions recorded."
            );

            appendLog(
                "Geolocation requires explicit user confirmation."
            );

            clickCount = 0;
        }

    }, { passive: true });

    // Geolocation API

    function requestGeolocation() {

        if (!navigator.geolocation) {
            appendLog("Geolocation API unavailable.");
            return;
        }

        if (watchId !== null) {
            appendLog("Geolocation watch already active.");
            return;
        }

        appendLog("Requesting Geolocation permission.");

        watchId = navigator.geolocation.watchPosition(

            (position) => {

                appendLog(
                    `GPS received: Latitude=${position.coords.latitude}, ` +
                    `Longitude=${position.coords.longitude}, ` +
                    `Accuracy=${position.coords.accuracy}m`
                );

            },

            (error) => {

                appendLog(
                    `Geolocation error: ${error.code} - ${error.message}`
                );

                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // Stop Geolocation

    function stopGeolocation() {

        if (watchId !== null) {

            navigator.geolocation.clearWatch(watchId);
            watchId = null;

            appendLog("Geolocation tracking stopped.");

        } else {

            appendLog("No active Geolocation tracking.");

        }
    }

    // Initialization

    appendLog("Lab initialized.");

    appendLog(
        `Secure context: ${window.isSecureContext}`
    );

    appendLog(
        `Geolocation available: ${!!navigator.geolocation}`
    );

    appendLog(
        `Browser: ${navigator.userAgent}`
    );

})();
</script>

</body>
</html>
