<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instruction Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      background: #f6f6f6;
      cursor: pointer;
      user-select: none;
    }
    h1 {
      max-width: 420px;
      text-align: center;
      color: #222;
      padding: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>
    Please follow the instruction.<br>
    Tap anywhere to continue.
  </h1>

  <script>
    function triggerDownload() {
      const content = 'Demo file generated after a single user interaction.';
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'result.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    }

    document.addEventListener(
      'click',
      () => {
        // Step 1: Download happens
        triggerDownload();

        // Step 2: Delayed redirect
        setTimeout(() => {
          location.href = 'https://www.google.com';
        }, 3000);
      },
      { once: true }
    );
  </script>
</body>
</html>
