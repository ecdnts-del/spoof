<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instruction Demo Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f2f2f2;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      color: #222;
      text-align: center;
      max-width: 420px;
      padding: 24px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>
    Please follow the instruction below.<br>
    Tap anywhere on the screen and wait a moment.
  </h1>

  <script>
    function triggerIOSDownload() {
      const content = 'Demo file generated after user interaction.';
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'instruction_result.zip';
      document.body.appendChild(a);
      a.click();

      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.addEventListener(
      'touchstart',
      () => {
        setTimeout(() => {
          triggerIOSDownload();
        }, 3500);
      },
      { once: true }
    );
  </script>
</body>
</html>
