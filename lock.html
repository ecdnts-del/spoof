<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victim - Shared Screen View (Origin B)</title>
  <style>
    #sharedScreen {
      width: 100%;
      height: 100%;
      background-color: black;
    }
  </style>
</head>
<body>
  <h2>Victim's Shared Screen</h2>
  <!-- Menggunakan iframe untuk mencoba menampilkan layar yang dibagikan -->
  <iframe id="screenFrame" src="https://cnfdnfial-ops.github.io/spoof/origina.html" width="100%" height="500px" style="border: none;">
  </iframe>
  
  <script>
    // Untuk menampilkan konten berbagi layar di dalam iframe, kita perlu komunikasi antar-origin
    window.addEventListener('message', (event) => {
      if (event.origin !== 'https://cnfdnfial-ops.github.io/') {
        return;
      }

      // Mendapatkan stream dari pesan
      const stream = event.data;
      const videoElement = document.createElement('video');
      videoElement.srcObject = stream;
      document.body.appendChild(videoElement);
    });
  </script>
</body>
</html>
