<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker PoC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .output {
            margin-top: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>File Picker PoC (Proof of Concept)</h1>
    <p>Silakan pilih file atau folder untuk melihat path-nya:</p>

    <input type="file" id="filePicker" multiple directory>
    <br><br>

    <div class="output" id="output">
        <!-- Hasil output akan ditampilkan di sini -->
    </div>

    <script>
        document.getElementById("filePicker").addEventListener("change", function(event) {
            const output = document.getElementById("output");
            output.innerHTML = "";  // Clear previous output

            // Menampilkan informasi file atau folder yang dipilih
            if (event.target.files.length === 0) {
                output.innerHTML = "<p>Tidak ada file yang dipilih.</p>";
            } else {
                for (let i = 0; i < event.target.files.length; i++) {
                    const file = event.target.files[i];
                    const fileInfo = `<p>File: ${file.name} | Path: ${file.webkitRelativePath}</p>`;
                    output.innerHTML += fileInfo;
                }
            }
        });
    </script>

</body>
</html>
