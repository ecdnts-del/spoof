<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UI Spoofing Demo (Safe PoC)</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 2147483647;

  display: none;
  align-items: center;
  justify-content: center;

  color: white;
  font-size: 32px;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<button onclick="show()">Trigger PoC</button>

<div id="overlay">
  <div>
    <p>Fullscreen UI Overlay</p>
    <p>(Visual spoofing demonstration)</p>
    <button onclick="hide()">Close</button>
  </div>
</div>

<script>
function show() {
  document.getElementById('overlay').style.display = 'flex';
}

function hide() {
  document.getElementById('overlay').style.display = 'none';
}
</script>

</body>
</html>
