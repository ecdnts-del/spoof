<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fullscreen Overlay Demo</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;

  background: rgba(0,0,0,0.95);
  z-index: 999999;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  font-size: 32px;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<button onclick="show()">SHOW OVERLAY</button>

<div id="overlay" style="display:none;">
  <div>
    <p>FULLSCREEN OVERLAY</p>
    <button onclick="hide()">Close</button>
  </div>
</div>

<script>
function show() {
  document.getElementById('overlay').style.display = 'flex';
}

function hide() {
  document.getElementById('overlay').style.display = 'none';
}
</script>

</body>
</html>
