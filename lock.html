<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Download ZIP Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.1);
      text-align: center;
      width: 360px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1558c0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Download ZIP</h2>
  <p>Klik tombol untuk download file ZIP (dummy)</p>
  <button onclick="downloadZip()">⬇ Download ZIP</button>
</div>

<!-- JSZip CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
async function downloadZip() {
  const zip = new JSZip();

  // isi bebas
  zip.file("readme.txt", "Ini file contoh");
  zip.file("data/info.txt", "Data dummy");
  zip.file("config.json", JSON.stringify({
    status: "ok",
    time: new Date().toISOString()
  }, null, 2));

  const content = await zip.generateAsync({ type: "blob" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(content);
  a.download = "contoh.zip";
  a.click();

  URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
