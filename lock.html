<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fullscreen Overlay PoC</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

/* FULLSCREEN OVERLAY */
#overlay {
  position: fixed;
  inset: 0; /* top:0 right:0 bottom:0 left:0 */
  background: rgba(0,0,0,0.96);
  z-index: 2147483647;

  display: none;
  align-items: center;
  justify-content: center;

  color: white;
  text-align: center;
  padding: env(safe-area-inset-top)
           env(safe-area-inset-right)
           env(safe-area-inset-bottom)
           env(safe-area-inset-left);
}

#overlay-content {
  max-width: 90%;
}

#overlay h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

#overlay p {
  font-size: 18px;
  opacity: 0.9;
}

#overlay button {
  margin-top: 30px;
  padding: 12px 24px;
  font-size: 18px;
  border: none;
  background: #ff4444;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<button onclick="showOverlay()">Trigger PoC</button>

<div id="overlay">
  <div id="overlay-content">
    <h1>Fullscreen UI Overlay</h1>
    <p>Visual spoofing demonstration for security report</p>
    <button onclick="hideOverlay()">Close</button>
  </div>
</div>

<script>
function showOverlay() {
  document.getElementById('overlay').style.display = 'flex';
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

/* OPTIONAL: auto-trigger after page load (good for video PoC) */
// window.onload = () => {
//   setTimeout(showOverlay, 800);
// };
</script>

</body>
</html>
