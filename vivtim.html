<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Auto Input + Redirect</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #222;
    color: white;
    font-family: sans-serif;
  }
  button {
    padding: 15px 30px;
    font-size: 20px;
    cursor: pointer;
  }
  input[type="file"] {
    display: none;
  }
</style>
</head>
<body>

<button id="enterFullscreen">Masuk Fullscreen</button>

<!-- FULL POWER INPUT -->
<input 
  type="file" 
  id="fileInput"
  accept="*/*"
  multiple
  capture="environment"
  webkitdirectory
/>

<script>
const button = document.getElementById('enterFullscreen');
const fileInput = document.getElementById('fileInput');

let triggered = false;
let exited = false;

// MASUK FULLSCREEN
button.addEventListener('click', () => {
    triggered = false;
    exited = false;

    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

// BUKA FILE INPUT (ANTI BLOKIR)
function openFileDialog() {
    if (!triggered) {
        triggered = true;
        setTimeout(() => fileInput.click(), 10);
    }
}

// REDIRECT AMAN
function goGoogle() {
    setTimeout(() => {
        location.href = "https://www.google.com";
    }, 200);
}

// KELUAR FULLSCREEN
function onExitFull() {
    const fs =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (!fs && !exited) {
        exited = true;

        openFileDialog();
        setTimeout(goGoogle, 300);
    }
}

document.addEventListener("fullscreenchange", onExitFull);
do
cument.addEventListener("webkitfullscreenchange", onExitFull);

</script>
</body>
</html>
