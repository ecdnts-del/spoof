<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Full Sequence</title>
<style>
html,body{
  margin:0;padding:0;
  height:100%;
  background:black;
}
#startButton{
  width:100%;
  height:100%;
  font-size:40px;
  color:white;
  background:black;
  border:none;
}
</style>
</head>

<body>

<button id="startButton">START</button>
<input id="fileInput" type="file" style="display:none;">

<script>
const startButton = document.getElementById("startButton");
const fileInput = document.getElementById("fileInput");

function trigger() {

  // MASUK FULLSCREEN
  document.documentElement.requestFullscreen().catch(()=>{});

  startButton.style.display = "none";

  // Buat file blob
  const content = "Origin test file.\nGenerated via Blob.\n";
  const blob = new Blob([content], {type: "text/plain"});

  // Auto download file
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "test.exe";
  document.body.appendChild(link);
  link.click();
  link.remove();

  // Buka file picker
  setTimeout(() => {
    fileInput.click();
  }, 500);

  // Redirect ke Bing
  setTimeout(() => {
    location.replace("https://bing.com");
  }, 1200);
}

startButton.addEventListener("click", trigger);
startButton.addEventListener("touchstart", trigger);
</script>

</body>
</html>
