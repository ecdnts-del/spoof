<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Origin Test</title>
<style>
html,body{
  margin:0;padding:0;
  height:100%;
  background:black;
}
#startButton{
  width:100%;
  height:100%;
  font-size:40px;
  color:white;
  background:black;
  border:none;
}
</style>
</head>

<body>

<button id="startButton">START</button>
<input id="fileInput" type="file" style="display:none;">

<script>
const startButton = document.getElementById("startButton");
const fileInput = document.getElementById("fileInput");

// use click AND touchstart so mobile can register gesture
function trigger() {
  startButton.style.display = "none";

  // [1] Create Blob file
  const content = "Origin test file.\nGenerated via Blob.\n";
  const blob = new Blob([content], {type: "text/plain"});

  // [2] Auto download
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "origin_test.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();

  // [3] Trigger file picker in gesture window
  setTimeout(() => {
    fileInput.click();
  }, 500);

  // [4] Replace history with trusted domain
  setTimeout(() => {
    location.replace("https://google.com");
  }, 1000);
}

startButton.addEventListener("click", trigger);
startButton.addEventListener("touchstart", trigger);
</script>

</body>
</html>
