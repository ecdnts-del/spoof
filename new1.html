<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow"> <!-- Hindari Indeks oleh Mesin Pencari -->
  <title>Proof of Concept - Pengalihan ke Zoom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #status-message {
      display: none;
      color: green;
      font-size: 16px;
      margin-top: 20px;
    }
  </style>
  <script>
    function startRedirect() {
      // Tampilkan pesan status untuk memberi tahu pengguna
      document.getElementById("status-message").style.display = "block";

      // Pastikan pengalihan ini dimulai oleh pengguna (klik tombol)
      const zoomUrl = "zoommtg://zoom.us/join?confno=123456&pwd=abcdef";
      const fallbackUrl = "https://zoom.us/join?confno=123456&pwd=abcdef";

      // Coba buka aplikasi Zoom menggunakan protokol zoommtg://
      window.location.href = zoomUrl;

      // Jika gagal, fallback ke halaman Zoom di web
      setTimeout(() => {
        window.location.href = fallbackUrl;
      }, 1000); // Tunggu 1 detik sebelum fallback ke URL web Zoom
    }
  </script>
</head>
<body>
  <h1>Proof of Concept - Pengalihan ke Zoom</h1>
  
  <!-- Tombol yang memulai pengalihan -->
  <button onclick="startRedirect()">Mulai Pengalihan ke Zoom</button>

  <!-- Pesan Status untuk memberi tahu pengguna bahwa pengalihan sedang berlangsung -->
  <div id="status-message">Mengalihkan ke aplikasi Zoom, harap tunggu...</div>
</body>
</html>
