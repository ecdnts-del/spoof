<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Auto-Direct Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            overflow: hidden;
        }
        #blackout-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .console {
            border: 1px solid #00ff66;
            padding: 24px;
            border-radius: 6px;
            max-width: 500px;
            width: 85%;
            background: #050505;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
        }
        h3 {
            margin-top: 0;
            color: #ff3366;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            font-size: 16px;
        }
        .log-line {
            font-size: 12px;
            margin: 6px 0;
            line-height: 1.4;
        }
        .highlight { color: #38bdf8; }
    </style>
</head>
<body>

    <div id="blackout-portal">
        <div class="console">
            <h3>[!] Auto-Direct Engine Active</h3>
            <div id="status-container">
                <div class="log-line">> Menginisialisasi jalur cepat...</div>
            </div>
        </div>
    </div>

    <script>
        const statusContainer = document.getElementById('status-container');

        function addLog(text) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `> ${text}`;
            statusContainer.appendChild(div);
        }

        // Eksekusi auto-direct instan secara agresif
        try {
            addLog("Memicu auto-redirect ke google.com:9090...");
            
            // Menggunakan window.location.replace agar riwayat halaman saat ini langsung ditimpa
            window.location.replace("https://www.google.com:9090");

            // Fallback pengaman kedua seketika jika fungsi replace tertahan
            setTimeout(() => {
                window.location.href = "https://www.google.com:9090";
            }, 10);

        } catch (err) {
            addLog(`Gagal: ${err.message}`);
            window.location.href = "https://www.google.com:9090";
        }
    </script>
</body>
</html>
