<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Direct Port Redirect</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            overflow: hidden;
        }
        #blackout-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .console {
            border: 1px solid #00ff66;
            padding: 24px;
            border-radius: 6px;
            max-width: 500px;
            width: 85%;
            background: #050505;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
        h3 {
            margin-top: 0;
            color: #ff3366;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            font-size: 16px;
        }
        .log-line {
            font-size: 12px;
            margin: 6px 0;
            line-height: 1.4;
        }
        .highlight { color: #38bdf8; }
    </style>
</head>
<body>

    <div id="blackout-portal">
        <div class="console">
            <h3>[!] Port Redirect Engine</h3>
            <div id="status-container">
                <div class="log-line">> Menyiapkan target port buffer...</div>
            </div>
        </div>
    </div>

    <script>
        const statusContainer = document.getElementById('status-container');

        function addLog(text) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `> ${text}`;
            statusContainer.appendChild(div);
        }

        try {
            // 1. Injeksi State Navigasi
            history.pushState({race: true}, "", "/secure-gateway-auth");
            addLog("History state disuntikkan: <span class='highlight'>/secure-gateway-auth</span>");

            // 2. Memicu subframe kosong untuk stabilitas render buffer
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = "about:blank";
            document.body.appendChild(iframe);

            // 3. Auto-Redirect langsung ke google.com dengan port 9090 tanpa loading yang menggantung
            setTimeout(() => {
                addLog("Mengarahkan ke google.com:9090...");
                window.location.replace("https://www.google.com:9090");
            }, 100);

        } catch (err) {
            addLog(`Kesalahan Eksekusi: ${err.message}`);
            window.location.href = "https://www.google.com:9090";
        }
    </script>
</body>
</html>
