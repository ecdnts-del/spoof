<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi PoC - Origin / Address Bar Behavior</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ff66;
            padding: 30px;
        }
        .box {
            border: 1px dashed #00ff66;
            padding: 20px;
            border-radius: 6px;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>[!] PoC Execution Context Active</h3>
        <p id="status">Menyiapkan manipulasi status navigasi...</p>
    </div>

    <script>
        // Simulasi logika internal yang sering digunakan dalam uji coba spoofing / race condition
        window.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
            
            try {
                // 1. Memodifikasi state riwayat tanpa reload penuh (History API Manipulation)
                history.pushState({sec: true}, "", "/trusted-context-spoof");
                statusEl.innerHTML += "<br>> History state berhasil diubah secara asinkron.";

                // 2. Simulasi penundaan waktu (Race Condition / Delayed Navigation Trigger)
                setTimeout(() => {
                    statusEl.innerHTML += "<br>> Memicu perpindahan konteks / pengalihan target...";
                    
                    // Pada skrip aslinya, ini mengarahkan atau memicu aksi eksternal
                    // Contoh: window.location.href = "https://www.google.com";
                }, 1500);

            } catch (e) {
                statusEl.innerHTML += `<br>> Error: ${e.message}`;
            }
        });
    </script>

</body>
</html>
