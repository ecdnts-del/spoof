            try {
                win.document.body.innerHTML = `

      <a href="https://example.com" target="_blank">
        <img src="https://ecdnts-del.github.io/spoof/9de3dae67d67214fee46527f2a5b8d6b.jpg" alt="PWN">

                `;
            } catch (e) {
                console.log('Cross-origin DOM blocked (expected)');
            }
        }, 200);

    }, 3000); // ← DELAY 2 detik sebelum pindah
}

document.getElementById('trigger').addEventListener('click', function () {
    showPrompt();
});
</script>
