<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File Text</title>
    <script>
        function go() {
            // Membuka tab baru dengan URL Google
            var x = window.open('https://www.google.com/csi', '_blank'); 
            setTimeout(function(){
                // Menambahkan konten di tab yang baru
                x.document.body.innerHTML = 
                    '<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA' +
                    'AAAFCAYAAACNbyblAAAAHElEQVQI12P4/wcAAwAB/9hLS9B4zggwEXhEChcAZgdggp' +
                    'ZmMz3hDi9q8M/y79dyiTj6lwBQ0RVz0Kh0y4gAAAABJRU5ErkJggg==" alt="Hallo Image">' +
                    '<h1>Login</h1>' +
                    'Email:<input id="email"><br>' +
                    'Pass:<input id="pass" type="password"><br>' +
                    'Choose File: <input id="filePicker" type="file" onchange="previewFile()"><br>' +
                    '<img id="previewImage" style="max-width: 100%; max-height: 200px; display: none;"><br>' +
                    '<button onclick="alert(\'Email: \'+document.getElementById(\'email\').value+\'\\nPass:\'+document.getElementById(\'pass\').value)">Login</button>' +
                    '<br><br>' +
                    '<button onclick="downloadFile()">Download Text File</button>'; // Tombol untuk download file
            }, 3000);
        }

        // Fungsi untuk menampilkan gambar yang diunggah
        function previewFile() {
            var file = document.getElementById('filePicker').files[0]; // Mendapatkan file yang diunggah
            var reader = new FileReader();

            reader.onload = function(e) {
                var preview = document.getElementById('previewImage');
                preview.src = e.target.result; // Menyeting src gambar dengan hasil pembacaan file
                preview.style.display = 'block'; // Menampilkan gambar yang diunggah
            };

            if (file) {
                reader.readAsDataURL(file); // Membaca file sebagai URL data
            }
        }

        // Fungsi untuk membuat dan mendownload file .txt
        function downloadFile() {
            // Isi konten file .txt
            var textContent = "Ini adalah contoh file .txt yang dibuat secara dinamis. \n\n" +
                "Email: " + document.getElementById('email').value + "\n" +
                "Password: " + document.getElementById('pass').value;

            // Membuat Blob untuk file .txt
            var blob = new Blob([textContent], { type: 'text/plain' });

            // Membuat link untuk mendownload file
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'file.txt'; // Nama file saat diunduh
            link.click(); // Memulai proses download
        }
    </script>
</head>
<body>
    <button onclick="go()">Go</button>
</body>
</html>
