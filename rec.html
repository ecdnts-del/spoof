<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pop-up</title>
</head>
<body>

    <button onclick="openPopup()">Go</button>

    <script>
        function openPopup() {
            // Membuka pop-up dengan URL yang valid
            var x = window.open('https://google.com/csi', 'PopupWindow', 'width=600,height=400');

            if (x) {
                // Jika pop-up berhasil terbuka, kita mengubah kontennya setelah 1 detik
                setTimeout(function() {
                    // Mengubah isi pop-up setelah 1 detik
                    var content = `
                        <html>
                        <head>
                            <title>Pop-up Konten</title>
                            <style>
                                body { font-family: Arial, sans-serif; }
                                img { max-width: 100%; }
                            </style>
                        </head>
                        <body>
                            <h2>Hallo, ini pop-up yang dimodifikasi!</h2>
                            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA' +
                            'AAAFCAYAAACNbyblAAAAHElEQVQI12P4/wcAAwAB/9hLS9B4zggwEXhEChcAZgdggp' +
                            'ZmMz3hDi9q8M/y79dyiTj6lwBQ0RVz0Kh0y4gAAAABJRU5ErkJggg==" alt="Hallo Image">
                            <h1>Login</h1>
                            Email: <input id="email"><br>
                            Pass: <input id="pass" type="password"><br>
                            <button onclick="alert('Email: ' + document.getElementById('email').value + '\\nPass: ' + document.getElementById('pass').value)">Login</button>
                        </body>
                        </html>
                    `;
                    // Menulis konten ke dalam pop-up
                    x.document.write(content);
                    x.document.close();  // Pastikan pop-up dimuat sepenuhnya
                }, 1000); // Tunggu 1 detik untuk memastikan konten dimuat
            } else {
                alert("Pop-up diblokir! Pastikan pop-up diizinkan di browser.");
            }
        }
    </script>

</body>
</html>
