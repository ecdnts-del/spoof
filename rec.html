<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo</title>

    <script>
        function go() {
            // Open Google CSI in a new tab
            var win = window.open('https://www.google.com/csi', '_blank');

            setTimeout(function () {
                try {
                    // Replace content in the new tab
                    win.document.body.innerHTML =
                        '<h1>Login</h1>' +

                        'Email:<br>' +
                        '<input id="email"><br><br>' +

                        'Password:<br>' +
                        '<input id="pass" type="password"><br><br>' +

                        '<button onclick="alert(' +
                            '\'Email: \' + document.getElementById(\'email\').value +' +
                            '\'\\nPass: \' + document.getElementById(\'pass\').value' +
                        ')">' +
                            'Login' +
                        '</button>';
                } catch (e) {
                    console.log('Blocked:', e);
                }
            }, 3000);
        }
    </script>
</head>

<body>
    <button onclick="go()">Go</button>
</body>
</html>
