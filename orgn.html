<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PoC Test</title>
</head>
<body>
  <h2>Testing Fetch Request</h2>

  <script>
    fetch("https://mail.google.com/mail/u/0/")
      .then(function(response) {
        return response.text();
      })
      .then(function(data) {
        document.body.innerText = data;
      })
      .catch(function(error) {
        document.body.innerText = "Error: " + error;
      });
  </script>

</body>
</html>
