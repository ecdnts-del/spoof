<h1>Click anywhere and wait.</h1>

<audio id="player" src="audio.mp3" loop></audio>

<script>
  onclick = () => {
    // Putar audio mp3
    const audio = document.getElementById('player');
    audio.play();

    // Membuka pengaturan Siri di iOS
    window.location.href = 'App-Prefs:root=SIRI';
  };
</script>
