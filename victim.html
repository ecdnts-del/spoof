<!doctype html>
<meta charset="utf-8">
<title>Sender</title>

<script>
function burn(level) {
  for (let i = 0; i < level; i++) {
    for (let j = 0; j < 60; j++);
  }
}

function sendSymbol(sym) {
  switch (sym) {
    case '00': burn(5); break;
    case '01': burn(25); break;
    case '10': burn(60); break;
    case '11': burn(120); break;
  }
}

function encode(str) {
  return str.split('')
    .map(c => c.charCodeAt(0).toString(2).padStart(8,'0'))
    .join('');
}

const msg = "NAN_ORACLE_WORKS";
const bits = encode(msg);

let i = 0;

// kirim terus (burst biar kuat)
setInterval(() => {
  for (let k = 0; k < 5; k++) {
    const sym = bits.slice(i, i+2);
    if (sym.length < 2) return;

    sendSymbol(sym);
  }

  i += 2;
  if (i >= bits.length) i = 0;

}, 100);
</script>
