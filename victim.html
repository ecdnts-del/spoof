<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Screenshot PoC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body { font-family: Arial; text-align: center; margin-top: 50px; }
button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
#capture { width: 80%; margin: 20px auto; padding: 20px; background: #f5f5f5; border: 2px solid #333; }
</style>
</head>
<body>

<div id="capture">
    <h2>Ini konten yang akan di-screenshot</h2>
    <p>HTML + JS screenshot test</p>
</div>

<button id="btnShot">Ambil Screenshot</button>

<script>
document.getElementById("btnShot").addEventListener("click", async () => {
    const element = document.getElementById("capture");
    
    // html2canvas menangkap element
    const canvas = await html2canvas(element);
    
    // hasil screenshot jadi image URL
    const imgData = canvas.toDataURL("image/png");
    
    // download otomatis
    const link = document.createElement("a");
    link.href = imgData;
    link.download = "screenshot.png";
    link.click();
});
</script>

</body>
</html>
