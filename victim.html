<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>postMessage Auditor</title>
<style>
body { font-family: Arial; text-align:center; margin-top:40px; }
button { padding:15px 25px; font-size:16px; }
pre { background:#111; color:#0f0; padding:10px; width:95%; height:300px; overflow:auto; margin:auto;}
</style>
</head>
<body>

<h2>postMessage Auditor (Clean)</h2>
<button onclick="start()">Start</button>

<pre id="log">Waiting...</pre>

<script>
const TARGETS = [
    "https://example.com"
    // tambahin target yang kamu test (NON-GOOGLE)
];

const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

let frames = [];

// 🔒 strict detection
function isSensitive(data) {
    if (typeof data !== "object") return false;

    return (
        data.token ||
        data.access_token ||
        data.sessionId ||
        data.authToken ||
        data.jwt
    );
}

// 🎯 listener
window.addEventListener("message", (e) => {
    if (e.origin === location.origin) return;

    log("\n🚨 CROSS ORIGIN MESSAGE");
    log("Origin: " + e.origin);

    try {
        log("Data: " + JSON.stringify(e.data).slice(0,300));
    } catch {}

    if (isSensitive(e.data)) {
        log("🔥 CONFIRMED SENSITIVE DATA LEAK");
        document.body.style.background = "darkred";
    }
});

// 🚀 start scan
function start() {
    TARGETS.forEach((url, i) => {
        setTimeout(() => {
            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.style.display = "none";
            document.body.appendChild(iframe);
            frames.push(iframe);

            log("[*] Loaded: " + url);

            // minimal legit probing
            setTimeout(() => {
                try {
                    iframe.contentWindow.postMessage({ping:1}, "*");
                } catch(e){}
            }, 2000);

        }, i * 2000);
    });
}
</script>

</body>
</html>
