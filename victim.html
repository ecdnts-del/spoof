<h1>Click anywhere and wait.</h1>

<script>
  onclick = () => {
    const utterance = new SpeechSynthesisUtterance('Lock my phone now');
    speechSynthesis.speak(utterance);

    // Membuka menu pengaturan lock screen (Android Settings)
    window.location.href = 'intent://settings/#Intent;scheme=android-app;package=com.android.settings;end';
  };
</script>
