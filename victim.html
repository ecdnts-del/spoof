<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Hunter v3</title>
<style>
body {
    font-family: monospace;
    background:#000;
    color:#0f0;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:400px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>🔥 WebView Hunter v3</h2>
<button onclick="start()">Start Deep Scan</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

// =======================
// 🔍 ENV DETECTION
// =======================
function detectEnv() {
    log("[*] Detecting environment...");

    const ua = navigator.userAgent;
    log("UA: " + ua);

    if (ua.includes("wv")) log("🔥 Android WebView detected");
    if (ua.includes("Version/") && ua.includes("Chrome"))
        log("🔥 Possible embedded WebView");

    if (window.Android) log("🔥 Android bridge FOUND");
    if (window.webkit) log("🔥 iOS WebKit bridge FOUND");
}

// =======================
// 🔍 GLOBAL ENUM
// =======================
function deepEnum() {
    log("\n[*] Deep scanning window objects...");

    Object.getOwnPropertyNames(window).forEach(k => {
        try {
            const lower = k.toLowerCase();

            if (
                lower.includes("android") ||
                lower.includes("bridge") ||
                lower.includes("native") ||
                lower.includes("interface")
            ) {
                log("🔥 Suspicious object: " + k);

                try {
                    const obj = window[k];
                    Object.getOwnPropertyNames(obj).forEach(fn => {
                        log("   ↳ " + fn);
                    });
                } catch(e){}
            }
        } catch(e){}
    });
}

// =======================
// 🔍 BRIDGE ANALYSIS
// =======================
function analyzeBridge() {
    log("\n[*] Analyzing bridge methods...");

    const names = ["Android","Native","Bridge","App","JSInterface"];

    names.forEach(name => {
        try {
            if (!window[name]) return;

            const obj = window[name];
            log("🔥 Bridge CONFIRMED: " + name);

            Object.getOwnPropertyNames(obj).forEach(fn => {

                log("   ↳ " + fn);

                // 🚨 heuristic dangerous names
                if (
                    fn.toLowerCase().includes("token") ||
                    fn.toLowerCase().includes("user") ||
                    fn.toLowerCase().includes("auth") ||
                    fn.toLowerCase().includes("file")
                ) {
                    log("   ⚠️ POSSIBLE SENSITIVE METHOD: " + fn);
                }
            });

        } catch(e){}
    });
}

// =======================
// 🔍 FILE ACCESS TEST
// =======================
function testFileAccess() {
    log("\n[*] Testing file:// access...");

    const img = new Image();

    img.onload = () => log("🚨 file:// ACCESS POSSIBLE");
    img.onerror = () => log("[+] file:// blocked");

    img.src = "file:///sdcard/test.jpg";
}

// =======================
// 🔍 INTENT TEST
// =======================
function testIntent() {
    log("\n[*] Testing intent://...");

    try {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = "intent://test#Intent;scheme=https;package=com.google.android.gm;end";
        document.body.appendChild(iframe);

        log("⚠️ intent:// triggered");
    } catch(e) {
        log("[+] intent blocked");
    }
}

// =======================
// 🔍 POPUP TEST
// =======================
function testPopup() {
    log("\n[*] Testing popup capability...");

    try {
        const w = window.open("about:blank");

        if (w) {
            log("⚠️ Popup allowed");
            w.close();
        } else {
            log("[+] Popup blocked");
        }
    } catch(e){}
}

// =======================
// 🔍 POSTMESSAGE MONITOR
// =======================
function monitorMessage() {
    log("\n[*] Monitoring postMessage...");

    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin) {
            log("🚨 Cross-origin message");
            log("Origin: " + e.origin);

            try {
                log("Data: " + JSON.stringify(e.data).slice(0,200));
            } catch {}
        }
    });

    window.postMessage({ping:true}, "*");
}

// =======================
// 🚀 RUN
// =======================
function start() {
    log("[*] Starting deep scan...\n");

    detectEnv();
    setTimeout(deepEnum, 500);
    setTimeout(analyzeBridge, 1000);
    setTimeout(testFileAccess, 1500);
    setTimeout(testIntent, 2000);
    setTimeout(testPopup, 2500);
    setTimeout(monitorMessage, 3000);
}
</script>

</body>
</html>
