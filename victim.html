<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gmail WebView Deep Link Auditor</title>
<style>
body {
    background:#000;
    color:#0f0;
    font-family: monospace;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:400px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>🔥 Gmail WebView Auditor (Safe VRP PoC)</h2>
<button onclick="start()">Start Test</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

// ==========================
// ENV DETECTION
// ==========================
function detectEnv() {
    const ua = navigator.userAgent;
    log("[*] UA: " + ua);

    if (ua.includes("wv")) log("🔥 Android WebView detected");
    if (ua.includes("Instagram")) log("🔥 Instagram WebView");
}

// ==========================
// GMAIL DEEP LINK TEST
// ==========================
function testGmailIntent() {
    log("\n[*] Testing Gmail deep link...");

    const intent = "mailto:test@example.com?subject=PoC_TEST&body=Hello";

    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = intent;

    document.body.appendChild(iframe);

    log("⚠️ Gmail intent triggered (mailto)");
}

// ==========================
// VISIBILITY CHECK (IMPORTANT)
// ==========================
function checkVisibility() {
    log("\n[*] Monitoring page visibility...");

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            log("🚨 App switched (possible external app opened)");
        } else {
            log("[+] Returned to page");
        }
    });
}

// ==========================
// POSTMESSAGE VALIDATION
// ==========================
function testPostMessage() {
    log("\n[*] Testing postMessage...");

    window.addEventListener("message", (e) => {
        log("📩 Message received");
        log("Origin: " + e.origin);

        try {
            log("Data: " + JSON.stringify(e.data).slice(0,200));
        } catch {}

        // strict detection
        if (typeof e.data === "object") {
            if (
                e.data.token ||
                e.data.email ||
                e.data.user
            ) {
                log("🔥 REAL DATA LEAK DETECTED");
                document.body.style.background = "darkred";
            }
        }
    });

    window.postMessage({ping:true}, "*");
}

// ==========================
// BRIDGE ENUM (SAFE)
// ==========================
function detectBridge() {
    log("\n[*] Checking JS bridges...");

    const names = ["Android","Bridge","App","Native"];

    names.forEach(n => {
        try {
            if (window[n]) {
                log("🔥 Bridge found: " + n);

                Object.getOwnPropertyNames(window[n]).forEach(fn => {
                    log("   ↳ " + fn);
                });
            }
        } catch(e){}
    });
}

// ==========================
// USER INTERACTION CHECK
// ==========================
function simulateUserFlow() {
    log("\n[*] Simulating user interaction...");

    document.body.click();
}

// ==========================
// RUN
// ==========================
function start() {
    log("[*] Starting Gmail audit...\n");

    detectEnv();
    checkVisibility();

    setTimeout(detectBridge, 500);
    setTimeout(testPostMessage, 1000);
    setTimeout(testGmailIntent, 2000);
    setTimeout(simulateUserFlow, 2500);
}
</script>

</body>
</html>
