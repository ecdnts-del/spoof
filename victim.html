<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>All in One</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }

    button {
      padding: 15px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Tambah ke Kalender 📅</h2>

  <button onclick="runAll()">
    Jalankan Semua 🚀
  </button>

  <div class="note">
    Open Calendar + Download ICS + Kirim Email sekaligus
  </div>
</div>

<script>
function runAll() {

  // 1. Open Google Calendar
  window.open(
    "https://calendar.google.com/calendar/r?cid=your_calendar_id",
    "_blank"
  );

  // 2. Download ICS file
  const link = document.createElement("a");
  link.href = "https://calendar.googleusercontent.com/calendar/ical/your_calendar_id/public/basic.ics";
  link.download = "calendar.ics";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  // 3. Open email (mailto)
  setTimeout(() => {
    window.location.href =
      "mailto:example@email.com?subject=GOOGLE";
  }, 800);

}
</script>

</body>
</html>
