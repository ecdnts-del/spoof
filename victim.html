<!doctype html>
<meta charset="utf-8">
<title>V8 FAST OOB SNAP</title>

<pre id="log"></pre>
<script>

  document.getElementById("log").textContent += m + "\n";

function vuln(a,i){ return a[i] + 1.1; }

    arr.length = 0; // destroy structure

  get(t,p){

log("r2 = " + r2);
