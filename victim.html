<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta charset="UTF-8">
<title>Fullscreen + Gmail + Web Share PoC</title>
<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #222;
    color: #fff;
}
button {
    padding: 20px 40px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background-color: #ff5722;
    color: #fff;
}
</style>
</head>
<body>

<button id="fullscreenBtn">Enter Fullscreen & Open Gmail & Share</button>

<script>
const WEBHOOK = "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d";

function report(event) {
    const payload = encodeURIComponent(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        event
    }));
    const img = new Image();
    img.src = WEBHOOK + "?d=" + payload;
}

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
    report("fullscreen_button_clicked");

    // 1️⃣ Masuk fullscreen
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        await elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { 
        await elem.webkitRequestFullscreen();
    }
    report("fullscreen_entered");

    // 2️⃣ Trigger Gmail compose (intent safe)
    try {
        const gmailIntent = "mailto:test@example.com?subject=PoC&body=Testing%20Gmail%20compose";
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = gmailIntent;
        document.body.appendChild(iframe);
        report("gmail_intent_triggered");
    } catch (e) {
        report("gmail_intent_error");
        console.log(e);
    }

    // 3️⃣ Web Share API
    if (navigator.share) {
        try {
            await navigator.share({
                title: "PoC Fullscreen Share",
                text: "Testing Web Share API in Fullscreen mode",
                url: "https://example.com"
            });
            report("share_success");
        } catch (err) {
            report("share_cancel_or_error");
            console.log(err);
        }
    } else {
        alert("Web Share API not supported on this device/browser.");
        report("share_not_supported");
    }
});
</script>

</body>
</html>
