<h1>Click anywhere and wait.</h1>

<audio id="player" src="audio.mp3" loop></audio>

<script>
  onclick = () => {
    // Putar audio mp3
    const audio = document.getElementById('player');
    audio.play();

    // Buat teks yang akan dibacakan
    const utterance = new SpeechSynthesisUtterance('Turn on airplane mode');

    // Ulangi setiap 2 detik jika tidak sedang berbicara
    setInterval(() => {
      if (speechSynthesis.speaking) return;
      speechSynthesis.speak(utterance);
    }, 2000);

    // Membuka aplikasi Google Assistant di Android dengan market scheme
    window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
  };
</script>
