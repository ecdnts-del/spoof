<!doctype html>
<meta charset="utf-8">
<title>Hybrid Signal Generator FINAL</title>

<script>
let mode = 0

// toggle tiap 2 detik
setInterval(() => {
  mode ^= 1
}, 2000)

function burn(ms) {
  const end = performance.now() + ms
  while (performance.now() < end) {}
}

function gcStorm() {
  let tmp = []
  for (let i = 0; i < 80; i++) {
    tmp.push(new Uint8Array(1024 * 1024)) // 1MB
  }
}

setInterval(() => {
  if (mode === 0) {
    // LOW SIGNAL
    burn(5)
  } else {
    // 💣 HIGH SIGNAL (super heavy)
    for (let i = 0; i < 10; i++) burn(25)
    for (let i = 0; i < 10; i++) gcStorm()
  }
}, 50)
</script>
