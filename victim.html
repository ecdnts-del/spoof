<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IG WebView Security Auditor</title>
<style>
body {
    background:#000;
    color:#0f0;
    font-family: monospace;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:420px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>🔥 Instagram WebView Auditor</h2>
<button onclick="start()">Start Scan</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

// =======================
// ENV DETECTION
// =======================
function detectEnv() {
    const ua = navigator.userAgent;
    log("[*] UA: " + ua);

    if (ua.includes("Instagram")) log("🔥 Instagram WebView detected");
    if (ua.includes("wv")) log("🔥 Android WebView detected");
}

// =======================
// BRIDGE ENUMERATION
// =======================
function enumBridge() {
    log("\n[*] Scanning bridges...");

    Object.getOwnPropertyNames(window).forEach(k => {
        try {
            if (typeof window[k] === "object") {
                const name = k.toLowerCase();

                if (
                    name.includes("bridge") ||
                    name.includes("android") ||
                    name.includes("native") ||
                    name.includes("iab")
                ) {
                    log("🔥 Bridge/Object: " + k);

                    try {
                        Object.getOwnPropertyNames(window[k]).forEach(fn => {
                            log("   ↳ " + fn);

                            if (
                                fn.toLowerCase().includes("token") ||
                                fn.toLowerCase().includes("user") ||
                                fn.toLowerCase().includes("auth")
                            ) {
                                log("   ⚠️ Sensitive-looking method: " + fn);
                            }
                        });
                    } catch(e){}
                }
            }
        } catch(e){}
    });
}

// =======================
// SAFE BRIDGE INTERACTION
// =======================
function testBridgeCall() {
    log("\n[*] Testing bridge interaction...");

    try {
        if (window.iabjs_unified_bridge && window.iabjs_unified_bridge.postMessage) {
            log("🔥 iab bridge detected");

            window.iabjs_unified_bridge.postMessage(
                JSON.stringify({ test: "ping" })
            );

            log("   ↳ postMessage sent");
        }
    } catch(e) {
        log("[!] bridge call error");
    }
}

// =======================
// POSTMESSAGE MONITOR
// =======================
function monitorMessages() {
    log("\n[*] Listening postMessage...");

    window.addEventListener("message", (e) => {

        if (e.origin === location.origin) return;

        log("\n📩 MESSAGE RECEIVED");
        log("Origin: " + e.origin);

        try {
            const data = JSON.stringify(e.data);
            log("Data: " + data.slice(0,300));

            // 🔥 strong detection
            if (
                data.includes("token") ||
                data.includes("email") ||
                data.includes("session") ||
                data.includes("auth")
            ) {
                log("🔥🔥 POSSIBLE SENSITIVE DATA LEAK");
                document.body.style.background = "darkred";
            }

        } catch(e){}
    });

    window.postMessage({probe:true}, "*");
}

// =======================
// INTENT TEST (SAFE)
// =======================
function testIntent() {
    log("\n[*] Testing intent behavior...");

    try {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = "intent://test#Intent;scheme=https;package=com.google.android.gm;end";

        document.body.appendChild(iframe);

        log("⚠️ Intent triggered");
    } catch(e){
        log("[+] Intent blocked");
    }
}

// =======================
// VISIBILITY TRACKING
// =======================
function trackVisibility() {
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            log("🚨 App switched (external app opened?)");
        }
    });
}

// =======================
// RUN
// =======================
function start() {
    log("[*] Starting Instagram audit...\n");

    detectEnv();
    trackVisibility();

    setTimeout(enumBridge, 500);
    setTimeout(testBridgeCall, 1000);
    setTimeout(monitorMessages, 1500);
    setTimeout(testIntent, 2000);
}
</script>

</body>
</html>
