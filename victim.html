<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tambah Kalender</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 25px;
      display: inline-block;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    a.button {
      display: block;
      margin: 10px;
      padding: 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    a.button.download {
      background: #28a745;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Tambah ke Kalender 📅</h2>

    <!-- WEBCAL (subscribe) -->
    <a class="button"
       href="webcal://calendar.google.com/calendar/ical/your_calendar_id/public/basic.ics">
      Subscribe Kalender (Webcal)
    </a>

    <!-- DOWNLOAD ICS -->
    <a class="button download"
       href="https://calendar.google.com/calendar/ical/your_calendar_id/public/basic.ics"
       download="calendar.ics">
      Download File .ICS
    </a>

  </div>

</body>
</html>
