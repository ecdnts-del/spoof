<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gmail Intent PoC</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    padding-top: 50px;
}
button {
    padding: 15px 25px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>Gmail Intent Test (Manual Trigger)</h2>

<button onclick="runIntent(0)">Test Basic Compose</button>
<button onclick="runIntent(1)">Test Subject</button>
<button onclick="runIntent(2)">Test Body</button>

<br><br>

<button onclick="goFullscreen()">Enter Fullscreen</button>

<script>
const WEBHOOK = "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d";

// 🔥 logging
function report(data) {
    const payload = encodeURIComponent(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        ...data
    }));

    const img = new Image();
    img.src = WEBHOOK + "?d=" + payload;
}

// 🎯 Gmail intents
const intents = [
    {
        name: "basic_compose",
        uri: "intent://compose?to=test@example.com#Intent;scheme=mailto;package=com.google.android.gm;end"
    },
    {
        name: "with_subject",
        uri: "intent://compose?to=test@example.com&subject=TEST_SUBJECT#Intent;scheme=mailto;package=com.google.android.gm;end"
    },
    {
        name: "with_body",
        uri: "intent://compose?to=test@example.com&body=HELLO_TEST#Intent;scheme=mailto;package=com.google.android.gm;end"
    }
];

// 🔥 trigger intent via user gesture
function runIntent(index) {
    const intentObj = intents[index];

    report({
        event: "intent_clicked",
        name: intentObj.name
    });

    try {
        // pakai iframe biar tidak redirect halaman utama
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = intentObj.uri;
        document.body.appendChild(iframe);

        setTimeout(() => {
            report({
                event: "intent_iframe_timeout",
                name: intentObj.name
            });
        }, 2000);

    } catch (e) {
        report({
            event: "intent_error",
            name: intentObj.name
        });
    }
}

// 🔥 fullscreen
function goFullscreen() {
    report({ event: "fullscreen_requested" });

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
    }
}

// log page load
window.onload = () => {
    report({ event: "page_loaded" });
};
</script>

</body>
</html>
