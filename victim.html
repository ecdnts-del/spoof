<html>
<body>
    
    <h1>
        <a onclick="openMaps()" href="geo:0,0?q=Jakarta">
            open Google Maps</a>
    </h1>

    <script>
        function openMaps() {
            // TTS: bacakan perintah
            const utterance = new SpeechSynthesisUtterance("Open Google Maps");
            utterance.lang = "en-US"; // bisa diganti "id-ID" kalau mau bahasa Indonesia
            speechSynthesis.speak(utterance);

            // Setelah 5 detik, buka aplikasi Google Maps
            setTimeout(function() {
                window.location.href = 'market://launch?id=com.google.android.apps.maps';
            }, 5000);
        }
    </script>

</body>
</html>
