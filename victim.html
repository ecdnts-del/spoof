<h1>Click the button and wait.</h1>

<button id="volumeBtn">Volume</button>

<script>
  function speakAndOpenAssistant(message) {
    const utterance = new SpeechSynthesisUtterance(message);
    speechSynthesis.speak(utterance);

    // Tunggu 5 detik sebelum membuka Google Assistant
    setTimeout(() => {
      window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
    }, 5000);
  }

  document.getElementById('volumeBtn').onclick = () => 
    speakAndOpenAssistant('Adjusting Volume');
</script>
