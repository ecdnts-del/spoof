<h1>Click anywhere and wait.</h1>

<script>
  onclick = () => {
    // TTS: bacakan pesan
    const utterance = new SpeechSynthesisUtterance('Enable Bluetooth mode');
    speechSynthesis.speak(utterance);

    // Ulangi setiap 2 detik
    setInterval(() => {
      if (!speechSynthesis.speaking) {
        speechSynthesis.speak(utterance);
      }
    }, 2000);

    // Setelah 5 detik, buka Google Assistant
    setTimeout(() => {
      window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
    }, 5000);
  };
</script>
