<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Security Auditor</title>
<style>
body {
    font-family: monospace;
    background:#000;
    color:#0f0;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:300px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>WebView Security Auditor</h2>
<button onclick="start()">Start Scan</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
};

// 🔍 Detect environment
function detectEnv() {
    log("[*] Detecting environment...");

    log("UserAgent: " + navigator.userAgent);

    if (window.Android) log("🔥 Android bridge detected");
    if (window.webkit) log("🔥 iOS WebKit bridge detected");
}

// 🔍 Enumerate global objects
function enumerateGlobals() {
    log("[*] Enumerating window objects...");

    Object.keys(window).forEach(k => {
        try {
            if (typeof window[k] === "object") {
                if (k.toLowerCase().includes("bridge") ||
                    k.toLowerCase().includes("android") ||
                    k.toLowerCase().includes("native")) {

                    log("🔥 Suspicious object: " + k);

                    try {
                        Object.keys(window[k]).forEach(fn => {
                            log("   ↳ method: " + fn);
                        });
                    } catch(e){}
                }
            }
        } catch(e){}
    });
}

// 🔍 Safe bridge probing
function probeBridge() {
    const names = ["Android","Native","Bridge","App"];

    names.forEach(name => {
        try {
            if (window[name]) {
                log("🔥 Bridge confirmed: " + name);

                // safe test
                if (typeof window[name].toString === "function") {
                    log("   ↳ toString() callable");
                }
            }
        } catch(e){}
    });
}

// 🔍 postMessage listener test
function testPostMessage() {
    log("[*] Testing postMessage channel");

    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin) {
            log("🚨 Cross-origin message received");
            log("Origin: " + e.origin);

            try {
                log("Data: " + JSON.stringify(e.data).slice(0,200));
            } catch {}
        }
    });

    window.postMessage({ping:true}, "*");
}

// 🚀 Run all
function start() {
    log("[*] Starting scan...\n");

    detectEnv();
    setTimeout(enumerateGlobals, 500);
    setTimeout(probeBridge, 1000);
    setTimeout(testPostMessage, 1500);
}
</script>

</body>
</html>
