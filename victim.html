<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Impact Tester</title>
<style>
body { background:#000; color:#0f0; font-family: monospace; padding:15px;}
button { padding:15px; font-size:16px;}
pre { background:#111; height:400px; overflow:auto; padding:10px;}
</style>
</head>
<body>

<h2>🔥 WebView Impact Tester</h2>
<button onclick="start()">Run Test</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

let bridges = [];

// =================
// DETECT
// =================
function detect() {
    log("[*] Detecting...");

    if (navigator.userAgent.includes("wv"))
        log("🔥 WebView detected");

    Object.getOwnPropertyNames(window).forEach(k => {
        try {
            if (typeof window[k] === "object") {
                if (k.match(/android|bridge|native|interface/i)) {
                    log("🔥 Bridge: " + k);
                    bridges.push(k);
                }
            }
        } catch(e){}
    });
}

// =================
// IMPACT TEST
// =================
function testImpact() {
    log("\n[*] Testing bridge impact...");

    bridges.forEach(name => {
        try {
            const obj = window[name];
            if (!obj) return;

            log("\n🔥 Testing: " + name);

            Object.getOwnPropertyNames(obj).forEach(fn => {
                try {
                    if (typeof obj[fn] === "function") {

                        let start = performance.now();

                        let res;
                        try {
                            res = obj[fn]("ping_test");
                        } catch(e) {
                            log("   → blocked: " + fn);
                            return;
                        }

                        let duration = (performance.now() - start).toFixed(2);

                        log("   → called: " + fn + " (" + duration + "ms)");

                        // ✅ bukti impact (behavior difference)
                        if (res !== undefined) {
                            log("   💥 RETURN VALUE DETECTED");
                            document.body.style.background = "darkred";
                        }

                    }
                } catch(e){}
            });

        } catch(e){}
    });
}

// =================
// POSTMESSAGE REAL FLOW
// =================
function testPostMessage() {
    log("\n[*] Testing postMessage channel...");

    let received = false;

    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin) {
            received = true;

            log("\n🚨 MESSAGE RECEIVED");
            log("Origin: " + e.origin);

            try {
                log("Data size: " + JSON.stringify(e.data).length);
            } catch {}

            document.body.style.background = "darkred";
        }
    });

    // kirim beberapa payload (legit probing)
    const payloads = [
        {ping:1},
        {type:"init"},
        {action:"test"},
        {debug:true}
    ];

    payloads.forEach(p => {
        try {
            window.postMessage(p, "*");
        } catch(e){}
    });

    setTimeout(() => {
        if (!received) log("[+] No response detected");
    }, 2000);
}

// =================
// SIDE EFFECT DETECTOR
// =================
function detectSideEffects() {
    log("\n[*] Monitoring side effects...");

    let hidden = document.hidden;

    setInterval(() => {
        if (document.hidden !== hidden) {
            hidden = document.hidden;
            log("⚠️ Visibility changed (possible app interaction)");
        }
    }, 500);
}

// =================
// RUN
// =================
function start() {
    log("[*] Starting impact test...\n");

    detect();
    setTimeout(testImpact, 1000);
    setTimeout(testPostMessage, 2500);
    setTimeout(detectSideEffects, 4000);
}
</script>

</body>
</html>
