<!doctype html>
<meta charset="utf-8">
<title>Victim (Pressure Source)</title>

<script>
// ===== MODE SWITCH =====
let mode = 0;

// toggle tiap 2 detik
setInterval(() => {
  mode = (mode + 1) % 2;
}, 2000);

// ===== PRESSURE GENERATOR =====
let junk = [];

setInterval(() => {
  if (mode === 0) {
    // LOW pressure
    for (let i = 0; i < 100; i++) {
      junk.push([i]);
    }
  } else {
    // HIGH pressure (GC heavy)
    for (let i = 0; i < 5000; i++) {
      junk.push(new Array(100));
    }
    junk = junk.slice(-1000);
  }
}, 50);
</script>

<body>Victim running (GC pressure toggling)</body>
