<h1>Click anywhere and wait wkwkwkwekwkkw3qkwkwk.</h1>

<script>
  onclick = () => {
    // Buat teks yang akan dibacakan
    const utterance = new SpeechSynthesisUtterance('Auto enable NFC');

    // Jalankan TTS setiap 6 detik
    setInterval(() => {
      if (!speechSynthesis.speaking) {
        speechSynthesis.speak(utterance);
      }
    }, 6500);

    // Tetap membuka aplikasi Google Assistant di Android
    window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
  };
</script>
