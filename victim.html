<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Hunter v4</title>
<style>
body {
    font-family: monospace;
    background:#000;
    color:#0f0;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:420px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>🔥 WebView Hunter v4</h2>
<button onclick="start()">Start Full Audit</button>

<pre id="log">Waiting...</pre>

<script>
let score = 0;

const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

function addRisk(points, msg) {
    score += points;
    log("⚠️ [" + points + "] " + msg);
}

// =======================
// ENV
// =======================
function detectEnv() {
    const ua = navigator.userAgent;

    log("[*] UA: " + ua);

    if (ua.includes("wv")) {
        addRisk(2, "Android WebView detected");
    }

    if (window.Android) {
        addRisk(5, "Android JS bridge exposed");
    }

    if (window.webkit) {
        addRisk(3, "iOS WebKit bridge present");
    }
}

// =======================
// GLOBAL ENUM
// =======================
function scanGlobals() {
    log("\n[*] Scanning globals...");

    Object.getOwnPropertyNames(window).forEach(k => {
        try {
            const lower = k.toLowerCase();

            if (
                lower.includes("android") ||
                lower.includes("bridge") ||
                lower.includes("native") ||
                lower.includes("interface")
            ) {
                log("🔥 Object: " + k);

                const obj = window[k];

                Object.getOwnPropertyNames(obj).forEach(fn => {
                    log("   ↳ " + fn);

                    if (
                        fn.toLowerCase().includes("token") ||
                        fn.toLowerCase().includes("auth") ||
                        fn.toLowerCase().includes("user") ||
                        fn.toLowerCase().includes("file")
                    ) {
                        addRisk(5, "Sensitive method: " + fn);
                    }
                });
            }
        } catch(e){}
    });
}

// =======================
// FILE TEST
// =======================
function fileTest() {
    log("\n[*] Testing file:// ...");

    const img = new Image();

    img.onload = () => addRisk(5, "file:// accessible");
    img.onerror = () => log("[+] file:// blocked");

    img.src = "file:///sdcard/test.jpg";
}

// =======================
// POPUP TEST
// =======================
function popupTest() {
    log("\n[*] Testing popup...");

    try {
        const w = window.open("about:blank");

        if (w) {
            addRisk(2, "Popups allowed");
            w.close();
        }
    } catch(e){}
}

// =======================
// INTENT TEST
// =======================
function intentTest() {
    log("\n[*] Testing intent://");

    try {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = "intent://test#Intent;scheme=https;package=com.google.android.gm;end";
        document.body.appendChild(iframe);

        addRisk(2, "Intent trigger allowed");
    } catch(e){}
}

// =======================
// POSTMESSAGE
// =======================
function messageTest() {
    log("\n[*] Listening postMessage...");

    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin) {
            log("🚨 Cross-origin message: " + e.origin);

            try {
                const data = JSON.stringify(e.data);

                if (data.includes("token") || data.includes("auth")) {
                    addRisk(5, "Sensitive data via postMessage");
                }

                log("Data: " + data.slice(0,200));
            } catch {}
        }
    });

    window.postMessage({ping:1}, "*");
}

// =======================
// FINAL SCORE
// =======================
function reportScore() {
    log("\n======================");
    log("🔥 FINAL RISK SCORE: " + score);

    if (score >= 10) log("🚨 HIGH RISK - likely reportable");
    else if (score >= 5) log("⚠️ MEDIUM RISK");
    else log("[+] LOW RISK");

    log("======================");
}

// =======================
// RUN
// =======================
function start() {
    log("[*] Starting audit...\n");

    detectEnv();
    setTimeout(scanGlobals, 500);
    setTimeout(fileTest, 1000);
    setTimeout(popupTest, 1500);
    setTimeout(intentTest, 2000);
    setTimeout(messageTest, 2500);
    setTimeout(reportScore, 4000);
}
</script>

</body>
</html>
