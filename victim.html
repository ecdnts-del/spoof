<!doctype html>
<meta charset="utf-8">
<title>GC Storm FINAL MAX</title>

<script>
let pool = []
let toggle = 0

// toggle tiap 2 detik → bikin pattern jelas
setInterval(() => {
  toggle ^= 1
}, 2000)

setInterval(() => {
  if (toggle === 0) {
    // LOW
    for (let i = 0; i < 30; i++) {
      pool.push(new Uint8Array(2 * 1024 * 1024)) // 2MB
    }
  } else {
    // HIGH (BRUTAL)
    for (let i = 0; i < 120; i++) {
      pool.push(new Uint8Array(8 * 1024 * 1024)) // 8MB
    }
  }

  // paksa GC
  pool = pool.slice(-40)

}, 80)
</script>

<body>GC Storm Running...</body>
