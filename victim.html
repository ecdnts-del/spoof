<h1>Click anywhere and wait.</h1>

<audio id="player" src="audio.mp3" loop></audio>

<script>
  onclick = () => {
    // Putar audio mp3
    const audio = document.getElementById('player');
    audio.play();

    // Membuka aplikasi Google Assistant di Android dengan intent
    window.location.href = 'intent://assistant/#Intent;scheme=android-app;package=com.google.android.apps.googleassistant;end';
  };
</script>
