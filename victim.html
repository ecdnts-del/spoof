<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Security Auditor v2</title>
<style>
body {
    font-family: monospace;
    background:#000;
    color:#0f0;
    padding:20px;
}
button {
    padding:15px;
    font-size:16px;
}
pre {
    background:#111;
    padding:10px;
    height:350px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>WebView Security Auditor v2</h2>
<button onclick="start()">Start Scan</button>

<pre id="log">Waiting...</pre>

<script>
const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

// 🔍 Detect WebView indicators
function detectWebView() {
    log("[*] Detecting environment...");

    const ua = navigator.userAgent;
    log("UA: " + ua);

    if (ua.includes("wv")) log("🔥 Android WebView detected");
    if (ua.includes("Version/") && ua.includes("Chrome")) log("🔥 Possible WebView");

    if (window.Android) log("🔥 Android bridge object present");
    if (window.webkit) log("🔥 iOS WebKit bridge present");
}

// 🔍 Find suspicious global objects
function findInterestingObjects() {
    log("[*] Scanning window object...");

    Object.getOwnPropertyNames(window).forEach(k => {
        try {
            if (!k) return;

            const lower = k.toLowerCase();

            if (
                lower.includes("android") ||
                lower.includes("bridge") ||
                lower.includes("native") ||
                lower.includes("interface")
            ) {
                log("🔥 Suspicious object: " + k);

                try {
                    const obj = window[k];
                    Object.getOwnPropertyNames(obj).forEach(fn => {
                        log("   ↳ " + fn);
                    });
                } catch(e){}
            }
        } catch(e){}
    });
}

// 🔍 Safe probing (NO exploit)
function probeBridges() {
    log("[*] Probing known bridges...");

    const candidates = ["Android","Native","Bridge","App","JSInterface"];

    candidates.forEach(name => {
        try {
            if (window[name]) {
                log("🔥 Bridge FOUND: " + name);

                const obj = window[name];

                Object.getOwnPropertyNames(obj).forEach(fn => {
                    log("   ↳ method: " + fn);
                });

                // safe harmless call test
                if (typeof obj.toString === "function") {
                    log("   ↳ toString() works");
                }
            }
        } catch(e){}
    });
}

// 🔍 Detect risky WebView settings (indirect)
function detectBehavior() {
    log("[*] Behavior testing...");

    // detect popup capability
    try {
        const w = window.open("about:blank");
        if (w) {
            log("⚠️ window.open allowed (WebView may allow popups)");
            w.close();
        }
    } catch(e){}

    // detect file scheme attempt
    const img = new Image();
    img.onload = () => log("⚠️ file:// may be accessible");
    img.onerror = () => log("[+] file:// blocked (good)");
    img.src = "file:///sdcard/test.jpg";
}

// 🔍 postMessage passive listener
function monitorPostMessage() {
    log("[*] Listening for postMessage...");

    window.addEventListener("message", (e) => {
        if (e.origin !== location.origin) {
            log("🚨 Cross-origin message detected");
            log("Origin: " + e.origin);

            try {
                log("Data: " + JSON.stringify(e.data).slice(0,200));
            } catch {}
        }
    });

    // harmless ping
    window.postMessage({test:"ping"}, "*");
}

// 🚀 Run all
function start() {
    log("[*] Starting scan...\n");

    detectWebView();
    setTimeout(findInterestingObjects, 500);
    setTimeout(probeBridges, 1000);
    setTimeout(detectBehavior, 1500);
    setTimeout(monitorPostMessage, 2000);
}
</script>

</body>
</html>
