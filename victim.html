<h1>Click anywhere and wait.</h1>

<audio id="player" src="audio.mp3" loop></audio>

<script>
  onclick = () => {
    // Redirect ke Google.com terlebih dahulu
    window.location.href = 'https://www.google.com';

    // Setelah redirect, audio tetap disiapkan
    const audio = document.getElementById('player');
    audio.play();

    // Tetap membuka aplikasi Google Assistant di Android
    open('market://launch?id=com.google.android.apps.googleassistant');
  };
</script>
