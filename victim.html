<h1>Click a button and waissssssss.</h1>

<button id="wifiBtn">Wi-Fi</button>
<button id="bluetoothBtn">Bluetooth</button>
<button id="flashlightBtn">Flashlight</button>
<button id="dndBtn">Do Not Disturb</button>
<button id="volumeBtn">Volume</button>
<button id="alarmBtn">Alarm/Timer</button>
<button id="mediaBtn">Media Playback</button>
<button id="smartHomeBtn">Smart Home</button>
<button id="silentNotifBtn">Silent Notifications</button>

<script>
  function speakAndOpenAssistant(message) {
    const utterance = new SpeechSynthesisUtterance(message);
    speechSynthesis.speak(utterance);

    // Tunggu 5 detik sebelum membuka Google Assistant
    setTimeout(() => {
      window.location.href = 'market://launch?id=com.google.android.apps.googleassistant';
    }, 5000);
  }

  document.getElementById('wifiBtn').onclick = () => speakAndOpenAssistant('Opening Wi-Fi Settings');
  document.getElementById('bluetoothBtn').onclick = () => speakAndOpenAssistant('Opening Bluetooth Settings');
  document.getElementById('flashlightBtn').onclick = () => speakAndOpenAssistant('Turning on Flashlight');
  document.getElementById('dndBtn').onclick = () => speakAndOpenAssistant('Enabling Do Not Disturb');
  document.getElementById('volumeBtn').onclick = () => speakAndOpenAssistant('Adjusting Volume');
  document.getElementById('alarmBtn').onclick = () => speakAndOpenAssistant('Setting Alarm or Timer');
  document.getElementById('mediaBtn').onclick = () => speakAndOpenAssistant('Controlling Media Playback');
  document.getElementById('smartHomeBtn').onclick = () => speakAndOpenAssistant('Managing Smart Home Devices');
  document.getElementById('silentNotifBtn').onclick = () => speakAndOpenAssistant('Enabling Silent Notifications');
</script>
