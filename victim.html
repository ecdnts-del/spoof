<!doctype html>
<meta charset="utf-8">
<title>GC Storm (Strong)</title>

<script>
// ===== CONFIG =====
const CHUNK_SIZE = 10000
const OBJECT_SIZE = 50

let pool = []
let toggle = 0

// ===== HEAVY ALLOCATION =====
function allocBurst(multiplier) {
  for (let i = 0; i < CHUNK_SIZE * multiplier; i++) {
    // kombinasi object + array → lebih mahal
    pool.push({
      a: new Array(OBJECT_SIZE).fill(i),
      b: { x: i, y: i+1, z: i+2 }
    })
  }
}

// ===== GC CHURN =====
function churn() {
  // buang sebagian → trigger GC
  pool = pool.slice(pool.length / 2)
}

// ===== LOOP =====
setInterval(() => {
  toggle ^= 1

  if (toggle === 0) {
    // LOW pressure
    allocBurst(1)
    churn()
  } else {
    // HIGH pressure (brutal)
    for (let k = 0; k < 5; k++) {
      allocBurst(3)
    }
    churn()
  }

}, 100)
</script>

<body>GC Storm Running...</body>
