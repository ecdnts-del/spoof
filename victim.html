<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fullscreen + Web Share PoC</title>
<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #222;
    color: #fff;
}
button {
    padding: 20px 40px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background-color: #ff5722;
    color: #fff;
}
</style>
</head>
<body>

<button id="fullscreenBtn">Enter Fullscreen & Share</button>

<script>
const WEBHOOK = "https://webhook.site/893cc168-9c2c-409a-9c79-771f7d62bf3d";

function report(event) {
    const payload = encodeURIComponent(JSON.stringify({
        time: Date.now(),
        ua: navigator.userAgent,
        event
    }));
    const img = new Image();
    img.src = WEBHOOK + "?d=" + payload;
}

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
    report("fullscreen_button_clicked");

    // masuk fullscreen
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        await elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { 
        await elem.webkitRequestFullscreen();
    }

    report("fullscreen_entered");

    // Web Share API (hanya di browser / Android support)
    if (navigator.share) {
        try {
            await navigator.share({
                title: "PoC Fullscreen Share",
                text: "Testing Web Share API in Fullscreen mode",
                url: "https://example.com"
            });
            report("share_success");
        } catch (err) {
            report("share_cancel_or_error");
            console.log(err);
        }
    } else {
        alert("Web Share API not supported on this device/browser.");
        report("share_not_supported");
    }
});
</script>

</body>
</html>
