<!doctype html>
<button id="b">Share</button>

<script>
document.getElementById('b').onclick = async () => {
  const shareData = {
    title: 'Call Center Security Google',
    url: 'security@google.com'
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);

      // Setelah share berhasil, redirect ke Google
      setTimeout(() => {
        location.href = 'https://google.com';
      }, 300);
    } catch (err) {
      console.error('Share dibatalkan atau gagal:', err);
    }
  } else {
    // Fallback ke mailto jika Web Share API tidak didukung
    const mailto = `mailto:someone@example.com?subject=${encodeURIComponent(shareData.title)}&body=${encodeURIComponent(shareData.url)}`;
    window.location.href = mailto;
  }
};
</script>
