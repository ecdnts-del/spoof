<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Share, Fullscreen & Email</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #status {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>

    <button id="mainButton">
        Klik Saya
    </button>

    <div id="status"></div>

    <script>
        const button = document.getElementById("mainButton");
        const status = document.getElementById("status");

        button.addEventListener("click", jalankanSemua);

        async function jalankanSemua() {

            // 1. WEB SHARE DIPANGGIL PALING AWAL
            await webShare();

            // 2. FULLSCREEN
            await masukFullscreen();

            // 3. BUKA EMAIL
            bukaEmail();
        }


        // ==========================================
        // WEB SHARE API
        // ==========================================

        async function webShare() {

            const shareData = {
                title: "Web Share",
                text: "Berbagi melalui Web Share API",
                url: window.location.href
            };

            // Browser tidak mendukung Web Share
            if (!navigator.share) {
                console.log("Web Share API tidak tersedia.");
                return;
            }

            // Cek data share
            if (
                navigator.canShare &&
                !navigator.canShare(shareData)
            ) {
                console.log("Data tidak dapat dibagikan.");
                return;
            }

            try {

                await navigator.share(shareData);

                console.log("Share berhasil.");

            } catch (error) {

                // User menutup / membatalkan dialog share
                console.log(
                    "Share dibatalkan/gagal:",
                    error
                );
            }
        }


        // ==========================================
        // FULLSCREEN
        // ==========================================

        async function masukFullscreen() {

            if (document.fullscreenElement) {
                return;
            }

            try {

                await document.documentElement.requestFullscreen();

                console.log("Fullscreen berhasil.");

            } catch (error) {

                console.log(
                    "Fullscreen gagal:",
                    error
                );
            }
        }


        // ==========================================
        // EMAIL
        // ==========================================

        function bukaEmail() {

            window.location.href =
                "mailto:ecdnts@gmail.com";

        }
    </script>

</body>
</html>
