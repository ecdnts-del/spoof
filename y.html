<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker Akurat</title>
</head>
<body>

<!-- Perbaikan: Fungsi dipanggil secara langsung tanpa string di setTimeout -->
<a href="https://google.com" 
   oncontextmenu="setTimeout(openAndReadFile, 3200); return false;" 
   onclick="f()">
   Klik Kanan & Tunggu 3.2 Detik untuk Buka Gambar
</a>
<br/><br/><br/><br/>

<img id="myImageElement" width="300px" height="300px" alt="Pratinjau Gambar" style="object-fit: contain; border: 1px solid #ccc;">

<script>
// Variabel untuk melacak URL gambar sebelumnya agar tidak bocor memorinya
let currentImageUrl = null;

// Fungsi dummy f() agar tidak error jika Anda belum mendefinisikannya
function f() {
    console.log("Link diklik kiri");
}

async function openAndReadFile() {
  // Pastikan browser mendukung File System Access API
  if (!('showOpenFilePicker' in window)) {
    alert("Browser Anda tidak mendukung File System Access API. Gunakan Chrome, Edge, atau Opera terbaru.");
    return;
  }

  try {
    const pickerOpts = {
      types: [
        {
          description: "Images",
          accept: {
            "image/*": [".png", ".gif", ".jpeg", ".jpg", ".webp"], // Ditambahkan .webp
          },
        },
      ],
      excludeAcceptAllOption: false, 
      multiple: false, 
    };

    // 1. Ambil file handle dari user
    const [fileHandle] = await window.showOpenFilePicker(pickerOpts);

    // 2. Ambil objek File fisik
    const file = await fileHandle.getFile();
     
    console.log("File Name:", file.name);
    console.log("File Size:", (file.size / 1024).toFixed(2) + " KB");

    // 3. Bersihkan memori dari gambar sebelumnya (jika ada)
    if (currentImageUrl) {
      URL.revokeObjectURL(currentImageUrl);
    }

    // 4. Buat URL baru dan pasang ke elemen <img>
    currentImageUrl = URL.createObjectURL(file);
    const imgElement = document.getElementById('myImageElement');
    imgElement.src = currentImageUrl;

    /* 
      Catatan Keamanan & Performa: 
      Jangan gunakan file.text() untuk gambar karena gambar adalah data biner.
      Jika Anda butuh data mentah untuk dikirim ke server, gunakan:
      const arrayBuffer = await file.arrayBuffer();
    */

  } catch (error) {
    if (error.name === 'AbortError') {
      console.log('User membatalkan pemilihan file.');
    } else {
      console.error('Error saat membuka atau membaca file:', error);
    }
  }
}
</script>

</body>
</html>
