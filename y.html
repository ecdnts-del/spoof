<!DOCTYPE html>
<html>
<head>
<title>Discord Voice Assistant</title>

<style>
body{
font-family:Arial;
background:#202124;
color:white;
text-align:center;
padding:40px;
}

button{
font-size:20px;
padding:15px;
border-radius:10px;
background:#5865F2;
color:white;
border:0;
}
</style>

</head>

<body>

<h2>🎤 Discord Voice Assistant</h2>

<button onclick="mulai()">Mulai Bicara</button>

<p id="hasil">Menunggu...</p>

<script>

function mulai(){

let speech = new webkitSpeechRecognition();

speech.lang="id-ID";
speech.continuous=false;

speech.start();


speech.onresult=function(event){

let teks =
event.results[0][0].transcript.toLowerCase();


document.getElementById("hasil").innerHTML =
"Perintah: "+teks;


// buka Discord otomatis
if(teks.includes("discord")){

window.location.href =
"intent://#Intent;package=com.discord;scheme=discord;end";

}

}

}

</script>

</body>
</html>
