<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Origin Test PoC</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 80px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>WebView Origin Test</h2>
<p>Test window navigation behavior</p>

<button onclick="test()">Start Test</button>

<script>
function test() {

  const win = window.open("https://x.com:90");

  if (!win) {
    alert("Popup blocked");
    return;
  }

  setTimeout(() => {
    try {
      win.document.body.innerHTML = `
        <h1>Test Content</h1>
        <p>This page checks WebView rendering behavior.</p>
        <p>No data is collected.</p>
      `;
    } catch (e) {
      console.log("Cross-origin protection:", e);
    }
  }, 2000);

}
</script>

</body>
</html>
