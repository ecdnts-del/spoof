<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Race Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
    font-family: system-ui;
    text-align:center;
    padding-top:80px;
}

button {
    padding:15px 25px;
    font-size:16px;
    border-radius:10px;
}

#status {
    margin-top:30px;
    font-size:14px;
}
</style>

</head>

<body>


<button id="start">
Start Test
</button>


<div id="status">
Idle
</div>



<script>


const status =
document.getElementById("status");


const TARGET =
"https://example.com:9090";


const DELAY =
80;



function show(text){

status.innerHTML = text;

}



function snapshot(name){

console.log(
name,
{
    url:location.href,
    origin:location.origin,
    time:performance.now(),
    visibility:document.visibilityState
});

}




function requestGeo(){


snapshot(
"before_geolocation"
);



navigator.geolocation.getCurrentPosition(


(pos)=>{


snapshot(
"geolocation_success"
);



show(
"Location received<br>"+
pos.coords.latitude+
"<br>"+
pos.coords.longitude
);



},


(err)=>{


snapshot(
"geolocation_error"
);



show(
"Geolocation error:<br>"+
err.message
);



}


);


}





document.getElementById("start")
.onclick = ()=>{


show(
"Preparing..."
);



snapshot(
"before_pushState"
);



history.pushState(
{
test:"origin-race"
},
"",
"/trusted"
);



snapshot(
"after_pushState"
);



show(
"URL changed:<br>"+
location.href+
"<br>Waiting..."
);



requestAnimationFrame(()=>{


requestAnimationFrame(()=>{


setTimeout(()=>{


snapshot(
"permission_race_point"
);



requestGeo();



/*
navigation race
*/

setTimeout(()=>{


snapshot(
"navigation_start"
);



location.href =
TARGET;



},80);



},DELAY);



});


});


};




window.addEventListener(
"pageshow",
()=>{

snapshot(
"pageshow"
);

});



window.addEventListener(
"beforeunload",
()=>{

snapshot(
"beforeunload"
);

});



window.addEventListener(
"pagehide",
()=>{

snapshot(
"pagehide"
);

});


</script>


</body>
</html>
