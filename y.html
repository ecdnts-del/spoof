```html
<!DOCTYPE html>
<html>
<head>
<title>Auto MP3 Discord Launcher</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    background:#202124;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

button{
    background:#5865F2;
    color:white;
    border:0;
    padding:15px 25px;
    border-radius:10px;
    font-size:18px;
}

#hasil{
    margin-top:20px;
    font-size:18px;
}

audio{
    margin-top:20px;
    width:90%;
}

</style>

</head>


<body>

<h2>🎵 Auto MP3 Discord Test</h2>

<button onclick="mulai()">
▶ Mulai Test
</button>


<br>

<audio id="audio" controls></audio>

<p id="hasil">
Menunggu...
</p>



<script>


function mulai(){


let audio =
document.getElementById("audio");


// MP3 satu folder dengan HTML
audio.src="audio.mp3";

audio.play()
.catch(function(){

document.getElementById("hasil").innerHTML =
"Audio diblokir Chrome, tekan play jika perlu";

});



// SIMULASI HASIL AI / SPEECH TO TEXT
let teks =
"buka discord";


document.getElementById("hasil").innerHTML =
"Perintah terdeteksi: " + teks;



if(teks.includes("discord")){


setTimeout(function(){


bukaDiscord();


},2000);


}



}



function bukaDiscord(){


// Android Intent
window.location.href =
"intent://#Intent;" +
"scheme=discord;" +
"package=com.discord;" +
"S.browser_fallback_url=;" +
"end";


}


</script>


</body>
</html>
```
