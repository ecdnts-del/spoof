```html
<!DOCTYPE html>
<html>
<head>

<title>Auto App Launcher Android</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    background:#202124;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

button{
    background:#5865F2;
    color:white;
    border:0;
    padding:15px 25px;
    margin:10px;
    border-radius:10px;
    font-size:18px;
}

</style>

</head>

<body>


<h2>📱 Auto Android App Launcher</h2>


<button onclick="bukaDiscord()">
Buka Discord
</button>


<button onclick="bukaGmail()">
Buka Gmail
</button>


<p id="hasil">
Menunggu...
</p>



<script>


function bukaDiscord(){

document.getElementById("hasil").innerHTML =
"Membuka Discord...";


window.location.href =
"intent://#Intent;" +
"scheme=discord;" +
"package=com.discord;" +
"end";

}



function bukaGmail(){

document.getElementById("hasil").innerHTML =
"Membuka Gmail...";


window.location.href =
"intent://#Intent;" +
"scheme=mailto;" +
"package=com.google.android.gm;" +
"end";

}



</script>


</body>
</html>
```
