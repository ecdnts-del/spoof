```html
<!DOCTYPE html>
<html>
<head>

<title>TTS Open URL Android</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    background:#202124;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

button{
    background:#4285F4;
    color:white;
    border:0;
    padding:15px 25px;
    margin:10px;
    border-radius:10px;
    font-size:18px;
}

</style>

</head>

<body>


<h2>🔊 TTS URL Launcher</h2>


<button onclick="jalankan()">
Mulai
</button>


<p id="hasil">
Menunggu...
</p>



<script>


function jalankan(){


let pesan =
"Membuka website sekarang";


document.getElementById("hasil").innerHTML =
pesan;


// TTS Android Chrome

let suara =
new SpeechSynthesisUtterance(pesan);

suara.lang="id-ID";



suara.onend=function(){

// buka URL setelah suara selesai

window.location.href =
"https://www.google.com";


};



speechSynthesis.speak(suara);



}


</script>


</body>
</html>
