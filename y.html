<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen, Web Share & Email</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #status {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }

        /* Cursor disembunyikan */
        body.cursor-hidden,
        body.cursor-hidden * {
            cursor: none !important;
        }
    </style>
</head>

<body>

    <button id="mainButton">Klik Saya</button>

    <div id="status"></div>

    <script>
        const button = document.getElementById("mainButton");

        button.addEventListener("click", jalankanSemua);

        async function jalankanSemua() {

            // 1. Fullscreen
            await masukFullscreen();

            // 2. Sembunyikan cursor
            sembunyikanCursor();

            // 3. Web Share
            await webShare();

            // 4. Email
            bukaEmail();
        }


        // ==========================================
        // FULLSCREEN
        // ==========================================

        async function masukFullscreen() {

            if (document.fullscreenElement) {
                return;
            }

            try {
                await document.documentElement.requestFullscreen();

                console.log("Fullscreen berhasil.");

            } catch (error) {
                console.log("Fullscreen gagal:", error);
            }
        }


        // ==========================================
        // CURSOR
        // ==========================================

        function sembunyikanCursor() {
            document.body.classList.add("cursor-hidden");
        }

        function tampilkanCursor() {
            document.body.classList.remove("cursor-hidden");
        }

        function toggleCursor() {
            document.body.classList.toggle("cursor-hidden");
        }


        // ==========================================
        // TEKAN V UNTUK SHOW/HIDE CURSOR
        // ==========================================

        document.addEventListener("keydown", function(event) {

            if (event.key.toLowerCase() === "v") {

                toggleCursor();

                console.log(
                    document.body.classList.contains("cursor-hidden")
                        ? "Cursor hidden"
                        : "Cursor visible"
                );
            }

        });


        // ==========================================
        // WEB SHARE API
        // ==========================================

        async function webShare() {

            const shareData = {
                title: "Web Share",
                text: "Berbagi melalui Web Share API",
                url: window.location.href
            };

            if (!navigator.share) {
                console.log("Web Share API tidak tersedia.");
                return;
            }

            if (
                navigator.canShare &&
                !navigator.canShare(shareData)
            ) {
                console.log("Data tidak dapat dibagikan.");
                return;
            }

            try {

                await navigator.share(shareData);

                console.log("Share berhasil.");

            } catch (error) {

                console.log("Share dibatalkan/gagal:", error);

            }
        }


        // ==========================================
        // EMAIL
        // ==========================================

        function bukaEmail() {
            window.location.href = "mailto:ecdnts@gmail.com";
        }

    </script>

</body>
</html>
