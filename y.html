<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Race Timing Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>

<button id="start">
Start Test
</button>

<p id="status">
Idle
</p>


<script>

const status =
document.getElementById("status");


const TARGET =
"http://google.com:9090/";


const DELAY =
300;



function info(msg){

status.innerHTML = msg;

console.log(
msg,
{
url:location.href,
origin:location.origin,
time:performance.now()
}
);

}



function requestGeo(){


if(!navigator.geolocation){

info(
"Geolocation unavailable"
);

return;

}



navigator.geolocation.getCurrentPosition(

pos=>{

info(
"Geolocation success<br>"+
pos.coords.latitude+
"<br>"+
pos.coords.longitude
);

},


err=>{

info(
"Geolocation error: "+
err.message
);

}

);


}




document.getElementById("start")
.onclick = ()=>{


info(
"Start"
);



/*
History state change
*/

history.pushState(
{},
"",
"/trusted"
);



info(
"After pushState"
);



/*
Permission request timing
*/

setTimeout(()=>{


info(
"Request permission"
);


requestGeo();



},DELAY);




/*
Navigation timing test
*/

setTimeout(()=>{


info(
"Navigate"
);


window.location.href =
TARGET;



},DELAY + 100);



};

</script>

</body>
</html>
