<!DOCTYPE html>
<html>
<head>
<title>Auto MP3 Discord Test</title>

<style>
body{
background:#202124;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}
</style>

</head>

<body>

<h2>🎵 Auto MP3 Command Test</h2>

<audio id="audio" autoplay></audio>

<p id="hasil">Memproses...</p>


<script>

window.onload = async function(){

let audio =
document.getElementById("audio");


// MP3 harus ada di folder yang sama
audio.src="command.mp3";


// coba putar otomatis
audio.play()
.catch(e=>{
console.log("Autoplay diblokir Chrome");
});


// simulasi hasil Whisper/STT
let teks =
"buka discord";


document.getElementById("hasil").innerHTML =
"Deteksi: "+teks;


// delay agar terlihat seperti proses AI
setTimeout(()=>{

if(teks.includes("discord")){


// Android intent
location.href =
"intent://#Intent;package=com.discord;scheme=discord;end";


}

},2000);


}

</script>

</body>
</html>
