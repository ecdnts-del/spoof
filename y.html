<!doctype html>
<html>
<head>

<meta charset="utf-8">
<title>Window Navigation + Geolocation Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
    font-family:system-ui;
    padding:40px;
}

button{
    padding:12px 20px;
    font-size:16px;
    margin:5px;
}

pre{
    margin-top:20px;
    background:#eee;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
}

</style>

</head>


<body>


<h2>Navigation + Geolocation Test</h2>


<button onclick="start()">
Start Window Test
</button>


<button onclick="getLocation()">
Request Location
</button>


<pre id="log">
Idle
</pre>



<script>


let child = null;
let count = 0;


const TARGET =
"https://google.com:9090/#https://google.com:9090";



function log(message, extra={}){


count++;


const data = {

id:count,

message,

time:
performance.now().toFixed(3),

url:
location.href,

origin:
location.origin,

...extra

};



document
.getElementById("log")
.textContent +=
JSON.stringify(data,null,2)
+
"\n\n";



console.log(data);


}




function start(){


log(
"Opening child window"
);



child =
window.open(
TARGET,
"testWindow",
"width=500,height=500"
);



if(!child){

log(
"Popup blocked"
);

return;

}



log(
"Child opened"
);



const timer =
setInterval(()=>{


try{


log(
"Child URL readable",
{
childURL:child.location.href
}
);


}

catch(e){


log(
"Child became cross origin"
);


}



},50);




setTimeout(()=>{


clearInterval(timer);


log(
"Window monitoring finished"
);



},5000);



}






function getLocation(){



if(!navigator.geolocation){


log(
"Geolocation unavailable"
);


return;


}



log(
"Geolocation request started"
);



navigator.geolocation.getCurrentPosition(


(position)=>{


log(
"Geolocation success",
{

latitude:
position.coords.latitude,

longitude:
position.coords.longitude,

accuracy:
position.coords.accuracy

}

);



},



(error)=>{


log(
"Geolocation error",
{

code:error.code,

message:error.message

}

);


}



);



}






window.addEventListener(
"pageshow",
()=>{

log(
"pageshow"
);

});



window.addEventListener(
"pagehide",
()=>{

log(
"pagehide"
);

});



document.addEventListener(
"visibilitychange",
()=>{

log(
"visibilitychange",
{
state:document.visibilityState
}
);

});



</script>


</body>
</html>
