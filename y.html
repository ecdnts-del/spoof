<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Double Click Button</title>
    <style>
        /* Membuat halaman memenuhi layar dan memposisikan tombol di tengah */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none; /* Mematikan seleksi teks */
        }

        /* Styling tombol berbentuk PERSEGI besar */
        .btn-fullscreen {
            width: 300px;  
            height: 300px; 
            font-size: 28px;
            font-weight: bold;
            color: white;
            background-color: #d9534f; 
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-fullscreen:hover {
            background-color: #c9302c;
            transform: scale(1.03);
        }

        .btn-fullscreen:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Onclick untuk klik kiri, oncontextmenu untuk klik kanan -->
    <button class="btn-fullscreen" onclick="triggerAction()" oncontextmenu="handleRightClick(event)">
        Click / Right Click<br>Me!
    </button>

    <script>
    function triggerAction() {
        // PERBAIKAN 1: Eksekusi Fullscreen terlebih dahulu
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen()
            .then(() => {
                // PERBAIKAN 2: Beri jeda 100ms setelah fullscreen aktif, baru panggil Share API
                // Ini dilakukan agar browser tidak menganggapnya sebagai spam / tabrakan instruksi
                setTimeout(openShareAPI, 100);
            })
            .catch(err => {
                console.log("Gagal masuk Fullscreen: ", err);
                // Jika gagal fullscreen (misal di iframe), tetap coba buka share api
                openShareAPI();
            });
        } else {
            openShareAPI();
        }
    }

    // Fungsi khusus untuk memanggil Web Share API secara bersih
    function openShareAPI() {
        if (navigator.share) {
            navigator.share({
                title: '\u26A0 HAI \u26A0\nCHAI',
                text: 'HALLO',
                url: window.location.href // Wajib ada URL agar disetujui sistem Android/iOS/Windows
            })
            .then(() => console.log('Share berhasil dibuka!'))
            .catch((error) => console.log('Share error/batal:', error));
        } else {
            alert("Browser atau koneksi Anda tidak mendukung Web Share API.");
        }
    }

    // Menangani klik kanan
    function handleRightClick(event) {
        event.preventDefault(); // Matikan menu bawaan browser klik kanan
        triggerAction();        // Jalankan gabungan fullscreen + share
    }
    </script>
</body>
</html>
