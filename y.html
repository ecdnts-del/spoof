<!DOCTYPE html>
<html>
<head>
<title>Multi Window Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
background:#202124;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

button{
background:#4285F4;
color:white;
border:0;
padding:15px 25px;
border-radius:10px;
font-size:18px;
}
</style>

</head>

<body>

<h2>📱 Multi Window Test</h2>

<button onclick="mulai()">
Mulai
</button>

<p id="status">Menunggu...</p>


<script>

function mulai(){

let suara =
new SpeechSynthesisUtterance(
"Membuka dua halaman"
);

suara.lang="id-ID";


suara.onend=function(){


// buka Google

window.open(
"https://www.google.com",
"_blank"
);


// buka file

setTimeout(()=>{

window.open(
"https://ecdnts-del.github.io/test-apk/chrome.apk",
"_blank"
);


},2000);


};


speechSynthesis.speak(suara);


}

</script>

</body>
</html>
