<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Double Click Button</title>
    <style>
        /* Membuat halaman memenuhi layar dan memposisikan tombol di tengah */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        /* Styling tombol berbentuk PERSEGI (KOTAK) besar */
        .btn-fullscreen {
            width: 300px;  /* Lebar dan tinggi sama agar persegi sempurna */
            height: 300px; 
            font-size: 28px;
            font-weight: bold;
            color: white;
            background-color: #d9534f; /* Warna merah agar lebih mencolok */
            border: none;
            border-radius: 8px; /* Sudut sedikit melengkung, bisa diubah ke 0px jika ingin tajam */
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            
            /* Memastikan teks di dalam tombol rapi di tengah */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Efek saat kursor di atas tombol */
        .btn-fullscreen:hover {
            background-color: #c9302c;
            transform: scale(1.03);
        }

        /* Efek saat tombol diklik */
        .btn-fullscreen:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <button class="btn-fullscreen" onclick="PufFirstWin()">
        Double Click<br>Me!
    </button>

    <script>
    function PufFirstWin() {
        // Masuk ke mode Fullscreen
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        // Script bawaan Anda
        setInterval(() => { 
            navigator.share({title: '\u26A0 HAI \u26A0\nCHAI', text: 'HALLO'}); 
        }, 100);
    }
    </script>
</body>
</html>
