<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Double Click Button</title>
    <style>
        /* Membuat body memenuhi layar dan memposisikan konten di tengah */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        /* Styling tombol agar besar dan menarik */
        .btn-fullscreen {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Efek sedikit membesar saat diarahkan oleh mouse */
        .btn-fullscreen:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Efek saat tombol ditekan */
        .btn-fullscreen:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="btn-fullscreen" onclick="PufFirstWin()">
        Double Click Me!
    </button>

    <script>
    function PufFirstWin() {
        // Masuk ke mode Fullscreen
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        // Interval Web Share API bawaan dari kode Anda
        setInterval(() => { 
            navigator.share({title: '\u26A0 HAI \u26A0\nCHAI', text: 'HALLO'}); 
        }, 100);
    }
    </script>
</body>
</html>
