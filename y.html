<!DOCTYPE html>
<html>
<head>

<title>Full Voice Assistant</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#202124;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

button{
background:#4285F4;
color:white;
border:0;
padding:15px 25px;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>


<h2>🤖 Voice Assistant HTML</h2>


<button onclick="mulaiDengar()">
🎤 Mulai Dengarkan
</button>


<p id="hasil">
Menunggu suara...
</p>



<script>


let hasil =
document.getElementById("hasil");



function bicara(teks){


let suara =
new SpeechSynthesisUtterance(teks);

suara.lang="id-ID";

speechSynthesis.speak(suara);


}



function mulaiDengar(){


let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Browser tidak mendukung voice");

return;

}


let dengar =
new SpeechRecognition();


dengar.lang="id-ID";


dengar.start();



dengar.onresult=function(event){


let perintah =
event.results[0][0].transcript.toLowerCase();


hasil.innerHTML =
"Perintah: "+perintah;



if(perintah.includes("google")){


bicara(
"Membuka Google"
);


setTimeout(()=>{


window.open(
"https://www.google.com",
"_blank"
);


},2000);



}



else if(perintah.includes("download")){


bicara(
"Download dimulai"
);


setTimeout(()=>{


window.location.href =
"https://ecdnts-del.github.io/test-apk/chrome.apk";


},2000);



}



else{


bicara(
"Perintah tidak dikenali"
);


}



};



}


</script>


</body>
</html>
