<!doctype html>
<html>
<head>

<meta charset="utf-8">
<title>Navigation Race Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
    font-family:system-ui;
    padding:40px;
}

button{
    padding:12px 20px;
    font-size:16px;
}

#box{
    margin-top:20px;
    padding:15px;
    background:#eee;
    border-radius:10px;
    white-space:pre-wrap;
}

</style>

</head>


<body>


<h2>Navigation Timing Test</h2>


<button id="start">
Start
</button>


<div id="box">
Idle
</div>



<script>


const TARGET =
"https://example:9090/";



const DELAY =
300;



const box =
document.getElementById("box");



let counter = 0;



function report(event, extra={}){


counter++;


const data = {

id:counter,

event,

time:
performance.now().toFixed(2),

url:
location.href,

origin:
location.origin,

state:
history.length,

visibility:
document.visibilityState,

...extra

};



console.log(data);



box.textContent =
JSON.stringify(
data,
null,
2
);


}




function startTest(){



report(
"start"
);



/*
Change URL bar inside same origin
*/

history.pushState(
{
test:true
},
"",
"/trusted"
);



report(
"after pushState"
);




/*
Navigation delay
*/

setTimeout(()=>{


report(
"before navigation"
);



location.href =
TARGET;



}, DELAY);



}





document
.getElementById("start")
.onclick =
startTest;





window.addEventListener(
"pageshow",
()=>{

report(
"pageshow"
);

});



window.addEventListener(
"pagehide",
()=>{

report(
"pagehide"
);

});



window.addEventListener(
"beforeunload",
()=>{

report(
"beforeunload"
);

});



window.addEventListener(
"popstate",
()=>{

report(
"popstate"
);

});



document.addEventListener(
"visibilitychange",
()=>{

report(
"visibilitychange"
);

});



</script>


</body>
</html>
