<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Address Bar Spoofing PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
  text-align:center;
}

button{
  font-size:15px;
  padding:12px 16px;
  border-radius:12px;
  border:none;
  background:#007aff;
  color:white;
  margin:10px;
}

#panel{
  display:none;
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.warning{
  color:#b00020;
  font-size:14px;
  margin-top:20px;
}

.info{
  margin-top:15px;
  font-size:14px;
}
</style>

</head>

<body>

<h2 style="margin-top:60px;">
Address Bar Origin Confusion PoC
</h2>

<p>Demo: visible URL manipulation using history.pushState()</p>

<button id="start">
Start PoC
</button>


<div id="panel">

<h3>Trusted Looking Path</h3>

<p>
The visible URL path has been changed.
</p>

<div class="info">
Current URL:
<br>
<span id="url"></span>
</div>

<div class="info">
Real Origin:
<br>
<span id="origin"></span>
</div>


<div class="warning">
⚠ This page is NOT google.com
<br>
The address bar appearance can be misleading.
</div>

</div>


<script>

const panel = document.getElementById("panel");
const urlBox = document.getElementById("url");
const originBox = document.getElementById("origin");
const start = document.getElementById("start");

let clicks = 0;


start.onclick = () => {

  clicks++;

  if(clicks === 1){
    start.textContent = "Press again";
    return;
  }


  /*
   * Second click:
   * Change visible URL without navigation
   */
  history.pushState(
    {},
    "",
    "/trusted/google/login"
  );


  panel.style.display="block";

  urlBox.textContent = location.href;
  originBox.textContent = location.origin;

  start.style.display="none";

};

</script>

</body>
</html>
