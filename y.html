<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Address Bar Spoofing PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
  text-align:center;
}

button{
  font-size:16px;
  padding:12px 18px;
  border-radius:12px;
  border:none;
  background:#000;
  color:white;
  margin-top:80px;
}

#result{
  display:none;
  margin:40px auto;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.warning{
  color:#b00020;
  font-size:18px;
  font-weight:bold;
}

.info{
  margin-top:15px;
  font-size:14px;
}
</style>

</head>

<body>

<button id="start">
Start
</button>


<div id="result">

<h2>NOT X</h2>

<div class="warning">
This is NOT x.com
</div>

<div class="info">
Visible URL:
<br>
<span id="url"></span>
</div>

<div class="info">
Real Origin:
<br>
<span id="origin"></span>
</div>

</div>


<script>

const result = document.getElementById("result");
const url = document.getElementById("url");
const origin = document.getElementById("origin");


document.getElementById("start").onclick = () => {

  /*
   * Change visible path only
   * Origin remains unchanged
   */
  history.pushState(
    {},
    "",
    "/x/login"
  );


  result.style.display="block";

  url.textContent = location.href;
  origin.textContent = location.origin;

};

</script>

</body>
</html>
