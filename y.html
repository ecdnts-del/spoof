<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Permission API Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<button id="start">
Start PoC
</button>

<hr>

<button onclick="geo()">Geolocation</button>
<button onclick="camera()">Camera</button>
<button onclick="mic()">Microphone</button>
<button onclick="motion()">Motion</button>
<button onclick="orientation()">Orientation</button>

<p id="url"></p>
<p id="result">Result:</p>


<script>

const result = document.getElementById("result");


function show(msg){
    result.innerHTML = msg;
}



/*
START
*/

document.getElementById("start").onclick = ()=>{

    history.pushState(
        {},
        "",
        "/trusted"
    );


    document.getElementById("url").innerHTML =
        "URL: " + location.href;

};




/*
GEOLOCATION
*/

function geo(){

    if(!navigator.geolocation){

        show("Geolocation unavailable");
        return;

    }


    navigator.geolocation.getCurrentPosition(

        pos=>{

            show(
                "Geo OK<br>"+
                pos.coords.latitude+
                "<br>"+
                pos.coords.longitude
            );

        },

        err=>{

            show(
                "Geo error: "+
                err.message
            );

        }

    );

}



/*
CAMERA
*/

async function camera(){

try{


let stream =
await navigator.mediaDevices.getUserMedia({

video:true

});


show("Camera OK");


stream.getTracks()
.forEach(t=>t.stop());


}catch(e){

show(
"Camera error: "+e.message
);

}


}



/*
MIC
*/

async function mic(){

try{


let stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});


show("Microphone OK");


stream.getTracks()
.forEach(t=>t.stop());


}catch(e){

show(
"Mic error: "+e.message
);

}


}



/*
MOTION
*/

function motion(){


if(
typeof DeviceMotionEvent === "undefined"
){

show(
"Motion unavailable"
);

return;

}


let count=0;


window.addEventListener(
"devicemotion",
(e)=>{


count++;


if(count===1){

show(
"Motion detected"
);

}


},
{
once:true
});


}




/*
ORIENTATION
*/

function orientation(){


if(
typeof DeviceOrientationEvent === "undefined"
){

show(
"Orientation unavailable"
);

return;

}



window.addEventListener(

"deviceorientation",

(e)=>{


show(
"Orientation detected<br>"+
"alpha: "+e.alpha+
"<br>beta: "+e.beta+
"<br>gamma: "+e.gamma
);


},

{
once:true
}

);


}



/*
OPTIONAL NAVIGATION RACE
*/

window.addEventListener(
"pageshow",
()=>{


requestAnimationFrame(()=>{


requestAnimationFrame(()=>{


setTimeout(()=>{


// aktifkan jika ingin test race

// location.href="https://google.com:9090";


},80);


});


});


});


</script>

</body>
</html>
