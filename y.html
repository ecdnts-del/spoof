<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Address Bar Spoof Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
}

.box {
  background:#f5f5f7;
  padding:20px;
  border-radius:12px;
}

button {
  padding:12px;
  border:0;
  border-radius:10px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<div class="box">

<h2>Address Bar Test</h2>

<p id="url"></p>
<p id="origin"></p>

<button onclick="changePath()">
Change Visible Path
</button>

<button onclick="navigate()">
Navigate
</button>

</div>


<script>

function update(){

document.getElementById("url").textContent =
"location.href: " + location.href;

document.getElementById("origin").textContent =
"origin: " + location.origin;

}


function changePath(){

history.pushState(
{},
"",
"/trusted-login"
);

update();

}


function navigate(){

location.href =
"https://example.com";

}


update();

window.onpopstate = update;

</script>

</body>
</html>
