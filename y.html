<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Double Click Button</title>
    <style>
        /* Membuat halaman memenuhi layar dan memposisikan tombol di tengah */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Menghilangkan scrollbar */
        }

        /* Styling tombol berbentuk PERSEGI (KOTAK) besar */
        .btn-fullscreen {
            width: 300px;  /* Lebar dan tinggi sama agar persegi sempurna */
            height: 300px; 
            font-size: 28px;
            font-weight: bold;
            color: white;
            background-color: #d9534f; /* Warna merah mencolok */
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            
            /* Memastikan teks di dalam tombol rapi di tengah */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Efek saat kursor di atas tombol */
        .btn-fullscreen:hover {
            background-color: #c9302c;
            transform: scale(1.03);
        }

        /* Efek saat tombol diklik */
        .btn-fullscreen:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Menggunakan onclick normal yang langsung mengeksekusi perintah user -->
    <button class="btn-fullscreen" onclick="PufFirstWin()">
        Double Click<br>Me!
    </button>

    <script>
    function PufFirstWin() {
        // 1. Jalankan Fullscreen terlebih dahulu
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log("Gagal Fullscreen: ", err);
            });
        }

        // 2. Jalankan Web Share API langsung tanpa setInterval agar tidak diblokir browser
        if (navigator.share) {
            navigator.share({
                title: '\u26A0 HAI \u26A0\nCHAI',
                text: 'HALLO',
                url: window.location.href // Menambahkan URL halaman aktif agar lolos validasi browser
            })
            .then(() => console.log('Berhasil share!'))
            .catch((error) => console.log('Gagal/Dibatalkan share:', error));
        } else {
            alert("Browser Anda tidak mendukung Web Share API.");
        }
    }
    </script>
</body>
</html>
