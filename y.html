<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Window Navigation Timing Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>

<button onclick="start()">
Start Test
</button>

<pre id="log"></pre>


<script>

let child;
let count = 0;

const TARGET =
"https://example.com:9090";


function log(msg){

document.getElementById("log").textContent +=
(
++count +
" - " +
msg +
"\n"
);

console.log(msg);

}



function start(){


log(
"opening child window"
);



child =
window.open(
"about:blank",
"test",
"width=500,height=500"
);



setTimeout(()=>{


log(
"navigate child"
);


child.location.href =
TARGET;



},100);



setInterval(()=>{


try{


log(
"child url readable: "+
child.location.href
);


}
catch(e){


log(
"cross origin blocked"
);


}


},20);



}


</script>

</body>
</html>
