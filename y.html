<!DOCTYPE html>
<html>
<head>

<title>Full SpeechSynthesis Control</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#202124;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

textarea{
width:90%;
height:100px;
font-size:18px;
padding:10px;
border-radius:10px;
}

button,select,input{
margin:8px;
padding:12px;
font-size:16px;
border-radius:8px;
}

button{
background:#4285F4;
color:white;
border:0;
}

</style>

</head>


<body>


<h2>🔊 SpeechSynthesis Full Control</h2>


<textarea id="text">
Halo, saya adalah asisten suara.
</textarea>


<br>


<select id="voice"></select>


<br>


<label>
Kecepatan
<input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
</label>


<br>


<label>
Nada
<input id="pitch" type="range" min="0" max="2" step="0.1" value="1">
</label>


<br>


<label>
Volume
<input id="volume" type="range" min="0" max="1" step="0.1" value="1">
</label>


<br>


<button onclick="bicara()">
▶ Bicara
</button>


<button onclick="pauseTTS()">
⏸ Pause
</button>


<button onclick="lanjutTTS()">
▶ Lanjut
</button>


<button onclick="stopTTS()">
⏹ Stop
</button>


<p id="status">
Siap...
</p>



<script>


let synth =
window.speechSynthesis;


let voices=[];



function loadVoice(){


voices =
synth.getVoices();


let select =
document.getElementById("voice");


select.innerHTML="";


voices.forEach((v,i)=>{


let option =
document.createElement("option");


option.value=i;


option.textContent =
v.name+" ("+v.lang+")";


select.appendChild(option);


});


}


loadVoice();


speechSynthesis.onvoiceschanged =
loadVoice;



function bicara(){


stopTTS();



let teks =
document.getElementById("text").value;



let suara =
new SpeechSynthesisUtterance(teks);



suara.voice =
voices[
document.getElementById("voice").value
];



suara.lang =
suara.voice.lang;



suara.rate =
document.getElementById("rate").value;



suara.pitch =
document.getElementById("pitch").value;



suara.volume =
document.getElementById("volume").value;



suara.onstart=function(){

status.innerHTML="🔊 Sedang bicara";

};



suara.onend=function(){

status.innerHTML="✅ Selesai";

};



synth.speak(suara);


}



function pauseTTS(){

synth.pause();

status.innerHTML="⏸ Pause";

}



function lanjutTTS(){

synth.resume();

status.innerHTML="▶ Lanjut";

}



function stopTTS(){

synth.cancel();

status.innerHTML="⏹ Stop";

}


</script>


</body>
</html>
