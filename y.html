<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>File Save Picker Akurat & Kuat</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background-color: #fafafa;
      cursor: pointer;
      user-select: none;
    }
    h1 {
      color: #333;
      text-align: center;
      max-width: 400px;
      padding: 20px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Klik di mana saja untuk memunculkan Save File Picker</h1>

  <script>
    // Menggunakan pemanggilan asinkronus langsung pada event listener
    document.addEventListener('click', async () => {
      
      // 1. Proteksi: Cek dukungan browser terhadap File System Access API
      if (!('showSaveFilePicker' in window)) {
        alert('Browser Anda tidak mendukung File System Access API. Gunakan Chrome atau Edge terbaru.');
        return;
      }

      try {
        // PERBAIKAN UTAMA: Picker harus muncul LANGSUNG saat klik (tanpa setTimeout 3 detik)
        // Jika menggunakan setTimeout > 1 detik, browser akan memblokirnya demi keamanan.
        const handle = await window.showSaveFilePicker({
          suggestedName: 'file.php',
          types: [{
            description: 'PHP Script Files',
            // Perbaikan MIME Type: .php idealnya dipasangkan dengan text/php atau application/x-httpd-php
            accept: {'text/plain': ['.php']} 
          }],
        });

        // 2. Jika user sudah memilih lokasi simpan, kita bisa memberikan jeda proses penulisan di sini jika diperlukan
        console.log("Menyiapkan penulisan file...");
        
        // Membuat writable stream untuk menulis file
        const writable = await handle.createWritable();
        
        // Menulis konten ke dalam file
        await writable.write('<?php\n// Ini adalah file PHP yang dibuat otomatis\necho "Hello World";\n?>');
        
        // Wajib ditutup untuk menyimpan perubahan secara permanen ke disk
        await writable.close();
        
        alert('File berhasil disimpan!');

      } catch (err) {
        // Menangani pembatalan oleh user atau error sistem secara elegan
        if (err.name === 'AbortError') {
          console.log('User membatalkan penyimpanan file.');
        } else {
          console.error('Terjadi kesalahan:', err);
        }
      }
    }, { once: true }); // Opsi { once: true } memastikan kode ini hanya berjalan 1 kali per muat halaman
  </script>
</body>
</html>
