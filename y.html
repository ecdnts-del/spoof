<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Fullscreen Gede</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: sans-serif;
        }

        /* Styling tombol biar GEDEEE */
        .btn-fullscreen {
            padding: 40px 80px;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            background-color: #ff4757;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
        }

        .btn-fullscreen:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        .btn-fullscreen:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Tombol Gede -->
    <button id="fullscreenBtn" class="btn-fullscreen">FULLSCREEN!</button>

    <script>
        const btn = document.getElementById('fullscreenBtn');

        // Fungsi untuk masuk/keluar fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Gagal fullscreen: ${err.message}`);
                });
                btn.textContent = "KELUAR FULLSCREEN";
                btn.style.backgroundColor = "#2ed573";
            } else {
                document.exitFullscreen();
                btn.textContent = "FULLSCREEN!";
                btn.style.backgroundColor = "#ff4757";
            }
        }

        // Klik kiri biasa
        btn.addEventListener('click', toggleFullscreen);

        // Klik kanan langsung otomatis fullscreen tanpa muncul menu bawaan browser
        btn.addEventListener('contextmenu', function(e) {
            e.preventDefault(); // Matikan menu klik kanan bawaan browser
            toggleFullscreen();
        });
    </script>

</body>
</html>
