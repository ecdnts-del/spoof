<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Address Bar Race Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>

<button id="start">
Start Test
</button>

<p id="status">
Idle
</p>


<script>

const status =
document.getElementById("status");


const TARGET =
"https://example:9090/";


const DELAY = 300;



function info(msg){

status.innerHTML = msg;


console.log(
msg,
{
    url: location.href,
    origin: location.origin,
    time: performance.now()
});

}




document.getElementById("start")
.onclick = ()=>{


info(
"Before pushState"
);



history.pushState(
{
test:"address-race"
},
"",
"/trusted"
);



info(
"After pushState<br>"+
location.href
);




setTimeout(()=>{


info(
"Navigate start"
);



location.href =
TARGET;



}, DELAY);



};



window.addEventListener(
"pageshow",
()=>{

console.log(
"pageshow",
location.href
);

});



window.addEventListener(
"beforeunload",
()=>{

console.log(
"beforeunload",
location.href
);

});


</script>

</body>
</html>
