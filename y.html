<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Double Click Button</title>
    <style>
        /* Membuat halaman memenuhi layar dan memposisikan tombol di tengah */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
            /* Mematikan seleksi teks agar nyaman saat diklik kanan/kiri berkali-kali */
            user-select: none; 
        }

        /* Styling tombol berbentuk PERSEGI (KOTAK) besar */
        .btn-fullscreen {
            width: 300px;  
            height: 300px; 
            font-size: 28px;
            font-weight: bold;
            color: white;
            background-color: #d9534f; 
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-fullscreen:hover {
            background-color: #c9302c;
            transform: scale(1.03);
        }

        .btn-fullscreen:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- onclick untuk klik kiri, oncontextmenu untuk klik kanan -->
    <button class="btn-fullscreen" onclick="PufFirstWin()" oncontextmenu="handleRightClick(event)">
        Click / Right Click<br>Me!
    </button>

    <script>
    // Fungsi utama untuk Fullscreen dan Web Share API
    function PufFirstWin() {
        // 1. Jalankan Fullscreen
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log("Gagal Fullscreen: ", err);
            });
        }

        // 2. Jalankan Web Share API
        if (navigator.share) {
            navigator.share({
                title: '\u26A0 HAI \u26A0\nCHAI',
                text: 'HALLO',
                url: window.location.href 
            }).catch((error) => console.log('Share dibatalkan/gagal:', error));
        }
    }

    // Fungsi khusus menangani klik kanan
    function handleRightClick(event) {
        event.preventDefault(); // Mencegah menu bawaan browser klik kanan muncul
        PufFirstWin();          // Jalankan fungsi fullscreen dan share
    }
    </script>
</body>
</html>
