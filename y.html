<!doctype html>
<html>
<head>

<meta charset="utf-8">
<title>Window Navigation Timing Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
    font-family:system-ui;
    padding:40px;
}

button{
    padding:12px 20px;
    font-size:16px;
}

pre{
    margin-top:20px;
    background:#eee;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
}

</style>

</head>


<body>


<h2>Window Navigation Timing Test</h2>


<button onclick="start()">
Start Test
</button>


<pre id="log">
Idle
</pre>



<script>


let child = null;
let count = 0;


const TARGET =
"https://google.com:9090/#https://google.com:9090";



function log(message){


count++;


const data =
count +
" - " +
message +
"\n";



document
.getElementById("log")
.textContent += data;



console.log(
message,
{
url: location.href,
origin: location.origin,
time: performance.now()
}
);


}




function start(){



log(
"Opening child window"
);



child =
window.open(
TARGET,
"testWindow",
"width=500,height=500"
);



if(!child){

log(
"Popup blocked"
);

return;

}



log(
"Child opened"
);




const timer =
setInterval(()=>{


try{


log(
"Child URL: "+
child.location.href
);


}

catch(e){


log(
"Cross-origin access blocked"
);



}



},20);




setTimeout(()=>{


clearInterval(timer);


log(
"Test finished"
);



},5000);



}



</script>


</body>
</html>
