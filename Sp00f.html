<!doctype html>
<meta charset="utf-8">
<title>V8 SNAP Leak Detector</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

function vuln(a,i){ return a[i] + 1.1; }

// ===== WARMUP =====
function warmup(){
  let arr = Array.from({length:40}, (_,i)=>i+0.5);
  for(let i=0;i<80000;i++) vuln(arr, i%40);
  return arr;
}

// ===== MUTATION =====
function mutate(arr){
  delete arr[0];
  delete arr[1];
  delete arr[2];

  arr.length = 10;
  arr[70] = 13.37;

  arr[2] = {x:1};

  let c = 0;
  Object.defineProperty(arr,3,{
    get(){
      if(c++ < 3){
        arr.push(99.99 + c);
      }
      return 1.1;
    }
  });

  return arr;
}

// ===== PROXY =====
function breakAssumption(a){
  let flip = 0;
  return new Proxy(a,{
    get(t,p){
      if(p==="length" && (flip++ % 2 === 0)){
        t.push(77.77);
      }
      return Reflect.get(t,p);
    }
  });
}

// ===== TYPED ARRAY =====
let buf = new ArrayBuffer(0x2000);
let f64 = new Float64Array(buf);

// baseline kuat
for(let i=0;i<f64.length;i++){
  f64[i] = 1000 + i;
}

// ===== SNAP CHECK =====
function snapCheck(arr){

  // 🔥 OOB check
  for(let i=0;i<50;i++){
    let v = arr[arr.length + i];

    if(v !== undefined){
      log("[SNAP OOB] idx="+(arr.length+i)+" val="+v);
      return true;
    }

    if(typeof v === "number" && Math.abs(v) > 1e12){
      log("[SNAP PTR] "+v);
      return true;
    }
  }

  // 🔥 typed array corruption
  for(let i=0;i<100;i++){
    let v = f64[i];
    if(v !== 1000 + i){
      log("[SNAP CORRUPTION] idx="+i+" val="+v);
      return true;
    }
  }

  return false;
}

// ===== MAIN =====
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] fuzz start");

  for(let i=0;i<20000;i++){
    let arr = [...base];
    arr = mutate(arr);
    arr = breakAssumption(arr);

    let r = vuln(arr,10);

    if(Number.isNaN(r)){
      log("[NaN] iteration "+i);
    }

    if(snapCheck(arr)){
      log("[🔥 SNAP TRIGGERED]");
      return;
    }

    if(i % 1000 === 0) log("iter "+i);
  }

  log("[*] done (no anomaly)");
}

run();
</script>
