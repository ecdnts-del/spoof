<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open File Picker</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
        }
        button{
            padding:14px 28px;
            font-size:18px;
            cursor:pointer;
            border:none;
            border-radius:8px;
            background:#0078ff;
            color:#fff;
        }
    </style>
</head>
<body>

<button id="open">Pilih File</button>

<script>
document.getElementById("open").addEventListener("click", async () => {
    try {
        const [fileHandle] = await window.showOpenFilePicker({
            multiple: false
        });

        const file = await fileHandle.getFile();

        console.log("Nama File:", file.name);
        console.log("Ukuran:", file.size);

        // Redirect setelah memilih file
        window.location.href = "http://google.com/";

    } catch (err) {
        console.log("Dibatalkan atau error:", err);
    }
});
</script>

</body>
</html>
