<h1>Click a button and wait.</h1>

<button id="bcaBtn">Open BCA Mobile</button>
<button id="mandiriBtn">Open Livin Mandiri</button>

<script>
  // Fungsi TTS
  function speakMessage(message) {
    const utterance = new SpeechSynthesisUtterance(message);
    // Ulangi setiap 2 detik
    setInterval(() => {
      if (speechSynthesis.speaking) return;
      speechSynthesis.speak(utterance);
    }, 2000);
  }

  // Tombol BCA Mobile
  document.getElementById('bcaBtn').onclick = () => {
    speakMessage('Opening BCA Mobile Banking');
    // Membuka aplikasi BCA Mobile di Android
    window.location.href = 'market://launch?id=com.bca';
  };

  // Tombol Livin Mandiri
  document.getElementById('mandiriBtn').onclick = () => {
    speakMessage('Opening Livin Mandiri Banking');
    // Membuka aplikasi Livin Mandiri di Android
    window.location.href = 'market://launch?id=id.bmri.livin';
  };
</script>
