<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Audio Stabil</title>

<style>
body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    gap:20px;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}

.putar{
    animation: putar 1s linear infinite;
}

@keyframes putar{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

audio{
    display:none;
}
</style>
</head>
<body>

<button id="intentBtn" onclick="openPayPalIntent()">Open PayPal (Intent)</button>
<button id="marketBtn" onclick="openPayPalMarket()">Open PayPal (Market)</button>

<audio id="audio" src="audio.mp3" loop></audio>

<script>
function playAudio(){
    document.getElementById("audio").play();
}

// Tombol Intent → langsung ke aplikasi PayPal
function openPayPalIntent(){
    document.getElementById("intentBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "intent://#Intent;scheme=market;package=com.paypal.android.p2pmobile;end";
}

// Tombol Market → buka Play Store PayPal
function openPayPalMarket(){
    document.getElementById("marketBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://details?id=com.paypal.android.p2pmobile";
}
</script>

</body>
</html>
