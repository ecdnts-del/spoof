<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PNA Inconsistency Test</title>
</head>
<body style="font-family:monospace;">
<h2>PNA Inconsistency Test (Fetch vs WebSocket)</h2>
<pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
const log = (msg) => logEl.textContent += msg + "\n";

const TARGET = "127.0.0.1:3000";

// --- TEST 1: FETCH ---
async function testFetch() {
    log("=== FETCH TEST ===");
    try {
        const res = await fetch(`http://${TARGET}`, {
            mode: "cors"
        });
        log("[FETCH] SUCCESS (unexpected if PNA enforced)");
    } catch (e) {
        log("[FETCH] BLOCKED (expected PNA behavior)");
        log("Error: " + e.message);
    }
}

// --- TEST 2: WEBSOCKET ---
function testWebSocket() {
    return new Promise((resolve) => {
        log("\n=== WEBSOCKET TEST ===");

        let ws;
        try {
            ws = new WebSocket(`ws://${TARGET}`);
        } catch (e) {
            log("[WS] INIT ERROR: " + e.message);
            resolve();
            return;
        }

        let connected = false;

        ws.onopen = () => {
            connected = true;
            log("[WS] CONNECTED (POTENTIAL PNA BYPASS)");
            ws.send("ping");
            ws.close();
        };

        ws.onerror = () => {
            if (!connected) {
                log("[WS] BLOCKED (expected if protected)");
            }
        };

        ws.onclose = () => {
            log("[WS] CLOSED");
            resolve();
        };

        // timeout safety
        setTimeout(() => {
            if (!connected) {
                log("[WS] TIMEOUT (likely blocked)");
                resolve();
            }
        }, 3000);
    });
}

// --- RUN TEST ---
(async () => {
    log("Target: " + TARGET);
    log("Origin: " + location.origin);
    log("Starting tests...\n");

    await testFetch();
    await testWebSocket();

    log("\n=== RESULT ===");
    log("If FETCH = blocked AND WS = connected => INCONSISTENCY");
})();
</script>
</body>
</html>
