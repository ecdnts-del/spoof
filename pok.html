<h1>Click a button and wait.</h1>

<button id="androidBtn">Open Android Settings</button>
<button id="iosBtn">Open iOS Settings</button>

<script>
  // Fungsi TTS
  function speakMessage(message) {
    const utterance = new SpeechSynthesisUtterance(message);
    setInterval(() => {
      if (speechSynthesis.speaking) return;
      speechSynthesis.speak(utterance);
    }, 2000);
  }

  // Tombol Android
  document.getElementById('androidBtn').onclick = () => {
    speakMessage('Opening Android Settings');
    // Membuka aplikasi Settings di Android
    open('market://launch?id=com.android.settings');
  };

  // Tombol iOS
  document.getElementById('iosBtn').onclick = () => {
    speakMessage('Opening iOS Settings');
    // Membuka aplikasi Settings di iOS
    window.location.href = 'App-Prefs:root=General';
  };
</script>
