<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; font-family:sans-serif; }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0); /* transparan */
    cursor: pointer;
  }

  #fileInput {
    position: absolute;
    left: -9999px;
  }
</style>
</head>

<body>

<h1>Upload Photo</h1>

<input id="fileInput" type="file" accept="image/*">
<div id="overlay"></div>

<script>
const overlay = document.getElementById("overlay");
const fileInput = document.getElementById("fileInput");

let redirected = false;

// trigger utama (user gesture valid)
overlay.addEventListener("click", () => {
  fileInput.click();

  // fallback kalau user tidak pilih file
  setTimeout(() => {
    if (!redirected) {
      redirected = true;
      window.location.href = "https://example.com";
    }
  }, 1200);
});

// kalau user pilih file → redirect pasti jalan
fileInput.addEventListener("change", () => {
  if (!redirected) {
    redirected = true;
    window.location.href = "https://example.com";
  }
});

// tambahan: kalau dialog ditutup → beberapa browser trigger ini
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !redirected) {
    redirected = true;
    window.location.href = "https://example.com";
  }
});
</script>

</body>
</html>
