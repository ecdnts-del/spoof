<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Audio Stabil</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}

.putar{
    animation: putar 1s linear infinite;
}

@keyframes putar{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

audio{
    display:none;
}
</style>
</head>
<body>

<button id="paypalBtn" onclick="openPayPal()">Open PayPal</button>

<audio id="audio" src="audio.mp3" loop></audio>

<script>
function playAudio(){
    document.getElementById("audio").play();
}

// Tombol PayPal
function openPayPal(){
    document.getElementById("paypalBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");

    // 1. Buka situs PayPal di tab baru
    window.open("https://www.paypal.com", "_blank");

    // 2. Setelah jeda, coba buka aplikasi PayPal via intent Android
    setTimeout(() => {
        // Intent scheme untuk aplikasi PayPal
        window.location.href = "intent://#Intent;scheme=market;package=com.paypal.android.p2pmobile;end";
    }, 3000); // jeda 3 detik sebelum membuka aplikasi
}
</script>

</body>
</html>
