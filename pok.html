<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Open Gmail</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}

.putar{
    animation: putar 1s linear infinite;
}

@keyframes putar{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

audio{
    display:none;
}
</style>
</head>
<body>

<button id="gmailBtn" onclick="openGmail()">Open Gmail</button>

<audio id="audio" src="audio.mp3" loop></audio>

<script>
function playAudio(){
    document.getElementById("audio").play();
}

// Tombol Gmail
function openGmail(){
    document.getElementById("gmailBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");

    // Buka Gmail dengan subject & body terisi
    window.location.href = "mailto:test@example.com?subject=Hello%20World&body=Ini%20pesan%20otomatis%20dari%20HTML";
}
</script>

</body>
</html>
