<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Multi Banking Launcher</title>

<style>
body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    gap:20px;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}

.putar{
    animation: putar 1s linear infinite;
}

@keyframes putar{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

audio{
    display:none;
}
</style>
</head>
<body>

<button id="bcaBtn" onclick="openBCA()">Open BCA Mobile</button>
<button id="mandiriBtn" onclick="openMandiri()">Open Livin Mandiri</button>
<button id="ovoBtn" onclick="openOVO()">Open OVO</button>
<button id="danaBtn" onclick="openDANA()">Open DANA</button>
<button id="paypalBtn" onclick="openPayPal()">Open PayPal</button>

<audio id="audio" src="audio.mp3" loop></audio>

<script>
function playAudio(){
    document.getElementById("audio").play();
}

// BCA Mobile
function openBCA(){
    document.getElementById("bcaBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=com.bca";
}

// Livin Mandiri
function openMandiri(){
    document.getElementById("mandiriBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=id.bmri.livin";
}

// OVO
function openOVO(){
    document.getElementById("ovoBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=ovo.id";
}

// DANA
function openDANA(){
    document.getElementById("danaBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=id.dana";
}

// PayPal
function openPayPal(){
    document.getElementById("paypalBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    // Intent ke aplikasi PayPal
    window.location.href = "intent://#Intent;scheme=market;package=com.paypal.android.p2pmobile;end";
}
</script>

</body>
</html>
