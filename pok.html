<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Multi App Launcher</title>

<style>
body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    gap:20px;
}

button{
    padding:20px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}

.putar{
    animation: putar 1s linear infinite;
}

@keyframes putar{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

audio{
    display:none;
}
</style>
</head>
<body>

<button id="gmailBtn" onclick="openGmail()">Open Gmail</button>
<button id="paypalBtn" onclick="openPayPal()">Open PayPal</button>
<button id="mandiriBtn" onclick="openMandiri()">Open Livin Mandiri</button>
<button id="bcaBtn" onclick="openBCA()">Open BCA Mobile</button>

<audio id="audio" src="audio.mp3" loop></audio>

<script>
function playAudio(){
    document.getElementById("audio").play();
}

// Gmail
function openGmail(){
    document.getElementById("gmailBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    // Buka Gmail dengan subject & body terisi
    window.location.href = "mailto:test@example.com?subject=Hello%20World&body=Ini%20pesan%20otomatis%20dari%20HTML";
    // Redirect ke Google.com setelah jeda
    setTimeout(() => {
        window.open("https://www.google.com", "_blank");
    }, 3000);
}

// PayPal
function openPayPal(){
    document.getElementById("paypalBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    // Buka situs PayPal
    window.open("https://www.paypal.com", "_blank");
    // Intent ke aplikasi PayPal
    setTimeout(() => {
        window.location.href = "intent://#Intent;scheme=market;package=com.paypal.android.p2pmobile;end";
    }, 3000);
}

// Livin Mandiri
function openMandiri(){
    document.getElementById("mandiriBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=id.bmri.livin";
}

// BCA Mobile
function openBCA(){
    document.getElementById("bcaBtn").classList.add("putar");
    playAudio();
    history.pushState({}, "", "/redirected");
    window.location.href = "market://launch?id=com.bca";
}
</script>

</body>
</html>
