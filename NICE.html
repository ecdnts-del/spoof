<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>App Switch / Resume – NON‑Fullscreen PoC</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;text-align:center;">

<h2>App Switch / Resume – NON‑Fullscreen PoC</h2>
<button id="start" style="font-size:20px;padding:12px 24px;">Start</button>

<pre id="log" style="margin:20px auto;width:90%;max-width:900px;background:#000;padding:16px;border-radius:8px;text-align:left;white-space:pre-wrap;"></pre>

<script>
const logEl = document.getElementById('log');
const log = m => { console.log(m); logEl.textContent += m + '\n'; };

function state(tag) {
  log(`[${tag}] hasBeenActive=${navigator.userActivation.hasBeenActive}, isActive=${navigator.userActivation.isActive}`);
}

async function probe(tag) {
  log(`\n[PROBE] ${tag}`);
  try {
    await navigator.clipboard.writeText('POC_TEST');
    log('❌ clipboard.writeText SUCCESS (BUG if no gesture)');
  } catch (e) {
    log('✔ clipboard.writeText blocked');
  }
}

// ---- lifecycle listeners ----
window.addEventListener('focus', () => {
  state('After resume (focus)');
  probe('after focus');
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    state('After resume (visibility)');
    probe('after visibility resume');
  }
});

// ---- start ----
document.getElementById('start').onclick = () => {
  state('After start click');
  log('NOW: App switch to another app, then return. DO NOT click page.');
};

log('Steps:');
log('1. Click Start');
log('2. App switch (Alt+Tab / Recent Apps)');
log('3. Return to Chrome');
log('4. Do NOT click the page');
</script>

</body>
</html>
