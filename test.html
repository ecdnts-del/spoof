
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome File Picker Attribution Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f9fa;
  color: #202124;
  padding: 24px;
  text-align: center;
}
button {
  padding: 14px 20px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}
#log {
  margin-top: 20px;
  padding: 14px;
  background: white;
  border: 1px solid #dadce0;
  border-radius: 8px;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}
</style>
</head>
<body>

<h2>File Picker Origin Attribution Test</h2>
<p>Diagnostic test for Chrome Android</p>

<button id="picker">Open File Picker</button>
<button id="snapshot">Capture Window State</button>
<button id="clear">Clear Log</button>

<div id="log">Waiting for test...</div>

<script>
const logBox = document.getElementById("log");

function record(event, extra = {}) {
  const entry = {
    timestamp: new Date().toISOString(),
    event,
    origin: location.origin,
    href: location.href,
    visibility: document.visibilityState,
    focused: document.hasFocus(),
    windowName: window.name,
    userAgent: navigator.userAgent,
    ...extra
  };

  logBox.textContent +=
    "\n" + JSON.stringify(entry, null, 2);
}

record("PAGE_INITIALIZED");

document.addEventListener("visibilitychange", () => {
  record("VISIBILITY_CHANGED");
});

window.addEventListener("focus", () => {
  record("WINDOW_FOCUS");
});

window.addEventListener("blur", () => {
  record("WINDOW_BLUR");
});

window.addEventListener("pageshow", event => {
  record("PAGE_SHOW", {
    persisted: event.persisted
  });
});

window.addEventListener("pagehide", event => {
  record("PAGE_HIDE", {
    persisted: event.persisted
  });
});

document.getElementById("snapshot")
.addEventListener("click", () => {
  record("MANUAL_WINDOW_SNAPSHOT");
});

document.getElementById("picker")
.addEventListener("click", async () => {
  record("FILE_PICKER_REQUEST");

  if (!window.showOpenFilePicker) {
    record("API_UNAVAILABLE");
    return;
  }

  try {
    const handles = await window.showOpenFilePicker({
      multiple: false,
      types: [{
        description: "Test images",
        accept: {
          "image/*": [".png", ".jpg", ".jpeg"]
        }
      }]
    });

    record("FILE_PICKER_RESOLVED", {
      selectedCount: handles.length
    });

    // Do not read file contents.
  } catch (error) {
    record("FILE_PICKER_REJECTED", {
      errorName: error.name,
      errorMessage: error.message
    });
  }
});

document.getElementById("clear")
.addEventListener("click", () => {
  logBox.textContent = "";
  record("LOG_RESET");
});
</script>

</body>
</html>
