<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker & Protocol Spoof PoC</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --border-color: #dadce0;
            --muted-color: #5f6368;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .banner {
            font-size: 12px;
            color: var(--muted-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 24px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .spoof-link {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.2);
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
        }

        .spoof-link:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .preview-container {
            margin-top: 25px;
            max-width: 280px;
            display: none;
        }

        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: var(--muted-color);
            word-break: break-all;
            padding: 0 10px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Document Verification</h1>

    <!-- Container dengan 4 Tombol Interaksi Terpisah -->
    <div class="button-container">
        <button class="spoof-link" id="targetLinkMailto" data-action="mailto" data-intent="identity_verification">Open Window & Email ID Verification</button>
        <button class="spoof-link" id="targetLinkTel" data-action="tel" data-intent="account_recovery">Open Window & Call Recovery Support</button>
        <button class="spoof-link" id="targetLinkFile" data-action="filepicker" data-intent="document_upload">Open Window & Upload Document</button>
        <button class="spoof-link" id="targetLinkShare" data-action="webshare" data-intent="system_share">Open Window & Trigger Web Share</button>
    </div>

    <!-- Area Pratinjau / Informasi Status -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let isProcessing = false;

        const executeAction = async (actionType, intent) => {
            if (isProcessing) return;
            isProcessing = true;

            const previewBox = document.getElementById("previewBox");
            const imagePreview = document.getElementById("imagePreview");
            const fileInfo = document.getElementById("fileInfo");

            // Jeda waktu optimal untuk simulasi UX/animasi transisi jendela
            setTimeout(async () => {
                try {
                    imagePreview.src = "";
                    previewBox.style.display = "block";

                    switch (actionType) {
                        case 'mailto': {
                            const subject = encodeURIComponent("Security Verification - Intent: " + intent);
                            const body = encodeURIComponent("Hello Google Security,\n\nI am requesting verification for intent: " + intent + "\nPlease process my request securely.");
                            window.location.href = `mailto:support@google.com?subject=${subject}&body=${body}`;
                            fileInfo.innerText = `[Success] Mailto protocol triggered for: ${intent}`;
                            break;
                        }
                        case 'tel': {
                            window.location.href = "tel:+18005550199";
                            fileInfo.innerText = `[Success] Tel protocol triggered for: ${intent}`;
                            break;
                        }
                        case 'filepicker': {
                            if (!window.showOpenFilePicker) {
                                throw new Error("File System Access API not supported in this browser.");
                            }
                            const [fileHandle] = await window.showOpenFilePicker({
                                multiple: false,
                                types: [{
                                    description: 'Images & Documents',
                                    accept: { 
                                        'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                        'application/pdf': ['.pdf']
                                    }
                                }]
                            });

                            const file = await fileHandle.getFile();
                            fileInfo.innerText = `Selected file [${intent}]: ${file.name}`;

                            if (file.type && file.type.startsWith('image/')) {
                                imagePreview.src = URL.createObjectURL(file);
                            }
                            break;
                        }
                        case 'webshare': {
                            if (navigator.share) {
                                await navigator.share({
                                    title: 'Google Security Verification',
                                    text: `Secure verification token requested for intent: ${intent}`,
                                    url: window.location.href
                                });
                                fileInfo.innerText = `[Success] Web Share executed for: ${intent}`;
                            } else {
                                fileInfo.innerText = `[Notice] Web Share API is not available here.`;
                            }
                            break;
                        }
                        default:
                            throw new Error("Unknown action type.");
                    }
                } catch (err) {
                    console.debug("Action execution cancelled or blocked:", err.message);
                    fileInfo.innerText = `Action cancelled or restricted by browser policy.`;
                } finally {
                    // Reset status kunci proses setelah jeda singkat
                    setTimeout(() => {
                        isProcessing = false;
                    }, 800);
                }
            }, 1200);
        };

        // Menggunakan elemen <button> standar agar mendukung event handler dengan bersih dan konsisten
        document.querySelectorAll('.spoof-link').forEach(btn => {
            const action = btn.getAttribute('data-action');
            const intent = btn.getAttribute('data-intent');

            btn.addEventListener("click", (e) => {
                e.preventDefault();
                executeAction(action, intent);
            });

            btn.addEventListener("touchstart", (e) => {
                // Biarkan event sentuh berjalan optimal tanpa intervensi pasif berlebih
            }, { passive: true });
        });
    </script>

</body>
</html>
