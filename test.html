<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Navigation History UXSS Chaining PoC (Google Target)</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #0d1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #c9d1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        text-align: center;
        max-width: 520px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      h2 {
        margin-top: 0;
        font-size: 16px;
        color: #58a6ff;
        font-family: monospace;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 15px;
        font-weight: 600;
        background: #1f6feb;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(31, 111, 235, 0.4);
        transition: background 0.2s, transform 0.1s;
      }
      button:hover { background: #388bfd; }
      button:active { transform: scale(0.98); }
      .console-log {
        margin-top: 20px;
        background: #090d16;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 12px;
        font-family: monospace;
        font-size: 12px;
        color: #3fb950;
        text-align: left;
        max-height: 150px;
        overflow-y: auto;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>HISTORY CHAINING & GOOGLE TARGET SIMULATOR</h2>
      <button id="execBtn">TRIGGER HISTORY-CHAINED UXSS</button>
      <div class="console-log" id="consoleLog">
        [READY] Navigation history hooking harness initialized...
      </div>
    </div>

    <script>
      const execBtn = document.getElementById("execBtn");
      const consoleLog = document.getElementById("consoleLog");

      function appendLog(msg) {
        let timeStr = new Date().toISOString().split("T")[1].slice(0, 8);
        consoleLog.innerHTML += `<br>[${timeStr}] ${msg}`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
      }

      async function executeHistoryChaining() {
        execBtn.style.display = "none";
        appendLog("Initializing navigation history injection matrix...");

        try {
          // 1. Target Origin Utama
          let targetOrigin = "https://www.google.com";
          appendLog(`Target Origin Context: ${targetOrigin}`);
          await new Promise(r => setTimeout(r, 200));

          // 2. Manipulasi Navigation History (History Chaining Spoofing)
          // Menggunakan pushState untuk mengubah representasi riwayat riil browser
          let manipulatedPath = "/search?q=uxss-history-chain-vector";
          history.pushState({ target: targetOrigin }, "", manipulatedPath);
          appendLog(`History state pushed: ${window.location.href}`);
          await new Promise(r => setTimeout(r, 200));

          // 3. Simulasi Evaluasi State Asal dan Eksekusi Popup Alert
          appendLog("[SUCCESS] Navigation state synchronized. Triggering cross-origin alert context.");
          
          setTimeout(() => {
            alert(
              "[UXSS HISTORY CHAIN ALERT]\n\n" +
              "Target Target Origin: " + targetOrigin + "\n" +
              "Manipulated URL Path: " + window.location.href + "\n" +
              "Document Domain: " + document.domain
            );
            execBtn.style.display = "block";
          }, 200);

        } catch (err) {
          appendLog(`[ERROR] Chain execution failed: ${err.message}`);
          execBtn.style.display = "block";
        }
      }

      execBtn.onclick = () => {
        executeHistoryChaining();
      };
    </script>
  </body>
</html>
