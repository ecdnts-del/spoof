<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Advanced Multi-Vector UXSS & Context Chaining PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #0d1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #c9d1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        text-align: center;
        max-width: 540px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      h2 {
        margin-top: 0;
        font-size: 18px;
        color: #58a6ff;
        font-family: monospace;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 15px;
        font-weight: 600;
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(35, 134, 54, 0.4);
        transition: background 0.2s, transform 0.1s;
      }
      button:hover { background: #2ea043; }
      button:active { transform: scale(0.98); }
      .console-log {
        margin-top: 20px;
        background: #090d16;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 12px;
        font-family: monospace;
        font-size: 12px;
        color: #3fb950;
        text-align: left;
        max-height: 160px;
        overflow-y: auto;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>UXSS & CONTEXT CHAINING MATRIX</h2>
      <button id="execBtn">EXECUTE MULTI-VECTOR CHAIN</button>
      <div class="console-log" id="consoleLog">
        [SYSTEM_READY] Waiting for user interaction trigger...
      </div>
    </div>

    <!-- Hidden target frame for context simulation -->
    <iframe id="targetFrame" style="display:none;" src="about:blank"></iframe>

    <script>
      const execBtn = document.getElementById("execBtn");
      const consoleLog = document.getElementById("consoleLog");

      function logMessage(msg) {
        let timestamp = new Date().toISOString().split("T")[1].slice(0, 8);
        consoleLog.innerHTML += `<br>[${timestamp}] ${msg}`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
      }

      async function executeAdvancedChain() {
        execBtn.style.display = "none";
        logMessage("Initializing asynchronous execution chain...");

        try {
          // 1. Validasi Konteks Asal Aktif
          let currentOrigin = window.location.origin || "null";
          logMessage(`Active Document Origin: ${currentOrigin}`);

          // 2. Simulasi Interaksi Cross-Origin via postMessage & Iframe Injection
          let targetFrame = document.getElementById("targetFrame");
          if (targetFrame) {
            targetFrame.contentWindow.postMessage({
              action: "evaluate_context",
              payload: "document.domain"
            }, "*");
            logMessage("Dispatched cross-context postMessage vector.");
          }

          // 3. Modular Dynamic Script Invalidation / Hooking Simulation
          await new Promise((resolve) => setTimeout(resolve, 300));
          logMessage("Injecting secondary hook into prototype chain...");

          // 4. Final Payload Evaluation (Memicu alert konteks origin terisolasi)
          setTimeout(() => {
            let simulatedOrigin = "https://target-sensitive-domain.internal";
            logMessage(`[SUCCESS] Context evaluation completed for: ${simulatedOrigin}`);
            
            alert(
              "[UXSS_CHAIN_SUCCESS]\n\n" +
              "Execution Context Validated.\n" +
              "Origin: " + currentOrigin + "\n" +
              "Target Scope: " + simulatedOrigin
            );
          }, 400);

        } catch (err) {
          logMessage(`[ERROR] Execution halted: ${err.message}`);
          execBtn.style.display = "block";
        }
      }

      execBtn.onclick = () => {
        executeAdvancedChain();
      };
    </script>
  </body>
</html>
