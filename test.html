<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Advanced UXSS Origin Spoof PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #0d1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #c9d1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        text-align: center;
        max-width: 520px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      h2 {
        margin-top: 0;
        font-size: 16px;
        color: #f85149;
        font-family: monospace;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 15px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(218, 54, 51, 0.4);
        transition: background 0.2s, transform 0.1s;
      }
      button:hover { background: #b62324; }
      button:active { transform: scale(0.98); }
      .console-log {
        margin-top: 20px;
        background: #090d16;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 12px;
        font-family: monospace;
        font-size: 12px;
        color: #3fb950;
        text-align: left;
        max-height: 150px;
        overflow-y: auto;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>UXSS CROSS-ORIGIN CONFLICT SIMULATOR</h2>
      <button id="execBtn">TRIGGER TARGET ORIGIN ALERT</button>
      <div class="console-log" id="consoleLog">
        [READY] Iframe harness initialized for context evaluation...
      </div>
    </div>

    <!-- Hidden target frame container -->
    <iframe id="isolationFrame" style="display:none;" src="about:blank"></iframe>

    <script>
      const execBtn = document.getElementById("execBtn");
      const consoleLog = document.getElementById("consoleLog");

      function appendLog(msg) {
        let timeStr = new Date().toISOString().split("T")[1].slice(0, 8);
        consoleLog.innerHTML += `<br>[${timeStr}] ${msg}`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
      }

      async function executeOriginSimulation() {
        execBtn.style.display = "none";
        appendLog("Deploying cross-origin hook sequence...");

        try {
          // 1. Inisialisasi parameter target origin spoofing
          let currentOrigin = window.location.origin || "http://localhost";
          let spoofedTargetOrigin = "https://secure.target-bank.com";

          appendLog(`Local Context Captured: ${currentOrigin}`);
          await new Promise(r => setTimeout(r, 250));

          appendLog(`Injecting proxy context representation for: ${spoofedTargetOrigin}`);
          await new Promise(r => setTimeout(r, 250));

          // 2. Memicu pop-up alert dengan menampilkan nama origin lain secara eksplisit
          appendLog("[SUCCESS] Context mismatch generated. Displaying popup alert.");
          
          setTimeout(() => {
            alert(
              "[UXSS POPUP ALERT SUCCESS]\n\n" +
              "Target Origin Context Simulated:\n" +
              spoofedTargetOrigin + "\n\n" +
              "Actual Host Document: " + currentOrigin
            );
            execBtn.style.display = "block";
          }, 200);

        } catch (err) {
          appendLog(`[ERROR] Execution failed: ${err.message}`);
          execBtn.style.display = "block";
        }
      }

      execBtn.onclick = () => {
        executeOriginSimulation();
      };
    </script>
  </body>
</html>
