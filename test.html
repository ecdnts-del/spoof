<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Interface Assessment</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --bg-color: #f3f4f6;
            --text-color: #202124;
            --border-color: #dadce0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            text-align: center;
        }

        .captcha-text {
            color: #4b5563;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.2);
            transition: background-color 0.2s;
        }

        .action-btn:active {
            background-color: #1557b0;
        }

        .status-log {
            margin-top: 16px;
            font-size: 12px;
            color: #5f6368;
            text-align: left;
            background: #f1f3f4;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="main-container" id="container">
        <div class="captcha-text">
            Verify session context to proceed with authentication.
        </div>

        <button class="action-btn" id="verifyBtn">Initialize Secure Context</button>
        
        <div class="status-log" id="logBox">Status: Ready for evaluation...</div>
    </div>

    <script>
        const logBox = document.getElementById("logBox");
        function log(msg) {
            logBox.textContent += "\n> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById("verifyBtn").addEventListener("click", () => {
            log("Triggering verification flow...");

            // Simulasi penundaan asinkron rendering komponen UI
            setTimeout(() => {
                log("Switching view state to credential interface...");
                document.getElementById("container").innerHTML = `
                    <div style="text-align: left;">
                        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" width="85" style="margin-bottom: 16px;">
                        <h2 style="font-size: 22px; font-weight: normal; margin: 0 0 8px 0;">Sign in</h2>
                        <p style="font-size: 14px; color: #5f6368; margin: 0 0 24px 0;">Use your Google Account</p>
                        
                        <input type="email" placeholder="Email or phone" style="width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; margin-bottom: 14px; font-size: 14px;">
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                            <a href="#" style="color: #1a73e8; font-size: 14px; text-decoration: none; font-weight: 500;">Create account</a>
                            <button onclick="alert('Action captured in test environment.')" style="background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; font-size: 14px; cursor: pointer;">Next</button>
                        </div>
                    </div>
                `;
            }, 2000);
        });
    </script>
</body>
</html>
